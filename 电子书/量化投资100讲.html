、恢复和人工覆盖流程可审计<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>再平衡恢复目标风险并产生逆向交易。<\/li>\n<li>容忍带和现金流法可减少换手率。<\/li>\n<li>趋势、成本和目标失效会削弱再平衡。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为 60/40 组合设计 5 个百分点容忍带，模拟股票涨跌后需要交易的金额。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第080讲 马科维茨的创举：均值-方差模型与有效前沿<\/strong>。<\/p>"}]}, {"no": 8, "name": "资产配置与组合优化", "desc": "系统讲解如何科学地在大类资产之间分配资金，理解现代组合理论的核心思想与实操。", "chapters": [{"n": 80, "title": "马科维茨的创举：均值-方差模型与有效前沿", "html": "<h1>第080讲 马科维茨的创举：均值-方差模型与有效前沿<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。组合模型依赖估计与约束，不能消除亏损。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解均值—方差模型的目标与约束。<\/li>\n<li>区分可行域、最小方差前沿和有效前沿。<\/li>\n<li>认识最优权重对输入的依赖。<\/li>\n<\/ul>\n<h2>马科维茨的关键变化<\/h2>\n<p>单看资产风险无法判断组合风险，因为资产之间会共同变化。均值—方差模型把预期收益向量 (\\mu)、协方差矩阵 (\\Sigma) 和权重 (w) 放进同一框架：<\/p>\n<p>[\nE[R_p]=w'\\mu,\\qquad \\sigma_p^2=w'\\Sigma w\n]<\/p>\n<h2>可行域与前沿<\/h2>\n<p>所有满足权重约束的组合形成可行域。给定目标收益时风险最低的组合构成最小方差前沿，其中高收益一侧称有效前沿；全局最小方差组合位于风险最小点。<\/p>\n<h2>优化形式<\/h2>\n<p>可最小化 (w'\\Sigma w)，同时要求权重和为 1、收益达到目标，并加入不做空、单资产上限和换手率等现实约束。另一形式是最大化预期收益减去风险厌恶乘方差。<\/p>\n<h2>资本市场线<\/h2>\n<p>在可借贷的无风险资产和切点风险组合的理想假设下，可以形成资本市场线。现实中借贷利率、杠杆和约束并不对称，因此它主要提供理论直觉。<\/p>\n<h2>使用边界<\/h2>\n<p>模型输出是“给定输入与约束下”的最优，不是客观真理。预期收益估计误差、协方差变化和交易成本都会让实际组合偏离。<\/p>\n<h2>配置实验：估计误差也是风险<\/h2>\n<p>把“马科维茨的创举：均值-方差模型与有效前沿”放进一个完整配置实验。优化器给出的权重只是输入假设、约束和目标函数的结果，必须检查其对估计误差和现实交易条件是否稳健。<\/p>\n<ol>\n<li>明确资产池、基准、再平衡频率、目标函数和全部约束。<\/li>\n<li>记录收益、波动率与相关性的估计窗口和方法，并做扰动测试。<\/li>\n<li>比较等权、简单风险预算等基线，判断复杂模型是否提供稳定增量。<\/li>\n<li>加入换手、交易成本、最小交易单位、容量和再平衡偏离区间。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>把预测均值当成精确输入；微小估计变化可能导致极端权重。<\/li>\n<li>只看静态有效前沿；真实组合还要经历再平衡成本和相关性突变。<\/li>\n<li>复杂模型不与简单基线比较；增加的参数可能只是在拟合历史噪声。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>输入估计方法和约束均可复现<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>完成参数与相关性扰动测试<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>与至少一个简单基线做成本后比较<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>权重集中度、换手和极端情景符合风险预算<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>均值—方差模型把收益、风险和相关性统一进组合优化。<\/li>\n<li>有效前沿表示同风险下收益更高或同收益下风险更低。<\/li>\n<li>最优权重强烈依赖输入与约束。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>用三资产的预期收益和协方差计算多个权重组合，画出可行域并标出最小方差点。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第081讲 马科维茨模型的致命伤：垃圾进，垃圾出<\/strong>。<\/p>"}, {"n": 81, "title": "马科维茨模型的致命伤：垃圾进，垃圾出", "html": "<h1>第081讲 马科维茨模型的致命伤：垃圾进，垃圾出<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。组合模型依赖估计与约束，不能消除亏损。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解优化器为何放大输入误差。<\/li>\n<li>掌握收缩、约束和重采样思路。<\/li>\n<li>把稳定性置于样本内最优之前。<\/li>\n<\/ul>\n<h2>误差放大器<\/h2>\n<p>预期收益本就难估，优化器却会把很小的均值差解释为大权重差，把资金推向估计最乐观的资产并远离最悲观者。结果常出现极端集中与频繁翻转。<\/p>\n<h2>协方差也不稳定<\/h2>\n<p>资产数量接近或超过样本长度时，样本协方差噪声大、可能近似奇异。求逆会放大误差，优化权重因此剧烈变化。<\/p>\n<h2>三类改进<\/h2>\n<ul>\n<li><strong>收缩估计<\/strong>：把样本均值或协方差向稳定目标靠拢，牺牲部分拟合换取较小估计误差。<\/li>\n<li><strong>现实约束<\/strong>：设置权重上下限、行业和换手率约束，减少极端解。<\/li>\n<li><strong>重采样与稳健优化<\/strong>：对输入不确定性生成多个情景，选择在多种估计下都可接受的组合。<\/li>\n<\/ul>\n<h2>简单基线<\/h2>\n<p>等权、逆波动和全局最小方差是重要对照。复杂模型若不能在滚动样本外和成本后超过基线，就不值得承担额外估计风险。<\/p>\n<h2>判断稳健<\/h2>\n<p>观察输入轻微变化、窗口移动和数据修订后权重是否稳定；报告权重分布而非只给一次结果。<\/p>\n<h2>配置实验：估计误差也是风险<\/h2>\n<p>把“马科维茨模型的致命伤：垃圾进，垃圾出”放进一个完整配置实验。优化器给出的权重只是输入假设、约束和目标函数的结果，必须检查其对估计误差和现实交易条件是否稳健。<\/p>\n<ol>\n<li>明确资产池、基准、再平衡频率、目标函数和全部约束。<\/li>\n<li>记录收益、波动率与相关性的估计窗口和方法，并做扰动测试。<\/li>\n<li>比较等权、简单风险预算等基线，判断复杂模型是否提供稳定增量。<\/li>\n<li>加入换手、交易成本、最小交易单位、容量和再平衡偏离区间。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>把预测均值当成精确输入；微小估计变化可能导致极端权重。<\/li>\n<li>只看静态有效前沿；真实组合还要经历再平衡成本和相关性突变。<\/li>\n<li>复杂模型不与简单基线比较；增加的参数可能只是在拟合历史噪声。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>输入估计方法和约束均可复现<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>完成参数与相关性扰动测试<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>与至少一个简单基线做成本后比较<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>权重集中度、换手和极端情景符合风险预算<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>均值—方差权重会放大预期收益与协方差误差。<\/li>\n<li>收缩与约束通过引入偏差换取更低方差。<\/li>\n<li>简单基线和权重稳定性是必要检验。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>给某资产预期收益增加 0.5 个百分点，观察无约束与有上限优化的权重变化。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第082讲 Black-Litterman模型（上）：告别极端配置<\/strong>。<\/p>"}, {"n": 82, "title": "Black-Litterman模型（上）：告别极端配置", "html": "<h1>第082讲 Black-Litterman模型（上）：告别极端配置<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。组合模型依赖估计与约束，不能消除亏损。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解市场均衡隐含收益作为先验。<\/li>\n<li>掌握观点矩阵、方向与置信度直觉。<\/li>\n<li>解释 Black–Litterman 如何缓解极端权重。<\/li>\n<\/ul>\n<h2>从市场组合出发<\/h2>\n<p>Black–Litterman 不从噪声很大的历史均值直接起步，而从市场权重和风险模型反推一组均衡隐含收益：<\/p>\n<p>[\n\\pi=\\delta\\Sigma w_{mkt}\n]<\/p>\n<p>其中 (\\delta) 是风险厌恶参数。(\\pi) 是与市场配置相容的先验，不代表市场永远正确。<\/p>\n<h2>表达观点<\/h2>\n<p>观点写成 (P\\mu=Q)。(P) 指定涉及哪些资产，(Q) 表示绝对或相对观点。例如“股票预期收益比债券高 2%”是相对观点。<\/p>\n<h2>置信度<\/h2>\n<p>观点不确定性由 (\\Omega) 描述。置信越高，后验越接近观点；置信越低，越靠近市场先验。(\\tau) 则控制先验均值的不确定尺度。<\/p>\n<h2>为什么更稳定<\/h2>\n<p>历史均值优化从零开始猜每项收益，BL 则让观点只在市场基准上做有限偏离。弱观点不会轻易把某资产推到 100% 权重。<\/p>\n<h2>真正难点<\/h2>\n<p>不是矩阵运算，而是把投资观点转换成一致单位、相对关系和可解释置信度。错误自信仍会产生错误组合。<\/p>\n<h2>配置实验：估计误差也是风险<\/h2>\n<p>把“Black-Litterman模型（上）：告别极端配置”放进一个完整配置实验。优化器给出的权重只是输入假设、约束和目标函数的结果，必须检查其对估计误差和现实交易条件是否稳健。<\/p>\n<ol>\n<li>明确资产池、基准、再平衡频率、目标函数和全部约束。<\/li>\n<li>记录收益、波动率与相关性的估计窗口和方法，并做扰动测试。<\/li>\n<li>比较等权、简单风险预算等基线，判断复杂模型是否提供稳定增量。<\/li>\n<li>加入换手、交易成本、最小交易单位、容量和再平衡偏离区间。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>把预测均值当成精确输入；微小估计变化可能导致极端权重。<\/li>\n<li>只看静态有效前沿；真实组合还要经历再平衡成本和相关性突变。<\/li>\n<li>复杂模型不与简单基线比较；增加的参数可能只是在拟合历史噪声。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>输入估计方法和约束均可复现<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>完成参数与相关性扰动测试<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>与至少一个简单基线做成本后比较<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>权重集中度、换手和极端情景符合风险预算<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>BL 以市场均衡隐含收益作为先验。<\/li>\n<li>观点通过 P、Q 和不确定性进入模型。<\/li>\n<li>贝叶斯式收缩让弱观点只做有限偏离。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>用三资产写一个绝对观点和一个相对观点，构造对应 P 与 Q。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第083讲 Black-Litterman模型（下）：从观点到新权重<\/strong>。<\/p>"}, {"n": 83, "title": "Black-Litterman模型（下）：从观点到新权重", "html": "<h1>第083讲 Black-Litterman模型（下）：从观点到新权重<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。组合模型依赖估计与约束，不能消除亏损。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解后验预期收益的加权更新。<\/li>\n<li>把后验输入带约束的优化器。<\/li>\n<li>完成一个小型手算流程。<\/li>\n<\/ul>\n<h2>后验公式的直觉<\/h2>\n<p>BL 后验均值是市场先验与投资观点按各自不确定性加权后的结果。常见形式可写为：<\/p>\n<p>[\n\\mu_{BL}=\\left[(\\tau\\Sigma)^{-1}+P'\\Omega^{-1}P\\right]^{-1}\n\\left[(\\tau\\Sigma)^{-1}\\pi+P'\\Omega^{-1}Q\\right]\n]<\/p>\n<p>看似复杂，核心只是“更可靠的信息权重更高”。<\/p>\n<h2>简化例子<\/h2>\n<p>假设市场组合为股票 60%、债券 40%。模型从该权重反推先验；研究者认为股票相对债券多 1%，但信心中等。后验会把股票预期收益向上调整，却不会完全采用 1% 观点。<\/p>\n<h2>从收益到权重<\/h2>\n<p>将 (\\mu_{BL}) 与协方差输入均值—方差优化器，再加入不做空、单资产上限和换手率约束。BL 改善的是预期收益输入，不会自动解决协方差和成本。<\/p>\n<h2>置信度敏感性<\/h2>\n<p>用低、中、高三档 (\\Omega) 计算后验和权重，观察观点影响。若轻微置信变化导致权重跳跃，仍需加强约束或缩小观点幅度。<\/p>\n<h2>评估<\/h2>\n<p>用滚动时点生成观点，保留当时数据，比较市场基准、直接优化和 BL 在样本外的权重、换手率和风险。<\/p>\n<h2>配置实验：估计误差也是风险<\/h2>\n<p>把“Black-Litterman模型（下）：从观点到新权重”放进一个完整配置实验。优化器给出的权重只是输入假设、约束和目标函数的结果，必须检查其对估计误差和现实交易条件是否稳健。<\/p>\n<ol>\n<li>明确资产池、基准、再平衡频率、目标函数和全部约束。<\/li>\n<li>记录收益、波动率与相关性的估计窗口和方法，并做扰动测试。<\/li>\n<li>比较等权、简单风险预算等基线，判断复杂模型是否提供稳定增量。<\/li>\n<li>加入换手、交易成本、最小交易单位、容量和再平衡偏离区间。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>把预测均值当成精确输入；微小估计变化可能导致极端权重。<\/li>\n<li>只看静态有效前沿；真实组合还要经历再平衡成本和相关性突变。<\/li>\n<li>复杂模型不与简单基线比较；增加的参数可能只是在拟合历史噪声。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>输入估计方法和约束均可复现<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>完成参数与相关性扰动测试<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>与至少一个简单基线做成本后比较<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>权重集中度、换手和极端情景符合风险预算<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>BL 后验按先验和观点的不确定性加权。<\/li>\n<li>后验收益仍需通过有约束优化转为权重。<\/li>\n<li>观点幅度与置信度都应做敏感性分析。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为股票/债券两资产设置三档观点置信度，记录后验收益和权重如何变化。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第084讲 风险平价：全天候策略的核心思想<\/strong>。<\/p>"}, {"n": 84, "title": "风险平价：全天候策略的核心思想", "html": "<h1>第084讲 风险平价：全天候策略的核心思想<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。组合模型依赖估计与约束，不能消除亏损。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解等权、逆波动与等风险贡献。<\/li>\n<li>掌握风险贡献的计算直觉。<\/li>\n<li>认识全天候简化实现的杠杆与通胀风险。<\/li>\n<\/ul>\n<h2>不预测收益的配置<\/h2>\n<p>风险平价减少对预期收益的依赖，目标是让资产或风险因子贡献更均衡。若只按资金等权，高波资产会主导组合风险。<\/p>\n<h2>逆波动与等风险贡献<\/h2>\n<p>逆波动权重近似 (w_i\\propto1/\\sigma_i)，忽略相关性。等风险贡献要求每项 (RC_i=w_i(\\Sigma w)_i/\\sigma_p) 接近相等，因此同时考虑协方差。<\/p>\n<h2>全天候直觉<\/h2>\n<p>通过股票、名义债券、通胀敏感资产等分散增长与通胀环境，再按风险平衡。低波债券权重可能较高，若追求目标收益常需杠杆。<\/p>\n<h2>风险<\/h2>\n<p>估计相关变化、债券与股票同时下跌、杠杆融资成本和低流动性都会破坏历史平衡。风险平价不是永远抗通胀，取决于资产集合是否真的包含通胀风险来源。<\/p>\n<h2>实现<\/h2>\n<p>使用稳健协方差、权重和杠杆上限、定期或容忍带再平衡，并对利率跳升、通胀与流动性做压力测试。<\/p>\n<h2>配置实验：估计误差也是风险<\/h2>\n<p>把“风险平价：全天候策略的核心思想”放进一个完整配置实验。优化器给出的权重只是输入假设、约束和目标函数的结果，必须检查其对估计误差和现实交易条件是否稳健。<\/p>\n<ol>\n<li>明确资产池、基准、再平衡频率、目标函数和全部约束。<\/li>\n<li>记录收益、波动率与相关性的估计窗口和方法，并做扰动测试。<\/li>\n<li>比较等权、简单风险预算等基线，判断复杂模型是否提供稳定增量。<\/li>\n<li>加入换手、交易成本、最小交易单位、容量和再平衡偏离区间。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>把预测均值当成精确输入；微小估计变化可能导致极端权重。<\/li>\n<li>只看静态有效前沿；真实组合还要经历再平衡成本和相关性突变。<\/li>\n<li>复杂模型不与简单基线比较；增加的参数可能只是在拟合历史噪声。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>输入估计方法和约束均可复现<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>完成参数与相关性扰动测试<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>与至少一个简单基线做成本后比较<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>权重集中度、换手和极端情景符合风险预算<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>风险平价让风险贡献而非资金权重更均衡。<\/li>\n<li>逆波动忽略相关，等风险贡献使用协方差。<\/li>\n<li>全天候仍面临杠杆、相关变化和资产缺失。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>比较四资产等权、逆波动和等风险贡献的资金权重与风险贡献。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第085讲 动态再平衡与目标风险策略<\/strong>。<\/p>"}, {"n": 85, "title": "动态再平衡与目标风险策略", "html": "<h1>第085讲 动态再平衡与目标风险策略<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。组合模型依赖估计与约束，不能消除亏损。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>比较机械、容忍带和目标风险调仓。<\/li>\n<li>掌握目标波动反推仓位。<\/li>\n<li>设计含杠杆和交易成本的动态系统。<\/li>\n<\/ul>\n<h2>三种动态机制<\/h2>\n<p>机械再平衡按固定日历恢复目标；容忍带在偏离超过阈值时交易；目标风险根据组合预测波动动态调整总风险。<\/p>\n<h2>目标波动<\/h2>\n<p>若目标年化波动率为 (\\sigma^*)，当前预测波动为 (\\hat\\sigma_t)，风险资产缩放系数近似：<\/p>\n<p>[\nk_t=\\frac{\\sigma^*}{\\hat\\sigma_t}\n]<\/p>\n<p>再对 (k_t) 设置上下限。波动升高时降仓，降低时加仓。<\/p>\n<h2>顺周期问题<\/h2>\n<p>危机中波动飙升，模型可能在价格下跌后被迫卖出；平静期持续加杠杆，又可能在冲击前过度暴露。可使用平滑波动、缓冲区、慢速调整和杠杆上限。<\/p>\n<h2>组合调仓<\/h2>\n<p>先确定战略权重，再计算风险缩放，最后净额交易并考虑现金与保证金。目标波动不改变相对资产选择，只调整总风险；若相关性同时变化，还需重估组合协方差。<\/p>\n<h2>验证<\/h2>\n<p>比较固定仓位与目标波动在正常、危机和快速反弹阶段的收益、回撤、换手率和杠杆。动态不等于总能避险。<\/p>\n<h2>配置实验：估计误差也是风险<\/h2>\n<p>把“动态再平衡与目标风险策略”放进一个完整配置实验。优化器给出的权重只是输入假设、约束和目标函数的结果，必须检查其对估计误差和现实交易条件是否稳健。<\/p>\n<ol>\n<li>明确资产池、基准、再平衡频率、目标函数和全部约束。<\/li>\n<li>记录收益、波动率与相关性的估计窗口和方法，并做扰动测试。<\/li>\n<li>比较等权、简单风险预算等基线，判断复杂模型是否提供稳定增量。<\/li>\n<li>加入换手、交易成本、最小交易单位、容量和再平衡偏离区间。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>把预测均值当成精确输入；微小估计变化可能导致极端权重。<\/li>\n<li>只看静态有效前沿；真实组合还要经历再平衡成本和相关性突变。<\/li>\n<li>复杂模型不与简单基线比较；增加的参数可能只是在拟合历史噪声。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>输入估计方法和约束均可复现<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>完成参数与相关性扰动测试<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>与至少一个简单基线做成本后比较<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>权重集中度、换手和极端情景符合风险预算<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>目标风险用预测波动调整总仓位。<\/li>\n<li>波动控仓可能顺周期卖低买高。<\/li>\n<li>平滑、缓冲、杠杆上限与成本控制不可缺少。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>给定目标波动 10%，当前预测波动分别为 5%、10%、20%，计算缩放并加入 1.5 倍上限。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第086讲 机器学习在量化中扮演什么角色？绝非万能圣杯<\/strong>。<\/p>"}]}, {"no": 9, "name": "新刃·机器学习与AI", "desc": "揭开AI量化的面纱，从传统模型到深度学习，让非程序员也能听懂。", "chapters": [{"n": 86, "title": "机器学习在量化中扮演什么角色？绝非万能圣杯", "html": "<h1>第086讲 机器学习在量化中扮演什么角色？绝非万能圣杯<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。机器学习模型会失效，历史预测表现不代表未来收益。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>明确机器学习在量化流程中的合适位置。<\/li>\n<li>区分预测目标与投资目标。<\/li>\n<li>建立基线、验证和成本三道门槛。<\/li>\n<\/ul>\n<h2>机器学习不是自动赚钱机<\/h2>\n<p>机器学习擅长从大量特征中拟合映射，但市场标签噪声高、分布变化、样本依赖强。模型能预测一个统计目标，不代表能形成成本后可交易收益。<\/p>\n<h2>四类角色<\/h2>\n<ul>\n<li>预测横截面相对收益或上涨概率。<\/li>\n<li>估计波动、流动性和交易成本。<\/li>\n<li>识别市场状态或异常。<\/li>\n<li>优化执行与订单选择。<\/li>\n<\/ul>\n<p>很多场景中，风险和成本预测比直接预测价格更稳定。<\/p>\n<h2>预测与决策分离<\/h2>\n<p>模型输出分数或概率，组合层还要处理权重、约束、风险和交易。分类准确率高也可能因错误样本亏损更大而失去投资价值。<\/p>\n<h2>三道门槛<\/h2>\n<p>先超过简单线性或排序基线；再通过滚动样本外和泄漏检查；最后在真实成本、容量和执行约束后仍有增量。<\/p>\n<h2>合理期待<\/h2>\n<p>机器学习常提供小幅边际改进，而不是替代数据质量、经济解释和风控。复杂度应由样本和可验证增量支付。<\/p>\n<h2>机器学习实验：先守住时间边界<\/h2>\n<p>针对“机器学习在量化中扮演什么角色？绝非万能圣杯”建立一个时间序列机器学习实验。重点不是模型名称，而是标签、特征、切分、评价和上线监控是否与真实决策过程一致。<\/p>\n<ol>\n<li>定义预测时点、预测对象、标签窗口和可用特征截止时间。<\/li>\n<li>按时间切分训练、验证与测试数据；预处理、特征选择和调参只在允许的数据内完成。<\/li>\n<li>与朴素基线比较，并同时评价预测质量、排序质量、换手和成本后组合表现。<\/li>\n<li>上线前建立特征漂移、预测分布、暴露、延迟和模型失效监控。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>随机打乱时间序列做交叉验证；这会把未来结构泄漏给过去。<\/li>\n<li>在全样本上标准化或筛选特征；预处理本身也必须只用训练数据拟合。<\/li>\n<li>预测误差更低就认为策略更好；投资决策还取决于排序、成本、约束和稳定性。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>标签窗口与特征截止时间无重叠泄漏<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>全部预处理封装在训练流程内<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>模型优于朴素基线且结果跨时期稳定<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>漂移、失效和回滚方案已定义<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>机器学习是量化工具箱的一部分，不是完整策略。<\/li>\n<li>预测输出必须经过组合与执行转成决策。<\/li>\n<li>简单基线、样本外和成本后增量是最低标准。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>选择一个模型任务，分别写出预测指标、投资指标和风险指标，说明三者为何不同。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第087讲 监督学习：分类与回归，如何让机器预测涨跌？<\/strong>。<\/p>"}, {"n": 87, "title": "监督学习：分类与回归，如何让机器预测涨跌？", "html": "<h1>第087讲 监督学习：分类与回归，如何让机器预测涨跌？<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。机器学习模型会失效，历史预测表现不代表未来收益。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>区分分类与回归目标。<\/li>\n<li>设计无泄漏标签和时间切分。<\/li>\n<li>选择与投资结果一致的损失与评价。<\/li>\n<\/ul>\n<h2>两种监督任务<\/h2>\n<p>分类预测类别或概率，如未来收益是否为正；回归预测连续值，如未来 20 日收益或波动。标签由未来数据构造，但训练样本的特征只能来自决策时点之前。<\/p>\n<h2>标签设计<\/h2>\n<p>预测点收益噪声很大，可考虑横截面排名、超额收益、风险调整收益或带交易阈值的类别。标签窗口决定持有期和样本重叠。<\/p>\n<h2>损失函数不等于投资目标<\/h2>\n<p>均方误差惩罚数值偏差，交叉熵评价概率，但组合关心排序、收益、回撤和成本。模型选择应同时看统计指标与组合回测。<\/p>\n<h2>概率校准<\/h2>\n<p>分类模型 60% 输出应在相似样本中约有 60% 发生。校准影响仓位和阈值，准确率本身看不到信心质量。<\/p>\n<h2>时间验证<\/h2>\n<p>使用滚动训练、隔离重叠标签，并只在训练窗口做标准化和特征选择。随机拆分通常不适合金融时间序列。<\/p>\n<h2>机器学习实验：先守住时间边界<\/h2>\n<p>针对“监督学习：分类与回归，如何让机器预测涨跌？”建立一个时间序列机器学习实验。重点不是模型名称，而是标签、特征、切分、评价和上线监控是否与真实决策过程一致。<\/p>\n<ol>\n<li>定义预测时点、预测对象、标签窗口和可用特征截止时间。<\/li>\n<li>按时间切分训练、验证与测试数据；预处理、特征选择和调参只在允许的数据内完成。<\/li>\n<li>与朴素基线比较，并同时评价预测质量、排序质量、换手和成本后组合表现。<\/li>\n<li>上线前建立特征漂移、预测分布、暴露、延迟和模型失效监控。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>随机打乱时间序列做交叉验证；这会把未来结构泄漏给过去。<\/li>\n<li>在全样本上标准化或筛选特征；预处理本身也必须只用训练数据拟合。<\/li>\n<li>预测误差更低就认为策略更好；投资决策还取决于排序、成本、约束和稳定性。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>标签窗口与特征截止时间无重叠泄漏<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>全部预处理封装在训练流程内<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>模型优于朴素基线且结果跨时期稳定<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>漂移、失效和回滚方案已定义<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>分类预测概率，回归预测连续目标。<\/li>\n<li>标签窗口与交易持有期必须一致。<\/li>\n<li>统计损失和投资目标需同时评估。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为未来 5 日超额收益设计一个回归标签和一个三分类标签，并说明各自优缺点。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第088讲 特征工程：你喂给模型什么“饲料”决定了结果<\/strong>。<\/p>"}, {"n": 88, "title": "特征工程：你喂给模型什么“饲料”决定了结果", "html": "<h1>第088讲 特征工程：你喂给模型什么“饲料”决定了结果<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。机器学习模型会失效，历史预测表现不代表未来收益。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解特征工程的时点、尺度和经济含义。<\/li>\n<li>处理横截面、时序和类别特征。<\/li>\n<li>用稳定性与增量而非数量选择特征。<\/li>\n<\/ul>\n<h2>特征决定模型看到的世界<\/h2>\n<p>价格、财务、分析师、宏观和另类数据需要变成固定时点可计算的输入。错误时间戳会让再强模型也只是学习未来。<\/p>\n<h2>常见处理<\/h2>\n<p>横截面特征常缩尾、标准化和行业中性；时序特征可用滚动变化、分位和波动标准化；类别变量可做编码，但要防止高基数与稀有类别泄漏。<\/p>\n<h2>缺失本身可能有信息<\/h2>\n<p>财报缺失、分析师不覆盖可能与公司类型相关。填补数值时可同时增加缺失标记，但填补统计只能来自训练数据。<\/p>\n<h2>特征冗余<\/h2>\n<p>数百个技术指标常由相同价格窗口派生。可用相关聚类、正则化和消融实验减少重复。特征越多，研究自由度越大。<\/p>\n<h2>特征生命线<\/h2>\n<p>为每个特征记录来源、可用时间、公式、频率、覆盖率、方向和漂移监控。上线后观察分布、缺失与预测贡献是否变化。<\/p>\n<h2>机器学习实验：先守住时间边界<\/h2>\n<p>针对“特征工程：你喂给模型什么“饲料”决定了结果”建立一个时间序列机器学习实验。重点不是模型名称，而是标签、特征、切分、评价和上线监控是否与真实决策过程一致。<\/p>\n<ol>\n<li>定义预测时点、预测对象、标签窗口和可用特征截止时间。<\/li>\n<li>按时间切分训练、验证与测试数据；预处理、特征选择和调参只在允许的数据内完成。<\/li>\n<li>与朴素基线比较，并同时评价预测质量、排序质量、换手和成本后组合表现。<\/li>\n<li>上线前建立特征漂移、预测分布、暴露、延迟和模型失效监控。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>随机打乱时间序列做交叉验证；这会把未来结构泄漏给过去。<\/li>\n<li>在全样本上标准化或筛选特征；预处理本身也必须只用训练数据拟合。<\/li>\n<li>预测误差更低就认为策略更好；投资决策还取决于排序、成本、约束和稳定性。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>标签窗口与特征截止时间无重叠泄漏<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>全部预处理封装在训练流程内<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>模型优于朴素基线且结果跨时期稳定<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>漂移、失效和回滚方案已定义<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>特征工程首先是时间与语义治理。<\/li>\n<li>缺失、标准化和中性化都可能造成泄漏。<\/li>\n<li>特征应按稳定增量选择，而非越多越好。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为五个候选特征制作数据卡，并做逐项消融，记录样本外变化。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第089讲 决策树与随机森林：可解释、不易过拟合的利器<\/strong>。<\/p>"}, {"n": 89, "title": "决策树与随机森林：可解释、不易过拟合的利器", "html": "<h1>第089讲 决策树与随机森林：可解释、不易过拟合的利器<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。机器学习模型会失效，历史预测表现不代表未来收益。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解决策树的分裂与非线性。<\/li>\n<li>掌握随机森林的采样与平均。<\/li>\n<li>认识树模型的过拟合和解释边界。<\/li>\n<\/ul>\n<h2>决策树如何学习<\/h2>\n<p>树通过不断选择特征与阈值，把样本分成更纯的区域。它能表达非线性和交互，不要求特征标准化，但深树容易记住噪声。<\/p>\n<h2>随机森林<\/h2>\n<p>随机森林对样本做自助采样，每次分裂只考虑部分特征，再平均多棵树。随机性降低单树方差，对异常和非线性较稳健。<\/p>\n<h2>重要参数<\/h2>\n<p>树深、叶节点最小样本、树数量和特征采样比例决定偏差与方差。时间数据不能随意把未来样本混进 bootstrap 验证。<\/p>\n<h2>特征重要性<\/h2>\n<p>分裂重要性偏爱取值多的变量；置换重要性受相关特征影响。重要不代表因果，也不代表加入组合后有净收益。<\/p>\n<h2>金融应用<\/h2>\n<p>可用于收益排序、风险状态和成交概率。应比较线性基线、做时间样本外，并限制复杂度。随机森林“不易过拟合”只是相对单棵深树，不是免检。<\/p>\n<h2>机器学习实验：先守住时间边界<\/h2>\n<p>针对“决策树与随机森林：可解释、不易过拟合的利器”建立一个时间序列机器学习实验。重点不是模型名称，而是标签、特征、切分、评价和上线监控是否与真实决策过程一致。<\/p>\n<ol>\n<li>定义预测时点、预测对象、标签窗口和可用特征截止时间。<\/li>\n<li>按时间切分训练、验证与测试数据；预处理、特征选择和调参只在允许的数据内完成。<\/li>\n<li>与朴素基线比较，并同时评价预测质量、排序质量、换手和成本后组合表现。<\/li>\n<li>上线前建立特征漂移、预测分布、暴露、延迟和模型失效监控。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>随机打乱时间序列做交叉验证；这会把未来结构泄漏给过去。<\/li>\n<li>在全样本上标准化或筛选特征；预处理本身也必须只用训练数据拟合。<\/li>\n<li>预测误差更低就认为策略更好；投资决策还取决于排序、成本、约束和稳定性。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>标签窗口与特征截止时间无重叠泄漏<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>全部预处理封装在训练流程内<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>模型优于朴素基线且结果跨时期稳定<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>漂移、失效和回滚方案已定义<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>树通过阈值分裂表达非线性与交互。<\/li>\n<li>随机森林以随机采样和平均降低方差。<\/li>\n<li>重要性不是因果，时间验证仍是核心。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>训练浅树与深树，比较训练、滚动验证和特征重要性稳定性。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第090讲 XGBoost与LightGBM：各种比赛冠军的非线性引擎<\/strong>。<\/p>"}, {"n": 90, "title": "XGBoost与LightGBM：各种比赛冠军的非线性引擎", "html": "<h1>第090讲 XGBoost与LightGBM：各种比赛冠军的非线性引擎<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。机器学习模型会失效，历史预测表现不代表未来收益。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解梯度提升逐步纠错的机制。<\/li>\n<li>区分 XGBoost 与 LightGBM 的工程取向。<\/li>\n<li>用正则、早停和时间验证控制复杂度。<\/li>\n<\/ul>\n<h2>Boosting 的直觉<\/h2>\n<p>梯度提升不是并行平均独立树，而是逐轮训练新树去修正当前模型的误差。许多弱树相加形成强非线性模型。<\/p>\n<h2>XGBoost 与 LightGBM<\/h2>\n<p>两者都提供梯度提升、正则和缺失处理。XGBoost 强调正则化与通用树提升实现；LightGBM 采用高效直方图和叶子生长等工程设计，适合大规模特征。具体性能取决于数据与参数，不能只按名称选冠军。<\/p>\n<h2>关键控制<\/h2>\n<p>学习率与树数量联动；深度、叶节点样本、行列采样和正则决定复杂度。使用时间验证早停，不能用最终测试集决定轮数。<\/p>\n<h2>排名问题<\/h2>\n<p>横截面投资更关心排序，可使用适合排名的目标或直接评价 Rank IC 和分组收益。均方误差最小不必然给出最好组合。<\/p>\n<h2>风险<\/h2>\n<p>非线性模型能利用细微口径差异，也更容易学习数据供应商和时期特征。需要特征漂移、SHAP 等局部解释和消融检查。<\/p>\n<h2>机器学习实验：先守住时间边界<\/h2>\n<p>针对“XGBoost与LightGBM：各种比赛冠军的非线性引擎”建立一个时间序列机器学习实验。重点不是模型名称，而是标签、特征、切分、评价和上线监控是否与真实决策过程一致。<\/p>\n<ol>\n<li>定义预测时点、预测对象、标签窗口和可用特征截止时间。<\/li>\n<li>按时间切分训练、验证与测试数据；预处理、特征选择和调参只在允许的数据内完成。<\/li>\n<li>与朴素基线比较，并同时评价预测质量、排序质量、换手和成本后组合表现。<\/li>\n<li>上线前建立特征漂移、预测分布、暴露、延迟和模型失效监控。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>随机打乱时间序列做交叉验证；这会把未来结构泄漏给过去。<\/li>\n<li>在全样本上标准化或筛选特征；预处理本身也必须只用训练数据拟合。<\/li>\n<li>预测误差更低就认为策略更好；投资决策还取决于排序、成本、约束和稳定性。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>标签窗口与特征截止时间无重叠泄漏<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>全部预处理封装在训练流程内<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>模型优于朴素基线且结果跨时期稳定<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>漂移、失效和回滚方案已定义<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>梯度提升通过连续纠错形成强模型。<\/li>\n<li>两个框架的差异主要在算法与工程实现。<\/li>\n<li>早停、正则和时间验证决定样本外质量。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>固定数据，比较线性、随机森林和梯度提升的滚动 Rank IC、换手率与成本后收益。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第091讲 神经网络入门：就像堆积木一样理解深度学习<\/strong>。<\/p>"}, {"n": 91, "title": "神经网络入门：就像堆积木一样理解深度学习", "html": "<h1>第091讲 神经网络入门：就像堆积木一样理解深度学习<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。机器学习模型会失效，历史预测表现不代表未来收益。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解神经元、层和反向传播。<\/li>\n<li>掌握容量、正则和数据规模关系。<\/li>\n<li>避免把深度当作金融优势。<\/li>\n<\/ul>\n<h2>像积木，但每块都有参数<\/h2>\n<p>神经元对输入加权求和并经过非线性激活；多层组合可以表达复杂函数。训练通过损失函数和反向传播更新权重。<\/p>\n<h2>为什么需要非线性<\/h2>\n<p>若所有层都只是线性变换，多层仍等价于一层。ReLU 等激活让网络表达阈值、交互和局部结构。<\/p>\n<h2>金融中的难点<\/h2>\n<p>参数可能远多于独立市场周期，标签噪声又高。图像中的海量相似样本不等同于金融时间序列的有效样本。<\/p>\n<h2>正则化<\/h2>\n<p>控制网络宽深、权重衰减、dropout、早停和输入降维。批归一化等技术要注意训练与推理统计及时间泄漏。<\/p>\n<h2>何时值得<\/h2>\n<p>高维文本、图像、订单簿或跨资产共享结构可能适合神经网络；少量日频因子未必胜过树和线性模型。先证明复杂模型有稳定增量。<\/p>\n<h2>机器学习实验：先守住时间边界<\/h2>\n<p>针对“神经网络入门：就像堆积木一样理解深度学习”建立一个时间序列机器学习实验。重点不是模型名称，而是标签、特征、切分、评价和上线监控是否与真实决策过程一致。<\/p>\n<ol>\n<li>定义预测时点、预测对象、标签窗口和可用特征截止时间。<\/li>\n<li>按时间切分训练、验证与测试数据；预处理、特征选择和调参只在允许的数据内完成。<\/li>\n<li>与朴素基线比较，并同时评价预测质量、排序质量、换手和成本后组合表现。<\/li>\n<li>上线前建立特征漂移、预测分布、暴露、延迟和模型失效监控。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>随机打乱时间序列做交叉验证；这会把未来结构泄漏给过去。<\/li>\n<li>在全样本上标准化或筛选特征；预处理本身也必须只用训练数据拟合。<\/li>\n<li>预测误差更低就认为策略更好；投资决策还取决于排序、成本、约束和稳定性。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>标签窗口与特征截止时间无重叠泄漏<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>全部预处理封装在训练流程内<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>模型优于朴素基线且结果跨时期稳定<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>漂移、失效和回滚方案已定义<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>神经网络用多层非线性变换拟合复杂函数。<\/li>\n<li>参数容量必须与有效样本和稳定周期匹配。<\/li>\n<li>复杂结构需要通过简单基线和样本外证明价值。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>计算一个两层网络的参数数量，并与训练样本和独立时间段数量比较。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第092讲 LSTM：长短期记忆网络怎么对付时间序列？<\/strong>。<\/p>"}, {"n": 92, "title": "LSTM：长短期记忆网络怎么对付时间序列？", "html": "<h1>第092讲 LSTM：长短期记忆网络怎么对付时间序列？<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。机器学习模型会失效，历史预测表现不代表未来收益。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解循环网络与 LSTM 的状态机制。<\/li>\n<li>认识长依赖、窗口和训练困难。<\/li>\n<li>判断 LSTM 是否适合目标序列。<\/li>\n<\/ul>\n<h2>时间序列需要记忆<\/h2>\n<p>循环神经网络把上一时刻隐藏状态传给下一时刻，但长序列训练容易出现梯度消失或爆炸。LSTM 用遗忘、输入和输出门控制信息保留与更新。<\/p>\n<h2>门的直觉<\/h2>\n<p>遗忘门决定丢掉多少旧记忆，输入门决定写入多少新信息，输出门决定当前暴露多少状态。它提高学习长依赖的能力，但不保证市场存在稳定长记忆。<\/p>\n<h2>样本构造<\/h2>\n<p>滑动窗口会产生高度重叠样本，训练与验证边界需隔离。特征缩放只用训练期统计，隐藏状态在资产和批次间如何重置也要明确。<\/p>\n<h2>比较基线<\/h2>\n<p>LSTM 应与滞后线性、树模型、简单卷积或 Transformer 基线比较。若优势只来自使用更多历史窗口，未必是记忆结构本身。<\/p>\n<h2>风险<\/h2>\n<p>状态制度变化、训练不稳定和解释困难。金融中更长窗口不必然更有信息，模型可能记住时期标签。<\/p>\n<h2>机器学习实验：先守住时间边界<\/h2>\n<p>针对“LSTM：长短期记忆网络怎么对付时间序列？”建立一个时间序列机器学习实验。重点不是模型名称，而是标签、特征、切分、评价和上线监控是否与真实决策过程一致。<\/p>\n<ol>\n<li>定义预测时点、预测对象、标签窗口和可用特征截止时间。<\/li>\n<li>按时间切分训练、验证与测试数据；预处理、特征选择和调参只在允许的数据内完成。<\/li>\n<li>与朴素基线比较，并同时评价预测质量、排序质量、换手和成本后组合表现。<\/li>\n<li>上线前建立特征漂移、预测分布、暴露、延迟和模型失效监控。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>随机打乱时间序列做交叉验证；这会把未来结构泄漏给过去。<\/li>\n<li>在全样本上标准化或筛选特征；预处理本身也必须只用训练数据拟合。<\/li>\n<li>预测误差更低就认为策略更好；投资决策还取决于排序、成本、约束和稳定性。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>标签窗口与特征截止时间无重叠泄漏<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>全部预处理封装在训练流程内<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>模型优于朴素基线且结果跨时期稳定<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>漂移、失效和回滚方案已定义<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>LSTM 通过门控状态缓解长序列训练问题。<\/li>\n<li>重叠窗口和状态重置会影响验证。<\/li>\n<li>是否有效取决于目标是否存在稳定时序依赖。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>用相同 60 日输入比较线性、树与 LSTM，并保证时间切分和特征完全一致。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第093讲 强化学习想象：让AI自己试错，学会交易<\/strong>。<\/p>"}, {"n": 93, "title": "强化学习想象：让AI自己试错，学会交易", "html": "<h1>第093讲 强化学习想象：让AI自己试错，学会交易<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。机器学习模型会失效，历史预测表现不代表未来收益。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解状态、动作、奖励和策略。<\/li>\n<li>认识交易环境与真实市场的差距。<\/li>\n<li>防止奖励黑客和模拟器过拟合。<\/li>\n<\/ul>\n<h2>强化学习在学什么<\/h2>\n<p>智能体观察状态 (s)，选择动作 (a)，获得奖励 (r)，目标最大化长期累计奖励。交易动作可以是目标仓位或订单，奖励可含收益、风险和成本。<\/p>\n<h2>最大难点是环境<\/h2>\n<p>游戏规则固定，市场会因参与者和制度变化。历史回放中智能体的订单通常不会改变价格，真实大额交易却有冲击；模拟器偏差会被策略利用。<\/p>\n<h2>奖励设计<\/h2>\n<p>只奖励单期收益会鼓励高杠杆；加入波动、回撤、换手率和库存惩罚能反映约束，但权重本身又成为参数。智能体可能找到符合公式却违背投资目的的捷径。<\/p>\n<h2>离线训练<\/h2>\n<p>金融多使用历史数据的离线强化学习，无法自由探索。行为数据覆盖不足时，模型对未见动作的价值估计不可靠。<\/p>\n<h2>合理应用<\/h2>\n<p>订单执行、库存控制和有清晰状态转移的问题往往比直接预测市场更适合。上线前需要基线、压力、动作限制和安全策略。<\/p>\n<h2>机器学习实验：先守住时间边界<\/h2>\n<p>针对“强化学习想象：让AI自己试错，学会交易”建立一个时间序列机器学习实验。重点不是模型名称，而是标签、特征、切分、评价和上线监控是否与真实决策过程一致。<\/p>\n<ol>\n<li>定义预测时点、预测对象、标签窗口和可用特征截止时间。<\/li>\n<li>按时间切分训练、验证与测试数据；预处理、特征选择和调参只在允许的数据内完成。<\/li>\n<li>与朴素基线比较，并同时评价预测质量、排序质量、换手和成本后组合表现。<\/li>\n<li>上线前建立特征漂移、预测分布、暴露、延迟和模型失效监控。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>随机打乱时间序列做交叉验证；这会把未来结构泄漏给过去。<\/li>\n<li>在全样本上标准化或筛选特征；预处理本身也必须只用训练数据拟合。<\/li>\n<li>预测误差更低就认为策略更好；投资决策还取决于排序、成本、约束和稳定性。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>标签窗口与特征截止时间无重叠泄漏<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>全部预处理封装在训练流程内<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>模型优于朴素基线且结果跨时期稳定<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>漂移、失效和回滚方案已定义<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>强化学习围绕状态、动作、奖励和长期价值。<\/li>\n<li>市场模拟器误差是最大风险之一。<\/li>\n<li>奖励与动作边界必须体现真实风险和成本。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为执行算法设计奖励，包含成交成本、未完成数量和风险，并列出可能被钻的漏洞。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第094讲 机器学习中的过拟合陷阱：如何识别与防范<\/strong>。<\/p>"}, {"n": 94, "title": "机器学习中的过拟合陷阱：如何识别与防范", "html": "<h1>第094讲 机器学习中的过拟合陷阱：如何识别与防范<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。机器学习模型会失效，历史预测表现不代表未来收益。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>识别训练、验证和实盘交易三层过拟合。<\/li>\n<li>掌握正则、简化和嵌套选择。<\/li>\n<li>建立漂移与失效监控。<\/li>\n<\/ul>\n<h2>机器学习放大研究自由度<\/h2>\n<p>特征、标签、模型、超参数和样本窗口都可选择。若所有选择都围绕同一验证集，验证集也会被过拟合。<\/p>\n<h2>三层症状<\/h2>\n<p>训练好验证差是经典过拟合；验证好最终测试差是模型选择过拟合；回测好实盘交易差还可能来自成本、数据和制度变化。<\/p>\n<h2>防范工具<\/h2>\n<p>限制特征和超参数预算，使用嵌套时间验证，正则、早停、消融和简单基线；保留一次性最终测试，并记录所有实验而非只保存冠军。<\/p>\n<h2>选择偏差<\/h2>\n<p>团队连续数月试验后得到一条好曲线，实际有效试验次数远高于报告。应将研究过程当成多重检验，要求更强证据。<\/p>\n<h2>上线监控<\/h2>\n<p>监控特征分布、预测分数、命中率、Rank IC、成本和风险暴露。漂移不必马上停机，但应触发诊断与降险。<\/p>\n<h2>机器学习实验：先守住时间边界<\/h2>\n<p>针对“机器学习中的过拟合陷阱：如何识别与防范”建立一个时间序列机器学习实验。重点不是模型名称，而是标签、特征、切分、评价和上线监控是否与真实决策过程一致。<\/p>\n<ol>\n<li>定义预测时点、预测对象、标签窗口和可用特征截止时间。<\/li>\n<li>按时间切分训练、验证与测试数据；预处理、特征选择和调参只在允许的数据内完成。<\/li>\n<li>与朴素基线比较，并同时评价预测质量、排序质量、换手和成本后组合表现。<\/li>\n<li>上线前建立特征漂移、预测分布、暴露、延迟和模型失效监控。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>随机打乱时间序列做交叉验证；这会把未来结构泄漏给过去。<\/li>\n<li>在全样本上标准化或筛选特征；预处理本身也必须只用训练数据拟合。<\/li>\n<li>预测误差更低就认为策略更好；投资决策还取决于排序、成本、约束和稳定性。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>标签窗口与特征截止时间无重叠泄漏<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>全部预处理封装在训练流程内<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>模型优于朴素基线且结果跨时期稳定<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>漂移、失效和回滚方案已定义<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>验证集也会被反复调参过拟合。<\/li>\n<li>实验日志和最终保留集是研究治理的一部分。<\/li>\n<li>上线后需监控输入、预测和经济结果漂移。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>列出一个项目所有隐形选择，并估算总试验自由度，再删除一半非必要参数。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第095讲 模型集成与动态选择：三个臭皮匠怎么顶个诸葛亮<\/strong>。<\/p>"}, {"n": 95, "title": "模型集成与动态选择：三个臭皮匠怎么顶个诸葛亮", "html": "<h1>第095讲 模型集成与动态选择：三个臭皮匠怎么顶个诸葛亮<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。机器学习模型会失效，历史预测表现不代表未来收益。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解 bagging、boosting、stacking 和模型平均。<\/li>\n<li>掌握多样性与相关误差的重要性。<\/li>\n<li>设计稳健的动态选择而非追逐近期赢家。<\/li>\n<\/ul>\n<h2>为什么集成可能更稳<\/h2>\n<p>若多个模型都有一定能力且错误不完全相关，平均可降低方差。三个高度相同的模型不等于三个独立观点。<\/p>\n<h2>四种方式<\/h2>\n<ul>\n<li>Bagging 对样本与模型并行平均。<\/li>\n<li>Boosting 逐步修正误差。<\/li>\n<li>Stacking 用第二层模型学习组合预测。<\/li>\n<li>简单平均或中位数直接聚合不同模型。<\/li>\n<\/ul>\n<p>简单平均通常是必须击败的基线。<\/p>\n<h2>动态选择<\/h2>\n<p>可根据近期稳定性、市场状态或特征有效性调整模型权重，但近期冠军容易均值回归。权重变化应缓慢、有上限并在滚动样本外验证。<\/p>\n<h2>多样性来源<\/h2>\n<p>不同数据、不同时间尺度、不同模型族和不同经济逻辑比仅改变随机种子更有价值。评估预测相关、持仓重合和危机共损。<\/p>\n<h2>组合层<\/h2>\n<p>模型集成后仍要统一校准、风险约束和成本。不要让多个模型各自下单后才发现总暴露重复。<\/p>\n<h2>机器学习实验：先守住时间边界<\/h2>\n<p>针对“模型集成与动态选择：三个臭皮匠怎么顶个诸葛亮”建立一个时间序列机器学习实验。重点不是模型名称，而是标签、特征、切分、评价和上线监控是否与真实决策过程一致。<\/p>\n<ol>\n<li>定义预测时点、预测对象、标签窗口和可用特征截止时间。<\/li>\n<li>按时间切分训练、验证与测试数据；预处理、特征选择和调参只在允许的数据内完成。<\/li>\n<li>与朴素基线比较，并同时评价预测质量、排序质量、换手和成本后组合表现。<\/li>\n<li>上线前建立特征漂移、预测分布、暴露、延迟和模型失效监控。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>随机打乱时间序列做交叉验证；这会把未来结构泄漏给过去。<\/li>\n<li>在全样本上标准化或筛选特征；预处理本身也必须只用训练数据拟合。<\/li>\n<li>预测误差更低就认为策略更好；投资决策还取决于排序、成本、约束和稳定性。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>标签窗口与特征截止时间无重叠泄漏<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>全部预处理封装在训练流程内<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>模型优于朴素基线且结果跨时期稳定<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>漂移、失效和回滚方案已定义<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>集成依靠低相关错误降低方差。<\/li>\n<li>简单平均是强基线，复杂动态权重容易追涨杀跌。<\/li>\n<li>模型多样性应来自信息与逻辑，而非名称数量。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>计算三个模型预测和持仓的相关矩阵，设计等权与动态权重并比较换手率。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第096讲 实战第一步：明确策略需求与逻辑描述<\/strong>。<\/p>"}]}, {"no": 10, "name": "知行·实战演练", "desc": "纸上得来终觉浅，手把手带你走一遍从想法到可执行策略的流程。", "chapters": [{"n": 96, "title": "实战第一步：明确策略需求与逻辑描述", "html": "<h1>第096讲 实战第一步：明确策略需求与逻辑描述<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。实盘交易部署会产生真实损失，必须经过授权、测试和独立风控。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>把策略需求写成可测试规范。<\/li>\n<li>区分经济假设、信号、组合与约束。<\/li>\n<li>建立上线验收与失败标准。<\/li>\n<\/ul>\n<h2>先写需求，不先写代码<\/h2>\n<p>策略项目应从“解决什么问题”开始：追求绝对收益、降低回撤、提供对冲还是跟踪基准。目标不同，数据与评价也不同。<\/p>\n<h2>一页策略说明书<\/h2>\n<ol>\n<li><strong>目标与基准<\/strong>：要超过谁，风险预算多少。<\/li>\n<li><strong>交易范围<\/strong>：市场、资产、流动性和排除条件。<\/li>\n<li><strong>假设<\/strong>：优势为何存在，谁在另一侧。<\/li>\n<li><strong>信号<\/strong>：输入、公式、频率和时点。<\/li>\n<li><strong>组合<\/strong>：权重、持仓数、再平衡和约束。<\/li>\n<li><strong>执行<\/strong>：订单时间、类型、显性交易费用和成交模型。<\/li>\n<li><strong>风控<\/strong>：单票、组合、回撤与异常。<\/li>\n<li><strong>验收<\/strong>：样本外、成本、稳健性和容量标准。<\/li>\n<\/ol>\n<h2>模糊词清理<\/h2>\n<p>把“趋势明显”“估值合理”“风险较低”改成字段、窗口、阈值和比较对象。仍需人工判断的部分也要记录输入与权限。<\/p>\n<h2>失败定义<\/h2>\n<p>在实验前写出什么结果会否定假设、什么偏离会暂停实盘交易。没有失败标准，研究会不断加条件直到曲线变好。<\/p>\n<h2>最小可行策略<\/h2>\n<p>先实现最简单基线，跑通数据—信号—订单—账本—报告，再增加复杂度。工程闭环比首版收益高更重要。<\/p>\n<h2>实战交付：让别人能够独立复现<\/h2>\n<p>围绕“实战第一步：明确策略需求与逻辑描述”形成可交付的研究闭环。完工标准不是代码在作者电脑上运行过一次，而是另一位读者能按说明重建环境、运行测试并解释输出。<\/p>\n<ol>\n<li>冻结需求、输入字段、参数、信号时点、成本口径和输出结构。<\/li>\n<li>把数据校验、策略逻辑、账本、指标、日志和异常处理拆成可测试模块。<\/li>\n<li>使用同一份输入分别运行 Python 与 R，实现逐日结果与指标对账。<\/li>\n<li>保留 README、运行命令、测试记录、已知限制和上线前检查清单。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>只交付代码片段而没有输入、环境和运行说明；这不构成可复现产物。<\/li>\n<li>Python 与 R 使用不同默认参数或缺失值规则；跨语言对账必须逐列进行。<\/li>\n<li>把回测通过等同于可实盘；模拟交易、权限隔离、监控和故障恢复仍需独立验收。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>从干净环境可按 README 一次运行成功<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>输入校验和关键逻辑有自动测试<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>Python 与 R 输出在约定容差内一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>日志、监控、异常恢复和风险限制均有文档<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>策略需求应覆盖目标、数据、信号、组合、执行、风控与验收。<\/li>\n<li>模糊词必须转成可观察条件。<\/li>\n<li>先定义失败，再开始实验。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>用一页模板描述下一讲的双均线策略，限制参数不超过五个。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第097讲 动手写一个双均线策略（Python与R代码实操）<\/strong>。<\/p>"}, {"n": 97, "title": "动手写一个双均线策略（Python与R代码实操）", "html": "<h1>第097讲 动手写一个双均线策略（Python与R代码实操）<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。实盘交易部署会产生真实损失，必须经过授权、测试和独立风控。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>分别使用 Python 与 R 实现无前视偏差的双均线基线。<\/li>\n<li>使用 WorkBuddy 或 TRAE 生成、运行并验收两种语言的完整课程产物。<\/li>\n<li>确保两种语言使用相同输入、参数、信号时点、交易成本和绩效口径。<\/li>\n<li>生成目标仓位、策略收益率、交易成本、净值和基础绩效指标。<\/li>\n<li>理解代码每一步的金融含义，并能够逐行对账。<\/li>\n<\/ul>\n<h2>规则<\/h2>\n<p>使用收盘价计算 20/60 日均线；短均线高于长均线时持有，反之空仓。收盘后得到信号，下一交易日生效。<\/p>\n<h2>先获取本讲课程产物<\/h2>\n<p>本讲的 Python 与 R 代码被定义为 WorkBuddy 或 TRAE 的可验收产物。读者可以直接查看参考产物，也可以按照统一提示词让任一工具重新生成并验证：<\/p>\n<ul>\n<li><span class=\"xref-plain\">配套产物说明<\/span><\/li>\n<li><a href=\"../配套产物/第097讲-双均线策略/python/dual_moving_average.py\">Python 完整产物<\/a><\/li>\n<li><a href=\"../配套产物/第097讲-双均线策略/r/dual_moving_average.R\">R 完整产物<\/a><\/li>\n<li><span class=\"xref-plain\">Python/R 跨语言对账报告<\/span><\/li>\n<li><span class=\"xref-plain\">WorkBuddy 与 TRAE 通用操作方案<\/span><\/li>\n<\/ul>\n<p>参考产物可直接从终端接收输入和输出路径、均线窗口、交易成本与年化周期参数。下方代码用于解释核心计算，完整输入校验、参数解析和文件输出以配套产物为准。<\/p>\n<h2>用 WorkBuddy 完成本讲<\/h2>\n<ol>\n<li>新建 <strong>Coding Mode<\/strong> 任务，选择一个仅用于本讲的工作文件夹，并保持 <strong>Default Permissions<\/strong>。<\/li>\n<li>加入本讲正文、术语规范和 <code>input/price.csv<\/code>。<\/li>\n<li>要求 WorkBuddy 同时生成 Python/R 源文件、分别运行两端、输出逐日与指标 CSV，并生成跨语言对账报告。<\/li>\n<li>在结果面板检查 Artifacts、All Files、Changes 和 Preview；若有差异，让它定位第一个不一致的日期与字段。<\/li>\n<\/ol>\n<p>针对本讲可发送：<\/p>\n<blockquote>\n<p>按第097讲规则实现 20/60 日双均线策略，交易成本为每单位换手率 0.0005，日频年化周期为 252。收盘后生成信号，仓位必须滞后一日。请同时生成完整 Python 与 R 产物，分别输出逐日结果和绩效指标，并以绝对容差 <code>1e-10<\/code> 逐列核对信号、仓位、换手率、策略收益率和净值。不要连接真实账户。<\/p>\n<\/blockquote>\n<h2>用 TRAE 完成本讲<\/h2>\n<ol>\n<li>在 TRAE Work 中选择 <strong>Code Mode<\/strong>，或在 TRAE IDE 中打开本讲工作文件夹；确认运行环境可调用 Python 3 和 <code>Rscript<\/code>。<\/li>\n<li>把本讲正文、术语规范和输入数据加入工作区，在 Agent 中发送与 WorkBuddy 相同的任务指令。<\/li>\n<li>审阅文件变更与终端命令后，让 Agent 分别运行 Python 和 R 脚本。<\/li>\n<li>检查变更视图、终端输出、README 预览和对账报告；任何超出容差的差异都必须修复后重跑。<\/li>\n<\/ol>\n<h2>Python 产物核心实现<\/h2>\n<p>假设 <code>price.csv<\/code> 至少包含 <code>date,close<\/code>：<\/p>\n<pre><code class=\"language-python\">import pandas as pd\n\nSHORT, LONG = 20, 60\nFEE = 0.0005\n\ndf = pd.read_csv(&quot;price.csv&quot;, parse_dates=[&quot;date&quot;])\ndf = df.sort_values(&quot;date&quot;).drop_duplicates(&quot;date&quot;).set_index(&quot;date&quot;)\n\ndf[&quot;ret&quot;] = df[&quot;close&quot;].pct_change()\ndf[&quot;ma_short&quot;] = df[&quot;close&quot;].rolling(SHORT, min_periods=SHORT).mean()\ndf[&quot;ma_long&quot;] = df[&quot;close&quot;].rolling(LONG, min_periods=LONG).mean()\n\n# t 日收盘后才知道 signal，因此 t+1 日仓位使用 shift(1)\ndf[&quot;signal&quot;] = (df[&quot;ma_short&quot;] &gt; df[&quot;ma_long&quot;]).astype(float)\ndf[&quot;position&quot;] = df[&quot;signal&quot;].shift(1).fillna(0.0)\n\ndf[&quot;turnover&quot;] = df[&quot;position&quot;].diff().abs().fillna(0.0)\ndf[&quot;strategy_ret&quot;] = (\n    df[&quot;position&quot;] * df[&quot;ret&quot;] - FEE * df[&quot;turnover&quot;]\n).fillna(0.0)\ndf[&quot;equity&quot;] = (1.0 + df[&quot;strategy_ret&quot;]).cumprod()\n<\/code><\/pre>\n<h2>基本绩效<\/h2>\n<pre><code class=\"language-python\">PERIODS = 252\nn = len(df)\nann_return = df[&quot;equity&quot;].iloc[-1] ** (PERIODS / n) - 1\nann_vol = df[&quot;strategy_ret&quot;].std(ddof=1) * PERIODS ** 0.5\nsharpe = (\n    df[&quot;strategy_ret&quot;].mean() * PERIODS / ann_vol\n    if ann_vol &gt; 0\n    else float(&quot;nan&quot;)\n)\npeak = df[&quot;equity&quot;].cummax()\nmax_drawdown = (df[&quot;equity&quot;] / peak - 1.0).min()\nprint(ann_return, ann_vol, sharpe, max_drawdown)\n<\/code><\/pre>\n<h2>R 产物核心实现<\/h2>\n<p>R 版本只使用基础包，并与 Python 版本保持相同变量和计算口径。<\/p>\n<h3>策略与净值<\/h3>\n<pre><code class=\"language-r\">SHORT &lt;- 20L\nLONG &lt;- 60L\nFEE &lt;- 0.0005\n\ndf &lt;- read.csv(&quot;price.csv&quot;, stringsAsFactors = FALSE)\ndf$date &lt;- as.Date(df$date)\ndf &lt;- df[order(df$date), ]\ndf &lt;- df[!duplicated(df$date), ]\nrow.names(df) &lt;- NULL\n\nroll_mean &lt;- function(x, n) {\n  as.numeric(stats::filter(x, rep(1 / n, n), sides = 1))\n}\n\ndf$ret &lt;- c(NA_real_, diff(df$close) / head(df$close, -1L))\ndf$ma_short &lt;- roll_mean(df$close, SHORT)\ndf$ma_long &lt;- roll_mean(df$close, LONG)\n\n# t 日收盘后才知道 signal，因此 t+1 日的仓位滞后一日\ndf$signal &lt;- as.numeric(df$ma_short &gt; df$ma_long)\ndf$signal[is.na(df$signal)] &lt;- 0\ndf$position &lt;- c(0, head(df$signal, -1L))\n\ndf$turnover &lt;- c(0, abs(diff(df$position)))\ndf$strategy_ret &lt;- df$position * df$ret - FEE * df$turnover\ndf$strategy_ret[is.na(df$strategy_ret)] &lt;- 0\ndf$equity &lt;- cumprod(1 + df$strategy_ret)\n<\/code><\/pre>\n<h3>基础绩效<\/h3>\n<pre><code class=\"language-r\">PERIODS &lt;- 252\nn &lt;- nrow(df)\nann_return &lt;- tail(df$equity, 1)^(PERIODS / n) - 1\nann_vol &lt;- stats::sd(df$strategy_ret) * sqrt(PERIODS)\nsharpe &lt;- if (is.finite(ann_vol) &amp;&amp; ann_vol &gt; 0) {\n  mean(df$strategy_ret) * PERIODS / ann_vol\n} else {\n  NA_real_\n}\npeak &lt;- cummax(df$equity)\nmax_drawdown &lt;- min(df$equity / peak - 1)\nprint(c(ann_return, ann_vol, sharpe, max_drawdown))\n<\/code><\/pre>\n<h2>Python 与 R 结果对账<\/h2>\n<p>两个版本使用相同 <code>price.csv<\/code> 时，应逐日比较 <code>ma_short<\/code>、<code>ma_long<\/code>、<code>signal<\/code>、<code>position<\/code>、<code>turnover<\/code>、<code>strategy_ret<\/code> 和 <code>equity<\/code>。移动平均线形成前的缺失值和浮点误差可能造成极小差异；若仓位或净值出现方向性差异，应先逐行定位。<\/p>\n<h2>这些教学产物还缺什么<\/h2>\n<p>真实项目还要处理复权、分红、交易日历、滑点、市场冲击成本、无法成交、现金利息和信号执行价格。这里是研究基线，不是可直接连接账户的实盘交易程序。<\/p>\n<h2>自检<\/h2>\n<p>确认完整 Python/R 源文件和 README 均已生成；仓位已滞后一日；长均线形成前仓位为零；交易成本只在仓位变化时扣；两端使用相同数据和参数；逐日结果已在 <code>1e-10<\/code> 容差内对账；最后再用小样本逐行手算验证。<\/p>\n<h2>实战交付：让别人能够独立复现<\/h2>\n<p>围绕“动手写一个双均线策略（Python与R代码实操）”形成可交付的研究闭环。完工标准不是代码在作者电脑上运行过一次，而是另一位读者能按说明重建环境、运行测试并解释输出。<\/p>\n<ol>\n<li>冻结需求、输入字段、参数、信号时点、成本口径和输出结构。<\/li>\n<li>把数据校验、策略逻辑、账本、指标、日志和异常处理拆成可测试模块。<\/li>\n<li>使用同一份输入分别运行 Python 与 R，实现逐日结果与指标对账。<\/li>\n<li>保留 README、运行命令、测试记录、已知限制和上线前检查清单。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>只交付代码片段而没有输入、环境和运行说明；这不构成可复现产物。<\/li>\n<li>Python 与 R 使用不同默认参数或缺失值规则；跨语言对账必须逐列进行。<\/li>\n<li>把回测通过等同于可实盘；模拟交易、权限隔离、监控和故障恢复仍需独立验收。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>从干净环境可按 README 一次运行成功<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>输入校验和关键逻辑有自动测试<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>Python 与 R 输出在约定容差内一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>日志、监控、异常恢复和风险限制均有文档<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>双均线的关键不是均线函数，而是信号、目标仓位和执行时点的严格分离。<\/li>\n<li>Python 与 R 实现必须使用同一数据、参数和交易成本口径。<\/li>\n<li>夏普比率使用平均单期收益率年化，年化收益率使用净值几何复合，两者不能混算。<\/li>\n<li>WorkBuddy 与 TRAE 都必须交付可运行文件、结果数据和跨语言对账结论。<\/li>\n<li>最小代码应先逐行对账，再扩展真实撮合。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>任选 WorkBuddy 或 TRAE，分别在 Python 与 R 完整产物中加入 <code>3×ATR<\/code> 吊灯止损，确保两种实现的信号时点和跳空处理一致，并提交两端逐日结果与跨语言对账报告。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第098讲 在聚宽/米筐上完成一次完整回测并看懂报告<\/strong>。<\/p>"}, {"n": 98, "title": "在聚宽/米筐上完成一次完整回测并看懂报告", "html": "<h1>第098讲 在聚宽/米筐上完成一次完整回测并看懂报告<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。实盘交易部署会产生真实损失，必须经过授权、测试和独立风控。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>完成一次平台回测并核对关键设置。<\/li>\n<li>读懂收益、回撤、交易和风险报告。<\/li>\n<li>用订单明细而非曲线判断可信度。<\/li>\n<\/ul>\n<h2>上传代码前先锁定口径<\/h2>\n<p>记录平台、数据版本、回测区间、基准、初始资金、频率、复权、显性交易费用、滑点和成交规则。平台默认值不是策略定义。<\/p>\n<h2>运行步骤<\/h2>\n<ol>\n<li>先用短区间调试，打印均线、信号、订单和持仓。<\/li>\n<li>手工核对几天，确认没有同价前视。<\/li>\n<li>扩展全样本，保存代码与参数。<\/li>\n<li>运行样本外和成本压力版本。<\/li>\n<li>导出交易明细与每日净值。<\/li>\n<\/ol>\n<h2>看懂报告<\/h2>\n<p>先看净值和回撤路径，再看年化收益率、年化波动率、夏普比率、换手率和交易成本。比较基准与空仓现金。检查收益是否集中于少数年份或交易。<\/p>\n<h2>订单审计<\/h2>\n<p>抽取首次买入、反转、跳空和最后持仓，核对信号时间、提交时间、成交价、数量与显性交易费用。很多回测错误只在订单层可见。<\/p>\n<h2>跨平台差异<\/h2>\n<p>聚宽、米筐或本地框架可能采用不同复权、日历和撮合。不要要求最终小数完全相同，先逐日对齐输入、信号和订单，定位口径差异。<\/p>\n<h2>产出<\/h2>\n<p>保存策略说明书、代码版本、参数、环境、净值、交易表、指标与已知限制，形成可复现包。<\/p>\n<h2>实战交付：让别人能够独立复现<\/h2>\n<p>围绕“在聚宽/米筐上完成一次完整回测并看懂报告”形成可交付的研究闭环。完工标准不是代码在作者电脑上运行过一次，而是另一位读者能按说明重建环境、运行测试并解释输出。<\/p>\n<ol>\n<li>冻结需求、输入字段、参数、信号时点、成本口径和输出结构。<\/li>\n<li>把数据校验、策略逻辑、账本、指标、日志和异常处理拆成可测试模块。<\/li>\n<li>使用同一份输入分别运行 Python 与 R，实现逐日结果与指标对账。<\/li>\n<li>保留 README、运行命令、测试记录、已知限制和上线前检查清单。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>只交付代码片段而没有输入、环境和运行说明；这不构成可复现产物。<\/li>\n<li>Python 与 R 使用不同默认参数或缺失值规则；跨语言对账必须逐列进行。<\/li>\n<li>把回测通过等同于可实盘；模拟交易、权限隔离、监控和故障恢复仍需独立验收。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>从干净环境可按 README 一次运行成功<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>输入校验和关键逻辑有自动测试<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>Python 与 R 输出在约定容差内一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>日志、监控、异常恢复和风险限制均有文档<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>平台默认参数必须显式记录。<\/li>\n<li>先审计订单，再相信绩效曲线。<\/li>\n<li>回测产出应包含完整可复现材料。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>选择五笔代表性交易，制作信号—订单—成交—持仓的逐项核对表。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第099讲 从回测到模拟交易：让策略跑起来，感受真实冲击<\/strong>。<\/p>"}, {"n": 99, "title": "从回测到模拟交易：让策略跑起来，感受真实冲击", "html": "<h1>第099讲 从回测到模拟交易：让策略跑起来，感受真实冲击<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。实盘交易部署会产生真实损失，必须经过授权、测试和独立风控。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解模拟交易验证的对象与局限。<\/li>\n<li>搭建实时数据、信号、订单和对账链路。<\/li>\n<li>设定从模拟交易到小资金实盘交易的门槛。<\/li>\n<\/ul>\n<h2>模拟交易验证什么<\/h2>\n<p>模拟交易不能证明盈利，却能发现历史回测看不到的运营问题：数据延迟、时区、调度、订单状态、停牌、显性交易费用、重启和通知。<\/p>\n<h2>最小链路<\/h2>\n<blockquote>\n<p>实时数据 → 特征 → 信号 → 风险检查 → 模拟订单 → 成交回报 → 持仓账本 → 监控告警<\/p>\n<\/blockquote>\n<p>每一步记录时间戳与唯一事件 ID，程序重启后能够恢复未完成订单和仓位。<\/p>\n<h2>与回测对账<\/h2>\n<p>每日生成“理论目标—模拟订单—实际模拟持仓”差异。解释信号、价格、显性交易费用和成交偏离，而不是只比较最终净值。<\/p>\n<h2>真实感设置<\/h2>\n<p>使用下一可交易时点、合理滑点、部分成交与订单拒绝；模拟停牌、接口断线和重复推送。过于理想的模拟交易只是另一层回测。<\/p>\n<h2>晋级门槛<\/h2>\n<p>连续运行覆盖足够信号与异常；无未解释账差；告警、恢复和人工接管通过演练；扣除模拟交易成本后的表现仍在预期范围。进入小资金实盘交易后仍应限制品种和风险。<\/p>\n<h2>实战交付：让别人能够独立复现<\/h2>\n<p>围绕“从回测到模拟交易：让策略跑起来，感受真实冲击”形成可交付的研究闭环。完工标准不是代码在作者电脑上运行过一次，而是另一位读者能按说明重建环境、运行测试并解释输出。<\/p>\n<ol>\n<li>冻结需求、输入字段、参数、信号时点、成本口径和输出结构。<\/li>\n<li>把数据校验、策略逻辑、账本、指标、日志和异常处理拆成可测试模块。<\/li>\n<li>使用同一份输入分别运行 Python 与 R，实现逐日结果与指标对账。<\/li>\n<li>保留 README、运行命令、测试记录、已知限制和上线前检查清单。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>只交付代码片段而没有输入、环境和运行说明；这不构成可复现产物。<\/li>\n<li>Python 与 R 使用不同默认参数或缺失值规则；跨语言对账必须逐列进行。<\/li>\n<li>把回测通过等同于可实盘；模拟交易、权限隔离、监控和故障恢复仍需独立验收。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>从干净环境可按 README 一次运行成功<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>输入校验和关键逻辑有自动测试<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>Python 与 R 输出在约定容差内一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>日志、监控、异常恢复和风险限制均有文档<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>模拟交易主要验证实时工程和执行一致性。<\/li>\n<li>理论、订单与持仓必须每日对账。<\/li>\n<li>从模拟交易到实盘交易应依据明确的运营与风险门槛。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>人为制造一次数据中断和一次重复成交回报，检查系统能否告警且不重复记账。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第100讲 策略监控与日志系统：亏钱的时候你得知道为什么<\/strong>。<\/p>"}, {"n": 100, "title": "策略监控与日志系统：亏钱的时候你得知道为什么", "html": "<h1>第100讲 策略监控与日志系统：亏钱的时候你得知道为什么<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。实盘交易部署会产生真实损失，必须经过授权、测试和独立风控。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>设计结构化日志、指标和告警。<\/li>\n<li>区分数据、模型、执行与账户故障。<\/li>\n<li>建立可追溯的故障处置流程。<\/li>\n<\/ul>\n<h2>亏钱时先回答“发生了什么”<\/h2>\n<p>没有日志，只能看净值猜原因。监控系统应让每笔决策从原始数据追溯到信号、风险检查、订单、成交和持仓。<\/p>\n<h2>四类监控<\/h2>\n<ul>\n<li><strong>数据<\/strong>：更新时间、缺失、异常、分布和供应商差异。<\/li>\n<li><strong>模型<\/strong>：特征漂移、信号分布、预测质量和版本。<\/li>\n<li><strong>执行<\/strong>：拒单、延迟、滑点、部分成交和撤单。<\/li>\n<li><strong>账户<\/strong>：现金、持仓、杠杆、盈亏和券商对账。<\/li>\n<\/ul>\n<h2>结构化日志<\/h2>\n<p>至少含时间、策略、版本、事件 ID、资产、输入摘要、信号、目标仓位、风控结果、订单和错误码。使用机器可查询格式而非只写自然语言。<\/p>\n<h2>告警设计<\/h2>\n<p>分信息、警告、严重等级；设置去重和升级，避免告警疲劳。严重事件应有自动降险或停机，但人工可查明触发原因。<\/p>\n<h2>复盘<\/h2>\n<p>每次事故记录时间线、影响、根因、临时处理和永久修复，并补自动测试。日志的目标不是留痕，而是缩短发现与恢复时间。<\/p>\n<h2>实战交付：让别人能够独立复现<\/h2>\n<p>围绕“策略监控与日志系统：亏钱的时候你得知道为什么”形成可交付的研究闭环。完工标准不是代码在作者电脑上运行过一次，而是另一位读者能按说明重建环境、运行测试并解释输出。<\/p>\n<ol>\n<li>冻结需求、输入字段、参数、信号时点、成本口径和输出结构。<\/li>\n<li>把数据校验、策略逻辑、账本、指标、日志和异常处理拆成可测试模块。<\/li>\n<li>使用同一份输入分别运行 Python 与 R，实现逐日结果与指标对账。<\/li>\n<li>保留 README、运行命令、测试记录、已知限制和上线前检查清单。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>只交付代码片段而没有输入、环境和运行说明；这不构成可复现产物。<\/li>\n<li>Python 与 R 使用不同默认参数或缺失值规则；跨语言对账必须逐列进行。<\/li>\n<li>把回测通过等同于可实盘；模拟交易、权限隔离、监控和故障恢复仍需独立验收。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>从干净环境可按 README 一次运行成功<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>输入校验和关键逻辑有自动测试<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>Python 与 R 输出在约定容差内一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>日志、监控、异常恢复和风险限制均有文档<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>监控覆盖数据、模型、执行与账户四层。<\/li>\n<li>结构化日志让每笔交易可追溯。<\/li>\n<li>告警必须对应行动和升级机制。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为“目标仓位与券商持仓不一致”设计检测、告警、自动动作和人工处理手册。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第101讲 策略归因分析：你的收益究竟来自运气还是能力？<\/strong>。<\/p>"}, {"n": 101, "title": "策略归因分析：你的收益究竟来自运气还是能力？", "html": "<h1>第101讲 策略归因分析：你的收益究竟来自运气还是能力？<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。实盘交易部署会产生真实损失，必须经过授权、测试和独立风控。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>区分收益归因与交易复盘。<\/li>\n<li>分解市场、行业、风格、选股和执行贡献。<\/li>\n<li>判断收益来自能力、风险还是偶然。<\/li>\n<\/ul>\n<h2>净收益不是单一来源<\/h2>\n<p>组合收益可能来自市场上涨、行业偏离、价值或动量暴露、个股选择、择时、杠杆和执行。归因把结果拆到可管理的决策层。<\/p>\n<h2>持仓归因<\/h2>\n<p>相对基准可分配、选择与交互效应；因子归因用市场、行业和风格回归解释收益。两者口径不同，可互相补充。<\/p>\n<h2>交易归因<\/h2>\n<p>比较决策价、到达价、实际成交价与后续价格，区分信号质量、延迟、市场冲击和显性交易费用。策略研究正确也可能被执行损耗。<\/p>\n<h2>运气与能力<\/h2>\n<p>看长期、多环境、样本外和重复决策。少数大额收益、意外 Beta 或单一行业贡献都降低“稳定能力”的证据。<\/p>\n<h2>归因闭环<\/h2>\n<p>将每个收益来源对应到负责人和可控动作：信号、组合、执行或风险。归因不是把所有误差归为“选股”，而是推动下一轮改进。<\/p>\n<h2>报告<\/h2>\n<p>按日、月和回撤期生成贡献，确保各部分加总回组合收益，并记录无法解释项。<\/p>\n<h2>实战交付：让别人能够独立复现<\/h2>\n<p>围绕“策略归因分析：你的收益究竟来自运气还是能力？”形成可交付的研究闭环。完工标准不是代码在作者电脑上运行过一次，而是另一位读者能按说明重建环境、运行测试并解释输出。<\/p>\n<ol>\n<li>冻结需求、输入字段、参数、信号时点、成本口径和输出结构。<\/li>\n<li>把数据校验、策略逻辑、账本、指标、日志和异常处理拆成可测试模块。<\/li>\n<li>使用同一份输入分别运行 Python 与 R，实现逐日结果与指标对账。<\/li>\n<li>保留 README、运行命令、测试记录、已知限制和上线前检查清单。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>只交付代码片段而没有输入、环境和运行说明；这不构成可复现产物。<\/li>\n<li>Python 与 R 使用不同默认参数或缺失值规则；跨语言对账必须逐列进行。<\/li>\n<li>把回测通过等同于可实盘；模拟交易、权限隔离、监控和故障恢复仍需独立验收。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>从干净环境可按 README 一次运行成功<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>输入校验和关键逻辑有自动测试<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>Python 与 R 输出在约定容差内一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>日志、监控、异常恢复和风险限制均有文档<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>收益应分解为系统性暴露、主动选择和执行。<\/li>\n<li>一次高收益不能区分能力与运气。<\/li>\n<li>归因必须加总一致并连接可行动决策。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>选择一个月收益，按市场、行业、风格、个股与成本分解并检查残差。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第102讲 策略上线前最后的检查清单，避免灾难性错误<\/strong>。<\/p>"}, {"n": 102, "title": "策略上线前最后的检查清单，避免灾难性错误", "html": "<h1>第102讲 策略上线前最后的检查清单，避免灾难性错误<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。实盘交易部署会产生真实损失，必须经过授权、测试和独立风控。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>完成数据、模型、工程、风险和运营五类检查。<\/li>\n<li>明确上线批准与回滚条件。<\/li>\n<li>形成可签署的发布清单。<\/li>\n<\/ul>\n<h2>上线是风险事件<\/h2>\n<p>策略从研究进入真实账户后，错误会变成现金流。上线清单的作用是阻止“大家都以为别人检查过”。<\/p>\n<h2>数据<\/h2>\n<p>来源、许可、时区、复权、公告时间、缺失与备用源已确认；历史与实时字段一致；断流和异常能告警。<\/p>\n<h2>模型<\/h2>\n<p>代码锁定、无前视、样本外与稳健性通过；参数来源清楚；特征和预测有漂移阈值；已知失效环境记录。<\/p>\n<h2>执行<\/h2>\n<p>订单类型、最小单位、涨跌停、停牌、部分成交、重复回报、重启恢复和撤单已测试；交易成本与容量压力后仍可接受。<\/p>\n<h2>风险<\/h2>\n<p>单资产、行业、因子、杠杆、流动性、回撤和压力损失限额已配置；限额在独立层执行；紧急停机与减仓可用。<\/p>\n<h2>运营<\/h2>\n<p>权限最小化、密钥安全、时钟同步、监控值班、券商对账、版本发布和事故手册完备。<\/p>\n<h2>发布与回滚<\/h2>\n<p>采用小资金、少品种、分阶段放量；记录批准人、版本和生效时间。回滚到上一版本与清仓不是同一动作，都需预案。<\/p>\n<h2>最后问题<\/h2>\n<p>如果负责人今天无法上线，你能否仅凭文档安全运行和停止系统？若不能，项目还未准备好。<\/p>\n<h2>实战交付：让别人能够独立复现<\/h2>\n<p>围绕“策略上线前最后的检查清单，避免灾难性错误”形成可交付的研究闭环。完工标准不是代码在作者电脑上运行过一次，而是另一位读者能按说明重建环境、运行测试并解释输出。<\/p>\n<ol>\n<li>冻结需求、输入字段、参数、信号时点、成本口径和输出结构。<\/li>\n<li>把数据校验、策略逻辑、账本、指标、日志和异常处理拆成可测试模块。<\/li>\n<li>使用同一份输入分别运行 Python 与 R，实现逐日结果与指标对账。<\/li>\n<li>保留 README、运行命令、测试记录、已知限制和上线前检查清单。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>只交付代码片段而没有输入、环境和运行说明；这不构成可复现产物。<\/li>\n<li>Python 与 R 使用不同默认参数或缺失值规则；跨语言对账必须逐列进行。<\/li>\n<li>把回测通过等同于可实盘；模拟交易、权限隔离、监控和故障恢复仍需独立验收。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>从干净环境可按 README 一次运行成功<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>输入校验和关键逻辑有自动测试<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>Python 与 R 输出在约定容差内一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>日志、监控、异常恢复和风险限制均有文档<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>上线清单覆盖数据、模型、执行、风险和运营。<\/li>\n<li>发布应分阶段，并具有明确回滚与停机方案。<\/li>\n<li>职责、版本和批准必须可审计。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>把本讲清单转成表格，为每项填写证据链接、负责人、状态和阻塞原因。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第103讲 量化交易的十大经典谎言，你信过几个？<\/strong>。<\/p>"}]}, {"no": 11, "name": "破妄·避坑与心法", "desc": "最后四期回归思想层面，帮你建立长期正确的量化价值观。", "chapters": [{"n": 103, "title": "量化交易的十大经典谎言，你信过几个？", "html": "<h1>第103讲 量化交易的十大经典谎言，你信过几个？<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。任何模型、平台或自动化工具都不能消除亏损与运营风险。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>识别量化营销中的十类误导表述。<\/li>\n<li>用证据、口径和激励审查收益故事。<\/li>\n<li>建立产品与策略尽调问题。<\/li>\n<\/ul>\n<h2>谎言一：量化可以消除情绪<\/h2>\n<p>系统能减少临场冲动，但人仍会选择数据、参数、仓位和停机时点。情绪可能从下单环节转移到模型修改环节。<\/p>\n<h2>谎言二：回测收益就是可获得收益<\/h2>\n<p>真实世界有显性交易费用、滑点、市场冲击、容量、借券、延迟和无法成交。回测是条件模拟，不是可兑现报价。<\/p>\n<h2>谎言三：高胜率代表低风险<\/h2>\n<p>卖出尾部风险的策略可以长期高胜率、偶尔巨亏。必须同时看盈亏比、偏度和压力损失。<\/p>\n<h2>谎言四：复杂模型一定更先进<\/h2>\n<p>复杂度增加表达能力，也增加过拟合、解释和维护成本。只有样本外增量才能为复杂度买单。<\/p>\n<h2>谎言五：AI 会自动发现 Alpha<\/h2>\n<p>AI 学习的是数据中的模式，也会学习泄漏、口径和历史噪声。问题定义与数据治理仍由人负责。<\/p>\n<h2>谎言六：分散持有很多股票就安全<\/h2>\n<p>共同市场、行业和风格暴露会让证券数量很多、风险来源很少。应看风险贡献。<\/p>\n<h2>谎言七：止损保证最大亏损<\/h2>\n<p>跳空、停牌和流动性会让成交穿过止损价。止损是规则，不是保险合同。<\/p>\n<h2>谎言八：市场中性就没有风险<\/h2>\n<p>Beta 会漂移，相关会突变，杠杆和多空两侧都可能亏损。中性需要持续管理。<\/p>\n<h2>谎言九：历史更长一定更可靠<\/h2>\n<p>制度变化会让旧样本失去代表性。长度、质量和相关环境必须共同考虑。<\/p>\n<h2>谎言十：好策略可以永久保密并稳定复制<\/h2>\n<p>优势会因资金规模、竞争、成本和市场结构衰减。任何持续承诺都应接受容量与失效审查。<\/p>\n<h2>识别框架<\/h2>\n<p>遇到诱人表述，追问数据时间、样本外、交易成本、最坏回撤、实盘交易证据、容量、利益激励和失败条件。越回避这些问题，越需要谨慎。<\/p>\n<h2>决策复盘：证据、边界与治理<\/h2>\n<p>面对“量化交易的十大经典谎言，你信过几个？”，最重要的能力是把叙事和证据分开。用下面的复盘框架检查一个结论是否可证伪、可追踪，并能在失效时及时退出。<\/p>\n<ol>\n<li>写出主张、证据来源、隐含假设和利益相关方。<\/li>\n<li>寻找反例、失败样本和替代解释，避免只收集支持材料。<\/li>\n<li>预先定义失效信号、观察窗口、暂停条件和重新启用条件。<\/li>\n<li>记录谁有权修改模型、覆盖规则或批准上线，并保留完整决策日志。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用结果好坏替代过程判断；短期盈利也可能来自错误暴露或运气。<\/li>\n<li>失败后不断修改故事而不承认假设被推翻；应使用预先写下的判据。<\/li>\n<li>只讨论模型、不讨论组织和权限；许多灾难来自执行、监控和治理缺口。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>主张与证据可以逐条对应<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少记录一个反例和一种替代解释<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>失效、暂停与恢复条件已预先定义<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>关键人工决策具备权限控制和审计记录<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>量化减少部分人为偏差，但不消除判断与风险。<\/li>\n<li>收益宣传必须与数据口径、成本、容量和尾部一起看。<\/li>\n<li>最危险的谎言通常把条件性结果包装成确定承诺。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>找一段策略宣传，用本讲十项逐条标注其提供了什么证据、缺少什么证据。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第104讲 回测完美，实盘交易残酷——诊断模型失效的几大信号<\/strong>。<\/p>"}, {"n": 104, "title": "回测完美，实盘交易残酷——诊断模型失效的几大信号", "html": "<h1>第104讲 回测完美，实盘交易残酷——诊断模型失效的几大信号<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。任何模型、平台或自动化工具都不能消除亏损与运营风险。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>系统诊断回测与实盘交易差异。<\/li>\n<li>区分数据、执行、模型和容量问题。<\/li>\n<li>建立从告警到降险的排查顺序。<\/li>\n<\/ul>\n<h2>实盘交易差，不一定先怪模型<\/h2>\n<p>回测到实盘交易的差异可分四层。诊断应从最可验证的运营事实开始，避免一亏损就重新调参。<\/p>\n<h2>第一层：数据<\/h2>\n<p>检查字段、复权、时区、实时延迟、缺失、供应商修订和股票池。历史与实时口径不一致会直接改变信号。<\/p>\n<h2>第二层：执行<\/h2>\n<p>比较理论价、订单价和成交价，分析滑点、市场冲击、部分成交、拒单、借券和延迟。容量超出后，收益常随规模恶化。<\/p>\n<h2>第三层：实现<\/h2>\n<p>核对代码版本、参数、调度、状态恢复和持仓账本。研究代码与生产代码的细小差异可能长期累积。<\/p>\n<h2>第四层：模型<\/h2>\n<p>若前三层正常，再看特征分布、IC、因子暴露和市场状态。判断是正常回撤、优势衰减还是结构断裂。<\/p>\n<h2>几个失效信号<\/h2>\n<p>交易成本占毛收益持续上升；信号排序能力跨资产同步下降；风险暴露偏离；收益只靠意外 Beta；实盘交易偏差超过模拟交易区间；关键数据机制变化。<\/p>\n<h2>处置<\/h2>\n<p>先冻结扩仓和保护账户，再收集证据；按预案降险、影子运行和复盘。不要用新的历史参数解释刚发生的每一次损失。<\/p>\n<h2>决策复盘：证据、边界与治理<\/h2>\n<p>面对“回测完美，实盘交易残酷——诊断模型失效的几大信号”，最重要的能力是把叙事和证据分开。用下面的复盘框架检查一个结论是否可证伪、可追踪，并能在失效时及时退出。<\/p>\n<ol>\n<li>写出主张、证据来源、隐含假设和利益相关方。<\/li>\n<li>寻找反例、失败样本和替代解释，避免只收集支持材料。<\/li>\n<li>预先定义失效信号、观察窗口、暂停条件和重新启用条件。<\/li>\n<li>记录谁有权修改模型、覆盖规则或批准上线，并保留完整决策日志。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用结果好坏替代过程判断；短期盈利也可能来自错误暴露或运气。<\/li>\n<li>失败后不断修改故事而不承认假设被推翻；应使用预先写下的判据。<\/li>\n<li>只讨论模型、不讨论组织和权限；许多灾难来自执行、监控和治理缺口。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>主张与证据可以逐条对应<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少记录一个反例和一种替代解释<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>失效、暂停与恢复条件已预先定义<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>关键人工决策具备权限控制和审计记录<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>诊断顺序应是数据、执行、实现、模型。<\/li>\n<li>正常回撤与结构失效需要统计和机制证据区分。<\/li>\n<li>先保护账户，再修改模型。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>制作一张实盘交易偏差排查树，为每个节点定义证据、负责人和最大处理时间。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第105讲 何时该坚持，何时该放弃一个策略？<\/strong>。<\/p>"}, {"n": 105, "title": "何时该坚持，何时该放弃一个策略？", "html": "<h1>第105讲 何时该坚持，何时该放弃一个策略？<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。任何模型、平台或自动化工具都不能消除亏损与运营风险。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>建立坚持、降险、暂停和退役的分级标准。<\/li>\n<li>区分结果波动与机制破坏。<\/li>\n<li>避免沉没成本和短期追逐。<\/li>\n<\/ul>\n<h2>坚持不是忍耐，放弃也不是止损冲动<\/h2>\n<p>正期望策略会亏损，失效策略也会偶尔反弹。决策应基于事先定义的证据，而不是最近盈亏带来的情绪。<\/p>\n<h2>四类证据<\/h2>\n<ul>\n<li><strong>统计<\/strong>：回撤、命中、IC 和成本是否仍在预期分布。<\/li>\n<li><strong>经济<\/strong>：优势来源与对手方行为是否仍存在。<\/li>\n<li><strong>市场结构<\/strong>：规则、参与者、技术或容量是否改变。<\/li>\n<li><strong>运营<\/strong>：数据和执行是否可靠。<\/li>\n<\/ul>\n<h2>四级动作<\/h2>\n<ol>\n<li><strong>继续<\/strong>：表现处于预期范围，机制与运营正常。<\/li>\n<li><strong>降险<\/strong>：证据减弱但未破坏，减少仓位并加强观察。<\/li>\n<li><strong>暂停<\/strong>：偏差超限或原因不明，影子组合继续运行。<\/li>\n<li><strong>退役<\/strong>：机制消失、成本吞噬优势或无法安全执行。<\/li>\n<\/ol>\n<h2>常见错误<\/h2>\n<p>因短期亏损停掉所有趋势策略，属于结果追逐；因投入多年拒绝退役，属于沉没成本；看到新参数修复历史后立即恢复，则是二次过拟合。<\/p>\n<h2>预先承诺<\/h2>\n<p>研究阶段就写下预期回撤、监控指标、评审周期和决策权限。退役后保留代码与日志，防止同一失败想法换名重来。<\/p>\n<h2>决策复盘：证据、边界与治理<\/h2>\n<p>面对“何时该坚持，何时该放弃一个策略？”，最重要的能力是把叙事和证据分开。用下面的复盘框架检查一个结论是否可证伪、可追踪，并能在失效时及时退出。<\/p>\n<ol>\n<li>写出主张、证据来源、隐含假设和利益相关方。<\/li>\n<li>寻找反例、失败样本和替代解释，避免只收集支持材料。<\/li>\n<li>预先定义失效信号、观察窗口、暂停条件和重新启用条件。<\/li>\n<li>记录谁有权修改模型、覆盖规则或批准上线，并保留完整决策日志。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用结果好坏替代过程判断；短期盈利也可能来自错误暴露或运气。<\/li>\n<li>失败后不断修改故事而不承认假设被推翻；应使用预先写下的判据。<\/li>\n<li>只讨论模型、不讨论组织和权限；许多灾难来自执行、监控和治理缺口。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>主张与证据可以逐条对应<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少记录一个反例和一种替代解释<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>失效、暂停与恢复条件已预先定义<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>关键人工决策具备权限控制和审计记录<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>坚持与放弃都应由统计、机制、结构和运营证据驱动。<\/li>\n<li>分级动作比只有运行/关闭两个按钮更稳健。<\/li>\n<li>阈值和权限应在亏损前定义。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为一个策略写四级决策表，每级包含触发条件、仓位、观察期和审批人。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第106讲 量化的未来：AI进化、监管冲击与你的个人位置<\/strong>。<\/p>"}, {"n": 106, "title": "量化的未来：AI进化、监管冲击与你的个人位置", "html": "<h1>第106讲 量化的未来：AI进化、监管冲击与你的个人位置<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。任何模型、平台或自动化工具都不能消除亏损与运营风险。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>从能力、市场结构和治理理解量化未来。<\/li>\n<li>识别 AI 提升效率与放大风险的两面。<\/li>\n<li>制定个人长期学习与定位路线。<\/li>\n<\/ul>\n<h2>未来不是“人或 AI”二选一<\/h2>\n<p>AI 会降低代码、研究检索、特征构造和报告生成门槛，让更多人能建立自动化流程。门槛下降后，简单公开信号会更快拥挤，差异转向独有数据、问题定义、执行、风险与组织纪律。<\/p>\n<h2>模型将更像系统而非单点预测<\/h2>\n<p>未来竞争不只是哪个模型精度更高，而是谁能把数据血缘、研究、组合、执行、监控和审计连成可靠闭环。可重现、可解释和可停止与预测能力同样重要。<\/p>\n<h2>AI 的新风险<\/h2>\n<p>模型可能生成看似合理但错误的代码与解释；代理自动调用数据和交易接口，会放大权限、提示注入、供应链和错误执行风险。关键操作需要最小权限、人工批准、隔离测试和完整日志。<\/p>\n<h2>监管与治理方向<\/h2>\n<p>随着自动化程度提高，机构会更重视数据授权、模型验证、决策留痕、责任划分、市场公平和系统稳定。具体规则会随市场变化，但“谁批准、为何决策、如何停止”将越来越重要。<\/p>\n<h2>个人的位置<\/h2>\n<p>不必与大型机构拼算力和速度。可以选择长周期、小容量、细分领域、透明工具或服务真实业务流程。长期稀缺能力包括：金融机制理解、数据工程、统计判断、软件可靠性和风险沟通。<\/p>\n<h2>一条可持续路线<\/h2>\n<ol>\n<li>能把模糊观点写成可证伪假设。<\/li>\n<li>能独立核对数据与回测时点。<\/li>\n<li>能把信号变成有约束组合。<\/li>\n<li>能运行、监控、归因并安全停止系统。<\/li>\n<li>能诚实说明模型不知道什么。<\/li>\n<\/ol>\n<h2>课程终点<\/h2>\n<p>106 讲不是为了收集更多指标，而是建立一套面对不确定性的工作方法：先定义问题，再寻找证据；先保证生存，再追求收益；让机器执行纪律，让人承担判断与责任。<\/p>\n<h2>决策复盘：证据、边界与治理<\/h2>\n<p>面对“量化的未来：AI进化、监管冲击与你的个人位置”，最重要的能力是把叙事和证据分开。用下面的复盘框架检查一个结论是否可证伪、可追踪，并能在失效时及时退出。<\/p>\n<ol>\n<li>写出主张、证据来源、隐含假设和利益相关方。<\/li>\n<li>寻找反例、失败样本和替代解释，避免只收集支持材料。<\/li>\n<li>预先定义失效信号、观察窗口、暂停条件和重新启用条件。<\/li>\n<li>记录谁有权修改模型、覆盖规则或批准上线，并保留完整决策日志。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用结果好坏替代过程判断；短期盈利也可能来自错误暴露或运气。<\/li>\n<li>失败后不断修改故事而不承认假设被推翻；应使用预先写下的判据。<\/li>\n<li>只讨论模型、不讨论组织和权限；许多灾难来自执行、监控和治理缺口。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>主张与证据可以逐条对应<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少记录一个反例和一种替代解释<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>失效、暂停与恢复条件已预先定义<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>关键人工决策具备权限控制和审计记录<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>AI 会降低工具门槛，也会加速公开优势衰减。<\/li>\n<li>未来量化核心是完整、可治理的决策系统。<\/li>\n<li>个人优势可来自细分问题、长周期、可靠工程与风险纪律。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>写一份未来两年的个人路线图：一个金融机制、一个数据能力、一个工程能力和一个可上线项目，并为每项定义可验证产出。<\/p>"}]}]</script>
<script>
const BOOK = JSON.parse(document.getElementById('book-data').textContent);
const flat = [];
const byNo = {};
BOOK.forEach(m => m.chapters.forEach(c => {
  c.moduleNo = m.no; c.moduleName = m.name;
  flat.push(c); byNo[c.n] = c;
}));

const $ = s => document.querySelector(s);
const views = { cover: $('#view-cover'), toc: $('#view-toc'), reader: $('#view-reader') };
const readerScroll = $('#reader-scroll');
let current = null;

/* ---- 主题 ---- */
const THEME_KEY = 'q100:theme';
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  $('#theme-toggle').textContent = t === 'night' ? '日间' : '夜间';
}
applyTheme(localStorage.getItem(THEME_KEY) || 'day');
$('#theme-toggle').onclick = () => {
  const t = document.documentElement.getAttribute('data-theme') === 'night' ? 'day' : 'night';
  localStorage.setItem(THEME_KEY, t); applyTheme(t);
};

/* ---- 目录渲染 ---- */
function renderTOC(){
  const el = $('#toc-list'); let h = '';
  BOOK.forEach(m => {
    h += '<div class="toc-mod"><div class="toc-mod-head">'
      + '<span class="toc-mod-no">模块 ' + String(m.no).padStart(2,'0') + '</span>'
      + '<span class="toc-mod-name">' + esc(m.name) + '</span></div>';
    if (m.desc) h += '<div class="toc-mod-desc">' + esc(m.desc) + '</div>';
    m.chapters.forEach(c => {
      h += '<a class="toc-ch" href="#ch-' + c.n + '"><span class="cno">第'
        + String(c.n).padStart(3,'0') + '讲</span><span class="ctt">' + esc(c.title) + '</span></a>';
    });
    h += '</div>';
  });
  el.innerHTML = h;

  const d = $('#drawer-list'); let dh = '';
  BOOK.forEach(m => {
    dh += '<div class="drawer-mod">模块 ' + String(m.no).padStart(2,'0') + ' · ' + esc(m.name) + '</div>';
    m.chapters.forEach(c => {
      dh += '<a class="drawer-ch" data-n="' + c.n + '" href="#ch-' + c.n + '"><span class="cno">'
        + String(c.n).padStart(3,'0') + '</span><span class="ctt">' + esc(c.title) + '</span></a>';
    });
  });
  d.innerHTML = dh;
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---- 章节渲染 ---- */
function renderChapter(n){
  const c = byNo[n]; if (!c) return;
  current = c;
  const open = '<header class="chapter-opener">'
    + '<div class="op-module">模块 ' + String(c.moduleNo).padStart(2,'0') + ' · ' + esc(c.moduleName) + '</div>'
    + '<div class="op-no">第 <b>' + String(c.n).padStart(3,'0') + '</b> 讲</div>'
    + '<h1 class="op-title">' + esc(c.title) + '</h1>'
    + '</header>';
  $('#page').innerHTML = open + '<div class="chapter-body">' + c.html + '</div>';
  $('#topbar-title').textContent = '第 ' + String(c.n).padStart(3,'0') + ' 讲 · ' + c.title;

  const i = flat.indexOf(c), prev = flat[i-1], next = flat[i+1];
  $('#chapnav').innerHTML =
    '<button class="btn" id="nav-prev" ' + (prev?'':'disabled') + '><span class="nav-label">上一讲</span>'
      + '<span class="nav-title">' + (prev ? esc(prev.title) : '已是第一讲') + '</span></button>'
    + '<button class="btn" id="nav-toc"><span class="nav-label">返回</span><span class="nav-title">目录</span></button>'
    + '<button class="btn" id="nav-next" ' + (next?'':'disabled') + '><span class="nav-label">下一讲</span>'
      + '<span class="nav-title">' + (next ? esc(next.title) : '已是最后一讲') + '</span></button>';
  if (prev) $('#nav-prev').onclick = () => go(prev.n);
  if (next) $('#nav-next').onclick = () => go(next.n);
  $('#nav-toc').onclick = () => location.hash = '#toc';

  document.querySelectorAll('.drawer-ch').forEach(a =>
    a.classList.toggle('active', +a.dataset.n === n));

  readerScroll.scrollTop = 0;
  updateProgress();
  localStorage.setItem('q100:last', n);
}

function updateProgress(){
  const max = readerScroll.scrollHeight - readerScroll.clientHeight;
  const p = max > 0 ? Math.min(100, Math.round(readerScroll.scrollTop / max * 100)) : 0;
  $('#read-progress-bar').style.width = p + '%';
  $('#read-percent').textContent = p + '%';
}
readerScroll.addEventListener('scroll', updateProgress, { passive: true });
window.addEventListener('resize', updateProgress);

/* ---- 视图切换 / 路由 ---- */
function show(name){
  Object.values(views).forEach(v => v.classList.remove('active'));
  views[name].classList.add('active');
}
function go(n){ location.hash = '#ch-' + n; }
function route(){
  const h = location.hash;
  if (h.indexOf('#ch-') === 0){
    const n = parseInt(h.slice(4), 10);
    if (byNo[n]) { show('reader'); renderChapter(n); closeDrawer(); return; }
  }
  if (h === '#toc'){ show('toc'); window.scrollTo(0,0); return; }
  show('cover'); window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);

/* ---- 顶部/封面按钮 ---- */
$('#start-read').onclick = () => {
  const last = +localStorage.getItem('q100:last');
  go(byNo[last] ? last : flat[0].n);
};
$('#goto-toc').onclick = () => location.hash = '#toc';
$('#toc-back').onclick = () => location.hash = '#cover';

/* ---- 侧栏 ---- */
function openDrawer(){ $('#drawer').classList.add('open'); $('#scrim').classList.add('open'); }
function closeDrawer(){ $('#drawer').classList.remove('open'); $('#scrim').classList.remove('open'); }
$('#open-drawer').onclick = openDrawer;
$('#close-drawer').onclick = closeDrawer;
$('#scrim').onclick = closeDrawer;

/* ---- 键盘翻页 ---- */
document.addEventListener('keydown', e => {
  if (!views.reader.classList.contains('active')) return;
  if (e.key === 'Escape') closeDrawer();
  if (e.target.tagName === 'INPUT') return;
  const i = flat.indexOf(current);
  if (e.key === 'ArrowRight' && flat[i+1]) go(flat[i+1].n);
  if (e.key === 'ArrowLeft' && flat[i-1]) go(flat[i-1].n);
});

/* ---- 启动 ---- */
renderTOC();
const last = +localStorage.getItem('q100:last');
if (byNo[last]){
  $('#start-read').textContent = '继续阅读 · 第' + String(last).padStart(3,'0') + '讲';
}
route();
</script>
</body>
</html>
