<strong>第036讲 反转策略：均值回归的魔法，跌多了会涨吗？<\/strong>。<\/p>"}, {"n": 36, "title": "反转策略：均值回归的魔法，跌多了会涨吗？", "html": "<h1>第036讲 反转策略：均值回归的魔法，跌多了会涨吗？<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>区分短期反转与长期均值回归。<\/li>\n<li>理解回归均值必须先定义均值。<\/li>\n<li>识别价值陷阱和趋势对抗风险。<\/li>\n<\/ul>\n<h2>“跌多了会涨”缺少什么<\/h2>\n<p>均值回归必须说明变量、均值和回归时间。价格水平没有固定均值，价差、估值偏离或标准化残差才可能具有相对稳定中心。<\/p>\n<h2>短期反转<\/h2>\n<p>短期极端收益后的反向变化可能来自流动性冲击、过度反应或临时订单失衡。实施时要排除停牌、涨跌停、重大事件和无法成交资产。<\/p>\n<h2>长期反转<\/h2>\n<p>多年输家未来可能改善，但也可能是基本面持续恶化。长期反转常混合价值、困境和风险暴露，持有期长且不确定性大。<\/p>\n<h2>标准化信号<\/h2>\n<p>常见形式为 z-score：(z=(x-\\mu)/\\sigma)。当偏离超过阈值进场、回到中心退出。均值和波动只能用滚动历史估计。<\/p>\n<h2>主要风险<\/h2>\n<p>趋势可能持续，均值本身会移动，低估值可能是信息而非错价。应设置持有上限、止损、基本面过滤和组合分散。<\/p>\n<p>均值回归不是“越跌越买”，而是对一个有稳定机制的偏离做有限风险下注。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“反转策略：均值回归的魔法，跌多了会涨吗？”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>均值回归必须明确被回归变量和时间尺度。<\/li>\n<li>价格下跌不自动等于偏离，可能反映永久信息。<\/li>\n<li>滚动标准化、持有上限和机制解释是关键。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为一个价差序列计算滚动 z-score，设计进场、退出和最大持有期，并检查均值是否发生结构变化。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第037讲 RSI超买超卖：从技术指标到量化信号的改造<\/strong>。<\/p>"}, {"n": 37, "title": "RSI超买超卖：从技术指标到量化信号的改造", "html": "<h1>第037讲 RSI超买超卖：从技术指标到量化信号的改造<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解 RSI 的计算与范围。<\/li>\n<li>把超买超卖从标签改成条件策略。<\/li>\n<li>检验趋势与震荡环境差异。<\/li>\n<\/ul>\n<h2>RSI 如何计算<\/h2>\n<p>RSI 比较一段窗口内平均上涨与平均下跌，常写为 (RS=AvgGain/AvgLoss)，(RSI=100-100/(1+RS))。平滑方法不同会产生不同数值，代码必须固定口径。<\/p>\n<h2>超买不等于马上下跌<\/h2>\n<p>RSI 高表示近期上涨相对强，强趋势中可长期保持高位。将 70 机械视为卖出、30 视为买入，可能持续逆势。<\/p>\n<h2>两种用法<\/h2>\n<ul>\n<li><strong>均值回归<\/strong>：低 RSI 后价格确认企稳再买入。<\/li>\n<li><strong>趋势确认<\/strong>：高 RSI 作为强势条件，而非反向信号。<\/li>\n<\/ul>\n<p>两者逻辑相反，应分别测试。<\/p>\n<h2>量化实现<\/h2>\n<p>定义阈值穿越、持有期、过滤条件和执行时点；使用参数区间而非只看 14、30、70。比较 RSI 相对简单过去收益是否增加信息。<\/p>\n<h2>风险<\/h2>\n<p>极端事件、跌停和持续趋势会让逆向策略累积损失。单一震荡样本中的漂亮结果不代表跨环境稳定。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“RSI超买超卖：从技术指标到量化信号的改造”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>RSI 衡量窗口内上涨与下跌的相对强度。<\/li>\n<li>高低阈值不是自动反转预言。<\/li>\n<li>趋势确认与均值回归版本必须分开验证。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>构建 RSI 低位反转与高位趋势两个策略，在趋势期和震荡期分别比较。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第038讲 通道突破与波动率突破：捕捉趋势爆发的瞬间<\/strong>。<\/p>"}, {"n": 38, "title": "通道突破与波动率突破：捕捉趋势爆发的瞬间", "html": "<h1>第038讲 通道突破与波动率突破：捕捉趋势爆发的瞬间<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>区分价格通道突破与波动率突破。<\/li>\n<li>理解阈值应随风险尺度调整。<\/li>\n<li>设计真实可成交的爆发行情策略。<\/li>\n<\/ul>\n<h2>两种突破<\/h2>\n<p>价格通道突破以过去高低点为边界；波动率突破则以开盘价或参考价加减波动单位，例如 (Trigger=Open+k\\times ATR)。前者关注历史极值，后者关注当日移动是否超出正常范围。<\/p>\n<h2>为什么要标准化<\/h2>\n<p>同样上涨 2%，对低波资产可能异常，对高波资产可能普通。使用 ATR 或滚动波动能让不同资产的阈值更可比。<\/p>\n<h2>执行现实<\/h2>\n<p>跳空可能直接越过触发价，实际成交更差；盘中同时触及上下边界时，日线数据无法确定顺序。应使用更细数据或保守成交假设。<\/p>\n<h2>过滤与退出<\/h2>\n<p>可结合长期趋势方向、流动性和波动收缩状态。退出可用反向通道、移动止损或时间止损。每个条件都要评估增量，而不是堆叠到历史完美。<\/p>\n<h2>组合管理<\/h2>\n<p>突破常在市场压力期同步触发，跨资产相关性会突然变化。必须限制相关组风险和总杠杆。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“通道突破与波动率突破：捕捉趋势爆发的瞬间”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>通道突破看历史极值，波动率突破看相对正常波动的超越。<\/li>\n<li>波动标准化改善跨资产比较。<\/li>\n<li>跳空、盘内顺序和同步触发是核心实盘交易风险。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>设计一个开盘价加 ATR 的突破策略，并明确跳空超过触发价时的成交规则。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第039讲 配对交易（上）：如何寻找两只“兄弟股”？<\/strong>。<\/p>"}, {"n": 39, "title": "配对交易（上）：如何寻找两只“兄弟股”？", "html": "<h1>第039讲 配对交易（上）：如何寻找两只“兄弟股”？<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解配对交易的相对价值逻辑。<\/li>\n<li>掌握候选对筛选的经济与统计条件。<\/li>\n<li>避免仅凭高相关选兄弟股。<\/li>\n<\/ul>\n<h2>配对交易不押市场方向<\/h2>\n<p>配对交易同时持有一多一空，试图从两资产相对价格回归中获利。理想情况下，市场共同涨跌被部分对冲，收益来自价差变化。<\/p>\n<h2>高相关不等于可配对<\/h2>\n<p>相关性描述收益同步，价格仍可能长期分离。候选对更需要稳定经济联系，例如同类业务、同一供应链、双重上市或可替代资产。<\/p>\n<h2>筛选流程<\/h2>\n<ol>\n<li>先按行业、商业模式和交易机制缩小范围。<\/li>\n<li>检查流动性、做空可得性和公司行动。<\/li>\n<li>估计对冲比例，构造价差。<\/li>\n<li>检查价差稳定性、半衰期和结构断点。<\/li>\n<li>保留样本外验证。<\/li>\n<\/ol>\n<h2>交易信号<\/h2>\n<p>对价差做滚动 z-score，极端偏离时建立相对头寸，回到中心时退出。阈值、持有期和止损必须与价差机制匹配。<\/p>\n<h2>主要风险<\/h2>\n<p>并购、财务危机和业务分化会让“兄弟”永久分家；借券费和召回也可能摧毁纸面利润。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“配对交易（上）：如何寻找两只“兄弟股”？”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>配对交易赚取相对价差回归，而非单边方向。<\/li>\n<li>经济联系和稳定价差比高相关更重要。<\/li>\n<li>做空成本、结构断点和公司事件必须进入设计。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>选择同一行业两只股票，先写经济联系，再比较收益相关和价格价差，解释是否适合配对。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第040讲 配对交易（下）：协整关系与对冲比例计算<\/strong>。<\/p>"}, {"n": 40, "title": "配对交易（下）：协整关系与对冲比例计算", "html": "<h1>第040讲 配对交易（下）：协整关系与对冲比例计算<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解协整与相关性的区别。<\/li>\n<li>估计对冲比例并构造价差。<\/li>\n<li>识别协整检验的数据挖掘风险。<\/li>\n<\/ul>\n<h2>协整解决什么问题<\/h2>\n<p>两个价格序列可以各自非平稳，但某个线性组合 (s_t=y_t-\\beta x_t) 相对平稳，称存在协整关系。它表达长期约束，而不是短期同步。<\/p>\n<h2>两步法直觉<\/h2>\n<p>先用历史数据估计 (y=\\alpha+\\beta x+\\varepsilon)，再检验残差 (\\varepsilon) 是否平稳。(\\beta) 是统计对冲比例，不一定等于金额一比一。<\/p>\n<h2>半衰期<\/h2>\n<p>若价差近似均值回归，可估计偏离衰减速度，用于选择持有窗口。但半衰期是样本估计，结构变化后会失真。<\/p>\n<h2>滚动实现<\/h2>\n<p>对冲比例和均值必须在滚动窗口中估计，不能用全样本参数交易过去。交易前还应对权重变化设置缓冲，避免频繁再对冲。<\/p>\n<h2>多重检验<\/h2>\n<p>从数千组合中挑通过检验的一对，会产生严重数据挖掘。先用经济逻辑缩小候选，再进行样本外、断点和成本检验。<\/p>\n<p>协整是建模工具，不是两家公司永远绑定的契约。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“配对交易（下）：协整关系与对冲比例计算”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>协整描述非平稳价格间的稳定线性组合。<\/li>\n<li>对冲比例必须滚动、仅用当时数据估计。<\/li>\n<li>批量筛选需要控制多重检验与结构断点。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>用滚动窗口估计一对价格的对冲系数 (\\beta)，构造残差并观察参数和均值是否随时间稳定。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第041讲 统计套利：不预测涨跌方向，只收割价差回归<\/strong>。<\/p>"}, {"n": 41, "title": "统计套利：不预测涨跌方向，只收割价差回归", "html": "<h1>第041讲 统计套利：不预测涨跌方向，只收割价差回归<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解统计套利是组合化的相对价值框架。<\/li>\n<li>掌握信号、对冲和组合约束三层。<\/li>\n<li>识别小优势被成本吞噬的风险。<\/li>\n<\/ul>\n<h2>不预测指数也能交易<\/h2>\n<p>统计套利试图从大量资产的相对定价偏离中获取小而重复的收益。它常构造市场、行业或因子中性组合，让整体方向风险下降，把注意力放在残差回归。<\/p>\n<h2>基本流程<\/h2>\n<p>先用风险模型解释每只资产的共同暴露，再对残差构造短期反转、事件或横截面信号。优化器在多空、行业、因子、单票和换手率约束下分配权重，执行层再处理借券与市场冲击。<\/p>\n<h2>收益来源<\/h2>\n<p>可能来自流动性提供、投资者反应过度、指数与基金交易造成的暂时压力，也可能只是未识别的风险补偿。若无法说明谁在另一侧以及优势为何不被套利掉，统计显著性并不够。<\/p>\n<h2>三个现实瓶颈<\/h2>\n<ul>\n<li>单个信号很弱，需要组合大量独立机会。<\/li>\n<li>换手率和市场冲击容易吞掉毛收益。<\/li>\n<li>历史中性不代表危机中中性，因子暴露会漂移。<\/li>\n<\/ul>\n<h2>评估<\/h2>\n<p>除夏普比率外，应看容量、换手率、持仓集中、残差半衰期、因子暴露和拥挤情景。统计套利的专业性主要体现在风险与执行，不在复杂名称。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“统计套利：不预测涨跌方向，只收割价差回归”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>统计套利用相对价值和组合对冲降低方向暴露。<\/li>\n<li>弱信号必须通过分散、成本控制和稳定执行兑现。<\/li>\n<li>中性是持续管理的结果，不是一次回归的标签。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为一个横截面短期反转组合列出市场、行业、单票、换手率和借券五类约束。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第042讲 网格交易：震荡市收割机，单边市的绞肉机<\/strong>。<\/p>"}, {"n": 42, "title": "网格交易：震荡市收割机，单边市的绞肉机", "html": "<h1>第042讲 网格交易：震荡市收割机，单边市的绞肉机<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解固定网格的收益机制。<\/li>\n<li>识别单边行情和成本累积。<\/li>\n<li>判断哪些资产和环境不适合网格。<\/li>\n<\/ul>\n<h2>网格在赚什么<\/h2>\n<p>固定网格围绕参考价格设置多档买卖线，价格下跌分批买、上涨分批卖。它不要求预测方向，而是把震荡转化为多次低买高卖。<\/p>\n<h2>账面利润与真实风险<\/h2>\n<p>每个已完成格子可能盈利，但未平仓库存会随单边下跌不断累积。只统计已实现网格利润、忽略浮亏，会制造“每天赚钱”的错觉。<\/p>\n<h2>参数结构<\/h2>\n<p>中心价、上下边界、格距、每格仓位和总库存上限共同决定风险。格距太窄，成本占比高；太宽，成交机会少。算术格适合固定价格差，几何格按比例变化更适合宽区间。<\/p>\n<h2>单边市为什么危险<\/h2>\n<p>持续上涨会过早卖空仓位，持续下跌会不断接货。若资产存在永久贬值或杠杆强平，均值回归假设可能彻底失败。<\/p>\n<h2>必备风控<\/h2>\n<p>设置总资金上限、价格边界、停止加仓条件、趋势退出与异常熔断；回测必须逐笔计入交易成本并按总权益评价。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“网格交易：震荡市收割机，单边市的绞肉机”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>网格用库存承担方向风险换取震荡收益。<\/li>\n<li>已实现格子利润不能掩盖未实现亏损。<\/li>\n<li>边界、库存上限和退出机制比格距优化更重要。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>设计 10 档网格，手算连续下跌穿过全部买入档后的持仓均价、剩余现金和总亏损。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第043讲 动态网格与不对称格子：给网格装上大脑<\/strong>。<\/p>"}, {"n": 43, "title": "动态网格与不对称格子：给网格装上大脑", "html": "<h1>第043讲 动态网格与不对称格子：给网格装上大脑<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解动态中心、波动格距与不对称仓位。<\/li>\n<li>区分适应性与追逐价格。<\/li>\n<li>控制参数增加带来的过拟合。<\/li>\n<\/ul>\n<h2>为什么给网格“装大脑”<\/h2>\n<p>固定网格假设中心和波动稳定。动态网格尝试根据移动均值、估值中枢或波动率调整中心与格距，并在上下方向使用不同仓位。<\/p>\n<h2>三种改造<\/h2>\n<ul>\n<li><strong>动态中心<\/strong>：用慢速均线或模型价值更新参考价。<\/li>\n<li><strong>波动格距<\/strong>：用 ATR 或波动率扩大、缩小格距。<\/li>\n<li><strong>不对称网格<\/strong>：根据长期趋势或库存，在一侧使用更小仓位。<\/li>\n<\/ul>\n<h2>最大陷阱：追涨杀跌式重置<\/h2>\n<p>价格突破后立即把中心追到新价格，可能在高位重新铺设买单；下跌时不断下移中心，则会掩盖失败仓位。重置必须有频率、幅度和风险条件。<\/p>\n<h2>参数自由度<\/h2>\n<p>动态规则增加了窗口、阈值和更新速度。应先与固定网格比较，逐项验证增量，并用多种价格路径压力测试。<\/p>\n<h2>评价方式<\/h2>\n<p>看总权益、最大库存、资金占用、尾部亏损和趋势期表现，而非完成格数。动态不等于更安全，只是把风险从固定参数转移到调整规则。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“动态网格与不对称格子：给网格装上大脑”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>动态网格调整中心、格距或两侧仓位。<\/li>\n<li>无约束重置会把追逐价格伪装成适应性。<\/li>\n<li>必须用总权益和库存风险评价。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为动态中心设置最大月度移动幅度，并比较有无该限制时在单边行情中的库存。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第044讲 事件驱动策略：财报惊喜、分红日历与季节性规律<\/strong>。<\/p>"}, {"n": 44, "title": "事件驱动策略：财报惊喜、分红日历与季节性规律", "html": "<h1>第044讲 事件驱动策略：财报惊喜、分红日历与季节性规律<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解事件时间和公告时间的区别。<\/li>\n<li>建立事件研究与可交易策略流程。<\/li>\n<li>识别泄漏、预期与拥挤风险。<\/li>\n<\/ul>\n<h2>事件不是看到新闻才算开始<\/h2>\n<p>财报、分红、指数调整、并购和政策公告都可能驱动价格。事件策略的难点是确定市场何时首次获得信息，而不是文件所属日期。<\/p>\n<h2>事件研究<\/h2>\n<p>先估计正常收益，再计算事件窗口异常收益与累计异常收益。窗口过长会混入其他信息，过短可能错过延迟反应。<\/p>\n<h2>财报惊喜<\/h2>\n<p>不能只看利润增长，还要比较市场预期。结果很好但低于预期，价格仍可能下跌。若没有可靠预期数据，可使用历史趋势代理，但解释要谨慎。<\/p>\n<h2>从研究到交易<\/h2>\n<p>定义公告可用时间、过滤流动性、下一可交易价格、持有期和风险对冲。盘后公告通常不能假设以当日收盘价成交。<\/p>\n<h2>季节性<\/h2>\n<p>月度或节假日规律可能来自资金流、税务和制度，但也容易因多重检验产生。需要跨市场、跨时期和样本外验证。<\/p>\n<p>事件策略的优势往往衰减快，执行时间与拥挤程度和信号本身同样重要。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“事件驱动策略：财报惊喜、分红日历与季节性规律”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>事件策略必须使用首次公开可得时间。<\/li>\n<li>异常收益应相对正常基准计算。<\/li>\n<li>预期差、执行时点和拥挤决定可交易性。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为一次盘后财报设计事件窗口、基准模型、最早下单时间和退出规则。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第045讲 期货CTA策略：捕捉商品趋势的圣杯在哪里？<\/strong>。<\/p>"}, {"n": 45, "title": "期货CTA策略：捕捉商品趋势的圣杯在哪里？", "html": "<h1>第045讲 期货CTA策略：捕捉商品趋势的圣杯在哪里？<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解 CTA 趋势策略的组合结构。<\/li>\n<li>掌握合约连续化、波动定仓和移仓。<\/li>\n<li>认识趋势策略的危机与震荡表现。<\/li>\n<\/ul>\n<h2>CTA 不只是商品<\/h2>\n<p>期货 CTA 常跨商品、股指、利率和外汇期货，用趋势或相对价值规则管理组合。核心是利用期货的标准化和资本效率，但杠杆同时放大风险。<\/p>\n<h2>趋势信号<\/h2>\n<p>可使用通道突破、均线或多周期收益。多周期组合减少对单一窗口依赖。信号通常先标准化，再按品种波动分配风险。<\/p>\n<h2>连续合约陷阱<\/h2>\n<p>主力切换和期限结构会造成价格跳跃。研究需区分用于计算收益的连续序列与真实可交易合约，并显式计入移仓价差和手续费。<\/p>\n<h2>组合风险<\/h2>\n<p>单品种风险目标并不够；能源、金属或股指在危机中可能高度相关。应限制板块和总组合风险，并处理保证金上调。<\/p>\n<h2>收益形态<\/h2>\n<p>趋势策略可能在持续危机或宏观大趋势中表现突出，在快速反转与长期震荡中反复止损。它不是圣杯，而是一种凸性倾向的风险配置。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“期货CTA策略：捕捉商品趋势的圣杯在哪里？”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>CTA 常以多市场趋势和风险预算构建组合。<\/li>\n<li>连续价格不等于可交易合约，移仓必须显式处理。<\/li>\n<li>板块相关和保证金风险会放大组合损失。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为三个期货品种按目标波动分配仓位，并加入板块风险上限。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第046讲 套利策略入门：期现套利、跨期套利怎么玩<\/strong>。<\/p>"}, {"n": 46, "title": "套利策略入门：期现套利、跨期套利怎么玩", "html": "<h1>第046讲 套利策略入门：期现套利、跨期套利怎么玩<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>区分无风险套利与风险套利。<\/li>\n<li>理解价差、资金占用和执行同步。<\/li>\n<li>识别套利中的尾部与制度风险。<\/li>\n<\/ul>\n<h2>套利不是免费午餐<\/h2>\n<p>教科书套利指同一现金流出现不一致价格，可构造零净投资和确定收益。现实交易中，大多数“套利”包含基差、融资、执行和模型风险，更准确地说是相对价值交易。<\/p>\n<h2>期现套利<\/h2>\n<p>当期货相对现货偏离持有成本关系，可买低卖高并持有到收敛。但要计入融资、分红、仓储、保证金和交割限制。<\/p>\n<h2>跨期套利<\/h2>\n<p>交易同一品种不同到期合约的价差，收益受库存、季节、便利收益和资金条件影响。价差可能长期偏离，不能只依据历史均值。<\/p>\n<h2>执行风险<\/h2>\n<p>两腿不能同步成交会留下裸露方向；借券可能被召回；保证金变化可能迫使提前平仓。看似很小的价差，在高杠杆下也会造成大损失。<\/p>\n<h2>判断清单<\/h2>\n<p>确认现金流是否真正等价、收敛机制和期限、全部交易成本、最坏资金占用、退出路径与法律交割条件。套利的核心不是价差存在，而是价差能被你安全地锁定。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“套利策略入门：期现套利、跨期套利怎么玩”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>现实套利通常含融资、基差与执行风险。<\/li>\n<li>收敛机制和现金流等价性比历史相关更重要。<\/li>\n<li>两腿同步、保证金与极端资金占用必须压力测试。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>写出股指期货理论价格的持有成本组成，并列出偏离出现后仍无法套利的原因。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第047讲 期权量化基础：希腊字母如何指引交易<\/strong>。<\/p>"}, {"n": 47, "title": "期权量化基础：希腊字母如何指引交易", "html": "<h1>第047讲 期权量化基础：希腊字母如何指引交易<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解期权收益与主要希腊字母。<\/li>\n<li>区分方向、波动和时间暴露。<\/li>\n<li>避免只看到期收益图。<\/li>\n<\/ul>\n<h2>期权是一组动态风险<\/h2>\n<p>看涨期权给买方在到期前按执行价买入标的的权利，看跌期权给予卖出权利。期权费是权利成本，卖方承担相应义务。<\/p>\n<h2>五个常用希腊字母<\/h2>\n<ul>\n<li><strong>Delta<\/strong>：标的价格变化对期权价格的一阶影响。<\/li>\n<li><strong>Gamma<\/strong>：Delta 随标的变化的速度，体现曲率。<\/li>\n<li><strong>Vega<\/strong>：隐含波动率变化的敏感度。<\/li>\n<li><strong>Theta<\/strong>：时间流逝带来的价值变化。<\/li>\n<li><strong>Rho<\/strong>：利率变化敏感度。<\/li>\n<\/ul>\n<p>希腊字母会随价格、时间和波动变化，不是固定常数。<\/p>\n<h2>Delta 对冲<\/h2>\n<p>通过持有相反标的头寸降低小幅方向风险，但价格移动后需再平衡。高 Gamma 头寸对冲更频繁，交易成本更高。<\/p>\n<h2>买卖双方的结构<\/h2>\n<p>买方损失通常限于权利金，却可能持续承受 Theta；卖方收取权利金，却可能承担巨大尾部损失和保证金压力。<\/p>\n<h2>风险检查<\/h2>\n<p>除到期损益外，要观察路径、隐含波动变化、跳空、流动性和保证金。期权策略不是“猜涨跌”的复杂版本，而是管理多维风险。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“期权量化基础：希腊字母如何指引交易”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>期权价格同时受方向、曲率、波动、时间和利率影响。<\/li>\n<li>Delta 对冲只在局部有效，需要动态调整。<\/li>\n<li>有限盈利与尾部损失结构不能被高胜率掩盖。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>画出买入看涨与卖出看跌的到期损益，并说明到期前 Vega 和 Theta 如何改变结果。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第048讲 波动率交易：做多或做空恐慌情绪<\/strong>。<\/p>"}, {"n": 48, "title": "波动率交易：做多或做空恐慌情绪", "html": "<h1>第048讲 波动率交易：做多或做空恐慌情绪<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>区分实现波动与隐含波动。<\/li>\n<li>理解波动风险溢价和凸性。<\/li>\n<li>认识做空波动的尾部风险。<\/li>\n<\/ul>\n<h2>波动也有价格<\/h2>\n<p>实现波动来自未来实际价格路径，隐含波动从期权价格反推。波动交易关注二者及期限、偏斜之间的差异，而不只是预测方向。<\/p>\n<h2>做多波动<\/h2>\n<p>买入跨式等结构可受益于大幅移动和隐含波动上升，但需要价格变化足以覆盖权利金与时间损耗。长期“方向看对但幅度不够”仍可能亏损。<\/p>\n<h2>做空波动<\/h2>\n<p>卖出期权可能收取波动风险溢价，表现为多数时间小赚、极端时巨亏。高胜率并不代表低风险，杠杆和保证金会放大尾部。<\/p>\n<h2>波动曲面<\/h2>\n<p>不同执行价和期限具有不同隐含波动，形成偏斜与期限结构。交易应说明暴露在哪个点，并做 Delta、Gamma 和 Vega 分解。<\/p>\n<h2>风控<\/h2>\n<p>使用情景矩阵模拟标的跳跃、隐波上升、时间流逝和流动性恶化。限制裸卖、总 Gamma/Vega 和压力损失。波动交易本质是交易分布，而非一个标准差数字。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“波动率交易：做多或做空恐慌情绪”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>波动交易比较市场定价与未来实现路径。<\/li>\n<li>做多波动受时间损耗，做空波动承担尾部。<\/li>\n<li>曲面、路径和希腊字母必须联合管理。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为一个跨式头寸制作价格变动×隐波变动的二维盈亏情景表。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第049讲 高频交易掠影：做市与延迟套利在争什么？<\/strong>。<\/p>"}, {"n": 49, "title": "高频交易掠影：做市与延迟套利在争什么？", "html": "<h1>第049讲 高频交易掠影：做市与延迟套利在争什么？<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解做市与延迟套利的基本机制。<\/li>\n<li>认识订单簿、库存和排队风险。<\/li>\n<li>明白高频优势为何难以复制。<\/li>\n<\/ul>\n<h2>做市赚什么<\/h2>\n<p>做市商同时提供买卖报价，目标是赚取价差并管理库存。成交并非免费收益：当更快的信息交易者只在对做市商不利时成交，就产生逆向选择。<\/p>\n<h2>库存控制<\/h2>\n<p>持仓偏多时可降低报价以鼓励卖出，偏空时反向调整。库存、波动和订单流共同决定报价宽度。极端行情中，流动性需求和库存风险会同时上升。<\/p>\n<h2>延迟竞争<\/h2>\n<p>跨市场价格更新不同步时，速度快者可能先交易旧报价。但这类优势依赖专线、共址、硬件、撮合规则和精细监控，竞争会迅速压缩利润。<\/p>\n<h2>回测难点<\/h2>\n<p>只有成交数据无法知道排队位置；看到盘口数量也不代表都能在你之前或之后成交。延迟、撤单和部分成交必须进入事件驱动模拟。<\/p>\n<h2>普通研究者应学什么<\/h2>\n<p>不是模仿毫秒竞争，而是理解点差、深度、冲击与订单类型如何影响所有策略。执行质量是净收益的重要来源。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“高频交易掠影：做市与延迟套利在争什么？”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>做市以价差补偿库存和逆向选择风险。<\/li>\n<li>延迟套利依赖昂贵且专业的基础设施。<\/li>\n<li>高频回测必须模拟订单簿、排队和延迟。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>比较市价单和限价单在成交确定性、价格和逆向选择上的取舍。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第050讲 加密货币量化：7×24小时的新战场的特殊法则<\/strong>。<\/p>"}, {"n": 50, "title": "加密货币量化：7×24小时的新战场的特殊法则", "html": "<h1>第050讲 加密货币量化：7×24小时的新战场的特殊法则<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解加密市场的连续交易和分散结构。<\/li>\n<li>识别平台、托管与链上特有风险。<\/li>\n<li>建立不依赖单一交易所的研究口径。<\/li>\n<\/ul>\n<h2>7×24 小时改变了什么<\/h2>\n<p>加密资产没有统一收盘，日线边界取决于时区。资金费率、永续合约、跨平台价差和周末流动性使其与传统市场不同。研究必须固定 UTC 等时间标准。<\/p>\n<h2>数据结构<\/h2>\n<p>除成交和盘口外，还有链上转账、地址活动和协议状态。但地址不等于用户，链上行为也可能是内部整理，解释需要谨慎。<\/p>\n<h2>永续合约<\/h2>\n<p>永续通过资金费率锚定现货。策略收益应同时计入价格、资金费、手续费和保证金；高杠杆下，小波动也可能触发强平。<\/p>\n<h2>特有风险<\/h2>\n<p>交易平台故障、资产托管、智能合约漏洞、稳定币脱锚和市场操纵都可能让历史相关失效。跨平台套利还面临转账延迟与提现限制。<\/p>\n<h2>研究原则<\/h2>\n<p>使用多源价格、保存交易所标识、分离现货与衍生品、模拟连续保证金，并为平台不可用设置仓位与退出预案。策略优势不能只依赖“波动大”。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“加密货币量化：7×24小时的新战场的特殊法则”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>连续交易要求统一时区和全天候风险监控。<\/li>\n<li>资金费、强平、平台和托管风险必须进入收益模型。<\/li>\n<li>链上数据有增量，也有实体解释困难。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为一个永续趋势策略列出价格收益、资金费、手续费、滑点和强平五类现金流。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第051讲 可转债量化：下有保底上不封顶的数学分析<\/strong>。<\/p>"}, {"n": 51, "title": "可转债量化：下有保底上不封顶的数学分析", "html": "<h1>第051讲 可转债量化：下有保底上不封顶的数学分析<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解可转债的债性、股性与转股权。<\/li>\n<li>掌握转股价值和溢价率的直觉。<\/li>\n<li>识别条款、信用和流动性风险。<\/li>\n<\/ul>\n<h2>可转债的混合结构<\/h2>\n<p>可转债是含转股选择权的债券。下跌时债券价值可能提供一定缓冲，上涨时转股权带来权益弹性，但“下有保底”不是绝对保证，信用违约与流动性会破坏底部。<\/p>\n<h2>两个基础量<\/h2>\n<p>转股价值近似为正股价格乘转股比例；转股溢价率衡量转债价格相对转股价值的溢价。低价、低溢价、高信用质量常被用作筛选维度，但三者存在取舍。<\/p>\n<h2>条款影响<\/h2>\n<p>强赎、回售、下修和到期赎回会改变现金流。量化回测必须按公告时间与生效规则处理，不能把条款视为静态字段。<\/p>\n<h2>常见策略<\/h2>\n<p>双低排序、动量轮动、信用与估值组合、转股套利等。策略还需处理最小交易单位、停牌、赎回倒计时和容量。<\/p>\n<h2>风险<\/h2>\n<p>高溢价可能在情绪退潮时压缩，正股下跌会削弱股性，信用事件会同时打击债底。组合应限制单券、行业和发行人集中。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“可转债量化：下有保底上不封顶的数学分析”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>可转债是债券现金流与股票期权的组合。<\/li>\n<li>价格、转股溢价、信用和条款共同决定风险。<\/li>\n<li>所谓保底依赖发行人信用和市场流动性。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>选一只转债，计算转股价值与溢价率，并列出强赎、回售和下修状态。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第052讲 基本面量化：乔尔·格林布拉特的神奇公式拆解<\/strong>。<\/p>"}, {"n": 52, "title": "基本面量化：乔尔·格林布拉特的神奇公式拆解", "html": "<h1>第052讲 基本面量化：乔尔·格林布拉特的神奇公式拆解<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解神奇公式的价值与质量组合逻辑。<\/li>\n<li>建立可复现的排序股票池。<\/li>\n<li>识别会计口径和容量问题。<\/li>\n<\/ul>\n<h2>核心思想<\/h2>\n<p>格林布拉特的神奇公式试图同时寻找“好公司”和“便宜价格”。教学版本常用资本回报率衡量经营质量，用息税前利润相对企业价值的收益率衡量便宜程度，再分别排序合成。<\/p>\n<h2>为什么不是直接用 PE<\/h2>\n<p>企业价值同时考虑股权与债务，更适合比较不同资本结构；经营资产回报试图观察企业用投入资本创造利润的能力。但字段定义必须统一。<\/p>\n<h2>量化流程<\/h2>\n<p>确定可交易股票池，排除不适用行业或单独处理；用当时已披露财报计算两个指标，分别排名后合成，定期持有并分散。<\/p>\n<h2>常见偏差<\/h2>\n<p>财报发布时间、一次性利润、负值处理、行业差异和退市样本都会显著改变结果。直接照搬海外口径到其他市场也可能失真。<\/p>\n<h2>经济直觉<\/h2>\n<p>便宜可能补偿风险，质量可能降低价值陷阱。两者组合不是保证，而是用简单规则平衡价格与经营能力。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“基本面量化：乔尔·格林布拉特的神奇公式拆解”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>神奇公式结合价值与质量两个维度。<\/li>\n<li>字段、行业和公告时间决定能否复现。<\/li>\n<li>简单排名仍需样本外、成本和风险暴露检验。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>写出你采用的资本回报率与盈利收益率字段公式，并说明负值和金融行业如何处理。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第053讲 行业轮动策略：把美林时钟用代码写出来<\/strong>。<\/p>"}, {"n": 53, "title": "行业轮动策略：把美林时钟用代码写出来", "html": "<h1>第053讲 行业轮动策略：把美林时钟用代码写出来<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解行业轮动的信号与组合层。<\/li>\n<li>认识美林时钟只是宏观分类框架。<\/li>\n<li>控制行业集中与频繁切换。<\/li>\n<\/ul>\n<h2>轮动在做什么<\/h2>\n<p>行业轮动根据增长、通胀、盈利、估值、价格趋势或资金流，在行业间动态分配。收益既可能来自宏观敏感度，也可能来自动量和风险暴露。<\/p>\n<h2>美林时钟的正确位置<\/h2>\n<p>时钟用增长与通胀方向划分环境，并给出资产偏好直觉。现实数据有修订和滞后，阶段边界模糊，不能把宏观标签当作精确交易开关。<\/p>\n<h2>可执行信号<\/h2>\n<p>可用行业指数中期动量、盈利预期变化、估值分位和宏观状态合成评分。所有宏观数据必须按首次发布时间进入，避免修订值前视。<\/p>\n<h2>组合设计<\/h2>\n<p>选择前若干行业并设置单行业上限、换手率缓冲和市场风险目标。行业 ETF 还要关注成分集中、跟踪误差和流动性。<\/p>\n<h2>验证<\/h2>\n<p>比较纯动量、纯宏观与组合模型，做滚动样本外和危机情景。若复杂宏观模型没有超过简单相对强弱基线，就不应为故事增加参数。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“行业轮动策略：把美林时钟用代码写出来”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>行业轮动是跨行业相对配置，不是准确预测经济阶段。<\/li>\n<li>宏观数据修订与滞后会造成前视偏差。<\/li>\n<li>简单基线、集中度和换手率控制是核心。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>建立一个行业动量基线，再增加一个当时可得的宏观变量，检验是否提供样本外增量。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第054讲 什么是因子？Beta与Alpha的前世今生<\/strong>。<\/p>"}]}, {"no": 5, "name": "因子投资·寻找Alpha", "desc": "从单因子到多因子，掌握专业资管机构的核心语言。", "chapters": [{"n": 54, "title": "什么是因子？Beta与Alpha的前世今生", "html": "<h1>第054讲 什么是因子？Beta与Alpha的前世今生<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。因子历史表现不代表未来收益。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解因子是可重复的收益与风险解释维度。<\/li>\n<li>区分 Beta 暴露与 Alpha。<\/li>\n<li>建立因子研究的定义、检验和实现流程。<\/li>\n<\/ul>\n<h2>因子是什么<\/h2>\n<p>因子是能在大量资产上统一计算、用于解释收益差异或预测相对表现的特征。市值、估值、动量、质量和波动都可构成因子，但一个财务字段不自动等于有效因子。<\/p>\n<h2>Beta 与 Alpha<\/h2>\n<p>Beta 表示组合对系统性风险来源的敏感度；Alpha 是在给定风险模型下未被解释的剩余收益。Alpha 不是永久标签：风险模型加入新因子后，过去的 Alpha 可能变成某种 Beta。<\/p>\n<h2>因子收益链<\/h2>\n<blockquote>\n<p>原始字段 → 清洗 → 行业与规模处理 → 标准化 → 排序或回归 → 组合 → 成本后收益<\/p>\n<\/blockquote>\n<p>每一步都会影响结论。因子必须按当时可得数据计算，并说明方向、更新频率和缺失处理。<\/p>\n<h2>为什么因子可能存在<\/h2>\n<p>可能来自承担风险、行为偏差、制度约束或交易摩擦。经济解释帮助判断持续性，但不能代替样本外证据。<\/p>\n<h2>检验维度<\/h2>\n<p>观察分组单调性、Rank IC、换手率、因子收益、跨市场稳定性、与已知因子相关性及成本后容量。一次显著回归不够。<\/p>\n<h2>因子研究卡：定义、检验与组合<\/h2>\n<p>研究“什么是因子？Beta与Alpha的前世今生”时，先把经济直觉、因子定义与组合实现分开。下面的流程可防止一个看似漂亮的排序结果被行业、规模或数据口径误导。<\/p>\n<ol>\n<li>明确因子值、方向、截面范围、调仓频率和未来收益窗口。<\/li>\n<li>按决策时点对齐数据，处理极值、缺失，并说明标准化与中性化方法。<\/li>\n<li>同时查看 IC、Rank IC、分组单调性、换手率、成本后收益和不同市场阶段。<\/li>\n<li>将因子加入已有组合，检查边际贡献、相关性、风险暴露与容量，而不是只看单因子回测。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>因子定义随结果不断调整；应先冻结定义，再保留真正独立的样本外区间。<\/li>\n<li>忽略行业、规模或风格暴露；超额收益可能只是已知风险因子的替身。<\/li>\n<li>只看多空组合收益；实际多头组合还受基准、约束、换手和可交易性影响。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>因子方向、频率和未来收益窗口无歧义<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>数据按当时可得口径对齐<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>单调性、稳定性、换手和成本均已报告<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>与已有因子及风险暴露完成增量比较<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>因子是跨资产可统一计算的解释或预测特征。<\/li>\n<li>Alpha 取决于所采用的风险模型。<\/li>\n<li>从字段到可交易收益需经过完整的数据与组合链路。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>选择一个因子，写出定义卡：经济逻辑、字段、时间、清洗、方向、频率、评价和失效条件。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第055讲 市场因子：你的收益有多少来自大盘上涨？<\/strong>。<\/p>"}, {"n": 55, "title": "市场因子：你的收益有多少来自大盘上涨？", "html": "<h1>第055讲 市场因子：你的收益有多少来自大盘上涨？<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。因子历史表现不代表未来收益。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解市场因子和 Beta 的估计。<\/li>\n<li>分解绝对收益与超额收益。<\/li>\n<li>识别 Beta 漂移与非线性暴露。<\/li>\n<\/ul>\n<h2>市场因子<\/h2>\n<p>市场因子通常是广泛市场组合相对无风险资产的收益。个股或组合可写为：<\/p>\n<p>[\nR_i-R_f=\\alpha_i+\\beta_i(R_m-R_f)+\\varepsilon_i\n]<\/p>\n<p>Beta 大于 1 表示历史上对市场变化更敏感，小于 1 表示相对温和。<\/p>\n<h2>你的收益来自哪里<\/h2>\n<p>牛市中高 Beta 组合即使选股无效也可能表现亮眼。评价能力应把市场暴露、行业和其他风格收益分开，再看剩余部分。<\/p>\n<h2>Beta 不是常数<\/h2>\n<p>公司杠杆、业务结构和组合权重会变化；期权与止损策略还可能产生非线性 Beta。滚动估计比全样本单值更接近风险现实。<\/p>\n<h2>基准选择<\/h2>\n<p>用不匹配的市场指数会制造虚假 Alpha。小盘组合、海外资产或多资产策略需要更适当的基准与因子集合。<\/p>\n<h2>管理方式<\/h2>\n<p>可以通过股指期货、ETF 或权重调整控制市场 Beta，但对冲会引入基差、成本和动态偏离。中性目标必须持续监控。<\/p>\n<h2>因子研究卡：定义、检验与组合<\/h2>\n<p>研究“市场因子：你的收益有多少来自大盘上涨？”时，先把经济直觉、因子定义与组合实现分开。下面的流程可防止一个看似漂亮的排序结果被行业、规模或数据口径误导。<\/p>\n<ol>\n<li>明确因子值、方向、截面范围、调仓频率和未来收益窗口。<\/li>\n<li>按决策时点对齐数据，处理极值、缺失，并说明标准化与中性化方法。<\/li>\n<li>同时查看 IC、Rank IC、分组单调性、换手率、成本后收益和不同市场阶段。<\/li>\n<li>将因子加入已有组合，检查边际贡献、相关性、风险暴露与容量，而不是只看单因子回测。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>因子定义随结果不断调整；应先冻结定义，再保留真正独立的样本外区间。<\/li>\n<li>忽略行业、规模或风格暴露；超额收益可能只是已知风险因子的替身。<\/li>\n<li>只看多空组合收益；实际多头组合还受基准、约束、换手和可交易性影响。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>因子方向、频率和未来收益窗口无歧义<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>数据按当时可得口径对齐<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>单调性、稳定性、换手和成本均已报告<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>与已有因子及风险暴露完成增量比较<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>市场 Beta 是组合对系统性权益风险的敏感度。<\/li>\n<li>高绝对收益可能主要来自市场上涨。<\/li>\n<li>Beta 会漂移，基准和非线性需要额外处理。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>把一个组合收益回归市场收益，比较全样本 Beta 与 60 日滚动 Beta，并定位变化最大的时期。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第056讲 规模因子：小盘股长期溢价真的存在吗？<\/strong>。<\/p>"}, {"n": 56, "title": "规模因子：小盘股长期溢价真的存在吗？", "html": "<h1>第056讲 规模因子：小盘股长期溢价真的存在吗？<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。因子历史表现不代表未来收益。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解规模因子的构造与可能解释。<\/li>\n<li>认识小盘溢价的成本和样本敏感性。<\/li>\n<li>避免把流动性风险误当免费收益。<\/li>\n<\/ul>\n<h2>规模如何定义<\/h2>\n<p>常见规模变量是自由流通或总市值的对数。研究按时点市值排序，比较小盘与大盘组合未来收益。<\/p>\n<h2>为什么小盘可能有溢价<\/h2>\n<p>可能来自更高经营风险、信息覆盖不足、流动性补偿或投资者偏好。但不同市场和时期结果并不稳定，极小微盘的纸面收益尤其容易被交易限制夸大。<\/p>\n<h2>主要偏差<\/h2>\n<ul>\n<li>使用当前存续股票导致幸存者偏差。<\/li>\n<li>忽略涨跌停、停牌与市场冲击成本。<\/li>\n<li>市值使用未来股本或错误复权。<\/li>\n<li>把壳价值、行业和流动性暴露都归为规模。<\/li>\n<\/ul>\n<h2>实现方式<\/h2>\n<p>设置上市时间、流动性和可交易过滤，按当时市值分组，控制行业并计入真实成本。观察收益是否集中在最小、最难交易的一端。<\/p>\n<h2>风险含义<\/h2>\n<p>小盘组合容量有限、尾部和流动性风险高。因子存在不等于适合所有资金规模。<\/p>\n<h2>因子研究卡：定义、检验与组合<\/h2>\n<p>研究“规模因子：小盘股长期溢价真的存在吗？”时，先把经济直觉、因子定义与组合实现分开。下面的流程可防止一个看似漂亮的排序结果被行业、规模或数据口径误导。<\/p>\n<ol>\n<li>明确因子值、方向、截面范围、调仓频率和未来收益窗口。<\/li>\n<li>按决策时点对齐数据，处理极值、缺失，并说明标准化与中性化方法。<\/li>\n<li>同时查看 IC、Rank IC、分组单调性、换手率、成本后收益和不同市场阶段。<\/li>\n<li>将因子加入已有组合，检查边际贡献、相关性、风险暴露与容量，而不是只看单因子回测。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>因子定义随结果不断调整；应先冻结定义，再保留真正独立的样本外区间。<\/li>\n<li>忽略行业、规模或风格暴露；超额收益可能只是已知风险因子的替身。<\/li>\n<li>只看多空组合收益；实际多头组合还受基准、约束、换手和可交易性影响。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>因子方向、频率和未来收益窗口无歧义<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>数据按当时可得口径对齐<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>单调性、稳定性、换手和成本均已报告<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>与已有因子及风险暴露完成增量比较<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>规模因子比较不同市值资产的相对表现。<\/li>\n<li>小盘溢价可能包含风险与流动性补偿。<\/li>\n<li>可交易过滤和容量评估决定实盘交易意义。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>逐步剔除最低流动性和最小市值股票，观察规模因子收益与换手率如何变化。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第057讲 价值因子：低市盈率、低市净率是否永不褪色<\/strong>。<\/p>"}, {"n": 57, "title": "价值因子：低市盈率、低市净率是否永不褪色", "html": "<h1>第057讲 价值因子：低市盈率、低市净率是否永不褪色<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。因子历史表现不代表未来收益。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解价值因子的多种估值口径。<\/li>\n<li>识别低估值与价值陷阱。<\/li>\n<li>构建行业可比的价值组合。<\/li>\n<\/ul>\n<h2>价值因子在买什么<\/h2>\n<p>价值因子偏好价格相对基本面较低的资产。常见指标包括账面市值比、盈利收益率、销售收入收益率和自由现金流收益率。<\/p>\n<h2>PE 与 PB 的边界<\/h2>\n<p>亏损公司 PE 无正常意义，资产轻型公司 PB 可能长期较高，金融业的账面价值又更关键。单一指标跨行业比较会造成结构偏差。<\/p>\n<h2>为什么可能有收益<\/h2>\n<p>低估值可能补偿困境风险，也可能来自投资者对热门成长过度外推。两种解释都意味着价值策略会经历长时间落后。<\/p>\n<h2>价值陷阱<\/h2>\n<p>便宜可能因为盈利将恶化、资产质量差或行业衰退。加入质量、盈利修订和财务安全条件可以降低部分陷阱，但也会改变因子含义。<\/p>\n<h2>构建原则<\/h2>\n<p>使用公告可得数据、行业内标准化、多指标合成和持仓上限，报告行业与规模暴露。价值因子要看完整周期，不应因短期失效频繁改口径。<\/p>\n<h2>因子研究卡：定义、检验与组合<\/h2>\n<p>研究“价值因子：低市盈率、低市净率是否永不褪色”时，先把经济直觉、因子定义与组合实现分开。下面的流程可防止一个看似漂亮的排序结果被行业、规模或数据口径误导。<\/p>\n<ol>\n<li>明确因子值、方向、截面范围、调仓频率和未来收益窗口。<\/li>\n<li>按决策时点对齐数据，处理极值、缺失，并说明标准化与中性化方法。<\/li>\n<li>同时查看 IC、Rank IC、分组单调性、换手率、成本后收益和不同市场阶段。<\/li>\n<li>将因子加入已有组合，检查边际贡献、相关性、风险暴露与容量，而不是只看单因子回测。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>因子定义随结果不断调整；应先冻结定义，再保留真正独立的样本外区间。<\/li>\n<li>忽略行业、规模或风格暴露；超额收益可能只是已知风险因子的替身。<\/li>\n<li>只看多空组合收益；实际多头组合还受基准、约束、换手和可交易性影响。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>因子方向、频率和未来收益窗口无歧义<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>数据按当时可得口径对齐<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>单调性、稳定性、换手和成本均已报告<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>与已有因子及风险暴露完成增量比较<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>价值衡量价格相对基本面的便宜程度。<\/li>\n<li>估值指标具有行业和会计边界。<\/li>\n<li>低估值可能是错价，也可能是风险信息。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>用 PE、PB 和自由现金流收益率分别排序，比较三者的行业分布和重合度。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第058讲 动量因子：强者恒强，能持续多久？<\/strong>。<\/p>"}, {"n": 58, "title": "动量因子：强者恒强，能持续多久？", "html": "<h1>第058讲 动量因子：强者恒强，能持续多久？<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。因子历史表现不代表未来收益。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解因子动量与价格动量的关系。<\/li>\n<li>掌握窗口、跳过期和调仓的影响。<\/li>\n<li>识别反转、拥挤和交易成本。<\/li>\n<\/ul>\n<h2>动量因子<\/h2>\n<p>横截面动量通常按过去中期收益排序，持有赢家并回避或做空输家。常见研究会跳过最近短期，以减少微观结构和短期反转。<\/p>\n<h2>信号定义<\/h2>\n<p>累计收益率、风险调整收益和残差动量是不同版本。残差动量先剔除市场与风格，再看个体趋势，可能降低共同因子暴露。<\/p>\n<h2>强者恒强能多久<\/h2>\n<p>动量的持有期应通过信号衰减曲线观察，而不是固定相信某个窗口。过快调仓提高成本，过慢则信号过期。<\/p>\n<h2>崩溃风险<\/h2>\n<p>快速市场反转时，过去输家反弹、赢家回落，组合可能大幅亏损。行业集中和空头约束会放大问题。<\/p>\n<h2>实现<\/h2>\n<p>进行行业中性、波动调整、换手率缓冲和多周期合成；报告成本前后收益及反转情景。<\/p>\n<h2>因子研究卡：定义、检验与组合<\/h2>\n<p>研究“动量因子：强者恒强，能持续多久？”时，先把经济直觉、因子定义与组合实现分开。下面的流程可防止一个看似漂亮的排序结果被行业、规模或数据口径误导。<\/p>\n<ol>\n<li>明确因子值、方向、截面范围、调仓频率和未来收益窗口。<\/li>\n<li>按决策时点对齐数据，处理极值、缺失，并说明标准化与中性化方法。<\/li>\n<li>同时查看 IC、Rank IC、分组单调性、换手率、成本后收益和不同市场阶段。<\/li>\n<li>将因子加入已有组合，检查边际贡献、相关性、风险暴露与容量，而不是只看单因子回测。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>因子定义随结果不断调整；应先冻结定义，再保留真正独立的样本外区间。<\/li>\n<li>忽略行业、规模或风格暴露；超额收益可能只是已知风险因子的替身。<\/li>\n<li>只看多空组合收益；实际多头组合还受基准、约束、换手和可交易性影响。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>因子方向、频率和未来收益窗口无歧义<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>数据按当时可得口径对齐<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>单调性、稳定性、换手和成本均已报告<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>与已有因子及风险暴露完成增量比较<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>动量因子利用相对收益延续。<\/li>\n<li>窗口、跳过期和持有期决定信号衰减。<\/li>\n<li>快速反转与拥挤是核心尾部风险。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>绘制动量信号未来 1–12 个月的 Rank IC 衰减曲线，选择有证据的持有期。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第059讲 质量因子：高ROE、稳定盈利的公司更香吗？<\/strong>。<\/p>"}, {"n": 59, "title": "质量因子：高ROE、稳定盈利的公司更香吗？", "html": "<h1>第059讲 质量因子：高ROE、稳定盈利的公司更香吗？<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。因子历史表现不代表未来收益。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解质量因子的盈利、稳健和安全维度。<\/li>\n<li>区分高 ROE 与真实经营质量。<\/li>\n<li>处理行业、杠杆和会计操纵。<\/li>\n<\/ul>\n<h2>质量不是一个字段<\/h2>\n<p>质量通常覆盖盈利能力、盈利稳定性、现金流质量、资产负债表安全和资本配置。ROE 高可能来自好业务，也可能来自高杠杆或低净资产。<\/p>\n<h2>常见指标<\/h2>\n<p>毛利率、ROA、ROE、经营现金流/利润、应计项、利润波动、杠杆和利息保障倍数。不同指标方向与行业含义不同。<\/p>\n<h2>数据处理<\/h2>\n<p>使用过去已公告财报，剔除一次性项目或至少做敏感性分析；在行业内标准化，避免把商业模式差异当质量。<\/p>\n<h2>为什么可能有效<\/h2>\n<p>投资者可能低估稳定复利的价值，机构约束也可能造成定价偏差。但“好公司”在估值过高时不一定是好投资，因此质量常与价值组合。<\/p>\n<h2>风险<\/h2>\n<p>会计数据滞后，粉饰可能在事后才暴露。质量组合还可能集中于低杠杆、防御和大盘风格。<\/p>\n<h2>因子研究卡：定义、检验与组合<\/h2>\n<p>研究“质量因子：高ROE、稳定盈利的公司更香吗？”时，先把经济直觉、因子定义与组合实现分开。下面的流程可防止一个看似漂亮的排序结果被行业、规模或数据口径误导。<\/p>\n<ol>\n<li>明确因子值、方向、截面范围、调仓频率和未来收益窗口。<\/li>\n<li>按决策时点对齐数据，处理极值、缺失，并说明标准化与中性化方法。<\/li>\n<li>同时查看 IC、Rank IC、分组单调性、换手率、成本后收益和不同市场阶段。<\/li>\n<li>将因子加入已有组合，检查边际贡献、相关性、风险暴露与容量，而不是只看单因子回测。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>因子定义随结果不断调整；应先冻结定义，再保留真正独立的样本外区间。<\/li>\n<li>忽略行业、规模或风格暴露；超额收益可能只是已知风险因子的替身。<\/li>\n<li>只看多空组合收益；实际多头组合还受基准、约束、换手和可交易性影响。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>因子方向、频率和未来收益窗口无歧义<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>数据按当时可得口径对齐<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>单调性、稳定性、换手和成本均已报告<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>与已有因子及风险暴露完成增量比较<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>质量因子应综合盈利、稳定、现金流和财务安全。<\/li>\n<li>高 ROE 需要拆解杠杆与盈利来源。<\/li>\n<li>质量与估值、行业暴露应联合观察。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>对 ROE 做杜邦分解，判断高值来自利润率、周转还是杠杆。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第060讲 低波动因子：为何低风险股票反而回报更高？<\/strong>。<\/p>"}, {"n": 60, "title": "低波动因子：为何低风险股票反而回报更高？", "html": "<h1>第060讲 低波动因子：为何低风险股票反而回报更高？<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。因子历史表现不代表未来收益。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解低波动异象与最小方差区别。<\/li>\n<li>认识防御暴露和估值拥挤。<\/li>\n<li>构建可交易的低风险组合。<\/li>\n<\/ul>\n<h2>低风险为何可能不低收益<\/h2>\n<p>传统直觉认为承担更多风险应获得更高回报，但历史研究中低波或低 Beta 股票有时呈现较好风险调整表现。可能原因包括杠杆限制、彩票偏好和机构基准约束。<\/p>\n<h2>两种实现<\/h2>\n<p>低波因子按个股历史波动排序；最小方差组合还利用协方差，通过优化降低组合波动。后者对估计误差更敏感。<\/p>\n<h2>隐藏暴露<\/h2>\n<p>低波组合常偏向公用事业、消费、防御和大盘股，并可能具有利率敏感性。表现不能全部归因于“低波”标签。<\/p>\n<h2>估计与调仓<\/h2>\n<p>窗口过短会追逐近期波动，过长反应慢。采用收缩估计、权重上限和换手率缓冲可提高稳健性。<\/p>\n<h2>风险<\/h2>\n<p>低波资产估值过高、利率快速变化或防御风格反转时也会集中亏损。低历史波动不代表没有尾部。<\/p>\n<h2>因子研究卡：定义、检验与组合<\/h2>\n<p>研究“低波动因子：为何低风险股票反而回报更高？”时，先把经济直觉、因子定义与组合实现分开。下面的流程可防止一个看似漂亮的排序结果被行业、规模或数据口径误导。<\/p>\n<ol>\n<li>明确因子值、方向、截面范围、调仓频率和未来收益窗口。<\/li>\n<li>按决策时点对齐数据，处理极值、缺失，并说明标准化与中性化方法。<\/li>\n<li>同时查看 IC、Rank IC、分组单调性、换手率、成本后收益和不同市场阶段。<\/li>\n<li>将因子加入已有组合，检查边际贡献、相关性、风险暴露与容量，而不是只看单因子回测。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>因子定义随结果不断调整；应先冻结定义，再保留真正独立的样本外区间。<\/li>\n<li>忽略行业、规模或风格暴露；超额收益可能只是已知风险因子的替身。<\/li>\n<li>只看多空组合收益；实际多头组合还受基准、约束、换手和可交易性影响。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>因子方向、频率和未来收益窗口无歧义<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>数据按当时可得口径对齐<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>单调性、稳定性、换手和成本均已报告<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>与已有因子及风险暴露完成增量比较<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>低波因子与最小方差组合不是同一概念。<\/li>\n<li>行业、利率和估值暴露可能解释部分表现。<\/li>\n<li>稳健协方差与权重约束比精确优化更重要。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>比较简单低波排序与最小方差组合的行业权重、换手率和样本外波动。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第061讲 Fama-French三因子及五因子模型：学院派的基石<\/strong>。<\/p>"}, {"n": 61, "title": "Fama-French三因子及五因子模型：学院派的基石", "html": "<h1>第061讲 Fama-French三因子及五因子模型：学院派的基石<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。因子历史表现不代表未来收益。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解 Fama-French 三因子和五因子结构。<\/li>\n<li>会解释时间序列回归中的暴露与 Alpha。<\/li>\n<li>认识学术因子到实盘交易组合的距离。<\/li>\n<\/ul>\n<h2>三因子框架<\/h2>\n<p>三因子在市场因子之外加入规模 SMB 与价值 HML，用共同收益组合解释资产差异：<\/p>\n<p>[\nR_i-R_f=\\alpha+\\beta_m MKT+s\\,SMB+h\\,HML+\\varepsilon\n]<\/p>\n<p>系数表示历史暴露，Alpha 是模型未解释部分。<\/p>\n<h2>五因子扩展<\/h2>\n<p>五因子进一步加入盈利能力 RMW 与投资风格 CMA。它说明公司盈利与投资行为可能包含独立于价值、规模的信息。<\/p>\n<h2>因子组合如何构造<\/h2>\n<p>学术因子通常基于排序和多空组合，具体断点、加权与市场范围会影响结果。不同数据源的同名因子并非天然一致。<\/p>\n<h2>用途<\/h2>\n<ul>\n<li>解释基金收益来自哪些系统性暴露。<\/li>\n<li>评估新因子是否提供增量。<\/li>\n<li>约束组合不希望承担的风险。<\/li>\n<\/ul>\n<h2>局限<\/h2>\n<p>模型是经验近似，因子之间相关且随时间变化；多空学术收益也未必可低成本复制。回归显著不等于可交易。<\/p>\n<h2>因子研究卡：定义、检验与组合<\/h2>\n<p>研究“Fama-French三因子及五因子模型：学院派的基石”时，先把经济直觉、因子定义与组合实现分开。下面的流程可防止一个看似漂亮的排序结果被行业、规模或数据口径误导。<\/p>\n<ol>\n<li>明确因子值、方向、截面范围、调仓频率和未来收益窗口。<\/li>\n<li>按决策时点对齐数据，处理极值、缺失，并说明标准化与中性化方法。<\/li>\n<li>同时查看 IC、Rank IC、分组单调性、换手率、成本后收益和不同市场阶段。<\/li>\n<li>将因子加入已有组合，检查边际贡献、相关性、风险暴露与容量，而不是只看单因子回测。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>因子定义随结果不断调整；应先冻结定义，再保留真正独立的样本外区间。<\/li>\n<li>忽略行业、规模或风格暴露；超额收益可能只是已知风险因子的替身。<\/li>\n<li>只看多空组合收益；实际多头组合还受基准、约束、换手和可交易性影响。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>因子方向、频率和未来收益窗口无歧义<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>数据按当时可得口径对齐<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>单调性、稳定性、换手和成本均已报告<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>与已有因子及风险暴露完成增量比较<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>三因子加入规模与价值，五因子再加入盈利和投资。<\/li>\n<li>因子暴露用于解释与风险管理，不是收益保证。<\/li>\n<li>构造口径与实盘交易成本会改变学术结果。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>用三因子和五因子分别回归同一组合，比较 Alpha 和暴露变化。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第062讲 多因子合成方法：排序打分、等权还是优化？<\/strong>。<\/p>"}, {"n": 62, "title": "多因子合成方法：排序打分、等权还是优化？", "html": "<h1>第062讲 多因子合成方法：排序打分、等权还是优化？<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。因子历史表现不代表未来收益。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>掌握排序、标准分和优化三类合成方法。<\/li>\n<li>处理因子方向、尺度和相关性。<\/li>\n<li>用样本外标准选择复杂度。<\/li>\n<\/ul>\n<h2>为什么要合成<\/h2>\n<p>单因子会阶段性失效。多因子希望分散信号来源，但把多个高度相关指标相加并不会带来真正分散。<\/p>\n<h2>三种方法<\/h2>\n<h3>排序打分<\/h3>\n<p>分别排名后相加，直观且对极端值不敏感，但丢失距离信息。<\/p>\n<h3>标准分加权<\/h3>\n<p>将因子做 z-score 后按权重合成，可表达强弱幅度；需要稳健处理异常和行业。<\/p>\n<h3>预测或优化<\/h3>\n<p>根据历史 IC、回归系数或组合目标估计权重，适应性更强，也更容易过拟合和产生高换手率。<\/p>\n<h2>因子预处理<\/h2>\n<p>统一方向、缩尾、标准化、中性化，检查覆盖和相关矩阵。对于高度相似的价值指标，可先聚类或在主题内等权。<\/p>\n<h2>权重选择<\/h2>\n<p>等权是重要基线。复杂权重只有在滚动样本外、成本后和参数扰动下持续优于等权，才值得使用。<\/p>\n<h2>评价<\/h2>\n<p>不仅看组合收益，还看每个因子的边际贡献、暴露漂移、换手率和失效情景。<\/p>\n<h2>因子研究卡：定义、检验与组合<\/h2>\n<p>研究“多因子合成方法：排序打分、等权还是优化？”时，先把经济直觉、因子定义与组合实现分开。下面的流程可防止一个看似漂亮的排序结果被行业、规模或数据口径误导。<\/p>\n<ol>\n<li>明确因子值、方向、截面范围、调仓频率和未来收益窗口。<\/li>\n<li>按决策时点对齐数据，处理极值、缺失，并说明标准化与中性化方法。<\/li>\n<li>同时查看 IC、Rank IC、分组单调性、换手率、成本后收益和不同市场阶段。<\/li>\n<li>将因子加入已有组合，检查边际贡献、相关性、风险暴露与容量，而不是只看单因子回测。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>因子定义随结果不断调整；应先冻结定义，再保留真正独立的样本外区间。<\/li>\n<li>忽略行业、规模或风格暴露；超额收益可能只是已知风险因子的替身。<\/li>\n<li>只看多空组合收益；实际多头组合还受基准、约束、换手和可交易性影响。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>因子方向、频率和未来收益窗口无歧义<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>数据按当时可得口径对齐<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>单调性、稳定性、换手和成本均已报告<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>与已有因子及风险暴露完成增量比较<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>排序、标准分和优化具有不同复杂度。<\/li>\n<li>因子方向、异常、行业和相关性必须先处理。<\/li>\n<li>等权基线常比精确历史最优更稳健。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>选择价值、质量和动量各一项，分别用排名等权与 IC 加权合成，比较样本外。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第063讲 Barra风险模型初探：看清组合里隐藏的风险暴露<\/strong>。<\/p>"}, {"n": 63, "title": "Barra风险模型初探：看清组合里隐藏的风险暴露", "html": "<h1>第063讲 Barra风险模型初探：看清组合里隐藏的风险暴露<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。因子历史表现不代表未来收益。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解 Barra 类风险模型的因子分解。<\/li>\n<li>区分因子风险和特异风险。<\/li>\n<li>将风险模型用于归因、约束与压力测试。<\/li>\n<\/ul>\n<h2>风险模型在看什么<\/h2>\n<p>组合收益可分解为国家、行业、风格因子与个股特异部分。协方差近似写为：<\/p>\n<p>[\n\\Sigma=XFX'+D\n]<\/p>\n<p>(X) 是资产因子暴露，(F) 是因子协方差，(D) 是特异风险。<\/p>\n<h2>常见风格暴露<\/h2>\n<p>规模、价值、动量、波动、流动性、杠杆和成长等。每个模型的定义与估计方式不同，“Barra”更像一类工程框架而非唯一公式。<\/p>\n<h2>三个用途<\/h2>\n<ul>\n<li><strong>风险预测<\/strong>：估计组合波动和风险贡献。<\/li>\n<li><strong>组合约束<\/strong>：控制行业或风格偏离。<\/li>\n<li><strong>绩效归因<\/strong>：解释收益来自哪些暴露与个股选择。<\/li>\n<\/ul>\n<h2>隐藏风险<\/h2>\n<p>一个看似分散的百股组合，可能集中于小盘、成长或同一行业。风险模型能把证券数量背后的共同驱动显性化。<\/p>\n<h2>局限<\/h2>\n<p>暴露和协方差都会变化，极端期线性模型可能低估关联；新股和特殊资产的特异风险也难估。需要滚动校准与压力情景补充。<\/p>\n<h2>因子研究卡：定义、检验与组合<\/h2>\n<p>研究“Barra风险模型初探：看清组合里隐藏的风险暴露”时，先把经济直觉、因子定义与组合实现分开。下面的流程可防止一个看似漂亮的排序结果被行业、规模或数据口径误导。<\/p>\n<ol>\n<li>明确因子值、方向、截面范围、调仓频率和未来收益窗口。<\/li>\n<li>按决策时点对齐数据，处理极值、缺失，并说明标准化与中性化方法。<\/li>\n<li>同时查看 IC、Rank IC、分组单调性、换手率、成本后收益和不同市场阶段。<\/li>\n<li>将因子加入已有组合，检查边际贡献、相关性、风险暴露与容量，而不是只看单因子回测。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>因子定义随结果不断调整；应先冻结定义，再保留真正独立的样本外区间。<\/li>\n<li>忽略行业、规模或风格暴露；超额收益可能只是已知风险因子的替身。<\/li>\n<li>只看多空组合收益；实际多头组合还受基准、约束、换手和可交易性影响。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>因子方向、频率和未来收益窗口无歧义<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>数据按当时可得口径对齐<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>单调性、稳定性、换手和成本均已报告<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>与已有因子及风险暴露完成增量比较<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>风险模型把协方差压缩为因子与特异风险。<\/li>\n<li>它用于预测、约束和归因，而非直接寻找 Alpha。<\/li>\n<li>因子定义、时变关系和尾部必须持续监控。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为一个股票组合计算行业和风格暴露，找出前三大风险贡献，而不是只列前三大权重。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第064讲 什么是回测？用历史数据拍一部策略电影<\/strong>。<\/p>"}]}, {"no": 6, "name": "铁砧·回测与评估", "desc": "", "chapters": [{"n": 64, "title": "什么是回测？用历史数据拍一部策略电影", "html": "<h1>第064讲 什么是回测？用历史数据拍一部策略电影<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。回测不能保证未来表现。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解回测是历史条件下的决策模拟。<\/li>\n<li>掌握事件、状态和账本三类核心对象。<\/li>\n<li>区分研究回测与真实可交易结果。<\/li>\n<\/ul>\n<h2>回测像给策略拍电影<\/h2>\n<p>回测按时间顺序播放历史数据，让策略在每个时点只能看到当时信息，生成订单、模拟成交并更新账户。它不是把最终买卖点画到价格图上。<\/p>\n<h2>三个核心对象<\/h2>\n<ul>\n<li><strong>事件<\/strong>：行情到达、信号产生、订单提交、成交和公司行动。<\/li>\n<li><strong>状态<\/strong>：现金、持仓、未成交订单、风险暴露和当前参数。<\/li>\n<li><strong>账本<\/strong>：每笔现金流、交易成本、持仓市值与净值。<\/li>\n<\/ul>\n<p>只有账本守恒，绩效才可信。<\/p>\n<h2>两种框架<\/h2>\n<p>向量化回测适合低频、规则简单的横截面研究，计算快；事件驱动回测更适合订单、盘中路径和复杂状态，但实现更难。选择取决于策略，不是越复杂越好。<\/p>\n<h2>真实性阶梯<\/h2>\n<p>先验证信号方向，再加入调仓、手续费、滑点、成交限制、公司行动、借券和容量。每增加一层现实，结果通常更差，却更有决策价值。<\/p>\n<h2>回测能回答什么<\/h2>\n<p>它能检验规则在已知历史中的行为、风险和环境依赖，不能证明未来重复。好的回测是排除坏想法的过滤器，不是收益认证书。<\/p>\n<h2>回测审计：让好结果经得起追问<\/h2>\n<p>用“什么是回测？用历史数据拍一部策略电影”做一次回测审计。审计目标不是让收益率更高，而是确认历史模拟没有偷看未来、遗漏成本或把调参结果当成独立证据。<\/p>\n<ol>\n<li>画出数据、信号、订单、成交、持仓和收益记账的时间线。<\/li>\n<li>核对股票池、公司行动、退市样本、停牌涨跌停和成交量约束。<\/li>\n<li>把开发、验证和最终测试分开，并记录每次参数与规则变更。<\/li>\n<li>报告基准、成本后收益、回撤、换手、暴露、容量和稳健性，而不只报告年化收益率。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>反复查看测试集后仍称其为样本外；测试集一旦参与决策就已被污染。<\/li>\n<li>用理想价格和无限流动性成交；应建立可解释且偏保守的成交模型。<\/li>\n<li>只选择表现最好的区间、品种或参数；应披露完整实验空间和失败结果。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>时间线不存在未来信息或同价成交错误<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>股票池与公司行动采用历史时点口径<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>样本外区间未参与规则选择<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>成本、容量、暴露与压力测试结果齐全<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>回测必须按时间推进并维护真实状态与账本。<\/li>\n<li>向量化和事件驱动适合不同问题。<\/li>\n<li>回测用于理解与证伪，不用于证明未来收益。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>画出一次“收盘生成信号、次日开盘成交”的事件顺序，并标记每一步可用信息。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第065讲 回测平台大比拼：聚宽、米筐、Backtrader怎么选？<\/strong>。<\/p>"}, {"n": 65, "title": "回测平台大比拼：聚宽、米筐、Backtrader怎么选？", "html": "<h1>第065讲 回测平台大比拼：聚宽、米筐、Backtrader怎么选？<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。回测不能保证未来表现。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>按数据、框架、部署和可控性选择平台。<\/li>\n<li>理解云平台与本地框架的取舍。<\/li>\n<li>建立可迁移、可复现的研究流程。<\/li>\n<\/ul>\n<h2>先问需求，再选工具<\/h2>\n<p>平台选择不应只看示例代码是否短。先明确市场、频率、数据权限、撮合复杂度、团队技术能力、预算、部署方式和合规要求。<\/p>\n<h2>三类定位<\/h2>\n<table>\n<thead>\n<tr>\n<th>工具<\/th>\n<th>典型优势<\/th>\n<th>主要取舍<\/th>\n<th>更适合<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>聚宽<\/td>\n<td>云端研究、回测与模拟交易流程，国内市场上手快<\/td>\n<td>数据与运行环境受平台口径约束<\/td>\n<td>初学、快速验证国内低中频策略<\/td>\n<\/tr>\n<tr>\n<td>米筐<\/td>\n<td>数据 API、回测框架及较完整的专业工具链<\/td>\n<td>部分能力和数据涉及授权与本地环境配置<\/td>\n<td>需要专业数据、因子或本地 SDK 的研究<\/td>\n<\/tr>\n<tr>\n<td>Backtrader<\/td>\n<td>本地 Python 事件驱动、可扩展数据与策略组件<\/td>\n<td>数据、交易日历、质量和部署需自行负责<\/td>\n<td>需要代码控制、定制撮合与私有数据<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>功能与授权会更新，具体以<a target=\"_blank\" rel=\"noopener\" href=\"https://www.joinquant.com/guide\">聚宽官方指引<\/a>、<a target=\"_blank\" rel=\"noopener\" href=\"https://rqopen.ricequant.com/doc/\">米筐公开文档<\/a>和<a target=\"_blank\" rel=\"noopener\" href=\"https://www.backtrader.com/docu/\">Backtrader 官方文档<\/a>为准。<\/p>\n<h2>六项选择标准<\/h2>\n<ol>\n<li>数据是否覆盖目标市场并提供历史时点口径。<\/li>\n<li>撮合是否支持你的订单、涨跌停、停牌与显性交易费用。<\/li>\n<li>研究能否导出数据、代码、日志和环境版本。<\/li>\n<li>是否支持模拟或实盘交易接口及异常恢复。<\/li>\n<li>批量实验速度与调试体验是否满足团队。<\/li>\n<li>平台费用、许可、隐私和供应商锁定是否可接受。<\/li>\n<\/ol>\n<h2>推荐路径<\/h2>\n<p>新手可先用云平台验证逻辑，再用最小独立数据复现关键结果；工程需求较高时转本地框架。无论平台，策略逻辑、数据版本和测试都应由自己掌握。<\/p>\n<h2>不要迷信结果一致<\/h2>\n<p>同一代码在不同平台可能因复权、交易日历、显性交易费用、成交价和停牌处理产生差异。迁移时应先对齐一段小样本的输入、订单和净值。<\/p>\n<h2>回测审计：让好结果经得起追问<\/h2>\n<p>用“回测平台大比拼：聚宽、米筐、Backtrader怎么选？”做一次回测审计。审计目标不是让收益率更高，而是确认历史模拟没有偷看未来、遗漏成本或把调参结果当成独立证据。<\/p>\n<ol>\n<li>画出数据、信号、订单、成交、持仓和收益记账的时间线。<\/li>\n<li>核对股票池、公司行动、退市样本、停牌涨跌停和成交量约束。<\/li>\n<li>把开发、验证和最终测试分开，并记录每次参数与规则变更。<\/li>\n<li>报告基准、成本后收益、回撤、换手、暴露、容量和稳健性，而不只报告年化收益率。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>反复查看测试集后仍称其为样本外；测试集一旦参与决策就已被污染。<\/li>\n<li>用理想价格和无限流动性成交；应建立可解释且偏保守的成交模型。<\/li>\n<li>只选择表现最好的区间、品种或参数；应披露完整实验空间和失败结果。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>时间线不存在未来信息或同价成交错误<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>股票池与公司行动采用历史时点口径<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>样本外区间未参与规则选择<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>成本、容量、暴露与压力测试结果齐全<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>平台要根据市场、数据、撮合、部署和可控性选择。<\/li>\n<li>云平台降低门槛，本地框架提高控制但增加工程责任。<\/li>\n<li>跨平台结果必须逐层对齐，不能只看最终收益。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>用六项标准给自己的策略制作平台评分表，并选一个月小样本做跨平台净值核对。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第066讲 回测绩效指标大全：除了收益率还要看什么？<\/strong>。<\/p>"}, {"n": 66, "title": "回测绩效指标大全：除了收益率还要看什么？", "html": "<h1>第066讲 回测绩效指标大全：除了收益率还要看什么？<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。回测不能保证未来表现。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>建立收益、风险、效率和交易四类指标体系。<\/li>\n<li>理解指标之间的重复与冲突。<\/li>\n<li>用基准和环境拆分策略表现。<\/li>\n<\/ul>\n<h2>收益类<\/h2>\n<p>累计收益率、几何年化、月度胜率和超额收益描述不同问题。绝对收益高可能只是高 Beta；应同时报告相对基准与无风险资产的结果。<\/p>\n<h2>风险类<\/h2>\n<p>年化波动率、最大回撤、回撤持续期、下行波动、VaR/CVaR、偏度与最差单期。没有一个指标能覆盖全部风险。<\/p>\n<h2>风险调整类<\/h2>\n<p>夏普比率使用总波动，Sortino 关注下行波动，Calmar 用年化收益率除以最大回撤，信息比率比较主动收益与跟踪误差。分母不同，排序可能不同。<\/p>\n<h2>交易与容量<\/h2>\n<p>换手率、交易次数、平均持有期、胜率、盈亏比、交易成本占毛收益、市场冲击成本和资金容量。交易成本前优秀、交易成本后消失的策略没有实盘交易价值。<\/p>\n<h2>稳定性<\/h2>\n<p>按年份、市场状态、资产和参数切片，观察收益是否集中。还要做收益归因，区分市场、行业、风格和个股选择。<\/p>\n<h2>报告模板<\/h2>\n<p>至少同时给出净值、回撤、月度收益、关键指标、成本、持仓与暴露。指标表是摘要，不能替代路径图和交易明细。<\/p>\n<h2>回测审计：让好结果经得起追问<\/h2>\n<p>用“回测绩效指标大全：除了收益率还要看什么？”做一次回测审计。审计目标不是让收益率更高，而是确认历史模拟没有偷看未来、遗漏成本或把调参结果当成独立证据。<\/p>\n<ol>\n<li>画出数据、信号、订单、成交、持仓和收益记账的时间线。<\/li>\n<li>核对股票池、公司行动、退市样本、停牌涨跌停和成交量约束。<\/li>\n<li>把开发、验证和最终测试分开，并记录每次参数与规则变更。<\/li>\n<li>报告基准、成本后收益、回撤、换手、暴露、容量和稳健性，而不只报告年化收益率。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>反复查看测试集后仍称其为样本外；测试集一旦参与决策就已被污染。<\/li>\n<li>用理想价格和无限流动性成交；应建立可解释且偏保守的成交模型。<\/li>\n<li>只选择表现最好的区间、品种或参数；应披露完整实验空间和失败结果。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>时间线不存在未来信息或同价成交错误<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>股票池与公司行动采用历史时点口径<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>样本外区间未参与规则选择<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>成本、容量、暴露与压力测试结果齐全<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>绩效应覆盖收益、风险、风险调整、交易和稳定性。<\/li>\n<li>不同指标回答不同问题，不能只挑最好看的一个。<\/li>\n<li>基准、成本与归因决定收益含义。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为一个回测制作一页报告，限制在十项指标，并解释每项帮助做什么决策。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第067讲 前视偏差：无意间偷看未来的致命失误<\/strong>。<\/p>"}, {"n": 67, "title": "前视偏差：无意间偷看未来的致命失误", "html": "<h1>第067讲 前视偏差：无意间偷看未来的致命失误<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。回测不能保证未来表现。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>识别显式与隐式前视偏差。<\/li>\n<li>正确处理信号、数据发布和成交时点。<\/li>\n<li>为回测建立自动防泄漏测试。<\/li>\n<\/ul>\n<h2>什么是前视<\/h2>\n<p>前视偏差是策略在历史时点使用了当时尚不可得的信息。它可能很明显，也可能藏在数据处理和库函数中。<\/p>\n<h2>常见来源<\/h2>\n<ul>\n<li>用当日收盘生成信号并按同一收盘成交。<\/li>\n<li>财报按报告期而非公告时间进入。<\/li>\n<li>使用全样本均值、标准差或主成分处理早期数据。<\/li>\n<li>用未来最高最低决定当前标签或止损成交。<\/li>\n<li>历史成分表实际上来自今天。<\/li>\n<\/ul>\n<h2>正确时间轴<\/h2>\n<p>每个字段应同时有“事件发生时间”和“系统可获取时间”。信号只读取获取时间不晚于决策时点的数据，订单再在下一合法时点成交。<\/p>\n<h2>工程防线<\/h2>\n<p>采用时间感知查询、滚动拟合、训练与回测分离、对数据做 as-of join，并在逐日循环中断言不能访问未来索引。<\/p>\n<h2>反常识测试<\/h2>\n<p>将所有信号整体滞后一日，结果若断崖式恶化，应重点检查时点；把未来数据置空后，早期结果不应改变。前视偏差常让策略好得不真实。<\/p>\n<h2>回测审计：让好结果经得起追问<\/h2>\n<p>用“前视偏差：无意间偷看未来的致命失误”做一次回测审计。审计目标不是让收益率更高，而是确认历史模拟没有偷看未来、遗漏成本或把调参结果当成独立证据。<\/p>\n<ol>\n<li>画出数据、信号、订单、成交、持仓和收益记账的时间线。<\/li>\n<li>核对股票池、公司行动、退市样本、停牌涨跌停和成交量约束。<\/li>\n<li>把开发、验证和最终测试分开，并记录每次参数与规则变更。<\/li>\n<li>报告基准、成本后收益、回撤、换手、暴露、容量和稳健性，而不只报告年化收益率。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>反复查看测试集后仍称其为样本外；测试集一旦参与决策就已被污染。<\/li>\n<li>用理想价格和无限流动性成交；应建立可解释且偏保守的成交模型。<\/li>\n<li>只选择表现最好的区间、品种或参数；应披露完整实验空间和失败结果。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>时间线不存在未来信息或同价成交错误<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>股票池与公司行动采用历史时点口径<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>样本外区间未参与规则选择<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>成本、容量、暴露与压力测试结果齐全<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>前视偏差可来自信号、预处理、成分和成交。<\/li>\n<li>事件时间与可获取时间必须分离。<\/li>\n<li>滞后与未来置空测试能发现部分泄漏。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为一条财务因子画出报告期、公告日、数据入库和首次可交易四个时间点。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第068讲 幸存者偏差（回测篇）：你引以为豪的收益可能根本不存在<\/strong>。<\/p>"}, {"n": 68, "title": "幸存者偏差（回测篇）：你引以为豪的收益可能根本不存在", "html": "<h1>第068讲 幸存者偏差（回测篇）：你引以为豪的收益可能根本不存在<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。回测不能保证未来表现。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>把幸存者偏差落实到回测工程。<\/li>\n<li>正确生成历史股票池和基金池。<\/li>\n<li>量化偏差对收益与回撤的影响。<\/li>\n<\/ul>\n<h2>回测中的隐形删选<\/h2>\n<p>若数据库只保留当前证券，失败者从历史中消失，策略像参加一场提前淘汰弱者的比赛。指数成分、基金样本和策略库都存在同类问题。<\/p>\n<h2>时点化宇宙<\/h2>\n<p>在每个调仓日，根据上市、退市、交易状态、历史成分和当时可得基本面生成股票池。筛选规则本身也必须时点化。<\/p>\n<h2>退市与缺失收益<\/h2>\n<p>不能把最后价格后直接停止记账。应处理退市结算、换股、破产和无法成交；信息不足时使用保守假设，并报告敏感性。<\/p>\n<h2>量化影响<\/h2>\n<p>做两次回测：当前存续池与完整历史池。比较年化、最大回撤、持仓数量和最差证券。差异本身就是偏差估计。<\/p>\n<h2>供应商问答<\/h2>\n<p>询问是否含退市代码、历史成分、失效基金、代码变更和公司行动版本。没有明确答案就不能默认无偏。<\/p>\n<h2>回测审计：让好结果经得起追问<\/h2>\n<p>用“幸存者偏差（回测篇）：你引以为豪的收益可能根本不存在”做一次回测审计。审计目标不是让收益率更高，而是确认历史模拟没有偷看未来、遗漏成本或把调参结果当成独立证据。<\/p>\n<ol>\n<li>画出数据、信号、订单、成交、持仓和收益记账的时间线。<\/li>\n<li>核对股票池、公司行动、退市样本、停牌涨跌停和成交量约束。<\/li>\n<li>把开发、验证和最终测试分开，并记录每次参数与规则变更。<\/li>\n<li>报告基准、成本后收益、回撤、换手、暴露、容量和稳健性，而不只报告年化收益率。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>反复查看测试集后仍称其为样本外；测试集一旦参与决策就已被污染。<\/li>\n<li>用理想价格和无限流动性成交；应建立可解释且偏保守的成交模型。<\/li>\n<li>只选择表现最好的区间、品种或参数；应披露完整实验空间和失败结果。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>时间线不存在未来信息或同价成交错误<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>股票池与公司行动采用历史时点口径<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>样本外区间未参与规则选择<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>成本、容量、暴露与压力测试结果齐全<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>历史股票池必须按当时状态生成。<\/li>\n<li>退市证券需要真实或保守现金流处理。<\/li>\n<li>双版本回测可直观量化幸存者偏差。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>在同一策略上比较当前指数成分与历史成分回测，记录差异来源。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第069讲 过拟合的魔咒：参数越多，死得越快<\/strong>。<\/p>"}, {"n": 69, "title": "过拟合的魔咒：参数越多，死得越快", "html": "<h1>第069讲 过拟合的魔咒：参数越多，死得越快<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。回测不能保证未来表现。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解参数、特征和策略选择的过拟合。<\/li>\n<li>识别多次试验与漂亮曲线的关系。<\/li>\n<li>用简化和预注册减少自由度。<\/li>\n<\/ul>\n<h2>过拟合是什么<\/h2>\n<p>模型把历史中的噪声当成规律，样本内表现很好，未来却失效。参数越多、试验越多、样本越短，选择到偶然赢家的概率越高。<\/p>\n<h2>过拟合不只在机器学习<\/h2>\n<p>挑均线窗口、回测起点、股票池、过滤条件和绩效指标都属于模型选择。即使最终策略只有一条规则，背后试过上千版本也可能严重过拟合。<\/p>\n<h2>典型信号<\/h2>\n<ul>\n<li>最优参数像孤立尖峰。<\/li>\n<li>小改日期或交易成本，结果大变。<\/li>\n<li>收益集中于少数交易。<\/li>\n<li>逻辑解释在看到结果后才出现。<\/li>\n<li>样本外明显低于样本内。<\/li>\n<\/ul>\n<h2>减少方法<\/h2>\n<p>先写研究假设和失败条件；保留简单基线；限制参数和试验预算；使用时间样本外、滚动验证与多市场复现；对所有试验保留日志。<\/p>\n<h2>正确目标<\/h2>\n<p>不要最大化历史指标，而要寻找在合理参数、成本和环境扰动下仍能工作的稳定区域。宁可接受较低的纸面夏普比率，也不要依赖精确巧合。<\/p>\n<h2>回测审计：让好结果经得起追问<\/h2>\n<p>用“过拟合的魔咒：参数越多，死得越快”做一次回测审计。审计目标不是让收益率更高，而是确认历史模拟没有偷看未来、遗漏成本或把调参结果当成独立证据。<\/p>\n<ol>\n<li>画出数据、信号、订单、成交、持仓和收益记账的时间线。<\/li>\n<li>核对股票池、公司行动、退市样本、停牌涨跌停和成交量约束。<\/li>\n<li>把开发、验证和最终测试分开，并记录每次参数与规则变更。<\/li>\n<li>报告基准、成本后收益、回撤、换手、暴露、容量和稳健性，而不只报告年化收益率。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>反复查看测试集后仍称其为样本外；测试集一旦参与决策就已被污染。<\/li>\n<li>用理想价格和无限流动性成交；应建立可解释且偏保守的成交模型。<\/li>\n<li>只选择表现最好的区间、品种或参数；应披露完整实验空间和失败结果。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>时间线不存在未来信息或同价成交错误<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>股票池与公司行动采用历史时点口径<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>样本外区间未参与规则选择<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>成本、容量、暴露与压力测试结果齐全<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>过拟合来自研究自由度相对样本过高。<\/li>\n<li>简单策略也会因大量隐形试验过拟合。<\/li>\n<li>稳定区域和样本外表现优于单点最优。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>画一张策略参数热图，标记最优点周围是否存在连续稳定区域。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第070讲 样本外测试与交叉验证：给策略做压力体检<\/strong>。<\/p>"}, {"n": 70, "title": "样本外测试与交叉验证：给策略做压力体检", "html": "<h1>第070讲 样本外测试与交叉验证：给策略做压力体检<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。回测不能保证未来表现。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>区分训练、验证和最终样本外。<\/li>\n<li>理解时间序列交叉验证的特殊性。<\/li>\n<li>避免重叠标签和反复查看测试集。<\/li>\n<\/ul>\n<h2>样本外的职责<\/h2>\n<p>训练集用于估计，验证集用于选择，最终测试集只用于一次独立评估。若看完测试结果再改模型，测试集就已经变成训练资料。<\/p>\n<h2>时间不能随机打乱<\/h2>\n<p>金融数据有顺序和状态变化。随机 K 折会把未来环境混入过去。更合理的是扩展窗口或滚动窗口：用过去训练，在随后时期验证，再向前移动。<\/p>\n<h2>重叠标签<\/h2>\n<p>若标签使用未来 20 日收益，相邻样本共享未来区间。训练和验证边界需留出隔离期；purge 与 embargo 思想用于减少信息重叠。<\/p>\n<h2>模型选择<\/h2>\n<p>先在多个滚动折中比较稳定性，再锁定规则，最后运行保留测试。报告各折分布而不是只给拼接平均。<\/p>\n<h2>仍然无法保证未来<\/h2>\n<p>样本外只是降低研究者直接拟合该区间的程度；若所有时期都属于同一制度，真正未来仍可能不同。压力测试与经济解释仍需要。<\/p>\n<h2>回测审计：让好结果经得起追问<\/h2>\n<p>用“样本外测试与交叉验证：给策略做压力体检”做一次回测审计。审计目标不是让收益率更高，而是确认历史模拟没有偷看未来、遗漏成本或把调参结果当成独立证据。<\/p>\n<ol>\n<li>画出数据、信号、订单、成交、持仓和收益记账的时间线。<\/li>\n<li>核对股票池、公司行动、退市样本、停牌涨跌停和成交量约束。<\/li>\n<li>把开发、验证和最终测试分开，并记录每次参数与规则变更。<\/li>\n<li>报告基准、成本后收益、回撤、换手、暴露、容量和稳健性，而不只报告年化收益率。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>反复查看测试集后仍称其为样本外；测试集一旦参与决策就已被污染。<\/li>\n<li>用理想价格和无限流动性成交；应建立可解释且偏保守的成交模型。<\/li>\n<li>只选择表现最好的区间、品种或参数；应披露完整实验空间和失败结果。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>时间线不存在未来信息或同价成交错误<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>股票池与公司行动采用历史时点口径<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>样本外区间未参与规则选择<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>成本、容量、暴露与压力测试结果齐全<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>最终测试集不能被反复用于改模型。<\/li>\n<li>时间序列应使用滚动或扩展窗口验证。<\/li>\n<li>重叠标签需要隔离训练与验证边界。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为一个使用未来 20 日收益标签的模型设计三折滚动验证，并标出 purge 区间。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第071讲 稳健性检验：换个品种、换个时段，策略还灵吗？<\/strong>。<\/p>"}, {"n": 71, "title": "稳健性检验：换个品种、换个时段，策略还灵吗？", "html": "<h1>第071讲 稳健性检验：换个品种、换个时段，策略还灵吗？<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。回测不能保证未来表现。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>掌握参数、时间、资产、成本和数据稳健性检验。<\/li>\n<li>区分稳健与平均化问题。<\/li>\n<li>形成策略上线前的证据矩阵。<\/li>\n<\/ul>\n<h2>稳健性问什么<\/h2>\n<p>它不要求策略在所有地方都赚钱，而是检查优势是否依赖一个脆弱巧合。每项检验都应与策略机制有关。<\/p>\n<h2>五类检验<\/h2>\n<ol>\n<li><strong>参数扰动<\/strong>：窗口、阈值轻微变化。<\/li>\n<li><strong>时间切片<\/strong>：牛熊、危机、平静和不同年代。<\/li>\n<li><strong>资产迁移<\/strong>：相似市场或品种是否有同方向证据。<\/li>\n<li><strong>成本压力<\/strong>：显性交易费用、滑点和延迟翻倍。<\/li>\n<li><strong>数据口径<\/strong>：供应商、复权和异常处理变化。<\/li>\n<\/ol>\n<h2>结果如何解释<\/h2>\n<p>若只有精确参数有效，可能过拟合；若只在一个资产有效，可能是特定机制，也可能偶然。稳健性不是要求每格绿色，而是要求失败模式与经济逻辑一致且风险可承受。<\/p>\n<h2>证据矩阵<\/h2>\n<p>为每个版本记录收益、回撤、换手率、暴露和交易数，禁止只保留最好结果。把“通过标准”在测试前写下。<\/p>\n<h2>上线决策<\/h2>\n<p>上线依据应是多维证据：逻辑合理、数据可靠、样本外可接受、成本后为正、压力下可生存、监控可实现。<\/p>\n<h2>回测审计：让好结果经得起追问<\/h2>\n<p>用“稳健性检验：换个品种、换个时段，策略还灵吗？”做一次回测审计。审计目标不是让收益率更高，而是确认历史模拟没有偷看未来、遗漏成本或把调参结果当成独立证据。<\/p>\n<ol>\n<li>画出数据、信号、订单、成交、持仓和收益记账的时间线。<\/li>\n<li>核对股票池、公司行动、退市样本、停牌涨跌停和成交量约束。<\/li>\n<li>把开发、验证和最终测试分开，并记录每次参数与规则变更。<\/li>\n<li>报告基准、成本后收益、回撤、换手、暴露、容量和稳健性，而不只报告年化收益率。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>反复查看测试集后仍称其为样本外；测试集一旦参与决策就已被污染。<\/li>\n<li>用理想价格和无限流动性成交；应建立可解释且偏保守的成交模型。<\/li>\n<li>只选择表现最好的区间、品种或参数；应披露完整实验空间和失败结果。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>时间线不存在未来信息或同价成交错误<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>股票池与公司行动采用历史时点口径<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>样本外区间未参与规则选择<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>成本、容量、暴露与压力测试结果齐全<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>稳健性检验寻找对合理扰动不敏感的证据。<\/li>\n<li>失败并非一律否决，关键是是否符合机制与风险预算。<\/li>\n<li>上线应基于证据矩阵而非单一绩效。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为自己的策略建立五类稳健性测试表，并在运行前写下通过阈值。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第072讲 仓位管理的数学：凯利公式与最优投注比例<\/strong>。<\/p>"}]}, {"no": 7, "name": "风控·活着才有输出", "desc": "资金管理和风控是量化的生命线，这一模块教你把底线思维写入策略。", "chapters": [{"n": 72, "title": "仓位管理的数学：凯利公式与最优投注比例", "html": "<h1>第072讲 仓位管理的数学：凯利公式与最优投注比例<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。风控指标与阈值需结合资产、流动性和个人承受能力验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解仓位决定优势能否存活。<\/li>\n<li>掌握凯利公式的直觉与估计风险。<\/li>\n<li>用分数凯利和风险预算控制不确定性。<\/li>\n<\/ul>\n<h2>正期望不等于可以重仓<\/h2>\n<p>仓位过小，优势难以贡献；仓位过大，正常波动也可能导致永久损失。资金管理是在增长速度和生存概率之间取舍。<\/p>\n<h2>凯利公式<\/h2>\n<p>对胜率 (p)、赔率净收益倍数 (b)、失败概率 (q=1-p) 的重复下注，凯利比例为：<\/p>\n<p>[\nf^*=\\frac{bp-q}{b}\n]<\/p>\n<p>连续近似中常见 (f^*\\approx\\mu/\\sigma^2)。它最大化长期对数财富增长，但依赖概率和分布估计准确。<\/p>\n<h2>为什么实务常用分数凯利<\/h2>\n<p>胜率、相关性和尾部都可能被低估。使用半凯利或更低比例会牺牲部分理论增长，显著降低波动与模型误差伤害。<\/p>\n<h2>从单笔到组合<\/h2>\n<p>多个信号相关时不能分别满额使用凯利，否则重复计算优势。应基于组合协方差、杠杆和风险预算联合定仓。<\/p>\n<h2>硬约束<\/h2>\n<p>无论公式结果多高，都要设置单资产、策略、流动性、杠杆和压力损失上限。凯利是理解仓位的工具，不是自动下注按钮。<\/p>\n<h2>风险预案：触发之后具体做什么<\/h2>\n<p>围绕“仓位管理的数学：凯利公式与最优投注比例”写一份可执行的风险预案。风险指标只有绑定阈值、权限、动作和恢复条件，才能从报告上的数字变成真正的控制。<\/p>\n<ol>\n<li>定义风险对象、计算窗口、更新频率、阈值和数据依赖。<\/li>\n<li>设置预警、降仓、停止开仓和紧急平仓等分级动作，并明确授权人。<\/li>\n<li>加入相关性上升、流动性消失、价格跳空和模型失效等非历史常态情景。<\/li>\n<li>规定事件记录、复盘、重新启用条件与人工覆盖流程。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>把历史波动率当成全部风险；尾部、流动性和操作风险需要单独处理。<\/li>\n<li>只有止损阈值，没有成交与恢复方案；极端市场里订单可能无法按预期成交。<\/li>\n<li>风险规则频繁临时修改；任何人工覆盖都应授权、留痕并事后复盘。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>指标、阈值、动作和负责人一一对应<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少覆盖一个历史未充分出现的压力情景<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>组合级风险与单资产风险均有限额<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>暂停、恢复和人工覆盖流程可审计<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>仓位连接统计优势与破产风险。<\/li>\n<li>凯利最大化理想条件下的长期对数增长。<\/li>\n<li>估计误差和尾部使分数凯利更现实。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>设胜率 55%、赢赚 1、输亏 1，计算凯利、半凯利，并比较连续十次亏损后的资金影响。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第073讲 止损的艺术：固定止损、吊灯止损、移动止损<\/strong>。<\/p>"}, {"n": 73, "title": "止损的艺术：固定止损、吊灯止损、移动止损", "html": "<h1>第073讲 止损的艺术：固定止损、吊灯止损、移动止损<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。风控指标与阈值需结合资产、流动性和个人承受能力验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>区分固定、波动、吊灯和移动止损。<\/li>\n<li>理解止损对收益分布和交易成本的影响。<\/li>\n<li>设计可成交且不与策略逻辑冲突的退出。<\/li>\n<\/ul>\n<h2>止损不是万能保险<\/h2>\n<p>止损在价格不利时退出，限制单次暴露并释放资金，但跳空和流动性会让实际成交差于止损价。它控制规则内风险，不保证最大损失。<\/p>\n<h2>四类止损<\/h2>\n<ul>\n<li><strong>固定比例<\/strong>：相对入场价下跌一定比例，简单但忽略波动差异。<\/li>\n<li><strong>波动止损<\/strong>：以 ATR 或波动倍数设距离，更适配资产状态。<\/li>\n<li><strong>吊灯止损<\/strong>：从持仓后最高价减去若干 ATR，保护趋势利润。<\/li>\n<li><strong>移动止损<\/strong>：止损只沿有利方向移动，不向亏损方向放宽。<\/li>\n<\/ul>\n<h2>止损与策略类型<\/h2>\n<p>趋势策略常需要较宽止损容忍噪声，均值回归策略若偏离继续扩大，可能说明机制破坏。止损应反映假设何时失效，而非只选择历史最好参数。<\/p>\n<h2>回测要求<\/h2>\n<p>明确触发使用高低价还是收盘、跳空成交规则、盘内多个事件顺序和交易成本。日线无法准确模拟复杂盘中止损，应采用保守假设。<\/p>\n<h2>评价<\/h2>\n<p>比较止损前后的尾部、平均亏损、换手率、错过反弹和总收益。降低最大回撤可能以更高频小亏为代价。<\/p>\n<h2>风险预案：触发之后具体做什么<\/h2>\n<p>围绕“止损的艺术：固定止损、吊灯止损、移动止损”写一份可执行的风险预案。风险指标只有绑定阈值、权限、动作和恢复条件，才能从报告上的数字变成真正的控制。<\/p>\n<ol>\n<li>定义风险对象、计算窗口、更新频率、阈值和数据依赖。<\/li>\n<li>设置预警、降仓、停止开仓和紧急平仓等分级动作，并明确授权人。<\/li>\n<li>加入相关性上升、流动性消失、价格跳空和模型失效等非历史常态情景。<\/li>\n<li>规定事件记录、复盘、重新启用条件与人工覆盖流程。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>把历史波动率当成全部风险；尾部、流动性和操作风险需要单独处理。<\/li>\n<li>只有止损阈值，没有成交与恢复方案；极端市场里订单可能无法按预期成交。<\/li>\n<li>风险规则频繁临时修改；任何人工覆盖都应授权、留痕并事后复盘。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>指标、阈值、动作和负责人一一对应<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少覆盖一个历史未充分出现的压力情景<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>组合级风险与单资产风险均有限额<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>暂停、恢复和人工覆盖流程可审计<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>止损限制暴露，但不能保证成交价。<\/li>\n<li>止损类型应与资产波动和策略机制匹配。<\/li>\n<li>评价需同时看尾部、换手率和机会成本。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为同一趋势策略测试固定 8% 与 3×ATR 吊灯止损，比较不同波动阶段。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第074讲 组合风险：相关性怎样左右你账户的最大回撤？<\/strong>。<\/p>"}, {"n": 74, "title": "组合风险：相关性怎样左右你账户的最大回撤？", "html": "<h1>第074讲 组合风险：相关性怎样左右你账户的最大回撤？<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。风控指标与阈值需结合资产、流动性和个人承受能力验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解相关性如何进入组合损失。<\/li>\n<li>从权重转向边际风险贡献。<\/li>\n<li>管理危机中的相关上升。<\/li>\n<\/ul>\n<h2>最大持仓不等于最大风险<\/h2>\n<p>一只高波资产 5% 权重可能比一只低波资产 20% 权重贡献更多风险。组合方差为 (w'\\Sigma w)，权重与协方差共同决定结果。<\/p>\n<h2>边际风险贡献<\/h2>\n<p>资产对组合波动的边际影响与 (\\Sigma w) 有关。风险贡献近似为权重乘边际风险，再除以组合波动。它能揭示表面分散下的集中。<\/p>\n<h2>相关性会变<\/h2>\n<p>平静期估计的低相关，危机中可能因共同去杠杆上升。应额外计算下跌期相关、尾部共振和历史压力窗口。<\/p>\n<h2>组合回撤<\/h2>\n<p>回撤不仅由单资产风险决定，还受再平衡、杠杆和流动性影响。多个资产同时跌且无法调仓时，模型协方差会低估损失。<\/p>\n<h2>管理方法<\/h2>\n<p>设置风险贡献上限、因子与行业限制、流动性缓冲和压力损失上限；使用收缩协方差并避免过度相信短窗口。<\/p>\n<h2>风险预案：触发之后具体做什么<\/h2>\n<p>围绕“组合风险：相关性怎样左右你账户的最大回撤？”写一份可执行的风险预案。风险指标只有绑定阈值、权限、动作和恢复条件，才能从报告上的数字变成真正的控制。<\/p>\n<ol>\n<li>定义风险对象、计算窗口、更新频率、阈值和数据依赖。<\/li>\n<li>设置预警、降仓、停止开仓和紧急平仓等分级动作，并明确授权人。<\/li>\n<li>加入相关性上升、流动性消失、价格跳空和模型失效等非历史常态情景。<\/li>\n<li>规定事件记录、复盘、重新启用条件与人工覆盖流程。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>把历史波动率当成全部风险；尾部、流动性和操作风险需要单独处理。<\/li>\n<li>只有止损阈值，没有成交与恢复方案；极端市场里订单可能无法按预期成交。<\/li>\n<li>风险规则频繁临时修改；任何人工覆盖都应授权、留痕并事后复盘。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>指标、阈值、动作和负责人一一对应<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少覆盖一个历史未充分出现的压力情景<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>组合级风险与单资产风险均有限额<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>暂停、恢复和人工覆盖流程可审计<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>组合风险由权重、波动和相关共同决定。<\/li>\n<li>风险贡献比持仓数量更能揭示集中。<\/li>\n<li>危机相关与流动性需要压力测试补充。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>对三资产组合计算边际风险贡献，并调整权重使最大贡献下降。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第075讲 VaR与CVaR：用数字告诉你，极端情况会亏多少<\/strong>。<\/p>"}, {"n": 75, "title": "VaR与CVaR：用数字告诉你，极端情况会亏多少", "html": "<h1>第075讲 VaR与CVaR：用数字告诉你，极端情况会亏多少<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。风控指标与阈值需结合资产、流动性和个人承受能力验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解 VaR 分位损失与 CVaR 尾部均值。<\/li>\n<li>掌握历史、参数和模拟三种估计。<\/li>\n<li>识别模型与流动性局限。<\/li>\n<\/ul>\n<h2>VaR 回答什么<\/h2>\n<p>给定持有期与置信水平，VaR 表示损失分布的某个分位阈值。例如 95% 一日 VaR 并不意味着最大损失，只表示模型下约 5% 情形会更差。<\/p>\n<h2>CVaR<\/h2>\n<p>CVaR（Expected Shortfall）是超过 VaR 后的平均损失，更关注尾部严重程度。两个组合 VaR 相同，CVaR 可能完全不同。<\/p>\n<h2>三种方法<\/h2>\n<ul>\n<li><strong>历史模拟<\/strong>：直接用历史收益，保留非正态，但受样本限制。<\/li>\n<li><strong>参数法<\/strong>：假设分布并用均值协方差估计，快速但可能低估厚尾。<\/li>\n<li><strong>蒙特卡洛<\/strong>：模拟风险因子路径，灵活但依赖模型。<\/li>\n<\/ul>\n<h2>口径<\/h2>\n<p>必须说明置信度、持有期、头寸是否动态、估值模型和数据窗口。不能随意用平方根时间把一日 VaR 扩展到长期。<\/p>\n<h2>局限<\/h2>\n<p>历史外事件、流动性冲击、非线性期权和相关性突变都可能使 VaR 失真。它应与压力测试、限额和情景分析一起使用。<\/p>\n<h2>风险预案：触发之后具体做什么<\/h2>\n<p>围绕“VaR与CVaR：用数字告诉你，极端情况会亏多少”写一份可执行的风险预案。风险指标只有绑定阈值、权限、动作和恢复条件，才能从报告上的数字变成真正的控制。<\/p>\n<ol>\n<li>定义风险对象、计算窗口、更新频率、阈值和数据依赖。<\/li>\n<li>设置预警、降仓、停止开仓和紧急平仓等分级动作，并明确授权人。<\/li>\n<li>加入相关性上升、流动性消失、价格跳空和模型失效等非历史常态情景。<\/li>\n<li>规定事件记录、复盘、重新启用条件与人工覆盖流程。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>把历史波动率当成全部风险；尾部、流动性和操作风险需要单独处理。<\/li>\n<li>只有止损阈值，没有成交与恢复方案；极端市场里订单可能无法按预期成交。<\/li>\n<li>风险规则频繁临时修改；任何人工覆盖都应授权、留痕并事后复盘。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>指标、阈值、动作和负责人一一对应<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少覆盖一个历史未充分出现的压力情景<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>组合级风险与单资产风险均有限额<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>暂停、恢复和人工覆盖流程可审计<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>VaR 是分位阈值，不是最大亏损。<\/li>\n<li>CVaR 描述越过阈值后的平均尾部损失。<\/li>\n<li>方法选择与假设必须透明，并由压力测试补充。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>用 100 个日收益计算 95% 历史 VaR 与 CVaR，比较最坏 5 个样本。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第076讲 压力测试：模拟明天突然出现股灾的情形<\/strong>。<\/p>"}, {"n": 76, "title": "压力测试：模拟明天突然出现股灾的情形", "html": "<h1>第076讲 压力测试：模拟明天突然出现股灾的情形<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。风控指标与阈值需结合资产、流动性和个人承受能力验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>设计历史、假设和反向压力情景。<\/li>\n<li>把市场冲击映射为组合盈亏。<\/li>\n<li>让压力测试产生可执行预案。<\/li>\n<\/ul>\n<h2>压力测试不是预测日期<\/h2>\n<p>它问“如果极端但合理的变化发生，组合会怎样”，目的在暴露脆弱性，而非精确预测明天。<\/p>\n<h2>三类情景<\/h2>\n<ul>\n<li><strong>历史重演<\/strong>：将已知危机窗口的风险因子变化应用到当前持仓。<\/li>\n<li><strong>假设冲击<\/strong>：股票下跌、利率跳升、波动飙升、汇率变化和流动性折价联合发生。<\/li>\n<li><strong>反向压力<\/strong>：先定义不可承受损失，再寻找什么组合冲击会触发它。<\/li>\n<\/ul>\n<h2>映射方法<\/h2>\n<p>股票可按市场、行业和风格 Beta 映射；债券按久期与信用利差；期权需要重估 Delta、Gamma 和 Vega；非线性头寸不能只做一阶近似。<\/p>\n<h2>二阶效应<\/h2>\n<p>保证金上调、相关性上升、交易成本扩大和无法卖出常比首轮价格冲击更危险。压力测试应包含被迫去杠杆。<\/p>\n<h2>从结果到行动<\/h2>\n<p>为每个情景定义减仓顺序、现金缓冲、对冲工具、订单权限和负责人。只有能触发行动的压力测试才是风控工具。<\/p>\n<h2>风险预案：触发之后具体做什么<\/h2>\n<p>围绕“压力测试：模拟明天突然出现股灾的情形”写一份可执行的风险预案。风险指标只有绑定阈值、权限、动作和恢复条件，才能从报告上的数字变成真正的控制。<\/p>\n<ol>\n<li>定义风险对象、计算窗口、更新频率、阈值和数据依赖。<\/li>\n<li>设置预警、降仓、停止开仓和紧急平仓等分级动作，并明确授权人。<\/li>\n<li>加入相关性上升、流动性消失、价格跳空和模型失效等非历史常态情景。<\/li>\n<li>规定事件记录、复盘、重新启用条件与人工覆盖流程。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>把历史波动率当成全部风险；尾部、流动性和操作风险需要单独处理。<\/li>\n<li>只有止损阈值，没有成交与恢复方案；极端市场里订单可能无法按预期成交。<\/li>\n<li>风险规则频繁临时修改；任何人工覆盖都应授权、留痕并事后复盘。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>指标、阈值、动作和负责人一一对应<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少覆盖一个历史未充分出现的压力情景<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>组合级风险与单资产风险均有限额<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>暂停、恢复和人工覆盖流程可审计<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>压力测试关注极端情景下的脆弱性。<\/li>\n<li>历史、假设和反向压力各有用途。<\/li>\n<li>价格冲击之外还要模拟流动性与保证金反馈。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>设计一个股灾情景：市场 -20%、波动翻倍、相关上升、滑点三倍，计算组合损失与减仓顺序。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第077讲 资金曲线管理：连续回撤时，什么时候该暂停交易？<\/strong>。<\/p>"}, {"n": 77, "title": "资金曲线管理：连续回撤时，什么时候该暂停交易？", "html": "<h1>第077讲 资金曲线管理：连续回撤时，什么时候该暂停交易？<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。风控指标与阈值需结合资产、流动性和个人承受能力验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>区分按净值控仓与追逐短期表现。<\/li>\n<li>设计回撤降险与恢复规则。<\/li>\n<li>避免策略停在谷底、重启在高点。<\/li>\n<\/ul>\n<h2>为什么要管理资金曲线<\/h2>\n<p>连续回撤可能代表正常随机波动，也可能是信号、成本或市场机制改变。资金曲线规则希望在证据恶化时降低风险，但也可能在最低点退出。<\/p>\n<h2>三层诊断<\/h2>\n<p>先查数据和执行是否异常，再看风险暴露是否超限，最后判断策略统计是否偏离预期。不能把所有亏损都归为模型失效。<\/p>\n<h2>降险规则<\/h2>\n<p>可设置回撤阶梯、滚动波动目标、实盘交易与模型偏差阈值。例如回撤超过预警线降低风险，超过硬线暂停新增头寸。阈值应来自历史分布和压力预算。<\/p>\n<h2>恢复机制<\/h2>\n<p>明确恢复需要的数据、观察期和分级加仓。若暂停后只等净值反弹才恢复，策略无法产生反弹；可使用纸面影子组合持续计算信号。<\/p>\n<h2>风险<\/h2>\n<p>基于资金曲线的规则属于第二个策略，也必须单独回测。过度敏感会低卖高买，参数同样会过拟合。<\/p>\n<h2>风险预案：触发之后具体做什么<\/h2>\n<p>围绕“资金曲线管理：连续回撤时，什么时候该暂停交易？”写一份可执行的风险预案。风险指标只有绑定阈值、权限、动作和恢复条件，才能从报告上的数字变成真正的控制。<\/p>\n<ol>\n<li>定义风险对象、计算窗口、更新频率、阈值和数据依赖。<\/li>\n<li>设置预警、降仓、停止开仓和紧急平仓等分级动作，并明确授权人。<\/li>\n<li>加入相关性上升、流动性消失、价格跳空和模型失效等非历史常态情景。<\/li>\n<li>规定事件记录、复盘、重新启用条件与人工覆盖流程。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>把历史波动率当成全部风险；尾部、流动性和操作风险需要单独处理。<\/li>\n<li>只有止损阈值，没有成交与恢复方案；极端市场里订单可能无法按预期成交。<\/li>\n<li>风险规则频繁临时修改；任何人工覆盖都应授权、留痕并事后复盘。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>指标、阈值、动作和负责人一一对应<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少覆盖一个历史未充分出现的压力情景<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>组合级风险与单资产风险均有限额<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>暂停、恢复和人工覆盖流程可审计<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>回撤时先区分运营故障、风险超限和模型失效。<\/li>\n<li>降险与恢复规则必须成对设计。<\/li>\n<li>资金曲线管理本身也需要回测和监控。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为策略写黄、橙、红三级回撤预案，并定义每级仓位和恢复条件。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第078讲 黑天鹅应对：塔勒布的杠铃策略如何量化实现<\/strong>。<\/p>"}, {"n": 78, "title": "黑天鹅应对：塔勒布的杠铃策略如何量化实现", "html": "<h1>第078讲 黑天鹅应对：塔勒布的杠铃策略如何量化实现<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。风控指标与阈值需结合资产、流动性和个人承受能力验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解杠铃策略的反脆弱直觉。<\/li>\n<li>区分安全端与凸性风险端。<\/li>\n<li>识别成本、误分类和长期拖累。<\/li>\n<\/ul>\n<h2>杠铃的结构<\/h2>\n<p>杠铃策略避免大量资金停留在“中等风险但尾部未知”区域，而把大部分配置在高安全、高流动性资产，小部分配置在损失有限、上行凸性的机会。<\/p>\n<h2>两端各做什么<\/h2>\n<p>安全端负责生存与选择权，风险端争取极端正收益。关键不是固定比例，而是安全端真的安全、风险端最大损失明确。<\/p>\n<h2>可量化实现<\/h2>\n<p>定义安全资产信用与久期边界、风险端预算、再平衡频率和总损失上限。风险端可来自期权等凸性工具，也可来自小额高不确定项目，但不能用高杠杆伪装凸性。<\/p>\n<h2>成本<\/h2>\n<p>凸性通常需要持续支付权利金或机会成本，长时间平静会拖累表现。安全资产也会受通胀、利率和信用影响。<\/p>\n<h2>最大误区<\/h2>\n<p>把 90% 普通债券加 10% 裸卖期权称为杠铃，实际是安全端加尾部负凸性。应检查整个组合在极端下的损失函数。<\/p>\n<h2>风险预案：触发之后具体做什么<\/h2>\n<p>围绕“黑天鹅应对：塔勒布的杠铃策略如何量化实现”写一份可执行的风险预案。风险指标只有绑定阈值、权限、动作和恢复条件，才能从报告上的数字变成真正的控制。<\/p>\n<ol>\n<li>定义风险对象、计算窗口、更新频率、阈值和数据依赖。<\/li>\n<li>设置预警、降仓、停止开仓和紧急平仓等分级动作，并明确授权人。<\/li>\n<li>加入相关性上升、流动性消失、价格跳空和模型失效等非历史常态情景。<\/li>\n<li>规定事件记录、复盘、重新启用条件与人工覆盖流程。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>把历史波动率当成全部风险；尾部、流动性和操作风险需要单独处理。<\/li>\n<li>只有止损阈值，没有成交与恢复方案；极端市场里订单可能无法按预期成交。<\/li>\n<li>风险规则频繁临时修改；任何人工覆盖都应授权、留痕并事后复盘。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>指标、阈值、动作和负责人一一对应<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少覆盖一个历史未充分出现的压力情景<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>组合级风险与单资产风险均有限额<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>暂停、恢复和人工覆盖流程可审计<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>杠铃用安全端保证生存，用小额凸性端保留上行。<\/li>\n<li>真正关键是损失边界，而非表面比例。<\/li>\n<li>凸性有持续成本，安全资产也需重新审视。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>画出一个杠铃组合在正常、通胀、股灾和信用危机四种情景的损益。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第079讲 再平衡魔法：被动地低买高卖，不做预测也能赚钱<\/strong>。<\/p>"}, {"n": 79, "title": "再平衡魔法：被动地低买高卖，不做预测也能赚钱", "html": "<h1>第079讲 再平衡魔法：被动地低买高卖，不做预测也能赚钱<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。风控指标与阈值需结合资产、流动性和个人承受能力验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解再平衡的风险控制与逆向交易机制。<\/li>\n<li>比较日历、容忍带与现金流再平衡。<\/li>\n<li>计入成本、税务和趋势风险。<\/li>\n<\/ul>\n<h2>再平衡为什么像低买高卖<\/h2>\n<p>设定目标权重后，上涨资产权重变高、下跌资产变低。恢复目标会卖出相对上涨者、买入相对下跌者，同时保持风险结构。<\/p>\n<h2>三种方法<\/h2>\n<ul>\n<li><strong>日历再平衡<\/strong>：按月、季或年执行，简单可复现。<\/li>\n<li><strong>容忍带<\/strong>：权重偏离超过阈值才交易，减少无效换手率。<\/li>\n<li><strong>现金流再平衡<\/strong>：优先用新增或支取资金纠偏，降低交易。<\/li>\n<\/ul>\n<h2>再平衡收益不是免费<\/h2>\n<p>它依赖资产波动、相关和均值回复。强单边趋势中频繁再平衡会不断卖出赢家；成本和税务也会降低效果。<\/p>\n<h2>阈值设计<\/h2>\n<p>可使用绝对偏离、相对偏离或风险贡献偏离。高波资产需要更宽带，低流动性资产应减少频率。<\/p>\n<h2>执行顺序<\/h2>\n<p>先检查目标本身是否仍有效，再用现金流、净额交易和分批执行降低成本。再平衡的首要目标是风险治理，其次才可能贡献收益。<\/p>\n<h2>风险预案：触发之后具体做什么<\/h2>\n<p>围绕“再平衡魔法：被动地低买高卖，不做预测也能赚钱”写一份可执行的风险预案。风险指标只有绑定阈值、权限、动作和恢复条件，才能从报告上的数字变成真正的控制。<\/p>\n<ol>\n<li>定义风险对象、计算窗口、更新频率、阈值和数据依赖。<\/li>\n<li>设置预警、降仓、停止开仓和紧急平仓等分级动作，并明确授权人。<\/li>\n<li>加入相关性上升、流动性消失、价格跳空和模型失效等非历史常态情景。<\/li>\n<li>规定事件记录、复盘、重新启用条件与人工覆盖流程。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>把历史波动率当成全部风险；尾部、流动性和操作风险需要单独处理。<\/li>\n<li>只有止损阈值，没有成交与恢复方案；极端市场里订单可能无法按预期成交。<\/li>\n<li>风险规则频繁临时修改；任何人工覆盖都应授权、留痕并事后复盘。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>指标、阈值、动作和负责人一一对应<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少覆盖一个历史未充分出现的压力情景<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>组合级风险与单资产风险均有限额<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>暂停
