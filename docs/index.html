/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>网格用库存承担方向风险换取震荡收益。<\/li>\n<li>已实现格子利润不能掩盖未实现亏损。<\/li>\n<li>边界、库存上限和退出机制比格距优化更重要。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>设计 10 档网格，手算连续下跌穿过全部买入档后的持仓均价、剩余现金和总亏损。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第043讲 动态网格与不对称格子：给网格装上大脑<\/strong>。<\/p>"}, {"n": 43, "title": "动态网格与不对称格子：给网格装上大脑", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解动态中心、波动格距与不对称仓位。<\/li>\n<li>区分适应性与追逐价格。<\/li>\n<li>控制参数增加带来的过拟合。<\/li>\n<\/ul>\n<h2>为什么给网格“装大脑”<\/h2>\n<p>固定网格假设中心和波动稳定。动态网格尝试根据移动均值、估值中枢或波动率调整中心与格距，并在上下方向使用不同仓位。<\/p>\n<h2>三种改造<\/h2>\n<ul>\n<li><strong>动态中心<\/strong>：用慢速均线或模型价值更新参考价。<\/li>\n<li><strong>波动格距<\/strong>：用 ATR 或波动率扩大、缩小格距。<\/li>\n<li><strong>不对称网格<\/strong>：根据长期趋势或库存，在一侧使用更小仓位。<\/li>\n<\/ul>\n<h2>最大陷阱：追涨杀跌式重置<\/h2>\n<p>价格突破后立即把中心追到新价格，可能在高位重新铺设买单；下跌时不断下移中心，则会掩盖失败仓位。重置必须有频率、幅度和风险条件。<\/p>\n<h2>参数自由度<\/h2>\n<p>动态规则增加了窗口、阈值和更新速度。应先与固定网格比较，逐项验证增量，并用多种价格路径压力测试。<\/p>\n<h2>评价方式<\/h2>\n<p>看总权益、最大库存、资金占用、尾部亏损和趋势期表现，而非完成格数。动态不等于更安全，只是把风险从固定参数转移到调整规则。<\/p>\n<h2>动态中心到底在追踪什么<\/h2>\n<p>若中心来自慢速均线，它追踪近期价格；若来自估值模型，它试图估计经济中枢。两者含义不同：前者会随趋势移动，后者依赖基本面假设。系统必须说明中心为何应当回归，以及更新速度与交易频率如何匹配。<\/p>\n<p>中心变化本身也会产生交易。若每次重置都撤单、重铺和调整库存，所谓适应性可能带来额外换手与成本。<\/p>\n<h2>波动格距的两面<\/h2>\n<p>波动上升时扩大格距，可以减少过密交易；但库存往往已经在波动爆发前累积。波动下降时缩小格距又可能在安静期制造大量微利交易，使成本占比上升。ATR 或波动估计还会滞后，不能当作即时保护。<\/p>\n<p>应检查调整前后的总权益、最大库存和成本，而不是只看完成格数是否增加。<\/p>\n<h2>不对称网格是一种方向观点<\/h2>\n<p>上方与下方使用不同格距或仓位，等于对上涨和下跌赋予不同概率或风险预算。它不再是纯粹“中性震荡策略”。如果长期趋势判断错误，不对称设计会放大单边库存。<\/p>\n<p>因此需要单独报告净方向暴露，并与一个更简单的趋势仓位比较，确认复杂网格是否真的提供增量。<\/p>\n<h2>重置规则必须有记忆<\/h2>\n<p>为避免追逐价格，可以限制中心调整频率、单次幅度和累计偏移，并规定带亏库存是否允许随中心一起“重命名”。旧库存不能因为中心移动就被视为新策略的正常仓位。账本应保留每批库存的来源、成本和退出规则。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“动态网格与不对称格子：给网格装上大脑”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nber.org/papers/w25551.pdf\">Moskowitz、Ooi 与 Pedersen：Time Series Momentum<\/a>：跨资产时间序列动量的研究入口。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nber.org/papers/w7032\">Gatev、Goetzmann 与 Rouwenhorst：Pairs Trading<\/a>：配对交易规则、历史样本与微观结构解释。<\/li>\n<li><strong>适用条件与边界<\/strong>：技术指标是价格变换而非独立信息；结论受品种、频率、交易制度、做空约束与成本影响。<\/li>\n<li><strong>主要失败模式<\/strong>：先看结果再挑参数、忽略冲击成本，或把一种市场状态下的规律外推到所有时期。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>动态网格调整中心、格距或两侧仓位。<\/li>\n<li>无约束重置会把追逐价格伪装成适应性。<\/li>\n<li>必须用总权益和库存风险评价。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为动态中心设置最大月度移动幅度，并比较有无该限制时在单边行情中的库存。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第044讲 事件驱动策略：财报惊喜、分红日历与季节性规律<\/strong>。<\/p>"}, {"n": 44, "title": "事件驱动策略：财报惊喜、分红日历与季节性规律", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解事件时间和公告时间的区别。<\/li>\n<li>建立事件研究与可交易策略流程。<\/li>\n<li>识别泄漏、预期与拥挤风险。<\/li>\n<\/ul>\n<h2>事件不是看到新闻才算开始<\/h2>\n<p>财报、分红、指数调整、并购和政策公告都可能驱动价格。事件策略的难点是确定市场何时首次获得信息，而不是文件所属日期。<\/p>\n<h2>事件研究<\/h2>\n<p>先估计正常收益，再计算事件窗口异常收益与累计异常收益。窗口过长会混入其他信息，过短可能错过延迟反应。<\/p>\n<h2>财报惊喜<\/h2>\n<p>不能只看利润增长，还要比较市场预期。结果很好但低于预期，价格仍可能下跌。若没有可靠预期数据，可使用历史趋势代理，但解释要谨慎。<\/p>\n<h2>从研究到交易<\/h2>\n<p>定义公告可用时间、过滤流动性、下一可交易价格、持有期和风险对冲。盘后公告通常不能假设以当日收盘价成交。<\/p>\n<h2>季节性<\/h2>\n<p>月度或节假日规律可能来自资金流、税务和制度，但也容易因多重检验产生。需要跨市场、跨时期和样本外验证。<\/p>\n<p>事件策略的优势往往衰减快，执行时间与拥挤程度和信号本身同样重要。<\/p>\n<h2>一条事件记录需要四个时点<\/h2>\n<p>以财报为例，应区分报告所属期、首次公开时间、供应商采集时间和策略可用时间。盘后公告虽然日期属于当天，市场真正能够交易通常已是下一交易时段。若把公告日收盘价当作成交价，就把信息发布时间放到了成交之后。<\/p>\n<p>事件数据库还要保留更正与版本。今天看到的最终财报值，不一定是市场最初反应时看到的数字。<\/p>\n<h2>异常收益来自“相对预期”<\/h2>\n<p>事件日上涨不等于事件产生 Alpha，因为市场本身、行业或风险因子可能同时上涨。事件研究需要先定义正常收益基准，再计算异常收益。基准选择、估计窗口和事件窗口都会改变结论。<\/p>\n<p>同样，利润增长不等于正面惊喜。价格反应的是结果与已有预期的差异，而不是绝对好坏。<\/p>\n<h2>从平均事件效应到可交易策略<\/h2>\n<p>平均异常收益可能由少数大事件贡献，也可能集中在无法成交的小市值资产。转成策略前要检查横截面分布、开盘跳空、成交额、持有期、成本和容量。事件发布后的第一笔可成交价格往往已经反映部分信息。<\/p>\n<h2>季节性最容易被日历挖掘<\/h2>\n<p>月份、星期、节假日前后、月末月初都可以组合出大量规则。测试越多，偶然显著越常见。应在研究前限定假设，保留未参与选择的年份或市场，并检验制度变化后规律是否仍存在。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“事件驱动策略：财报惊喜、分红日历与季节性规律”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nber.org/papers/w25551.pdf\">Moskowitz、Ooi 与 Pedersen：Time Series Momentum<\/a>：跨资产时间序列动量的研究入口。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nber.org/papers/w7032\">Gatev、Goetzmann 与 Rouwenhorst：Pairs Trading<\/a>：配对交易规则、历史样本与微观结构解释。<\/li>\n<li><strong>适用条件与边界<\/strong>：技术指标是价格变换而非独立信息；结论受品种、频率、交易制度、做空约束与成本影响。<\/li>\n<li><strong>主要失败模式<\/strong>：先看结果再挑参数、忽略冲击成本，或把一种市场状态下的规律外推到所有时期。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>事件策略必须使用首次公开可得时间。<\/li>\n<li>异常收益应相对正常基准计算。<\/li>\n<li>预期差、执行时点和拥挤决定可交易性。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为一次盘后财报设计事件窗口、基准模型、最早下单时间和退出规则。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第045讲 期货CTA策略：捕捉商品趋势的圣杯在哪里？<\/strong>。<\/p>"}, {"n": 45, "title": "期货CTA策略：捕捉商品趋势的圣杯在哪里？", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解 CTA 趋势策略的组合结构。<\/li>\n<li>掌握合约连续化、波动定仓和移仓。<\/li>\n<li>认识趋势策略的危机与震荡表现。<\/li>\n<\/ul>\n<h2>CTA 不只是商品<\/h2>\n<p>期货 CTA 常跨商品、股指、利率和外汇期货，用趋势或相对价值规则管理组合。核心是利用期货的标准化和资本效率，但杠杆同时放大风险。<\/p>\n<h2>趋势信号<\/h2>\n<p>可使用通道突破、均线或多周期收益。多周期组合减少对单一窗口依赖。信号通常先标准化，再按品种波动分配风险。<\/p>\n<h2>连续合约陷阱<\/h2>\n<p>主力切换和期限结构会造成价格跳跃。研究需区分用于计算收益的连续序列与真实可交易合约，并显式计入移仓价差和手续费。<\/p>\n<h2>组合风险<\/h2>\n<p>单品种风险目标并不够；能源、金属或股指在危机中可能高度相关。应限制板块和总组合风险，并处理保证金上调。<\/p>\n<h2>收益形态<\/h2>\n<p>趋势策略可能在持续危机或宏观大趋势中表现突出，在快速反转与长期震荡中反复止损。它不是圣杯，而是一种凸性倾向的风险配置。<\/p>\n<h2>连续价格只是研究工具<\/h2>\n<p>期货合约会到期，连续序列需要按规则拼接不同月份。简单连接会在换月处产生跳跃，回溯调整又可能得到市场上从未交易过的历史价格。研究应明确连续化方法，并将信号序列与真实持仓合约分开。<\/p>\n<p>真正盈亏来自每个可交易合约及移仓过程。若连续曲线很平滑，却没有扣除移仓价差、手续费和冲击，回测并未重建账户。<\/p>\n<h2>期限结构会进入收益<\/h2>\n<p>即使现货方向不变，持有期货并不断移仓也可能因近远月价格关系产生收益或成本。趋势信号与期限结构暴露可能共同作用，归因时应分开价格趋势、移仓和现金收益。<\/p>\n<p>把全部收益都解释为“抓住趋势”，会掩盖策略对特定期限结构的依赖。<\/p>\n<h2>风险平价不等于名义金额相等<\/h2>\n<p>不同合约乘数和波动相差很大。按名义金额平均分配，可能让高波品种主导组合。CTA 常先把信号转成方向与强度，再按波动估计分配风险，并设置板块和总杠杆上限。<\/p>\n<p>波动估计滞后、相关性上升和保证金调整仍会让实际风险偏离目标，所以目标权重与实际风险必须持续监控。<\/p>\n<h2>快速反转是趋势策略的软肋<\/h2>\n<p>持续趋势给模型时间逐步建立和退出仓位；突然反转会在信号翻转前产生回吐。多周期组合可减少单一窗口依赖，却不能消除共同反转。压力测试应包含跳空、涨跌停、流动性下降和保证金上调。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“期货CTA策略：捕捉商品趋势的圣杯在哪里？”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nber.org/papers/w25551.pdf\">Moskowitz、Ooi 与 Pedersen：Time Series Momentum<\/a>：跨资产时间序列动量的研究入口。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.aqr.com/Insights/Datasets/An-Academic-Quality-Data-Library-for-Practitioners\">AQR Academic Data Library<\/a>：价值、动量、低 Beta 与趋势等论文配套数据。<\/li>\n<li><strong>适用条件与边界<\/strong>：技术指标是价格变换而非独立信息；结论受品种、频率、交易制度、做空约束与成本影响。<\/li>\n<li><strong>主要失败模式<\/strong>：先看结果再挑参数、忽略冲击成本，或把一种市场状态下的规律外推到所有时期。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>CTA 常以多市场趋势和风险预算构建组合。<\/li>\n<li>连续价格不等于可交易合约，移仓必须显式处理。<\/li>\n<li>板块相关和保证金风险会放大组合损失。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为三个期货品种按目标波动分配仓位，并加入板块风险上限。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第046讲 套利策略入门：期现套利、跨期套利怎么玩<\/strong>。<\/p>"}, {"n": 46, "title": "套利策略入门：期现套利、跨期套利怎么玩", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>区分无风险套利与风险套利。<\/li>\n<li>理解价差、资金占用和执行同步。<\/li>\n<li>识别套利中的尾部与制度风险。<\/li>\n<\/ul>\n<h2>套利不是免费午餐<\/h2>\n<p>教科书套利指同一现金流出现不一致价格，可构造零净投资和确定收益。现实交易中，大多数“套利”包含基差、融资、执行和模型风险，更准确地说是相对价值交易。<\/p>\n<h2>期现套利<\/h2>\n<p>当期货相对现货偏离持有成本关系，可买低卖高并持有到收敛。但要计入融资、分红、仓储、保证金和交割限制。<\/p>\n<h2>跨期套利<\/h2>\n<p>交易同一品种不同到期合约的价差，收益受库存、季节、便利收益和资金条件影响。价差可能长期偏离，不能只依据历史均值。<\/p>\n<h2>执行风险<\/h2>\n<p>两腿不能同步成交会留下裸露方向；借券可能被召回；保证金变化可能迫使提前平仓。看似很小的价差，在高杠杆下也会造成大损失。<\/p>\n<h2>判断清单<\/h2>\n<p>确认现金流是否真正等价、收敛机制和期限、全部交易成本、最坏资金占用、退出路径与法律交割条件。套利的核心不是价差存在，而是价差能被你安全地锁定。<\/p>\n<h2>价差必须覆盖全部持有成本<\/h2>\n<p>期现价差看起来为正，不代表有净利润。需要扣除融资、交易费用、税费、借券或仓储、保险、交割与资金占用，并考虑分红或便利收益。遗漏一项，小价差就可能从利润变成亏损。<\/p>\n<p>理论关系给出的是一组条件下的无套利边界，现实可交易区间通常比一条线更宽。<\/p>\n<h2>两腿交易的顺序风险<\/h2>\n<p>假设先成交现货，期货腿却因行情跳动未成交，组合就暴露于市场方向。反过来先成交期货，也会留下另一种裸露风险。系统需要规定下单顺序、最大等待时间、价格偏离上限和单腿失败后的撤退动作。<\/p>\n<p>回测若默认两腿同时按中间价成交，会把最关键的执行风险删除。<\/p>\n<h2>收敛机制决定等待期限<\/h2>\n<p>到期交割可能提供较明确的收敛锚，但仍受交割规则和可交割品影响；跨期价差则可能随库存、季节和供需长期变化。历史均值不是法律约束，价差扩大也不保证回归。<\/p>\n<p>研究要写清谁在何时迫使价格关系收敛，以及策略是否有足够资金等到那一刻。<\/p>\n<h2>小收益为何伴随大尾部<\/h2>\n<p>套利常使用杠杆放大小价差，平时波动看似很低。融资中断、保证金上调、借券召回或制度变化会迫使提前退出，使原本“到期会收敛”的逻辑无法兑现。压力测试应关注最大资金占用和被迫平仓，而不只是价差历史波动。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“套利策略入门：期现套利、跨期套利怎么玩”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nber.org/papers/w25551.pdf\">Moskowitz、Ooi 与 Pedersen：Time Series Momentum<\/a>：跨资产时间序列动量的研究入口。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nber.org/papers/w7032\">Gatev、Goetzmann 与 Rouwenhorst：Pairs Trading<\/a>：配对交易规则、历史样本与微观结构解释。<\/li>\n<li><strong>适用条件与边界<\/strong>：技术指标是价格变换而非独立信息；结论受品种、频率、交易制度、做空约束与成本影响。<\/li>\n<li><strong>主要失败模式<\/strong>：先看结果再挑参数、忽略冲击成本，或把一种市场状态下的规律外推到所有时期。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>现实套利通常含融资、基差与执行风险。<\/li>\n<li>收敛机制和现金流等价性比历史相关更重要。<\/li>\n<li>两腿同步、保证金与极端资金占用必须压力测试。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>写出股指期货理论价格的持有成本组成，并列出偏离出现后仍无法套利的原因。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第047讲 期权量化基础：希腊字母如何指引交易<\/strong>。<\/p>"}, {"n": 47, "title": "期权量化基础：希腊字母如何指引交易", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解期权收益与主要希腊字母。<\/li>\n<li>区分方向、波动和时间暴露。<\/li>\n<li>避免只看到期收益图。<\/li>\n<\/ul>\n<h2>期权是一组动态风险<\/h2>\n<p>看涨期权给买方在到期前按执行价买入标的的权利，看跌期权给予卖出权利。期权费是权利成本，卖方承担相应义务。<\/p>\n<h2>五个常用希腊字母<\/h2>\n<ul>\n<li><strong>Delta<\/strong>：标的价格变化对期权价格的一阶影响。<\/li>\n<li><strong>Gamma<\/strong>：Delta 随标的变化的速度，体现曲率。<\/li>\n<li><strong>Vega<\/strong>：隐含波动率变化的敏感度。<\/li>\n<li><strong>Theta<\/strong>：时间流逝带来的价值变化。<\/li>\n<li><strong>Rho<\/strong>：利率变化敏感度。<\/li>\n<\/ul>\n<p>希腊字母会随价格、时间和波动变化，不是固定常数。<\/p>\n<h2>Delta 对冲<\/h2>\n<p>通过持有相反标的头寸降低小幅方向风险，但价格移动后需再平衡。高 Gamma 头寸对冲更频繁，交易成本更高。<\/p>\n<h2>买卖双方的结构<\/h2>\n<p>买方损失通常限于权利金，却可能持续承受 Theta；卖方收取权利金，却可能承担巨大尾部损失和保证金压力。<\/p>\n<h2>风险检查<\/h2>\n<p>除到期损益外，要观察路径、隐含波动变化、跳空、流动性和保证金。期权策略不是“猜涨跌”的复杂版本，而是管理多维风险。<\/p>\n<h2>希腊字母是一张局部地图<\/h2>\n<p>Delta、Gamma、Vega 等描述其他条件近似不变时的小幅敏感度。标的价格大幅跳跃、隐含波动同时变化或临近到期时，线性近似会迅速失真。因此希腊字母适合监控当前风险方向，不能替代完整情景重估。<\/p>\n<p>风险报告应同时给出小幅敏感度和若干大幅价格、波动、时间组合情景。<\/p>\n<h2>Delta 中性仍然会亏损<\/h2>\n<p>建立 Delta 对冲后，小幅方向暴露接近零，但 Gamma 会让 Delta 随价格变化，Vega 会让波动率变化影响期权价值，Theta 还会随时间侵蚀价值。对冲需要再平衡，成本和跳空都会造成偏差。<\/p>\n<p>“中性”只针对某个时点的一阶方向风险，不等于没有风险。<\/p>\n<h2>买方与卖方交换了什么<\/h2>\n<p>期权买方支付权利金，获得非线性上行或保护，常承受时间价值损耗；卖方收取权利金，承担尾部和保证金风险。高胜率卖方策略可能只是持续收取小额收益、偶尔支付巨大损失。<\/p>\n<p>评价时应查看完整收益分布、最坏情景、保证金和流动性，而不是只比较胜率。<\/p>\n<h2>回测期权必须重建当时可交易合约<\/h2>\n<p>需要使用当时存在的到期日、执行价、报价、成交量与合约状态，处理行权、到期和公司行动。用今天的合约筛选规则回看历史，或用收盘理论价假设大额成交，都会美化结果。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“期权量化基础：希腊字母如何指引交易”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nber.org/papers/w25551.pdf\">Moskowitz、Ooi 与 Pedersen：Time Series Momentum<\/a>：跨资产时间序列动量的研究入口。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nber.org/papers/w7032\">Gatev、Goetzmann 与 Rouwenhorst：Pairs Trading<\/a>：配对交易规则、历史样本与微观结构解释。<\/li>\n<li><strong>适用条件与边界<\/strong>：技术指标是价格变换而非独立信息；结论受品种、频率、交易制度、做空约束与成本影响。<\/li>\n<li><strong>主要失败模式<\/strong>：先看结果再挑参数、忽略冲击成本，或把一种市场状态下的规律外推到所有时期。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>期权价格同时受方向、曲率、波动、时间和利率影响。<\/li>\n<li>Delta 对冲只在局部有效，需要动态调整。<\/li>\n<li>有限盈利与尾部损失结构不能被高胜率掩盖。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>画出买入看涨与卖出看跌的到期损益，并说明到期前 Vega 和 Theta 如何改变结果。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第048讲 波动率交易：做多或做空恐慌情绪<\/strong>。<\/p>"}, {"n": 48, "title": "波动率交易：做多或做空恐慌情绪", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>区分实现波动与隐含波动。<\/li>\n<li>理解波动风险溢价和凸性。<\/li>\n<li>认识做空波动的尾部风险。<\/li>\n<\/ul>\n<h2>波动也有价格<\/h2>\n<p>实现波动来自未来实际价格路径，隐含波动从期权价格反推。波动交易关注二者及期限、偏斜之间的差异，而不只是预测方向。<\/p>\n<h2>做多波动<\/h2>\n<p>买入跨式等结构可受益于大幅移动和隐含波动上升，但需要价格变化足以覆盖权利金与时间损耗。长期“方向看对但幅度不够”仍可能亏损。<\/p>\n<h2>做空波动<\/h2>\n<p>卖出期权可能收取波动风险溢价，表现为多数时间小赚、极端时巨亏。高胜率并不代表低风险，杠杆和保证金会放大尾部。<\/p>\n<h2>波动曲面<\/h2>\n<p>不同执行价和期限具有不同隐含波动，形成偏斜与期限结构。交易应说明暴露在哪个点，并做 Delta、Gamma 和 Vega 分解。<\/p>\n<h2>风控<\/h2>\n<p>使用情景矩阵模拟标的跳跃、隐波上升、时间流逝和流动性恶化。限制裸卖、总 Gamma/Vega 和压力损失。波动交易本质是交易分布，而非一个标准差数字。<\/p>\n<h2>方向看对，波动交易仍可能亏<\/h2>\n<p>买入跨式后，标的大幅移动通常有利，但最终盈亏还取决于买入时支付的隐含波动、移动发生的时间和对冲成本。若市场已经为大行情收取很高权利金，即使方向变化明显，幅度仍可能不足以覆盖价格。<\/p>\n<p>所以波动交易比较的是“市场预先定价的分布”与“随后实现的路径”，不是简单判断涨跌。<\/p>\n<h2>做空波动在收什么钱<\/h2>\n<p>卖方收取权利金，承担价格跳跃、波动率上升和流动性恶化时的损失。平静期里 Theta 收益持续可见，尾部风险却可能多年不出现，形成高胜率、低波动的假象。<\/p>\n<p>评价应把最差情景、保证金追加和被迫平仓纳入，而不是把尚未发生的尾部视为不存在。<\/p>\n<h2>曲面决定你交易的是哪一种波动<\/h2>\n<p>不同到期和执行价的隐含波动不同。买入近月平值、卖出远月虚值，即使名义 Vega 接近，也可能暴露于期限结构和偏斜变化。风险报告需要按期限与执行价分桶，而不是只给一个总 Vega。<\/p>\n<h2>一张情景矩阵比单点希腊字母更重要<\/h2>\n<p>将标的价格上/下移动、隐含波动上/下变化和时间流逝组合成情景，重新估值整个头寸；再加入价差扩大和对冲无法及时完成。这样可以看见方向、波动和时间同时变化时的非线性损益。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“波动率交易：做多或做空恐慌情绪”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nber.org/papers/w25551.pdf\">Moskowitz、Ooi 与 Pedersen：Time Series Momentum<\/a>：跨资产时间序列动量的研究入口。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nber.org/papers/w7032\">Gatev、Goetzmann 与 Rouwenhorst：Pairs Trading<\/a>：配对交易规则、历史样本与微观结构解释。<\/li>\n<li><strong>适用条件与边界<\/strong>：技术指标是价格变换而非独立信息；结论受品种、频率、交易制度、做空约束与成本影响。<\/li>\n<li><strong>主要失败模式<\/strong>：先看结果再挑参数、忽略冲击成本，或把一种市场状态下的规律外推到所有时期。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>波动交易比较市场定价与未来实现路径。<\/li>\n<li>做多波动受时间损耗，做空波动承担尾部。<\/li>\n<li>曲面、路径和希腊字母必须联合管理。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为一个跨式头寸制作价格变动×隐波变动的二维盈亏情景表。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第049讲 高频交易掠影：做市与延迟套利在争什么？<\/strong>。<\/p>"}, {"n": 49, "title": "高频交易掠影：做市与延迟套利在争什么？", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解做市与延迟套利的基本机制。<\/li>\n<li>认识订单簿、库存和排队风险。<\/li>\n<li>明白高频优势为何难以复制。<\/li>\n<\/ul>\n<h2>做市赚什么<\/h2>\n<p>做市商同时提供买卖报价，目标是赚取价差并管理库存。成交并非免费收益：当更快的信息交易者只在对做市商不利时成交，就产生逆向选择。<\/p>\n<h2>库存控制<\/h2>\n<p>持仓偏多时可降低报价以鼓励卖出，偏空时反向调整。库存、波动和订单流共同决定报价宽度。极端行情中，流动性需求和库存风险会同时上升。<\/p>\n<h2>延迟竞争<\/h2>\n<p>跨市场价格更新不同步时，速度快者可能先交易旧报价。但这类优势依赖专线、共址、硬件、撮合规则和精细监控，竞争会迅速压缩利润。<\/p>\n<h2>回测难点<\/h2>\n<p>只有成交数据无法知道排队位置；看到盘口数量也不代表都能在你之前或之后成交。延迟、撤单和部分成交必须进入事件驱动模拟。<\/p>\n<h2>普通研究者应学什么<\/h2>\n<p>不是模仿毫秒竞争，而是理解点差、深度、冲击与订单类型如何影响所有策略。执行质量是净收益的重要来源。<\/p>\n<h2>点差不是免费利润<\/h2>\n<p>做市商挂出买卖报价，只有订单真的成交并能在另一侧退出，点差才可能转化为收益。更有信息的交易者往往在价格即将变化时主动成交，使做市商买到还会继续跌的资产、卖出还会继续涨的资产，这就是逆向选择。<\/p>\n<p>因此报价宽度需要补偿库存、波动、成交概率和信息风险，而不只是覆盖手续费。<\/p>\n<h2>排队位置决定限价单价值<\/h2>\n<p>看到最优价有大量挂单，不代表新订单能立即成交。订单可能排在队尾，前方数量还会撤销或新增。只用盘口快照回测，无法准确知道自己的排队位置和成交顺序。<\/p>\n<p>事件驱动模拟至少要处理报单、撤单、部分成交、延迟和撮合优先级；否则“被动成交”会被系统性高估。<\/p>\n<h2>库存风险如何反过来改变报价<\/h2>\n<p>库存偏多时，做市商可能降低买价或更积极卖出，牺牲部分点差换取风险下降。若市场单边移动，继续机械双边报价会不断累积不利库存。库存上限、报价撤回和异常停机是策略核心，而不是附属风控。<\/p>\n<h2>高频经验对低频策略同样有用<\/h2>\n<p>所有策略都要选择市价单还是限价单、承担价差还是承担未成交风险。理解订单簿能帮助日频策略更现实地估计成交和容量，而不是鼓励普通研究者复制微秒竞争。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“高频交易掠影：做市与延迟套利在争什么？”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.sec.gov/about/reports-publications/special-studies/algo_trading_report_2020.pdf\">SEC：Algorithmic Trading in U.S. Capital Markets<\/a>：算法交易的市场结构、收益与风险。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://papers.ssrn.com/sol3/papers.cfm?abstract_id=2326253\">Bailey 等：The Probability of Backtest Overfitting<\/a>：多重试验与回测过拟合的量化框架。<\/li>\n<li><strong>适用条件与边界<\/strong>：技术指标是价格变换而非独立信息；结论受品种、频率、交易制度、做空约束与成本影响。<\/li>\n<li><strong>主要失败模式<\/strong>：先看结果再挑参数、忽略冲击成本，或把一种市场状态下的规律外推到所有时期。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>做市以价差补偿库存和逆向选择风险。<\/li>\n<li>延迟套利依赖昂贵且专业的基础设施。<\/li>\n<li>高频回测必须模拟订单簿、排队和延迟。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>比较市价单和限价单在成交确定性、价格和逆向选择上的取舍。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第050讲 加密货币量化：7×24小时的新战场的特殊法则<\/strong>。<\/p>"}, {"n": 50, "title": "加密货币量化：7×24小时的新战场的特殊法则", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解加密市场的连续交易和分散结构。<\/li>\n<li>识别平台、托管与链上特有风险。<\/li>\n<li>建立不依赖单一交易所的研究口径。<\/li>\n<\/ul>\n<h2>7×24 小时改变了什么<\/h2>\n<p>加密资产没有统一收盘，日线边界取决于时区。资金费率、永续合约、跨平台价差和周末流动性使其与传统市场不同。研究必须固定 UTC 等时间标准。<\/p>\n<h2>数据结构<\/h2>\n<p>除成交和盘口外，还有链上转账、地址活动和协议状态。但地址不等于用户，链上行为也可能是内部整理，解释需要谨慎。<\/p>\n<h2>永续合约<\/h2>\n<p>永续通过资金费率锚定现货。策略收益应同时计入价格、资金费、手续费和保证金；高杠杆下，小波动也可能触发强平。<\/p>\n<h2>特有风险<\/h2>\n<p>交易平台故障、资产托管、智能合约漏洞、稳定币脱锚和市场操纵都可能让历史相关失效。跨平台套利还面临转账延迟与提现限制。<\/p>\n<h2>研究原则<\/h2>\n<p>使用多源价格、保存交易所标识、分离现货与衍生品、模拟连续保证金，并为平台不可用设置仓位与退出预案。策略优势不能只依赖“波动大”。<\/p>\n<h2>没有收盘，也要人为定义一天<\/h2>\n<p>连续交易市场仍需把收益、风控和报表划分成时间段。不同交易所、供应商或研究者选择的日线边界不同，同一策略的开高低收和波动率就可能不同。系统应统一 UTC 等明确标准，并保存原始时间戳与交易所标识。<\/p>\n<p>周末和夜间流动性也可能与工作日不同，不能把 7×24 小时理解为 7×24 小时同等可交易。<\/p>\n<h2>永续合约收益不只来自价格<\/h2>\n<p>账户权益变化至少包括标记价格盈亏、资金费、交易费用和滑点。高杠杆下还要持续模拟保证金、维持保证金和强平规则。若回测只计算收盘到收盘收益，就遗漏了决定能否存活的现金流。<\/p>\n<p>资金费本身会变化，正负方向也可能反转，不能把历史平均费率永久外推。<\/p>\n<h2>跨平台价差不是无摩擦套利<\/h2>\n<p>两家平台价格不同，资金却未必能即时跨平台移动。充值确认、提现暂停、资产限额、账户冻结和链上拥堵都会阻止收敛交易。若预先在两边放置资金，又承担平台、托管和稳定币风险。<\/p>\n<p>价差回测必须说明资金在哪里、多久能转移、单个平台失效时如何退出。<\/p>\n<h2>链上数据需要实体解释<\/h2>\n<p>地址数量、转账和交易所流入可能由内部整理、批量归集或协议机制产生。地址不等于独立用户，链上可见也不等于经济含义明确。特征应记录标签来源、实体映射置信度和规则变化，并与价格之外的解释相互验证。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“加密货币量化：7×24小时的新战场的特殊法则”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nber.org/papers/w25551.pdf\">Moskowitz、Ooi 与 Pedersen：Time Series Momentum<\/a>：跨资产时间序列动量的研究入口。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nber.org/papers/w7032\">Gatev、Goetzmann 与 Rouwenhorst：Pairs Trading<\/a>：配对交易规则、历史样本与微观结构解释。<\/li>\n<li><strong>适用条件与边界<\/strong>：技术指标是价格变换而非独立信息；结论受品种、频率、交易制度、做空约束与成本影响。<\/li>\n<li><strong>主要失败模式<\/strong>：先看结果再挑参数、忽略冲击成本，或把一种市场状态下的规律外推到所有时期。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>连续交易要求统一时区和全天候风险监控。<\/li>\n<li>资金费、强平、平台和托管风险必须进入收益模型。<\/li>\n<li>链上数据有增量，也有实体解释困难。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为一个永续趋势策略列出价格收益、资金费、手续费、滑点和强平五类现金流。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第051讲 可转债量化：下有保底上不封顶的数学分析<\/strong>。<\/p>"}, {"n": 51, "title": "可转债量化：下有保底上不封顶的数学分析", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解可转债的债性、股性与转股权。<\/li>\n<li>掌握转股价值和溢价率的直觉。<\/li>\n<li>识别条款、信用和流动性风险。<\/li>\n<\/ul>\n<h2>可转债的混合结构<\/h2>\n<p>可转债是含转股选择权的债券。下跌时债券价值可能提供一定缓冲，上涨时转股权带来权益弹性，但“下有保底”不是绝对保证，信用违约与流动性会破坏底部。<\/p>\n<h2>两个基础量<\/h2>\n<p>转股价值近似为正股价格乘转股比例；转股溢价率衡量转债价格相对转股价值的溢价。低价、低溢价、高信用质量常被用作筛选维度，但三者存在取舍。<\/p>\n<h2>条款影响<\/h2>\n<p>强赎、回售、下修和到期赎回会改变现金流。量化回测必须按公告时间与生效规则处理，不能把条款视为静态字段。<\/p>\n<h2>常见策略<\/h2>\n<p>双低排序、动量轮动、信用与估值组合、转股套利等。策略还需处理最小交易单位、停牌、赎回倒计时和容量。<\/p>\n<h2>风险<\/h2>\n<p>高溢价可能在情绪退潮时压缩，正股下跌会削弱股性，信用事件会同时打击债底。组合应限制单券、行业和发行人集中。<\/p>\n<h2>“债底”为什么不是保证<\/h2>\n<p>债券价值依赖发行人能够履约、市场愿意提供流动性以及条款能够执行。信用恶化时，债底会下降；极端行情里即使理论价值存在，也可能无法按该价格卖出。因此“下有保底”只是一种结构直觉，不是保本承诺。<\/p>\n<h2>转股价值与溢价率如何联动<\/h2>\n<p>正股上涨会提高转股价值，转债通常更偏股性；正股下跌后，债性可能更重要。溢价率既受转债价格也受正股和转股价影响，单独比较低溢价并不能说明便宜，还要看信用、期限和条款状态。<\/p>\n<h2>条款是会改变路径的事件<\/h2>\n<p>强赎、下修和回售不仅改变终点现金流，还会改变投资者何时必须行动。量化数据库需要保存公告时间、生效条件、倒计时和状态变化；使用今天的最终条款回填历史，会产生前视偏差。<\/p>\n<h2>双低策略隐藏了哪些暴露<\/h2>\n<p>低价格可能对应较弱信用，低溢价可能对应更高股性，两者合成后仍可能集中于小规模、低流动性或特定行业。组合应限制发行人和行业，检查成交额、强赎风险与容量，并把无法成交和赎回处理纳入回测。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“可转债量化：下有保底上不封顶的数学分析”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nber.org/papers/w25551.pdf\">Moskowitz、Ooi 与 Pedersen：Time Series Momentum<\/a>：跨资产时间序列动量的研究入口。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nber.org/papers/w7032\">Gatev、Goetzmann 与 Rouwenhorst：Pairs Trading<\/a>：配对交易规则、历史样本与微观结构解释。<\/li>\n<li><strong>适用条件与边界<\/strong>：技术指标是价格变换而非独立信息；结论受品种、频率、交易制度、做空约束与成本影响。<\/li>\n<li><strong>主要失败模式<\/strong>：先看结果再挑参数、忽略冲击成本，或把一种市场状态下的规律外推到所有时期。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>可转债是债券现金流与股票期权的组合。<\/li>\n<li>价格、转股溢价、信用和条款共同决定风险。<\/li>\n<li>所谓保底依赖发行人信用和市场流动性。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>选一只转债，计算转股价值与溢价率，并列出强赎、回售和下修状态。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第052讲 基本面量化：乔尔·格林布拉特的神奇公式拆解<\/strong>。<\/p>"}, {"n": 52, "title": "基本面量化：乔尔·格林布拉特的神奇公式拆解", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解神奇公式的价值与质量组合逻辑。<\/li>\n<li>建立可复现的排序股票池。<\/li>\n<li>识别会计口径和容量问题。<\/li>\n<\/ul>\n<h2>核心思想<\/h2>\n<p>格林布拉特的神奇公式试图同时寻找“好公司”和“便宜价格”。教学版本常用资本回报率衡量经营质量，用息税前利润相对企业价值的收益率衡量便宜程度，再分别排序合成。<\/p>\n<h2>为什么不是直接用 PE<\/h2>\n<p>企业价值同时考虑股权与债务，更适合比较不同资本结构；经营资产回报试图观察企业用投入资本创造利润的能力。但字段定义必须统一。<\/p>\n<h2>量化流程<\/h2>\n<p>确定可交易股票池，排除不适用行业或单独处理；用当时已披露财报计算两个指标，分别排名后合成，定期持有并分散。<\/p>\n<h2>常见偏差<\/h2>\n<p>财报发布时间、一次性利润、负值处理、行业差异和退市样本都会显著改变结果。直接照搬海外口径到其他市场也可能失真。<\/p>\n<h2>经济直觉<\/h2>\n<p>便宜可能补偿风险，质量可能降低价值陷阱。两者组合不是保证，而是用简单规则平衡价格与经营能力。<\/p>\n<h2>两个排名为什么要分开做<\/h2>\n<p>价值指标寻找“价格相对经营收益较低”，质量指标寻找“投入资本创造经营利润的效率较高”。先分别排序再合成，可以避免一个维度的极端数值完全支配结果，也让组合同时回答“是否便宜”和“是否优质”。<\/p>\n<p>合成方法仍是参数：名次相加、标准化后等权或分组交叉会得到不同持仓，应在研究前固定并检查稳定性。<\/p>\n<h2>会计字段不是天然可比<\/h2>\n<p>不同企业的资本结构、行业资产和一次性项目会改变 EBIT、企业价值和投入资本。负值、极小分母和金融行业尤其需要单独规则。若根据回测表现随意删除异常公司，策略定义就会漂移。<\/p>\n<p>每个字段应记录来源、公告时间、版本和派生公式，使另一位研究者能够重算。<\/p>\n<h2>低估值可能是风险价格<\/h2>\n<p>公司便宜可能因为市场过度悲观，也可能因为盈利不可持续、治理或信用风险更高。质量维度试图减少价值陷阱，却不能消除。研究应分解行业、规模、杠杆和市场 Beta，判断收益是否只是承担了其他风险。<\/p>\n<h2>从排名到真实组合<\/h2>\n<p>需要定义时点股票池、调仓频率、持仓数量、权重、上市与退市处理、财报可用延迟和交易成本。策略持有期较长不等于没有成本，低流动性公司仍可能产生显著冲击和容量限制。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“基本面量化：乔尔·格林布拉特的神奇公式拆解”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nber.org/papers/w25551.pdf\">Moskowitz、Ooi 与 Pedersen：Time Series Momentum<\/a>：跨资产时间序列动量的研究入口。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nber.org/papers/w7032\">Gatev、Goetzmann 与 Rouwenhorst：Pairs Trading<\/a>：配对交易规则、历史样本与微观结构解释。<\/li>\n<li><strong>适用条件与边界<\/strong>：技术指标是价格变换而非独立信息；结论受品种、频率、交易制度、做空约束与成本影响。<\/li>\n<li><strong>主要失败模式<\/strong>：先看结果再挑参数、忽略冲击成本，或把一种市场状态下的规律外推到所有时期。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>神奇公式结合价值与质量两个维度。<\/li>\n<li>字段、行业和公告时间决定能否复现。<\/li>\n<li>简单排名仍需样本外、成本和风险暴露检验。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>写出你采用的资本回报率与盈利收益率字段公式，并说明负值和金融行业如何处理。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第053讲 行业轮动策略：把美林时钟用代码写出来<\/strong>。<\/p>"}, {"n": 53, "title": "行业轮动策略：把美林时钟用代码写出来", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解行业轮动的信号与组合层。<\/li>\n<li>认识美林时钟只是宏观分类框架。<\/li>\n<li>控制行业集中与频繁切换。<\/li>\n<\/ul>\n<h2>轮动在做什么<\/h2>\n<p>行业轮动根据增长、通胀、盈利、估值、价格趋势或资金流，在行业间动态分配。收益既可能来自宏观敏感度，也可能来自动量和风险暴露。<\/p>\n<h2>美林时钟的正确位置<\/h2>\n<p>时钟用增长与通胀方向划分环境，并给出资产偏好直觉。现实数据有修订和滞后，阶段边界模糊，不能把宏观标签当作精确交易开关。<\/p>\n<h2>可执行信号<\/h2>\n<p>可用行业指数中期动量、盈利预期变化、估值分位和宏观状态合成评分。所有宏观数据必须按首次发布时间进入，避免修订值前视。<\/p>\n<h2>组合设计<\/h2>\n<p>选择前若干行业并设置单行业上限、换手率缓冲和市场风险目标。行业 ETF 还要关注成分集中、跟踪误差和流动性。<\/p>\n<h2>验证<\/h2>\n<p>比较纯动量、纯宏观与组合模型，做滚动样本外和危机情景。若复杂宏观模型没有超过简单相对强弱基线，就不应为故事增加参数。<\/p>\n<h2>宏观状态是后来才看清的<\/h2>\n<p>增长和通胀数据往往滞后发布并持续修订。今天回看历史，阶段边界很清楚；当时决策者只看到不完整且可能被修订的数据。回测必须使用首次发布值或明确的可用延迟，不能用最终数据给过去贴标签。<\/p>\n<h2>先建立一个不讲故事的基线<\/h2>\n<p>可先用行业相对强弱构建简单轮动：固定调仓日计算过去一段时间收益，下一时点持有排名靠前行业并设置上限。随后再加入宏观状态，比较样本外收益、回撤、换手和暴露是否真正改善。<\/p>\n<p>如果复杂模型没有超过简单基线，宏观叙事可能只是对已有动量的重新命名。<\/p>\n<h2>行业指数本身也会变化<\/h2>\n<p>行业成分、分类标准和公司业务会随时间调整。使用今天成分回看历史会引入幸存者偏差，行业 ETF 还存在跟踪误差、费用和上市历史限制。研究应使用历史成分或明确可交易代理，并处理其生效日期。<\/p>\n<h2>轮动组合最怕集中与追逐<\/h2>\n<p>只持有排名最前行业会产生集中风险，频繁切换又可能在信号反转后追高杀低。可以设置单行业上限、缓冲区和最低持有期，但每项约束都应检查其对成本和风险的增量，而不是看完历史后堆叠。<\/p>\n<p>最终要回答的是：收益来自宏观识别、行业动量、市场 Beta，还是少数行业的长期上涨。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“行业轮动策略：把美林时钟用代码写出来”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nber.org/papers/w25551.pdf\">Moskowitz、Ooi 与 Pedersen：Time Series Momentum<\/a>：跨资产时间序列动量的研究入口。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nber.org/papers/w7032\">Gatev、Goetzmann 与 Rouwenhorst：Pairs Trading<\/a>：配对交易规则、历史样本与微观结构解释。<\/li>\n<li><strong>适用条件与边界<\/strong>：技术指标是价格变换而非独立信息；结论受品种、频率、交易制度、做空约束与成本影响。<\/li>\n<li><strong>主要失败模式<\/strong>：先看结果再挑参数、忽略冲击成本，或把一种市场状态下的规律外推到所有时期。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>行业轮动是跨行业相对配置，不是准确预测经济阶段。<\/li>\n<li>宏观数据修订与滞后会造成前视偏差。<\/li>\n<li>简单基线、集中度和换手率控制是核心。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>建立一个行业动量基线，再增加一个当时可得的宏观变量，检验是否提供样本外增量。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第054讲 什么是因子？Beta与Alpha的前世今生<\/strong>。<\/p>"}]}, {"no": 5, "name": "因子投资·寻找Alpha", "desc": "从单因子到多因子，掌握专业资管机构的核心语言。", "chapters": [{"n": 54, "title": "什么是因子？Beta与Alpha的前世今生", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。因子历史表现不代表未来收益。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解因子是可重复的收益与风险解释维度。<\/li>\n<li>区分 Beta 暴露与 Alpha。<\/li>\n<li>建立因子研究的定义、检验和实现流程。<\/li>\n<\/ul>\n<h2>因子是什么<\/h2>\n<p>因子是能在大量资产上统一计算、用于解释收益差异或预测相对表现的特征。市值、估值、动量、质量和波动都可构成因子，但一个财务字段不自动等于有效因子。<\/p>\n<h2>Beta 与 Alpha<\/h2>\n<p>Beta 表示组合对系统性风险来源的敏感度；Alpha 是在给定风险模型下未被解释的剩余收益。Alpha 不是永久标签：风险模型加入新因子后，过去的 Alpha 可能变成某种 Beta。<\/p>\n<h2>因子收益链<\/h2>\n<blockquote>\n<p>原始字段 → 清洗 → 行业与规模处理 → 标准化 → 排序或回归 → 组合 → 成本后收益<\/p>\n<\/blockquote>\n<p>每一步都会影响结论。因子必须按当时可得数据计算，并说明方向、更新频率和缺失处理。<\/p>\n<h2>为什么因子可能存在<\/h2>\n<p>可能来自承担风险、行为偏差、制度约束或交易摩擦。经济解释帮助判断持续性，但不能代替样本外证据。<\/p>\n<h2>检验维度<\/h2>\n<p>观察分组单调性、Rank IC、换手率、因子收益、跨市场稳定性、与已知因子相关性及成本后容量。一次显著回归不够。<\/p>\n<h2>一个字段怎样才变成因子<\/h2>\n<p>以 ROE 为例，数据库中的 ROE 只是一个字段。要成为可检验因子，还要定义使用哪一期财报、何时可得、亏损和缺失如何处理、是否在行业内比较、如何标准化、多久调仓以及因子值对应哪个未来收益窗口。<\/p>\n<p>这些规则一变，“质量因子”就可能变成另一种策略。同名不代表同一暴露，因子研究首先是定义工程，而不是给字段贴标签。<\/p>\n<h2>Alpha 会随着解释框架变化<\/h2>\n<p>假设一个组合在只控制市场因子时存在正截距；加入规模、价值或动量后，截距明显下降，说明此前所谓 Alpha 可能来自已知风格暴露。Alpha 的含义始终是“当前模型尚未解释的部分”，并不等于不可复制的能力。<\/p>\n<p>更严格的检验应比较不同风险模型、不同样本和成本前后结果，并报告系数稳定性，而不是只保留最有利的一张回归表。<\/p>\n<h2>因子收益需要经过六道门<\/h2>\n<blockquote>\n<p>经济机制 → 点时数据 → 截面预测 → 组合构造 → 真实执行 → 样本外存续<\/p>\n<\/blockquote>\n<p>经济故事解释为何可能存在；点时数据防止偷看未来；截面预测检查排序是否有信息；组合构造把分数转成权重；执行扣除换手与冲击；样本外验证判断结果是否只是研究选择。任何一道门失败，历史因子收益都不能直接成为投资结论。<\/p>\n<h2>多空因子与真实多头产品的距离<\/h2>\n<p>学术因子常用买入高分组、卖空低分组的多空收益描述溢价。真实产品可能只能做多、受基准和行业约束，还要面对借券、容量和税费。多空显著不代表做多端相对指数同样有效。<\/p>\n<p>研究应分别报告高分端、低分端和多空差，并模拟真实约束后的组合，避免把理论因子收益直接当成可获得回报。<\/p>\n<h2>因子研究卡：定义、检验与组合<\/h2>\n<p>研究“什么是因子？Beta与Alpha的前世今生”时，先把经济直觉、因子定义与组合实现分开。下面的流程可防止一个看似漂亮的排序结果被行业、规模或数据口径误导。<\/p>\n<ol>\n<li>明确因子值、方向、截面范围、调仓频率和未来收益窗口。<\/li>\n<li>按决策时点对齐数据，处理极值、缺失，并说明标准化与中性化方法。<\/li>\n<li>同时查看 IC、Rank IC、分组单调性、换手率、成本后收益和不同市场阶段。<\/li>\n<li>将因子加入已有组合，检查边际贡献、相关性、风险暴露与容量，而不是只看单因子回测。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/data_library.html\">Kenneth French Data Library<\/a>：因子定义、组合构造与可复核数据。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.aqr.com/Insights/Datasets/An-Academic-Quality-Data-Library-for-Practitioners\">AQR Academic Data Library<\/a>：价值、动量、低 Beta 与趋势等论文配套数据。<\/li>\n<li><strong>适用条件与边界<\/strong>：因子定义、股票池、滞后规则、中性化和再平衡不同会产生不同结果；历史溢价不是保证。<\/li>\n<li><strong>主要失败模式<\/strong>：同义因子重复计权、对全样本调参、忽略拥挤和容量，或把风格暴露误认作 Alpha。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>因子定义随结果不断调整；应先冻结定义，再保留真正独立的样本外区间。<\/li>\n<li>忽略行业、规模或风格暴露；超额收益可能只是已知风险因子的替身。<\/li>\n<li>只看多空组合收益；实际多头组合还受基准、约束、换手和可交易性影响。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>因子方向、频率和未来收益窗口无歧义<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>数据按当时可得口径对齐<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>单调性、稳定性、换手和成本均已报告<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>与已有因子及风险暴露完成增量比较<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>因子是跨资产可统一计算的解释或预测特征。<\/li>\n<li>Alpha 取决于所采用的风险模型。<\/li>\n<li>从字段到可交易收益需经过完整的数据与组合链路。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>选择一个因子，写出定义卡：经济逻辑、字段、时间、清洗、方向、频率、评价和失效条件。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第055讲 市场因子：你的收益有多少来自大盘上涨？<\/strong>。<\/p>"}, {"n": 55, "title": "市场因子：你的收益有多少来自大盘上涨？", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。因子历史表现不代表未来收益。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解市场因子和 Beta 的估计。<\/li>\n<li>分解绝对收益与超额收益。<\/li>\n<li>识别 Beta 漂移与非线性暴露。<\/li>\n<\/ul>\n<h2>市场因子<\/h2>\n<p>市场因子通常是广泛市场组合相对无风险资产的收益。个股或组合可写为：<\/p>\n<p>[\nR_i-R_f=\\alpha_i+\\beta_i(R_m-R_f)+\\varepsilon_i\n]<\/p>\n<p>Beta 大于 1 表示历史上对市场变化更敏感，小于 1 表示相对温和。<\/p>\n<h2>你的收益来自哪里<\/h2>\n<p>牛市中高 Beta 组合即使选股无效也可能表现亮眼。评价能力应把市场暴露、行业和其他风格收益分开，再看剩余部分。<\/p>\n<h2>Beta 不是常数<\/h2>\n<p>公司杠杆、业务结构和组合权重会变化；期权与止损策略还可能产生非线性 Beta。滚动估计比全样本单值更接近风险现实。<\/p>\n<h2>基准选择<\/h2>\n<p>用不匹配的市场指数会制造虚假 Alpha。小盘组合、海外资产或多资产策略需要更适当的基准与因子集合。<\/p>\n<h2>管理方式<\/h2>\n<p>可以通过股指期货、ETF 或权重调整控制市场 Beta，但对冲会引入基差、成本和动态偏离。中性目标必须持续监控。<\/p>\n<h2>高收益可能只是高 Beta<\/h2>\n<p>假设市场上涨 10%，组合上涨 14%。如果组合历史 Beta 为 1.4，那么仅凭市场暴露就可能解释大部分表现；若市场下跌 10%，同样暴露也可能带来更大损失。比较绝对收益而不控制 Beta，会把承担更多市场风险误认作选股能力。<\/p>\n<p>回归只是起点，还要检查 Beta 是否稳定、残差是否有结构，以及结果是否被少数牛市阶段主导。<\/p>\n<h2>基准选错会制造 Alpha<\/h2>\n<p>小盘组合若只与大盘指数比较，规模暴露可能被算作超额能力；海外资产、行业集中组合或多资产策略也需要与其风险来源匹配的基准。基准不是为了让策略看起来更好，而是为了回答“相对于什么替代投资，策略增加了价值”。<\/p>\n<p>可以同时报告政策基准、投资范围基准和因子模型归因，观察结论是否一致。<\/p>\n<h2>Beta 为何会随市场变化<\/h2>\n<p>组合权重、公司杠杆、行业结构和持仓选择都会改变 Beta。止损、期权和动态仓位还会产生非线性：上涨与下跌阶段的敏感度可能不同。单个全样本 Beta 会把这些变化平均掉。<\/p>\n<p>滚动估计、上涨/下跌分段和压力情景能帮助识别漂移，但短窗口估计噪声也更大，需要与持仓暴露共同判断。<\/p>\n<h2>对冲后的收益也有成本<\/h2>\n<p>使用股指期货或 ETF 对冲市场 Beta，会引入基差、融资、交易费用、合约移仓和模型误差。目标 Beta 为零不等于实际每天为零；部分成交和价格变化都会让暴露重新出现。<\/p>\n<p>风险系统应监控目标与实际 Beta、对冲成本和压力期偏离，而不是只在建仓时计算一次。<\/p>\n<h2>因子研究卡：定义、检验与组合<\/h2>\n<p>研究“市场因子：你的收益有多少来自大盘上涨？”时，先把经济直觉、因子定义与组合实现分开。下面的流程可防止一个看似漂亮的排序结果被行业、规模或数据口径误导。<\/p>\n<ol>\n<li>明确因子值、方向、截面范围、调仓频率和未来收益窗口。<\/li>\n<li>按决策时点对齐数据，处理极值、缺失，并说明标准化与中性化方法。<\/li>\n<li>同时查看 IC、Rank IC、分组单调性、换手率、成本后收益和不同市场阶段。<\/li>\n<li>将因子加入已有组合，检查边际贡献、相关性、风险暴露与容量，而不是只看单因子回测。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/data_library.html\">Kenneth French Data Library<\/a>：因子定义、组合构造与可复核数据。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://pubs.aeaweb.org/doi/10.1257/0895330042162430\">Fama 与 French：CAPM 的理论与证据<\/a>：CAPM 的逻辑、应用与经验缺陷。<\/li>\n<li><strong>适用条件与边界<\/strong>：因子定义、股票池、滞后规则、中性化和再平衡不同会产生不同结果；历史溢价不是保证。<\/li>\n<li><strong>主要失败模式<\/strong>：同义因子重复计权、对全样本调参、忽略拥挤和容量，或把风格暴露误认作 Alpha。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>因子定义随结果不断调整；应先冻结定义，再保留真正独立的样本外区间。<\/li>\n<li>忽略行业、规模或风格暴露；超额收益可能只是已知风险因子的替身。<\/li>\n<li>只看多空组合收益；实际多头组合还受基准、约束、换手和可交易性影响。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>因子方向、频率和未来收益窗口无歧义<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>数据按当时可得口径对齐<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>单调性、稳定性、换手和成本均已报告<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>与已有因子及风险暴露完成增量比较<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>市场 Beta 是组合对系统性权益风险的敏感度。<\/li>\n<li>高绝对收益可能主要来自市场上涨。<\/li>\n<li>Beta 会漂移，基准和非线性需要额外处理。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>把一个组合收益回归市场收益，比较全样本 Beta 与 60 日滚动 Beta，并定位变化最大的时期。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第056讲 规模因子：小盘股长期溢价真的存在吗？<\/strong>。<\/p>"}, {"n": 56, "title": "规模因子：小盘股长期溢价真的存在吗？", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。因子历史表现不代表未来收益。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解规模因子的构造与可能解释。<\/li>\n<li>认识小盘溢价的成本和样本敏感性。<\/li>\n<li>避免把流动性风险误当免费收益。<\/li>\n<\/ul>\n<h2>规模如何定义<\/h2>\n<p>常见规模变量是自由流通或总市值的对数。研究按时点市值排序，比较小盘与大盘组合未来收益。<\/p>\n<h2>为什么小盘可能有溢价<\/h2>\n<p>可能来自更高经营风险、信息覆盖不足、流动性补偿或投资者偏好。但不同市场和时期结果并不稳定，极小微盘的纸面收益尤其容易被交易限制夸大。<\/p>\n<h2>主要偏差<\/h2>\n<ul>\n<li>使用当前存续股票导致幸存者偏差。<\/li>\n<li>忽略涨跌停、停牌与市场冲击成本。<\/li>\n<li>市值使用未来股本或错误复权。<\/li>\n<li>把壳价值、行业和流动性暴露都归为规模。<\/li>\n<\/ul>\n<h2>实现方式<\/h2>\n<p>设置上市时间、流动性和可交易过滤，按当时市值分组，控制行业并计入真实成本。观察收益是否集中在最小、最难交易的一端。<\/p>\n<h2>风险含义<\/h2>\n<p>小盘组合容量有限、尾部和流动性风险高。因子存在不等于适合所有资金规模。<\/p>\n<h2>“小盘”首先是一个时点定义<\/h2>\n<p>市值等于当时价格与当时股本的组合。若使用后来修订的股本、今天存续股票或错误复权价格，历史规模排序就会泄漏未来。自由流通市值与总市值也代表不同可交易含义，不能混用后仍称为同一因子。<\/p>\n<p>因子定义卡应写明市值口径、排序日期、股票池和调仓生效时间。<\/p>\n<h2>纸面溢价可能藏在最难交易的一端<\/h2>\n<p>极小市值股票往往成交额低、价差大、停牌与涨跌停更常见。回测按收盘价等权买入，可能把无法获得的价格当成真实成交。逐步剔除最低流动性和最小规模样本，可以观察因子收益是否仍存在，还是完全由不可交易尾部贡献。<\/p>\n<p>容量评估还要扩大模拟资金，估计订单占成交额比例和冲击。对小盘策略而言，规模增长可能直接消灭优势。<\/p>\n<h2>规模因子混合了哪些风险<\/h2>\n<p>小盘公司可能更年轻、融资约束更强、信息覆盖更少，也可能集中于特定行业和高波动状态。若不控制流动性、质量和行业，所谓规模溢价可能是多种风险的混合。<\/p>\n<p>分解并不一定要把所有暴露都中性化；关键是知道自己买了什么，并判断收益是否足以补偿这些风险。<\/p>\n<h2>从多空因子到小盘产品<\/h2>\n<p>学术 SMB 类组合比较小盘与大盘，真实小盘产品通常仍有正市场 Beta，也未必能做空大盘。产品收益取决于市场方向、规模暴露、选股和成本。研究应将相对基准收益与绝对收益分开，避免把学术因子直接映射为产品承诺。<\/p>\n<h2>因子研究卡：定义、检验与组合<\/h2>\n<p>研究“规模因子：小盘股长期溢价真的存在吗？”时，先把经济直觉、因子定义与组合实现分开。下面的流程可防止一个看似漂亮的排序结果被行业、规模或数据口径误导。<\/p>\n<ol>\n<li>明确因子值、方向、截面范围、调仓频率和未来收益窗口。<\/li>\n<li>按决策时点对齐数据，处理极值、缺失，并说明标准化与中性化方法。<\/li>\n<li>同时查看 IC、Rank IC、分组单调性、换手率、成本后收益和不同市场阶段。<\/li>\n<li>将因子加入已有组合，检查边际贡献、相关性、风险暴露与容量，而不是只看单因子回测。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/data_library.html\">Kenneth French Data Library<\/a>：因子定义、组合构造与可复核数据。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://pubs.aeaweb.org/doi/10.1257/0895330042162430\">Fama 与 French：CAPM 的理论与证据<\/a>：CAPM 的逻辑、应用与经验缺陷。<\/li>\n<li><strong>适用条件与边界<\/strong>：因子定义、股票池、滞后规则、中性化和再平衡不同会产生不同结果；历史溢价不是保证。<\/li>\n<li><strong>主要失败模式<\/strong>：同义因子重复计权、对全样本调参、忽略拥挤和容量，或把风格暴露误认作 Alpha。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>因子定义随结果不断调整；应先冻结定义，再保留真正独立的样本外区间。<\/li>\n<li>忽略行业、规模或风格暴露；超额收益可能只是已知风险因子的替身。<\/li>\n<li>只看多空组合收益；实际多头组合还受基准、约束、换手和可交易性影响。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>因子方向、频率和未来收益窗口无歧义<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>数据按当时可得口径对齐<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>单调性、稳定性、换手和成本均已报告<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>与已有因子及风险暴露完成增量比较<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>规模因子比较不同市值资产的相对表现。<\/li>\n<li>小盘溢价可能包含风险与流动性补偿。<\/li>\n<li>可交易过滤和容量评估决定实盘交易意义。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>逐步剔除最低流动性和最小市值股票，观察规模因子收益与换手率如何变化。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第057讲 价值因子：低市盈率、低市净率是否永不褪色<\/strong>。<\/p>"}, {"n": 57, "title": "价值因子：低市盈率、低市净率是否永不褪色", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。因子历史表现不代表未来收益。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解价值因子的多种估值口径。<\/li>\n<li>识别低估值与价值陷阱。<\/li>\n<li>构建行业可比的价值组合。<\/li>\n<\/ul>\n<h2>价值因子在买什么<\/h2>\n<p>价值因子偏好价格相对基本面较低的资产。常见指标包括账面市值比、盈利收益率、销售收入收益率和自由现金流收益率。<\/p>\n<h2>PE 与 PB 的边界<\/h2>\n<p>亏损公司 PE 无正常意义，资产轻型公司 PB 可能长期较高，金融业的账面价值又更关键。单一指标跨行业比较会造成结构偏差。<\/p>\n<h2>为什么可能有收益<\/h2>\n<p>低估值可能补偿困境风险，也可能来自投资者对热门成长过度外推。两种解释都意味着价值策略会经历长时间落后。<\/p>\n<h2>价值陷阱<\/h2>\n<p>便宜可能因为盈利将恶化、资产质量差或行业衰退。加入质量、盈利修订和财务安全条件可以降低部分陷阱，但也会改变因子含义。<\/p>\n<h2>构建原则<\/h2>\n<p>使用公告可得数据、行业内标准化、多指标合成和持仓上限，报告行业与规模暴露。价值因子要看完整周期，不应因短期失效频繁改口径。<\/p>\n<h2>同一家公司可以同时便宜又昂贵<\/h2>\n<p>一家重资产公司可能 PB 很低，但若盈利能力差，PE 或现金流收益率并不便宜；资产轻型公司 PB 很高，却可能具有较强盈利与现金流。估值指标使用不同分母，回答的是价格相对哪类基本面的高低。<\/p>\n<p>多指标合成能减少单一口径偏差，也会增加处理规则。应先比较每个指标的行业适用性和重合度，再决定是否合成。<\/p>\n<h2>价值陷阱如何进入排序<\/h2>\n<p>低估值可能来自市场误判，也可能提前反映盈利恶化、资产减值或行业衰退。若只看历史报表，组合可能在基本面尚未更新时不断买入恶化公司。加入质量或盈利修订可以过滤部分陷阱，但会把纯价值变成价值—质量策略。<\/p>\n<p>报告中应如实说明因子含义变化，并比较过滤前后收益、风险和行业暴露。<\/p>\n<h2>价值策略为什么可能长期落后<\/h2>\n<p>如果收益来自风险补偿，困难时期正是风险暴露最痛苦的时候；如果来自行为偏差，热门成长叙事也可能持续很久。长期落后不自动证明价值失效，短期反弹也不证明机制恢复。<\/p>\n<p>研究者应预先定义监控指标：估值差、盈利质量、拥挤、行业结构和成本后相对收益，而不是根据最近表现临时改口径。<\/p>\n<h2>公告时点比估值公式更重要<\/h2>\n<p>分母来自财报，必须在公开后才能使用；价格来自调仓时点，两者需要明确对齐。将年末财务数据提前放到年末价格上，会让策略拥有尚未披露的信息。今天数据库里的最终修订值也不能假装是历史当时版本。<\/p>\n<h2>因子研究卡：定义、检验与组合<\/h2>\n<p>研究“价值因子：低市盈率、低市净率是否永不褪色”时，先把经济直觉、因子定义与组合实现分开。下面的流程可防止一个看似漂亮的排序结果被行业、规模或数据口径误导。<\/p>\n<ol>\n<li>明确因子值、方向、截面范围、调仓频率和未来收益窗口。<\/li>\n<li>按决策时点对齐数据，处理极值、缺失，并说明标准化与中性化方法。<\/li>\n<li>同时查看 IC、Rank IC、分组单调性、换手率、成本后收益和不同市场阶段。<\/li>\n<li>将因子加入已有组合，检查边际贡献、相关性、风险暴露与容量，而不是只看单因子回测。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/data_library.html\">Kenneth French Data Library<\/a>：因子定义、组合构造与可复核数据。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://pubs.aeaweb.org/doi/10.1257/0895330042162430\">Fama 与 French：CAPM 的理论与证据<\/a>：CAPM 的逻辑、应用与经验缺陷。<\/li>\n<li><strong>适用条件与边界<\/strong>：因子定义、股票池、滞后规则、中性化和再平衡不同会产生不同结果；历史溢价不是保证。<\/li>\n<li><strong>主要失败模式<\/strong>：同义因子重复计权、对全样本调参、忽略拥挤和容量，或把风格暴露误认作 Alpha。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>因子定义随结果不断调整；应先冻结定义，再保留真正独立的样本外区间。<\/li>\n<li>忽略行业、规模或风格暴露；超额收益可能只是已知风险因子的替身。<\/li>\n<li>只看多空组合收益；实际多头组合还受基准、约束、换手和可交易性影响。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>因子方向、频率和未来收益窗口无歧义<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>数据按当时可得口径对齐<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>单调性、稳定性、换手和成本均已报告<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>与已有因子及风险暴露完成增量比较<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>价值衡量价格相对基本面的便宜程度。<\/li>\n<li>估值指标具有行业和会计边界。<\/li>\n<li>低估值可能是错价，也可能是风险信息。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>用 PE、PB 和自由现金流收益率分别排序，比较三者的行业分布和重合度。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第058讲 动量因子：强者恒强，能持续多久？<\/strong>。<\/p>"}, {"n": 58, "title": "动量因子：强者恒强，能持续多久？", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。因子历史表现不代表未来收益。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解因子动量与价格动量的关系。<\/li>\n<li>掌握窗口、跳过期和调仓的影响。<\/li>\n<li>识别反转、拥挤和交易成本。<\/li>\n<\/ul>\n<h2>动量因子<\/h2>\n<p>横截面动量通常按过去中期收益排序，持有赢家并回避或做空输家。常见研究会跳过最近短期，以减少微观结构和短期反转。<\/p>\n<h2>信号定义<\/h2>\n<p>累计收益率、风险调整收益和残差动量是不同版本。残差动量先剔除市场与风格，再看个体趋势，可能降低共同因子暴露。<\/p>\n<h2>强者恒强能多久<\/h2>\n<p>动量的持有期应通过信号衰减曲线观察，而不是固定相信某个窗口。过快调仓提高成本，过慢则信号过期。<\/p>\n<h2>崩溃风险<\/h2>\n<p>快速市场反转时，过去输家反弹、赢家回落，组合可能大幅亏损。行业集中和空头约束会放大问题。<\/p>\n<h2>实现<\/h2>\n<p>进行行业中性、波动调整、换手率缓冲和多周期合成；报告成本前后收益及反转情景。<\/p>\n<h2>动量信号的三段时间<\/h2>\n<p>一项动量定义至少包含形成期、可能的跳过期和持有期。形成期决定回看多久，跳过期决定是否排除最近变化，持有期决定信号多久更新。三者共同决定换手、衰减和反转风险，不能只写“过去收益”。<\/p>\n<p>测试时应固定形成规则，再绘制未来多个期限的 Rank IC 或分组收益，观察信息何时最强、何时消失或反转。<\/p>\n<h2>价格动量与残差动量的区别<\/h2>\n<p>价格动量可能包含市场和行业共同上涨；残差动量先剔除这些暴露，再观察个股相对趋势。后者更接近个体信息，却依赖风险模型质量。若模型遗漏重要因子，残差仍可能不是纯个股信号。<\/p>\n<p>两种版本应在相同股票池、成本和组合约束下比较，而不是只比较毛收益。<\/p>\n<h2>换手缓冲如何保护微弱优势<\/h2>\n<p>如果股票排名刚刚越过持仓边界，立即全量替换会产生大量交易。可设置进入与退出使用不同阈值，或只交易目标权重与实际权重差异超过一定范围的部分。缓冲会降低信号纯度，也会减少成本。<\/p>\n<p>评价应比较毛收益损失与净收益改善，不能把低换手本身当作目标。<\/p>\n<h2>动量崩溃是一种组合事件<\/h2>\n<p>快速反转时，过去赢家和输家可能同时翻转，空头端还可能遭遇挤压。行业集中和高 Beta 会让损失进一步放大。压力测试应重建暴露、流动性和借券条件，而不只是把历史最差月列出来。<\/p>\n<h2>因子研究卡：定义、检验与组合<\/h2>\n<p>研究“动量因子：强者恒强，能持续多久？”时，先把经济直觉、因子定义与组合实现分开。下面的流程可防止一个看似漂亮的排序结果被行业、规模或数据口径误导。<\/p>\n<ol>\n<li>明确因子值、方向、截面范围、调仓频率和未来收益窗口。<\/li>\n<li>按决策时点对齐数据，处理极值、缺失，并说明标准化与中性化方法。<\/li>\n<li>同时查看 IC、Rank IC、分组单调性、换手率、成本后收益和不同市场阶段。<\/li>\n<li>将因子加入已有组合，检查边际贡献、相关性、风险暴露与容量，而不是只看单因子回测。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nber.org/papers/w25551.pdf\">Moskowitz、Ooi 与 Pedersen：Time Series Momentum<\/a>：跨资产时间序列动量的研究入口。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.aqr.com/Insights/Datasets/An-Academic-Quality-Data-Library-for-Practitioners\">AQR Academic Data Library<\/a>：价值、动量、低 Beta 与趋势等论文配套数据。<\/li>\n<li><strong>适用条件与边界<\/strong>：因子定义、股票池、滞后规则、中性化和再平衡不同会产生不同结果；历史溢价不是保证。<\/li>\n<li><strong>主要失败模式<\/strong>：同义因子重复计权、对全样本调参、忽略拥挤和容量，或把风格暴露误认作 Alpha。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>因子定义随结果不断调整；应先冻结定义，再保留真正独立的样本外区间。<\/li>\n<li>忽略行业、规模或风格暴露；超额收益可能只是已知风险因子的替身。<\/li>\n<li>只看多空组合收益；实际多头组合还受基准、约束、换手和可交易性影响。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>因子方向、频率和未来收益窗口无歧义<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>数据按当时可得口径对齐<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>单调性、稳定性、换手和成本均已报告<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>与已有因子及风险暴露完成增量比较<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>动量因子利用相对收益延续。<\/li>\n<li>窗口、跳过期和持有期决定信号衰减。<\/li>\n<li>快速反转与拥挤是核心尾部风险。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>绘制动量信号未来 1–12 个月的 Rank IC 衰减曲线，选择有证据的持有期。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第059讲 质量因子：高ROE、稳定盈利的公司更香吗？<\/strong>。<\/p>"}, {"n": 59, "title": "质量因子：高ROE、稳定盈利的公司更香吗？", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。因子历史表现不代表未来收益。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解质量因子的盈利、稳健和安全维度。<\/li>\n<li>区分高 ROE 与真实经营质量。<\/li>\n<li>处理行业、杠杆和会计操纵。<\/li>\n<\/ul>\n<h2>质量不是一个字段<\/h2>\n<p>质量通常覆盖盈利能力、盈利稳定性、现金流质量、资产负债表安全和资本配置。ROE 高可能来自好业务，也可能来自高杠杆或低净资产。<\/p>\n<h2>常见指标<\/h2>\n<p>毛利率、ROA、ROE、经营现金流/利润、应计项、利润波动、杠杆和利息保障倍数。不同指标方向与行业含义不同。<\/p>\n<h2>数据处理<\/h2>\n<p>使用过去已公告财报，剔除一次性项目或至少做敏感性分析；在行业内标准化，避免把商业模式差异当质量。<\/p>\n<h2>为什么可能有效<\/h2>\n<p>投资者可能低估稳定复利的价值，机构约束也可能造成定价偏差。但“好公司”在估值过高时不一定是好投资，因此质量常与价值组合。<\/p>\n<h2>风险<\/h2>\n<p>会计数据滞后，粉饰可能在事后才暴露。质量组合还可能集中于低杠杆、防御和大盘风格。<\/p>\n<h2>高 ROE 可能来自三条路<\/h2>\n<p>杜邦分解把 ROE 拆成利润率、资产周转和财务杠杆。两家公司 ROE 都为 20%，一家可能靠高利润率与高周转，另一家可能主要依赖高杠杆。只按 ROE 排序，会把经营效率和资本结构混在一起。<\/p>\n<p>因此质量因子通常需要同时观察盈利能力、现金流和资产负债表，而不是寻找一个万能字段。<\/p>\n<h2>利润与现金为什么要交叉检查<\/h2>\n<p>会计利润包含应计估计，经营现金流反映另一种经营结果。利润持续增长但现金转化较弱，可能提示收入确认、营运资本占用或一次性项目。现金流也会受周期和付款时点影响，不能单独判决。<\/p>\n<p>更稳健的做法是使用多个互补维度，并在行业内比较，避免把商业模式差异当作质量差异。<\/p>\n<h2>“好公司”也可能是昂贵投资<\/h2>\n<p>市场若已经为稳定盈利支付很高估值，未来收益未必理想。质量与价值合成可以平衡经营与价格，但必须分别报告两个因子的贡献，避免结果好时称质量、结果差时又称估值。<\/p>\n<p>质量组合还常集中于大盘、防御和低杠杆风格，这些暴露需要在归因中显式呈现。<\/p>\n<h2>会计数据的版本与滞后<\/h2>\n<p>财务质量只能在公告后进入策略。更正、重述和一次性损益会改变历史指标；今天最终版本不能回填为历史当时已知。研究应保留公告时间、版本和是否剔除一次性项目的规则，并做敏感性分析。<\/p>\n<h2>因子研究卡：定义、检验与组合<\/h2>\n<p>研究“质量因子：高ROE、稳定盈利的公司更香吗？”时，先把经济直觉、因子定义与组合实现分开。下面的流程可防止一个看似漂亮的排序结果被行业、规模或数据口径误导。<\/p>\n<ol>\n<li>明确因子值、方向、截面范围、调仓频率和未来收益窗口。<\/li>\n<li>按决策时点对齐数据，处理极值、缺失，并说明标准化与中性化方法。<\/li>\n<li>同时查看 IC、Rank IC、分组单调性、换手率、成本后收益和不同市场阶段。<\/li>\n<li>将因子加入已有组合，检查边际贡献、相关性、风险暴露与容量，而不是只看单因子回测。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/data_library.html\">Kenneth French Data Library<\/a>：因子定义、组合构造与可复核数据。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.aqr.com/Insights/Datasets/An-Academic-Quality-Data-Library-for-Practitioners\">AQR Academic Data Library<\/a>：价值、动量、低 Beta 与趋势等论文配套数据。<\/li>\n<li><strong>适用条件与边界<\/strong>：因子定义、股票池、滞后规则、中性化和再平衡不同会产生不同结果；历史溢价不是保证。<\/li>\n<li><strong>主要失败模式<\/strong>：同义因子重复计权、对全样本调参、忽略拥挤和容量，或把风格暴露误认作 Alpha。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>因子定义随结果不断调整；应先冻结定义，再保留真正独立的样本外区间。<\/li>\n<li>忽略行业、规模或风格暴露；超额收益可能只是已知风险因子的替身。<\/li>\n<li>只看多空组合收益；实际多头组合还受基准、约束、换手和可交易性影响。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>因子方向、频率和未来收益窗口无歧义<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>数据按当时可得口径对齐<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>单调性、稳定性、换手和成本均已报告<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>与已有因子及风险暴露完成增量比较<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>质量因子应综合盈利、稳定、现金流和财务安全。<\/li>\n<li>高 ROE 需要拆解杠杆与盈利来源。<\/li>\n<li>质量与估值、行业暴露应联合观察。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>对 ROE 做杜邦分解，判断高值来自利润率、周转还是杠杆。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第060讲 低波动因子：为何低风险股票反而回报更高？<\/strong>。<\/p>"}, {"n": 60, "title": "低波动因子：为何低风险股票反而回报更高？", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。因子历史表现不代表未来收益。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解低波动异象与最小方差区别。<\/li>\n<li>认识防御暴露和估值拥挤。<\/li>\n<li>构建可交易的低风险组合。<\/li>\n<\/ul>\n<h2>低风险为何可能不低收益<\/h2>\n<p>传统直觉认为承担更多风险应获得更高回报，但历史研究中低波或低 Beta 股票有时呈现较好风险调整表现。可能原因包括杠杆限制、彩票偏好和机构基准约束。<\/p>\n<h2>两种实现<\/h2>\n<p>低波因子按个股历史波动排序；最小方差组合还利用协方差，通过优化降低组合波动。后者对估计误差更敏感。<\/p>\n<h2>隐藏暴露<\/h2>\n<p>低波组合常偏向公用事业、消费、防御和大盘股，并可能具有利率敏感性。表现不能全部归因于“低波”标签。<\/p>\n<h2>估计与调仓<\/h2>\n<p>窗口过短会追逐近期波动，过长反应慢。采用收缩估计、权重上限和换手率缓冲可提高稳健性。<\/p>\n<h2>风险<\/h2>\n<p>低波资产估值过高、利率快速变化或防御风格反转时也会集中亏损。低历史波动不代表没有尾部。<\/p>\n<h2>低波排序与最小方差不是一回事<\/h2>\n<p>低波排序只看每只股票自身历史波动，再持有较低的一组；最小方差组合还使用股票之间的协方差，可能给某些单股较高权重，只因它们与其他持仓的组合关系有利。前者简单透明，后者更依赖估计与优化约束。<\/p>\n<p>比较时要使用相同股票池、行业上限和成本，否则无法判断差异来自方法还是约束。<\/p>\n<h2>历史安静不等于未来安全<\/h2>\n<p>短窗口会把最近平静资产快速推到高权重，长窗口又可能忽略新风险。低波资产仍可能有信用、流动性和跳空风险，标准差无法覆盖全部尾部。<\/p>\n<p>应同时检查最大回撤、下行波动、压力期相关性和成交深度，并对权重设置上限。<\/p>\n<h2>防御暴露可能解释部分结果<\/h2>\n<p>低波组合常偏向稳定现金流、成熟行业和大盘股，也可能对利率变化敏感。若组合表现良好，需要区分来自个股低波特征、行业配置还是其他风格因子。<\/p>\n<p>中性化能够减少某些暴露，却可能移除策略本来想要的经济机制。关键是明确选择，而不是机械消除所有差异。<\/p>\n<h2>低波拥挤会改变估值<\/h2>\n<p>当大量资金偏好低波资产时，估值可能上升，未来收益空间下降；风格反转时，过去稳定的股票也会一起下跌。监控应包含估值、资金集中和行业权重，而不只观察滚动波动率。<\/p>\n<h2>因子研究卡：定义、检验与组合<\/h2>\n<p>研究“低波动因子：为何低风险股票反而回报更高？”时，先把经济直觉、因子定义与组合实现分开。下面的流程可防止一个看似漂亮的排序结果被行业、规模或数据口径误导。<\/p>\n<ol>\n<li>明确因子值、方向、截面范围、调仓频率和未来收益窗口。<\/li>\n<li>按决策时点对齐数据，处理极值、缺失，并说明标准化与中性化方法。<\/li>\n<li>同时查看 IC、Rank IC、分组单调性、换手率、成本后收益和不同市场阶段。<\/li>\n<li>将因子加入已有组合，检查边际贡献、相关性、风险暴露与容量，而不是只看单因子回测。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/data_library.html\">Kenneth French Data Library<\/a>：因子定义、组合构造与可复核数据。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.aqr.com/Insights/Datasets/An-Academic-Quality-Data-Library-for-Practitioners\">AQR Academic Data Library<\/a>：价值、动量、低 Beta 与趋势等论文配套数据。<\/li>\n<li><strong>适用条件与边界<\/strong>：因子定义、股票池、滞后规则、中性化和再平衡不同会产生不同结果；历史溢价不是保证。<\/li>\n<li><strong>主要失败模式<\/strong>：同义因子重复计权、对全样本调参、忽略拥挤和容量，或把风格暴露误认作 Alpha。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>因子定义随结果不断调整；应先冻结定义，再保留真正独立的样本外区间。<\/li>\n<li>忽略行业、规模或风格暴露；超额收益可能只是已知风险因子的替身。<\/li>\n<li>只看多空组合收益；实际多头组合还受基准、约束、换手和可交易性影响。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>因子方向、频率和未来收益窗口无歧义<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>数据按当时可得口径对齐<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>单调性、稳定性、换手和成本均已报告<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>与已有因子及风险暴露完成增量比较<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>低波因子与最小方差组合不是同一概念。<\/li>\n<li>行业、利率和估值暴露可能解释部分表现。<\/li>\n<li>稳健协方差与权重约束比精确优化更重要。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>比较简单低波排序与最小方差组合的行业权重、换手率和样本外波动。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第061讲 Fama-French三因子及五因子模型：学院派的基石<\/strong>。<\/p>"}, {"n": 61, "title": "Fama-French三因子及五因子模型：学院派的基石", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。因子历史表现不代表未来收益。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解 Fama-French 三因子和五因子结构。<\/li>\n<li>会解释时间序列回归中的暴露与 Alpha。<\/li>\n<li>认识学术因子到实盘交易组合的距离。<\/li>\n<\/ul>\n<h2>三因子框架<\/h2>\n<p>三因子在市场因子之外加入规模 SMB 与价值 HML，用共同收益组合解释资产差异：<\/p>\n<p>[\nR_i-R_f=\\alpha+\\beta_m MKT+s\\,SMB+h\\,HML+\\varepsilon\n]<\/p>\n<p>系数表示历史暴露，Alpha 是模型未解释部分。<\/p>\n<h2>五因子扩展<\/h2>\n<p>五因子进一步加入盈利能力 RMW 与投资风格 CMA。它说明公司盈利与投资行为可能包含独立于价值、规模的信息。<\/p>\n<h2>因子组合如何构造<\/h2>\n<p>学术因子通常基于排序和多空组合，具体断点、加权与市场范围会影响结果。不同数据源的同名因子并非天然一致。<\/p>\n<h2>用途<\/h2>\n<ul>\n<li>解释基金收益来自哪些系统性暴露。<\/li>\n<li>评估新因子是否提供增量。<\/li>\n<li>约束组合不希望承担的风险。<\/li>\n<\/ul>\n<h2>局限<\/h2>\n<p>模型是经验近似，因子之间相关且随时间变化；多空学术收益也未必可低成本复制。回归显著不等于可交易。<\/p>\n<h2>回归系数怎样读成投资语言<\/h2>\n<p>市场系数较高表示组合对权益市场更敏感；SMB 系数为正说明更偏小盘；HML 系数为正说明更偏价值。加入盈利和投资因子后，原有系数与 Alpha 可能变化，说明收益解释被重新分配。<\/p>\n<p>系数是样本平均关系，不是永久身份。滚动回归可以观察基金是否风格漂移，但短窗口也会增加估计噪声。<\/p>\n<h2>因子组合不是自然常数<\/h2>\n<p>规模断点、账面价值定义、排序时间、加权方法和股票市场范围都会影响 SMB、HML 等因子。同名数据在不同市场或供应商中可能不同。复现研究时应使用原始构造说明，而不是只下载列名相同的序列。<\/p>\n<h2>学术解释与投资组合的距离<\/h2>\n<p>学术因子多为空头与多头组合，可能包含小盘、低流动性或难借证券。真实产品受到做空、基准、行业和换手约束，无法无成本复制。回归解释“像什么”，不代表投资者可以直接获得同等因子收益。<\/p>\n<h2>Alpha 缩小不一定是坏消息<\/h2>\n<p>若加入更多合理因子后 Alpha 下降，说明策略收益可以由已知风险暴露解释。对风险管理而言，这能帮助使用更便宜工具复制或对冲；对能力评价而言，则需要更谨慎。模型目标不是保护漂亮 Alpha，而是更准确地解释收益。<\/p>\n<h2>因子研究卡：定义、检验与组合<\/h2>\n<p>研究“Fama-French三因子及五因子模型：学院派的基石”时，先把经济直觉、因子定义与组合实现分开。下面的流程可防止一个看似漂亮的排序结果被行业、规模或数据口径误导。<\/p>\n<ol>\n<li>明确因子值、方向、截面范围、调仓频率和未来收益窗口。<\/li>\n<li>按决策时点对齐数据，处理极值、缺失，并说明标准化与中性化方法。<\/li>\n<li>同时查看 IC、Rank IC、分组单调性、换手率、成本后收益和不同市场阶段。<\/li>\n<li>将因子加入已有组合，检查边际贡献、相关性、风险暴露与容量，而不是只看单因子回测。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/data_library.html\">Kenneth French Data Library<\/a>：因子定义、组合构造与可复核数据。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://pubs.aeaweb.org/doi/10.1257/0895330042162430\">Fama 与 French：CAPM 的理论与证据<\/a>：CAPM 的逻辑、应用与经验缺陷。<\/li>\n<li><strong>适用条件与边界<\/strong>：因子定义、股票池、滞后规则、中性化和再平衡不同会产生不同结果；历史溢价不是保证。<\/li>\n<li><strong>主要失败模式<\/strong>：同义因子重复计权、对全样本调参、忽略拥挤和容量，或把风格暴露误认作 Alpha。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>因子定义随结果不断调整；应先冻结定义，再保留真正独立的样本外区间。<\/li>\n<li>忽略行业、规模或风格暴露；超额收益可能只是已知风险因子的替身。<\/li>\n<li>只看多空组合收益；实际多头组合还受基准、约束、换手和可交易性影响。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>因子方向、频率和未来收益窗口无歧义<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>数据按当时可得口径对齐<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>单调性、稳定性、换手和成本均已报告<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>与已有因子及风险暴露完成增量比较<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>三因子加入规模与价值，五因子再加入盈利和投资。<\/li>\n<li>因子暴露用于解释与风险管理，不是收益保证。<\/li>\n<li>构造口径与实盘交易成本会改变学术结果。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>用三因子和五因子分别回归同一组合，比较 Alpha 和暴露变化。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第062讲 多因子合成方法：排序打分、等权还是优化？<\/strong>。<\/p>"}, {"n": 62, "title": "多因子合成方法：排序打分、等权还是优化？", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。因子历史表现不代表未来收益。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>掌握排序、标准分和优化三类合成方法。<\/li>\n<li>处理因子方向、尺度和相关性。<\/li>\n<li>用样本外标准选择复杂度。<\/li>\n<\/ul>\n<h2>为什么要合成<\/h2>\n<p>单因子会阶段性失效。多因子希望分散信号来源，但把多个高度相关指标相加并不会带来真正分散。<\/p>\n<h2>三种方法<\/h2>\n<h3>排序打分<\/h3>\n<p>分别排名后相加，直观且对极端值不敏感，但丢失距离信息。<\/p>\n<h3>标准分加权<\/h3>\n<p>将因子做 z-score 后按权重合成，可表达强弱幅度；需要稳健处理异常和行业。<\/p>\n<h3>预测或优化<\/h3>\n<p>根据历史 IC、回归系数或组合目标估计权重，适应性更强，也更容易过拟合和产生高换手率。<\/p>\n<h2>因子预处理<\/h2>\n<p>统一方向、缩尾、标准化、中性化，检查覆盖和相关矩阵。对于高度相似的价值指标，可先聚类或在主题内等权。<\/p>\n<h2>权重选择<\/h2>\n<p>等权是重要基线。复杂权重只有在滚动样本外、成本后和参数扰动下持续优于等权，才值得使用。<\/p>\n<h2>评价<\/h2>\n<p>不仅看组合收益，还看每个因子的边际贡献、暴露漂移、换手率和失效情景。<\/p>\n<h2>三个价值指标不等于三个独立因子<\/h2>\n<p>PE、PB 和现金流收益率都可能表达“便宜”，简单等权相加会让价值主题重复计权，再与一个动量指标合成时，组合实际可能主要由价值驱动。合成前应查看相关矩阵、重合持仓和经济主题。<\/p>\n<p>可以先在主题内部合成，再让价值、质量、动量等不同主题等权，减少同义指标数量带来的隐性权重。<\/p>\n<h2>排名与 z-score 保留的信息不同<\/h2>\n<p>排名只保留顺序，对极端值更稳健；z-score 保留距离，但容易被异常值和分布形状影响。若第一名只比第二名略好，排名仍给出明确次序；若某个数值极端，z-score 可能让它主导总分。<\/p>\n<p>选择方法应与数据质量和组合用途匹配，并在异常处理后再比较样本外结果。<\/p>\n<h2>动态权重很容易追逐过去<\/h2>\n<p>按最近 IC 或回归系数提高某因子权重，看似适应市场，实际上可能在因子刚表现好后追高、刚回撤后减仓。估计窗口越短，权重越不稳定、换手越高。<\/p>\n<p>动态方法必须与等权基线比较，并限制权重变化、加入交易成本和真正滚动样本外评估。<\/p>\n<h2>合成完成后仍要经过组合层<\/h2>\n<p>综合得分只说明相对偏好，最终权重还受行业、风格、个股、流动性和换手约束。优化器可能为了满足约束扭曲原始信号，因此要报告因子分数与实际持仓暴露之间的差距，以及每个因子的边际风险和收益贡献。<\/p>\n<h2>因子研究卡：定义、检验与组合<\/h2>\n<p>研究“多因子合成方法：排序打分、等权还是优化？”时，先把经济直觉、因子定义与组合实现分开。下面的流程可防止一个看似漂亮的排序结果被行业、规模或数据口径误导。<\/p>\n<ol>\n<li>明确因子值、方向、截面范围、调仓频率和未来收益窗口。<\/li>\n<li>按决策时点对齐数据，处理极值、缺失，并说明标准化与中性化方法。<\/li>\n<li>同时查看 IC、Rank IC、分组单调性、换手率、成本后收益和不同市场阶段。<\/li>\n<li>将因子加入已有组合，检查边际贡献、相关性、风险暴露与容量，而不是只看单因子回测。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/data_library.html\">Kenneth French Data Library<\/a>：因子定义、组合构造与可复核数据。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.aqr.com/Insights/Datasets/An-Academic-Quality-Data-Library-for-Practitioners\">AQR Academic Data Library<\/a>：价值、动量、低 Beta 与趋势等论文配套数据。<\/li>\n<li><strong>适用条件与边界<\/strong>：因子定义、股票池、滞后规则、中性化和再平衡不同会产生不同结果；历史溢价不是保证。<\/li>\n<li><strong>主要失败模式<\/strong>：同义因子重复计权、对全样本调参、忽略拥挤和容量，或把风格暴露误认作 Alpha。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>因子定义随结果不断调整；应先冻结定义，再保留真正独立的样本外区间。<\/li>\n<li>忽略行业、规模或风格暴露；超额收益可能只是已知风险因子的替身。<\/li>\n<li>只看多空组合收益；实际多头组合还受基准、约束、换手和可交易性影响。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>因子方向、频率和未来收益窗口无歧义<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>数据按当时可得口径对齐<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>单调性、稳定性、换手和成本均已报告<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>与已有因子及风险暴露完成增量比较<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>排序、标准分和优化具有不同复杂度。<\/li>\n<li>因子方向、异常、行业和相关性必须先处理。<\/li>\n<li>等权基线常比精确历史最优更稳健。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>选择价值、质量和动量各一项，分别用排名等权与 IC 加权合成，比较样本外。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第063讲 Barra风险模型初探：看清组合里隐藏的风险暴露<\/strong>。<\/p>"}, {"n": 63, "title": "Barra风险模型初探：看清组合里隐藏的风险暴露", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。因子历史表现不代表未来收益。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解 Barra 类风险模型的因子分解。<\/li>\n<li>区分因子风险和特异风险。<\/li>\n<li>将风险模型用于归因、约束与压力测试。<\/li>\n<\/ul>\n<h2>风险模型在看什么<\/h2>\n<p>组合收益可分解为国家、行业、风格因子与个股特异部分。协方差近似写为：<\/p>\n<p>[\n\\Sigma=XFX'+D\n]<\/p>\n<p>(X) 是资产因子暴露，(F) 是因子协方差，(D) 是特异风险。<\/p>\n<h2>常见风格暴露<\/h2>\n<p>规模、价值、动量、波动、流动性、杠杆和成长等。每个模型的定义与估计方式不同，“Barra”更像一类工程框架而非唯一公式。<\/p>\n<h2>三个用途<\/h2>\n<ul>\n<li><strong>风险预测<\/strong>：估计组合波动和风险贡献。<\/li>\n<li><strong>组合约束<\/strong>：控制行业或风格偏离。<\/li>\n<li><strong>绩效归因<\/strong>：解释收益来自哪些暴露与个股选择。<\/li>\n<\/ul>\n<h2>隐藏风险<\/h2>\n<p>一个看似分散的百股组合，可能集中于小盘、成长或同一行业。风险模型能把证券数量背后的共同驱动显性化。<\/p>\n<h2>局限<\/h2>\n<p>暴露和协方差都会变化，极端期线性模型可能低估关联；新股和特殊资产的特异风险也难估。需要滚动校准与压力情景补充。<\/p>\n<h2>一百只股票也可能只有三种风险<\/h2>\n<p>证券数量很多，不代表风险来源很多。若持仓集中在小盘成长和同一行业，组合损益可能主要由市场、行业与风格三个共同因子驱动。风险模型把每只股票的暴露映射到共同因子，再把剩余部分视为特异风险。<\/p>\n<p>这能解释为什么表面分散的组合会在某类行情中同步下跌。<\/p>\n<h2>从权重到风险贡献<\/h2>\n<p>最大权重股票不一定是最大风险贡献者。高波动、与其他持仓高度相关或因子暴露集中的资产，即使权重较小，也可能贡献大量风险。组合管理应同时查看权重、边际风险贡献和压力损失。<\/p>\n<h2>归因、预测和约束不能混为一谈<\/h2>\n<p>风险预测估计未来波动，绩效归因解释已发生收益，组合约束限制不希望承担的暴露。三者可共享因子框架，但使用的数据窗口和评价标准不同。用一张事后归因表证明风险预测准确，属于任务混淆。<\/p>\n<h2>风险模型会在哪里失效<\/h2>\n<p>因子暴露、协方差和特异波动都在变化；极端期相关性可能上升，线性模型又难描述跳空和流动性冻结。新股、停牌与特殊资产的估计也更不稳定。因此模型输出必须配合情景压力、集中度和流动性检查。<\/p>\n<p>模型不是风险真相，而是一张可更新的压缩地图。监控重点应包括预测误差、暴露漂移和未解释损益。<\/p>\n<h2>因子研究卡：定义、检验与组合<\/h2>\n<p>研究“Barra风险模型初探：看清组合里隐藏的风险暴露”时，先把经济直觉、因子定义与组合实现分开。下面的流程可防止一个看似漂亮的排序结果被行业、规模或数据口径误导。<\/p>\n<ol>\n<li>明确因子值、方向、截面范围、调仓频率和未来收益窗口。<\/li>\n<li>按决策时点对齐数据，处理极值、缺失，并说明标准化与中性化方法。<\/li>\n<li>同时查看 IC、Rank IC、分组单调性、换手率、成本后收益和不同市场阶段。<\/li>\n<li>将因子加入已有组合，检查边际贡献、相关性、风险暴露与容量，而不是只看单因子回测。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.msci.com/data-and-analytics/factor-investing/equity-factor-models\">MSCI Equity Factor Models<\/a>：Barra 风险分解的应用边界。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/data_library.html\">Kenneth French Data Library<\/a>：因子定义、组合构造与可复核数据。<\/li>\n<li><strong>适用条件与边界<\/strong>：因子定义、股票池、滞后规则、中性化和再平衡不同会产生不同结果；历史溢价不是保证。<\/li>\n<li><strong>主要失败模式<\/strong>：同义因子重复计权、对全样本调参、忽略拥挤和容量，或把风格暴露误认作 Alpha。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>因子定义随结果不断调整；应先冻结定义，再保留真正独立的样本外区间。<\/li>\n<li>忽略行业、规模或风格暴露；超额收益可能只是已知风险因子的替身。<\/li>\n<li>只看多空组合收益；实际多头组合还受基准、约束、换手和可交易性影响。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>因子方向、频率和未来收益窗口无歧义<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>数据按当时可得口径对齐<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>单调性、稳定性、换手和成本均已报告<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>与已有因子及风险暴露完成增量比较<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>风险模型把协方差压缩为因子与特异风险。<\/li>\n<li>它用于预测、约束和归因，而非直接寻找 Alpha。<\/li>\n<li>因子定义、时变关系和尾部必须持续监控。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为一个股票组合计算行业和风格暴露，找出前三大风险贡献，而不是只列前三大权重。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第064讲 什么是回测？用历史数据拍一部策略电影<\/strong>。<\/p>"}]}, {"no": 6, "name": "铁砧·回测与评估", "desc": "教你如何验证一个策略是否真的有效，避开最常见的陷阱。", "chapters": [{"n": 64, "title": "什么是回测？用历史数据拍一部策略电影", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。回测不能保证未来表现。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解回测是历史条件下的决策模拟。<\/li>\n<li>掌握事件、状态和账本三类核心对象。<\/li>\n<li>区分研究回测与真实可交易结果。<\/li>\n<\/ul>\n<h2>回测像给策略拍电影<\/h2>\n<p>回测按时间顺序播放历史数据，让策略在每个时点只能看到当时信息，生成订单、模拟成交并更新账户。它不是把最终买卖点画到价格图上。<\/p>\n<h2>三个核心对象<\/h2>\n<ul>\n<li><strong>事件<\/strong>：行情到达、信号产生、订单提交、成交和公司行动。<\/li>\n<li><strong>状态<\/strong>：现金、持仓、未成交订单、风险暴露和当前参数。<\/li>\n<li><strong>账本<\/strong>：每笔现金流、交易成本、持仓市值与净值。<\/li>\n<\/ul>\n<p>只有账本守恒，绩效才可信。<\/p>\n<h2>两种框架<\/h2>\n<p>向量化回测适合低频、规则简单的横截面研究，计算快；事件驱动回测更适合订单、盘中路径和复杂状态，但实现更难。选择取决于策略，不是越复杂越好。<\/p>\n<h2>真实性阶梯<\/h2>\n<p>先验证信号方向，再加入调仓、手续费、滑点、成交限制、公司行动、借券和容量。每增加一层现实，结果通常更差，却更有决策价值。<\/p>\n<h2>回测能回答什么<\/h2>\n<p>它能检验规则在已知历史中的行为、风险和环境依赖，不能证明未来重复。好的回测是排除坏想法的过滤器，不是收益认证书。<\/p>\n<h2>一帧回测究竟发生了什么<\/h2>\n<p>把回测想成按时间播放的电影。每推进一帧，系统都要完成一条不能倒放的因果链：<\/p>\n<ol>\n<li><strong>市场事件到达<\/strong>：新行情、公告或公司行动进入系统。<\/li>\n<li><strong>策略读取信息<\/strong>：只能读取决策时点已经可得的数据。<\/li>\n<li><strong>策略生成目标<\/strong>：例如把某只股票的目标权重从 0% 调到 5%。<\/li>\n<li><strong>订单模块下单<\/strong>：把目标差额翻译成股数、价格类型和有效期。<\/li>\n<li><strong>撮合模块成交<\/strong>：依据下一时点的价格、成交量和交易限制决定成交多少。<\/li>\n<li><strong>账本更新<\/strong>：同步修改现金、持仓成本、应计费用、未成交订单与净值。<\/li>\n<\/ol>\n<p>其中任何一步含糊，净值曲线就无法解释。尤其要区分“目标持仓”“已提交订单”和“实际持仓”：信号正确不等于订单成交，订单成交也不等于净收益为正。<\/p>\n<h2>用守恒关系检查账本<\/h2>\n<p>最基本的账户关系是：<\/p>\n<blockquote>\n<p>期末净值 = 现金 + 持仓市值 + 其他应收应付<\/p>\n<\/blockquote>\n<p>交易本身只是把现金换成证券，不应凭空创造利润；佣金、税费、融资利息和滑点才会减少净值。可以为每个交易日保存一张核对表：期初净值、市场损益、现金流、交易费用和期末净值必须能够勾稽。若它们对不上，先修账本，不要分析夏普比率。<\/p>\n<h2>教学案例：同一信号，三条不同净值<\/h2>\n<p>假设策略在周五收盘后发现某股票满足买入条件，计划下一个交易日买入。可以设计三层回测：<\/p>\n<ul>\n<li><strong>信号层<\/strong>：直接把周五收盘后的收益归给策略，只检验预测方向。<\/li>\n<li><strong>可交易层<\/strong>：周一开盘提交订单，并计入佣金、印花税和滑点。<\/li>\n<li><strong>容量层<\/strong>：限制订单不超过市场成交量的一定比例，未成交部分继续排队或取消。<\/li>\n<\/ul>\n<p>三条曲线的差异分别回答“信号是否存在”“信号能否交易”和“资金放大后还能否交易”。如果只展示第一条曲线，就把研究假设误写成了可实现业绩。<\/p>\n<h2>回测的能力边界<\/h2>\n<p>回测是历史重放，不是平行宇宙。它无法观察策略当年真实下单后对市场造成的冲击，也无法穷尽未来制度、参与者和流动性的变化。它最有价值的用途是暴露策略在已知坏环境中的反应，并形成可以被复核的证据链。<\/p>\n<h2>回测审计：让好结果经得起追问<\/h2>\n<p>用“什么是回测？用历史数据拍一部策略电影”做一次回测审计。审计目标不是让收益率更高，而是确认历史模拟没有偷看未来、遗漏成本或把调参结果当成独立证据。<\/p>\n<ol>\n<li>画出数据、信号、订单、成交、持仓和收益记账的时间线。<\/li>\n<li>核对股票池、公司行动、退市样本、停牌涨跌停和成交量约束。<\/li>\n<li>把开发、验证和最终测试分开，并记录每次参数与规则变更。<\/li>\n<li>报告基准、成本后收益、回撤、换手、暴露、容量和稳健性，而不只报告年化收益率。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://papers.ssrn.com/sol3/papers.cfm?abstract_id=2326253\">Bailey 等：The Probability of Backtest Overfitting<\/a>：多重试验与回测过拟合的量化框架。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://scikit-learn.org/stable/modules/generated/sklearn.model_selection.TimeSeriesSplit.html\">scikit-learn：TimeSeriesSplit<\/a>：保持时间顺序的验证切分。<\/li>\n<li><strong>适用条件与边界<\/strong>：回测只检验指定数据、规则和成交模型；反复查看测试集会把它变成训练集。<\/li>\n<li><strong>主要失败模式<\/strong>：前视、幸存者偏差、多重试验、理想成交与选择性报告共同制造虚假确定性。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>反复查看测试集后仍称其为样本外；测试集一旦参与决策就已被污染。<\/li>\n<li>用理想价格和无限流动性成交；应建立可解释且偏保守的成交模型。<\/li>\n<li>只选择表现最好的区间、品种或参数；应披露完整实验空间和失败结果。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>时间线不存在未来信息或同价成交错误<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>股票池与公司行动采用历史时点口径<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>样本外区间未参与规则选择<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>成本、容量、暴露与压力测试结果齐全<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>回测必须按时间推进并维护真实状态与账本。<\/li>\n<li>向量化和事件驱动适合不同问题。<\/li>\n<li>回测用于理解与证伪，不用于证明未来收益。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>画出一次“收盘生成信号、次日开盘成交”的事件顺序，并标记每一步可用信息。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第065讲 回测平台怎么选？云端平台与 Backtrader 如何取舍<\/strong>。<\/p>"}, {"n": 65, "title": "回测平台怎么选？云端平台与 Backtrader 如何取舍", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。回测不能保证未来表现。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>按数据、框架、部署和可控性选择平台。<\/li>\n<li>理解云平台与本地框架的取舍。<\/li>\n<li>建立可迁移、可复现的研究流程。<\/li>\n<\/ul>\n<h2>先问需求，再选工具<\/h2>\n<p>平台选择不应只看示例代码是否短。先明确市场、频率、数据权限、撮合复杂度、团队技术能力、预算、部署方式和合规要求。<\/p>\n<h2>三类定位<\/h2>\n<table>\n<thead>\n<tr>\n<th>工具<\/th>\n<th>典型优势<\/th>\n<th>主要取舍<\/th>\n<th>更适合<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>云端一体化平台<\/td>\n<td>集成数据、研究、回测与模拟交易流程，上手较快<\/td>\n<td>数据与运行环境受平台口径约束<\/td>\n<td>初学、教学与快速验证低中频策略<\/td>\n<\/tr>\n<tr>\n<td>云端研究与本地 SDK 组合<\/td>\n<td>兼顾在线研究、数据 API 与本地工具链<\/td>\n<td>部分能力和数据涉及授权与环境配置<\/td>\n<td>需要专业数据、因子或本地 SDK 的研究<\/td>\n<\/tr>\n<tr>\n<td>Backtrader<\/td>\n<td>本地 Python 事件驱动、可扩展数据与策略组件<\/td>\n<td>数据、交易日历、质量和部署需自行负责<\/td>\n<td>需要代码控制、定制撮合与私有数据<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>功能与授权会更新，选择云端平台时应直接核对其当前数据口径、授权范围和运行限制；本地框架的具体行为可参考 <a target=\"_blank\" rel=\"noopener\" href=\"https://www.backtrader.com/docu/\">Backtrader 官方文档<\/a>。<\/p>\n<h2>六项选择标准<\/h2>\n<ol>\n<li>数据是否覆盖目标市场并提供历史时点口径。<\/li>\n<li>撮合是否支持你的订单、涨跌停、停牌与显性交易费用。<\/li>\n<li>研究能否导出数据、代码、日志和环境版本。<\/li>\n<li>是否支持模拟或实盘交易接口及异常恢复。<\/li>\n<li>批量实验速度与调试体验是否满足团队。<\/li>\n<li>平台费用、许可、隐私和供应商锁定是否可接受。<\/li>\n<\/ol>\n<h2>推荐路径<\/h2>\n<p>新手可先用云平台验证逻辑，再用最小独立数据复现关键结果；工程需求较高时转本地框架。无论平台，策略逻辑、数据版本和测试都应由自己掌握。<\/p>\n<h2>不要迷信结果一致<\/h2>\n<p>同一代码在不同平台可能因复权、交易日历、显性交易费用、成交价和停牌处理产生差异。迁移时应先对齐一段小样本的输入、订单和净值。<\/p>\n<h2>平台其实是一份“可执行规则书”<\/h2>\n<p>平台不仅负责运行代码，还替你定义了大量默认规则：某根 K 线何时可见、复权因子怎样应用、停牌订单是否保留、涨跌停能否成交、现金何时扣除、分红何时到账。两套平台即使收到同一信号，也可能因为规则书不同而产生不同持仓。<\/p>\n<p>因此，评估平台不能只问“支持哪些 API”，还要问三个更底层的问题：<\/p>\n<ul>\n<li><strong>数据语义是否清楚<\/strong>：每个字段的时间、单位、复权和修订规则能否追溯？<\/li>\n<li><strong>执行语义是否清楚<\/strong>：订单在何时进入撮合，成交量和价格怎样决定？<\/li>\n<li><strong>结果是否可导出<\/strong>：能否拿到逐笔订单、成交、现金和持仓日志进行独立复核？<\/li>\n<\/ul>\n<h2>建立最小迁移合约<\/h2>\n<p>准备一段很短、但包含分红、停牌、涨跌停和调仓的固定样本，预先写出期望结果：每个时点可见的数据、目标仓位、订单、成交和期末账本。然后让候选平台运行同一策略，逐层比对。<\/p>\n<p>比对顺序应从输入向输出推进：<\/p>\n<ol>\n<li>交易日和原始价格是否一致。<\/li>\n<li>复权、公司行动和证券状态是否一致。<\/li>\n<li>信号与目标仓位是否一致。<\/li>\n<li>订单提交时间、成交数量和成交价格是否一致。<\/li>\n<li>费用、现金、持仓成本和净值是否一致。<\/li>\n<\/ol>\n<p>只比较最终收益率无法定位问题；逐层对账才能判断差异来自数据、策略还是撮合。<\/p>\n<h2>隐藏默认值清单<\/h2>\n<p>迁移前应把以下设置显式写入研究配置：交易日历、时区、复权方式、基准、佣金最低收费、税费、滑点、成交量上限、零股处理、停牌与退市处理、未成交订单有效期、现金利息、融资融券成本以及价格精度。凡是没有写出来的默认值，未来都可能变成不可复现的变化源。<\/p>\n<h2>如何做选择，而不是做排名<\/h2>\n<p>先列出“必须满足”和“可以妥协”两张表，再用真实策略的最小样本验证。教学和快速原型可优先考虑数据完整、上手快；需要特殊撮合、私有数据或生产部署时，可控性与日志能力更重要。不存在脱离策略需求的最佳平台，只有证据更充分的选择。<\/p>\n<h2>回测审计：让好结果经得起追问<\/h2>\n<p>用“回测平台怎么选？云端平台与 Backtrader 如何取舍”做一次回测审计。审计目标不是让收益率更高，而是确认历史模拟没有偷看未来、遗漏成本或把调参结果当成独立证据。<\/p>\n<ol>\n<li>画出数据、信号、订单、成交、持仓和收益记账的时间线。<\/li>\n<li>核对股票池、公司行动、退市样本、停牌涨跌停和成交量约束。<\/li>\n<li>把开发、验证和最终测试分开，并记录每次参数与规则变更。<\/li>\n<li>报告基准、成本后收益、回撤、换手、暴露、容量和稳健性，而不只报告年化收益率。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.backtrader.com/docu/\">Backtrader 官方文档<\/a>：事件驱动回测框架的行为定义。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://scikit-learn.org/stable/common_pitfalls.html\">scikit-learn：Common pitfalls<\/a>：数据泄漏与训练、测试隔离。<\/li>\n<li><strong>适用条件与边界<\/strong>：回测只检验指定数据、规则和成交模型；反复查看测试集会把它变成训练集。<\/li>\n<li><strong>主要失败模式<\/strong>：前视、幸存者偏差、多重试验、理想成交与选择性报告共同制造虚假确定性。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>反复查看测试集后仍称其为样本外；测试集一旦参与决策就已被污染。<\/li>\n<li>用理想价格和无限流动性成交；应建立可解释且偏保守的成交模型。<\/li>\n<li>只选择表现最好的区间、品种或参数；应披露完整实验空间和失败结果。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>时间线不存在未来信息或同价成交错误<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>股票池与公司行动采用历史时点口径<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>样本外区间未参与规则选择<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>成本、容量、暴露与压力测试结果齐全<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>平台要根据市场、数据、撮合、部署和可控性选择。<\/li>\n<li>云平台降低门槛，本地框架提高控制但增加工程责任。<\/li>\n<li>跨平台结果必须逐层对齐，不能只看最终收益。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>用六项标准给自己的策略制作平台评分表，并选一个月小样本做跨平台净值核对。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第066讲 回测绩效指标大全：除了收益率还要看什么？<\/strong>。<\/p>"}, {"n": 66, "title": "回测绩效指标大全：除了收益率还要看什么？", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。回测不能保证未来表现。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>建立收益、风险、效率和交易四类指标体系。<\/li>\n<li>理解指标之间的重复与冲突。<\/li>\n<li>用基准和环境拆分策略表现。<\/li>\n<\/ul>\n<h2>收益类<\/h2>\n<p>累计收益率、几何年化、月度胜率和超额收益描述不同问题。绝对收益高可能只是高 Beta；应同时报告相对基准与无风险资产的结果。<\/p>\n<h2>风险类<\/h2>\n<p>年化波动率、最大回撤、回撤持续期、下行波动、VaR/CVaR、偏度与最差单期。没有一个指标能覆盖全部风险。<\/p>\n<h2>风险调整类<\/h2>\n<p>夏普比率使用总波动，Sortino 关注下行波动，Calmar 用年化收益率除以最大回撤，信息比率比较主动收益与跟踪误差。分母不同，排序可能不同。<\/p>\n<h2>交易与容量<\/h2>\n<p>换手率、交易次数、平均持有期、胜率、盈亏比、交易成本占毛收益、市场冲击成本和资金容量。交易成本前优秀、交易成本后消失的策略没有实盘交易价值。<\/p>\n<h2>稳定性<\/h2>\n<p>按年份、市场状态、资产和参数切片，观察收益是否集中。还要做收益归因，区分市场、行业、风格和个股选择。<\/p>\n<h2>报告模板<\/h2>\n<p>至少同时给出净值、回撤、月度收益、关键指标、成本、持仓与暴露。指标表是摘要，不能替代路径图和交易明细。<\/p>\n<h2>从决策问题反推指标<\/h2>\n<p>指标不是越多越专业。先明确报告要支持哪项决策，再选择互补的观测量：<\/p>\n<table>\n<thead>\n<tr>\n<th>决策问题<\/th>\n<th>主要指标<\/th>\n<th>必须配套观察<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>是否存在收益优势<\/td>\n<td>年化收益、超额收益<\/td>\n<td>基准、置信区间、收益来源<\/td>\n<\/tr>\n<tr>\n<td>风险是否可承受<\/td>\n<td>最大回撤、回撤持续期、波动率<\/td>\n<td>最差月份、尾部损失、恢复路径<\/td>\n<\/tr>\n<tr>\n<td>单位风险是否划算<\/td>\n<td>夏普、Sortino、Calmar、信息比率<\/td>\n<td>指标假设、样本长度、分母稳定性<\/td>\n<\/tr>\n<tr>\n<td>收益能否交易出来<\/td>\n<td>换手、成本占毛收益、成交量占比<\/td>\n<td>滑点压力、容量、未成交比例<\/td>\n<\/tr>\n<tr>\n<td>优势是否稳定<\/td>\n<td>分年度和状态表现、滚动指标<\/td>\n<td>交易数、暴露、收益集中度<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>这张表的意义是防止一个数字同时承担过多解释。例如夏普比率较高，既不能说明最大回撤较小，也不能说明资金规模扩大后仍可成交。<\/p>\n<h2>教学案例：相同年化，不同命运<\/h2>\n<p>假设策略甲和乙最终都实现相同年化收益。甲的收益较均匀，但每年交易很多、成本敏感；乙大部分时间平淡，利润集中在少数危机月份。只看年化会认为二者等价，加入回撤、成本占比、月度分布和收益集中度后，才会发现它们需要完全不同的风险预算和持有耐心。<\/p>\n<p>因此，绩效评价要同时看三个维度：<strong>终点<\/strong>告诉你赚了多少，<strong>路径<\/strong>告诉你如何到达，<strong>可实现性<\/strong>告诉你能否把纸面收益带到实盘。<\/p>\n<h2>毛收益、净收益与归因<\/h2>\n<p>每份报告至少保留三层结果：信号产生的毛收益、扣除交易成本后的净收益、扣除融资和运营约束后的可实现收益。随后再回答净收益来自哪里：市场方向、行业与风格暴露、证券选择，还是偶然集中在少数日期。<\/p>\n<p>若一个“选股策略”的收益主要来自长期高 Beta，真正被验证的是市场暴露，不是选股能力。归因不是为了让报告复杂，而是防止给收益贴错标签。<\/p>\n<h2>报告不确定性，而非伪精确<\/h2>\n<p>历史样本有限且收益常有自相关、厚尾和状态切换。不要把 1.37 与 1.42 的夏普差异解释成确定排名。更稳妥的做法是报告滚动区间、分时期分布、交易数量和关键假设下的敏感性，并把指标小数位控制在决策真正需要的精度。<\/p>\n<h2>回测审计：让好结果经得起追问<\/h2>\n<p>用“回测绩效指标大全：除了收益率还要看什么？”做一次回测审计。审计目标不是让收益率更高，而是确认历史模拟没有偷看未来、遗漏成本或把调参结果当成独立证据。<\/p>\n<ol>\n<li>画出数据、信号、订单、成交、持仓和收益记账的时间线。<\/li>\n<li>核对股票池、公司行动、退市样本、停牌涨跌停和成交量约束。<\/li>\n<li>把开发、验证和最终测试分开，并记录每次参数与规则变更。<\/li>\n<li>报告基准、成本后收益、回撤、换手、暴露、容量和稳健性，而不只报告年化收益率。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://web.stanford.edu/~wfsharpe/art/sr/sr.htm\">William Sharpe：The Sharpe Ratio<\/a>：夏普比率的定义、版本差异与适用限制。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nist.gov/programs-projects/nistsematech-engineering-statistics-handbook\">NIST/SEMATECH 统计方法手册<\/a>：统计方法、假设与诊断的官方参考。<\/li>\n<li><strong>适用条件与边界<\/strong>：回测只检验指定数据、规则和成交模型；反复查看测试集会把它变成训练集。<\/li>\n<li><strong>主要失败模式<\/strong>：前视、幸存者偏差、多重试验、理想成交与选择性报告共同制造虚假确定性。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>反复查看测试集后仍称其为样本外；测试集一旦参与决策就已被污染。<\/li>\n<li>用理想价格和无限流动性成交；应建立可解释且偏保守的成交模型。<\/li>\n<li>只选择表现最好的区间、品种或参数；应披露完整实验空间和失败结果。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>时间线不存在未来信息或同价成交错误<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>股票池与公司行动采用历史时点口径<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>样本外区间未参与规则选择<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>成本、容量、暴露与压力测试结果齐全<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>绩效应覆盖收益、风险、风险调整、交易和稳定性。<\/li>\n<li>不同指标回答不同问题，不能只挑最好看的一个。<\/li>\n<li>基准、成本与归因决定收益含义。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为一个回测制作一页报告，限制在十项指标，并解释每项帮助做什么决策。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第067讲 前视偏差：无意间偷看未来的致命失误<\/strong>。<\/p>"}, {"n": 67, "title": "前视偏差：无意间偷看未来的致命失误", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。回测不能保证未来表现。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>识别显式与隐式前视偏差。<\/li>\n<li>正确处理信号、数据发布和成交时点。<\/li>\n<li>为回测建立自动防泄漏测试。<\/li>\n<\/ul>\n<h2>什么是前视<\/h2>\n<p>前视偏差是策略在历史时点使用了当时尚不可得的信息。它可能很明显，也可能藏在数据处理和库函数中。<\/p>\n<h2>常见来源<\/h2>\n<ul>\n<li>用当日收盘生成信号并按同一收盘成交。<\/li>\n<li>财报按报告期而非公告时间进入。<\/li>\n<li>使用全样本均值、标准差或主成分处理早期数据。<\/li>\n<li>用未来最高最低决定当前标签或止损成交。<\/li>\n<li>历史成分表实际上来自今天。<\/li>\n<\/ul>\n<h2>正确时间轴<\/h2>\n<p>每个字段应同时有“事件发生时间”和“系统可获取时间”。信号只读取获取时间不晚于决策时点的数据，订单再在下一合法时点成交。<\/p>\n<h2>工程防线<\/h2>\n<p>采用时间感知查询、滚动拟合、训练与回测分离、对数据做 as-of join，并在逐日循环中断言不能访问未来索引。<\/p>\n<h2>反常识测试<\/h2>\n<p>将所有信号整体滞后一日，结果若断崖式恶化，应重点检查时点；把未来数据置空后，早期结果不应改变。前视偏差常让策略好得不真实。<\/p>\n<h2>四个时间戳，缺一不可<\/h2>\n<p>对每条信息都问四个问题：<\/p>\n<ol>\n<li><strong>事件时间<\/strong>：经济事实何时发生，例如一个季度何时结束。<\/li>\n<li><strong>发布时间<\/strong>：公司或机构何时正式对外披露。<\/li>\n<li><strong>可用时间<\/strong>：数据供应商何时把信息送达研究系统。<\/li>\n<li><strong>可交易时间<\/strong>：策略最早能在何时据此提交并成交。<\/li>\n<\/ol>\n<p>回测应按可用时间连接数据，并按可交易时间记入持仓。报告期只是信息描述哪个时期，并不代表投资者当时已经知道结果。<\/p>\n<h2>教学案例：收盘信号不能在同一收盘成交<\/h2>\n<p>若信号需要当天完整收盘价，只有收盘形成后才能确定信号。此时再假设按当天收盘价完成交易，就把“观察结果”和“执行动作”压在同一时点，形成无法实现的同价成交。合理做法是使用下一可交易时点，或明确采用能够在收盘前计算的信号与真实可执行的收盘订单机制。<\/p>\n<p>这个错误危险之处在于代码通常能正常运行，曲线甚至会很漂亮。防线不是肉眼看代码，而是为每类数据和订单写出时间契约。<\/p>\n<h2>预处理也会泄漏<\/h2>\n<p>全样本标准化、用全期中位数填充缺失、在全样本上选择特征或主成分，都会让早期样本间接知道未来分布。正确流程是在每个训练窗口内拟合转换器，再把该转换器应用到随后验证期；进入下一个窗口后重新拟合。<\/p>\n<p>同样，先看完整历史再删除“异常证券”也可能泄漏，因为异常判定本身使用了未来结果。任何会从数据中学习参数的步骤，都应和模型一起纳入时间切分。<\/p>\n<h2>两个自动化反泄漏测试<\/h2>\n<ul>\n<li><strong>截断测试<\/strong>：只保留某日之前的数据，重新计算此前全部信号；历史输出不应因未来被删除而变化。<\/li>\n<li><strong>未来扰动测试<\/strong>：随机打乱或替换某日之后的数据；该日之前的特征、订单和账本必须完全不变。<\/li>\n<\/ul>\n<p>测试失败时，不应只给信号整体滞后一日掩盖问题，而要追踪数据查询、预处理、标签构造和撮合的第一处越界访问。<\/p>\n<h2>回测审计：让好结果经得起追问<\/h2>\n<p>用“前视偏差：无意间偷看未来的致命失误”做一次回测审计。审计目标不是让收益率更高，而是确认历史模拟没有偷看未来、遗漏成本或把调参结果当成独立证据。<\/p>\n<ol>\n<li>画出数据、信号、订单、成交、持仓和收益记账的时间线。<\/li>\n<li>核对股票池、公司行动、退市样本、停牌涨跌停和成交量约束。<\/li>\n<li>把开发、验证和最终测试分开，并记录每次参数与规则变更。<\/li>\n<li>报告基准、成本后收益、回撤、换手、暴露、容量和稳健性，而不只报告年化收益率。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://papers.ssrn.com/sol3/papers.cfm?abstract_id=2326253\">Bailey 等：The Probability of Backtest Overfitting<\/a>：多重试验与回测过拟合的量化框架。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://scikit-learn.org/stable/modules/generated/sklearn.model_selection.TimeSeriesSplit.html\">scikit-learn：TimeSeriesSplit<\/a>：保持时间顺序的验证切分。<\/li>\n<li><strong>适用条件与边界<\/strong>：回测只检验指定数据、规则和成交模型；反复查看测试集会把它变成训练集。<\/li>\n<li><strong>主要失败模式<\/strong>：前视、幸存者偏差、多重试验、理想成交与选择性报告共同制造虚假确定性。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>反复查看测试集后仍称其为样本外；测试集一旦参与决策就已被污染。<\/li>\n<li>用理想价格和无限流动性成交；应建立可解释且偏保守的成交模型。<\/li>\n<li>只选择表现最好的区间、品种或参数；应披露完整实验空间和失败结果。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>时间线不存在未来信息或同价成交错误<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>股票池与公司行动采用历史时点口径<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>样本外区间未参与规则选择<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>成本、容量、暴露与压力测试结果齐全<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>前视偏差可来自信号、预处理、成分和成交。<\/li>\n<li>事件时间与可获取时间必须分离。<\/li>\n<li>滞后与未来置空测试能发现部分泄漏。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为一条财务因子画出报告期、公告日、数据入库和首次可交易四个时间点。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第068讲 幸存者偏差（回测篇）：你引以为豪的收益可能根本不存在<\/strong>。<\/p>"}, {"n": 68, "title": "幸存者偏差（回测篇）：你引以为豪的收益可能根本不存在", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。回测不能保证未来表现。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>把幸存者偏差落实到回测工程。<\/li>\n<li>正确生成历史股票池和基金池。<\/li>\n<li>量化偏差对收益与回撤的影响。<\/li>\n<\/ul>\n<h2>回测中的隐形删选<\/h2>\n<p>若数据库只保留当前证券，失败者从历史中消失，策略像参加一场提前淘汰弱者的比赛。指数成分、基金样本和策略库都存在同类问题。<\/p>\n<h2>时点化宇宙<\/h2>\n<p>在每个调仓日，根据上市、退市、交易状态、历史成分和当时可得基本面生成股票池。筛选规则本身也必须时点化。<\/p>\n<h2>退市与缺失收益<\/h2>\n<p>不能把最后价格后直接停止记账。应处理退市结算、换股、破产和无法成交；信息不足时使用保守假设，并报告敏感性。<\/p>\n<h2>量化影响<\/h2>\n<p>做两次回测：当前存续池与完整历史池。比较年化、最大回撤、持仓数量和最差证券。差异本身就是偏差估计。<\/p>\n<h2>供应商问答<\/h2>\n<p>询问是否含退市代码、历史成分、失效基金、代码变更和公司行动版本。没有明确答案就不能默认无偏。<\/p>\n<h2>教学案例：拿今天的名单回到十年前<\/h2>\n<p>假设研究者用今天仍在某指数中的成分股，回测十年前的选股策略。这个名单已经隐含了十年后的答案：经营失败、被并购或退市的证券大多不在其中。策略面对的是一群“已知能活到今天”的公司，风险被事后删除，收益和回撤都会被美化。<\/p>\n<p>正确的问题不是“今天的成分股过去表现如何”，而是“在每个历史调仓日，当时被允许投资的证券有哪些”。两者看似只差一张名单，实质上分别是事后筛选和可执行决策。<\/p>\n<h2>历史股票池的生成顺序<\/h2>\n<p>每个调仓日可按以下顺序生成投资宇宙：<\/p>\n<ol>\n<li>从当时已上市且尚未退市的证券开始。<\/li>\n<li>应用当时有效的指数成分或市场范围。<\/li>\n<li>根据当时已知的停牌、特别处理和交易资格筛选。<\/li>\n<li>使用当时可得的市值、财务和流动性数据应用策略条件。<\/li>\n<li>保存入选与排除原因，使名单可以复算。<\/li>\n<\/ol>\n<p>筛选顺序也要固定。例如先按流动性筛选再计算行业排名，与先排名再筛选可能产生不同结果；这不是实现细节，而是策略定义。<\/p>\n<h2>退市不是一行缺失值<\/h2>\n<p>持仓证券停止报价后，不能沿用最后价格到回测结束，也不能直接从组合中删除。应根据可获得资料处理退市现金对价、换股、破产损失和资金冻结期。资料不足时，可以设置多个保守情景，并披露它们对组合的影响。<\/p>\n<p>这一步往往同时改变收益、回撤和资金占用。即使最终损失相同，立即记零与长期冻结也会导致完全不同的再投资路径。<\/p>\n<h2>还有“策略幸存者偏差”<\/h2>\n<p>幸存者偏差不只存在于证券数据库。团队若只展示仍在运行的策略，而把下线模型和失败实验从记录中删除，也会高估研发成功率。实验注册表应保留所有尝试、停止原因和上线后表现，使“从很多失败者中挑出一个赢家”的选择过程可见。<\/p>\n<h2>回测审计：让好结果经得起追问<\/h2>\n<p>用“幸存者偏差（回测篇）：你引以为豪的收益可能根本不存在”做一次回测审计。审计目标不是让收益率更高，而是确认历史模拟没有偷看未来、遗漏成本或把调参结果当成独立证据。<\/p>\n<ol>\n<li>画出数据、信号、订单、成交、持仓和收益记账的时间线。<\/li>\n<li>核对股票池、公司行动、退市样本、停牌涨跌停和成交量约束。<\/li>\n<li>把开发、验证和最终测试分开，并记录每次参数与规则变更。<\/li>\n<li>报告基准、成本后收益、回撤、换手、暴露、容量和稳健性，而不只报告年化收益率。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://papers.ssrn.com/sol3/papers.cfm?abstract_id=2326253\">Bailey 等：The Probability of Backtest Overfitting<\/a>：多重试验与回测过拟合的量化框架。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://scikit-learn.org/stable/modules/generated/sklearn.model_selection.TimeSeriesSplit.html\">scikit-learn：TimeSeriesSplit<\/a>：保持时间顺序的验证切分。<\/li>\n<li><strong>适用条件与边界<\/strong>：回测只检验指定数据、规则和成交模型；反复查看测试集会把它变成训练集。<\/li>\n<li><strong>主要失败模式<\/strong>：前视、幸存者偏差、多重试验、理想成交与选择性报告共同制造虚假确定性。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>反复查看测试集后仍称其为样本外；测试集一旦参与决策就已被污染。<\/li>\n<li>用理想价格和无限流动性成交；应建立可解释且偏保守的成交模型。<\/li>\n<li>只选择表现最好的区间、品种或参数；应披露完整实验空间和失败结果。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>时间线不存在未来信息或同价成交错误<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>股票池与公司行动采用历史时点口径<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>样本外区间未参与规则选择<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>成本、容量、暴露与压力测试结果齐全<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>历史股票池必须按当时状态生成。<\/li>\n<li>退市证券需要真实或保守现金流处理。<\/li>\n<li>双版本回测可直观量化幸存者偏差。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>在同一策略上比较当前指数成分与历史成分回测，记录差异来源。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第069讲 过拟合的魔咒：参数越多，死得越快<\/strong>。<\/p>"}, {"n": 69, "title": "过拟合的魔咒：参数越多，死得越快", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。回测不能保证未来表现。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解参数、特征和策略选择的过拟合。<\/li>\n<li>识别多次试验与漂亮曲线的关系。<\/li>\n<li>用简化和预注册减少自由度。<\/li>\n<\/ul>\n<h2>过拟合是什么<\/h2>\n<p>模型把历史中的噪声当成规律，样本内表现很好，未来却失效。参数越多、试验越多、样本越短，选择到偶然赢家的概率越高。<\/p>\n<h2>过拟合不只在机器学习<\/h2>\n<p>挑均线窗口、回测起点、股票池、过滤条件和绩效指标都属于模型选择。即使最终策略只有一条规则，背后试过上千版本也可能严重过拟合。<\/p>\n<h2>典型信号<\/h2>\n<ul>\n<li>最优参数像孤立尖峰。<\/li>\n<li>小改日期或交易成本，结果大变。<\/li>\n<li>收益集中于少数交易。<\/li>\n<li>逻辑解释在看到结果后才出现。<\/li>\n<li>样本外明显低于样本内。<\/li>\n<\/ul>\n<h2>减少方法<\/h2>\n<p>先写研究假设和失败条件；保留简单基线；限制参数和试验预算；使用时间样本外、滚动验证与多市场复现；对所有试验保留日志。<\/p>\n<h2>正确目标<\/h2>\n<p>不要最大化历史指标，而要寻找在合理参数、成本和环境扰动下仍能工作的稳定区域。宁可接受较低的纸面夏普比率，也不要依赖精确巧合。<\/p>\n<h2>真正的复杂度是“选择自由度”<\/h2>\n<p>策略最后只有两个参数，不代表研究过程简单。研究者若试过几十种信号、多个市场、不同起止日期、若干成本假设，再挑最漂亮的一条曲线，已经进行了大量隐形选择。过拟合风险取决于可选择的方案数量以及选择过程是否受结果影响，而不只取决于最终代码行数。<\/p>\n<p>可以把每次“看结果后再决定下一步”都视为一次信息消费。试验越多，偶然好结果越容易出现，最终测试就越需要保持独立。<\/p>\n<h2>教学案例：孤峰与高原<\/h2>\n<p>假设均线策略在窗口 19 天表现极佳，1
