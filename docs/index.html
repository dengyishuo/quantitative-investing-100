收益。随机分割会让几乎相同的窗口分别进入训练和验证，形成极其乐观的结果。<\/p>\n<p>验证边界应至少考虑输入窗口、标签前瞻期和持有期重叠。最清楚的做法是画出每个样本使用的日期区间，再保证训练样本不会触及验证期信息。<\/p>\n<h2>有状态与无状态训练<\/h2>\n<p>无状态模式在每个独立窗口开始时重置隐藏状态，信息范围由窗口明确限定；有状态模式把状态跨批次延续，更接近连续流，但要求样本严格按时间排序，并明确资产切换、缺失时段和交易日中断时是否重置。<\/p>\n<p>若把甲资产最后状态传给乙资产，或训练时连续、推理时却频繁重置，模型行为会发生根本变化。状态管理必须成为数据协议的一部分。<\/p>\n<h2>公平比较记忆价值<\/h2>\n<p>让线性滞后模型、树模型、简单一维卷积和 LSTM 使用完全相同的 60 日输入、标签、切分和成本。再做窗口消融：只保留最近 5、20、60 日，看增量来自更长历史，还是来自模型结构。<\/p>\n<p>若 LSTM 只在训练期优于基线，或优势随随机种子消失，就不能把差异解释为“发现长期记忆”。<\/p>\n<h2>从序列预测到交易<\/h2>\n<p>推理系统要规定新数据到达、特征更新、状态更新、信号生成和订单提交的顺序。数据晚到或修订时，是否回滚状态也要明确。上线后除了预测指标，还应监控隐藏状态或输出分布、序列长度、缺失率、推理延迟与仓位换手。<\/p>\n<p>当输入分布越界或状态异常时，可降级到无状态模型、简单基线或停止新增风险，而不是让网络在未知状态继续输出。<\/p>\n<h2>机器学习实验：先守住时间边界<\/h2>\n<p>针对“LSTM：长短期记忆网络怎么对付时间序列？”建立一个时间序列机器学习实验。重点不是模型名称，而是标签、特征、切分、评价和上线监控是否与真实决策过程一致。<\/p>\n<ol>\n<li>定义预测时点、预测对象、标签窗口和可用特征截止时间。<\/li>\n<li>按时间切分训练、验证与测试数据；预处理、特征选择和调参只在允许的数据内完成。<\/li>\n<li>与朴素基线比较，并同时评价预测质量、排序质量、换手和成本后组合表现。<\/li>\n<li>上线前建立特征漂移、预测分布、暴露、延迟和模型失效监控。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://people.idsia.ch/~juergen/lstm1997-2024head.pdf\">Hochreiter 与 Schmidhuber：LSTM<\/a>：LSTM 原始论文。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://scikit-learn.org/stable/modules/generated/sklearn.model_selection.TimeSeriesSplit.html\">scikit-learn：TimeSeriesSplit<\/a>：保持时间顺序的验证切分。<\/li>\n<li><strong>适用条件与边界<\/strong>：金融数据非独立同分布且标签重叠；预测分数只有经过时间切分、成本和稳定性检验才有投资含义。<\/li>\n<li><strong>主要失败模式<\/strong>：随机切分时间序列、预处理泄漏、搜索过多超参数、忽略漂移和把可解释性当因果。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>随机打乱时间序列做交叉验证；这会把未来结构泄漏给过去。<\/li>\n<li>在全样本上标准化或筛选特征；预处理本身也必须只用训练数据拟合。<\/li>\n<li>预测误差更低就认为策略更好；投资决策还取决于排序、成本、约束和稳定性。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>标签窗口与特征截止时间无重叠泄漏<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>全部预处理封装在训练流程内<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>模型优于朴素基线且结果跨时期稳定<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>漂移、失效和回滚方案已定义<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>LSTM 通过门控状态缓解长序列训练问题。<\/li>\n<li>重叠窗口和状态重置会影响验证。<\/li>\n<li>是否有效取决于目标是否存在稳定时序依赖。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>用相同 60 日输入比较线性、树与 LSTM，并保证时间切分和特征完全一致。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第093讲 强化学习想象：让AI自己试错，学会交易<\/strong>。<\/p>"}, {"n": 93, "title": "强化学习想象：让AI自己试错，学会交易", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。机器学习模型会失效，历史预测表现不代表未来收益。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解状态、动作、奖励和策略。<\/li>\n<li>认识交易环境与真实市场的差距。<\/li>\n<li>防止奖励黑客和模拟器过拟合。<\/li>\n<\/ul>\n<h2>强化学习在学什么<\/h2>\n<p>智能体观察状态 (s)，选择动作 (a)，获得奖励 (r)，目标最大化长期累计奖励。交易动作可以是目标仓位或订单，奖励可含收益、风险和成本。<\/p>\n<h2>最大难点是环境<\/h2>\n<p>游戏规则固定，市场会因参与者和制度变化。历史回放中智能体的订单通常不会改变价格，真实大额交易却有冲击；模拟器偏差会被策略利用。<\/p>\n<h2>奖励设计<\/h2>\n<p>只奖励单期收益会鼓励高杠杆；加入波动、回撤、换手率和库存惩罚能反映约束，但权重本身又成为参数。智能体可能找到符合公式却违背投资目的的捷径。<\/p>\n<h2>离线训练<\/h2>\n<p>金融多使用历史数据的离线强化学习，无法自由探索。行为数据覆盖不足时，模型对未见动作的价值估计不可靠。<\/p>\n<h2>合理应用<\/h2>\n<p>订单执行、库存控制和有清晰状态转移的问题往往比直接预测市场更适合。上线前需要基线、压力、动作限制和安全策略。<\/p>\n<h2>把交易问题写成 MDP<\/h2>\n<p>状态可以包含价格、订单簿、库存、剩余时间和风险限额；动作可以是目标仓位、订单价格与数量；奖励可以是执行成本后的收益减去库存与风险惩罚；状态转移则描述市场和账户如何进入下一时点。任何遗漏都会改变智能体学到的任务。<\/p>\n<p>尤其要区分市场状态和智能体可观察信息。把未来成交量、完整日内高低价或事后波动放进状态，会让环境从一开始就泄漏。<\/p>\n<h2>模拟器是最容易被利用的模型<\/h2>\n<p>强化学习会主动寻找环境规则的漏洞。如果模拟器假设订单总能按中间价成交，智能体会学会频繁下单；若大单不影响市场，它会无限放大规模；若撤单没有延迟和费用，它可能通过反复试单获取不存在的优势。<\/p>\n<p>因此要对成交队列、延迟、部分成交、市场冲击、手续费、停牌和风险限制做保守建模，并用从未参与训练的真实时期检验。策略在模拟器中越聪明，越要怀疑它是否只是更擅长利用模拟误差。<\/p>\n<h2>奖励黑客的典型形式<\/h2>\n<p>只奖励收益会鼓励杠杆；只惩罚波动可能鼓励长期不交易；对未完成订单惩罚过重，可能诱使智能体在不利价格强行成交；用回撤作为稀疏惩罚，则可能让训练不稳定。<\/p>\n<p>设计奖励时先写业务目标和硬约束。不能被违反的仓位、杠杆和亏损上限应作为动作屏障或风险规则，而不是仅靠奖励扣分期望智能体自觉遵守。<\/p>\n<h2>离线强化学习的覆盖问题<\/h2>\n<p>历史数据只记录过去行为产生的状态与动作。若训练数据从未在极端波动中使用某种订单，模型就没有可靠证据评估该动作，却可能因函数外推给它很高价值。这称为分布外动作风险。<\/p>\n<p>应限制新策略靠近有数据支持的行为范围，报告动作覆盖与不确定性，并通过回放、影子模式和小规模受限试验逐步验证。不能像游戏一样任意在线探索，因为每次错误动作都是真实资金与市场影响。<\/p>\n<h2>一个更现实的上线阶梯<\/h2>\n<p>先用明确规则的执行基线建立下限；再在多个保守模拟器和未见时期验证；随后运行不下单的影子策略，对比建议动作与真实成交；通过后只开放小规模、有限动作和自动熔断；最后才根据稳定证据逐步扩大。<\/p>\n<p>每一级都应有回滚条件。若环境漂移、动作分布越界、成本恶化或安全规则频繁触发，应退回基线，而不是继续让智能体“学习适应”。<\/p>\n<h2>机器学习实验：先守住时间边界<\/h2>\n<p>针对“强化学习想象：让AI自己试错，学会交易”建立一个时间序列机器学习实验。重点不是模型名称，而是标签、特征、切分、评价和上线监控是否与真实决策过程一致。<\/p>\n<ol>\n<li>定义预测时点、预测对象、标签窗口和可用特征截止时间。<\/li>\n<li>按时间切分训练、验证与测试数据；预处理、特征选择和调参只在允许的数据内完成。<\/li>\n<li>与朴素基线比较，并同时评价预测质量、排序质量、换手和成本后组合表现。<\/li>\n<li>上线前建立特征漂移、预测分布、暴露、延迟和模型失效监控。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://doi.org/10.6028/NIST.AI.100-1\">NIST AI Risk Management Framework 1.0<\/a>：AI 系统的治理、映射、度量与管理。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://scikit-learn.org/stable/common_pitfalls.html\">scikit-learn：Common pitfalls<\/a>：数据泄漏与训练、测试隔离。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://scikit-learn.org/stable/modules/generated/sklearn.model_selection.TimeSeriesSplit.html\">scikit-learn：TimeSeriesSplit<\/a>：保持时间顺序的验证切分。<\/li>\n<li><strong>适用条件与边界<\/strong>：金融数据非独立同分布且标签重叠；预测分数只有经过时间切分、成本和稳定性检验才有投资含义。<\/li>\n<li><strong>主要失败模式<\/strong>：随机切分时间序列、预处理泄漏、搜索过多超参数、忽略漂移和把可解释性当因果。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>随机打乱时间序列做交叉验证；这会把未来结构泄漏给过去。<\/li>\n<li>在全样本上标准化或筛选特征；预处理本身也必须只用训练数据拟合。<\/li>\n<li>预测误差更低就认为策略更好；投资决策还取决于排序、成本、约束和稳定性。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>标签窗口与特征截止时间无重叠泄漏<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>全部预处理封装在训练流程内<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>模型优于朴素基线且结果跨时期稳定<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>漂移、失效和回滚方案已定义<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>强化学习围绕状态、动作、奖励和长期价值。<\/li>\n<li>市场模拟器误差是最大风险之一。<\/li>\n<li>奖励与动作边界必须体现真实风险和成本。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为执行算法设计奖励，包含成交成本、未完成数量和风险，并列出可能被钻的漏洞。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第094讲 机器学习中的过拟合陷阱：如何识别与防范<\/strong>。<\/p>"}, {"n": 94, "title": "机器学习中的过拟合陷阱：如何识别与防范", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。机器学习模型会失效，历史预测表现不代表未来收益。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>识别训练、验证和实盘交易三层过拟合。<\/li>\n<li>掌握正则、简化和嵌套选择。<\/li>\n<li>建立漂移与失效监控。<\/li>\n<\/ul>\n<h2>机器学习放大研究自由度<\/h2>\n<p>特征、标签、模型、超参数和样本窗口都可选择。若所有选择都围绕同一验证集，验证集也会被过拟合。<\/p>\n<h2>三层症状<\/h2>\n<p>训练好验证差是经典过拟合；验证好最终测试差是模型选择过拟合；回测好实盘交易差还可能来自成本、数据和制度变化。<\/p>\n<h2>防范工具<\/h2>\n<p>限制特征和超参数预算，使用嵌套时间验证，正则、早停、消融和简单基线；保留一次性最终测试，并记录所有实验而非只保存冠军。<\/p>\n<h2>选择偏差<\/h2>\n<p>团队连续数月试验后得到一条好曲线，实际有效试验次数远高于报告。应将研究过程当成多重检验，要求更强证据。<\/p>\n<h2>上线监控<\/h2>\n<p>监控特征分布、预测分数、命中率、Rank IC、成本和风险暴露。漂移不必马上停机，但应触发诊断与降险。<\/p>\n<h2>过拟合不只发生在模型参数里<\/h2>\n<p>至少有四层自由度：数据层选择证券、时间和清洗规则；标签与特征层选择窗口和变换；模型层选择算法与超参数；组合层选择阈值、持有期和成本假设。即使最终模型很简单，整个研究过程也可能经过大量选择。<\/p>\n<p>所以不能只比较训练误差和验证误差。还要问：这条验证曲线是在多少次失败试验后被选中的？验证集是否已经被团队反复观看并用于修改方向？<\/p>\n<h2>四类症状对应四类原因<\/h2>\n<ul>\n<li>训练好、验证差：模型容量或特征相对样本过大。<\/li>\n<li>多折平均尚可、折间差异巨大：信号依赖特定市场状态。<\/li>\n<li>回测好、仿真差：成本、成交、数据时点或生产实现不一致。<\/li>\n<li>仿真好、实盘逐步衰减：市场漂移、拥挤或数据供应变化。<\/li>\n<\/ul>\n<p>诊断要对应原因，不能用“再调一次参数”处理所有问题。<\/p>\n<h2>嵌套时间验证如何隔离选择<\/h2>\n<p>外层时间折用于估计完整研究流程的泛化，内层只在外层训练区间中选择特征、模型和超参数。选定后，在外层验证区间一次性评价。所有预处理也必须在内层训练窗口拟合。<\/p>\n<p>最后再保留一个从未参与模型、阈值或研究方向选择的测试区间。若看完最终测试又修改方案，该区间就应降级为开发数据。<\/p>\n<h2>用实验账本管理多重试验<\/h2>\n<p>每次运行记录研究假设、代码与数据版本、特征、标签、参数、切分、主指标、结果和下一步理由。失败实验不能删除，因为它们决定了最终冠军经历了多少次选择。<\/p>\n<p>在项目开始前设置特征和超参数预算，并预先写下通过标准。这样可以把“发现结果后讲故事”与真正的事前假设区分开。<\/p>\n<h2>正则化不能代替研究治理<\/h2>\n<p>L1/L2、dropout、早停和限制树深只约束单次模型拟合；如果研究者尝试了几百套正则强度后挑最好的一套，选择层仍会过拟合。防范必须同时覆盖模型容量、搜索空间、验证次数和最终保留集。<\/p>\n<h2>监控要绑定动作<\/h2>\n<p>为数据延迟、特征漂移、预测分布、组合暴露、成本偏差和样本外效果设置预警、降级与停用条件。单一指标越线可先诊断，多项同时恶化则降低风险或回滚到简单基线。<\/p>\n<p>恢复也要预先规定：问题修复、影子组合观察、有限仓位重启，再逐步恢复。没有恢复流程的停机规则会把模型锁死在最差时点。<\/p>\n<h2>机器学习实验：先守住时间边界<\/h2>\n<p>针对“机器学习中的过拟合陷阱：如何识别与防范”建立一个时间序列机器学习实验。重点不是模型名称，而是标签、特征、切分、评价和上线监控是否与真实决策过程一致。<\/p>\n<ol>\n<li>定义预测时点、预测对象、标签窗口和可用特征截止时间。<\/li>\n<li>按时间切分训练、验证与测试数据；预处理、特征选择和调参只在允许的数据内完成。<\/li>\n<li>与朴素基线比较，并同时评价预测质量、排序质量、换手和成本后组合表现。<\/li>\n<li>上线前建立特征漂移、预测分布、暴露、延迟和模型失效监控。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://papers.ssrn.com/sol3/papers.cfm?abstract_id=2326253\">Bailey 等：The Probability of Backtest Overfitting<\/a>：多重试验与回测过拟合的量化框架。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://scikit-learn.org/stable/common_pitfalls.html\">scikit-learn：Common pitfalls<\/a>：数据泄漏与训练、测试隔离。<\/li>\n<li><strong>适用条件与边界<\/strong>：金融数据非独立同分布且标签重叠；预测分数只有经过时间切分、成本和稳定性检验才有投资含义。<\/li>\n<li><strong>主要失败模式<\/strong>：随机切分时间序列、预处理泄漏、搜索过多超参数、忽略漂移和把可解释性当因果。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>随机打乱时间序列做交叉验证；这会把未来结构泄漏给过去。<\/li>\n<li>在全样本上标准化或筛选特征；预处理本身也必须只用训练数据拟合。<\/li>\n<li>预测误差更低就认为策略更好；投资决策还取决于排序、成本、约束和稳定性。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>标签窗口与特征截止时间无重叠泄漏<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>全部预处理封装在训练流程内<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>模型优于朴素基线且结果跨时期稳定<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>漂移、失效和回滚方案已定义<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>验证集也会被反复调参过拟合。<\/li>\n<li>实验日志和最终保留集是研究治理的一部分。<\/li>\n<li>上线后需监控输入、预测和经济结果漂移。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>列出一个项目所有隐形选择，并估算总试验自由度，再删除一半非必要参数。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第095讲 模型集成与动态选择：三个臭皮匠怎么顶个诸葛亮<\/strong>。<\/p>"}, {"n": 95, "title": "模型集成与动态选择：三个臭皮匠怎么顶个诸葛亮", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。机器学习模型会失效，历史预测表现不代表未来收益。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解 bagging、boosting、stacking 和模型平均。<\/li>\n<li>掌握多样性与相关误差的重要性。<\/li>\n<li>设计稳健的动态选择而非追逐近期赢家。<\/li>\n<\/ul>\n<h2>为什么集成可能更稳<\/h2>\n<p>若多个模型都有一定能力且错误不完全相关，平均可降低方差。三个高度相同的模型不等于三个独立观点。<\/p>\n<h2>四种方式<\/h2>\n<ul>\n<li>Bagging 对样本与模型并行平均。<\/li>\n<li>Boosting 逐步修正误差。<\/li>\n<li>Stacking 用第二层模型学习组合预测。<\/li>\n<li>简单平均或中位数直接聚合不同模型。<\/li>\n<\/ul>\n<p>简单平均通常是必须击败的基线。<\/p>\n<h2>动态选择<\/h2>\n<p>可根据近期稳定性、市场状态或特征有效性调整模型权重，但近期冠军容易均值回归。权重变化应缓慢、有上限并在滚动样本外验证。<\/p>\n<h2>多样性来源<\/h2>\n<p>不同数据、不同时间尺度、不同模型族和不同经济逻辑比仅改变随机种子更有价值。评估预测相关、持仓重合和危机共损。<\/p>\n<h2>组合层<\/h2>\n<p>模型集成后仍要统一校准、风险约束和成本。不要让多个模型各自下单后才发现总暴露重复。<\/p>\n<h2>集成真正利用的是错误差异<\/h2>\n<p>平均能够降低方差的前提，是模型错误不完全同步。如果三个模型使用相同数据、相同标签和相似结构，只改变随机种子，它们可能在危机时犯同一个错误。模型数量增加了，信息来源却没有增加。<\/p>\n<p>评价多样性不能只看模型名称，应同时看样本外预测相关、残差相关、头部持仓重合、因子暴露和压力期共同损失。真正有价值的多样性通常来自不同数据来源、时间尺度和经济机制。<\/p>\n<h2>四种集成分别在解决什么<\/h2>\n<p>Bagging 主要降低高方差学习器的不稳定；Boosting 逐轮修正当前残差，提升拟合能力；Stacking 让第二层模型学习何时信任哪些基模型；简单平均则不估计额外组合参数，往往更稳健。<\/p>\n<p>复杂方法必须击败等权平均和中位数。若 stacking 的优势只来自一个验证期，它可能只是在更高一层过拟合。<\/p>\n<h2>Stacking 的时间泄漏陷阱<\/h2>\n<p>第二层模型的训练输入必须是基模型对“未参与自身训练的数据”产生的预测。对时间序列，可在多个滚动折中生成样本外预测，再按时间拼接训练元模型。直接用基模型在训练集上的拟合值训练第二层，会把过度乐观的信号传上去。<\/p>\n<p>最终测试期中，基模型与元模型都必须冻结，不能根据测试结果重算权重。<\/p>\n<h2>动态选择为什么容易追逐近期冠军<\/h2>\n<p>用最近表现给模型加权，看似能适应市场，实则引入了第二层择时策略。短窗口噪声大，会频繁换权；长窗口反应慢，又可能错过状态变化。市场状态分类错误时，门控模型可能在最差时点切换。<\/p>\n<p>可以设置权重上下限、变化速度、最短持有期和收缩到等权的强度，并与固定等权比较。动态权重带来的新增换手和交易成本必须单独记账。<\/p>\n<h2>先合并预测，再统一构建组合<\/h2>\n<p>将不同模型输出转换到可比较尺度并校准，再在信号层合成，随后由一个组合优化器统一处理风险、行业、风格、换手和容量。若各模型独立生成订单，可能一个买、一个卖造成内部对冲与无效成本，也可能共同押注同一因子却没人看见总风险。<\/p>\n<p>报告应从模型贡献、合成信号、目标持仓到实际成交逐层归因，回答每个模型究竟增加了收益、分散了风险，还是只增加复杂度。<\/p>\n<h2>模型退出也是集成规则的一部分<\/h2>\n<p>预先定义成员加入、降权、暂停和恢复条件。某模型数据中断、预测分布越界或长期无增量时，应平滑退出，并验证剩余模型的总风险是否变化。模型池持续扩张却从不淘汰，会积累维护成本和隐藏相关性。<\/p>\n<h2>机器学习实验：先守住时间边界<\/h2>\n<p>针对“模型集成与动态选择：三个臭皮匠怎么顶个诸葛亮”建立一个时间序列机器学习实验。重点不是模型名称，而是标签、特征、切分、评价和上线监控是否与真实决策过程一致。<\/p>\n<ol>\n<li>定义预测时点、预测对象、标签窗口和可用特征截止时间。<\/li>\n<li>按时间切分训练、验证与测试数据；预处理、特征选择和调参只在允许的数据内完成。<\/li>\n<li>与朴素基线比较，并同时评价预测质量、排序质量、换手和成本后组合表现。<\/li>\n<li>上线前建立特征漂移、预测分布、暴露、延迟和模型失效监控。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://doi.org/10.6028/NIST.AI.100-1\">NIST AI Risk Management Framework 1.0<\/a>：AI 系统的治理、映射、度量与管理。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://scikit-learn.org/stable/common_pitfalls.html\">scikit-learn：Common pitfalls<\/a>：数据泄漏与训练、测试隔离。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://scikit-learn.org/stable/modules/generated/sklearn.model_selection.TimeSeriesSplit.html\">scikit-learn：TimeSeriesSplit<\/a>：保持时间顺序的验证切分。<\/li>\n<li><strong>适用条件与边界<\/strong>：金融数据非独立同分布且标签重叠；预测分数只有经过时间切分、成本和稳定性检验才有投资含义。<\/li>\n<li><strong>主要失败模式<\/strong>：随机切分时间序列、预处理泄漏、搜索过多超参数、忽略漂移和把可解释性当因果。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>随机打乱时间序列做交叉验证；这会把未来结构泄漏给过去。<\/li>\n<li>在全样本上标准化或筛选特征；预处理本身也必须只用训练数据拟合。<\/li>\n<li>预测误差更低就认为策略更好；投资决策还取决于排序、成本、约束和稳定性。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>标签窗口与特征截止时间无重叠泄漏<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>全部预处理封装在训练流程内<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>模型优于朴素基线且结果跨时期稳定<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>漂移、失效和回滚方案已定义<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>集成依靠低相关错误降低方差。<\/li>\n<li>简单平均是强基线，复杂动态权重容易追涨杀跌。<\/li>\n<li>模型多样性应来自信息与逻辑，而非名称数量。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>计算三个模型预测和持仓的相关矩阵，设计等权与动态权重并比较换手率。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第096讲 实战第一步：明确策略需求与逻辑描述<\/strong>。<\/p>"}]}, {"no": 10, "name": "知行·实战演练", "desc": "纸上得来终觉浅，手把手带你走一遍从想法到可执行策略的流程。", "chapters": [{"n": 96, "title": "实战第一步：明确策略需求与逻辑描述", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。实盘交易部署会产生真实损失，必须经过授权、测试和独立风控。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>把策略需求写成可测试规范。<\/li>\n<li>区分经济假设、信号、组合与约束。<\/li>\n<li>建立上线验收与失败标准。<\/li>\n<\/ul>\n<h2>先写需求，不先写代码<\/h2>\n<p>策略项目应从“解决什么问题”开始：追求绝对收益、降低回撤、提供对冲还是跟踪基准。目标不同，数据与评价也不同。<\/p>\n<h2>一页策略说明书<\/h2>\n<ol>\n<li><strong>目标与基准<\/strong>：要超过谁，风险预算多少。<\/li>\n<li><strong>交易范围<\/strong>：市场、资产、流动性和排除条件。<\/li>\n<li><strong>假设<\/strong>：优势为何存在，谁在另一侧。<\/li>\n<li><strong>信号<\/strong>：输入、公式、频率和时点。<\/li>\n<li><strong>组合<\/strong>：权重、持仓数、再平衡和约束。<\/li>\n<li><strong>执行<\/strong>：订单时间、类型、显性交易费用和成交模型。<\/li>\n<li><strong>风控<\/strong>：单票、组合、回撤与异常。<\/li>\n<li><strong>验收<\/strong>：样本外、成本、稳健性和容量标准。<\/li>\n<\/ol>\n<h2>模糊词清理<\/h2>\n<p>把“趋势明显”“估值合理”“风险较低”改成字段、窗口、阈值和比较对象。仍需人工判断的部分也要记录输入与权限。<\/p>\n<h2>失败定义<\/h2>\n<p>在实验前写出什么结果会否定假设、什么偏离会暂停实盘交易。没有失败标准，研究会不断加条件直到曲线变好。<\/p>\n<h2>最小可行策略<\/h2>\n<p>先实现最简单基线，跑通数据—信号—订单—账本—报告，再增加复杂度。工程闭环比首版收益高更重要。<\/p>\n<h2>从一句想法拆成五层规范<\/h2>\n<p>“做一个低回撤的趋势策略”还不是需求。应依次拆成：经济假设说明为什么可能存在优势；信号规范说明何时、用什么数据计算；组合规范说明分数怎样变成权重；执行规范说明何时、以什么订单交易；治理规范说明如何监控、暂停和恢复。<\/p>\n<p>五层要能单独测试。即使回测收益不理想，也能判断失败来自假设、信号、组合、成交还是运营，而不是把所有问题混进一条净值曲线。<\/p>\n<h2>教学案例：把“趋势明显”改写成规则<\/h2>\n<p>模糊版本：“价格趋势明显时买入，趋势变坏时卖出。”可测试版本应进一步写明：目标市场和证券池；使用何种复权收盘价；短长窗口；信号在收盘后形成；下一可交易时点下单；无信号时持有现金；停牌和涨跌停如何处理；费用和滑点口径；最大仓位和暂停条件。<\/p>\n<p>改写后仍不能证明策略有效，但任何实现者都能对同一日期给出同一目标仓位。可复现是评价有效性的前提。<\/p>\n<h2>需求必须带“非目标”<\/h2>\n<p>项目还要明确首版不解决什么。例如只支持日频、不做空、不处理盘中订单、不连接真实账户、不追求最优参数。非目标可以防止研究范围不断扩张，也让验收者知道哪些缺口是有意保留，而非遗漏。<\/p>\n<p>当新需求出现时，应作为新版本评估数据、测试和风险影响，而不是悄悄塞进原规则。<\/p>\n<h2>验收标准要能判定通过或失败<\/h2>\n<p>“夏普较高”“回撤可接受”都无法验收。可写成四类标准：正确性要求账本与手算一致；研究性要求通过时间样本外和成本压力；风险性要求集中度、回撤与压力损失在预算内；工程性要求定时运行、故障告警、重启对账和回滚演练通过。<\/p>\n<p>具体阈值应由策略、市场与组织风险预算决定，并在实验前冻结。未通过时应记录失败，而不是移动门槛直到通过。<\/p>\n<h2>建立需求到测试的追踪表<\/h2>\n<p>每条需求分配唯一编号，并对应数据字段、代码模块、自动测试、监控指标和负责人。例如“信号只能使用当日收盘前可得数据”应对应特征时间契约、无前视测试和生产延迟告警。<\/p>\n<p>追踪表能回答一项规则修改会影响哪些测试和运营环节，也能防止文档写了规则、代码却从未实现。<\/p>\n<h2>最小可行策略的交付物<\/h2>\n<p>首版至少包括一页策略说明书、固定小样本、可运行代码、逐日信号与订单、账户账本、基础报告、自动测试和已知限制。它不追求最高收益，而是证明整条链能被独立复现。后续每增加一个因子或约束，都应说明相对这个基线增加了什么可验证价值。<\/p>\n<h2>实战交付：让别人能够独立复现<\/h2>\n<p>围绕“实战第一步：明确策略需求与逻辑描述”形成可交付的研究闭环。完工标准不是代码在作者电脑上运行过一次，而是另一位读者能按说明重建环境、运行测试并解释输出。<\/p>\n<ol>\n<li>冻结需求、输入字段、参数、信号时点、成本口径和输出结构。<\/li>\n<li>把数据校验、策略逻辑、账本、指标、日志和异常处理拆成可测试模块。<\/li>\n<li>使用同一份输入分别运行 Python 与 R，实现逐日结果与指标对账。<\/li>\n<li>保留 README、运行命令、测试记录、已知限制和上线前检查清单。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.backtrader.com/docu/\">Backtrader 官方文档<\/a>：事件驱动回测框架的行为定义。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://docs.python.org/3/library/logging.html\">Python logging 官方文档<\/a>：结构化日志与严重级别的实现依据。<\/li>\n<li><strong>适用条件与边界<\/strong>：平台回测结果取决于撮合、费率和数据实现；模拟交易仍不能完整复现实盘排队、冲击和故障。<\/li>\n<li><strong>主要失败模式<\/strong>：研究与生产代码分叉、日志不可追溯、上线无回滚、告警无责任人、收益无法归因。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>只交付代码片段而没有输入、环境和运行说明；这不构成可复现产物。<\/li>\n<li>Python 与 R 使用不同默认参数或缺失值规则；跨语言对账必须逐列进行。<\/li>\n<li>把回测通过等同于可实盘；模拟交易、权限隔离、监控和故障恢复仍需独立验收。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>从干净环境可按 README 一次运行成功<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>输入校验和关键逻辑有自动测试<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>Python 与 R 输出在约定容差内一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>日志、监控、异常恢复和风险限制均有文档<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>策略需求应覆盖目标、数据、信号、组合、执行、风控与验收。<\/li>\n<li>模糊词必须转成可观察条件。<\/li>\n<li>先定义失败，再开始实验。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>用一页模板描述下一讲的双均线策略，限制参数不超过五个。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第097讲 动手写一个双均线策略（Python与R代码实操）<\/strong>。<\/p>"}, {"n": 97, "title": "动手写一个双均线策略（Python与R代码实操）", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。实盘交易部署会产生真实损失，必须经过授权、测试和独立风控。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>分别使用 Python 与 R 实现无前视偏差的双均线基线。<\/li>\n<li>分别运行并验收 Python 与 R 实现，确认两种语言的结果一致。<\/li>\n<li>确保两种语言使用相同输入、参数、信号时点、交易成本和绩效口径。<\/li>\n<li>生成目标仓位、策略收益率、交易成本、净值和基础绩效指标。<\/li>\n<li>理解代码每一步的金融含义，并能够逐行对账。<\/li>\n<\/ul>\n<h2>规则<\/h2>\n<p>使用收盘价计算 20/60 日均线；短均线高于长均线时持有，反之空仓。收盘后得到信号，下一交易日生效。<\/p>\n<h2>本讲实现方式<\/h2>\n<p>下方同时提供 Python 与 R 的核心实现，用同一组输入、参数、信号时点、交易成本和绩效口径解释完整计算流程。读者可以复制代码到独立工作目录运行，并逐列核对日期、信号、仓位、换手率、策略收益率和净值。<\/p>\n<h2>用 WorkBuddy 完成本讲<\/h2>\n<ol>\n<li>新建 <strong>Coding Mode<\/strong> 任务，选择一个仅用于本讲的工作文件夹，并保持 <strong>Default Permissions<\/strong>。<\/li>\n<li>加入本讲正文、术语规范和 <code>input/price.csv<\/code>。<\/li>\n<li>要求 WorkBuddy 同时生成 Python/R 源文件、分别运行两端、输出逐日与指标 CSV，并生成跨语言对账报告。<\/li>\n<li>在结果面板检查 Artifacts、All Files、Changes 和 Preview；若有差异，让它定位第一个不一致的日期与字段。<\/li>\n<\/ol>\n<p>针对本讲可发送：<\/p>\n<blockquote>\n<p>按第097讲规则实现 20/60 日双均线策略，交易成本为每单位换手率 0.0005，日频年化周期为 252。收盘后生成信号，仓位必须滞后一日。请同时生成完整 Python 与 R 产物，分别输出逐日结果和绩效指标，并以绝对容差 <code>1e-10<\/code> 逐列核对信号、仓位、换手率、策略收益率和净值。不要连接真实账户。<\/p>\n<\/blockquote>\n<h2>用 TRAE 完成本讲<\/h2>\n<ol>\n<li>在 TRAE Work 中选择 <strong>Code Mode<\/strong>，或在 TRAE IDE 中打开本讲工作文件夹；确认运行环境可调用 Python 3 和 <code>Rscript<\/code>。<\/li>\n<li>把本讲正文、术语规范和输入数据加入工作区，在 Agent 中发送与 WorkBuddy 相同的任务指令。<\/li>\n<li>审阅文件变更与终端命令后，让 Agent 分别运行 Python 和 R 脚本。<\/li>\n<li>检查变更视图、终端输出、README 预览和对账报告；任何超出容差的差异都必须修复后重跑。<\/li>\n<\/ol>\n<h2>Python 产物核心实现<\/h2>\n<p>假设 <code>price.csv<\/code> 至少包含 <code>date,close<\/code>：<\/p>\n<pre><code class=\"language-python\">import pandas as pd\n\nSHORT, LONG = 20, 60\nFEE = 0.0005\n\ndf = pd.read_csv(&quot;price.csv&quot;, parse_dates=[&quot;date&quot;])\ndf = df.sort_values(&quot;date&quot;).drop_duplicates(&quot;date&quot;).set_index(&quot;date&quot;)\n\ndf[&quot;ret&quot;] = df[&quot;close&quot;].pct_change()\ndf[&quot;ma_short&quot;] = df[&quot;close&quot;].rolling(SHORT, min_periods=SHORT).mean()\ndf[&quot;ma_long&quot;] = df[&quot;close&quot;].rolling(LONG, min_periods=LONG).mean()\n\n# t 日收盘后才知道 signal，因此 t+1 日仓位使用 shift(1)\ndf[&quot;signal&quot;] = (df[&quot;ma_short&quot;] &gt; df[&quot;ma_long&quot;]).astype(float)\ndf[&quot;position&quot;] = df[&quot;signal&quot;].shift(1).fillna(0.0)\n\ndf[&quot;turnover&quot;] = df[&quot;position&quot;].diff().abs().fillna(0.0)\ndf[&quot;strategy_ret&quot;] = (\n    df[&quot;position&quot;] * df[&quot;ret&quot;] - FEE * df[&quot;turnover&quot;]\n).fillna(0.0)\ndf[&quot;equity&quot;] = (1.0 + df[&quot;strategy_ret&quot;]).cumprod()\n<\/code><\/pre>\n<h2>基本绩效<\/h2>\n<pre><code class=\"language-python\">PERIODS = 252\nn = len(df)\nann_return = df[&quot;equity&quot;].iloc[-1] ** (PERIODS / n) - 1\nann_vol = df[&quot;strategy_ret&quot;].std(ddof=1) * PERIODS ** 0.5\nsharpe = (\n    df[&quot;strategy_ret&quot;].mean() * PERIODS / ann_vol\n    if ann_vol &gt; 0\n    else float(&quot;nan&quot;)\n)\npeak = df[&quot;equity&quot;].cummax()\nmax_drawdown = (df[&quot;equity&quot;] / peak - 1.0).min()\nprint(ann_return, ann_vol, sharpe, max_drawdown)\n<\/code><\/pre>\n<h2>R 产物核心实现<\/h2>\n<p>R 版本只使用基础包，并与 Python 版本保持相同变量和计算口径。<\/p>\n<h3>策略与净值<\/h3>\n<pre><code class=\"language-r\">SHORT &lt;- 20L\nLONG &lt;- 60L\nFEE &lt;- 0.0005\n\ndf &lt;- read.csv(&quot;price.csv&quot;, stringsAsFactors = FALSE)\ndf$date &lt;- as.Date(df$date)\ndf &lt;- df[order(df$date), ]\ndf &lt;- df[!duplicated(df$date), ]\nrow.names(df) &lt;- NULL\n\nroll_mean &lt;- function(x, n) {\n  as.numeric(stats::filter(x, rep(1 / n, n), sides = 1))\n}\n\ndf$ret &lt;- c(NA_real_, diff(df$close) / head(df$close, -1L))\ndf$ma_short &lt;- roll_mean(df$close, SHORT)\ndf$ma_long &lt;- roll_mean(df$close, LONG)\n\n# t 日收盘后才知道 signal，因此 t+1 日的仓位滞后一日\ndf$signal &lt;- as.numeric(df$ma_short &gt; df$ma_long)\ndf$signal[is.na(df$signal)] &lt;- 0\ndf$position &lt;- c(0, head(df$signal, -1L))\n\ndf$turnover &lt;- c(0, abs(diff(df$position)))\ndf$strategy_ret &lt;- df$position * df$ret - FEE * df$turnover\ndf$strategy_ret[is.na(df$strategy_ret)] &lt;- 0\ndf$equity &lt;- cumprod(1 + df$strategy_ret)\n<\/code><\/pre>\n<h3>基础绩效<\/h3>\n<pre><code class=\"language-r\">PERIODS &lt;- 252\nn &lt;- nrow(df)\nann_return &lt;- tail(df$equity, 1)^(PERIODS / n) - 1\nann_vol &lt;- stats::sd(df$strategy_ret) * sqrt(PERIODS)\nsharpe &lt;- if (is.finite(ann_vol) &amp;&amp; ann_vol &gt; 0) {\n  mean(df$strategy_ret) * PERIODS / ann_vol\n} else {\n  NA_real_\n}\npeak &lt;- cummax(df$equity)\nmax_drawdown &lt;- min(df$equity / peak - 1)\nprint(c(ann_return, ann_vol, sharpe, max_drawdown))\n<\/code><\/pre>\n<h2>Python 与 R 结果对账<\/h2>\n<p>两个版本使用相同 <code>price.csv<\/code> 时，应逐日比较 <code>ma_short<\/code>、<code>ma_long<\/code>、<code>signal<\/code>、<code>position<\/code>、<code>turnover<\/code>、<code>strategy_ret<\/code> 和 <code>equity<\/code>。移动平均线形成前的缺失值和浮点误差可能造成极小差异；若仓位或净值出现方向性差异，应先逐行定位。<\/p>\n<h2>这些教学产物还缺什么<\/h2>\n<p>真实项目还要处理复权、分红、交易日历、滑点、市场冲击成本、无法成交、现金利息和信号执行价格。这里是研究基线，不是可直接连接账户的实盘交易程序。<\/p>\n<h2>自检<\/h2>\n<p>确认完整 Python/R 源文件和 README 均已生成；仓位已滞后一日；长均线形成前仓位为零；交易成本只在仓位变化时扣；两端使用相同数据和参数；逐日结果已在 <code>1e-10<\/code> 容差内对账；最后再用小样本逐行手算验证。<\/p>\n<h2>先固定输入数据契约<\/h2>\n<p><code>price.csv<\/code> 不应只要求“有 date 和 close”。还要规定日期时区、交易日唯一性、价格单位、是否复权、缺失和零价格处理、排序规则，以及文件版本或校验值。Python 与 R 若读取的是不同版本数据，对账再严格也没有意义。<\/p>\n<p>建议在运行前断言：日期可解析且严格递增、无重复、收盘价为正、长窗口所需样本足够。任何断言失败都应终止，而不是静默填补后继续输出净值。<\/p>\n<h2>用六行小样本做手工验收<\/h2>\n<p>正式跑长历史前，可以把窗口改成教学用的 2/3 日，构造一段价格先上涨再下跌的小样本。逐日手算短均线、长均线、信号、滞后一日仓位、换手、费用和净值，并把期望结果固化成单元测试。<\/p>\n<p>这个测试能一次发现最常见的错误：滚动窗口方向不一致、信号未滞后、首次建仓未计换手、收益与仓位日期错位。手算样本仅用于验证实现，不用于评价策略收益。<\/p>\n<h2>把向量计算翻译成事件顺序<\/h2>\n<p>每日顺序应是：读取当日收盘数据；更新均线；收盘后产生目标信号；下一交易日开始前取得昨日目标；按成交假设改变仓位；用实际仓位承担当日收益；仓位变化时扣除成本。<code>shift(1)<\/code> 是这条时间规则在向量代码中的表达。<\/p>\n<p>若未来改为开盘信号、盘中数据或真实订单，不能只修改一行 <code>shift<\/code>，而应重新定义整个事件时间轴和成交价格。<\/p>\n<h2>跨语言对账要分层定位<\/h2>\n<p>先核对输入行数、日期和价格；再核对两条均线；随后比较信号、仓位和换手；最后比较收益、费用、净值与汇总指标。发现差异时定位第一个不一致日期，避免只看末期净值猜原因。<\/p>\n<p>浮点容差只适用于数值舍入，不能掩盖信号或仓位差异。离散字段应完全一致，连续字段才使用预先固定的绝对或相对容差。<\/p>\n<h2>从教学代码到事件驱动回测<\/h2>\n<p>当前实现默认仓位可以按指定时点完整切换，未维护现金、订单和成交状态。进阶版本应增加订单对象、部分成交、未成交撤销、现金约束、最小交易单位、公司行动和账户账本，再与向量版本在理想条件下对齐。<\/p>\n<p>两套实现一致后，逐项加入现实约束，观察每一层造成的收益损耗。这样既能保留简单基线，也能清楚说明复杂回测为何不同。<\/p>\n<h2>版本化本讲的完整实验<\/h2>\n<p>保存输入校验值、Python/R 环境版本、参数文件、运行命令、逐日输出、指标和对账报告。任何参数变化都生成新的实验编号，而不是覆盖旧结果。只有这样，课后练习才能升级为可审计的研究资产。<\/p>\n<h2>实战交付：让别人能够独立复现<\/h2>\n<p>围绕“动手写一个双均线策略（Python与R代码实操）”形成可交付的研究闭环。完工标准不是代码在作者电脑上运行过一次，而是另一位读者能按说明重建环境、运行测试并解释输出。<\/p>\n<ol>\n<li>冻结需求、输入字段、参数、信号时点、成本口径和输出结构。<\/li>\n<li>把数据校验、策略逻辑、账本、指标、日志和异常处理拆成可测试模块。<\/li>\n<li>使用同一份输入分别运行 Python 与 R，实现逐日结果与指标对账。<\/li>\n<li>保留 README、运行命令、测试记录、已知限制和上线前检查清单。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.backtrader.com/docu/\">Backtrader 官方文档<\/a>：事件驱动回测框架的行为定义。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://scikit-learn.org/stable/common_pitfalls.html\">scikit-learn：Common pitfalls<\/a>：数据泄漏与训练、测试隔离。<\/li>\n<li><strong>适用条件与边界<\/strong>：平台回测结果取决于撮合、费率和数据实现；模拟交易仍不能完整复现实盘排队、冲击和故障。<\/li>\n<li><strong>主要失败模式<\/strong>：研究与生产代码分叉、日志不可追溯、上线无回滚、告警无责任人、收益无法归因。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>只交付代码片段而没有输入、环境和运行说明；这不构成可复现产物。<\/li>\n<li>Python 与 R 使用不同默认参数或缺失值规则；跨语言对账必须逐列进行。<\/li>\n<li>把回测通过等同于可实盘；模拟交易、权限隔离、监控和故障恢复仍需独立验收。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>从干净环境可按 README 一次运行成功<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>输入校验和关键逻辑有自动测试<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>Python 与 R 输出在约定容差内一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>日志、监控、异常恢复和风险限制均有文档<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>双均线的关键不是均线函数，而是信号、目标仓位和执行时点的严格分离。<\/li>\n<li>Python 与 R 实现必须使用同一数据、参数和交易成本口径。<\/li>\n<li>夏普比率使用平均单期收益率年化，年化收益率使用净值几何复合，两者不能混算。<\/li>\n<li>WorkBuddy 与 TRAE 都必须交付可运行文件、结果数据和跨语言对账结论。<\/li>\n<li>最小代码应先逐行对账，再扩展真实撮合。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>任选 WorkBuddy 或 TRAE，分别在 Python 与 R 完整产物中加入 <code>3×ATR<\/code> 吊灯止损，确保两种实现的信号时点和跳空处理一致，并提交两端逐日结果与跨语言对账报告。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第098讲 在量化回测平台上完成一次完整回测并看懂报告<\/strong>。<\/p>"}, {"n": 98, "title": "在量化回测平台上完成一次完整回测并看懂报告", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。实盘交易部署会产生真实损失，必须经过授权、测试和独立风控。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>完成一次平台回测并核对关键设置。<\/li>\n<li>读懂收益、回撤、交易和风险报告。<\/li>\n<li>用订单明细而非曲线判断可信度。<\/li>\n<\/ul>\n<h2>上传代码前先锁定口径<\/h2>\n<p>记录平台、数据版本、回测区间、基准、初始资金、频率、复权、显性交易费用、滑点和成交规则。平台默认值不是策略定义。<\/p>\n<h2>运行步骤<\/h2>\n<ol>\n<li>先用短区间调试，打印均线、信号、订单和持仓。<\/li>\n<li>手工核对几天，确认没有同价前视。<\/li>\n<li>扩展全样本，保存代码与参数。<\/li>\n<li>运行样本外和成本压力版本。<\/li>\n<li>导出交易明细与每日净值。<\/li>\n<\/ol>\n<h2>看懂报告<\/h2>\n<p>先看净值和回撤路径，再看年化收益率、年化波动率、夏普比率、换手率和交易成本。比较基准与空仓现金。检查收益是否集中于少数年份或交易。<\/p>\n<h2>订单审计<\/h2>\n<p>抽取首次买入、反转、跳空和最后持仓，核对信号时间、提交时间、成交价、数量与显性交易费用。很多回测错误只在订单层可见。<\/p>\n<h2>跨平台差异<\/h2>\n<p>不同云端平台或本地框架可能采用不同的复权、交易日历和撮合规则。不要要求最终小数完全相同，先逐日对齐输入、信号和订单，定位口径差异。<\/p>\n<h2>产出<\/h2>\n<p>保存策略说明书、代码版本、参数、环境、净值、交易表、指标与已知限制，形成可复现包。<\/p>\n<h2>建立回测运行清单<\/h2>\n<p>运行前把设置分成四组：数据口径包括证券池、复权、公司行动和时区；交易口径包括信号时间、订单类型、成交价与未成交处理；费用口径包括佣金、税费、滑点和融资成本；评价口径包括基准、无风险收益、年化周期和统计区间。<\/p>\n<p>将平台页面上的设置截图或导出配置，并与代码内参数一起保存。否则同一代码在默认值变化后可能产生不同结果。<\/p>\n<h2>三阶段调试比一次跑全样本更可靠<\/h2>\n<p>第一阶段只跑几天，用固定小样本打印所有中间变量并手算；第二阶段选择包含调仓、停牌、分红或跳空的短区间，检查订单生命周期；第三阶段才跑完整历史、样本外与压力版本。每阶段通过后再进入下一阶段。<\/p>\n<p>直接运行十年历史会把错误埋进成千上万行数据，漂亮净值反而让人减少怀疑。<\/p>\n<h2>读报告要沿着因果链<\/h2>\n<p>先确认组合真正持有什么、何时交易；再查看毛收益与基准差；随后扣除费用和滑点；最后检查波动、回撤和容量。绩效指标是这条链的结果，不是起点。<\/p>\n<p>把总收益按市场暴露、信号、仓位、费用和现金拖累拆开。若策略收益主要来自长期满仓 Beta，就不能把它全部解释为均线择时能力。<\/p>\n<h2>订单审计模板<\/h2>\n<p>对每笔抽样订单保存：触发信号使用的数据截止时间、目标仓位、提交时间、订单类型和数量、平台撮合条件、成交时间与价格、费用、未成交原因以及成交后的现金和持仓。优先抽查首次交易、方向反转、跳空、涨跌停、停牌恢复和回测最后一日。<\/p>\n<p>订单层若无法解释，净值层就不具备可信度。特别要检查回测结束时未平仓头寸是否被错误忽略或强制按理想价格结算。<\/p>\n<h2>跨平台对账从第一处差异开始<\/h2>\n<p>先对齐交易日与原始价格，再对齐复权和证券状态，之后比较信号、订单、成交、费用、现金和净值。定位第一处差异，并判断它属于数据、策略还是撮合，而不是调整参数让最终收益碰巧接近。<\/p>\n<p>平台差异本身可以成为模型风险报告：若关键结论只在一套默认规则下成立，策略稳健性不足。<\/p>\n<h2>可复现包应包含什么<\/h2>\n<p>至少保存策略说明、源代码提交号、依赖与平台版本、全部参数、输入数据标识、运行日志、逐日净值、订单成交表、指标、压力结果和已知限制。另附一条从零运行的操作说明，使未参与开发的人能够复现。<\/p>\n<h2>实战交付：让别人能够独立复现<\/h2>\n<p>围绕“在量化回测平台上完成一次完整回测并看懂报告”形成可交付的研究闭环。完工标准不是代码在作者电脑上运行过一次，而是另一位读者能按说明重建环境、运行测试并解释输出。<\/p>\n<ol>\n<li>冻结需求、输入字段、参数、信号时点、成本口径和输出结构。<\/li>\n<li>把数据校验、策略逻辑、账本、指标、日志和异常处理拆成可测试模块。<\/li>\n<li>使用同一份输入分别运行 Python 与 R，实现逐日结果与指标对账。<\/li>\n<li>保留 README、运行命令、测试记录、已知限制和上线前检查清单。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.backtrader.com/docu/\">Backtrader 官方文档<\/a>：事件驱动回测框架的行为定义。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://docs.python.org/3/library/logging.html\">Python logging 官方文档<\/a>：结构化日志与严重级别的实现依据。<\/li>\n<li><strong>适用条件与边界<\/strong>：平台回测结果取决于撮合、费率和数据实现；模拟交易仍不能完整复现实盘排队、冲击和故障。<\/li>\n<li><strong>主要失败模式<\/strong>：研究与生产代码分叉、日志不可追溯、上线无回滚、告警无责任人、收益无法归因。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>只交付代码片段而没有输入、环境和运行说明；这不构成可复现产物。<\/li>\n<li>Python 与 R 使用不同默认参数或缺失值规则；跨语言对账必须逐列进行。<\/li>\n<li>把回测通过等同于可实盘；模拟交易、权限隔离、监控和故障恢复仍需独立验收。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>从干净环境可按 README 一次运行成功<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>输入校验和关键逻辑有自动测试<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>Python 与 R 输出在约定容差内一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>日志、监控、异常恢复和风险限制均有文档<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>平台默认参数必须显式记录。<\/li>\n<li>先审计订单，再相信绩效曲线。<\/li>\n<li>回测产出应包含完整可复现材料。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>选择五笔代表性交易，制作信号—订单—成交—持仓的逐项核对表。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第099讲 从回测到模拟交易：让策略跑起来，感受真实冲击<\/strong>。<\/p>"}, {"n": 99, "title": "从回测到模拟交易：让策略跑起来，感受真实冲击", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。实盘交易部署会产生真实损失，必须经过授权、测试和独立风控。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解模拟交易验证的对象与局限。<\/li>\n<li>搭建实时数据、信号、订单和对账链路。<\/li>\n<li>设定从模拟交易到小资金实盘交易的门槛。<\/li>\n<\/ul>\n<h2>模拟交易验证什么<\/h2>\n<p>模拟交易不能证明盈利，却能发现历史回测看不到的运营问题：数据延迟、时区、调度、订单状态、停牌、显性交易费用、重启和通知。<\/p>\n<h2>最小链路<\/h2>\n<blockquote>\n<p>实时数据 → 特征 → 信号 → 风险检查 → 模拟订单 → 成交回报 → 持仓账本 → 监控告警<\/p>\n<\/blockquote>\n<p>每一步记录时间戳与唯一事件 ID，程序重启后能够恢复未完成订单和仓位。<\/p>\n<h2>与回测对账<\/h2>\n<p>每日生成“理论目标—模拟订单—实际模拟持仓”差异。解释信号、价格、显性交易费用和成交偏离，而不是只比较最终净值。<\/p>\n<h2>真实感设置<\/h2>\n<p>使用下一可交易时点、合理滑点、部分成交与订单拒绝；模拟停牌、接口断线和重复推送。过于理想的模拟交易只是另一层回测。<\/p>\n<h2>晋级门槛<\/h2>\n<p>连续运行覆盖足够信号与异常；无未解释账差；告警、恢复和人工接管通过演练；扣除模拟交易成本后的表现仍在预期范围。进入小资金实盘交易后仍应限制品种和风险。<\/p>\n<h2>模拟交易验证的是系统行为<\/h2>\n<p>回测读取一段完整历史，模拟交易则必须等待数据实时到达，并处理迟到、重复、修订和断流。它能检验调度、接口、订单状态、账本和告警是否共同工作，却仍不能完整复制真实排队位置、市场冲击和资金压力。<\/p>\n<p>因此模拟交易的首要评价不是赚了多少，而是每个事件是否按预期发生、偏差能否解释、故障能否恢复。<\/p>\n<h2>每个事件都要可重放且幂等<\/h2>\n<p>行情、信号、风控、订单和成交回报应有唯一事件 ID、发生时间和接收时间。程序收到重复消息时不得重复下单；重启后能够从最后确认状态恢复，并重放未处理事件而不改变已完成结果。<\/p>\n<p>可以在测试环境主动重复发送同一成交回报或让程序在下单后立刻崩溃，验证账户不会出现双倍持仓。<\/p>\n<h2>三本账必须每日对齐<\/h2>\n<p>理论账记录模型目标，模拟执行账记录订单与成交，券商或平台账记录外部认可的现金和持仓。每日比较三者，差异按信号延迟、风控拦截、未成交、费用、公司行动或数据错误分类。<\/p>\n<p>无法解释的差异不能滚入下一日继续积累。对账失败时应限制新增风险，并保留原始回报供复盘。<\/p>\n<h2>故障演练比正常运行更重要<\/h2>\n<p>至少注入行情延迟与中断、重复推送、订单拒绝、部分成交、撤单失败、时钟偏差、程序重启、数据库不可用和告警通道失效。每个场景都要有预期系统状态、自动动作、人工负责人和恢复验证。<\/p>\n<p>演练目标不是系统永不出错，而是错误不会静默扩大，且能够在明确时间内恢复到可核对状态。<\/p>\n<h2>回测与模拟交易怎样逐层对账<\/h2>\n<p>同一日期比较输入数据、特征、信号、目标仓位、风控后仓位、订单、成交与费用。若输入相同而信号不同，是计算或版本问题；信号相同而持仓不同，多半来自风险或执行；持仓相同而净值不同，则检查价格、费用和公司行动。<\/p>\n<p>逐层对账比比较两条净值曲线更快定位根因。<\/p>\n<h2>从模拟盘晋级的评分卡<\/h2>\n<p>评分卡至少覆盖运行稳定性、数据及时性、账本一致性、订单成功率、成交偏差、告警响应、故障恢复、成本后表现和压力限额。还要达到足够事件数量，而不只是运行了足够日历天数。<\/p>\n<p>进入小资金阶段仍应限制资产、订单和最大损失，并保持模拟或影子组合并行。实盘暴露只能随证据逐步增加。<\/p>\n<h2>实战交付：让别人能够独立复现<\/h2>\n<p>围绕“从回测到模拟交易：让策略跑起来，感受真实冲击”形成可交付的研究闭环。完工标准不是代码在作者电脑上运行过一次，而是另一位读者能按说明重建环境、运行测试并解释输出。<\/p>\n<ol>\n<li>冻结需求、输入字段、参数、信号时点、成本口径和输出结构。<\/li>\n<li>把数据校验、策略逻辑、账本、指标、日志和异常处理拆成可测试模块。<\/li>\n<li>使用同一份输入分别运行 Python 与 R，实现逐日结果与指标对账。<\/li>\n<li>保留 README、运行命令、测试记录、已知限制和上线前检查清单。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.backtrader.com/docu/\">Backtrader 官方文档<\/a>：事件驱动回测框架的行为定义。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://docs.python.org/3/library/logging.html\">Python logging 官方文档<\/a>：结构化日志与严重级别的实现依据。<\/li>\n<li><strong>适用条件与边界<\/strong>：平台回测结果取决于撮合、费率和数据实现；模拟交易仍不能完整复现实盘排队、冲击和故障。<\/li>\n<li><strong>主要失败模式<\/strong>：研究与生产代码分叉、日志不可追溯、上线无回滚、告警无责任人、收益无法归因。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>只交付代码片段而没有输入、环境和运行说明；这不构成可复现产物。<\/li>\n<li>Python 与 R 使用不同默认参数或缺失值规则；跨语言对账必须逐列进行。<\/li>\n<li>把回测通过等同于可实盘；模拟交易、权限隔离、监控和故障恢复仍需独立验收。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>从干净环境可按 README 一次运行成功<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>输入校验和关键逻辑有自动测试<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>Python 与 R 输出在约定容差内一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>日志、监控、异常恢复和风险限制均有文档<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>模拟交易主要验证实时工程和执行一致性。<\/li>\n<li>理论、订单与持仓必须每日对账。<\/li>\n<li>从模拟交易到实盘交易应依据明确的运营与风险门槛。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>人为制造一次数据中断和一次重复成交回报，检查系统能否告警且不重复记账。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第100讲 策略监控与日志系统：亏钱的时候你得知道为什么<\/strong>。<\/p>"}, {"n": 100, "title": "策略监控与日志系统：亏钱的时候你得知道为什么", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。实盘交易部署会产生真实损失，必须经过授权、测试和独立风控。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>设计结构化日志、指标和告警。<\/li>\n<li>区分数据、模型、执行与账户故障。<\/li>\n<li>建立可追溯的故障处置流程。<\/li>\n<\/ul>\n<h2>亏钱时先回答“发生了什么”<\/h2>\n<p>没有日志，只能看净值猜原因。监控系统应让每笔决策从原始数据追溯到信号、风险检查、订单、成交和持仓。<\/p>\n<h2>四类监控<\/h2>\n<ul>\n<li><strong>数据<\/strong>：更新时间、缺失、异常、分布和供应商差异。<\/li>\n<li><strong>模型<\/strong>：特征漂移、信号分布、预测质量和版本。<\/li>\n<li><strong>执行<\/strong>：拒单、延迟、滑点、部分成交和撤单。<\/li>\n<li><strong>账户<\/strong>：现金、持仓、杠杆、盈亏和券商对账。<\/li>\n<\/ul>\n<h2>结构化日志<\/h2>\n<p>至少含时间、策略、版本、事件 ID、资产、输入摘要、信号、目标仓位、风控结果、订单和错误码。使用机器可查询格式而非只写自然语言。<\/p>\n<h2>告警设计<\/h2>\n<p>分信息、警告、严重等级；设置去重和升级，避免告警疲劳。严重事件应有自动降险或停机，但人工可查明触发原因。<\/p>\n<h2>复盘<\/h2>\n<p>每次事故记录时间线、影响、根因、临时处理和永久修复，并补自动测试。日志的目标不是留痕，而是缩短发现与恢复时间。<\/p>\n<h2>日志、指标与链路追踪各有职责<\/h2>\n<p>日志记录离散事件及上下文，例如一笔订单为何被拒；指标聚合随时间变化的数值，例如延迟、拒单率和风险暴露；链路追踪用同一事件 ID 串起行情、信号、风控、订单与成交。三者结合才能从异常告警追到具体原因。<\/p>\n<p>只打印自然语言日志不利于检索与统计；只看指标又无法还原单笔决策。生产系统应让每笔交易从最终持仓反向追溯到输入数据和代码版本。<\/p>\n<h2>一条结构化事件应包含什么<\/h2>\n<p>基础字段包括事件时间、接收时间、环境、策略与模型版本、运行和事件 ID、资产、事件类型、严重级别和结果状态。业务字段再包含输入摘要、信号、目标与当前仓位、风控规则、订单 ID、成交、费用和错误码。<\/p>\n<p>字段应有固定模式与单位，敏感信息和密钥不得写入日志。大体量原始特征可保存校验值与对象引用，而不是把所有数据重复写入每条记录。<\/p>\n<h2>监控从不变量开始<\/h2>\n<p>先监控必然应成立的关系：现金加持仓市值等于净值、成交数量不超过订单数量、同一事件不重复处理、仓位不越限、数据时间不倒退。然后再监控统计分布，如特征、信号、滑点和收益漂移。<\/p>\n<p>不变量破坏通常表示系统错误，应立即阻止新增风险；统计漂移则需要结合持续时间和多个证据诊断。<\/p>\n<h2>告警必须对应动作与负责人<\/h2>\n<p>每条告警定义触发条件、持续时间、严重度、通知对象、自动动作和升级时限。警告级可以复核或降频，严重级可能停止新订单、撤销未成交或切换安全模式。恢复通知同样重要，否则团队不知道系统是否回到正常状态。<\/p>\n<p>对重复告警做聚合，但不能把独立严重事件误合并。定期检查无响应、误报与漏报，淘汰没有行动价值的告警。<\/p>\n<h2>一次事故的标准处置链<\/h2>\n<p>发现后先限制影响范围并保存证据，再判断数据、模型、执行还是账户问题；随后按预案降级或停机，完成外部账户对账；恢复前在影子环境验证；最后记录根因、影响、时间线和永久修复，并为同类问题增加自动测试。<\/p>\n<p>复盘应关注系统为什么允许错误扩大，而不是寻找个人替罪。只有修复进入代码、监控或流程，复盘才真正闭环。<\/p>\n<h2>日志本身也需要治理<\/h2>\n<p>规定保存期限、访问权限、时钟同步、备份和完整性校验。关键交易日志应防止无痕修改，并能与代码版本、数据快照和审批记录关联。定期进行“给定一笔异常成交，能否在限定时间内还原全过程”的演练。<\/p>\n<h2>实战交付：让别人能够独立复现<\/h2>\n<p>围绕“策略监控与日志系统：亏钱的时候你得知道为什么”形成可交付的研究闭环。完工标准不是代码在作者电脑上运行过一次，而是另一位读者能按说明重建环境、运行测试并解释输出。<\/p>\n<ol>\n<li>冻结需求、输入字段、参数、信号时点、成本口径和输出结构。<\/li>\n<li>把数据校验、策略逻辑、账本、指标、日志和异常处理拆成可测试模块。<\/li>\n<li>使用同一份输入分别运行 Python 与 R，实现逐日结果与指标对账。<\/li>\n<li>保留 README、运行命令、测试记录、已知限制和上线前检查清单。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://docs.python.org/3/library/logging.html\">Python logging 官方文档<\/a>：结构化日志与严重级别的实现依据。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://doi.org/10.6028/NIST.AI.100-1\">NIST AI Risk Management Framework 1.0<\/a>：AI 系统的治理、映射、度量与管理。<\/li>\n<li><strong>适用条件与边界<\/strong>：平台回测结果取决于撮合、费率和数据实现；模拟交易仍不能完整复现实盘排队、冲击和故障。<\/li>\n<li><strong>主要失败模式<\/strong>：研究与生产代码分叉、日志不可追溯、上线无回滚、告警无责任人、收益无法归因。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>只交付代码片段而没有输入、环境和运行说明；这不构成可复现产物。<\/li>\n<li>Python 与 R 使用不同默认参数或缺失值规则；跨语言对账必须逐列进行。<\/li>\n<li>把回测通过等同于可实盘；模拟交易、权限隔离、监控和故障恢复仍需独立验收。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>从干净环境可按 README 一次运行成功<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>输入校验和关键逻辑有自动测试<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>Python 与 R 输出在约定容差内一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>日志、监控、异常恢复和风险限制均有文档<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>监控覆盖数据、模型、执行与账户四层。<\/li>\n<li>结构化日志让每笔交易可追溯。<\/li>\n<li>告警必须对应行动和升级机制。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为“目标仓位与券商持仓不一致”设计检测、告警、自动动作和人工处理手册。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第101讲 策略归因分析：你的收益究竟来自运气还是能力？<\/strong>。<\/p>"}, {"n": 101, "title": "策略归因分析：你的收益究竟来自运气还是能力？", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。实盘交易部署会产生真实损失，必须经过授权、测试和独立风控。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>区分收益归因与交易复盘。<\/li>\n<li>分解市场、行业、风格、选股和执行贡献。<\/li>\n<li>判断收益来自能力、风险还是偶然。<\/li>\n<\/ul>\n<h2>净收益不是单一来源<\/h2>\n<p>组合收益可能来自市场上涨、行业偏离、价值或动量暴露、个股选择、择时、杠杆和执行。归因把结果拆到可管理的决策层。<\/p>\n<h2>持仓归因<\/h2>\n<p>相对基准可分配、选择与交互效应；因子归因用市场、行业和风格回归解释收益。两者口径不同，可互相补充。<\/p>\n<h2>交易归因<\/h2>\n<p>比较决策价、到达价、实际成交价与后续价格，区分信号质量、延迟、市场冲击和显性交易费用。策略研究正确也可能被执行损耗。<\/p>\n<h2>运气与能力<\/h2>\n<p>看长期、多环境、样本外和重复决策。少数大额收益、意外 Beta 或单一行业贡献都降低“稳定能力”的证据。<\/p>\n<h2>归因闭环<\/h2>\n<p>将每个收益来源对应到负责人和可控动作：信号、组合、执行或风险。归因不是把所有误差归为“选股”，而是推动下一轮改进。<\/p>\n<h2>报告<\/h2>\n<p>按日、月和回撤期生成贡献，确保各部分加总回组合收益，并记录无法解释项。<\/p>\n<h2>先建立一条收益恒等式<\/h2>\n<p>最基本的账是：毛持仓收益，加现金与融资收益，减显性费用、价差、冲击和其他成本，等于净组合收益。相对基准时，再把基准收益与主动收益分开。所有细分归因最终必须能回加到总收益，无法解释项要单独显示。<\/p>\n<p>如果归因总和与账户收益对不上，应先修数据和账本，不要解释策略能力。<\/p>\n<h2>三层归因回答不同问题<\/h2>\n<p>资产与行业归因回答资金配置到哪里产生了收益；因子归因回答市场、规模、价值、动量或其他共同暴露解释了多少；信号归因回答各预测模块在组合约束前后贡献多少。三层可以并用，但不能把同一收益重复认领。<\/p>\n<p>归因模型自身也有假设。未被所选因子解释的残差不自动等于 Alpha，可能来自遗漏因子、非线性、数据误差或偶然。<\/p>\n<h2>持仓归因与交易归因要分开<\/h2>\n<p>持仓归因评价“持有什么”；交易归因评价“如何从旧持仓变成新持仓”。一笔正确的选股决策，若下单延迟、冲击过大或未成交，也可能没有兑现。<\/p>\n<p>执行可用决策时价格、订单到达市场价格、实际成交价格和后续基准价格分解延迟、冲击、费用与机会成本。未成交数量同样要进入归因，不能只分析已经成交的部分。<\/p>\n<h2>教学案例：看似选股，实为行业押注<\/h2>\n<p>假设组合跑赢基准，但超额收益大多来自长期高配一个上涨行业；行业内部选股贡献接近零。此时可以说组合的主动行业配置有效，不能说个股模型已经证明能力。如果该行业贡献又集中在一个短时期，证据还要进一步降低。<\/p>\n<p>这个案例说明归因不是给收益贴一个漂亮标签，而是识别真正承担风险和创造结果的决策。<\/p>\n<h2>怎样区分稳定能力与运气<\/h2>\n<p>观察贡献是否跨时间、市场状态和足够多独立决策重复出现，是否在样本外、成本后仍成立，以及是否符合事前机制。再检查收益集中度：少数证券、日期或一次事件贡献越大，越难把结果归为可重复能力。<\/p>\n<p>应报告贡献分布与不确定性，而不是只给累计数字。归因可以削弱某些能力叙事，却不能从有限样本中彻底证明运气或能力。<\/p>\n<h2>把归因变成管理闭环<\/h2>\n<p>每项偏差关联到可控层：信号问题由研究处理，约束挤压由组合管理处理，成交损耗由交易处理，意外暴露由风险处理。下一期报告追踪修复是否减少了相应损耗。<\/p>\n<p>同时保存事前预期贡献与事后实现贡献。长期偏离时，触发模型复核、容量调整或策略降级，而不是等待净值恶化才行动。<\/p>\n<h2>实战交付：让别人能够独立复现<\/h2>\n<p>围绕“策略归因分析：你的收益究竟来自运气还是能力？”形成可交付的研究闭环。完工标准不是代码在作者电脑上运行过一次，而是另一位读者能按说明重建环境、运行测试并解释输出。<\/p>\n<ol>\n<li>冻结需求、输入字段、参数、信号时点、成本口径和输出结构。<\/li>\n<li>把数据校验、策略逻辑、账本、指标、日志和异常处理拆成可测试模块。<\/li>\n<li>使用同一份输入分别运行 Python 与 R，实现逐日结果与指标对账。<\/li>\n<li>保留 README、运行命令、测试记录、已知限制和上线前检查清单。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.backtrader.com/docu/\">Backtrader 官方文档<\/a>：事件驱动回测框架的行为定义。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://docs.python.org/3/library/logging.html\">Python logging 官方文档<\/a>：结构化日志与严重级别的实现依据。<\/li>\n<li><strong>适用条件与边界<\/strong>：平台回测结果取决于撮合、费率和数据实现；模拟交易仍不能完整复现实盘排队、冲击和故障。<\/li>\n<li><strong>主要失败模式<\/strong>：研究与生产代码分叉、日志不可追溯、上线无回滚、告警无责任人、收益无法归因。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>只交付代码片段而没有输入、环境和运行说明；这不构成可复现产物。<\/li>\n<li>Python 与 R 使用不同默认参数或缺失值规则；跨语言对账必须逐列进行。<\/li>\n<li>把回测通过等同于可实盘；模拟交易、权限隔离、监控和故障恢复仍需独立验收。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>从干净环境可按 README 一次运行成功<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>输入校验和关键逻辑有自动测试<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>Python 与 R 输出在约定容差内一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>日志、监控、异常恢复和风险限制均有文档<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>收益应分解为系统性暴露、主动选择和执行。<\/li>\n<li>一次高收益不能区分能力与运气。<\/li>\n<li>归因必须加总一致并连接可行动决策。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>选择一个月收益，按市场、行业、风格、个股与成本分解并检查残差。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第102讲 策略上线前最后的检查清单，避免灾难性错误<\/strong>。<\/p>"}, {"n": 102, "title": "策略上线前最后的检查清单，避免灾难性错误", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。实盘交易部署会产生真实损失，必须经过授权、测试和独立风控。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>完成数据、模型、工程、风险和运营五类检查。<\/li>\n<li>明确上线批准与回滚条件。<\/li>\n<li>形成可签署的发布清单。<\/li>\n<\/ul>\n<h2>上线是风险事件<\/h2>\n<p>策略从研究进入真实账户后，错误会变成现金流。上线清单的作用是阻止“大家都以为别人检查过”。<\/p>\n<h2>数据<\/h2>\n<p>来源、许可、时区、复权、公告时间、缺失与备用源已确认；历史与实时字段一致；断流和异常能告警。<\/p>\n<h2>模型<\/h2>\n<p>代码锁定、无前视、样本外与稳健性通过；参数来源清楚；特征和预测有漂移阈值；已知失效环境记录。<\/p>\n<h2>执行<\/h2>\n<p>订单类型、最小单位、涨跌停、停牌、部分成交、重复回报、重启恢复和撤单已测试；交易成本与容量压力后仍可接受。<\/p>\n<h2>风险<\/h2>\n<p>单资产、行业、因子、杠杆、流动性、回撤和压力损失限额已配置；限额在独立层执行；紧急停机与减仓可用。<\/p>\n<h2>运营<\/h2>\n<p>权限最小化、密钥安全、时钟同步、监控值班、券商对账、版本发布和事故手册完备。<\/p>\n<h2>发布与回滚<\/h2>\n<p>采用小资金、少品种、分阶段放量；记录批准人、版本和生效时间。回滚到上一版本与清仓不是同一动作，都需预案。<\/p>\n<h2>最后问题<\/h2>\n<p>如果负责人今天无法上线，你能否仅凭文档安全运行和停止系统？若不能，项目还未准备好。<\/p>\n<h2>把检查项改成发布门禁<\/h2>\n<p>清单只有“是/否/不适用”、证据链接、检查人和批准人，才能阻止带病上线。关键项未通过时系统应拒绝发布，而不是在会议里口头承诺以后补。标记“不适用”也要写理由。<\/p>\n<p>研究、工程、交易和风险应分别签署自己负责的部分，避免同一作者既开发、又验收、又批准全部环节。<\/p>\n<h2>发布前做一次全链路演练<\/h2>\n<p>使用与生产相同的数据接口、调度、代码包和配置，在不发送真实订单的影子环境跑完整交易日。核对数据到达、信号、风控、订单意图、账本、告警与日终报告，再模拟重启和备用源切换。<\/p>\n<p>演练通过的是指定版本与环境；代码、参数或基础设施发生实质变化后，需要重新评估受影响门禁。<\/p>\n<h2>紧急停止要区分三种动作<\/h2>\n<p>“停止开新仓”保留现有头寸但不增加风险；“撤销未成交订单”阻止挂单继续成交；“平掉现有仓位”主动改变风险并可能造成冲击。这三种动作不能共用一个含糊的停机按钮。<\/p>\n<p>预案应规定各自触发条件、权限、执行顺序和无法成交时的处理。定期演练控制面，确认在主系统故障时仍能独立生效。<\/p>\n<h2>回滚代码不等于回滚市场状态<\/h2>\n<p>软件可以恢复到上一版本，账户持仓和已成交订单却不能自动回到过去。回滚前要读取真实账户状态，判断旧版本是否理解当前持仓与订单；必要时进入只减仓安全模式，而不是直接启动旧策略。<\/p>\n<p>数据库结构、特征版本和配置也要向后兼容。发布包应明确代码回滚、配置回滚、模型回滚和头寸处置是四项不同操作。<\/p>\n<h2>分阶段上线的证据阶梯<\/h2>\n<p>建议按影子运行、模拟交易、小资金少品种、受限扩大和正式规模逐级推进。每一级都有最短观察条件、最大风险、晋级指标和退回条件。观察条件应包含足够信号和异常事件，不只看运行天数。<\/p>\n<p>放量时同时评估成交冲击和容量，不能按小资金收益线性外推。<\/p>\n<h2>上线后的首日与首周计划<\/h2>\n<p>明确值班人、检查频率、关键仪表盘、账户对账时间和升级通道。首日重点核对订单与账本，首周关注数据与成本偏差；达到稳定条件后再转入常规监控。<\/p>\n<p>任何人工覆盖都要记录原因、批准人、有效期和恢复动作。临时修改若没有过期机制，最终会变成无人记得的永久规则。<\/p>\n<h2>最终签署包<\/h2>\n<p>签署包应包含策略说明、研究报告、数据与模型版本、代码提交、测试结果、压力与容量、监控面板、事故手册、权限表、发布计划、回滚演练和已知风险接受记录。未参与开发的人应能据此安全启动、观察、降级和停止系统。<\/p>\n<h2>实战交付：让别人能够独立复现<\/h2>\n<p>围绕“策略上线前最后的检查清单，避免灾难性错误”形成可交付的研究闭环。完工标准不是代码在作者电脑上运行过一次，而是另一位读者能按说明重建环境、运行测试并解释输出。<\/p>\n<ol>\n<li>冻结需求、输入字段、参数、信号时点、成本口径和输出结构。<\/li>\n<li>把数据校验、策略逻辑、账本、指标、日志和异常处理拆成可测试模块。<\/li>\n<li>使用同一份输入分别运行 Python 与 R，实现逐日结果与指标对账。<\/li>\n<li>保留 README、运行命令、测试记录、已知限制和上线前检查清单。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.backtrader.com/docu/\">Backtrader 官方文档<\/a>：事件驱动回测框架的行为定义。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://docs.python.org/3/library/logging.html\">Python logging 官方文档<\/a>：结构化日志与严重级别的实现依据。<\/li>\n<li><strong>适用条件与边界<\/strong>：平台回测结果取决于撮合、费率和数据实现；模拟交易仍不能完整复现实盘排队、冲击和故障。<\/li>\n<li><strong>主要失败模式<\/strong>：研究与生产代码分叉、日志不可追溯、上线无回滚、告警无责任人、收益无法归因。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>只交付代码片段而没有输入、环境和运行说明；这不构成可复现产物。<\/li>\n<li>Python 与 R 使用不同默认参数或缺失值规则；跨语言对账必须逐列进行。<\/li>\n<li>把回测通过等同于可实盘；模拟交易、权限隔离、监控和故障恢复仍需独立验收。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>从干净环境可按 README 一次运行成功<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>输入校验和关键逻辑有自动测试<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>Python 与 R 输出在约定容差内一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>日志、监控、异常恢复和风险限制均有文档<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>上线清单覆盖数据、模型、执行、风险和运营。<\/li>\n<li>发布应分阶段，并具有明确回滚与停机方案。<\/li>\n<li>职责、版本和批准必须可审计。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>把本讲清单转成表格，为每项填写证据链接、负责人、状态和阻塞原因。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第103讲 量化交易的十大经典谎言，你信过几个？<\/strong>。<\/p>"}]}, {"no": 11, "name": "破妄·避坑与心法", "desc": "最后四讲回归思想层面，帮你建立长期正确的量化价值观。", "chapters": [{"n": 103, "title": "量化交易的十大经典谎言，你信过几个？", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。任何模型、平台或自动化工具都不能消除亏损与运营风险。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>识别量化营销中的十类误导表述。<\/li>\n<li>用证据、口径和激励审查收益故事。<\/li>\n<li>建立产品与策略尽调问题。<\/li>\n<\/ul>\n<h2>谎言一：量化可以消除情绪<\/h2>\n<p>系统能减少临场冲动，但人仍会选择数据、参数、仓位和停机时点。情绪可能从下单环节转移到模型修改环节。<\/p>\n<h2>谎言二：回测收益就是可获得收益<\/h2>\n<p>真实世界有显性交易费用、滑点、市场冲击、容量、借券、延迟和无法成交。回测是条件模拟，不是可兑现报价。<\/p>\n<h2>谎言三：高胜率代表低风险<\/h2>\n<p>卖出尾部风险的策略可以长期高胜率、偶尔巨亏。必须同时看盈亏比、偏度和压力损失。<\/p>\n<h2>谎言四：复杂模型一定更先进<\/h2>\n<p>复杂度增加表达能力，也增加过拟合、解释和维护成本。只有样本外增量才能为复杂度买单。<\/p>\n<h2>谎言五：AI 会自动发现 Alpha<\/h2>\n<p>AI 学习的是数据中的模式，也会学习泄漏、口径和历史噪声。问题定义与数据治理仍由人负责。<\/p>\n<h2>谎言六：分散持有很多股票就安全<\/h2>\n<p>共同市场、行业和风格暴露会让证券数量很多、风险来源很少。应看风险贡献。<\/p>\n<h2>谎言七：止损保证最大亏损<\/h2>\n<p>跳空、停牌和流动性会让成交穿过止损价。止损是规则，不是保险合同。<\/p>\n<h2>谎言八：市场中性就没有风险<\/h2>\n<p>Beta 会漂移，相关会突变，杠杆和多空两侧都可能亏损。中性需要持续管理。<\/p>\n<h2>谎言九：历史更长一定更可靠<\/h2>\n<p>制度变化会让旧样本失去代表性。长度、质量和相关环境必须共同考虑。<\/p>\n<h2>谎言十：好策略可以永久保密并稳定复制<\/h2>\n<p>优势会因资金规模、竞争、成本和市场结构衰减。任何持续承诺都应接受容量与失效审查。<\/p>\n<h2>识别框架<\/h2>\n<p>遇到诱人表述，追问数据时间、样本外、交易成本、最坏回撤、实盘交易证据、容量、利益激励和失败条件。越回避这些问题，越需要谨慎。<\/p>\n<h2>“谎言”往往不是完全错误<\/h2>\n<p>最有迷惑性的说法通常包含一半真相。量化确实能减少临场冲动，但不能消除研究者偏见；AI 确实能搜索复杂模式，但也会学习泄漏；分散持仓确实可能降低个股风险，但共同因子会让组合仍然集中。<\/p>\n<p>审查时不要只判断一句话真假，而要问它省略了哪些前提、成本和失败条件。把“在特定数据和约束下观察到”偷换成“普遍保证”，才是误导发生的关键一步。<\/p>\n<h2>用五问拆解诱人承诺<\/h2>\n<ol>\n<li><strong>比较对象是什么<\/strong>：相对现金、市场基准还是某个较弱策略？<\/li>\n<li><strong>证据来自哪里<\/strong>：样本内、独立样本外、模拟盘还是真实成交？<\/li>\n<li><strong>遗漏了什么成本<\/strong>：费用、滑点、冲击、借券、税务和维护是否计入？<\/li>\n<li><strong>风险藏在哪里<\/strong>：杠杆、尾部、流动性、集中度和最大资金占用如何？<\/li>\n<li><strong>谁因这项结论获利<\/strong>：研究者、平台、销售者和投资者的激励是否一致？<\/li>\n<\/ol>\n<p>任何无法回答这些问题的收益数字，都只能作为线索，不能作为决策证据。<\/p>\n<h2>教学案例：把高胜率拆开<\/h2>\n<p>假设一个策略大多数月份赚取小额收益，少数月份出现巨大亏损。销售材料只展示胜率，会让人误以为风险低。完整审查应同时查看平均盈利、平均亏损、最差时期、偏度、保证金、无法退出情景和累计成本。<\/p>\n<p>若策略收益来源是持续卖出尾部保险，高胜率不是风险较小的证明，而可能正是尾部风险的表现形式。指标必须和损益结构一起解释。<\/p>\n<h2>识别“精确但不可复核”的包装<\/h2>\n<p>复杂公式、很多小数位和专业术语会制造精确感，却不一定增加证据。真正可复核的材料应给出数据口径、时间范围、交易明细、失败版本、参数选择过程和重现方式。只给最终曲线、不披露研究路径，无法判断多重试验与选择偏差。<\/p>\n<p>同样，“专有算法所以不能解释”不应成为免除风险说明的理由。即使不公开核心代码，也应说明数据类别、决策边界、压力表现、容量和停用规则。<\/p>\n<h2>一张策略尽调卡<\/h2>\n<p>尽调卡可分为六栏：机制假设、数据与时点、验证与基线、执行与容量、风险与最坏情景、治理与利益冲突。每栏标记已证实、仅陈述、无法核实和与证据矛盾。<\/p>\n<p>最终结论不是“相信或不相信一个故事”，而是决定需要补充什么证据、在什么风险限额下试用，或者因关键事实无法核实而拒绝。<\/p>\n<h2>最危险的信号是不能被证伪<\/h2>\n<p>若盈利被解释为模型有效，亏损被解释为“市场暂时失常”，无论发生什么都支持原结论，这套说法就失去了可检验性。一个合格策略必须事先说明哪些观察会削弱或推翻假设，以及谁有权据此降险或停用。<\/p>\n<h2>决策复盘：证据、边界与治理<\/h2>\n<p>面对“量化交易的十大经典谎言，你信过几个？”，最重要的能力是把叙事和证据分开。用下面的复盘框架检查一个结论是否可证伪、可追踪，并能在失效时及时退出。<\/p>\n<ol>\n<li>写出主张、证据来源、隐含假设和利益相关方。<\/li>\n<li>寻找反例、失败样本和替代解释，避免只收集支持材料。<\/li>\n<li>预先定义失效信号、观察窗口、暂停条件和重新启用条件。<\/li>\n<li>记录谁有权修改模型、覆盖规则或批准上线，并保留完整决策日志。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://papers.ssrn.com/sol3/papers.cfm?abstract_id=2326253\">Bailey 等：The Probability of Backtest Overfitting<\/a>：多重试验与回测过拟合的量化框架。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.aqr.com/Insights/Research/Journal-Article/How-Do-Factor-Premia-Vary-Over-Time-A-Century-of-Evidence\">AQR：How Do Factor Premia Vary Over Time?<\/a>：因子样本外衰减、时变性和择时边界。<\/li>\n<li><strong>适用条件与边界<\/strong>：策略失效可能来自统计波动、拥挤、制度变化或实现故障；需预先定义诊断和停用规则。<\/li>\n<li><strong>主要失败模式<\/strong>：用新故事解释每次亏损、只保留成功实验、无限追加参数，或因短期回撤否定长期假设。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用结果好坏替代过程判断；短期盈利也可能来自错误暴露或运气。<\/li>\n<li>失败后不断修改故事而不承认假设被推翻；应使用预先写下的判据。<\/li>\n<li>只讨论模型、不讨论组织和权限；许多灾难来自执行、监控和治理缺口。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>主张与证据可以逐条对应<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少记录一个反例和一种替代解释<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>失效、暂停与恢复条件已预先定义<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>关键人工决策具备权限控制和审计记录<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>量化减少部分人为偏差，但不消除判断与风险。<\/li>\n<li>收益宣传必须与数据口径、成本、容量和尾部一起看。<\/li>\n<li>最危险的谎言通常把条件性结果包装成确定承诺。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>找一段策略宣传，用本讲十项逐条标注其提供了什么证据、缺少什么证据。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第104讲 回测完美，实盘交易残酷——诊断模型失效的几大信号<\/strong>。<\/p>"}, {"n": 104, "title": "回测完美，实盘交易残酷——诊断模型失效的几大信号", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。任何模型、平台或自动化工具都不能消除亏损与运营风险。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>系统诊断回测与实盘交易差异。<\/li>\n<li>区分数据、执行、模型和容量问题。<\/li>\n<li>建立从告警到降险的排查顺序。<\/li>\n<\/ul>\n<h2>实盘交易差，不一定先怪模型<\/h2>\n<p>回测到实盘交易的差异可分四层。诊断应从最可验证的运营事实开始，避免一亏损就重新调参。<\/p>\n<h2>第一层：数据<\/h2>\n<p>检查字段、复权、时区、实时延迟、缺失、供应商修订和股票池。历史与实时口径不一致会直接改变信号。<\/p>\n<h2>第二层：执行<\/h2>\n<p>比较理论价、订单价和成交价，分析滑点、市场冲击、部分成交、拒单、借券和延迟。容量超出后，收益常随规模恶化。<\/p>\n<h2>第三层：实现<\/h2>\n<p>核对代码版本、参数、调度、状态恢复和持仓账本。研究代码与生产代码的细小差异可能长期累积。<\/p>\n<h2>第四层：模型<\/h2>\n<p>若前三层正常，再看特征分布、IC、因子暴露和市场状态。判断是正常回撤、优势衰减还是结构断裂。<\/p>\n<h2>几个失效信号<\/h2>\n<p>交易成本占毛收益持续上升；信号排序能力跨资产同步下降；风险暴露偏离；收益只靠意外 Beta；实盘交易偏差超过模拟交易区间；关键数据机制变化。<\/p>\n<h2>处置<\/h2>\n<p>先冻结扩仓和保护账户，再收集证据；按预案降险、影子运行和复盘。不要用新的历史参数解释刚发生的每一次损失。<\/p>\n<h2>先把“实盘差”写成可测偏差<\/h2>\n<p>不要只说实盘不如回测。应逐层定义差异：同一时点输入是否相同、信号是否相同、风险后目标仓位是否相同、订单与成交是否相同、费用和账户收益是否相同。只有定位第一处分叉，才知道该查哪一层。<\/p>\n<p>最终净值差异是多种偏差累积的结果，直接用它判断模型失效往往太晚，也无法归因。<\/p>\n<h2>一棵从事实开始的诊断树<\/h2>\n<p>第一步核对外部账户、现金和持仓，排除账本错误；第二步核对实时数据与历史研究口径；第三步比较理论订单与真实订单，测量延迟、拒单和滑点；第四步确认生产代码、参数与状态；只有前三步正常，才进入信号与市场机制诊断。<\/p>\n<p>这个顺序优先检查可以直接验证的事实，避免研究者在系统故障时重训模型，或在模型失效时只修接口。<\/p>\n<h2>用三个组合隔离问题<\/h2>\n<p>维护研究回放组合、实时影子组合和真实成交组合。研究回放使用已冻结代码与当时数据重算理论结果；影子组合接收实时数据但不下单；真实组合包含全部风控和执行。<\/p>\n<p>研究与影子不同，说明数据或实现不一致；影子与真实不同，说明风控、成交或容量问题；三者信号都下降，才更支持模型或市场机制变化。这种三角对照比事后猜测可靠。<\/p>\n<h2>正常回撤与结构失效怎样区分<\/h2>\n<p>正常回撤通常仍保持大致相似的信号排序、风险暴露和成本结构，只是结果落在历史或压力分布的不利区域。结构失效更可能表现为多项证据同步变化：特征关系翻转、跨资产排序消失、成本长期超过毛收益、容量快速下降或制度规则直接破坏交易机制。<\/p>\n<p>单一指标短期越线不足以证明失效，但多个相互独立的信号同时恶化，应提高处置等级。<\/p>\n<h2>防止“边诊断边污染证据”<\/h2>\n<p>出现亏损后不断换窗口、删除坏样本或新增过滤器，会让刚发生的实盘区间变成新的训练集。诊断期应冻结原模型，在影子环境测试明确假设；所有修改作为新版本重新走时间验证和批准流程。<\/p>\n<p>旧策略是否恢复与新策略是否上线，是两个不同决策，不能因新参数修复了历史曲线就立刻放大仓位。<\/p>\n<h2>分级处置表<\/h2>\n<p>数据或账本错误通常要求停止新增风险并修复对账；执行成本上升可先缩小订单、降低规模或改变节奏；模型证据减弱可降仓并延长观察；机制被制度变化破坏则应暂停或退役。每项动作都要规定负责人、证据保存、恢复条件和最长观察时间。<\/p>\n<p>诊断的目标不是尽快给亏损找到故事，而是保护账户，并以最少新假设确定问题在哪一层。<\/p>\n<h2>决策复盘：证据、边界与治理<\/h2>\n<p>面对“回测完美，实盘交易残酷——诊断模型失效的几大信号”，最重要的能力是把叙事和证据分开。用下面的复盘框架检查一个结论是否可证伪、可追踪，并能在失效时及时退出。<\/p>\n<ol>\n<li>写出主张、证据来源、隐含假设和利益相关方。<\/li>\n<li>寻找反例、失败样本和替代解释，避免只收集支持材料。<\/li>\n<li>预先定义失效信号、观察窗口、暂停条件和重新启用条件。<\/li>\n<li>记录谁有权修改模型、覆盖规则或批准上线，并保留完整决策日志。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://papers.ssrn.com/sol3/papers.cfm?abstract_id=2326253\">Bailey 等：The Probability of Backtest Overfitting<\/a>：多重试验与回测过拟合的量化框架。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.aqr.com/Insights/Research/Journal-Article/How-Do-Factor-Premia-Vary-Over-Time-A-Century-of-Evidence\">AQR：How Do Factor Premia Vary Over Time?<\/a>：因子样本外衰减、时变性和择时边界。<\/li>\n<li><strong>适用条件与边界<\/strong>：策略失效可能来自统计波动、拥挤、制度变化或实现故障；需预先定义诊断和停用规则。<\/li>\n<li><strong>主要失败模式<\/strong>：用新故事解释每次亏损、只保留成功实验、无限追加参数，或因短期回撤否定长期假设。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用结果好坏替代过程判断；短期盈利也可能来自错误暴露或运气。<\/li>\n<li>失败后不断修改故事而不承认假设被推翻；应使用预先写下的判据。<\/li>\n<li>只讨论模型、不讨论组织和权限；许多灾难来自执行、监控和治理缺口。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>主张与证据可以逐条对应<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少记录一个反例和一种替代解释<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>失效、暂停与恢复条件已预先定义<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>关键人工决策具备权限控制和审计记录<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>诊断顺序应是数据、执行、实现、模型。<\/li>\n<li>正常回撤与结构失效需要统计和机制证据区分。<\/li>\n<li>先保护账户，再修改模型。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>制作一张实盘交易偏差排查树，为每个节点定义证据、负责人和最大处理时间。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第105讲 何时该坚持，何时该放弃一个策略？<\/strong>。<\/p>"}, {"n": 105, "title": "何时该坚持，何时该放弃一个策略？", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。任何模型、平台或自动化工具都不能消除亏损与运营风险。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>建立坚持、降险、暂停和退役的分级标准。<\/li>\n<li>区分结果波动与机制破坏。<\/li>\n<li>避免沉没成本和短期追逐。<\/li>\n<\/ul>\n<h2>坚持不是忍耐，放弃也不是止损冲动<\/h2>\n<p>正期望策略会亏损，失效策略也会偶尔反弹。决策应基于事先定义的证据，而不是最近盈亏带来的情绪。<\/p>\n<h2>四类证据<\/h2>\n<ul>\n<li><strong>统计<\/strong>：回撤、命中、IC 和成本是否仍在预期分布。<\/li>\n<li><strong>经济<\/strong>：优势来源与对手方行为是否仍存在。<\/li>\n<li><strong>市场结构<\/strong>：规则、参与者、技术或容量是否改变。<\/li>\n<li><strong>运营<\/strong>：数据和执行是否可靠。<\/li>\n<\/ul>\n<h2>四级动作<\/h2>\n<ol>\n<li><strong>继续<\/strong>：表现处于预期范围，机制与运营正常。<\/li>\n<li><strong>降险<\/strong>：证据减弱但未破坏，减少仓位并加强观察。<\/li>\n<li><strong>暂停<\/strong>：偏差超限或原因不明，影子组合继续运行。<\/li>\n<li><strong>退役<\/strong>：机制消失、成本吞噬优势或无法安全执行。<\/li>\n<\/ol>\n<h2>常见错误<\/h2>\n<p>因短期亏损停掉所有趋势策略，属于结果追逐；因投入多年拒绝退役，属于沉没成本；看到新参数修复历史后立即恢复，则是二次过拟合。<\/p>\n<h2>预先承诺<\/h2>\n<p>研究阶段就写下预期回撤、监控指标、评审周期和决策权限。退役后保留代码与日志，防止同一失败想法换名重来。<\/p>\n<h2>给策略建立一份生命周期契约<\/h2>\n<p>上线前记录优势机制、适用市场、预期收益与风险范围、已知弱点、容量、关键数据依赖、评审频率和所有权人。再为继续、降险、暂停和退役分别写触发证据。<\/p>\n<p>契约的价值是在亏损尚未发生时固定判断标准，减少团队被近期盈亏和沉没成本牵引。阈值不是永恒真理，但修改必须有新证据、审批和版本记录。<\/p>\n<h2>结果证据与机制证据要分开<\/h2>\n<p>净值下降是结果证据，信号与未来收益关系消失、对手方行为变化或制度规则改变则更接近机制证据。结果短期不佳但机制与运营正常，可能值得以原风险预算继续；结果尚可但机制已经靠意外 Beta 支撑，反而应提前警惕。<\/p>\n<p>决策表应同时列出统计、经济、结构与运营四类证据，避免一条漂亮或难看的曲线独占结论。<\/p>\n<h2>教学情境：同样回撤，不同动作<\/h2>\n<p>策略甲出现历史范围内的回撤，数据与成交正常，信号在多个市场仍保持方向，适合继续或小幅降险。策略乙回撤幅度相似，但关键数据源改变定义、成本超过毛收益且排序能力跨资产消失，更适合暂停调查。<\/p>\n<p>同样的结果不应触发同样动作，因为根因与未来风险不同。<\/p>\n<h2>四级动作要配套恢复规则<\/h2>\n<p>继续并不代表忽略，应保持原监控；降险要定义目标仓位和观察期限；暂停后用影子组合保留未受真实交易影响的证据；退役则停止风险暴露、完成持仓处置、归档并撤销不再需要的权限和任务。<\/p>\n<p>若暂停策略恢复，应先确认数据与执行正常，再验证机制指标，随后以有限仓位重启。仅仅“净值在影子盘反弹”不一定足够，因为反弹可能来自同一噪声。<\/p>\n<h2>可逆决策与不可逆损失<\/h2>\n<p>信息不足时优先选择可逆动作：降低仓位、停止扩张、延长观察，而不是立即彻底删除系统或反向押注。可逆性给团队争取诊断时间；但当存在账户安全、合规或不可控尾部风险时，应先停止暴露，不能用收集更多数据作为拖延理由。<\/p>\n<p>决策强度应与潜在损失和证据确定性共同匹配。<\/p>\n<h2>退役不是失败记录的删除<\/h2>\n<p>退役包应保存假设、数据与代码版本、全部试验、上线表现、事故、退役原因和未来重新评估条件。这样既防止同一失败想法改名重来，也能区分“机制永久破坏”与“当前容量或成本暂不允许”。<\/p>\n<p>团队还应定期复盘幸存者偏差：当前运行策略只是全部研究的一小部分，不能只用幸存者表现评价研究能力。<\/p>\n<h2>决策会议只回答四个问题<\/h2>\n<p>当前偏差是否超过事前范围？最可信的根因在哪一层？若判断错误，继续与停止各自的损失是什么？下一动作需要什么证据才能升级或恢复？围绕这四问形成书面记录，比争论“有没有信心”更有效。<\/p>\n<h2>决策复盘：证据、边界与治理<\/h2>\n<p>面对“何时该坚持，何时该放弃一个策略？”，最重要的能力是把叙事和证据分开。用下面的复盘框架检查一个结论是否可证伪、可追踪，并能在失效时及时退出。<\/p>\n<ol>\n<li>写出主张、证据来源、隐含假设和利益相关方。<\/li>\n<li>寻找反例、失败样本和替代解释，避免只收集支持材料。<\/li>\n<li>预先定义失效信号、观察窗口、暂停条件和重新启用条件。<\/li>\n<li>记录谁有权修改模型、覆盖规则或批准上线，并保留完整决策日志。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://papers.ssrn.com/sol3/papers.cfm?abstract_id=2326253\">Bailey 等：The Probability of Backtest Overfitting<\/a>：多重试验与回测过拟合的量化框架。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.aqr.com/Insights/Research/Journal-Article/How-Do-Factor-Premia-Vary-Over-Time-A-Century-of-Evidence\">AQR：How Do Factor Premia Vary Over Time?<\/a>：因子样本外衰减、时变性和择时边界。<\/li>\n<li><strong>适用条件与边界<\/strong>：策略失效可能来自统计波动、拥挤、制度变化或实现故障；需预先定义诊断和停用规则。<\/li>\n<li><strong>主要失败模式<\/strong>：用新故事解释每次亏损、只保留成功实验、无限追加参数，或因短期回撤否定长期假设。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用结果好坏替代过程判断；短期盈利也可能来自错误暴露或运气。<\/li>\n<li>失败后不断修改故事而不承认假设被推翻；应使用预先写下的判据。<\/li>\n<li>只讨论模型、不讨论组织和权限；许多灾难来自执行、监控和治理缺口。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>主张与证据可以逐条对应<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少记录一个反例和一种替代解释<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>失效、暂停与恢复条件已预先定义<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>关键人工决策具备权限控制和审计记录<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>坚持与放弃都应由统计、机制、结构和运营证据驱动。<\/li>\n<li>分级动作比只有运行/关闭两个按钮更稳健。<\/li>\n<li>阈值和权限应在亏损前定义。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为一个策略写四级决策表，每级包含触发条件、仓位、观察期和审批人。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第106讲 量化的未来：AI进化、监管冲击与你的个人位置<\/strong>。<\/p>"}, {"n": 106, "title": "量化的未来：AI进化、监管冲击与你的个人位置", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。任何模型、平台或自动化工具都不能消除亏损与运营风险。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>从能力、市场结构和治理理解量化未来。<\/li>\n<li>识别 AI 提升效率与放大风险的两面。<\/li>\n<li>制定个人长期学习与定位路线。<\/li>\n<\/ul>\n<h2>未来不是“人或 AI”二选一<\/h2>\n<p>AI 会降低代码、研究检索、特征构造和报告生成门槛，让更多人能建立自动化流程。门槛下降后，简单公开信号会更快拥挤，差异转向独有数据、问题定义、执行、风险与组织纪律。<\/p>\n<h2>模型将更像系统而非单点预测<\/h2>\n<p>未来竞争不只是哪个模型精度更高，而是谁能把数据血缘、研究、组合、执行、监控和审计连成可靠闭环。可重现、可解释和可停止与预测能力同样重要。<\/p>\n<h2>AI 的新风险<\/h2>\n<p>模型可能生成看似合理但错误的代码与解释；代理自动调用数据和交易接口，会放大权限、提示注入、供应链和错误执行风险。关键操作需要最小权限、人工批准、隔离测试和完整日志。<\/p>\n<h2>监管与治理方向<\/h2>\n<p>随着自动化程度提高，机构会更重视数据授权、模型验证、决策留痕、责任划分、市场公平和系统稳定。具体规则会随市场变化，但“谁批准、为何决策、如何停止”将越来越重要。<\/p>\n<h2>个人的位置<\/h2>\n<p>不必与大型机构拼算力和速度。可以选择长周期、小容量、细分领域、透明工具或服务真实业务流程。长期稀缺能力包括：金融机制理解、数据工程、统计判断、软件可靠性和风险沟通。<\/p>\n<h2>一条可持续路线<\/h2>\n<ol>\n<li>能把模糊观点写成可证伪假设。<\/li>\n<li>能独立核对数据与回测时点。<\/li>\n<li>能把信号变成有约束组合。<\/li>\n<li>能运行、监控、归因并安全停止系统。<\/li>\n<li>能诚实说明模型不知道什么。<\/li>\n<\/ol>\n<h2>课程终点<\/h2>\n<p>106 讲不是为了收集更多指标，而是建立一套面对不确定性的工作方法：先定义问题，再寻找证据；先保证生存，再追求收益；让机器执行纪律，让人承担判断与责任。<\/p>\n<h2>AI 改变的是研究生产函数<\/h2>\n<p>过去需要大量时间完成的资料检索、代码原型、数据清洗、测试生成和报告整理，会越来越容易自动化。结果不是研究纪律变得不重要，而是试验速度提高后，多重检验、错误传播和权限风险也更快累积。<\/p>\n<p>当生成一个策略只需几分钟，稀缺能力就从“能否写出代码”转向“能否提出值得检验的问题、识别无效证据，并把系统安全地运行起来”。<\/p>\n<h2>人与 AI 的责任边界<\/h2>\n<p>AI 可以提出候选假设、生成代码、检查格式和监控异常；人仍需对数据授权、经济含义、风险预算、部署批准和实际损失负责。高影响动作应遵守最小权限、隔离环境、双人复核和完整审计。<\/p>\n<p>尤其不能把“模型建议”当作责任主体。系统必须明确谁批准数据接入、谁接受模型风险、谁能停止交易，以及事故发生后由谁协调处置。<\/p>\n<h2>从单模型风险走向代理系统风险<\/h2>\n<p>当 AI 能自动调用数据、代码、云服务和交易接口，风险链会跨越提示、外部内容、工具权限、依赖软件和账户状态。错误可能不是一个预测不准，而是读取了恶意内容、调用了错误工具、泄露敏感数据或连续执行错误订单。<\/p>\n<p>防线应包括输入来源校验、工具白名单、最小账户权限、金额与频率上限、沙箱、人工批准、输出验证和紧急停止。自动化程度越高，控制面越要独立于模型本身。<\/p>\n<h2>未来竞争更像系统工程<\/h2>\n<p>公开模型与通用算力会降低部分技术门槛，但可靠数据血缘、可复现研究、组合约束、低成本执行、容量管理和事故恢复仍难复制。单次预测领先可能很快消失，稳定运营与诚实治理更能形成长期差异。<\/p>\n<p>这也意味着小团队不必复制大型机构的全部基础设施，而应选择与自身资金、频率和信息优势匹配的战场。<\/p>\n<h2>个人能力可以画成五层栈<\/h2>\n<p>第一层是市场与会计语言，能理解资产、现金流和交易规则；第二层是数据与统计，能识别时点、偏差和不确定性；第三层是代码与工程，能构建测试、版本和可恢复系统；第四层是组合与风险，能把预测变成受约束决策；第五层是治理与沟通，能解释边界、记录责任并在必要时说“不上线”。<\/p>\n<p>AI 可以放大每一层的效率，却不能替代这五层之间的判断与责任连接。<\/p>\n<h2>一条可持续的练习路线<\/h2>\n<p>选一个简单策略，先用固定小样本手算；再建立无前视回测和样本外验证；随后加入成本、组合约束和压力测试；再运行影子或模拟盘，完成日志、对账和故障演练；最后写一份包含失败条件与回滚方式的上线评审。<\/p>\n<p>每次只增加一层复杂度，并保留简单基线。完成一个可复现闭环，比收集十个无法解释的模型更接近真正能力。<\/p>\n<h2>面对未来变化的三条不变原则<\/h2>\n<p>第一，任何预测都要回到当时可得的信息；第二，任何收益都要同时说明成本、风险和容量；第三，任何自动化系统都必须可观察、可限制、可停止。工具和监管会变化，这三条原则仍能帮助判断新技术是否真正增加价值。<\/p>\n<h2>从课程终点回到第一问<\/h2>\n<p>完成 106 讲后，最重要的不是记住所有公式，而是形成一条反复可用的工作主线：把故事改写为假设，把假设改写为数据与规则，用时间样本外和现实约束检验，再以监控、归因和停用条件管理未知。<\/p>\n<p>量化不会消除不确定性。它真正提供的是一种更诚实地面对不确定性、并让错误更早暴露的方法。<\/p>\n<h2>决策复盘：证据、边界与治理<\/h2>\n<p>面对“量化的未来：AI进化、监管冲击与你的个人位置”，最重要的能力是把叙事和证据分开。用下面的复盘框架检查一个结论是否可证伪、可追踪，并能在失效时及时退出。<\/p>\n<ol>\n<li>写出主张、证据来源、隐含假设和利益相关方。<\/li>\n<li>寻找反例、失败样本和替代解释，避免只收集支持材料。<\/li>\n<li>预先定义失效信号、观察窗口、暂停条件和重新启用条件。<\/li>\n<li>记录谁有权修改模型、覆盖规则或批准上线，并保留完整决策日志。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://papers.ssrn.com/sol3/papers.cfm?abstract_id=2326253\">Bailey 等：The Probability of Backtest Overfitting<\/a>：多重试验与回测过拟合的量化框架。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.aqr.com/Insights/Research/Journal-Article/How-Do-Factor-Premia-Vary-Over-Time-A-Century-of-Evidence\">AQR：How Do Factor Premia Vary Over Time?<\/a>：因子样本外衰减、时变性和择时边界。<\/li>\n<li><strong>适用条件与边界<\/strong>：策略失效可能来自统计波动、拥挤、制度变化或实现故障；需预先定义诊断和停用规则。<\/li>\n<li><strong>主要失败模式<\/strong>：用新故事解释每次亏损、只保留成功实验、无限追加参数，或因短期回撤否定长期假设。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用结果好坏替代过程判断；短期盈利也可能来自错误暴露或运气。<\/li>\n<li>失败后不断修改故事而不承认假设被推翻；应使用预先写下的判据。<\/li>\n<li>只讨论模型、不讨论组织和权限；许多灾难来自执行、监控和治理缺口。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>主张与证据可以逐条对应<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少记录一个反例和一种替代解释<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>失效、暂停与恢复条件已预先定义<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>关键人工决策具备权限控制和审计记录<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>AI 会降低工具门槛，也会加速公开优势衰减。<\/li>\n<li>未来量化核心是完整、可治理的决策系统。<\/li>\n<li>个人优势可来自细分问题、长周期、可靠工程与风险纪律。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>写一份未来两年的个人路线图：一个金融机制、一个数据能力、一个工程能力和一个可上线项目，并为每项定义可验证产出。<\/p>"}]}]</script>
<script>
const BOOK = JSON.parse(document.getElementById('book-data').textContent);
const flat = [];
const byNo = {};
BOOK.forEach(m => m.chapters.forEach(c => {
  c.moduleNo = m.no; c.moduleName = m.name;
  flat.push(c); byNo[c.n] = c;
}));

const $ = s => document.querySelector(s);
const views = { cover: $('#view-cover'), toc: $('#view-toc'), reader: $('#view-reader') };
const readerScroll = $('#reader-scroll');
let current = null;

/* ---- 主题 ---- */
const THEME_KEY = 'q100:theme';
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  $('#theme-toggle').textContent = t === 'night' ? '日间' : '夜间';
}
applyTheme(localStorage.getItem(THEME_KEY) || 'day');
$('#theme-toggle').onclick = () => {
  const t = document.documentElement.getAttribute('data-theme') === 'night' ? 'day' : 'night';
  localStorage.setItem(THEME_KEY, t); applyTheme(t);
};

/* ---- 目录渲染 ---- */
function renderTOC(){
  const el = $('#toc-list'); let h = '';
  BOOK.forEach(m => {
    h += '<div class="toc-mod"><div class="toc-mod-head">'
      + '<span class="toc-mod-no">' + (m.no ? '模块 ' + String(m.no).padStart(2,'0') : '卷首') + '</span>'
      + '<span class="toc-mod-name">' + esc(m.name) + '</span></div>';
    if (m.desc) h += '<div class="toc-mod-desc">' + esc(m.desc) + '</div>';
    m.chapters.forEach(c => {
      const label = c.front ? c.title : '第' + String(c.n).padStart(3,'0') + '讲';
      h += '<a class="toc-ch" href="#ch-' + c.n + '"><span class="cno">'
        + label + '</span><span class="ctt">' + esc(c.title) + '</span></a>';
    });
    h += '</div>';
  });
  el.innerHTML = h;

  const d = $('#drawer-list'); let dh = '';
  BOOK.forEach(m => {
    dh += '<div class="drawer-mod">' + (m.no ? '模块 ' + String(m.no).padStart(2,'0') + ' · ' : '') + esc(m.name) + '</div>';
    m.chapters.forEach(c => {
      const label = c.front ? c.title : String(c.n).padStart(3,'0');
      dh += '<a class="drawer-ch" data-n="' + c.n + '" href="#ch-' + c.n + '"><span class="cno">'
        + label + '</span><span class="ctt">' + esc(c.title) + '</span></a>';
    });
  });
  d.innerHTML = dh;
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---- 章节渲染 ---- */
function renderChapter(n){
  const c = byNo[n]; if (!c) return;
  current = c;
  const open = c.front
    ? '<header class="chapter-opener"><div class="op-module">卷首</div><h1 class="op-title">' + esc(c.title) + '</h1></header>'
    : '<header class="chapter-opener">'
      + '<div class="op-module">模块 ' + String(c.moduleNo).padStart(2,'0') + ' · ' + esc(c.moduleName) + '</div>'
      + '<div class="op-no">第 <b>' + String(c.n).padStart(3,'0') + '</b> 讲</div>'
      + '<h1 class="op-title">' + esc(c.title) + '</h1>'
      + '</header>';
  $('#page').innerHTML = open + '<div class="chapter-body">' + c.html + '</div>';
  $('#topbar-title').textContent = c.front ? c.title : '第 ' + String(c.n).padStart(3,'0') + ' 讲 · ' + c.title;

  const i = flat.indexOf(c), prev = flat[i-1], next = flat[i+1];
  $('#chapnav').innerHTML =
    '<button class="btn" id="nav-prev" ' + (prev?'':'disabled') + '><span class="nav-label">上一讲</span>'
      + '<span class="nav-title">' + (prev ? esc(prev.title) : '已是第一讲') + '</span></button>'
    + '<button class="btn" id="nav-toc"><span class="nav-label">返回</span><span class="nav-title">目录</span></button>'
    + '<button class="btn" id="nav-next" ' + (next?'':'disabled') + '><span class="nav-label">下一讲</span>'
      + '<span class="nav-title">' + (next ? esc(next.title) : '已是最后一讲') + '</span></button>';
  if (prev) $('#nav-prev').onclick = () => go(prev.n);
  if (next) $('#nav-next').onclick = () => go(next.n);
  $('#nav-toc').onclick = () => location.hash = '#toc';

  document.querySelectorAll('.drawer-ch').forEach(a =>
    a.classList.toggle('active', +a.dataset.n === n));

  readerScroll.scrollTop = 0;
  updateProgress();
  localStorage.setItem('q100:last', n);
}

function updateProgress(){
  const max = readerScroll.scrollHeight - readerScroll.clientHeight;
  const p = max > 0 ? Math.min(100, Math.round(readerScroll.scrollTop / max * 100)) : 0;
  $('#read-progress-bar').style.width = p + '%';
  $('#read-percent').textContent = p + '%';
}
readerScroll.addEventListener('scroll', updateProgress, { passive: true });
window.addEventListener('resize', updateProgress);

/* ---- 视图切换 / 路由 ---- */
function show(name){
  Object.values(views).forEach(v => v.classList.remove('active'));
  views[name].classList.add('active');
}
function go(n){ location.hash = '#ch-' + n; }
function route(){
  const h = location.hash;
  if (h.indexOf('#ch-') === 0){
    const n = decodeURIComponent(h.slice(4));
    if (byNo[n]) { show('reader'); renderChapter(n); closeDrawer(); return; }
  }
  if (h === '#toc'){ show('toc'); window.scrollTo(0,0); return; }
  show('cover'); window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);

/* ---- 顶部/封面按钮 ---- */
$('#start-read').onclick = () => {
  const last = localStorage.getItem('q100:last');
  go(byNo[last] ? last : flat[0].n);
};
$('#goto-toc').onclick = () => location.hash = '#toc';
$('#toc-back').onclick = () => location.hash = '#cover';

/* ---- 侧栏 ---- */
function openDrawer(){ $('#drawer').classList.add('open'); $('#scrim').classList.add('open'); }
function closeDrawer(){ $('#drawer').classList.remove('open'); $('#scrim').classList.remove('open'); }
$('#open-drawer').onclick = openDrawer;
$('#close-drawer').onclick = closeDrawer;
$('#scrim').onclick = closeDrawer;

/* ---- 键盘翻页 ---- */
document.addEventListener('keydown', e => {
  if (!views.reader.classList.contains('active')) return;
  if (e.key === 'Escape') closeDrawer();
  if (e.target.tagName === 'INPUT') return;
  const i = flat.indexOf(current);
  if (e.key === 'ArrowRight' && flat[i+1]) go(flat[i+1].n);
  if (e.key === 'ArrowLeft' && flat[i-1]) go(flat[i-1].n);
});

/* ---- 启动 ---- */
renderTOC();
const last = localStorage.getItem('q100:last');
if (byNo[last]){
  const saved = byNo[last];
  $('#start-read').textContent = saved.front ? '继续阅读 · ' + saved.title : '继续阅读 · 第' + String(last).padStart(3,'0') + '讲';
}
route();
</script>
</body>
</html>
