<style>
:root{

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{

  font-family:var(--serif);

}
button{font-family:var(--sans); cursor:pointer}

}
.cover-inner{width:min(100%,44rem); text-align:center}

}
.cover-frame::before,.cover-frame::after{
  content:""; position:absolute; width:26px; height:26px; border:1px solid var(--accent); opacity:.55;
}

.cover-frame::after{bottom:14px;right:14px;border-left:0;border-top:0}

}

}
.cover-100{color:var(--accent); font-family:var(--sans); font-weight:800}
.cover-rule{width:64px;height:2px;background:var(--accent);margin:1.7rem auto;border-radius:2px}
.cover-sub{font-size:clamp(1.05rem,2.6vw,1.35rem); color:var(--ink-soft); margin:0 0 1.1rem; letter-spacing:.04em}
.cover-desc{
  font-size:.95rem; line-height:2; color:var(--ink-faint); margin:0 auto 2rem; max-width:32rem;
}
.cover-by{font-family:var(--sans);font-size:.86rem;letter-spacing:.16em;color:var(--ink-soft);margin:0 0 1.7rem}
.cover-meta{

}
.cover-meta span{position:relative; padding-left:1rem}
.cover-meta span::before{content:"";position:absolute;left:0;top:50%;width:4px;height:4px;border-radius:50%;background:var(--accent);transform:translateY(-50%)}

.btn{
  font-size:.92rem; padding:.72rem 1.7rem; border-radius:999px;
  border:1px solid var(--rule); background:transparent; color:var(--ink);
  transition:.18s; letter-spacing:.03em;
}
.btn:hover{border-color:var(--accent); color:var(--accent)}
.btn-primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn-primary:hover{opacity:.9; color:#fff}

.toc-head .btn-ghost{position:absolute;left:0;top:0}

.toc-mod{margin-bottom:2.6rem;padding-bottom:1.4rem;border-bottom:1px solid var(--rule)}

.toc-mod-no{

}
.toc-mod-name{font-size:1.25rem;font-weight:700;letter-spacing:.04em}
.toc-mod-desc{font-size:.86rem;color:var(--ink-faint);line-height:1.9;margin:.5rem 0 1rem}
.toc-ch{

  text-decoration:none;color:var(--ink);transition:.14s;
}
.toc-ch:hover{background:var(--accent-soft)}
.toc-ch .cno{font-family:var(--sans);font-size:.78rem;color:var(--ink-faint);min-width:3.6rem;letter-spacing:.04em}
.toc-ch .ctt{font-size:.98rem;line-height:1.7}

/* ---------- 阅读器 ---------- */
.topbar{
  display:flex;align-items:center;gap:1rem;padding:.7rem clamp(1rem,4vw,1.6rem);
  border-bottom:1px solid var(--rule);background:var(--paper);position:relative;z-index:5;
}
.icon-btn{
  font-family:var(--sans);font-size:.84rem;color:var(--ink-soft);background:transparent;

}
.icon-btn:hover{color:var(--accent);border-color:var(--rule)}
.topbar-title{flex:1;text-align:center;font-family:var(--sans);font-size:.84rem;color:var(--ink-faint);

.topbar-right{display:flex;align-items:center;gap:.4rem}

.read-progress div{height:100%;width:0;background:var(--accent);transition:width .12s linear}
.reader-scroll{flex:1;overflow-y:auto;overflow-x:hidden}

.op-module{font-family:var(--sans);font-size:.76rem;letter-spacing:.22em;color:var(--accent);margin-bottom:1.5rem}
.op-no{font-family:var(--sans);font-size:.9rem;color:var(--ink-faint);letter-spacing:.3em;margin-bottom:.6rem}
.op-no b{font-size:1.6rem;color:var(--ink);letter-spacing:0;vertical-align:-.12em}

  font-family:var(--sans);display:block;overflow-x:auto;
}
.chapter-body th,.chapter-body td{border:1px solid var(--rule);padding:.6rem .8rem;text-align:left;line-height:1.7}
.chapter-body th{background:var(--paper-2);font-weight:600}
.chapter-body hr{border:0;border-top:1px solid var(--rule);margin:2.4rem 0}
.chapter-body img{max-width:100%;border-radius:6px}

.chapnav{
  max-width:var(--measure);margin:1.5rem auto 4rem;padding:1.6rem 1.4rem 0;
  border-top:1px solid var(--rule);display:flex;gap:.8rem;

.chapnav .btn{flex:1;text-align:center;font-size:.86rem;padding:.7rem .6rem}
.chapnav .btn[disabled]{opacity:.35;cursor:default}

.chapnav .nav-label{display:block;font-size:.68rem;color:var(--ink-faint);letter-spacing:.12em;margin-bottom:.3rem}

/* ---------- 侧栏目录 ---------- */
.drawer{
  position:fixed;top:0;left:0;height:100%;width:min(84vw,22rem);z-index:30;
  background:var(--paper);border-right:1px solid var(--rule);
  transform:translateX(-102%);transition:transform .28s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;

.drawer.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.18)}
.drawer-head{
  display:flex;align-items:center;justify-content:space-between;padding:.9rem 1.1rem;
  border-bottom:1px solid var(--rule);font-family:var(--sans);letter-spacing:.14em;color:var(--ink-soft);

.drawer-list{overflow-y:auto;padding:1rem 1rem 3rem;flex:1}
.drawer-mod{font-family:var(--sans);font-size:.76rem;color:var(--accent);letter-spacing:.1em;margin:1.2rem .4rem .5rem;font-weight:700}
.drawer-ch{
  display:flex;gap:.6rem;padding:.42rem .5rem;border-radius:6px;text-decoration:none;color:var(--ink-soft);
  font-size:.9rem;line-height:1.6;font-family:var(--sans);
}
.drawer-ch:hover{background:var(--accent-soft);color:var(--ink)}
.drawer-ch.active{background:var(--accent-soft);color:var(--accent)}
.drawer-ch .cno{color:var(--ink-faint);min-width:2.4rem;font-size:.8rem}
.drawer-ch .ctt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scrim{
  position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;opacity:0;visibility:hidden;transition:.25s;
}
.scrim.open{opacity:1;visibility:visible}

@media(max-width:560px){
  .chapter-body{font-size:1.02rem}
  .topbar-title{font-size:.78rem}
  .toc-head .btn-ghost{position:static;display:block;margin:0 auto 1rem}
}
</style>

<script id="book-data" type="application/json">[{"no": 0, "name": "卷首", "desc": "写作缘起、阅读方法与作者介绍", "chapters": [{"n": "preface", "title": "前言", "html": "<p>金融市场最容易制造两种幻觉。<\/p>\n<p>第一种幻觉，是把一次正确的判断当成稳定的能力；第二种幻觉，是把一条漂亮的回测曲线当成未来的收益。前者来自记忆的选择，后者来自数据、参数和研究流程中的无数自由度。量化投资并不会自动消灭这些幻觉。相反，如果缺少研究纪律，代码只会让我们更快、更大规模地犯错。<\/p>\n<p>这正是写作《量化投资100讲》的起点。<\/p>\n<p>这套课程不是一份“策略秘方大全”，也不承诺读完之后就能找到持续盈利的模型。它试图建立的是一条完整的决策链：如何把一个模糊的投资想法写成明确规则，如何取得在历史时点真实可见的数据，如何构造信号与组合，如何在回测中避免偷看未来，如何加入费用、滑点和容量，如何评估风险，最后又如何把策略放进一个能够监控、归因和停止的运行系统。<\/p>\n<p>全书从量化世界观出发，依次经过数学基础、金融数据、经典策略、因子投资、回测评估、风险管理、资产配置、机器学习与实战工程。章节看起来跨越很大，但它们始终围绕同一个问题展开：<strong>怎样把一个投资想法变成有证据、可复现、可执行、可监控、也可被证伪的决策系统？<\/strong><\/p>\n<p>你会在书中看到夏普比率、最大回撤、协整、因子模型、VaR、Black–Litterman、XGBoost 和 LSTM；也会看到比这些术语更重要的东西：数据当时是否可得，测试集是否被污染，参数试了多少次，成交价格是否现实，收益是否只是市场 Beta，模型失效时有没有预案。术语提供工具，边界决定工具是否值得相信。<\/p>\n<p>书中出现的参数与收益数字，除非明确引用来源，否则只应视为教学示意。经典论文中的历史结论也不能直接搬到今天，更不能不加检验地迁移到另一类资产、另一套交易制度或另一种资金规模。<\/p>\n<p>这套课程有三种读法。<\/p>\n<p>如果你刚接触量化，可以从第001讲顺序阅读。先建立系统观，再进入公式和策略；不要急着复制代码，因为不知道输入、假设和失败条件的代码，只是一段尚未暴露问题的程序。<\/p>\n<p>如果你已经做过策略，可以从回测、风控和实战模块读起，再反向检查自己的数据与研究流程。把每讲后的验收清单用于已有项目，往往比再增加一个新指标更有价值。<\/p>\n<p>如果你负责研究或管理团队，可以把课程当作共同语言：要求研究结论同时交代样本、基准、成本、容量、风险暴露、样本外表现与停用条件。量化研究不应只交付一个收益率，还应交付别人能够复现和质疑的证据链。<\/p>\n<p>最后需要再次强调：本书用于知识教育，不构成投资建议。金融市场会变化，模型会失效，任何历史结果都不能保证未来表现。真正可靠的量化能力，不是拥有一个永远正确的公式，而是在不确定性中保持诚实：知道自己用了什么证据，知道结论的边界，也知道什么时候应该停止相信它。<\/p>\n<p>愿这100讲带给你的，不只是更多策略，而是一套更清醒的研究方法。<\/p>\n<p>——邓一硕\n2026年10月<\/p>", "front": true}, {"n": "author", "title": "作者简介", "html": "<p>邓一硕，中央财经大学统计与数学学院出身，北京大学硕士。曾任职于首钢集团财务部、字节跳动全球支付事业部，历任华睿创盈投资管理有限公司总监、润安国际董事总经理。现为 <a target=\"_blank\" rel=\"noopener\" href=\"https://xquant-shop.com\">XQuant-Shop 量化平台<\/a>创始人，并自研开源 A 股量化研究工具集 eQuant。合著<a target=\"_blank\" rel=\"noopener\" href=\"https://xquant.shop/courses#books\">《XQuant：人人都是量化交易员》<\/a>，著开源书《量化投资100讲》，译有《R 语言核心技术手册》和《金融风险建模与投资组合优化》等，长期专注于金融财务建模与量化投资交易领域。<\/p>", "front": true}]}, {"no": 1, "name": "启航·量化世界观", "desc": "建立对量化的整体认知，破除神话与恐惧。", "chapters": [{"n": 1, "title": "什么是量化投资？——用代码代替直觉的决策系统", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。历史规律、回测结果和模型输出均不保证未来表现。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<p>学完本讲，你应该能够：<\/p>\n<ul>\n<li>用一句话解释什么是量化投资。<\/li>\n<li>说清“量化”与“写代码”“预测涨跌”“高频交易”的区别。<\/li>\n<li>识别一个完整量化决策系统的八个组成部分。<\/li>\n<li>把一个模糊的投资想法，改写成可以验证的规则。<\/li>\n<\/ul>\n<h2>如果明天市场大跌，你会怎么办？<\/h2>\n<p>假设你持有一只已经上涨 20% 的股票，明天突然下跌 6%。<\/p>\n<p>你可能会问：<\/p>\n<ul>\n<li>这是正常波动，还是趋势已经结束？<\/li>\n<li>应该立即止损，还是越跌越买？<\/li>\n<li>如果卖出，卖多少？什么时候再买回来？<\/li>\n<\/ul>\n<p>人在盘中很容易临时改变答案。上涨时相信趋势，下跌时又相信均值回归；盈利时嫌仓位太轻，亏损时才发现仓位太重。真正影响结果的，往往不是“有没有观点”，而是同一种情形下能否持续执行同一套标准。<\/p>\n<p>量化投资要解决的核心问题正是：<\/p>\n<blockquote>\n<p>在交易发生之前，把信息、判断、仓位、执行和风险控制写成一套可重复、可检验、可追溯的决策规则。<\/p>\n<\/blockquote>\n<h2>量化投资到底是什么？<\/h2>\n<p>量化投资是用数据描述市场，用明确规则形成决策，并借助计算工具持续执行和检验的一种投资方法。<\/p>\n<p>可以把它压缩成一个简单表达式：<\/p>\n<blockquote>\n<p>量化投资 = 数据 + 规则 + 组合 + 执行 + 风控 + 评估<\/p>\n<\/blockquote>\n<p>这里最重要的不是“代码”，而是“规则明确”。只要决策条件可以被清楚描述、重复计算和事后核验，即使用 Excel 实现，也已经具备量化特征。反过来，如果只是让程序员把一个不断临时变化的主观判断写进程序，它仍然不是可靠的量化系统。<\/p>\n<p>量化投资通常具备四个特征：<\/p>\n<ol>\n<li><strong>规则明确<\/strong>：什么情况下买、卖、持有，都有事先定义。<\/li>\n<li><strong>结果可复现<\/strong>：相同的数据和参数，应得到相同的决策。<\/li>\n<li><strong>假设可检验<\/strong>：策略逻辑能用历史样本、样本外数据或模拟交易验证。<\/li>\n<li><strong>过程可审计<\/strong>：策略为什么产生这笔交易，可以回到数据和规则中解释。<\/li>\n<\/ol>\n<h2>一套完整系统的八层结构<\/h2>\n<p>只有一个买卖信号，还不能称为完整策略。一个可运行的量化决策系统至少包含八层。<\/p>\n<h3>1. 投资目标<\/h3>\n<p>先回答“想解决什么问题”。目标可能是获取长期超额收益、降低组合波动、控制最大回撤，或稳定跟踪某个指数。目标不同，策略设计和评价标准也不同。<\/p>\n<h3>2. 投资范围<\/h3>\n<p>明确允许交易哪些资产，例如 A 股、ETF、期货或债券；同时定义流动性、上市时间、停牌和可交易状态等筛选条件。<\/p>\n<h3>3. 数据层<\/h3>\n<p>决定使用价格、成交量、财务报表、宏观数据还是另类数据，并处理复权、缺失值、异常值和发布时间。数据时间点处理错误，会让策略在回测中“偷看未来”。<\/p>\n<h3>4. 信号层<\/h3>\n<p>把投资假设转成可计算条件。例如：<\/p>\n<blockquote>\n<p>当短期均线高于长期均线时，认为趋势偏强；反之认为趋势偏弱。<\/p>\n<\/blockquote>\n<p>信号只负责表达“更看好谁”或“当前偏多还是偏空”，并不直接决定最终仓位。<\/p>\n<h3>5. 组合层<\/h3>\n<p>解决“买什么、买多少”。即使两个策略使用相同信号，等权、波动率加权、风险平价或优化器给出的结果也可能完全不同。<\/p>\n<h3>6. 执行层<\/h3>\n<p>规定信号何时计算、订单何时提交、使用市价还是限价、如何处理成交失败，以及是否考虑手续费、滑点和市场冲击。<\/p>\n<h3>7. 风控层<\/h3>\n<p>设置单一资产上限、总仓位上限、止损规则、回撤阈值和异常熔断。风控不是策略亏损后的补丁，而是策略定义的一部分。<\/p>\n<h3>8. 评估与监控层<\/h3>\n<p>持续观察收益、波动、最大回撤、换手率、交易成本和风险暴露，并判断实盘交易表现是否偏离历史可接受范围。<\/p>\n<p>这八层可以串成一条完整链路：<\/p>\n<blockquote>\n<p>投资目标 → 投资范围 → 数据 → 信号 → 组合 → 执行 → 风控 → 评估<\/p>\n<\/blockquote>\n<p>其中任何一层含糊不清，都会在实盘交易中变成风险。<\/p>\n<h2>把一句“感觉会涨”改写成策略<\/h2>\n<p>来看一个教学用的趋势跟随例子。它不代表有效策略，只用于展示量化思维。<\/p>\n<p>模糊想法是：<\/p>\n<blockquote>\n<p>最近涨得不错，趋势可能还会继续。<\/p>\n<\/blockquote>\n<p>量化改写后可以是：<\/p>\n<ol>\n<li><strong>资产<\/strong>：选择一只流动性满足要求的宽基 ETF。<\/li>\n<li><strong>数据<\/strong>：使用每日收盘价，并采用一致的复权口径。<\/li>\n<li><strong>信号<\/strong>：20 日均线高于 60 日均线时记为趋势向上，否则记为趋势向下。<\/li>\n<li><strong>决策时点<\/strong>：在交易日收盘后计算信号。<\/li>\n<li><strong>执行时点<\/strong>：下一交易日执行，避免使用尚未获得的信息。<\/li>\n<li><strong>仓位<\/strong>：趋势向上时持有预设仓位，趋势向下时降低仓位或持有现金类资产。<\/li>\n<li><strong>成本<\/strong>：回测计入手续费、滑点和无法成交的情形。<\/li>\n<li><strong>评价<\/strong>：同时观察年化收益率、最大回撤、换手率和不同市场阶段的表现。<\/li>\n<\/ol>\n<p>改写后，我们不再争论“这次到底会不会涨”，而是可以提出一组更有价值的问题：<\/p>\n<ul>\n<li>为什么选择 20 日和 60 日，而不是其他参数？<\/li>\n<li>换一个市场或时间段，规律还存在吗？<\/li>\n<li>收益是否只是承担了更大的市场风险？<\/li>\n<li>加入真实交易成本后，优势还剩多少？<\/li>\n<li>参数轻微变化时，结果是否立刻崩溃？<\/li>\n<\/ul>\n<p>这就是量化思维的关键转变：从讨论观点，转向检验假设。<\/p>\n<h2>量化不等于什么？<\/h2>\n<h3>量化不等于一定要预测明天涨跌<\/h3>\n<p>很多策略并不预测价格点位。风险平价关注风险分配，套利策略关注相对价差，再平衡策略甚至可以完全不做方向预测。<\/p>\n<h3>量化不等于高频交易<\/h3>\n<p>持有几个月的多因子选股、每月调仓的资产配置，同样属于量化。高频只是按交易速度划分的一类策略。<\/p>\n<h3>量化不等于人工智能<\/h3>\n<p>移动平均线、财务指标排序和固定再平衡都可以构成量化策略。机器学习只是工具箱中的一部分。<\/p>\n<h3>量化不等于稳赚<\/h3>\n<p>模型会失效，数据会变化，交易成本会增加，极端行情会突破历史经验。量化只是让风险和决策更透明，并不能消除不确定性。<\/p>\n<h3>量化不等于把人完全移出系统<\/h3>\n<p>机器擅长稳定计算和执行，人仍需负责提出假设、判断数据质量、设定边界、处理异常并决定何时停止模型。<\/p>\n<h2>判断一个策略是否“真的量化”<\/h2>\n<p>面对任何策略，可以用下面六个问题快速检查：<\/p>\n<ol>\n<li>买入、卖出和持仓规则能否准确写出来？<\/li>\n<li>规则使用的数据在当时是否真实可得？<\/li>\n<li>仓位大小和风险上限是否事先定义？<\/li>\n<li>是否计入手续费、滑点和成交限制？<\/li>\n<li>相同输入能否复现相同结果？<\/li>\n<li>策略失效时，是否有监控和处置规则？<\/li>\n<\/ol>\n<p>如果大多数问题都答不上来，它可能只是“带有数字的主观交易”，而不是完整的量化系统。<\/p>\n<h2>认知落地：把概念变成决策<\/h2>\n<p>这一讲不是让你记住一个口号，而是训练你在真实投资问题里识别它。围绕“什么是量化投资？——用代码代替直觉的决策系统”，可以用下面的四步把抽象概念落地。<\/p>\n<ol>\n<li>写清决策对象：谁在什么时间、基于哪些已知信息做什么决定。<\/li>\n<li>区分模型、信号、订单与持仓，避免把一个判断直接当成完整策略。<\/li>\n<li>列出可观察证据与反例：什么现象支持这个判断，什么现象会推翻它。<\/li>\n<li>补上数据、执行和风险约束，再判断它是否具备系统化与可复现性。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.sec.gov/about/reports-publications/special-studies/algo_trading_report_2020.pdf\">SEC：Algorithmic Trading in U.S. Capital Markets<\/a>：算法交易的市场结构、收益与风险。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://papers.ssrn.com/sol3/papers.cfm?abstract_id=2326253\">Bailey 等：The Probability of Backtest Overfitting<\/a>：多重试验与回测过拟合的量化框架。<\/li>\n<li><strong>适用条件与边界<\/strong>：区分研究流程、自动化执行与高频交易；机构、市场和监管口径不能直接互换。<\/li>\n<li><strong>主要失败模式<\/strong>：把“使用代码”误当作“有科学证据”，或忽略数据、成本、风控和监控形成的完整闭环。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>只记定义，不说明决策时点和输入信息；修正方法是把概念改写成一条可执行规则。<\/li>\n<li>用一次成功案例证明方法有效；修正方法是同时寻找失败样本和适用边界。<\/li>\n<li>把技术复杂度当成投资优势；真正需要验证的是信息、行为或结构性机制。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>能用一句话说明本讲概念解决什么决策问题<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能指出至少一个反例或失效条件<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能把主观判断改写为可记录、可复核的规则<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能说明它在完整策略链条中的位置<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>量化投资的本质，是把投资判断转化为可重复、可检验、可追溯的决策系统。<\/li>\n<li>代码是执行规则的工具，不是量化投资本身。<\/li>\n<li>完整策略包括目标、资产范围、数据、信号、组合、执行、风控和评估八层。<\/li>\n<li>量化不承诺预测正确，而是帮助我们用一致的方法面对不确定性。<\/li>\n<li>好的起点不是寻找“神奇指标”，而是先把一个模糊观点写成可验证假设。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>选择一个你熟悉的投资想法，例如“跌多了会反弹”或“业绩好的公司更值得买”，尝试写出以下六项：<\/p>\n<ol>\n<li>交易什么资产？<\/li>\n<li>使用什么数据？<\/li>\n<li>如何定义“跌多了”或“业绩好”？<\/li>\n<li>何时买入，何时卖出？<\/li>\n<li>每次投入多少资金？<\/li>\n<li>用什么指标判断策略是否有效？<\/li>\n<\/ol>\n<p>如果其中任何一项只能回答“看情况”，就继续把它改写为更明确的条件。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲讨论：<strong>主观交易 vs 量化交易<\/strong>。我们会比较两种方法各自擅长什么，并解释为什么很多交易者真正的对手不是机器，而是自己在压力下不断变化的决策标准。<\/p>"}, {"n": 2, "title": "主观交易 vs 量化交易：你的对手是机器还是自己的情绪？", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。任何交易方法都可能亏损，系统化规则也无法消除市场风险。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<p>学完本讲，你应该能够：<\/p>\n<ul>\n<li>准确区分主观交易与量化交易，而不是简单判断谁更高级。<\/li>\n<li>理解两种方法各自的信息优势、适用场景和典型失误。<\/li>\n<li>识别交易中最常见的情绪与认知偏差。<\/li>\n<li>把一个依赖“盘感”的判断，改写成可记录、可测试的决策流程。<\/li>\n<\/ul>\n<h2>同一张图，为什么你每天都能得出不同结论？<\/h2>\n<p>假设一只股票连续上涨五天，今天突然放量下跌。<\/p>\n<p>你可以给出至少四种解释：<\/p>\n<ul>\n<li>上涨趋势结束，应该立即卖出。<\/li>\n<li>主力洗盘，是更好的买点。<\/li>\n<li>市场出现利空，需要等待信息确认。<\/li>\n<li>正常波动，不应该频繁操作。<\/li>\n<\/ul>\n<p>这些解释都可能听起来合理。真正的问题是：如果明天价格反弹，你会不会重新解释一次？如果账户正在盈利或亏损，你的判断标准会不会改变？<\/p>\n<p>主观交易与量化交易的差异，不只是“人脑对电脑”，而是：<\/p>\n<blockquote>\n<p>决策标准是在行情发生前定义，还是在行情发生后解释。<\/p>\n<\/blockquote>\n<h2>两种交易方式分别是什么？<\/h2>\n<h3>主观交易<\/h3>\n<p>主观交易也叫自主决策交易或酌情交易。交易者综合价格走势、公司信息、政策变化、行业经验和市场氛围，在当下做出判断。规则可以存在，但人保留最终解释权和否决权。<\/p>\n<p>一个典型决策可能是：<\/p>\n<blockquote>\n<p>公司基本面不错，最近调整充分，市场情绪开始回暖，我认为可以分批买入。<\/p>\n<\/blockquote>\n<p>这句话可能包含大量经验，但“不错”“充分”“回暖”并没有被严格定义，不同时间、不同交易者可能给出不同结论。<\/p>\n<h3>量化交易<\/h3>\n<p>量化交易事先定义数据、信号、仓位、执行和退出规则，再由计算工具持续应用。人主要在系统设计、数据治理、风险边界和模型监控环节做判断。<\/p>\n<p>同一个想法可以改写为：<\/p>\n<blockquote>\n<p>资产满足盈利质量和流动性条件；过去 20 个交易日跌幅处于历史低分位；短期成交量恢复且价格重新站上预设均线；次日按目标风险仓位执行。<\/p>\n<\/blockquote>\n<p>量化表达未必更正确，但它更容易复现、检验和反驳。<\/p>\n<h2>两种方法的核心差异<\/h2>\n<table>\n<thead>\n<tr>\n<th>比较维度<\/th>\n<th>主观交易<\/th>\n<th>量化交易<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>信息处理<\/td>\n<td>擅长新闻、访谈、政策语境等非结构化信息<\/td>\n<td>擅长大规模、标准化、可计算的数据<\/td>\n<\/tr>\n<tr>\n<td>决策方式<\/td>\n<td>人在当下综合判断<\/td>\n<td>事先定义规则，按系统输出决策<\/td>\n<\/tr>\n<tr>\n<td>覆盖范围<\/td>\n<td>通常深度研究少量资产<\/td>\n<td>可以同时扫描大量资产与信号<\/td>\n<\/tr>\n<tr>\n<td>执行一致性<\/td>\n<td>容易受状态、压力和叙事影响<\/td>\n<td>相同输入通常产生相同输出<\/td>\n<\/tr>\n<tr>\n<td>反应能力<\/td>\n<td>对突发事件和制度变化更灵活<\/td>\n<td>对规则内事件反应快，规则外事件可能迟钝<\/td>\n<\/tr>\n<tr>\n<td>可检验性<\/td>\n<td>经验难完整还原，容易事后合理化<\/td>\n<td>可以回测、复盘和做样本外检验<\/td>\n<\/tr>\n<tr>\n<td>主要优势<\/td>\n<td>语境理解、因果判断、处理罕见情形<\/td>\n<td>纪律、规模、速度、可复现性<\/td>\n<\/tr>\n<tr>\n<td>典型风险<\/td>\n<td>情绪化、标准漂移、选择性记忆<\/td>\n<td>数据偏差、过拟合、模型失效、拥挤交易<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>因此，两者不是“落后方法”和“先进方法”的关系。它们是在不同信息环境中，用不同方式组织决策。<\/p>\n<p>主观交易更像经验丰富的医生面对复杂病例：能够结合语境处理例外。量化交易更像标准化检验系统：可以稳定处理大量样本，但只认识被定义过的数据和规则。<\/p>\n<h2>你的真正对手，为什么常常是自己的情绪？<\/h2>\n<p>机器不会因为连续亏损三次就急于翻本，也不会因为刚赚了一笔就擅自放大仓位。人却很容易在压力下改变标准。<\/p>\n<h3>1. 损失厌恶<\/h3>\n<p>同等金额的亏损，带来的痛苦通常大于盈利带来的快乐。结果是：亏损仓位不愿卖，希望“回本再走”；盈利仓位却过早落袋为安。<\/p>\n<h3>2. 近期偏差<\/h3>\n<p>人会把最近发生的事情看得过重。策略刚连续盈利，就相信它永远有效；刚经历几次亏损，就认为逻辑已经彻底失效。<\/p>\n<h3>3. 确认偏差<\/h3>\n<p>持仓以后，我们更愿意阅读支持自己观点的信息，并下意识忽略反面证据。研究逐渐从“寻找真相”变成“证明自己没错”。<\/p>\n<h3>4. 锚定效应<\/h3>\n<p>买入价、历史高点或某位专家给出的目标价，很容易成为心理锚。市场环境已经变化，决策却仍围绕那个数字展开。<\/p>\n<h3>5. 行动偏差<\/h3>\n<p>面对不确定性，人容易觉得“必须做点什么”。频繁调仓带来掌控感，却可能只增加交易成本和犯错次数。<\/p>\n<h3>6. 事后聪明<\/h3>\n<p>行情走完以后，所有拐点看起来都很明显。人会高估自己当时真正掌握的信息，低估市场原本存在的多种可能。<\/p>\n<p>量化规则的价值之一，就是在情绪出现之前先写下决策边界。但要注意：如果交易者每次亏损后都临时修改参数，量化系统同样会退化成“用代码包装的情绪交易”。<\/p>\n<h2>主观与量化，谁更适合什么场景？<\/h2>\n<h3>主观方法更有优势的场景<\/h3>\n<ul>\n<li>政策突然改变，历史数据尚未覆盖新制度。<\/li>\n<li>公司治理、管理层可信度等信息难以完整结构化。<\/li>\n<li>市场出现极端事件，需要判断历史关系是否仍然成立。<\/li>\n<li>研究对象很少，但单个对象需要深度理解。<\/li>\n<\/ul>\n<h3>量化方法更有优势的场景<\/h3>\n<ul>\n<li>需要同时比较数百或数千个资产。<\/li>\n<li>规则需要高频、长期且不间断地执行。<\/li>\n<li>策略依赖多个数据条件，人工容易漏看或算错。<\/li>\n<li>需要严格控制仓位、交易成本和组合风险暴露。<\/li>\n<li>需要检验某个经验到底是规律，还是少数成功案例造成的错觉。<\/li>\n<\/ul>\n<h3>更现实的答案：人机分工<\/h3>\n<p>成熟的投资流程常常不是二选一，而是把不同任务交给更适合的一方。<\/p>\n<p>人可以负责：<\/p>\n<ul>\n<li>提出投资假设和经济解释。<\/li>\n<li>判断市场制度是否发生结构性变化。<\/li>\n<li>设定风险预算和不可突破的边界。<\/li>\n<li>审查数据、模型和异常事件。<\/li>\n<\/ul>\n<p>机器可以负责：<\/p>\n<ul>\n<li>统一计算指标并扫描大量资产。<\/li>\n<li>按固定标准生成候选与仓位。<\/li>\n<li>执行订单、记录日志和监控偏离。<\/li>\n<li>对历史结果做重复、客观的统计检验。<\/li>\n<\/ul>\n<p>最理想的状态不是让机器替代人，而是：<\/p>\n<blockquote>\n<p>让人负责定义问题、处理例外和承担责任，让机器负责重复计算、纪律执行和完整记录。<\/p>\n<\/blockquote>\n<h2>把“盘感”变成可以复盘的流程<\/h2>\n<p>假设你的原始判断是：<\/p>\n<blockquote>\n<p>这只股票跌得差不多了，成交量也起来了，可以抄底。<\/p>\n<\/blockquote>\n<p>可以分四步改写。<\/p>\n<h3>第一步：拆出模糊词<\/h3>\n<ul>\n<li>“跌得差不多”到底是跌了多少？<\/li>\n<li>相对什么时间窗口计算？<\/li>\n<li>“成交量起来”是高于昨天，还是高于过去均值？<\/li>\n<li>“抄底”后持有多久？判断错误如何退出？<\/li>\n<\/ul>\n<h3>第二步：写成观察条件<\/h3>\n<p>例如，仅作为教学示意：<\/p>\n<ul>\n<li>过去 20 个交易日跌幅低于某个历史分位。<\/li>\n<li>当日成交量高于过去 20 日均量的预设倍数。<\/li>\n<li>收盘价重新回到短期均线之上。<\/li>\n<\/ul>\n<h3>第三步：补齐交易与风险规则<\/h3>\n<ul>\n<li>信号在收盘后计算，下一交易日执行。<\/li>\n<li>单一资产仓位不得超过组合上限。<\/li>\n<li>设定退出、最长持有时间和组合回撤处置规则。<\/li>\n<li>回测时计入手续费、滑点、涨跌停和无法成交的情况。<\/li>\n<\/ul>\n<h3>第四步：记录反例<\/h3>\n<p>不要只记录成功抄底的案例。所有满足条件的样本都应进入统计，包括失败、长时间横盘和继续下跌的情况。<\/p>\n<p>经过这四步，一个主观经验才真正变成可以讨论、测试和迭代的策略假设。<\/p>\n<h2>选择方法的四个问题<\/h2>\n<p>开始交易前，可以先问自己：<\/p>\n<ol>\n<li>我的优势来自深度理解少数对象，还是稳定扫描大量对象？<\/li>\n<li>决策所需信息能否被及时、可靠地结构化？<\/li>\n<li>我是否能够真实记录每次交易前的理由，而不是事后补充解释？<\/li>\n<li>当规则连续亏损时，我有统计标准判断“正常回撤”与“模型失效”吗？<\/li>\n<\/ol>\n<p>如果你擅长行业研究，却强迫自己只看价格信号，可能会丢掉优势；如果你没有时间持续盯盘，却依赖临场感觉，也很难保持一致。方法要与信息优势、时间条件和心理承受能力匹配。<\/p>\n<h2>认知落地：把概念变成决策<\/h2>\n<p>这一讲不是让你记住一个口号，而是训练你在真实投资问题里识别它。围绕“主观交易 vs 量化交易：你的对手是机器还是自己的情绪？”，可以用下面的四步把抽象概念落地。<\/p>\n<ol>\n<li>写清决策对象：谁在什么时间、基于哪些已知信息做什么决定。<\/li>\n<li>区分模型、信号、订单与持仓，避免把一个判断直接当成完整策略。<\/li>\n<li>列出可观察证据与反例：什么现象支持这个判断，什么现象会推翻它。<\/li>\n<li>补上数据、执行和风险约束，再判断它是否具备系统化与可复现性。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.sec.gov/about/reports-publications/special-studies/algo_trading_report_2020.pdf\">SEC：Algorithmic Trading in U.S. Capital Markets<\/a>：算法交易的市场结构、收益与风险。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://papers.ssrn.com/sol3/papers.cfm?abstract_id=2326253\">Bailey 等：The Probability of Backtest Overfitting<\/a>：多重试验与回测过拟合的量化框架。<\/li>\n<li><strong>适用条件与边界<\/strong>：区分研究流程、自动化执行与高频交易；机构、市场和监管口径不能直接互换。<\/li>\n<li><strong>主要失败模式<\/strong>：把“使用代码”误当作“有科学证据”，或忽略数据、成本、风控和监控形成的完整闭环。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>只记定义，不说明决策时点和输入信息；修正方法是把概念改写成一条可执行规则。<\/li>\n<li>用一次成功案例证明方法有效；修正方法是同时寻找失败样本和适用边界。<\/li>\n<li>把技术复杂度当成投资优势；真正需要验证的是信息、行为或结构性机制。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>能用一句话说明本讲概念解决什么决策问题<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能指出至少一个反例或失效条件<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能把主观判断改写为可记录、可复核的规则<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能说明它在完整策略链条中的位置<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>主观交易由人综合语境做最终判断；量化交易把数据和决策标准事先系统化。<\/li>\n<li>主观方法擅长理解非结构化信息和处理例外，量化方法擅长规模化计算、纪律执行和客观检验。<\/li>\n<li>交易者常见的对手包括损失厌恶、近期偏差、确认偏差、锚定效应和行动偏差。<\/li>\n<li>写了代码不代表摆脱情绪；亏损后随意改参数，同样属于标准漂移。<\/li>\n<li>更有效的实践通常是人机分工：人提出假设和管理边界，机器执行、记录与监控。<\/li>\n<\/ul>\n<h2>课后练习：给自己的交易做一次“规则体检”<\/h2>\n<p>找出最近一次真实或模拟的买卖决策，完成下面的表格：<\/p>\n<table>\n<thead>\n<tr>\n<th>问题<\/th>\n<th>交易前真实答案<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>我为什么买入？<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>哪些数据支持这个判断？<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>什么证据会证明我错了？<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>买入多少，依据是什么？<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>计划何时退出？<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>结果不理想时，我是否临时改变过标准？<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>然后把理由中的“感觉不错”“跌得够多”“应该会涨”等模糊词圈出来，至少选择一个改写成可观察、可计算的条件。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲进入量化极简史：<strong>从早期统计套利、系统化基金，到机器学习进入交易系统<\/strong>。我们会关注技术如何改变方法，同时解释为什么工具不断升级，量化投资最基本的原则却没有改变。<\/p>"}, {"n": 3, "title": "量化极简史：从西蒙斯的大奖章到深度学习革命", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。模型、历史数据与示例均不保证未来表现。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>按阶段理解量化投资的发展，而不是只记人物故事。<\/li>\n<li>分清数学理论、计算能力、市场电子化和数据扩张各自的作用。<\/li>\n<li>理解工具升级为什么没有改变量化研究的基本约束。<\/li>\n<\/ul>\n<h2>开场：量化不是突然由 AI 发明的<\/h2>\n<p>量化投资的历史，不是一条“模型越来越复杂、收益越来越高”的直线。它更像四股力量不断汇合：金融理论把问题写成数学形式，计算机提高处理规模，电子市场降低执行摩擦，数据扩张让更多假设可以被检验。<\/p>\n<h2>第一阶段：先把不确定性写成数学<\/h2>\n<p>20 世纪早期，研究者开始用概率描述价格变化；随后，组合理论把关注点从“哪只资产最好”转向“资产放在一起后风险如何变化”。再后来，风险因子、期权定价和时间序列研究逐渐形成现代金融工程的语言。<\/p>\n<p>这一阶段的重要变化不是出现了某个万能公式，而是投资问题开始具备可计算的对象：收益、波动、相关性、暴露和概率分布。<\/p>\n<h2>第二阶段：计算机进入投资流程<\/h2>\n<p>计算能力提升后，研究者可以在大量证券上重复计算规则。系统化趋势跟随、套利和程序化组合管理逐渐发展。爱德华·索普等先驱展示了概率优势、仓位控制和风险管理可以构成完整方法；此后，统计套利团队开始从相对价格关系中寻找微小但可重复的优势。<\/p>\n<p>文艺复兴科技等机构常被神话，但真正值得学习的不是某个秘密公式，而是研究组织方式：多学科团队、严格数据、持续实验、组合化下注和对交易成本的极度重视。<\/p>\n<h2>第三阶段：电子化与规模化<\/h2>\n<p>交易所电子化、行情数据标准化和经纪接口普及，让信号生成、订单执行和风险监控连成自动化链路。量化不再只是一份研究报告，而成为持续运行的软件系统。<\/p>\n<p>与此同时，竞争也更激烈：公开信号更快失效，执行质量和成本控制变得重要，模型错误也可能被自动放大。<\/p>\n<h2>第四阶段：机器学习与另类数据<\/h2>\n<p>机器学习扩大了可处理的特征数量和非线性关系，文本、图像、供应链和网络行为等数据也进入研究。但模型越复杂，越需要解决标签泄漏、样本不稳定、解释困难和过拟合。<\/p>\n<p>深度学习改变了工具箱，却没有取消三个老问题：信息在当时是否可得、规律在样本外是否存在、收益扣除成本后是否仍为正。<\/p>\n<h2>一条更有用的历史主线<\/h2>\n<p>可以用四次“规模扩张”理解量化史：<\/p>\n<ol>\n<li>从单一证券扩展到组合。<\/li>\n<li>从少量手算扩展到大规模计算。<\/li>\n<li>从人工下单扩展到自动执行。<\/li>\n<li>从结构化行情扩展到多模态数据。<\/li>\n<\/ol>\n<p>每次扩张都会创造新机会，也会引入新风险。<\/p>\n<h2>用同一条策略穿过四个时代<\/h2>\n<p>为了避免把历史学成名人年表，可以让一条最简单的趋势规则穿过四个时代。假设研究者想检验：“价格持续上涨一段时间后，趋势是否还会延续？”<\/p>\n<p>在手工计算时代，他只能选择少量资产、抄录有限价格，再用纸笔计算均线。策略的主要瓶颈是<strong>计算规模<\/strong>。计算机普及后，同一规则可以同时扫描数百个品种，但数据录入、存储与程序错误成为新风险。电子交易普及后，信号可以自动变成订单，此时瓶颈从“算不算得完”转向“能不能按假设成交”。进入机器学习时代，研究者可以加入波动率、成交量、宏观变量和文本特征，但可尝试的模型急剧增加，选择性汇报和过拟合也更严重。<\/p>\n<p>规则表面上越来越复杂，审计问题却始终相同：<\/p>\n<ol>\n<li>决策时点真正能看到哪些数据？<\/li>\n<li>规则是否在未参与开发的时期仍然成立？<\/li>\n<li>收益扣除换手、滑点和市场冲击后还剩多少？<\/li>\n<li>资金规模变大后，原来的成交假设是否仍成立？<\/li>\n<\/ol>\n<p>这也是量化史最值得学习的地方：技术扩展了可研究空间，却没有取消证据纪律。<\/p>\n<h2>进步并不等于模型越来越复杂<\/h2>\n<p>量化投资的进步至少有四种，不能只看算法名称。<\/p>\n<table>\n<thead>\n<tr>\n<th>进步方向<\/th>\n<th>真正改善了什么<\/th>\n<th>同时引入的风险<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>理论<\/td>\n<td>把收益、风险和组合关系写成可讨论对象<\/td>\n<td>公式假设被当成市场事实<\/td>\n<\/tr>\n<tr>\n<td>数据<\/td>\n<td>扩展资产、频率和信息类型<\/td>\n<td>数据泄漏、授权和口径不一致<\/td>\n<\/tr>\n<tr>\n<td>工程<\/td>\n<td>提高计算、执行和监控能力<\/td>\n<td>软件故障会被自动放大<\/td>\n<\/tr>\n<tr>\n<td>治理<\/td>\n<td>记录实验、版本、权限与停机条件<\/td>\n<td>流程成本上升，但它是可控风险的代价<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>如果一个新模型只让样本内曲线更漂亮，却没有改善样本外证据、成本后收益或故障恢复能力，它更可能是复杂度升级，而不是投资能力升级。<\/p>\n<h2>历史故事的正确读法<\/h2>\n<p>阅读量化机构或传奇人物时，可以把“他赚了多少”换成五个更可验证的问题：使用了什么信息、承担了什么风险、依赖什么市场结构、容量有多大、竞争者复制后优势会怎样变化。很多成功无法被简化为一个公开公式，因为结果来自数据、人才、执行、组合和组织流程的共同作用。<\/p>\n<p>因此，本讲提到文艺复兴科技或机器学习，目的不是暗示读者复制某个秘密模型，而是说明量化优势往往存在于一整套系统中。孤立复制其中一个指标，通常复制不到原来的结果。<\/p>\n<h2>认知落地：把概念变成决策<\/h2>\n<p>这一讲不是让你记住一个口号，而是训练你在真实投资问题里识别它。围绕“量化极简史：从西蒙斯的大奖章到深度学习革命”，可以用下面的四步把抽象概念落地。<\/p>\n<ol>\n<li>写清决策对象：谁在什么时间、基于哪些已知信息做什么决定。<\/li>\n<li>区分模型、信号、订单与持仓，避免把一个判断直接当成完整策略。<\/li>\n<li>列出可观察证据与反例：什么现象支持这个判断，什么现象会推翻它。<\/li>\n<li>补上数据、执行和风险约束，再判断它是否具备系统化与可复现性。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.sec.gov/about/reports-publications/special-studies/algo_trading_report_2020.pdf\">SEC：Algorithmic Trading in U.S. Capital Markets<\/a>：算法交易的市场结构、收益与风险。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://papers.ssrn.com/sol3/papers.cfm?abstract_id=2326253\">Bailey 等：The Probability of Backtest Overfitting<\/a>：多重试验与回测过拟合的量化框架。<\/li>\n<li><strong>适用条件与边界<\/strong>：区分研究流程、自动化执行与高频交易；机构、市场和监管口径不能直接互换。<\/li>\n<li><strong>主要失败模式<\/strong>：把“使用代码”误当作“有科学证据”，或忽略数据、成本、风控和监控形成的完整闭环。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>只记定义，不说明决策时点和输入信息；修正方法是把概念改写成一条可执行规则。<\/li>\n<li>用一次成功案例证明方法有效；修正方法是同时寻找失败样本和适用边界。<\/li>\n<li>把技术复杂度当成投资优势；真正需要验证的是信息、行为或结构性机制。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>能用一句话说明本讲概念解决什么决策问题<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能指出至少一个反例或失效条件<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能把主观判断改写为可记录、可复核的规则<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能说明它在完整策略链条中的位置<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>量化史是理论、计算、市场结构与数据共同演进的结果。<\/li>\n<li>模型复杂度不是进步的唯一标准，可验证性和执行能力同样重要。<\/li>\n<li>机器学习解决了部分表达问题，却没有解决市场非平稳与过拟合。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>选择一个你熟悉的策略，判断它主要依赖哪一代能力：金融理论、计算规模、电子执行还是新型数据；再写出该能力带来的一个机会和一个新风险。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第004讲 一个量化策略是怎样诞生的？数据、逻辑、执行、风控<\/strong>。<\/p>"}, {"n": 4, "title": "一个量化策略是怎样诞生的？数据、逻辑、执行、风控", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。模型、历史数据与示例均不保证未来表现。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>掌握策略从想法到运行的完整生命周期。<\/li>\n<li>理解数据、逻辑、组合、执行和风控不能相互替代。<\/li>\n<li>学会为策略设置上线与下线标准。<\/li>\n<\/ul>\n<h2>开场：一句好想法离可交易策略有多远<\/h2>\n<p>“强者恒强”只是一个假设。要变成策略，还必须回答强者如何定义、在哪些资产中比较、何时交易、买多少、成本多大以及失败时怎么办。<\/p>\n<h2>1. 提出可证伪的假设<\/h2>\n<p>好的假设应同时包含经济直觉和可观察结果。例如：“在流动性充足的股票中，过去中期表现较强且近期未出现剧烈反转的资产，未来一段时间平均收益更高。”它可能被数据否定，因此才有研究价值。<\/p>\n<h2>2. 构建当时可得的数据<\/h2>\n<p>研究者需要定义样本范围、复权方式、财务数据发布时间、退市证券和缺失值处理。最危险的错误不是公式算错，而是把未来才知道的信息放进过去。<\/p>\n<h2>3. 把逻辑写成信号<\/h2>\n<p>确定观察窗口、排序方法、阈值和更新频率。先从简单基线开始，再逐步增加条件。每增加一个参数，都应说明它解决什么问题。<\/p>\n<h2>4. 从信号变成组合<\/h2>\n<p>信号回答相对偏好，组合回答资金分配。这里要处理持仓数量、权重、行业与风格暴露、换手率和容量。强信号配上失控仓位，仍可能成为坏策略。<\/p>\n<h2>5. 建立执行模型<\/h2>\n<p>规定信号时间、下单时间、订单类型和成交限制。回测必须使用可实现的价格，并估计手续费、滑点和市场冲击成本。<\/p>\n<h2>6. 将风控写进策略<\/h2>\n<p>风控至少覆盖单笔、单资产、组合和系统四层：仓位上限、止损或退出、组合回撤、数据中断和订单异常。风控规则应在上线前确定。<\/p>\n<h2>7. 分层验证<\/h2>\n<p>按“样本内开发—样本外检验—滚动验证—模拟交易—小资金实盘交易”逐步增加真实性。每一步都应保留研究日志，避免根据最终结果反复挑选参数。<\/p>\n<h2>8. 上线、监控与退役<\/h2>\n<p>上线不是结束。要监控数据延迟、信号分布、成交偏差、风险暴露和实盘交易与回测差异。预先定义暂停条件与退役标准，例如持续超出预期回撤、信号失去区分度或交易成本吞噬优势。<\/p>\n<h2>策略生命周期清单<\/h2>\n<blockquote>\n<p>假设 → 数据 → 信号 → 组合 → 执行 → 风控 → 验证 → 上线 → 监控 → 退役<\/p>\n<\/blockquote>\n<p>任何跳步，都会把未解决的问题推迟到真金白银阶段。<\/p>\n<h2>贯穿示例：让“双均线”真正成为一套策略<\/h2>\n<p>以 20 日均线与 60 日均线为例。写出“20 日线上穿 60 日线买入”只完成了信号层，距离可交易策略还很远。完整的研究卡至少要补齐下面这些字段。<\/p>\n<table>\n<thead>\n<tr>\n<th>环节<\/th>\n<th>必须写清的内容<\/th>\n<th>教学示意<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>研究对象<\/td>\n<td>交易什么、何时可进入样本<\/td>\n<td>一只流动性较好的宽基 ETF<\/td>\n<\/tr>\n<tr>\n<td>数据<\/td>\n<td>字段、复权、时区、交易日历<\/td>\n<td>日收盘价，统一复权口径<\/td>\n<\/tr>\n<tr>\n<td>信号<\/td>\n<td>窗口、阈值、缺失值处理<\/td>\n<td>收盘后计算 20 日与 60 日均线<\/td>\n<\/tr>\n<tr>\n<td>组合<\/td>\n<td>目标权重、现金、上限<\/td>\n<td>多头信号为 100%，否则为 0%<\/td>\n<\/tr>\n<tr>\n<td>执行<\/td>\n<td>下单时点、成交价格、失败处理<\/td>\n<td>下一交易日按预设成交模型执行<\/td>\n<\/tr>\n<tr>\n<td>成本<\/td>\n<td>佣金、税费、滑点、冲击<\/td>\n<td>使用情景参数，不声称代表真实账户<\/td>\n<\/tr>\n<tr>\n<td>风控<\/td>\n<td>仓位、回撤、数据与系统异常<\/td>\n<td>数据缺失时不生成新订单<\/td>\n<\/tr>\n<tr>\n<td>评估<\/td>\n<td>基准、指标、样本切分<\/td>\n<td>与买入并持有及空仓基准比较<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>这张表暴露了一个关键事实：同一个“金叉”，只要执行时点、成本或空仓收益假设不同，就可能得到不同回测结果。所以策略定义不是一句交易口号，而是一份可执行合同。<\/p>\n<h2>每一层都要有输入、输出和拒绝条件<\/h2>\n<p>可靠系统不只描述正常路径，还要描述何时拒绝继续运行。例如，数据层的输入是原始行情，输出是通过校验的价格序列；如果出现重复时间戳、异常跳变或更新延迟，就应停止向信号层供数。风控层的输入是目标仓位与账户状态，输出是获准订单；如果仓位超限、现金不足或行情过期，就应拒绝订单。<\/p>\n<p>这种写法把“系统出错”从一个模糊概念拆成可定位事件。否则实盘交易亏损时，团队很难判断是投资假设失效、数据损坏、程序错误，还是订单根本没有按计划成交。<\/p>\n<h2>为什么验证必须逐级增加真实性<\/h2>\n<p>样本内回测适合发现和修正逻辑问题，却不能独立证明未来有效；样本外测试减少研究者直接调参的影响，但仍使用历史成交假设；模拟交易引入实时数据和运行故障，却没有真实排队和资金压力；小资金实盘交易更接近现实，但样本通常太短，不能因为几周盈利就确认策略有效。<\/p>\n<p>因此每一级验证回答的问题不同：<\/p>\n<ul>\n<li><strong>回测<\/strong>：按定义实现后，历史上发生了什么？<\/li>\n<li><strong>样本外测试<\/strong>：没有继续调参时，结果是否仍有方向一致性？<\/li>\n<li><strong>模拟交易<\/strong>：数据、调度、订单和日志能否持续运行？<\/li>\n<li><strong>小资金实盘交易<\/strong>：实际成本、成交和操作流程是否落在预期范围？<\/li>\n<\/ul>\n<h2>上线前先写“死亡证明”<\/h2>\n<p>研究者容易为策略写买入理由，却不愿提前写停用条件。更稳健的做法是在上线前定义三类阈值：业务阈值，例如成本后优势长期不足；风险阈值，例如回撤或风险暴露超出设计范围；运行阈值，例如数据延迟、对账差异或连续拒单。阈值触发后可以降仓、暂停或进入人工复核，但不能临场为了保住策略而不断修改标准。<\/p>\n<h2>认知落地：把概念变成决策<\/h2>\n<p>这一讲不是让你记住一个口号，而是训练你在真实投资问题里识别它。围绕“一个量化策略是怎样诞生的？数据、逻辑、执行、风控”，可以用下面的四步把抽象概念落地。<\/p>\n<ol>\n<li>写清决策对象：谁在什么时间、基于哪些已知信息做什么决定。<\/li>\n<li>区分模型、信号、订单与持仓，避免把一个判断直接当成完整策略。<\/li>\n<li>列出可观察证据与反例：什么现象支持这个判断，什么现象会推翻它。<\/li>\n<li>补上数据、执行和风险约束，再判断它是否具备系统化与可复现性。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.sec.gov/about/reports-publications/special-studies/algo_trading_report_2020.pdf\">SEC：Algorithmic Trading in U.S. Capital Markets<\/a>：算法交易的市场结构、收益与风险。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://papers.ssrn.com/sol3/papers.cfm?abstract_id=2326253\">Bailey 等：The Probability of Backtest Overfitting<\/a>：多重试验与回测过拟合的量化框架。<\/li>\n<li><strong>适用条件与边界<\/strong>：区分研究流程、自动化执行与高频交易；机构、市场和监管口径不能直接互换。<\/li>\n<li><strong>主要失败模式<\/strong>：把“使用代码”误当作“有科学证据”，或忽略数据、成本、风控和监控形成的完整闭环。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>只记定义，不说明决策时点和输入信息；修正方法是把概念改写成一条可执行规则。<\/li>\n<li>用一次成功案例证明方法有效；修正方法是同时寻找失败样本和适用边界。<\/li>\n<li>把技术复杂度当成投资优势；真正需要验证的是信息、行为或结构性机制。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>能用一句话说明本讲概念解决什么决策问题<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能指出至少一个反例或失效条件<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能把主观判断改写为可记录、可复核的规则<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能说明它在完整策略链条中的位置<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>策略是完整生命周期，不是一个指标或一段回测代码。<\/li>\n<li>每个环节都要使用当时可得的信息并保留审计记录。<\/li>\n<li>上线前就应定义暂停和退役条件。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>把“低估值股票长期表现更好”改写成研究卡片，至少写出股票池、估值指标、调仓频率、权重方法、交易成本和失败判据。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第005讲 量化能交易什么？股票、期货、期权、加密货币全扫描<\/strong>。<\/p>"}, {"n": 5, "title": "量化能交易什么？股票、期货、期权、加密货币全扫描", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。模型、历史数据与示例均不保证未来表现。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>认识主要可量化交易资产的收益来源和风险结构。<\/li>\n<li>理解不同资产不能套用同一套数据与执行假设。<\/li>\n<li>学会用流动性、杠杆和期限结构选择研究对象。<\/li>\n<\/ul>\n<h2>量化能交易的不是“代码”，而是风险<\/h2>\n<p>不同资产看起来都是价格曲线，但背后的权利义务完全不同。股票代表企业权益，期货是标准化远期合约，期权包含非线性权利，加密资产则具有全天候交易和市场结构分散等特点。<\/p>\n<h2>股票与 ETF<\/h2>\n<p>股票数据丰富、横截面广，适合因子选股、事件驱动和统计套利。主要风险包括公司特有风险、停牌、退市、公司行动和流动性。ETF 把一篮子资产封装为可交易工具，更适合资产配置、行业轮动和趋势策略，但仍要关注跟踪误差、折溢价和成交深度。<\/p>\n<h2>期货<\/h2>\n<p>期货天然带有保证金和杠杆，适合趋势跟随、跨期套利和宏观配置。研究不能只拼接价格，还要处理合约到期、移仓换月、期限结构和保证金变化。忽略换月成本，回测曲线可能完全失真。<\/p>\n<h2>期权<\/h2>\n<p>期权收益是非线性的。方向判断之外，还要面对隐含波动率、时间价值和希腊字母暴露。期权策略可能在大部分时间小赚，却在极端行情一次性亏损，因此不能只看胜率。<\/p>\n<h2>债券与利率工具<\/h2>\n<p>债券策略关注久期、信用、收益率曲线和流动性。价格波动通常较小，但杠杆、信用事件和流动性冻结会让“低波动”突然变成大风险。<\/p>\n<h2>外汇与加密资产<\/h2>\n<p>外汇受利差、宏观政策和全球资金流影响。加密资产提供 7×24 小时交易和大量链上数据，但交易场所分散、价格跳跃、托管与平台风险更突出。研究时要把技术风险和对手方风险纳入策略，而不只看历史波动。<\/p>\n<h2>选择资产的五问<\/h2>\n<ol>\n<li>收益来自方向、风险溢价、相对价差还是流动性补偿？<\/li>\n<li>数据是否可靠且在当时可得？<\/li>\n<li>实际成交深度能否承载策略规模？<\/li>\n<li>是否存在杠杆、到期、强平或非线性风险？<\/li>\n<li>交易、托管、税务与合规边界是否清楚？<\/li>\n<\/ol>\n<p>策略逻辑只有与资产机制匹配，历史统计才有解释力。<\/p>\n<h2>同一条趋势规则，放进不同资产会发生什么<\/h2>\n<p>假设仍使用“短期均线高于长期均线时持有”的教学规则。它放在股票、期货和期权上，含义并不相同。<\/p>\n<p>在股票上，持有通常意味着承担企业与市场风险，并处理分红、拆并股、停牌和退市。放在期货上，还必须决定使用哪个合约、何时移仓、保证金留多少，以及连续价格序列如何构造。放在期权上，“看多”并不等于只判断方向：到期时间、执行价、隐含波动率和时间价值都会影响盈亏。放在加密资产上，连续交易虽然减少了传统闭市时段，却增加了交易所分散、托管和对手方风险。<\/p>\n<p>因此，<strong>策略规则可以迁移，资产机制不能省略<\/strong>。回测代码若只把价格列替换掉，往往不是完成了跨资产验证，而是把一个市场的假设误带到了另一个市场。<\/p>\n<h2>资产选择的六维比较<\/h2>\n<table>\n<thead>\n<tr>\n<th>维度<\/th>\n<th>股票 / ETF<\/th>\n<th>期货<\/th>\n<th>期权<\/th>\n<th>加密资产<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>权利义务<\/td>\n<td>权益或基金份额<\/td>\n<td>到期合约与保证金<\/td>\n<td>非线性权利义务<\/td>\n<td>代币或合约权益，场所差异大<\/td>\n<\/tr>\n<tr>\n<td>主要数据<\/td>\n<td>行情、公司行动、财务<\/td>\n<td>行情、合约、持仓、期限结构<\/td>\n<td>标的、波动率曲面、希腊字母<\/td>\n<td>多场所行情、链上与资金费率等<\/td>\n<\/tr>\n<tr>\n<td>关键时点<\/td>\n<td>复权、公告可得时间<\/td>\n<td>到期与移仓<\/td>\n<td>到期、行权与结算<\/td>\n<td>7×24 小时与场所时间戳<\/td>\n<\/tr>\n<tr>\n<td>杠杆来源<\/td>\n<td>融资或衍生工具<\/td>\n<td>保证金<\/td>\n<td>权利金与非线性暴露<\/td>\n<td>保证金合约或借贷<\/td>\n<\/tr>\n<tr>\n<td>典型尾部风险<\/td>\n<td>停牌、退市、流动性枯竭<\/td>\n<td>跳空、追加保证金、强平<\/td>\n<td>波动率跳升、Gamma 风险<\/td>\n<td>平台、托管、跳价与清算<\/td>\n<\/tr>\n<tr>\n<td>容量约束<\/td>\n<td>成交额与冲击<\/td>\n<td>合约深度与持仓限制<\/td>\n<td>报价深度与波动率曲面<\/td>\n<td>场所分散和真实可成交深度<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>表格不是为了评选“最好的资产”，而是提醒研究者：收益机会与风险结构是绑定的。看上去波动小的资产可能隐藏杠杆和流动性风险；看上去交易连续的市场也可能在关键时刻失去可靠报价。<\/p>\n<h2>先决定自己能承受哪类错误<\/h2>\n<p>新手常问“哪个市场最赚钱”，更有用的问题是“哪个市场的错误最容易被我识别和承受”。如果无法处理期货移仓，不应从跨期策略开始；如果不理解期权非线性，不应只根据方向观点卖出期权；如果无法核验托管和交易场所风险，就不应把加密资产回测中的连续价格当作真实可交易性。<\/p>\n<p>一个合理的入门研究对象通常满足：数据口径透明、交易规则稳定、流动性可观察、杠杆可控、能找到简单基准。选择简单对象不是降低专业性，而是减少同时变化的因素，让研究错误更容易被发现。<\/p>\n<h2>认知落地：把概念变成决策<\/h2>\n<p>这一讲不是让你记住一个口号，而是训练你在真实投资问题里识别它。围绕“量化能交易什么？股票、期货、期权、加密货币全扫描”，可以用下面的四步把抽象概念落地。<\/p>\n<ol>\n<li>写清决策对象：谁在什么时间、基于哪些已知信息做什么决定。<\/li>\n<li>区分模型、信号、订单与持仓，避免把一个判断直接当成完整策略。<\/li>\n<li>列出可观察证据与反例：什么现象支持这个判断，什么现象会推翻它。<\/li>\n<li>补上数据、执行和风险约束，再判断它是否具备系统化与可复现性。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.sec.gov/about/reports-publications/special-studies/algo_trading_report_2020.pdf\">SEC：Algorithmic Trading in U.S. Capital Markets<\/a>：算法交易的市场结构、收益与风险。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://papers.ssrn.com/sol3/papers.cfm?abstract_id=2326253\">Bailey 等：The Probability of Backtest Overfitting<\/a>：多重试验与回测过拟合的量化框架。<\/li>\n<li><strong>适用条件与边界<\/strong>：区分研究流程、自动化执行与高频交易；机构、市场和监管口径不能直接互换。<\/li>\n<li><strong>主要失败模式<\/strong>：把“使用代码”误当作“有科学证据”，或忽略数据、成本、风控和监控形成的完整闭环。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>只记定义，不说明决策时点和输入信息；修正方法是把概念改写成一条可执行规则。<\/li>\n<li>用一次成功案例证明方法有效；修正方法是同时寻找失败样本和适用边界。<\/li>\n<li>把技术复杂度当成投资优势；真正需要验证的是信息、行为或结构性机制。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>能用一句话说明本讲概念解决什么决策问题<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能指出至少一个反例或失效条件<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能把主观判断改写为可记录、可复核的规则<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能说明它在完整策略链条中的位置<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>量化可以覆盖多类资产，但每类资产的权利义务与数据结构不同。<\/li>\n<li>期货要处理换月，期权要处理非线性，加密资产要额外处理平台和托管风险。<\/li>\n<li>选择市场应从优势与可执行性出发，而不是只看波动和热门程度。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>任选股票、期货、期权和加密资产中的两类，分别写出数据需求、交易成本、最重要的尾部风险与适合的策略类型。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第006讲 量化生态圈：散户、私募、券商、平台，谁在割谁？<\/strong>。<\/p>"}, {"n": 6, "title": "量化生态圈：散户、私募、券商、平台，谁在割谁？", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。模型、历史数据与示例均不保证未来表现。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解量化生态中主要参与者的角色和激励。<\/li>\n<li>识别研究、交易、销售和平台环节中的利益冲突。<\/li>\n<li>建立选择产品与服务时的尽调清单。<\/li>\n<\/ul>\n<h2>开场：“谁在割谁”不是最有用的问题<\/h2>\n<p>市场不是一场所有人使用同一规则的零和游戏。不同参与者的期限、风险预算、信息来源和业务模式不同。真正需要问的是：对方如何赚钱，他承担什么风险，他希望你做什么？<\/p>\n<h2>个人投资者<\/h2>\n<p>个人投资者资金灵活、决策链短，可以选择低容量和长周期机会；弱点是数据、研究纪律和交易成本管理不足，也容易被收益展示与短期排名影响。<\/p>\n<h2>私募与资管机构<\/h2>\n<p>机构拥有团队、系统和风险管理能力，但受规模、合规、客户赎回和业绩考核约束。规模扩大后，原本有效的小容量策略可能难以执行。<\/p>\n<h2>券商与做市商<\/h2>\n<p>券商提供交易通道、研究、融资和产品服务，收入可能来自佣金、利差或服务费。做市商通过持续报价提供流动性，并管理库存风险。用户需要理解最佳执行、融资成本和利益冲突，而不是把所有中介都简单视为对手。<\/p>\n<h2>数据商与技术平台<\/h2>\n<p>平台降低了数据、回测和部署门槛，但也可能形成锁定：数据口径不透明、回测撮合过于理想、迁移成本高。免费并不等于没有成本，用户可能用注意力、数据或后续服务付费。<\/p>\n<h2>策略提供者与内容销售者<\/h2>\n<p>策略产品可能按管理费、业绩提成、订阅费或交易分成收费。不同收费模式会影响行为：按交易量收费者可能鼓励频繁交易，只展示高收益者可能忽略幸存者偏差。<\/p>\n<h2>五项尽调<\/h2>\n<ul>\n<li><strong>收益来源<\/strong>：产品靠什么逻辑赚钱，是否能用一句话说明？<\/li>\n<li><strong>风险展示<\/strong>：是否同时展示回撤、容量、换手率和最差阶段？<\/li>\n<li><strong>数据口径<\/strong>：是实盘交易、模拟交易还是回测，交易成本是否扣除？<\/li>\n<li><strong>激励一致<\/strong>：服务方在何种情况下获得收入？<\/li>\n<li><strong>退出机制<\/strong>：资金、代码、数据和账户能否安全迁出？<\/li>\n<\/ul>\n<p>成熟判断不是寻找“绝对可信的人”，而是让激励、证据和风险边界透明。<\/p>\n<h2>用一笔交易看清资金流、信息流和风险流<\/h2>\n<p>假设一位个人投资者在某平台看到一条策略，订阅数据后通过券商下单，并购买了由管理人发行的同类产品。表面上，他只是在决定买或卖；实际上，至少有三条链同时运行。<\/p>\n<ul>\n<li><strong>资金流<\/strong>：投资者支付数据费、平台费、交易费用或管理费，最终损益仍由账户承担。<\/li>\n<li><strong>信息流<\/strong>：数据商提供原始数据，平台进行处理和回测，策略提供者输出规则或信号，券商返回成交与账户状态。<\/li>\n<li><strong>风险流<\/strong>：数据错误会传到信号，理想化回测会放大预期，成交偏差会落到账户，赎回压力又可能迫使管理人在不利时点卖出。<\/li>\n<\/ul>\n<p>只看收益展示，会把这三条链压缩成一条漂亮曲线。尽调的任务就是把曲线重新拆开，确认每个参与者交付了什么、控制了什么，以及没有承担什么。<\/p>\n<h2>商业模式如何改变行为<\/h2>\n<p>商业模式本身不等于不可信，但它会改变最容易被优化的目标。<\/p>\n<table>\n<thead>\n<tr>\n<th>收入方式<\/th>\n<th>服务方更容易追求什么<\/th>\n<th>用户要额外检查什么<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>固定订阅费<\/td>\n<td>留存、内容数量、功能使用<\/td>\n<td>研究质量是否可复核，退出后数据能否导出<\/td>\n<\/tr>\n<tr>\n<td>按交易量收费<\/td>\n<td>更高换手和更多成交<\/td>\n<td>频繁交易是否真的增加成本后收益<\/td>\n<\/tr>\n<tr>\n<td>管理费<\/td>\n<td>扩大资产规模<\/td>\n<td>策略容量是否支持继续扩张<\/td>\n<\/tr>\n<tr>\n<td>业绩提成<\/td>\n<td>提高阶段性业绩<\/td>\n<td>高水位线、风险承担和亏损后的激励<\/td>\n<\/tr>\n<tr>\n<td>数据或技术服务费<\/td>\n<td>锁定工作流与标准<\/td>\n<td>口径、版本、授权和迁移成本<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>例如，平台展示“最热门策略”时，热门可能来自最近表现、使用人数或营销资源，并不自动等于长期、成本后、样本外有效。用户应要求看到排序规则，而不是把榜单位置当作质量认证。<\/p>\n<h2>一份可以实际执行的尽调访谈<\/h2>\n<p>面对产品、平台或策略服务，不妨按顺序追问：展示的是回测、模拟交易还是实盘交易？收益是否扣除了全部费用？最差阶段和最长恢复期是什么？策略容量依据什么估计？数据供应商变更后是否重算历史？谁有权限改参数？发生异常时谁负责停机？能否导出原始交易与账户流水进行独立复核？<\/p>\n<p>如果回答停留在“算法先进”“团队资深”或“历史胜率很高”，却无法落到时间、数据和责任人，那么问题不是对方一定有恶意，而是你无法验证其承诺。<\/p>\n<h2>个人投资者并非天然处于劣势<\/h2>\n<p>个人确实缺少机构的基础设施和团队，但也没有大规模资金的容量负担、复杂审批链和短期排名压力。个人更适合利用低换手、长周期、容量有限或需要耐心持有的机会。这个优势只有在减少追逐、控制成本和保持研究纪律时才存在；如果频繁追随榜单与热点，资金灵活反而会变成随时改变策略的弱点。<\/p>\n<h2>认知落地：把概念变成决策<\/h2>\n<p>这一讲不是让你记住一个口号，而是训练你在真实投资问题里识别它。围绕“量化生态圈：散户、私募、券商、平台，谁在割谁？”，可以用下面的四步把抽象概念落地。<\/p>\n<ol>\n<li>写清决策对象：谁在什么时间、基于哪些已知信息做什么决定。<\/li>\n<li>区分模型、信号、订单与持仓，避免把一个判断直接当成完整策略。<\/li>\n<li>列出可观察证据与反例：什么现象支持这个判断，什么现象会推翻它。<\/li>\n<li>补上数据、执行和风险约束，再判断它是否具备系统化与可复现性。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.sec.gov/about/reports-publications/special-studies/algo_trading_report_2020.pdf\">SEC：Algorithmic Trading in U.S. Capital Markets<\/a>：算法交易的市场结构、收益与风险。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://papers.ssrn.com/sol3/papers.cfm?abstract_id=2326253\">Bailey 等：The Probability of Backtest Overfitting<\/a>：多重试验与回测过拟合的量化框架。<\/li>\n<li><strong>适用条件与边界<\/strong>：区分研究流程、自动化执行与高频交易；机构、市场和监管口径不能直接互换。<\/li>\n<li><strong>主要失败模式<\/strong>：把“使用代码”误当作“有科学证据”，或忽略数据、成本、风控和监控形成的完整闭环。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>只记定义，不说明决策时点和输入信息；修正方法是把概念改写成一条可执行规则。<\/li>\n<li>用一次成功案例证明方法有效；修正方法是同时寻找失败样本和适用边界。<\/li>\n<li>把技术复杂度当成投资优势；真正需要验证的是信息、行为或结构性机制。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>能用一句话说明本讲概念解决什么决策问题<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能指出至少一个反例或失效条件<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能把主观判断改写为可记录、可复核的规则<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能说明它在完整策略链条中的位置<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>生态参与者的商业模式决定其行为激励。<\/li>\n<li>评估产品不能只看收益，还要看数据口径、风险、容量和交易成本。<\/li>\n<li>理解利益冲突比用“收割”概括所有关系更有用。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>选择一个你正在使用的行情、回测或策略服务，画出资金流和信息流，并回答服务方在什么情况下赚得更多、这与你的利益是否一致。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第007讲 量化≠高频交易！拆解你对量化最大的误解<\/strong>。<\/p>"}, {"n": 7, "title": "量化≠高频交易！拆解你对量化最大的误解", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。模型、历史数据与示例均不保证未来表现。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>区分量化、程序化、算法执行与高频交易。<\/li>\n<li>理解策略频率由信息半衰期和成本共同决定。<\/li>\n<li>避免把自动化速度误当成策略优势。<\/li>\n<\/ul>\n<h2>四个常被混用的概念<\/h2>\n<p><strong>量化投资<\/strong>强调数据与规则驱动；<strong>程序化交易<\/strong>强调由程序生成或提交订单；<strong>算法执行<\/strong>关注如何拆分大订单、降低冲击；<strong>高频交易<\/strong>则在极短持有期和高更新频率下竞争微小优势。<\/p>\n<p>它们有交集，但不等价。一个每季度调仓的价值因子组合是量化策略，却不是高频；一个机构用算法分批执行主观决定的大订单，是程序化执行，却不一定属于量化选股。<\/p>\n<h2>高频交易在竞争什么<\/h2>\n<p>高频策略通常关注订单簿、价差、短期供需和延迟。优势可能来自更快的数据处理、更优的排队位置、更精细的库存管理和更低的单位成本。其基础设施、数据和风控要求远高于普通日频策略。<\/p>\n<h2>低频并不意味着低技术<\/h2>\n<p>月度多因子、日频趋势和季度资产配置同样需要严格的数据时间戳、组合优化、成本模型与监控。频率较低只是信息变化慢，并不代表研究简单。<\/p>\n<h2>频率选择公式<\/h2>\n<p>可以把可交易优势粗略理解为：<\/p>\n<blockquote>\n<p>净优势 = 信号毛优势 − 交易成本 − 市场冲击 − 模型误差<\/p>\n<\/blockquote>\n<p>频率提高后，机会数量可能增加，但单次优势通常更小，成本和系统风险更高。策略频率应与信号半衰期匹配：财务质量不需要毫秒执行，订单簿失衡也不适合等到月底。<\/p>\n<h2>普通投资者的合理位置<\/h2>\n<p>个人不应在没有基础设施优势时与专业高频团队拼速度。更现实的方向包括：利用更长周期信息、控制换手率、研究小容量资产、建立跨品种组合或把纪律执行做得更好。<\/p>\n<p>速度只有在信息会快速消失时才是优势。对多数策略，正确的数据、稳定的规则和低成本执行比“更快下单”更重要。<\/p>\n<h2>一条信号为什么会有“保质期”<\/h2>\n<p>信号半衰期可以理解为信息优势衰减的速度。财务质量、估值或宏观状态通常变化较慢，频繁交易不一定带来更多有效信息；订单簿失衡和短时价差可能很快消失，慢一分钟就可能不再存在。策略的合理频率因此由信息产生机制决定，而不是由计算机能跑多快决定。<\/p>\n<p>假设某个教学信号在每次调仓前预期带来 0.30% 的毛优势。若单次双边交易成本与滑点合计为 0.10%，尚有 0.20% 的成本前空间；如果为了更快反应而把换手翻倍，毛优势没有同步增加，净优势可能反而下降。这里的数字仅用于说明：<strong>频率是收益与摩擦之间的优化问题，不是越高越先进。<\/strong><\/p>\n<h2>四个概念放在一张流程图里<\/h2>\n<blockquote>\n<p>研究规则产生目标仓位 → 程序化系统生成订单 → 执行算法拆分订单 → 某些参与者用高频方法提供或争夺流动性<\/p>\n<\/blockquote>\n<p>一套系统可以同时包含这四层，也可以只包含其中一两层。季度因子策略可能用算法执行减少冲击，但仍然不是高频策略；主观基金经理也可能通过程序化交易提交订单，但其投资判断并非量化模型产生。区分它们能帮助我们把研究收益、执行改进和速度优势分别归因。<\/p>\n<h2>高频系统多出来的不是一个“快”字<\/h2>\n<p>频率提高后，系统必须面对更严格的时钟同步、行情丢包、订单状态、重复报单、库存暴露和异常停机问题。日频策略发现数据有误时可能还有人工复核窗口，高频系统中的错误可能在人工反应前重复发生。因此，高频交易的核心门槛不仅是延迟，还包括在极短时间内保持账本、风控和系统状态一致。<\/p>\n<p>这也解释了为什么普通研究者不应简单把日频策略改成分钟级：数据量增大只是表面变化，微观结构噪声、买卖价差、排队位置和真实成交概率都会进入模型。如果这些环节仍用日频假设，回测精度看似提高，可信度却可能下降。<\/p>\n<h2>选择频率的五步法<\/h2>\n<ol>\n<li>说明信息为何产生，以及谁会使它消失。<\/li>\n<li>估计信号从形成到衰减的大致时间尺度。<\/li>\n<li>使用相匹配的数据频率，避免用分钟数据解释季度信息。<\/li>\n<li>计算换手、价差、滑点和市场冲击后的净优势。<\/li>\n<li>检查系统故障和监控能力是否能支撑该频率。<\/li>\n<\/ol>\n<p>只有前四步回答“可能赚什么”，第五步回答“出错时会亏什么”。两者共同决定频率是否适合。<\/p>\n<h2>认知落地：把概念变成决策<\/h2>\n<p>这一讲不是让你记住一个口号，而是训练你在真实投资问题里识别它。围绕“量化≠高频交易！拆解你对量化最大的误解”，可以用下面的四步把抽象概念落地。<\/p>\n<ol>\n<li>写清决策对象：谁在什么时间、基于哪些已知信息做什么决定。<\/li>\n<li>区分模型、信号、订单与持仓，避免把一个判断直接当成完整策略。<\/li>\n<li>列出可观察证据与反例：什么现象支持这个判断，什么现象会推翻它。<\/li>\n<li>补上数据、执行和风险约束，再判断它是否具备系统化与可复现性。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.sec.gov/about/reports-publications/special-studies/algo_trading_report_2020.pdf\">SEC：Algorithmic Trading in U.S. Capital Markets<\/a>：算法交易的市场结构、收益与风险。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://papers.ssrn.com/sol3/papers.cfm?abstract_id=2326253\">Bailey 等：The Probability of Backtest Overfitting<\/a>：多重试验与回测过拟合的量化框架。<\/li>\n<li><strong>适用条件与边界<\/strong>：区分研究流程、自动化执行与高频交易；机构、市场和监管口径不能直接互换。<\/li>\n<li><strong>主要失败模式<\/strong>：把“使用代码”误当作“有科学证据”，或忽略数据、成本、风控和监控形成的完整闭环。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>只记定义，不说明决策时点和输入信息；修正方法是把概念改写成一条可执行规则。<\/li>\n<li>用一次成功案例证明方法有效；修正方法是同时寻找失败样本和适用边界。<\/li>\n<li>把技术复杂度当成投资优势；真正需要验证的是信息、行为或结构性机制。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>能用一句话说明本讲概念解决什么决策问题<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能指出至少一个反例或失效条件<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能把主观判断改写为可记录、可复核的规则<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能说明它在完整策略链条中的位置<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>量化不等于高频，程序化执行也不等于量化选股。<\/li>\n<li>频率由信息半衰期决定，并受到成本与冲击约束。<\/li>\n<li>普通投资者更应寻找期限和容量上的差异化，而不是拼基础设施速度。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>列出三个策略：季度价值选股、日频趋势跟随、订单簿做市。分别写出其信息更新速度、合理调仓频率和最主要成本。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第008讲 量化是科学还是艺术？模型思维与市场的不确定性<\/strong>。<\/p>"}, {"n": 8, "title": "量化是科学还是艺术？模型思维与市场的不确定性", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。模型、历史数据与示例均不保证未来表现。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解量化研究中科学方法与经验判断的边界。<\/li>\n<li>区分模型内不确定性和模型外不确定性。<\/li>\n<li>学会在证据、直觉和稳健性之间做取舍。<\/li>\n<\/ul>\n<h2>科学的一面：假设必须接受失败<\/h2>\n<p>量化研究借鉴科学方法：提出假设、定义变量、收集证据、设计检验、公开失败条件并允许他人复现。一个无法被数据反驳的观点，不是合格的研究假设。<\/p>\n<h2>艺术的一面：市场没有固定实验室<\/h2>\n<p>金融市场会因为参与者、制度和技术变化而改变。研究者必须判断哪些历史仍有代表性、哪些异常应保留、哪些约束更符合真实交易。这些选择无法完全由公式自动完成。<\/p>\n<h2>两类不确定性<\/h2>\n<p><strong>模型内不确定性<\/strong>指在既定模型下，收益仍有随机波动，可用概率和区间描述。<strong>模型外不确定性<\/strong>指模型结构本身可能错了，例如制度改变、数据口径变化或参与者行为反转。后者无法仅靠扩大仓位或提高置信度解决。<\/p>\n<h2>模型不是市场的复制品<\/h2>\n<p>模型是有目的的简化。均线忽略公司信息，因子模型压缩个股差异，风险模型用有限暴露解释复杂组合。评价模型不应问“它是否完全真实”，而应问“在什么边界内，它是否帮助我们做出更好决策”。<\/p>\n<h2>研究中的三种判断<\/h2>\n<ol>\n<li><strong>经济判断<\/strong>：为什么这个规律可能存在，谁为收益买单？<\/li>\n<li><strong>统计判断<\/strong>：证据有多强，对样本和参数是否敏感？<\/li>\n<li><strong>工程判断<\/strong>：数据、成本、容量和异常处理能否支撑实盘交易？<\/li>\n<\/ol>\n<p>三者缺一不可。只有故事容易自我欺骗，只有统计容易挖出偶然相关，只有工程则可能高效执行一个没有优势的策略。<\/p>\n<h2>保留谦逊的做法<\/h2>\n<p>使用简单基线、报告不确定区间、保留样本外数据、限制参数自由度、进行情景压力测试，并为模型设置暂停机制。科学不是自信地给出一个数字，而是诚实说明数字可能错在哪里。<\/p>\n<h2>贯穿示例：为什么均线参数没有唯一正确答案<\/h2>\n<p>假设研究者发现 20 日与 60 日均线组合在某段历史中表现较好。科学的一面要求他固定数据、规则和评价指标，检查相邻参数、其他资产和样本外时期；经验判断的一面则要求他决定哪些市场阶段仍具有代表性、成本模型应多保守，以及策略是否符合实际操作能力。<\/p>\n<p>如果只有 20/60 表现突出，而 19/60、21/60 或 20/59 都明显变差，更可能说明参数捕捉了样本噪声。如果一大片相邻参数都呈现相似方向，虽然仍不能证明未来有效，却比孤立峰值更可信。这里的判断不是“凭感觉接受结果”，而是在统计证据之外考察结构是否稳定。<\/p>\n<h2>三种不确定性要用不同工具处理<\/h2>\n<table>\n<thead>\n<tr>\n<th>不确定性<\/th>\n<th>例子<\/th>\n<th>可用工具<\/th>\n<th>工具的边界<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>随机波动<\/td>\n<td>同一策略有盈利月也有亏损月<\/td>\n<td>概率分布、置信区间、情景模拟<\/td>\n<td>依赖历史分布仍有代表性<\/td>\n<\/tr>\n<tr>\n<td>参数估计误差<\/td>\n<td>未来波动率和相关性未知<\/td>\n<td>稳健估计、收缩、参数敏感性<\/td>\n<td>不能修复错误的模型结构<\/td>\n<\/tr>\n<tr>\n<td>结构变化<\/td>\n<td>交易制度、参与者或成本改变<\/td>\n<td>压力测试、状态监控、暂停机制<\/td>\n<td>无法列举所有未知变化<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>把三类问题混在一起会导致错误处置。面对随机亏损频繁换模型，会制造追涨杀跌；面对结构变化只扩大样本窗口，可能让旧制度数据掩盖新现实；面对参数不稳定却加杠杆，则会把估计误差放大成账户损失。<\/p>\n<h2>“主观判断”也要进入审计记录<\/h2>\n<p>量化流程无法消灭判断，只能让判断更透明。研究者选择样本起点、排除异常数据、设定容量假设和决定暂停策略时，都在做判断。专业做法不是声称完全客观，而是记录当时掌握的证据、可选方案、选择理由和未来复核条件。<\/p>\n<p>例如，若因为市场制度改变而缩短训练样本，应同时记录改变发生的依据、被舍弃数据的影响，以及若判断错误会出现什么迹象。这样，经验不再是不可质疑的直觉，而成为可以事后检验的假设。<\/p>\n<h2>一个实用的模型说明书<\/h2>\n<p>任何模型都可以用五句话说明：它服务什么决策；使用哪些当时可见的输入；输出如何进入仓位或订单；在哪些历史与压力情景下检验过；出现什么证据时应降级或停用。写不出这五句话，通常意味着模型与决策之间仍有空白。<\/p>\n<h2>认知落地：把概念变成决策<\/h2>\n<p>这一讲不是让你记住一个口号，而是训练你在真实投资问题里识别它。围绕“量化是科学还是艺术？模型思维与市场的不确定性”，可以用下面的四步把抽象概念落地。<\/p>\n<ol>\n<li>写清决策对象：谁在什么时间、基于哪些已知信息做什么决定。<\/li>\n<li>区分模型、信号、订单与持仓，避免把一个判断直接当成完整策略。<\/li>\n<li>列出可观察证据与反例：什么现象支持这个判断，什么现象会推翻它。<\/li>\n<li>补上数据、执行和风险约束，再判断它是否具备系统化与可复现性。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.sec.gov/about/reports-publications/special-studies/algo_trading_report_2020.pdf\">SEC：Algorithmic Trading in U.S. Capital Markets<\/a>：算法交易的市场结构、收益与风险。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://papers.ssrn.com/sol3/papers.cfm?abstract_id=2326253\">Bailey 等：The Probability of Backtest Overfitting<\/a>：多重试验与回测过拟合的量化框架。<\/li>\n<li><strong>适用条件与边界<\/strong>：区分研究流程、自动化执行与高频交易；机构、市场和监管口径不能直接互换。<\/li>\n<li><strong>主要失败模式<\/strong>：把“使用代码”误当作“有科学证据”，或忽略数据、成本、风控和监控形成的完整闭环。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>只记定义，不说明决策时点和输入信息；修正方法是把概念改写成一条可执行规则。<\/li>\n<li>用一次成功案例证明方法有效；修正方法是同时寻找失败样本和适用边界。<\/li>\n<li>把技术复杂度当成投资优势；真正需要验证的是信息、行为或结构性机制。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>能用一句话说明本讲概念解决什么决策问题<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能指出至少一个反例或失效条件<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能把主观判断改写为可记录、可复核的规则<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能说明它在完整策略链条中的位置<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>量化的科学性来自可证伪与可复现，艺术性来自对边界和现实约束的判断。<\/li>\n<li>市场既有随机性，也有模型结构可能失效的不确定性。<\/li>\n<li>经济、统计和工程三类证据应共同支持策略。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>挑选一个熟悉指标，分别写出它忽略了什么、在哪类市场可能有效、什么现象会证明其解释失效。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第009讲 量化投资的三大核心优势与两个致命软肋<\/strong>。<\/p>"}, {"n": 9, "title": "量化投资的三大核心优势与两个致命软肋", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。模型、历史数据与示例均不保证未来表现。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>总结量化方法最重要的三项结构性优势。<\/li>\n<li>认识数据依赖和模型失效两类致命软肋。<\/li>\n<li>理解优势必须通过治理流程才能兑现。<\/li>\n<\/ul>\n<h2>三大核心优势<\/h2>\n<h3>1. 一致性：把纪律写进流程<\/h3>\n<p>量化系统可以在相同输入下执行相同规则，减少情绪、疲劳和临场叙事造成的标准漂移。一致性不保证规则正确，却让错误能够被识别和复盘。<\/p>\n<h3>2. 可扩展性：同时处理更多信息<\/h3>\n<p>机器可以扫描大量资产、时间窗口和风险暴露，把人从重复计算中释放出来。规模化让横截面比较、多资产配置和实时监控成为可能。<\/p>\n<h3>3. 可检验性：让经验接受证据<\/h3>\n<p>明确规则可以回测、做样本外检验、压力测试和归因分析。研究者能区分收益来自市场上涨、因子暴露、运气还是独立优势。<\/p>\n<h2>两个致命软肋<\/h2>\n<h3>软肋一：模型只认识被喂给它的世界<\/h3>\n<p>错误复权、延迟的财务数据、缺失的退市样本和理想化成交都会制造虚假优势。数据质量不仅是清洗问题，更是“当时能知道什么”的时间问题。<\/p>\n<h3>软肋二：市场会变化，模型会失效<\/h3>\n<p>参与者会学习，交易会拥挤，制度与成本会变化。历史上稳定的关系可能衰减甚至反转。越依赖单一环境的模型，越容易在结构变化中集中暴露。<\/p>\n<h2>优势如何变成真实能力<\/h2>\n<ul>\n<li>用数据血缘和时间戳保护研究输入。<\/li>\n<li>用简单基线和样本外测试约束过拟合。<\/li>\n<li>用组合化降低单一模型失效的伤害。<\/li>\n<li>用交易成本和容量模型校正纸面收益。<\/li>\n<li>用实时监控识别数据、执行和信号漂移。<\/li>\n<li>用预设暂停条件防止自动化放大错误。<\/li>\n<\/ul>\n<p>量化最危险的时刻，往往不是模型明显报错，而是系统运行顺畅、结果看似精确，却建立在错误假设上。<\/p>\n<h2>优势与软肋其实是一体两面<\/h2>\n<p>一致性让系统能够重复执行正确规则，也会重复执行错误规则；可扩展性让模型同时处理更多资产，也会把数据错误扩散到更大组合；可检验性让研究接受历史证据，也可能诱使研究者反复测试直到找到漂亮结果。量化能力越强，治理要求越高。<\/p>\n<p>可以把它概括为一张对照表：<\/p>\n<table>\n<thead>\n<tr>\n<th>能力<\/th>\n<th>正面价值<\/th>\n<th>失控后的后果<\/th>\n<th>对应护栏<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>一致执行<\/td>\n<td>减少临场情绪与标准漂移<\/td>\n<td>错误订单被稳定重复<\/td>\n<td>输入校验、限额、停机开关<\/td>\n<\/tr>\n<tr>\n<td>批量处理<\/td>\n<td>扩展资产与信息覆盖<\/td>\n<td>同一错误污染整个组合<\/td>\n<td>分层验证、抽样复核、风险聚合<\/td>\n<\/tr>\n<tr>\n<td>历史检验<\/td>\n<td>提供反例与基准<\/td>\n<td>多重试验制造虚假冠军<\/td>\n<td>保留样本外、记录全部实验<\/td>\n<\/tr>\n<tr>\n<td>自动监控<\/td>\n<td>更快发现偏离<\/td>\n<td>指标设计错误造成误报或漏报<\/td>\n<td>多层告警、人工复核、演练<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>一次“正常运行”的事故<\/h2>\n<p>假设财务因子策略每天按计划更新，程序没有报错，订单也全部成交，但数据供应商把公告日期处理成了报告期末日期。回测和实时计算都能顺利完成，信号甚至非常稳定；问题在于策略使用了当时尚未公开的信息。系统越自动化，这个错误越可能长期存在并覆盖更多资产。<\/p>\n<p>这个例子说明，工程上的“成功运行”不等于研究上的“信息有效”。监控不仅要看程序有没有报错，还要看数据是否按预期时间到达、信号分布是否合理、实盘交易与研究假设是否一致。<\/p>\n<h2>如何判断模型是在波动，还是已经失效<\/h2>\n<p>单次亏损不能证明模型失效，连续亏损也未必足够。研究者应同时观察四类证据：信号与未来结果的关系是否衰减；策略成本是否显著上升；风险暴露是否偏离设计；市场机制或制度是否发生改变。若只是收益随机波动，但信号、成本和暴露仍在预期区间，贸然停用可能锁定最差时点；若底层关系已经改变，只等待净值修复又会扩大损失。<\/p>\n<p>因此暂停规则最好采用“结果 + 机制 + 运行”组合，而不是只盯一条回撤线。例如回撤触发预警，信号失去区分度或成本持续超限触发降仓，数据与账户对账失败则直接停止新订单。具体阈值属于策略设计，应由历史压力测试和风险承受能力决定。<\/p>\n<h2>把谦逊写进系统<\/h2>\n<p>量化谦逊不是在报告末尾加一句“历史不代表未来”，而是让不确定性真正改变仓位和流程：限制杠杆，分散模型，保留现金与流动性缓冲，设置人工可接管的异常路径，并记录为什么继续运行或暂停。这样，即使判断错误，系统仍保留修正机会。<\/p>\n<h2>认知落地：把概念变成决策<\/h2>\n<p>这一讲不是让你记住一个口号，而是训练你在真实投资问题里识别它。围绕“量化投资的三大核心优势与两个致命软肋”，可以用下面的四步把抽象概念落地。<\/p>\n<ol>\n<li>写清决策对象：谁在什么时间、基于哪些已知信息做什么决定。<\/li>\n<li>区分模型、信号、订单与持仓，避免把一个判断直接当成完整策略。<\/li>\n<li>列出可观察证据与反例：什么现象支持这个判断，什么现象会推翻它。<\/li>\n<li>补上数据、执行和风险约束，再判断它是否具备系统化与可复现性。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.sec.gov/about/reports-publications/special-studies/algo_trading_report_2020.pdf\">SEC：Algorithmic Trading in U.S. Capital Markets<\/a>：算法交易的市场结构、收益与风险。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://papers.ssrn.com/sol3/papers.cfm?abstract_id=2326253\">Bailey 等：The Probability of Backtest Overfitting<\/a>：多重试验与回测过拟合的量化框架。<\/li>\n<li><strong>适用条件与边界<\/strong>：区分研究流程、自动化执行与高频交易；机构、市场和监管口径不能直接互换。<\/li>\n<li><strong>主要失败模式<\/strong>：把“使用代码”误当作“有科学证据”，或忽略数据、成本、风控和监控形成的完整闭环。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>只记定义，不说明决策时点和输入信息；修正方法是把概念改写成一条可执行规则。<\/li>\n<li>用一次成功案例证明方法有效；修正方法是同时寻找失败样本和适用边界。<\/li>\n<li>把技术复杂度当成投资优势；真正需要验证的是信息、行为或结构性机制。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>能用一句话说明本讲概念解决什么决策问题<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能指出至少一个反例或失效条件<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能把主观判断改写为可记录、可复核的规则<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能说明它在完整策略链条中的位置<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>一致性、可扩展和可检验是量化的三项结构性优势。<\/li>\n<li>数据世界不等于真实世界，历史关系也不会自动延续。<\/li>\n<li>治理、监控和组合化决定量化优势能否在实盘交易兑现。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为一个策略写“反方报告”：列出三个可能的数据错误、两个可能的市场结构变化，以及每个风险对应的监控指标。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第010讲 100讲学习路线图：如何从零到构建自己的第一个策略<\/strong>。<\/p>"}, {"n": 10, "title": "100讲学习路线图：如何从零到构建自己的第一个策略", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。模型、历史数据与示例均不保证未来表现。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解整套课程的学习顺序与能力目标。<\/li>\n<li>确定从知识学习到首个策略的最短实践路径。<\/li>\n<li>建立研究日志和阶段验收标准。<\/li>\n<\/ul>\n<h2>为什么路线图比知识清单更重要<\/h2>\n<p>量化知识跨度很大：数学、数据、金融、编程、回测、执行和风控。如果按工具热点随意学习，很容易会写模型却不会验证，会回测却不知道数据是否可靠。<\/p>\n<p>本课程虽然沿用“100讲”名称，实际目录扩展为 106 讲。学习顺序遵循一条完整生产链：世界观—数学—数据—策略—因子—回测—风控—组合—机器学习—实战—反思。<\/p>\n<h2>四个学习阶段<\/h2>\n<h3>阶段一：能读懂<\/h3>\n<p>完成第 1–28 讲。目标是理解收益、风险、数据口径和策略结构，能够识别复权、幸存者偏差和频率选择等基础问题。<\/p>\n<h3>阶段二：能复现<\/h3>\n<p>完成第 29–63 讲。选择一个经典策略和一个因子模型，用统一数据复现结果。此阶段不追求创新，重点是让计算、交易和绩效口径正确。<\/p>\n<h3>阶段三：能验证<\/h3>\n<p>完成第 64–85 讲。加入成本、样本外、稳健性、风控和组合约束。能够回答策略为何有效、在哪些环境失效、最坏可能亏多少。<\/p>\n<h3>阶段四：能运行<\/h3>\n<p>完成第 86–106 讲。谨慎使用机器学习，完成模拟交易、日志、监控、归因和上线清单。最终产出不是漂亮图表，而是一套可重复运行的研究与执行流程。<\/p>\n<h2>第一个策略的最短路径<\/h2>\n<ol>\n<li>选择流动性较好的单一 ETF 或小型资产池。<\/li>\n<li>使用日频数据，避免一开始处理微观结构问题。<\/li>\n<li>复现一个参数少、逻辑清楚的基线策略。<\/li>\n<li>明确信号在何时生成，下一可交易时点执行。<\/li>\n<li>加入显性交易费用、滑点和持仓约束。<\/li>\n<li>划分样本内与样本外，检查参数邻域。<\/li>\n<li>先模拟运行并记录每次信号，再考虑小资金验证。<\/li>\n<\/ol>\n<h2>每讲的学习闭环<\/h2>\n<blockquote>\n<p>理解概念 → 手算一个例子 → 用代码复现 → 找一个反例 → 写入研究日志<\/p>\n<\/blockquote>\n<p>研究日志至少记录：问题、数据版本、假设、代码版本、参数、结果、失败原因和下一步。没有日志，重复试验很容易变成只保留好结果的选择性记忆。<\/p>\n<h2>阶段验收<\/h2>\n<p>你不需要背完所有公式，但应能够独立完成四件事：解释策略逻辑、复现结果、指出偏差、定义风险边界。能做到这四点，才算真正掌握。<\/p>\n<h2>用一个项目贯穿 106 讲<\/h2>\n<p>最有效的学习方法不是每讲换一个新策略，而是让同一条简单策略不断升级。本书建议把“双均线 ETF 策略”当作学习脚手架：前 10 讲把模糊想法写成系统；第 11–20 讲计算收益、波动和回撤；第 21–28 讲建立可靠数据；第 29–53 讲比较趋势、反转和其他经典规则；第 54–63 讲理解因子与风险暴露；第 64–71 讲完成可信回测；第 72–85 讲加入仓位、风险与组合；第 86–95 讲尝试更复杂模型；第 96–102 讲完成部署与监控；最后用第 103–106 讲审计叙事和失效条件。<\/p>\n<p>同一项目持续迭代有两个好处：读者能看到每个新知识具体改变了什么，也能避免“代码越来越多、策略定义却不断漂移”。每次迭代都应保存版本和结果，使改进与退化都有记录。<\/p>\n<h2>第一份策略最小可交付物<\/h2>\n<p>在追求更高收益前，先完成下面七项产物：<\/p>\n<ol>\n<li>一页策略定义卡：资产、数据、信号、仓位、执行、成本、风控。<\/li>\n<li>一份不可修改的原始数据清单及来源、时间范围和更新时间。<\/li>\n<li>一套能够从干净环境运行的代码与依赖说明。<\/li>\n<li>一份基准对照，包括买入并持有或其他合理替代方案。<\/li>\n<li>一份样本内、样本外和参数邻域结果。<\/li>\n<li>一份失败案例，说明策略在哪段历史或哪种假设下表现恶化。<\/li>\n<li>一份研究日志，记录所有主要尝试而不是只保留最佳结果。<\/li>\n<\/ol>\n<p>如果这些产物还没有完成，增加机器学习模型通常只会让未解决的问题更难定位。<\/p>\n<h2>十二周教学示意计划<\/h2>\n<p>下面是一条可调整的节奏，不代表所有人都要在十二周内完成。<\/p>\n<table>\n<thead>\n<tr>\n<th>周次<\/th>\n<th>主要任务<\/th>\n<th>可检查产物<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1–2<\/td>\n<td>明确问题、指标与数据口径<\/td>\n<td>策略定义卡、术语表<\/td>\n<\/tr>\n<tr>\n<td>3–4<\/td>\n<td>下载、清洗和验证日频数据<\/td>\n<td>数据字典、质量报告<\/td>\n<\/tr>\n<tr>\n<td>5–6<\/td>\n<td>实现无成本基线与对照<\/td>\n<td>净值、交易流水、单元测试<\/td>\n<\/tr>\n<tr>\n<td>7–8<\/td>\n<td>加入成本、时点和样本外切分<\/td>\n<td>对照报告、偏差清单<\/td>\n<\/tr>\n<tr>\n<td>9–10<\/td>\n<td>检查参数邻域、市场阶段与压力情景<\/td>\n<td>稳健性报告<\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td>模拟运行、日志与对账<\/td>\n<td>运行日志、异常记录<\/td>\n<\/tr>\n<tr>\n<td>12<\/td>\n<td>复盘并决定继续、修改或停止<\/td>\n<td>决策备忘录<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>如何避免“学了很多，却没有作品”<\/h2>\n<p>每周把学习任务写成一个可验收动词：计算、复现、比较、解释、反驳、部署。不要只写“学习夏普比率”，而要写“用同一组收益分别计算不同无风险收益率和年化口径下的夏普比率，并解释差异”。不要只写“了解过拟合”，而要写“保存所有参数结果，并比较最佳参数与邻域参数的样本外表现”。<\/p>\n<p>最终作品也不应只是一条净值曲线。真正可展示的能力是：别人能复现你的结果，你能指出它为什么可能错，并能说明出错后系统如何停止。<\/p>\n<h2>认知落地：把概念变成决策<\/h2>\n<p>这一讲不是让你记住一个口号，而是训练你在真实投资问题里识别它。围绕“100讲学习路线图：如何从零到构建自己的第一个策略”，可以用下面的四步把抽象概念落地。<\/p>\n<ol>\n<li>写清决策对象：谁在什么时间、基于哪些已知信息做什么决定。<\/li>\n<li>区分模型、信号、订单与持仓，避免把一个判断直接当成完整策略。<\/li>\n<li>列出可观察证据与反例：什么现象支持这个判断，什么现象会推翻它。<\/li>\n<li>补上数据、执行和风险约束，再判断它是否具备系统化与可复现性。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.sec.gov/about/reports-publications/special-studies/algo_trading_report_2020.pdf\">SEC：Algorithmic Trading in U.S. Capital Markets<\/a>：算法交易的市场结构、收益与风险。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://papers.ssrn.com/sol3/papers.cfm?abstract_id=2326253\">Bailey 等：The Probability of Backtest Overfitting<\/a>：多重试验与回测过拟合的量化框架。<\/li>\n<li><strong>适用条件与边界<\/strong>：区分研究流程、自动化执行与高频交易；机构、市场和监管口径不能直接互换。<\/li>\n<li><strong>主要失败模式<\/strong>：把“使用代码”误当作“有科学证据”，或忽略数据、成本、风控和监控形成的完整闭环。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>只记定义，不说明决策时点和输入信息；修正方法是把概念改写成一条可执行规则。<\/li>\n<li>用一次成功案例证明方法有效；修正方法是同时寻找失败样本和适用边界。<\/li>\n<li>把技术复杂度当成投资优势；真正需要验证的是信息、行为或结构性机制。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>能用一句话说明本讲概念解决什么决策问题<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能指出至少一个反例或失效条件<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能把主观判断改写为可记录、可复核的规则<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能说明它在完整策略链条中的位置<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>课程实际包含 106 讲，按量化策略生产链组织。<\/li>\n<li>学习目标依次是能读懂、能复现、能验证、能运行。<\/li>\n<li>第一个策略应选择简单资产、低频数据和少参数基线。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>建立自己的课程研究日志，写下每周可投入时间、首个策略题目、预期完成日期和四项验收标准；为第 11–20 讲预留手算与代码练习时间。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第011讲 收益率怎么算？简单收益率与对数收益率的猫腻<\/strong>。<\/p>"}]}, {"no": 2, "name": "基石·量化必懂的数学", "desc": "不讲复杂公式，只讲金融实战中必须理解的核心指标与思维。", "chapters": [{"n": 11, "title": "收益率怎么算？简单收益率与对数收益率的猫腻", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。公式与数字示例用于解释概念，不代表收益承诺。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>正确计算含分红的简单收益率与对数收益率。<\/li>\n<li>理解两种收益率的复利和可加性差异。<\/li>\n<li>避免把价格变化、资产收益和策略收益混为一谈。<\/li>\n<\/ul>\n<h2>收益率不是“赚了多少钱”<\/h2>\n<p>盈亏金额取决于本金，收益率才便于跨资产和跨时期比较。若期初价格为 (P_{t-1})，期末价格为 (P_t)，期间现金分红为 (D_t)，简单收益率为：<\/p>\n<p>[\nr_t=\\frac{P_t-P_{t-1}+D_t}{P_{t-1}}\n]<\/p>\n<p>忽略分红会低估总回报；使用已复权价格时，又不能重复加分红。<\/p>\n<h2>简单收益率与复利<\/h2>\n<p>多期简单收益不能直接相加，而应连乘：<\/p>\n<p>[\n1+R=\\prod_{t=1}^{T}(1+r_t)\n]<\/p>\n<p>先跌 50% 再涨 50%，最终不是回到原点，而是剩下 (0.5\\times1.5=0.75)，累计亏损 25%。亏损越大，回本所需涨幅越高。<\/p>\n<h2>对数收益率<\/h2>\n<p>不含现金流时，对数收益率为：<\/p>\n<p>[\ng_t=\\ln\\left(\\frac{P_t}{P_{t-1}}\\right)=\\ln(1+r_t)\n]<\/p>\n<p>对数收益的优势是时间可加：多期对数收益等于各期之和。它适合统计建模和连续复利表达，但投资者实际账户的累计收益率仍应转换回简单收益：(R=e^{\\sum g_t}-1)。<\/p>\n<h2>两者什么时候差别明显<\/h2>\n<p>小幅波动时，(\\ln(1+r)\\approx r)；波动越大，差异越明显。简单收益下跌最低为 -100%，对数收益在价格趋近零时趋向负无穷。<\/p>\n<h2>三个口径陷阱<\/h2>\n<ul>\n<li>把未复权价格直接用于长期收益，会把分红和拆分误认为损失。<\/li>\n<li>组合横截面收益应使用简单收益加权，不能直接对个股对数收益做同样解释。<\/li>\n<li>日收益均值乘天数不是精确累计收益率，真实财富由复利路径决定。<\/li>\n<\/ul>\n<h2>一笔交易的三种“收益”为什么会不同<\/h2>\n<p>假设一项资产期初价格为 100 元，期末价格为 102 元，期间每份分红 3 元。若只看价格变化，收益率是 2%；若计算持有期总收益，则是 ((102-100+3)/100=5\\%)。如果使用的复权价格已经把分红效果计入，再额外加 3 元就会重复计算。<\/p>\n<p>同一句“赚了 5%”，还可能指资产本身、策略账户或投资者个人资金体验。策略账户收益要加入仓位：若只有一半资金持有该资产，另一半现金收益忽略不计，则资产上涨 5% 只给组合贡献约 2.5%。投资者中途申购或赎回后，账户金额变化又不能直接当作投资收益。<\/p>\n<p>因此计算前先回答三问：收益对象是谁，现金流放在哪里，使用的是原始价格还是已经调整的价格。<\/p>\n<h2>用三期路径看清“相加”和“连乘”<\/h2>\n<p>考虑一组教学示意收益：+10%、-10%、+10%。简单收益之和是 10%，但财富路径为：<\/p>\n<blockquote>\n<p>100 → 110 → 99 → 108.9<\/p>\n<\/blockquote>\n<p>累计收益率只有 8.9%。对数收益可以逐期相加，但相加后的结果仍要通过指数变换还原为账户累计收益。对数收益的“可加”是数学表达便利，不代表投资者可以忽略复利路径。<\/p>\n<table>\n<thead>\n<tr>\n<th>使用场景<\/th>\n<th>更自然的口径<\/th>\n<th>原因<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>描述账户财富变化<\/td>\n<td>简单收益率<\/td>\n<td>可直接连乘得到累计财富<\/td>\n<\/tr>\n<tr>\n<td>同期组合加权<\/td>\n<td>简单收益率<\/td>\n<td>资产权重乘收益具有清晰账户含义<\/td>\n<\/tr>\n<tr>\n<td>时间序列建模<\/td>\n<td>对数收益率常更方便<\/td>\n<td>多期可以相加，数学处理简洁<\/td>\n<\/tr>\n<tr>\n<td>向投资者报告结果<\/td>\n<td>累计简单收益率<\/td>\n<td>对应实际本金变化比例<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>收盘信号与策略收益的时间对齐<\/h2>\n<p>若双均线信号使用第 (t) 日收盘价计算，那么第 (t) 日收盘前并不知道完整信号。教学回测通常让该信号作用于下一可交易期间，即用昨日形成的仓位乘今日收益。若直接用当日信号乘当日收盘到收盘收益，就把当日已发生的信息放回了收益区间，形成前视偏差。<\/p>\n<p>收益率公式本身没有错，错的是把信号、仓位和收益贴在了错误的日期上。任何策略收益表都应保留三列：信号生成时间、仓位生效时间、收益覆盖区间。<\/p>\n<h2>一张收益口径审计卡<\/h2>\n<ul>\n<li>价格是否已经复权，分红是否重复处理？<\/li>\n<li>收益频率是日、周、月还是逐笔？<\/li>\n<li>组合收益使用的是期初权重还是期末权重？<\/li>\n<li>外部现金流是否与投资收益分开？<\/li>\n<li>信号与收益是否至少错开到真实可执行时点？<\/li>\n<li>缺失价格、停牌和退市时采用什么处理？<\/li>\n<\/ul>\n<p>只有这些答案一致，两个策略的收益率才真正可比。<\/p>\n<h2>计算演练：公式之外还要核对口径<\/h2>\n<p>学习“收益率怎么算？简单收益率与对数收益率的猫腻”时，真正容易出错的通常不是按计算器，而是频率、单位、样本和解释口径。完成下面的计算闭环，结果才可比较。<\/p>\n<ol>\n<li>先写变量定义、单位、时间频率与样本区间，再代入公式。<\/li>\n<li>用一个手算小样本验证方向、边界值和极端情形，确认实现没有符号或分母错误。<\/li>\n<li>再用完整数据计算，并同时报告样本数、缺失处理和年化假设。<\/li>\n<li>最后把数值翻译成投资含义，说明它能回答什么、不能回答什么。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nist.gov/programs-projects/nistsematech-engineering-statistics-handbook\">NIST/SEMATECH 统计方法手册<\/a>：统计方法、假设与诊断的官方参考。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://web.stanford.edu/~wfsharpe/art/sr/sr.htm\">William Sharpe：The Sharpe Ratio<\/a>：夏普比率的定义、版本差异与适用限制。<\/li>\n<li><strong>适用条件与边界<\/strong>：公式依赖频率、分布、无风险利率和样本口径；非平稳、厚尾和自相关会破坏简单年化。<\/li>\n<li><strong>主要失败模式<\/strong>：只报一个漂亮指标，不报告分母、样本长度、置信区间和路径风险。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>混用日频、月频与年化结果；修正方法是让频率和年化系数显式化。<\/li>\n<li>只报告一个点估计；修正方法是同时查看样本期、分布、稳定性和极端值。<\/li>\n<li>把统计相关当成因果或可交易利润；还要验证时点、成本和样本外表现。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>公式中的每个变量都有定义和单位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>手算样本与程序结果一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>频率、年化和无风险收益率口径已写明<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>结论包含适用范围与不可解释部分<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>简单收益反映实际财富比例，多期通过连乘复合。<\/li>\n<li>对数收益时间可加，适合建模，但需转换后解释账户回报。<\/li>\n<li>分红、复权和组合聚合必须使用一致口径。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>一项资产先上涨 20%，再下跌 20%。分别计算两期简单收益之和、累计简单收益和对数收益之和，并解释为什么答案不同。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第012讲 年化收益率：如果年化50%，为什么你还会亏钱？<\/strong>。<\/p>"}, {"n": 12, "title": "年化收益率：如果年化50%，为什么你还会亏钱？", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。公式与数字示例用于解释概念，不代表收益承诺。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>区分累计收益率、几何年化和算术年化。<\/li>\n<li>理解样本长度和波动拖累对年化数字的影响。<\/li>\n<li>选择与资金流和策略类型一致的评价口径。<\/li>\n<\/ul>\n<h2>年化不是把短期收益简单放大<\/h2>\n<p>若初始净值为 (V_0)，(T) 年后为 (V_T)，几何年化收益率为：<\/p>\n<p>[\nR_{ann}=\\left(\\frac{V_T}{V_0}\\right)^{1/T}-1\n]<\/p>\n<p>如果数据包含 (N) 个交易日，可近似写为 ((V_N/V_0)^{252/N}-1)。这里的 252 只是常见股票市场年交易日约定，其他市场和频率应使用相应口径。<\/p>\n<h2>为什么“月赚 5%”不等于可靠年化 60%<\/h2>\n<p>短样本年化会把偶然结果指数放大。一个月收益 5% 按复利年化约为 ((1.05)^{12}-1)，但这不代表未来每月都能重复。样本越短，年化估计的不确定性越高。<\/p>\n<h2>算术均值与几何收益<\/h2>\n<p>算术平均回答“单期平均变化”，几何收益回答“财富实际以多快速度复合”。波动会造成复利拖累：+50% 后 -50%，算术平均为 0%，财富却减少 25%。<\/p>\n<p>近似关系常写为：<\/p>\n<p>[\n\\text{几何增长率}\\approx \\text{算术平均收益}-\\frac{1}{2}\\sigma^2\n]<\/p>\n<p>它说明在平均收益相近时，更高波动通常降低长期复利结果。<\/p>\n<h2>有现金流时怎么办<\/h2>\n<p>外部申购赎回会改变账户金额。评价投资经理通常使用时间加权收益，尽量剔除资金流时点影响；评价个人真实资金体验可使用资金加权收益或内部收益率。两者回答的问题不同。<\/p>\n<h2>报告年化的最低要求<\/h2>\n<p>同时披露样本起止、累计收益率、最大回撤、年化波动率、交易成本口径和是否为实盘交易。脱离这些背景，一个漂亮的年化收益率数字几乎没有独立意义。<\/p>\n<h2>同样的累计收益，可以对应完全不同的年化<\/h2>\n<p>假设本金从 100 增长到 120。若用了 6 个月，按相同复利速度外推的年化约为 (1.2^2-1=44\\%)；若用了 3 年，几何年化约为 (1.2^{1/3}-1)，只有约 6.3%。累计收益相同，时间不同，年化含义完全不同。<\/p>\n<p>更关键的是，6 个月得到 20% 并不意味着未来 6 个月还能重复。年化公式只完成了尺度转换，没有自动增加证据。样本越短，外推距离越长，数字越应该被标注为“短期结果的年化表达”，而不是长期能力估计。<\/p>\n<h2>路径会让“平均表现”失真<\/h2>\n<p>考虑两条教学示意路径：<\/p>\n<ul>\n<li>路径 A：第一年 +20%，第二年 +20%。<\/li>\n<li>路径 B：第一年 +60%，第二年 -20%。<\/li>\n<\/ul>\n<p>两者算术平均年收益都是 20%，但路径 A 的两年累计收益为 44%，路径 B 只有 28%。B 的高波动侵蚀了复利。投资者最终拥有多少财富，应由几何复利决定；算术平均更接近“随机抽取一个单期时的平均结果”，不能直接当作长期增长速度。<\/p>\n<h2>资金流会改变谁的体验<\/h2>\n<p>假设基金第一年收益很好，大量资金在第二年初进入，第二年随后亏损。基金从成立以来的时间加权收益可能仍为正，但大部分投资者的资金加权收益可能较差，因为更多本金进入了亏损阶段。这不是谁算错了，而是两个指标回答不同问题。<\/p>\n<table>\n<thead>\n<tr>\n<th>指标<\/th>\n<th>回答的问题<\/th>\n<th>适用场景<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>累计收益率<\/td>\n<td>从起点到终点财富变了多少<\/td>\n<td>描述完整区间结果<\/td>\n<\/tr>\n<tr>\n<td>几何年化收益率<\/td>\n<td>区间财富等价于每年复合多少<\/td>\n<td>比较不同长度的无外部现金流记录<\/td>\n<\/tr>\n<tr>\n<td>时间加权收益率<\/td>\n<td>尽量剔除申购赎回时点影响后，管理表现如何<\/td>\n<td>产品或管理人评价<\/td>\n<\/tr>\n<tr>\n<td>资金加权收益率<\/td>\n<td>投资者实际投入资金的回报如何<\/td>\n<td>个人资金体验<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>年化收益必须与风险一起读<\/h2>\n<p>“年化 50%”仍然可能伴随更深回撤、更高波动或更大尾部风险。若净值先翻倍再大幅下跌，完整区间年化可能仍然漂亮，但在高点进入的投资者可能遭受严重亏损。报告至少应把年化收益率与累计收益率、年化波动率、最大回撤、样本长度和成本口径并列。<\/p>\n<p>对双均线策略，还要说明空仓资金如何计息、交易成本是否逐笔扣除、首个可用信号前的窗口如何处理。少写一项，年化结果都可能改变。<\/p>\n<h2>计算演练：公式之外还要核对口径<\/h2>\n<p>学习“年化收益率：如果年化50%，为什么你还会亏钱？”时，真正容易出错的通常不是按计算器，而是频率、单位、样本和解释口径。完成下面的计算闭环，结果才可比较。<\/p>\n<ol>\n<li>先写变量定义、单位、时间频率与样本区间，再代入公式。<\/li>\n<li>用一个手算小样本验证方向、边界值和极端情形，确认实现没有符号或分母错误。<\/li>\n<li>再用完整数据计算，并同时报告样本数、缺失处理和年化假设。<\/li>\n<li>最后把数值翻译成投资含义，说明它能回答什么、不能回答什么。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nist.gov/programs-projects/nistsematech-engineering-statistics-handbook\">NIST/SEMATECH 统计方法手册<\/a>：统计方法、假设与诊断的官方参考。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://web.stanford.edu/~wfsharpe/art/sr/sr.htm\">William Sharpe：The Sharpe Ratio<\/a>：夏普比率的定义、版本差异与适用限制。<\/li>\n<li><strong>适用条件与边界<\/strong>：公式依赖频率、分布、无风险利率和样本口径；非平稳、厚尾和自相关会破坏简单年化。<\/li>\n<li><strong>主要失败模式<\/strong>：只报一个漂亮指标，不报告分母、样本长度、置信区间和路径风险。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>混用日频、月频与年化结果；修正方法是让频率和年化系数显式化。<\/li>\n<li>只报告一个点估计；修正方法是同时查看样本期、分布、稳定性和极端值。<\/li>\n<li>把统计相关当成因果或可交易利润；还要验证时点、成本和样本外表现。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>公式中的每个变量都有定义和单位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>手算样本与程序结果一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>频率、年化和无风险收益率口径已写明<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>结论包含适用范围与不可解释部分<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>几何年化来自财富复合，不是短期收益的线性外推。<\/li>\n<li>波动拖累会让几何增长低于算术平均。<\/li>\n<li>时间加权与资金加权收益回答不同问题。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>策略两年收益分别为 +40% 和 -20%。计算累计收益率、算术年均收益和几何年化收益率，并比较三者。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第013讲 波动率：风险的长相，你真的认识它吗？<\/strong>。<\/p>"}, {"n": 13, "title": "波动率：风险的长相，你真的认识它吗？", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。公式与数字示例用于解释概念，不代表收益承诺。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>掌握历史波动率的基本计算。<\/li>\n<li>理解波动聚集与频率缩放的假设。<\/li>\n<li>认识波动率不能覆盖的风险。<\/li>\n<\/ul>\n<h2>波动率度量什么<\/h2>\n<p>波动率通常是收益率标准差，描述收益围绕均值的离散程度：<\/p>\n<p>[\n\\sigma=\\sqrt{\\frac{1}{N-1}\\sum_{t=1}^{N}(r_t-\\bar r)^2}\n]<\/p>\n<p>日频波动在独立同分布近似下可年化为 (\\sigma_{ann}=\\sigma_{daily}\\sqrt{252})。平方根时间缩放依赖弱相关与稳定分布，不能在所有资产和时期机械使用。<\/p>\n<h2>波动率的三张脸<\/h2>\n<ul>\n<li><strong>历史波动率<\/strong>：从已经发生的收益计算。<\/li>\n<li><strong>隐含波动率<\/strong>：从期权价格反推市场对未来波动的定价。<\/li>\n<li><strong>预测波动率<\/strong>：用滚动窗口、EWMA 或 GARCH 等模型估计未来风险。<\/li>\n<\/ul>\n<p>三者不应混用。历史安静不代表未来安全，隐含波动也不是未来波动的无偏承诺。<\/p>\n<h2>波动会聚集<\/h2>\n<p>金融收益常出现“平静期接平静期、剧烈期接剧烈期”。固定长期标准差会反应迟钝，因此风险管理常给近期数据更高权重。但窗口越短，估计越敏感。<\/p>\n<h2>波动率不等于全部风险<\/h2>\n<p>标准差把上涨和下跌都视为波动；它看不到流动性冻结、跳空、信用违约和无法成交。两个策略波动相同，尾部亏损和恢复时间可能完全不同。<\/p>\n<h2>使用原则<\/h2>\n<p>报告波动时应说明收益频率、窗口、年化因子、是否去极值以及是否存在自相关。最好同时观察下行波动、最大回撤、尾部分位数和流动性指标。<\/p>\n<h2>波动率把什么压缩成了一个数字<\/h2>\n<p>假设策略 A 的月收益在 -2% 到 +2% 间来回变化，策略 B 大部分月份接近 0，但偶尔出现一次 -8% 或 +8%。两者可能得到相近标准差，风险体验却不同：A 是持续的小幅不确定，B 是低频的大幅跳变。标准差记录“离均值有多远”，不记录偏离发生的方向、顺序和可成交性。<\/p>\n<p>计算波动率时，均值、频率和样本窗口都被压缩进一个数字。压缩便于比较，也会丢失信息。因此波动率像地图比例尺：可以快速判断距离，不能告诉你途中是否有悬崖。<\/p>\n<h2>一个年化演示，以及它依赖的假设<\/h2>\n<p>若教学样本的日收益标准差为 1%，使用 (sqrt{252}) 缩放，年化波动率约为 15.9%。这个计算隐含了每日波动可以近似按时间累积、收益依赖较弱、统计结构相对稳定等条件。<\/p>\n<p>如果收益有明显自相关、持仓估值被平滑，或者市场只在特定状态下剧烈波动，机械缩放就可能低估或高估风险。更稳健的报告方式是同时给出日频估计、使用的年化因子、滚动窗口结果和压力期结果。<\/p>\n<h2>窗口选择是一种取舍，不是技术细节<\/h2>\n<p>20 日窗口对近期变化反应快，但容易被少数异常日主导；250 日窗口更平滑，却可能在市场已经转入高波动状态后反应迟钝。可以把两者并列，而不是寻找唯一正确窗口：短窗用于预警，长窗用于观察背景，再通过仓位变动速度限制频繁追涨杀跌。<\/p>\n<p>在波动率目标策略中，估计波动上升会降低仓位。若估计噪声很大，仓位也会不断变化，额外产生换手和成本。因此风险模型不仅要“测得准”，还要让下游决策稳定可执行。<\/p>\n<h2>波动率看不见的四类风险<\/h2>\n<ol>\n<li><strong>方向风险<\/strong>：标准差同等对待上涨与下跌。<\/li>\n<li><strong>尾部风险<\/strong>：少量极端损失可能在短样本里完全没有出现。<\/li>\n<li><strong>流动性风险<\/strong>：报价存在不等于能够按该价格成交。<\/li>\n<li><strong>路径风险<\/strong>：连续亏损和漫长恢复期会影响生存，即使长期波动相近。<\/li>\n<\/ol>\n<p>所以波动率适合回答“收益通常有多分散”，不能独立回答“最坏会亏多少”或“能否及时退出”。<\/p>\n<h2>计算演练：公式之外还要核对口径<\/h2>\n<p>学习“波动率：风险的长相，你真的认识它吗？”时，真正容易出错的通常不是按计算器，而是频率、单位、样本和解释口径。完成下面的计算闭环，结果才可比较。<\/p>\n<ol>\n<li>先写变量定义、单位、时间频率与样本区间，再代入公式。<\/li>\n<li>用一个手算小样本验证方向、边界值和极端情形，确认实现没有符号或分母错误。<\/li>\n<li>再用完整数据计算，并同时报告样本数、缺失处理和年化假设。<\/li>\n<li>最后把数值翻译成投资含义，说明它能回答什么、不能回答什么。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nist.gov/programs-projects/nistsematech-engineering-statistics-handbook\">NIST/SEMATECH 统计方法手册<\/a>：统计方法、假设与诊断的官方参考。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://web.stanford.edu/~wfsharpe/art/sr/sr.htm\">William Sharpe：The Sharpe Ratio<\/a>：夏普比率的定义、版本差异与适用限制。<\/li>\n<li><strong>适用条件与边界<\/strong>：公式依赖频率、分布、无风险利率和样本口径；非平稳、厚尾和自相关会破坏简单年化。<\/li>\n<li><strong>主要失败模式<\/strong>：只报一个漂亮指标，不报告分母、样本长度、置信区间和路径风险。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>混用日频、月频与年化结果；修正方法是让频率和年化系数显式化。<\/li>\n<li>只报告一个点估计；修正方法是同时查看样本期、分布、稳定性和极端值。<\/li>\n<li>把统计相关当成因果或可交易利润；还要验证时点、成本和样本外表现。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>公式中的每个变量都有定义和单位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>手算样本与程序结果一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>频率、年化和无风险收益率口径已写明<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>结论包含适用范围与不可解释部分<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>波动率是收益离散程度，不是损失的完整定义。<\/li>\n<li>年化平方根规则依赖近似假设。<\/li>\n<li>历史、隐含和预测波动率具有不同信息含义。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>用任意 20 个日收益计算标准差，再分别用 20 日与 60 日滚动窗口比较结果，观察窗口长度如何影响风险判断。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第014讲 夏普比率：性价比之王，多少才算好？<\/strong>。<\/p>"}, {"n": 14, "title": "夏普比率：性价比之王，多少才算好？", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。公式与数字示例用于解释概念，不代表收益承诺。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解夏普比率的公式与经济含义。<\/li>\n<li>知道频率、基准和自相关如何影响结果。<\/li>\n<li>避免用单一阈值评价所有策略。<\/li>\n<\/ul>\n<h2>夏普比率在比较什么<\/h2>\n<p>夏普比率用单位总风险对应的超额收益衡量风险调整表现：<\/p>\n<p>[\nS=\\frac{E[R_p-R_f]}{\\sigma(R_p-R_f)}\n]<\/p>\n<p>其中 (R_p) 为组合收益，(R_f) 为无风险利率。日频估计常将日均超额收益除以日标准差，再乘 (\\sqrt{252})。频率和无风险利率必须一致。<\/p>\n<h2>为什么它受欢迎<\/h2>\n<p>单看收益会奖励加杠杆，单看波动会偏爱不赚钱的低风险资产。夏普比率把两者放到同一尺度，便于比较相似期限、相似流动性的策略。<\/p>\n<h2>“多少才算好”没有统一答案<\/h2>\n<p>样本长度、资产类别、回测或实盘交易、交易成本和策略容量都会影响夏普比率。短样本中的高夏普比率可能只是运气；平滑估值、低流动性资产或卖出尾部风险的策略也可能制造虚假稳定。<\/p>\n<h2>四个误区<\/h2>\n<ol>\n<li><strong>忽略自相关<\/strong>：收益被平滑或持仓重叠时，平方根年化可能高估夏普比率。<\/li>\n<li><strong>忽略非正态<\/strong>：夏普比率不能区分温和波动和偶发巨亏。<\/li>\n<li><strong>忽略多次试验<\/strong>：从上百组参数中挑最高值，会产生选择偏差。<\/li>\n<li><strong>跨类型硬比较<\/strong>：市场中性日频策略与长期权益组合的风险结构不同。<\/li>\n<\/ol>\n<h2>如何更完整地用<\/h2>\n<p>同时报告样本置信度、最大回撤、偏度、换手率、成本、不同阶段表现和样本外结果。夏普比率适合做起点，不适合做终局判决。<\/p>\n<h2>手算两个“收益更高”的策略<\/h2>\n<p>假设无风险收益率为 2%，策略 A 的年化收益率为 10%、年化波动率为 8%，教学简化夏普比率为 ((10\\%-2\\%)/8\\%=1)。策略 B 的年化收益率为 16%、年化波动率为 20%，夏普比率为 0.7。B 赚得更多，但每单位总波动得到的超额收益更少。<\/p>\n<p>这不意味着 A 必然更值得投资。A 可能容量很小、收益被平滑，或隐藏一次性尾部风险；B 可能与现有组合相关性更低。夏普比率完成的是一项标准化比较，不是替投资者决定目标、约束和风险承受能力。<\/p>\n<h2>为什么加杠杆不一定改变理论夏普<\/h2>\n<p>在忽略融资成本、非线性成本和风险限制的理想情况下，策略收益与波动都随杠杆同比例放大，夏普比率近似不变。这正是它能区分“更高收益来自更多风险”还是“单位风险回报更高”的原因。<\/p>\n<p>真实世界中，杠杆会增加融资成本、保证金压力、市场冲击和强制去杠杆风险，因此实际夏普可能下降。若某份报告只展示加杠杆后的收益，却不展示波动、回撤与融资假设，就无法判断收益提高来自能力还是风险放大。<\/p>\n<h2>三种策略如何制造“漂亮夏普”<\/h2>\n<ul>\n<li><strong>平滑估值<\/strong>：低流动性资产没有及时反映真实价格，观测波动被压低。<\/li>\n<li><strong>卖出尾部风险<\/strong>：大部分时期小赚，尚未发生的极端损失不在样本中。<\/li>\n<li><strong>多次挑选<\/strong>：测试大量参数，只公布历史最高夏普的组合。<\/li>\n<\/ul>\n<p>这三种情况的共同点是分母或样本选择被美化。检查夏普比率时，不只要重算公式，还要审计收益序列如何生成。<\/p>\n<h2>一份完整的夏普比较表<\/h2>\n<p>至少并列报告：样本起止与频率、无风险收益率口径、费用前后收益、年化波动率、最大回撤、偏度、最差月份、换手率、容量假设、样本外夏普和试验次数。两个策略只有在频率、成本和估值方式相近时，夏普比率才具有更直接的可比性。<\/p>\n<p>对双均线策略，还应把买入并持有作为基准，检查较低波动是否只是因为长期空仓，以及空仓后放弃的市场收益是否值得。<\/p>\n<h2>计算演练：公式之外还要核对口径<\/h2>\n<p>学习“夏普比率：性价比之王，多少才算好？”时，真正容易出错的通常不是按计算器，而是频率、单位、样本和解释口径。完成下面的计算闭环，结果才可比较。<\/p>\n<ol>\n<li>先写变量定义、单位、时间频率与样本区间，再代入公式。<\/li>\n<li>用一个手算小样本验证方向、边界值和极端情形，确认实现没有符号或分母错误。<\/li>\n<li>再用完整数据计算，并同时报告样本数、缺失处理和年化假设。<\/li>\n<li>最后把数值翻译成投资含义，说明它能回答什么、不能回答什么。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://web.stanford.edu/~wfsharpe/art/sr/sr.htm\">William Sharpe：The Sharpe Ratio<\/a>：夏普比率的定义、版本差异与适用限制。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nist.gov/programs-projects/nistsematech-engineering-statistics-handbook\">NIST/SEMATECH 统计方法手册<\/a>：统计方法、假设与诊断的官方参考。<\/li>\n<li><strong>适用条件与边界<\/strong>：公式依赖频率、分布、无风险利率和样本口径；非平稳、厚尾和自相关会破坏简单年化。<\/li>\n<li><strong>主要失败模式<\/strong>：只报一个漂亮指标，不报告分母、样本长度、置信区间和路径风险。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>混用日频、月频与年化结果；修正方法是让频率和年化系数显式化。<\/li>\n<li>只报告一个点估计；修正方法是同时查看样本期、分布、稳定性和极端值。<\/li>\n<li>把统计相关当成因果或可交易利润；还要验证时点、成本和样本外表现。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>公式中的每个变量都有定义和单位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>手算样本与程序结果一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>频率、年化和无风险收益率口径已写明<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>结论包含适用范围与不可解释部分<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>夏普比率衡量单位总波动对应的超额收益。<\/li>\n<li>统一阈值缺乏意义，必须结合样本、流动性和策略结构。<\/li>\n<li>自相关、尾部风险和参数筛选都会虚增夏普比率。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>两个策略年化收益率分别为 12% 和 18%，波动分别为 8% 和 20%，无风险利率为 2%。计算夏普比率，并说明为什么仍不能仅凭结果决定投资。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第015讲 最大回撤：你的心脏能否扛过这个深坑？<\/strong>。<\/p>"}, {"n": 15, "title": "最大回撤：你的心脏能否扛过这个深坑？", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。公式与数字示例用于解释概念，不代表收益承诺。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>会计算最大回撤、回撤持续期与恢复期。<\/li>\n<li>理解回撤的路径依赖和样本依赖。<\/li>\n<li>把回撤用于仓位与生存性评估。<\/li>\n<\/ul>\n<h2>回撤描述“从高点掉了多深”<\/h2>\n<p>设净值为 (V_t)，历史峰值为 (H_t=\\max_{s\\le t}V_s)，当前回撤为：<\/p>\n<p>[\nDD_t=\\frac{V_t}{H_t}-1\n]<\/p>\n<p>最大回撤是样本期内 (DD_t) 的最小值。它必须按净值路径计算，不能从年度收益表直接推断。<\/p>\n<h2>深度之外还要看时间<\/h2>\n<ul>\n<li><strong>回撤开始<\/strong>：净值离开前高。<\/li>\n<li><strong>谷底<\/strong>：回撤最深点。<\/li>\n<li><strong>恢复<\/strong>：净值重新超过前高。<\/li>\n<li><strong>水下期<\/strong>：从离开高点到完全恢复的时间。<\/li>\n<\/ul>\n<p>同样 -20% 回撤，一个月恢复和三年恢复，对资金与心理的影响完全不同。<\/p>\n<h2>回本数学<\/h2>\n<p>亏损 (L) 后回本所需涨幅为 (L/(1-L))。亏 20% 需要涨 25%，亏 50% 需要涨 100%。深回撤会显著损害复利和继续承担风险的能力。<\/p>\n<h2>最大回撤的局限<\/h2>\n<p>它只记录样本中最坏的一次，强烈依赖起止时间；也不告诉你最坏情况发生的概率。历史没有出现的尾部事件不会进入数字。<\/p>\n<h2>风控应用<\/h2>\n<p>策略设计应同时查看多次回撤分布、持续期、恢复速度和回撤期间的风险暴露。仓位不应只按平均波动设定，还要评估投资者能否在预期极端回撤中继续执行。<\/p>\n<h2>从一条净值路径手算回撤<\/h2>\n<p>考虑教学示意净值：100、110、105、88、96、112。历史峰值依次为 100、110、110、110、110、112；对应回撤约为 0%、0%、-4.5%、-20%、-12.7%、0%。最大回撤为 -20%，从净值 110 的峰值开始，在 88 处到达谷底，直到 112 才完全修复。<\/p>\n<p>如果只看期初 100 到期末 112，会得到 12% 的正收益，却看不到持有者中途曾损失峰值资金的五分之一。回撤把终点收益无法表达的路径压力重新放回评价中。<\/p>\n<h2>相同最大回撤，不代表相同风险<\/h2>\n<p>策略 A 突然下跌 20%，一个月后恢复；策略 B 缓慢下跌 20%，两年后仍未回到前高。两者最大回撤数字相同，但 B 占用资金更久，也更容易引发赎回、策略修改或错过其他机会。因此至少同时记录回撤深度、达到谷底的时间和恢复时间。<\/p>\n<p>最大回撤还受样本起止影响。若样本恰好从危机后开始，历史数字会异常温和；若策略尚未恢复，水下期仍在继续，不能把它当作已完成事件。<\/p>\n<h2>回撤如何反推仓位<\/h2>\n<p>假设某策略未加杠杆历史压力回撤为 20%，投资者能够承受的组合回撤上限只有 10%。在非常粗略的线性近似下，分配一半风险资金可能使该策略对组合的回撤贡献接近 10%；但危机相关性、非线性损失和更坏的未来情景会破坏这个近似。<\/p>\n<p>因此仓位设计不能把历史最大回撤当作未来硬上限，而应加入安全缓冲、相关性压力和流动性约束。若只有在“未来不会比历史更坏”的前提下才能存活，系统就不够稳健。<\/p>\n<h2>回撤触发器不能只有一个按钮<\/h2>\n<p>可以设置分级响应：轻度偏离加强监控，中度偏离限制新增风险，重度偏离暂停新订单并排查数据、执行和模型，确认机制失效后再退役。若触发线只根据最近净值临时移动，回撤控制就会变成追涨杀跌。<\/p>\n<p>真正需要提前写清的是：使用哪个净值口径、何时计算、谁有权降仓、暂停后如何影子运行，以及满足什么证据才能恢复。<\/p>\n<h2>计算演练：公式之外还要核对口径<\/h2>\n<p>学习“最大回撤：你的心脏能否扛过这个深坑？”时，真正容易出错的通常不是按计算器，而是频率、单位、样本和解释口径。完成下面的计算闭环，结果才可比较。<\/p>\n<ol>\n<li>先写变量定义、单位、时间频率与样本区间，再代入公式。<\/li>\n<li>用一个手算小样本验证方向、边界值和极端情形，确认实现没有符号或分母错误。<\/li>\n<li>再用完整数据计算，并同时报告样本数、缺失处理和年化假设。<\/li>\n<li>最后把数值翻译成投资含义，说明它能回答什么、不能回答什么。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nist.gov/programs-projects/nistsematech-engineering-statistics-handbook\">NIST/SEMATECH 统计方法手册<\/a>：统计方法、假设与诊断的官方参考。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://web.stanford.edu/~wfsharpe/art/sr/sr.htm\">William Sharpe：The Sharpe Ratio<\/a>：夏普比率的定义、版本差异与适用限制。<\/li>\n<li><strong>适用条件与边界<\/strong>：公式依赖频率、分布、无风险利率和样本口径；非平稳、厚尾和自相关会破坏简单年化。<\/li>\n<li><strong>主要失败模式<\/strong>：只报一个漂亮指标，不报告分母、样本长度、置信区间和路径风险。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>混用日频、月频与年化结果；修正方法是让频率和年化系数显式化。<\/li>\n<li>只报告一个点估计；修正方法是同时查看样本期、分布、稳定性和极端值。<\/li>\n<li>把统计相关当成因果或可交易利润；还要验证时点、成本和样本外表现。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>公式中的每个变量都有定义和单位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>手算样本与程序结果一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>频率、年化和无风险收益率口径已写明<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>结论包含适用范围与不可解释部分<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>最大回撤是净值相对历史峰值的最大跌幅。<\/li>\n<li>回撤深度、持续期和恢复期应同时分析。<\/li>\n<li>历史最大回撤不是未来亏损上限。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>构造净值序列 100、110、105、88、95、112，逐期计算峰值和回撤，找出最大回撤、谷底及恢复点。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第016讲 正态分布与厚尾：黑天鹅为什么总是从天而降<\/strong>。<\/p>"}, {"n": 16, "title": "正态分布与厚尾：黑天鹅为什么总是从天而降", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。公式与数字示例用于解释概念，不代表收益承诺。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解正态分布假设在金融中的用途与限制。<\/li>\n<li>识别厚尾、偏度和极端事件的风险含义。<\/li>\n<li>掌握更稳健的风险观察方法。<\/li>\n<\/ul>\n<h2>正态分布为什么常被使用<\/h2>\n<p>正态分布由均值和标准差刻画，数学处理方便，很多统计方法在样本充分、变化较小时具有良好近似。但金融收益并不总按钟形曲线出现。<\/p>\n<h2>厚尾意味着什么<\/h2>\n<p>厚尾表示极端收益出现的概率高于正态模型预期。若用正态分布估计风险，可能把罕见大亏视为几乎不可能，从而配置过高杠杆。<\/p>\n<h2>偏度与峰度<\/h2>\n<p>负偏策略可能多数时间小赚，少数时间大亏；正偏策略则可能频繁小亏、偶尔大赚。峰度反映尾部和中心尖锐程度，但单个样本估计很不稳定。<\/p>\n<h2>极端事件为何反复出现<\/h2>\n<p>波动聚集、杠杆去化、流动性枯竭和参与者同时止损，会让价格变化相互依赖。市场危机并非独立抽签，风险会通过反馈机制自我放大。<\/p>\n<h2>更稳健的做法<\/h2>\n<ul>\n<li>观察经验分位数而不只套正态公式。<\/li>\n<li>使用压力情景和历史极端窗口。<\/li>\n<li>分别报告上涨与下跌尾部。<\/li>\n<li>对杠杆、流动性和集中度设置硬约束。<\/li>\n<li>不把“过去没发生”解释为“未来不可能”。<\/li>\n<\/ul>\n<p>黑天鹅无法被精确预测，但可以通过限制脆弱性来应对。<\/p>\n<h2>正态近似为什么既有用又危险<\/h2>\n<p>正态分布用均值和标准差就能描述完整形状，因此便于计算区间、比较策略和构建基础模型。危险不在于使用近似，而在于忘记它是近似：金融收益可能出现偏斜、厚尾、波动聚集和跳跃，极端事件频率会高于简单正态模型的暗示。<\/p>\n<p>假设两个教学策略的平均月收益和标准差相同。策略 A 的损益围绕均值较对称；策略 B 大部分月份小赚，但极少数月份巨亏。若只保留均值和波动，两者看起来相同；加入偏度、最差月份和经验分位数后，风险画像才会分开。<\/p>\n<h2>厚尾如何改变仓位问题<\/h2>\n<p>在薄尾直觉下，极端损失被视为非常罕见，研究者可能愿意提高杠杆。厚尾意味着历史标准差不足以代表最坏情形：样本越短，未观察到极端事件越不等于极端事件不存在。杠杆又会把本来可恢复的异常波动变成保证金不足或被迫平仓。<\/p>\n<p>因此仓位设计应问：“若损失比常规模型估计更大、资产相关性同时升高、流动性同时下降，账户还能否继续运行？”这比争论某个尾部分布参数更直接地连接到生存。<\/p>\n<h2>用经验分布做一个教学检查<\/h2>\n<p>将历史收益从小到大排序，可以直接观察最差的 1%、5% 或若干个极端样本，并比较正常期与压力期。经验分位数不要求先假设正态，但仍受样本长度和制度变化限制。若历史中从未出现某类冲击，经验分布也无法自动创造它。<\/p>\n<p>所以尾部管理通常同时使用三类材料：历史极端事件提供真实路径，假设情景扩展历史边界，硬性风险约束防止模型完全失效时账户失去修正能力。<\/p>\n<h2>“黑天鹅”不是免做模型的理由<\/h2>\n<p>无法精确预测极端事件，不等于无法管理脆弱性。研究者仍可以减少集中度、限制杠杆、保留流动性缓冲、检查跳空与无法成交情景，并避免依赖“每天都能平仓”的假设。模型的价值不在于保证列举所有未来，而在于让已知脆弱点变得可见。<\/p>\n<h2>计算演练：公式之外还要核对口径<\/h2>\n<p>学习“正态分布与厚尾：黑天鹅为什么总是从天而降”时，真正容易出错的通常不是按计算器，而是频率、单位、样本和解释口径。完成下面的计算闭环，结果才可比较。<\/p>\n<ol>\n<li>先写变量定义、单位、时间频率与样本区间，再代入公式。<\/li>\n<li>用一个手算小样本验证方向、边界值和极端情形，确认实现没有符号或分母错误。<\/li>\n<li>再用完整数据计算，并同时报告样本数、缺失处理和年化假设。<\/li>\n<li>最后把数值翻译成投资含义，说明它能回答什么、不能回答什么。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nist.gov/programs-projects/nistsematech-engineering-statistics-handbook\">NIST/SEMATECH 统计方法手册<\/a>：统计方法、假设与诊断的官方参考。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://web.stanford.edu/~wfsharpe/art/sr/sr.htm\">William Sharpe：The Sharpe Ratio<\/a>：夏普比率的定义、版本差异与适用限制。<\/li>\n<li><strong>适用条件与边界<\/strong>：公式依赖频率、分布、无风险利率和样本口径；非平稳、厚尾和自相关会破坏简单年化。<\/li>\n<li><strong>主要失败模式<\/strong>：只报一个漂亮指标，不报告分母、样本长度、置信区间和路径风险。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>混用日频、月频与年化结果；修正方法是让频率和年化系数显式化。<\/li>\n<li>只报告一个点估计；修正方法是同时查看样本期、分布、稳定性和极端值。<\/li>\n<li>把统计相关当成因果或可交易利润；还要验证时点、成本和样本外表现。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>公式中的每个变量都有定义和单位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>手算样本与程序结果一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>频率、年化和无风险收益率口径已写明<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>结论包含适用范围与不可解释部分<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>正态分布是工具性近似，不是市场定律。<\/li>\n<li>厚尾和负偏会让基于均值与标准差的风险估计过度乐观。<\/li>\n<li>应使用经验分位、压力测试和硬约束补充统计模型。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>比较两个策略：A 每月收益大多为 1%，偶尔 -20%；B 每月收益在 -3% 到 4% 间波动。说明为什么均值和波动相近时，风险体验仍可能不同。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第017讲 相关性陷阱：不要把鸡蛋放一个篮子里？也可能一起碎<\/strong>。<\/p>"}, {"n": 17, "title": "相关性陷阱：不要把鸡蛋放一个篮子里？也可能一起碎", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。公式与数字示例用于解释概念，不代表收益承诺。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>正确解释相关系数及其局限。<\/li>\n<li>理解共同因子与危机相关性。<\/li>\n<li>用风险贡献而非资产数量衡量分散化。<\/li>\n<\/ul>\n<h2>相关性衡量什么<\/h2>\n<p>皮尔逊相关系数为协方差标准化后的结果：<\/p>\n<p>[\n\\rho_{XY}=\\frac{Cov(X,Y)}{\\sigma_X\\sigma_Y}\n]<\/p>\n<p>它主要描述线性共同变化，范围为 -1 到 1。相关性接近零不代表两个资产没有关系，也不代表组合没有共同尾部风险。<\/p>\n<h2>三个陷阱<\/h2>\n<h3>样本窗口陷阱<\/h3>\n<p>短窗口噪声大，长窗口可能掩盖当前变化。相关性不是资产标签，而是特定样本和频率下的估计。<\/p>\n<h3>危机相关性陷阱<\/h3>\n<p>平静期看似独立的资产，危机中可能因去杠杆和流动性需求同时下跌。线性平均相关无法充分描述尾部依赖。<\/p>\n<h3>共同因子陷阱<\/h3>\n<p>多只不同名称的股票可能都暴露于权益市场、利率或同一行业。持有数量增加，不代表风险来源增加。<\/p>\n<h2>相关性如何进入组合风险<\/h2>\n<p>两资产组合方差为：<\/p>\n<p>[\n\\sigma_p^2=w_1^2\\sigma_1^2+w_2^2\\sigma_2^2+2w_1w_2\\rho_{12}\\sigma_1\\sigma_2\n]<\/p>\n<p>相关性越低，理论分散效果越大，但还取决于权重和各自波动。<\/p>\n<h2>更好的分散检查<\/h2>\n<p>同时看因子暴露、下行相关、危机情景、边际风险贡献和流动性。真正的分散是让损失驱动因素不同，而不是让证券代码更多。<\/p>\n<h2>两资产组合的手算直觉<\/h2>\n<p>假设两项资产权重各 50%，年化波动率都为 20%。若相关性为 1，组合波动率仍为 20%；若相关性为 0，代入公式后约为 14.1%；若相关性为 -0.5，组合波动率约为 10%。分散化来自资产没有完全同步变化，而不是来自代码数量增加。<\/p>\n<p>但这组计算把波动率和相关性当作已知常数。真实市场里，两者都在变化，尤其压力期可能同时上升。因此计算结果应被理解为特定输入下的情景，而不是组合未来波动的保证。<\/p>\n<h2>“十只股票”可能只有一个风险来源<\/h2>\n<p>假设一个组合持有十只不同公司股票，但它们都属于同一行业、估值风格相近，并对市场上涨高度敏感。证券数量是十，主要风险来源可能仍只有市场、行业和某一风格因子。若行业政策或流动性冲击发生，十只股票可能一起下跌。<\/p>\n<p>更好的检查方式是把持仓映射到市场、行业、规模、价值、利率、汇率等风险来源，再看每个来源对组合波动和压力损失的贡献。分散化要数“不同的损失驱动因素”，不能只数证券代码。<\/p>\n<h2>相关性为什么会在危机中失灵<\/h2>\n<p>平静期交易动机各不相同，资产可能表现出较低相关；危机中，投资者同时降低杠杆、补保证金或换取现金，共同的流动性需求会压过原有基本面差异。此时，过去平均相关性最不可靠，而组合又最需要分散保护。<\/p>\n<p>因此应单独计算下跌期、压力期或条件相关性，并设计“相关性整体升高”的情景。若组合只有在历史平均相关性下才安全，就没有真正为危机做准备。<\/p>\n<h2>相关性报告的最低信息<\/h2>\n<p>至少说明收益频率、滚动窗口、缺失值对齐、是否包含危机期，以及相关性用于什么决策。日频相关和月频相关回答的时间尺度不同；价格水平相关与收益率相关更不能混用。相关系数最好与散点图、滚动曲线、因子暴露和压力损失一起查看。<\/p>\n<h2>计算演练：公式之外还要核对口径<\/h2>\n<p>学习“相关性陷阱：不要把鸡蛋放一个篮子里？也可能一起碎”时，真正容易出错的通常不是按计算器，而是频率、单位、样本和解释口径。完成下面的计算闭环，结果才可比较。<\/p>\n<ol>\n<li>先写变量定义、单位、时间频率与样本区间，再代入公式。<\/li>\n<li>用一个手算小样本验证方向、边界值和极端情形，确认实现没有符号或分母错误。<\/li>\n<li>再用完整数据计算，并同时报告样本数、缺失处理和年化假设。<\/li>\n<li>最后把数值翻译成投资含义，说明它能回答什么、不能回答什么。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nist.gov/programs-projects/nistsematech-engineering-statistics-handbook\">NIST/SEMATECH 统计方
