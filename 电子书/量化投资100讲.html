<script id="book-data" type="application/json">[{"no": 1, "name": "启航·量化世界观", "desc": "建立对量化的整体认知，破除神话与恐惧。", "chapters": [{"n": 1, "title": "什么是量化投资？——用代码代替直觉的决策系统", "html": "<h1>第001讲 什么是量化投资？——用代码代替直觉的决策系统<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。历史规律、回测结果和模型输出均不保证未来表现。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<p>学完本讲，你应该能够：<\/p>\n<ul>\n<li>用一句话解释什么是量化投资。<\/li>\n<li>说清“量化”与“写代码”“预测涨跌”“高频交易”的区别。<\/li>\n<li>识别一个完整量化决策系统的八个组成部分。<\/li>\n<li>把一个模糊的投资想法，改写成可以验证的规则。<\/li>\n<\/ul>\n<h2>如果明天市场大跌，你会怎么办？<\/h2>\n<p>假设你持有一只已经上涨 20% 的股票，明天突然下跌 6%。<\/p>\n<p>你可能会问：<\/p>\n<ul>\n<li>这是正常波动，还是趋势已经结束？<\/li>\n<li>应该立即止损，还是越跌越买？<\/li>\n<li>如果卖出，卖多少？什么时候再买回来？<\/li>\n<\/ul>\n<p>人在盘中很容易临时改变答案。上涨时相信趋势，下跌时又相信均值回归；盈利时嫌仓位太轻，亏损时才发现仓位太重。真正影响结果的，往往不是“有没有观点”，而是同一种情形下能否持续执行同一套标准。<\/p>\n<p>量化投资要解决的核心问题正是：<\/p>\n<blockquote>\n<p>在交易发生之前，把信息、判断、仓位、执行和风险控制写成一套可重复、可检验、可追溯的决策规则。<\/p>\n<\/blockquote>\n<h2>量化投资到底是什么？<\/h2>\n<p>量化投资是用数据描述市场，用明确规则形成决策，并借助计算工具持续执行和检验的一种投资方法。<\/p>\n<p>可以把它压缩成一个简单表达式：<\/p>\n<blockquote>\n<p>量化投资 = 数据 + 规则 + 组合 + 执行 + 风控 + 评估<\/p>\n<\/blockquote>\n<p>这里最重要的不是“代码”，而是“规则明确”。只要决策条件可以被清楚描述、重复计算和事后核验，即使用 Excel 实现，也已经具备量化特征。反过来，如果只是让程序员把一个不断临时变化的主观判断写进程序，它仍然不是可靠的量化系统。<\/p>\n<p>量化投资通常具备四个特征：<\/p>\n<ol>\n<li><strong>规则明确<\/strong>：什么情况下买、卖、持有，都有事先定义。<\/li>\n<li><strong>结果可复现<\/strong>：相同的数据和参数，应得到相同的决策。<\/li>\n<li><strong>假设可检验<\/strong>：策略逻辑能用历史样本、样本外数据或模拟交易验证。<\/li>\n<li><strong>过程可审计<\/strong>：策略为什么产生这笔交易，可以回到数据和规则中解释。<\/li>\n<\/ol>\n<h2>一套完整系统的八层结构<\/h2>\n<p>只有一个买卖信号，还不能称为完整策略。一个可运行的量化决策系统至少包含八层。<\/p>\n<h3>1. 投资目标<\/h3>\n<p>先回答“想解决什么问题”。目标可能是获取长期超额收益、降低组合波动、控制最大回撤，或稳定跟踪某个指数。目标不同，策略设计和评价标准也不同。<\/p>\n<h3>2. 投资范围<\/h3>\n<p>明确允许交易哪些资产，例如 A 股、ETF、期货或债券；同时定义流动性、上市时间、停牌和可交易状态等筛选条件。<\/p>\n<h3>3. 数据层<\/h3>\n<p>决定使用价格、成交量、财务报表、宏观数据还是另类数据，并处理复权、缺失值、异常值和发布时间。数据时间点处理错误，会让策略在回测中“偷看未来”。<\/p>\n<h3>4. 信号层<\/h3>\n<p>把投资假设转成可计算条件。例如：<\/p>\n<blockquote>\n<p>当短期均线高于长期均线时，认为趋势偏强；反之认为趋势偏弱。<\/p>\n<\/blockquote>\n<p>信号只负责表达“更看好谁”或“当前偏多还是偏空”，并不直接决定最终仓位。<\/p>\n<h3>5. 组合层<\/h3>\n<p>解决“买什么、买多少”。即使两个策略使用相同信号，等权、波动率加权、风险平价或优化器给出的结果也可能完全不同。<\/p>\n<h3>6. 执行层<\/h3>\n<p>规定信号何时计算、订单何时提交、使用市价还是限价、如何处理成交失败，以及是否考虑手续费、滑点和市场冲击。<\/p>\n<h3>7. 风控层<\/h3>\n<p>设置单一资产上限、总仓位上限、止损规则、回撤阈值和异常熔断。风控不是策略亏损后的补丁，而是策略定义的一部分。<\/p>\n<h3>8. 评估与监控层<\/h3>\n<p>持续观察收益、波动、最大回撤、换手率、交易成本和风险暴露，并判断实盘交易表现是否偏离历史可接受范围。<\/p>\n<p>这八层可以串成一条完整链路：<\/p>\n<blockquote>\n<p>投资目标 → 投资范围 → 数据 → 信号 → 组合 → 执行 → 风控 → 评估<\/p>\n<\/blockquote>\n<p>其中任何一层含糊不清，都会在实盘交易中变成风险。<\/p>\n<h2>把一句“感觉会涨”改写成策略<\/h2>\n<p>来看一个教学用的趋势跟随例子。它不代表有效策略，只用于展示量化思维。<\/p>\n<p>模糊想法是：<\/p>\n<blockquote>\n<p>最近涨得不错，趋势可能还会继续。<\/p>\n<\/blockquote>\n<p>量化改写后可以是：<\/p>\n<ol>\n<li><strong>资产<\/strong>：选择一只流动性满足要求的宽基 ETF。<\/li>\n<li><strong>数据<\/strong>：使用每日收盘价，并采用一致的复权口径。<\/li>\n<li><strong>信号<\/strong>：20 日均线高于 60 日均线时记为趋势向上，否则记为趋势向下。<\/li>\n<li><strong>决策时点<\/strong>：在交易日收盘后计算信号。<\/li>\n<li><strong>执行时点<\/strong>：下一交易日执行，避免使用尚未获得的信息。<\/li>\n<li><strong>仓位<\/strong>：趋势向上时持有预设仓位，趋势向下时降低仓位或持有现金类资产。<\/li>\n<li><strong>成本<\/strong>：回测计入手续费、滑点和无法成交的情形。<\/li>\n<li><strong>评价<\/strong>：同时观察年化收益率、最大回撤、换手率和不同市场阶段的表现。<\/li>\n<\/ol>\n<p>改写后，我们不再争论“这次到底会不会涨”，而是可以提出一组更有价值的问题：<\/p>\n<ul>\n<li>为什么选择 20 日和 60 日，而不是其他参数？<\/li>\n<li>换一个市场或时间段，规律还存在吗？<\/li>\n<li>收益是否只是承担了更大的市场风险？<\/li>\n<li>加入真实交易成本后，优势还剩多少？<\/li>\n<li>参数轻微变化时，结果是否立刻崩溃？<\/li>\n<\/ul>\n<p>这就是量化思维的关键转变：从讨论观点，转向检验假设。<\/p>\n<h2>量化不等于什么？<\/h2>\n<h3>量化不等于一定要预测明天涨跌<\/h3>\n<p>很多策略并不预测价格点位。风险平价关注风险分配，套利策略关注相对价差，再平衡策略甚至可以完全不做方向预测。<\/p>\n<h3>量化不等于高频交易<\/h3>\n<p>持有几个月的多因子选股、每月调仓的资产配置，同样属于量化。高频只是按交易速度划分的一类策略。<\/p>\n<h3>量化不等于人工智能<\/h3>\n<p>移动平均线、财务指标排序和固定再平衡都可以构成量化策略。机器学习只是工具箱中的一部分。<\/p>\n<h3>量化不等于稳赚<\/h3>\n<p>模型会失效，数据会变化，交易成本会增加，极端行情会突破历史经验。量化只是让风险和决策更透明，并不能消除不确定性。<\/p>\n<h3>量化不等于把人完全移出系统<\/h3>\n<p>机器擅长稳定计算和执行，人仍需负责提出假设、判断数据质量、设定边界、处理异常并决定何时停止模型。<\/p>\n<h2>判断一个策略是否“真的量化”<\/h2>\n<p>面对任何策略，可以用下面六个问题快速检查：<\/p>\n<ol>\n<li>买入、卖出和持仓规则能否准确写出来？<\/li>\n<li>规则使用的数据在当时是否真实可得？<\/li>\n<li>仓位大小和风险上限是否事先定义？<\/li>\n<li>是否计入手续费、滑点和成交限制？<\/li>\n<li>相同输入能否复现相同结果？<\/li>\n<li>策略失效时，是否有监控和处置规则？<\/li>\n<\/ol>\n<p>如果大多数问题都答不上来，它可能只是“带有数字的主观交易”，而不是完整的量化系统。<\/p>\n<h2>认知落地：把概念变成决策<\/h2>\n<p>这一讲不是让你记住一个口号，而是训练你在真实投资问题里识别它。围绕“什么是量化投资？——用代码代替直觉的决策系统”，可以用下面的四步把抽象概念落地。<\/p>\n<ol>\n<li>写清决策对象：谁在什么时间、基于哪些已知信息做什么决定。<\/li>\n<li>区分模型、信号、订单与持仓，避免把一个判断直接当成完整策略。<\/li>\n<li>列出可观察证据与反例：什么现象支持这个判断，什么现象会推翻它。<\/li>\n<li>补上数据、执行和风险约束，再判断它是否具备系统化与可复现性。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>只记定义，不说明决策时点和输入信息；修正方法是把概念改写成一条可执行规则。<\/li>\n<li>用一次成功案例证明方法有效；修正方法是同时寻找失败样本和适用边界。<\/li>\n<li>把技术复杂度当成投资优势；真正需要验证的是信息、行为或结构性机制。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>能用一句话说明本讲概念解决什么决策问题<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能指出至少一个反例或失效条件<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能把主观判断改写为可记录、可复核的规则<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能说明它在完整策略链条中的位置<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>量化投资的本质，是把投资判断转化为可重复、可检验、可追溯的决策系统。<\/li>\n<li>代码是执行规则的工具，不是量化投资本身。<\/li>\n<li>完整策略包括目标、资产范围、数据、信号、组合、执行、风控和评估八层。<\/li>\n<li>量化不承诺预测正确，而是帮助我们用一致的方法面对不确定性。<\/li>\n<li>好的起点不是寻找“神奇指标”，而是先把一个模糊观点写成可验证假设。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>选择一个你熟悉的投资想法，例如“跌多了会反弹”或“业绩好的公司更值得买”，尝试写出以下六项：<\/p>\n<ol>\n<li>交易什么资产？<\/li>\n<li>使用什么数据？<\/li>\n<li>如何定义“跌多了”或“业绩好”？<\/li>\n<li>何时买入，何时卖出？<\/li>\n<li>每次投入多少资金？<\/li>\n<li>用什么指标判断策略是否有效？<\/li>\n<\/ol>\n<p>如果其中任何一项只能回答“看情况”，就继续把它改写为更明确的条件。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲讨论：<strong>主观交易 vs 量化交易<\/strong>。我们会比较两种方法各自擅长什么，并解释为什么很多交易者真正的对手不是机器，而是自己在压力下不断变化的决策标准。<\/p>"}, {"n": 2, "title": "主观交易 vs 量化交易：你的对手是机器还是自己的情绪？", "html": "<h1>第002讲 主观交易 vs 量化交易：你的对手是机器还是自己的情绪？<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。任何交易方法都可能亏损，系统化规则也无法消除市场风险。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<p>学完本讲，你应该能够：<\/p>\n<ul>\n<li>准确区分主观交易与量化交易，而不是简单判断谁更高级。<\/li>\n<li>理解两种方法各自的信息优势、适用场景和典型失误。<\/li>\n<li>识别交易中最常见的情绪与认知偏差。<\/li>\n<li>把一个依赖“盘感”的判断，改写成可记录、可测试的决策流程。<\/li>\n<\/ul>\n<h2>同一张图，为什么你每天都能得出不同结论？<\/h2>\n<p>假设一只股票连续上涨五天，今天突然放量下跌。<\/p>\n<p>你可以给出至少四种解释：<\/p>\n<ul>\n<li>上涨趋势结束，应该立即卖出。<\/li>\n<li>主力洗盘，是更好的买点。<\/li>\n<li>市场出现利空，需要等待信息确认。<\/li>\n<li>正常波动，不应该频繁操作。<\/li>\n<\/ul>\n<p>这些解释都可能听起来合理。真正的问题是：如果明天价格反弹，你会不会重新解释一次？如果账户正在盈利或亏损，你的判断标准会不会改变？<\/p>\n<p>主观交易与量化交易的差异，不只是“人脑对电脑”，而是：<\/p>\n<blockquote>\n<p>决策标准是在行情发生前定义，还是在行情发生后解释。<\/p>\n<\/blockquote>\n<h2>两种交易方式分别是什么？<\/h2>\n<h3>主观交易<\/h3>\n<p>主观交易也叫自主决策交易或酌情交易。交易者综合价格走势、公司信息、政策变化、行业经验和市场氛围，在当下做出判断。规则可以存在，但人保留最终解释权和否决权。<\/p>\n<p>一个典型决策可能是：<\/p>\n<blockquote>\n<p>公司基本面不错，最近调整充分，市场情绪开始回暖，我认为可以分批买入。<\/p>\n<\/blockquote>\n<p>这句话可能包含大量经验，但“不错”“充分”“回暖”并没有被严格定义，不同时间、不同交易者可能给出不同结论。<\/p>\n<h3>量化交易<\/h3>\n<p>量化交易事先定义数据、信号、仓位、执行和退出规则，再由计算工具持续应用。人主要在系统设计、数据治理、风险边界和模型监控环节做判断。<\/p>\n<p>同一个想法可以改写为：<\/p>\n<blockquote>\n<p>资产满足盈利质量和流动性条件；过去 20 个交易日跌幅处于历史低分位；短期成交量恢复且价格重新站上预设均线；次日按目标风险仓位执行。<\/p>\n<\/blockquote>\n<p>量化表达未必更正确，但它更容易复现、检验和反驳。<\/p>\n<h2>两种方法的核心差异<\/h2>\n<table>\n<thead>\n<tr>\n<th>比较维度<\/th>\n<th>主观交易<\/th>\n<th>量化交易<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>信息处理<\/td>\n<td>擅长新闻、访谈、政策语境等非结构化信息<\/td>\n<td>擅长大规模、标准化、可计算的数据<\/td>\n<\/tr>\n<tr>\n<td>决策方式<\/td>\n<td>人在当下综合判断<\/td>\n<td>事先定义规则，按系统输出决策<\/td>\n<\/tr>\n<tr>\n<td>覆盖范围<\/td>\n<td>通常深度研究少量资产<\/td>\n<td>可以同时扫描大量资产与信号<\/td>\n<\/tr>\n<tr>\n<td>执行一致性<\/td>\n<td>容易受状态、压力和叙事影响<\/td>\n<td>相同输入通常产生相同输出<\/td>\n<\/tr>\n<tr>\n<td>反应能力<\/td>\n<td>对突发事件和制度变化更灵活<\/td>\n<td>对规则内事件反应快，规则外事件可能迟钝<\/td>\n<\/tr>\n<tr>\n<td>可检验性<\/td>\n<td>经验难完整还原，容易事后合理化<\/td>\n<td>可以回测、复盘和做样本外检验<\/td>\n<\/tr>\n<tr>\n<td>主要优势<\/td>\n<td>语境理解、因果判断、处理罕见情形<\/td>\n<td>纪律、规模、速度、可复现性<\/td>\n<\/tr>\n<tr>\n<td>典型风险<\/td>\n<td>情绪化、标准漂移、选择性记忆<\/td>\n<td>数据偏差、过拟合、模型失效、拥挤交易<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>因此，两者不是“落后方法”和“先进方法”的关系。它们是在不同信息环境中，用不同方式组织决策。<\/p>\n<p>主观交易更像经验丰富的医生面对复杂病例：能够结合语境处理例外。量化交易更像标准化检验系统：可以稳定处理大量样本，但只认识被定义过的数据和规则。<\/p>\n<h2>你的真正对手，为什么常常是自己的情绪？<\/h2>\n<p>机器不会因为连续亏损三次就急于翻本，也不会因为刚赚了一笔就擅自放大仓位。人却很容易在压力下改变标准。<\/p>\n<h3>1. 损失厌恶<\/h3>\n<p>同等金额的亏损，带来的痛苦通常大于盈利带来的快乐。结果是：亏损仓位不愿卖，希望“回本再走”；盈利仓位却过早落袋为安。<\/p>\n<h3>2. 近期偏差<\/h3>\n<p>人会把最近发生的事情看得过重。策略刚连续盈利，就相信它永远有效；刚经历几次亏损，就认为逻辑已经彻底失效。<\/p>\n<h3>3. 确认偏差<\/h3>\n<p>持仓以后，我们更愿意阅读支持自己观点的信息，并下意识忽略反面证据。研究逐渐从“寻找真相”变成“证明自己没错”。<\/p>\n<h3>4. 锚定效应<\/h3>\n<p>买入价、历史高点或某位专家给出的目标价，很容易成为心理锚。市场环境已经变化，决策却仍围绕那个数字展开。<\/p>\n<h3>5. 行动偏差<\/h3>\n<p>面对不确定性，人容易觉得“必须做点什么”。频繁调仓带来掌控感，却可能只增加交易成本和犯错次数。<\/p>\n<h3>6. 事后聪明<\/h3>\n<p>行情走完以后，所有拐点看起来都很明显。人会高估自己当时真正掌握的信息，低估市场原本存在的多种可能。<\/p>\n<p>量化规则的价值之一，就是在情绪出现之前先写下决策边界。但要注意：如果交易者每次亏损后都临时修改参数，量化系统同样会退化成“用代码包装的情绪交易”。<\/p>\n<h2>主观与量化，谁更适合什么场景？<\/h2>\n<h3>主观方法更有优势的场景<\/h3>\n<ul>\n<li>政策突然改变，历史数据尚未覆盖新制度。<\/li>\n<li>公司治理、管理层可信度等信息难以完整结构化。<\/li>\n<li>市场出现极端事件，需要判断历史关系是否仍然成立。<\/li>\n<li>研究对象很少，但单个对象需要深度理解。<\/li>\n<\/ul>\n<h3>量化方法更有优势的场景<\/h3>\n<ul>\n<li>需要同时比较数百或数千个资产。<\/li>\n<li>规则需要高频、长期且不间断地执行。<\/li>\n<li>策略依赖多个数据条件，人工容易漏看或算错。<\/li>\n<li>需要严格控制仓位、交易成本和组合风险暴露。<\/li>\n<li>需要检验某个经验到底是规律，还是少数成功案例造成的错觉。<\/li>\n<\/ul>\n<h3>更现实的答案：人机分工<\/h3>\n<p>成熟的投资流程常常不是二选一，而是把不同任务交给更适合的一方。<\/p>\n<p>人可以负责：<\/p>\n<ul>\n<li>提出投资假设和经济解释。<\/li>\n<li>判断市场制度是否发生结构性变化。<\/li>\n<li>设定风险预算和不可突破的边界。<\/li>\n<li>审查数据、模型和异常事件。<\/li>\n<\/ul>\n<p>机器可以负责：<\/p>\n<ul>\n<li>统一计算指标并扫描大量资产。<\/li>\n<li>按固定标准生成候选与仓位。<\/li>\n<li>执行订单、记录日志和监控偏离。<\/li>\n<li>对历史结果做重复、客观的统计检验。<\/li>\n<\/ul>\n<p>最理想的状态不是让机器替代人，而是：<\/p>\n<blockquote>\n<p>让人负责定义问题、处理例外和承担责任，让机器负责重复计算、纪律执行和完整记录。<\/p>\n<\/blockquote>\n<h2>把“盘感”变成可以复盘的流程<\/h2>\n<p>假设你的原始判断是：<\/p>\n<blockquote>\n<p>这只股票跌得差不多了，成交量也起来了，可以抄底。<\/p>\n<\/blockquote>\n<p>可以分四步改写。<\/p>\n<h3>第一步：拆出模糊词<\/h3>\n<ul>\n<li>“跌得差不多”到底是跌了多少？<\/li>\n<li>相对什么时间窗口计算？<\/li>\n<li>“成交量起来”是高于昨天，还是高于过去均值？<\/li>\n<li>“抄底”后持有多久？判断错误如何退出？<\/li>\n<\/ul>\n<h3>第二步：写成观察条件<\/h3>\n<p>例如，仅作为教学示意：<\/p>\n<ul>\n<li>过去 20 个交易日跌幅低于某个历史分位。<\/li>\n<li>当日成交量高于过去 20 日均量的预设倍数。<\/li>\n<li>收盘价重新回到短期均线之上。<\/li>\n<\/ul>\n<h3>第三步：补齐交易与风险规则<\/h3>\n<ul>\n<li>信号在收盘后计算，下一交易日执行。<\/li>\n<li>单一资产仓位不得超过组合上限。<\/li>\n<li>设定退出、最长持有时间和组合回撤处置规则。<\/li>\n<li>回测时计入手续费、滑点、涨跌停和无法成交的情况。<\/li>\n<\/ul>\n<h3>第四步：记录反例<\/h3>\n<p>不要只记录成功抄底的案例。所有满足条件的样本都应进入统计，包括失败、长时间横盘和继续下跌的情况。<\/p>\n<p>经过这四步，一个主观经验才真正变成可以讨论、测试和迭代的策略假设。<\/p>\n<h2>选择方法的四个问题<\/h2>\n<p>开始交易前，可以先问自己：<\/p>\n<ol>\n<li>我的优势来自深度理解少数对象，还是稳定扫描大量对象？<\/li>\n<li>决策所需信息能否被及时、可靠地结构化？<\/li>\n<li>我是否能够真实记录每次交易前的理由，而不是事后补充解释？<\/li>\n<li>当规则连续亏损时，我有统计标准判断“正常回撤”与“模型失效”吗？<\/li>\n<\/ol>\n<p>如果你擅长行业研究，却强迫自己只看价格信号，可能会丢掉优势；如果你没有时间持续盯盘，却依赖临场感觉，也很难保持一致。方法要与信息优势、时间条件和心理承受能力匹配。<\/p>\n<h2>认知落地：把概念变成决策<\/h2>\n<p>这一讲不是让你记住一个口号，而是训练你在真实投资问题里识别它。围绕“主观交易 vs 量化交易：你的对手是机器还是自己的情绪？”，可以用下面的四步把抽象概念落地。<\/p>\n<ol>\n<li>写清决策对象：谁在什么时间、基于哪些已知信息做什么决定。<\/li>\n<li>区分模型、信号、订单与持仓，避免把一个判断直接当成完整策略。<\/li>\n<li>列出可观察证据与反例：什么现象支持这个判断，什么现象会推翻它。<\/li>\n<li>补上数据、执行和风险约束，再判断它是否具备系统化与可复现性。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>只记定义，不说明决策时点和输入信息；修正方法是把概念改写成一条可执行规则。<\/li>\n<li>用一次成功案例证明方法有效；修正方法是同时寻找失败样本和适用边界。<\/li>\n<li>把技术复杂度当成投资优势；真正需要验证的是信息、行为或结构性机制。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>能用一句话说明本讲概念解决什么决策问题<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能指出至少一个反例或失效条件<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能把主观判断改写为可记录、可复核的规则<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能说明它在完整策略链条中的位置<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>主观交易由人综合语境做最终判断；量化交易把数据和决策标准事先系统化。<\/li>\n<li>主观方法擅长理解非结构化信息和处理例外，量化方法擅长规模化计算、纪律执行和客观检验。<\/li>\n<li>交易者常见的对手包括损失厌恶、近期偏差、确认偏差、锚定效应和行动偏差。<\/li>\n<li>写了代码不代表摆脱情绪；亏损后随意改参数，同样属于标准漂移。<\/li>\n<li>更有效的实践通常是人机分工：人提出假设和管理边界，机器执行、记录与监控。<\/li>\n<\/ul>\n<h2>课后练习：给自己的交易做一次“规则体检”<\/h2>\n<p>找出最近一次真实或模拟的买卖决策，完成下面的表格：<\/p>\n<table>\n<thead>\n<tr>\n<th>问题<\/th>\n<th>交易前真实答案<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>我为什么买入？<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>哪些数据支持这个判断？<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>什么证据会证明我错了？<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>买入多少，依据是什么？<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>计划何时退出？<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>结果不理想时，我是否临时改变过标准？<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>然后把理由中的“感觉不错”“跌得够多”“应该会涨”等模糊词圈出来，至少选择一个改写成可观察、可计算的条件。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲进入量化极简史：<strong>从早期统计套利、系统化基金，到机器学习进入交易系统<\/strong>。我们会关注技术如何改变方法，同时解释为什么工具不断升级，量化投资最基本的原则却没有改变。<\/p>"}, {"n": 3, "title": "量化极简史：从西蒙斯的大奖章到深度学习革命", "html": "<h1>第003讲 量化极简史：从西蒙斯的大奖章到深度学习革命<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。模型、历史数据与示例均不保证未来表现。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>按阶段理解量化投资的发展，而不是只记人物故事。<\/li>\n<li>分清数学理论、计算能力、市场电子化和数据扩张各自的作用。<\/li>\n<li>理解工具升级为什么没有改变量化研究的基本约束。<\/li>\n<\/ul>\n<h2>开场：量化不是突然由 AI 发明的<\/h2>\n<p>量化投资的历史，不是一条“模型越来越复杂、收益越来越高”的直线。它更像四股力量不断汇合：金融理论把问题写成数学形式，计算机提高处理规模，电子市场降低执行摩擦，数据扩张让更多假设可以被检验。<\/p>\n<h2>第一阶段：先把不确定性写成数学<\/h2>\n<p>20 世纪早期，研究者开始用概率描述价格变化；随后，组合理论把关注点从“哪只资产最好”转向“资产放在一起后风险如何变化”。再后来，风险因子、期权定价和时间序列研究逐渐形成现代金融工程的语言。<\/p>\n<p>这一阶段的重要变化不是出现了某个万能公式，而是投资问题开始具备可计算的对象：收益、波动、相关性、暴露和概率分布。<\/p>\n<h2>第二阶段：计算机进入投资流程<\/h2>\n<p>计算能力提升后，研究者可以在大量证券上重复计算规则。系统化趋势跟随、套利和程序化组合管理逐渐发展。爱德华·索普等先驱展示了概率优势、仓位控制和风险管理可以构成完整方法；此后，统计套利团队开始从相对价格关系中寻找微小但可重复的优势。<\/p>\n<p>文艺复兴科技等机构常被神话，但真正值得学习的不是某个秘密公式，而是研究组织方式：多学科团队、严格数据、持续实验、组合化下注和对交易成本的极度重视。<\/p>\n<h2>第三阶段：电子化与规模化<\/h2>\n<p>交易所电子化、行情数据标准化和经纪接口普及，让信号生成、订单执行和风险监控连成自动化链路。量化不再只是一份研究报告，而成为持续运行的软件系统。<\/p>\n<p>与此同时，竞争也更激烈：公开信号更快失效，执行质量和成本控制变得重要，模型错误也可能被自动放大。<\/p>\n<h2>第四阶段：机器学习与另类数据<\/h2>\n<p>机器学习扩大了可处理的特征数量和非线性关系，文本、图像、供应链和网络行为等数据也进入研究。但模型越复杂，越需要解决标签泄漏、样本不稳定、解释困难和过拟合。<\/p>\n<p>深度学习改变了工具箱，却没有取消三个老问题：信息在当时是否可得、规律在样本外是否存在、收益扣除成本后是否仍为正。<\/p>\n<h2>一条更有用的历史主线<\/h2>\n<p>可以用四次“规模扩张”理解量化史：<\/p>\n<ol>\n<li>从单一证券扩展到组合。<\/li>\n<li>从少量手算扩展到大规模计算。<\/li>\n<li>从人工下单扩展到自动执行。<\/li>\n<li>从结构化行情扩展到多模态数据。<\/li>\n<\/ol>\n<p>每次扩张都会创造新机会，也会引入新风险。<\/p>\n<h2>认知落地：把概念变成决策<\/h2>\n<p>这一讲不是让你记住一个口号，而是训练你在真实投资问题里识别它。围绕“量化极简史：从西蒙斯的大奖章到深度学习革命”，可以用下面的四步把抽象概念落地。<\/p>\n<ol>\n<li>写清决策对象：谁在什么时间、基于哪些已知信息做什么决定。<\/li>\n<li>区分模型、信号、订单与持仓，避免把一个判断直接当成完整策略。<\/li>\n<li>列出可观察证据与反例：什么现象支持这个判断，什么现象会推翻它。<\/li>\n<li>补上数据、执行和风险约束，再判断它是否具备系统化与可复现性。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>只记定义，不说明决策时点和输入信息；修正方法是把概念改写成一条可执行规则。<\/li>\n<li>用一次成功案例证明方法有效；修正方法是同时寻找失败样本和适用边界。<\/li>\n<li>把技术复杂度当成投资优势；真正需要验证的是信息、行为或结构性机制。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>能用一句话说明本讲概念解决什么决策问题<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能指出至少一个反例或失效条件<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能把主观判断改写为可记录、可复核的规则<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能说明它在完整策略链条中的位置<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>量化史是理论、计算、市场结构与数据共同演进的结果。<\/li>\n<li>模型复杂度不是进步的唯一标准，可验证性和执行能力同样重要。<\/li>\n<li>机器学习解决了部分表达问题，却没有解决市场非平稳与过拟合。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>选择一个你熟悉的策略，判断它主要依赖哪一代能力：金融理论、计算规模、电子执行还是新型数据；再写出该能力带来的一个机会和一个新风险。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第004讲 一个量化策略是怎样诞生的？数据、逻辑、执行、风控<\/strong>。<\/p>"}, {"n": 4, "title": "一个量化策略是怎样诞生的？数据、逻辑、执行、风控", "html": "<h1>第004讲 一个量化策略是怎样诞生的？数据、逻辑、执行、风控<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。模型、历史数据与示例均不保证未来表现。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>掌握策略从想法到运行的完整生命周期。<\/li>\n<li>理解数据、逻辑、组合、执行和风控不能相互替代。<\/li>\n<li>学会为策略设置上线与下线标准。<\/li>\n<\/ul>\n<h2>开场：一句好想法离可交易策略有多远<\/h2>\n<p>“强者恒强”只是一个假设。要变成策略，还必须回答强者如何定义、在哪些资产中比较、何时交易、买多少、成本多大以及失败时怎么办。<\/p>\n<h2>1. 提出可证伪的假设<\/h2>\n<p>好的假设应同时包含经济直觉和可观察结果。例如：“在流动性充足的股票中，过去中期表现较强且近期未出现剧烈反转的资产，未来一段时间平均收益更高。”它可能被数据否定，因此才有研究价值。<\/p>\n<h2>2. 构建当时可得的数据<\/h2>\n<p>研究者需要定义样本范围、复权方式、财务数据发布时间、退市证券和缺失值处理。最危险的错误不是公式算错，而是把未来才知道的信息放进过去。<\/p>\n<h2>3. 把逻辑写成信号<\/h2>\n<p>确定观察窗口、排序方法、阈值和更新频率。先从简单基线开始，再逐步增加条件。每增加一个参数，都应说明它解决什么问题。<\/p>\n<h2>4. 从信号变成组合<\/h2>\n<p>信号回答相对偏好，组合回答资金分配。这里要处理持仓数量、权重、行业与风格暴露、换手率和容量。强信号配上失控仓位，仍可能成为坏策略。<\/p>\n<h2>5. 建立执行模型<\/h2>\n<p>规定信号时间、下单时间、订单类型和成交限制。回测必须使用可实现的价格，并估计手续费、滑点和市场冲击成本。<\/p>\n<h2>6. 将风控写进策略<\/h2>\n<p>风控至少覆盖单笔、单资产、组合和系统四层：仓位上限、止损或退出、组合回撤、数据中断和订单异常。风控规则应在上线前确定。<\/p>\n<h2>7. 分层验证<\/h2>\n<p>按“样本内开发—样本外检验—滚动验证—模拟交易—小资金实盘交易”逐步增加真实性。每一步都应保留研究日志，避免根据最终结果反复挑选参数。<\/p>\n<h2>8. 上线、监控与退役<\/h2>\n<p>上线不是结束。要监控数据延迟、信号分布、成交偏差、风险暴露和实盘交易与回测差异。预先定义暂停条件与退役标准，例如持续超出预期回撤、信号失去区分度或交易成本吞噬优势。<\/p>\n<h2>策略生命周期清单<\/h2>\n<blockquote>\n<p>假设 → 数据 → 信号 → 组合 → 执行 → 风控 → 验证 → 上线 → 监控 → 退役<\/p>\n<\/blockquote>\n<p>任何跳步，都会把未解决的问题推迟到真金白银阶段。<\/p>\n<h2>认知落地：把概念变成决策<\/h2>\n<p>这一讲不是让你记住一个口号，而是训练你在真实投资问题里识别它。围绕“一个量化策略是怎样诞生的？数据、逻辑、执行、风控”，可以用下面的四步把抽象概念落地。<\/p>\n<ol>\n<li>写清决策对象：谁在什么时间、基于哪些已知信息做什么决定。<\/li>\n<li>区分模型、信号、订单与持仓，避免把一个判断直接当成完整策略。<\/li>\n<li>列出可观察证据与反例：什么现象支持这个判断，什么现象会推翻它。<\/li>\n<li>补上数据、执行和风险约束，再判断它是否具备系统化与可复现性。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>只记定义，不说明决策时点和输入信息；修正方法是把概念改写成一条可执行规则。<\/li>\n<li>用一次成功案例证明方法有效；修正方法是同时寻找失败样本和适用边界。<\/li>\n<li>把技术复杂度当成投资优势；真正需要验证的是信息、行为或结构性机制。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>能用一句话说明本讲概念解决什么决策问题<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能指出至少一个反例或失效条件<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能把主观判断改写为可记录、可复核的规则<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能说明它在完整策略链条中的位置<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>策略是完整生命周期，不是一个指标或一段回测代码。<\/li>\n<li>每个环节都要使用当时可得的信息并保留审计记录。<\/li>\n<li>上线前就应定义暂停和退役条件。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>把“低估值股票长期表现更好”改写成研究卡片，至少写出股票池、估值指标、调仓频率、权重方法、交易成本和失败判据。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第005讲 量化能交易什么？股票、期货、期权、加密货币全扫描<\/strong>。<\/p>"}, {"n": 5, "title": "量化能交易什么？股票、期货、期权、加密货币全扫描", "html": "<h1>第005讲 量化能交易什么？股票、期货、期权、加密货币全扫描<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。模型、历史数据与示例均不保证未来表现。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>认识主要可量化交易资产的收益来源和风险结构。<\/li>\n<li>理解不同资产不能套用同一套数据与执行假设。<\/li>\n<li>学会用流动性、杠杆和期限结构选择研究对象。<\/li>\n<\/ul>\n<h2>量化能交易的不是“代码”，而是风险<\/h2>\n<p>不同资产看起来都是价格曲线，但背后的权利义务完全不同。股票代表企业权益，期货是标准化远期合约，期权包含非线性权利，加密资产则具有全天候交易和市场结构分散等特点。<\/p>\n<h2>股票与 ETF<\/h2>\n<p>股票数据丰富、横截面广，适合因子选股、事件驱动和统计套利。主要风险包括公司特有风险、停牌、退市、公司行动和流动性。ETF 把一篮子资产封装为可交易工具，更适合资产配置、行业轮动和趋势策略，但仍要关注跟踪误差、折溢价和成交深度。<\/p>\n<h2>期货<\/h2>\n<p>期货天然带有保证金和杠杆，适合趋势跟随、跨期套利和宏观配置。研究不能只拼接价格，还要处理合约到期、移仓换月、期限结构和保证金变化。忽略换月成本，回测曲线可能完全失真。<\/p>\n<h2>期权<\/h2>\n<p>期权收益是非线性的。方向判断之外，还要面对隐含波动率、时间价值和希腊字母暴露。期权策略可能在大部分时间小赚，却在极端行情一次性亏损，因此不能只看胜率。<\/p>\n<h2>债券与利率工具<\/h2>\n<p>债券策略关注久期、信用、收益率曲线和流动性。价格波动通常较小，但杠杆、信用事件和流动性冻结会让“低波动”突然变成大风险。<\/p>\n<h2>外汇与加密资产<\/h2>\n<p>外汇受利差、宏观政策和全球资金流影响。加密资产提供 7×24 小时交易和大量链上数据，但交易场所分散、价格跳跃、托管与平台风险更突出。研究时要把技术风险和对手方风险纳入策略，而不只看历史波动。<\/p>\n<h2>选择资产的五问<\/h2>\n<ol>\n<li>收益来自方向、风险溢价、相对价差还是流动性补偿？<\/li>\n<li>数据是否可靠且在当时可得？<\/li>\n<li>实际成交深度能否承载策略规模？<\/li>\n<li>是否存在杠杆、到期、强平或非线性风险？<\/li>\n<li>交易、托管、税务与合规边界是否清楚？<\/li>\n<\/ol>\n<p>策略逻辑只有与资产机制匹配，历史统计才有解释力。<\/p>\n<h2>认知落地：把概念变成决策<\/h2>\n<p>这一讲不是让你记住一个口号，而是训练你在真实投资问题里识别它。围绕“量化能交易什么？股票、期货、期权、加密货币全扫描”，可以用下面的四步把抽象概念落地。<\/p>\n<ol>\n<li>写清决策对象：谁在什么时间、基于哪些已知信息做什么决定。<\/li>\n<li>区分模型、信号、订单与持仓，避免把一个判断直接当成完整策略。<\/li>\n<li>列出可观察证据与反例：什么现象支持这个判断，什么现象会推翻它。<\/li>\n<li>补上数据、执行和风险约束，再判断它是否具备系统化与可复现性。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>只记定义，不说明决策时点和输入信息；修正方法是把概念改写成一条可执行规则。<\/li>\n<li>用一次成功案例证明方法有效；修正方法是同时寻找失败样本和适用边界。<\/li>\n<li>把技术复杂度当成投资优势；真正需要验证的是信息、行为或结构性机制。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>能用一句话说明本讲概念解决什么决策问题<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能指出至少一个反例或失效条件<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能把主观判断改写为可记录、可复核的规则<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能说明它在完整策略链条中的位置<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>量化可以覆盖多类资产，但每类资产的权利义务与数据结构不同。<\/li>\n<li>期货要处理换月，期权要处理非线性，加密资产要额外处理平台和托管风险。<\/li>\n<li>选择市场应从优势与可执行性出发，而不是只看波动和热门程度。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>任选股票、期货、期权和加密资产中的两类，分别写出数据需求、交易成本、最重要的尾部风险与适合的策略类型。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第006讲 量化生态圈：散户、私募、券商、平台，谁在割谁？<\/strong>。<\/p>"}, {"n": 6, "title": "量化生态圈：散户、私募、券商、平台，谁在割谁？", "html": "<h1>第006讲 量化生态圈：散户、私募、券商、平台，谁在割谁？<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。模型、历史数据与示例均不保证未来表现。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解量化生态中主要参与者的角色和激励。<\/li>\n<li>识别研究、交易、销售和平台环节中的利益冲突。<\/li>\n<li>建立选择产品与服务时的尽调清单。<\/li>\n<\/ul>\n<h2>开场：“谁在割谁”不是最有用的问题<\/h2>\n<p>市场不是一场所有人使用同一规则的零和游戏。不同参与者的期限、风险预算、信息来源和业务模式不同。真正需要问的是：对方如何赚钱，他承担什么风险，他希望你做什么？<\/p>\n<h2>个人投资者<\/h2>\n<p>个人投资者资金灵活、决策链短，可以选择低容量和长周期机会；弱点是数据、研究纪律和交易成本管理不足，也容易被收益展示与短期排名影响。<\/p>\n<h2>私募与资管机构<\/h2>\n<p>机构拥有团队、系统和风险管理能力，但受规模、合规、客户赎回和业绩考核约束。规模扩大后，原本有效的小容量策略可能难以执行。<\/p>\n<h2>券商与做市商<\/h2>\n<p>券商提供交易通道、研究、融资和产品服务，收入可能来自佣金、利差或服务费。做市商通过持续报价提供流动性，并管理库存风险。用户需要理解最佳执行、融资成本和利益冲突，而不是把所有中介都简单视为对手。<\/p>\n<h2>数据商与技术平台<\/h2>\n<p>平台降低了数据、回测和部署门槛，但也可能形成锁定：数据口径不透明、回测撮合过于理想、迁移成本高。免费并不等于没有成本，用户可能用注意力、数据或后续服务付费。<\/p>\n<h2>策略提供者与内容销售者<\/h2>\n<p>策略产品可能按管理费、业绩提成、订阅费或交易分成收费。不同收费模式会影响行为：按交易量收费者可能鼓励频繁交易，只展示高收益者可能忽略幸存者偏差。<\/p>\n<h2>五项尽调<\/h2>\n<ul>\n<li><strong>收益来源<\/strong>：产品靠什么逻辑赚钱，是否能用一句话说明？<\/li>\n<li><strong>风险展示<\/strong>：是否同时展示回撤、容量、换手率和最差阶段？<\/li>\n<li><strong>数据口径<\/strong>：是实盘交易、模拟交易还是回测，交易成本是否扣除？<\/li>\n<li><strong>激励一致<\/strong>：服务方在何种情况下获得收入？<\/li>\n<li><strong>退出机制<\/strong>：资金、代码、数据和账户能否安全迁出？<\/li>\n<\/ul>\n<p>成熟判断不是寻找“绝对可信的人”，而是让激励、证据和风险边界透明。<\/p>\n<h2>认知落地：把概念变成决策<\/h2>\n<p>这一讲不是让你记住一个口号，而是训练你在真实投资问题里识别它。围绕“量化生态圈：散户、私募、券商、平台，谁在割谁？”，可以用下面的四步把抽象概念落地。<\/p>\n<ol>\n<li>写清决策对象：谁在什么时间、基于哪些已知信息做什么决定。<\/li>\n<li>区分模型、信号、订单与持仓，避免把一个判断直接当成完整策略。<\/li>\n<li>列出可观察证据与反例：什么现象支持这个判断，什么现象会推翻它。<\/li>\n<li>补上数据、执行和风险约束，再判断它是否具备系统化与可复现性。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>只记定义，不说明决策时点和输入信息；修正方法是把概念改写成一条可执行规则。<\/li>\n<li>用一次成功案例证明方法有效；修正方法是同时寻找失败样本和适用边界。<\/li>\n<li>把技术复杂度当成投资优势；真正需要验证的是信息、行为或结构性机制。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>能用一句话说明本讲概念解决什么决策问题<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能指出至少一个反例或失效条件<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能把主观判断改写为可记录、可复核的规则<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能说明它在完整策略链条中的位置<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>生态参与者的商业模式决定其行为激励。<\/li>\n<li>评估产品不能只看收益，还要看数据口径、风险、容量和交易成本。<\/li>\n<li>理解利益冲突比用“收割”概括所有关系更有用。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>选择一个你正在使用的行情、回测或策略服务，画出资金流和信息流，并回答服务方在什么情况下赚得更多、这与你的利益是否一致。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第007讲 量化≠高频交易！拆解你对量化最大的误解<\/strong>。<\/p>"}, {"n": 7, "title": "量化≠高频交易！拆解你对量化最大的误解", "html": "<h1>第007讲 量化≠高频交易！拆解你对量化最大的误解<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。模型、历史数据与示例均不保证未来表现。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>区分量化、程序化、算法执行与高频交易。<\/li>\n<li>理解策略频率由信息半衰期和成本共同决定。<\/li>\n<li>避免把自动化速度误当成策略优势。<\/li>\n<\/ul>\n<h2>四个常被混用的概念<\/h2>\n<p><strong>量化投资<\/strong>强调数据与规则驱动；<strong>程序化交易<\/strong>强调由程序生成或提交订单；<strong>算法执行<\/strong>关注如何拆分大订单、降低冲击；<strong>高频交易<\/strong>则在极短持有期和高更新频率下竞争微小优势。<\/p>\n<p>它们有交集，但不等价。一个每季度调仓的价值因子组合是量化策略，却不是高频；一个机构用算法分批执行主观决定的大订单，是程序化执行，却不一定属于量化选股。<\/p>\n<h2>高频交易在竞争什么<\/h2>\n<p>高频策略通常关注订单簿、价差、短期供需和延迟。优势可能来自更快的数据处理、更优的排队位置、更精细的库存管理和更低的单位成本。其基础设施、数据和风控要求远高于普通日频策略。<\/p>\n<h2>低频并不意味着低技术<\/h2>\n<p>月度多因子、日频趋势和季度资产配置同样需要严格的数据时间戳、组合优化、成本模型与监控。频率较低只是信息变化慢，并不代表研究简单。<\/p>\n<h2>频率选择公式<\/h2>\n<p>可以把可交易优势粗略理解为：<\/p>\n<blockquote>\n<p>净优势 = 信号毛优势 − 交易成本 − 市场冲击 − 模型误差<\/p>\n<\/blockquote>\n<p>频率提高后，机会数量可能增加，但单次优势通常更小，成本和系统风险更高。策略频率应与信号半衰期匹配：财务质量不需要毫秒执行，订单簿失衡也不适合等到月底。<\/p>\n<h2>普通投资者的合理位置<\/h2>\n<p>个人不应在没有基础设施优势时与专业高频团队拼速度。更现实的方向包括：利用更长周期信息、控制换手率、研究小容量资产、建立跨品种组合或把纪律执行做得更好。<\/p>\n<p>速度只有在信息会快速消失时才是优势。对多数策略，正确的数据、稳定的规则和低成本执行比“更快下单”更重要。<\/p>\n<h2>认知落地：把概念变成决策<\/h2>\n<p>这一讲不是让你记住一个口号，而是训练你在真实投资问题里识别它。围绕“量化≠高频交易！拆解你对量化最大的误解”，可以用下面的四步把抽象概念落地。<\/p>\n<ol>\n<li>写清决策对象：谁在什么时间、基于哪些已知信息做什么决定。<\/li>\n<li>区分模型、信号、订单与持仓，避免把一个判断直接当成完整策略。<\/li>\n<li>列出可观察证据与反例：什么现象支持这个判断，什么现象会推翻它。<\/li>\n<li>补上数据、执行和风险约束，再判断它是否具备系统化与可复现性。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>只记定义，不说明决策时点和输入信息；修正方法是把概念改写成一条可执行规则。<\/li>\n<li>用一次成功案例证明方法有效；修正方法是同时寻找失败样本和适用边界。<\/li>\n<li>把技术复杂度当成投资优势；真正需要验证的是信息、行为或结构性机制。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>能用一句话说明本讲概念解决什么决策问题<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能指出至少一个反例或失效条件<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能把主观判断改写为可记录、可复核的规则<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能说明它在完整策略链条中的位置<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>量化不等于高频，程序化执行也不等于量化选股。<\/li>\n<li>频率由信息半衰期决定，并受到成本与冲击约束。<\/li>\n<li>普通投资者更应寻找期限和容量上的差异化，而不是拼基础设施速度。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>列出三个策略：季度价值选股、日频趋势跟随、订单簿做市。分别写出其信息更新速度、合理调仓频率和最主要成本。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第008讲 量化是科学还是艺术？模型思维与市场的不确定性<\/strong>。<\/p>"}, {"n": 8, "title": "量化是科学还是艺术？模型思维与市场的不确定性", "html": "<h1>第008讲 量化是科学还是艺术？模型思维与市场的不确定性<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。模型、历史数据与示例均不保证未来表现。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解量化研究中科学方法与经验判断的边界。<\/li>\n<li>区分模型内不确定性和模型外不确定性。<\/li>\n<li>学会在证据、直觉和稳健性之间做取舍。<\/li>\n<\/ul>\n<h2>科学的一面：假设必须接受失败<\/h2>\n<p>量化研究借鉴科学方法：提出假设、定义变量、收集证据、设计检验、公开失败条件并允许他人复现。一个无法被数据反驳的观点，不是合格的研究假设。<\/p>\n<h2>艺术的一面：市场没有固定实验室<\/h2>\n<p>金融市场会因为参与者、制度和技术变化而改变。研究者必须判断哪些历史仍有代表性、哪些异常应保留、哪些约束更符合真实交易。这些选择无法完全由公式自动完成。<\/p>\n<h2>两类不确定性<\/h2>\n<p><strong>模型内不确定性<\/strong>指在既定模型下，收益仍有随机波动，可用概率和区间描述。<strong>模型外不确定性<\/strong>指模型结构本身可能错了，例如制度改变、数据口径变化或参与者行为反转。后者无法仅靠扩大仓位或提高置信度解决。<\/p>\n<h2>模型不是市场的复制品<\/h2>\n<p>模型是有目的的简化。均线忽略公司信息，因子模型压缩个股差异，风险模型用有限暴露解释复杂组合。评价模型不应问“它是否完全真实”，而应问“在什么边界内，它是否帮助我们做出更好决策”。<\/p>\n<h2>研究中的三种判断<\/h2>\n<ol>\n<li><strong>经济判断<\/strong>：为什么这个规律可能存在，谁为收益买单？<\/li>\n<li><strong>统计判断<\/strong>：证据有多强，对样本和参数是否敏感？<\/li>\n<li><strong>工程判断<\/strong>：数据、成本、容量和异常处理能否支撑实盘交易？<\/li>\n<\/ol>\n<p>三者缺一不可。只有故事容易自我欺骗，只有统计容易挖出偶然相关，只有工程则可能高效执行一个没有优势的策略。<\/p>\n<h2>保留谦逊的做法<\/h2>\n<p>使用简单基线、报告不确定区间、保留样本外数据、限制参数自由度、进行情景压力测试，并为模型设置暂停机制。科学不是自信地给出一个数字，而是诚实说明数字可能错在哪里。<\/p>\n<h2>认知落地：把概念变成决策<\/h2>\n<p>这一讲不是让你记住一个口号，而是训练你在真实投资问题里识别它。围绕“量化是科学还是艺术？模型思维与市场的不确定性”，可以用下面的四步把抽象概念落地。<\/p>\n<ol>\n<li>写清决策对象：谁在什么时间、基于哪些已知信息做什么决定。<\/li>\n<li>区分模型、信号、订单与持仓，避免把一个判断直接当成完整策略。<\/li>\n<li>列出可观察证据与反例：什么现象支持这个判断，什么现象会推翻它。<\/li>\n<li>补上数据、执行和风险约束，再判断它是否具备系统化与可复现性。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>只记定义，不说明决策时点和输入信息；修正方法是把概念改写成一条可执行规则。<\/li>\n<li>用一次成功案例证明方法有效；修正方法是同时寻找失败样本和适用边界。<\/li>\n<li>把技术复杂度当成投资优势；真正需要验证的是信息、行为或结构性机制。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>能用一句话说明本讲概念解决什么决策问题<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能指出至少一个反例或失效条件<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能把主观判断改写为可记录、可复核的规则<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能说明它在完整策略链条中的位置<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>量化的科学性来自可证伪与可复现，艺术性来自对边界和现实约束的判断。<\/li>\n<li>市场既有随机性，也有模型结构可能失效的不确定性。<\/li>\n<li>经济、统计和工程三类证据应共同支持策略。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>挑选一个熟悉指标，分别写出它忽略了什么、在哪类市场可能有效、什么现象会证明其解释失效。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第009讲 量化投资的三大核心优势与两个致命软肋<\/strong>。<\/p>"}, {"n": 9, "title": "量化投资的三大核心优势与两个致命软肋", "html": "<h1>第009讲 量化投资的三大核心优势与两个致命软肋<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。模型、历史数据与示例均不保证未来表现。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>总结量化方法最重要的三项结构性优势。<\/li>\n<li>认识数据依赖和模型失效两类致命软肋。<\/li>\n<li>理解优势必须通过治理流程才能兑现。<\/li>\n<\/ul>\n<h2>三大核心优势<\/h2>\n<h3>1. 一致性：把纪律写进流程<\/h3>\n<p>量化系统可以在相同输入下执行相同规则，减少情绪、疲劳和临场叙事造成的标准漂移。一致性不保证规则正确，却让错误能够被识别和复盘。<\/p>\n<h3>2. 可扩展性：同时处理更多信息<\/h3>\n<p>机器可以扫描大量资产、时间窗口和风险暴露，把人从重复计算中释放出来。规模化让横截面比较、多资产配置和实时监控成为可能。<\/p>\n<h3>3. 可检验性：让经验接受证据<\/h3>\n<p>明确规则可以回测、做样本外检验、压力测试和归因分析。研究者能区分收益来自市场上涨、因子暴露、运气还是独立优势。<\/p>\n<h2>两个致命软肋<\/h2>\n<h3>软肋一：模型只认识被喂给它的世界<\/h3>\n<p>错误复权、延迟的财务数据、缺失的退市样本和理想化成交都会制造虚假优势。数据质量不仅是清洗问题，更是“当时能知道什么”的时间问题。<\/p>\n<h3>软肋二：市场会变化，模型会失效<\/h3>\n<p>参与者会学习，交易会拥挤，制度与成本会变化。历史上稳定的关系可能衰减甚至反转。越依赖单一环境的模型，越容易在结构变化中集中暴露。<\/p>\n<h2>优势如何变成真实能力<\/h2>\n<ul>\n<li>用数据血缘和时间戳保护研究输入。<\/li>\n<li>用简单基线和样本外测试约束过拟合。<\/li>\n<li>用组合化降低单一模型失效的伤害。<\/li>\n<li>用交易成本和容量模型校正纸面收益。<\/li>\n<li>用实时监控识别数据、执行和信号漂移。<\/li>\n<li>用预设暂停条件防止自动化放大错误。<\/li>\n<\/ul>\n<p>量化最危险的时刻，往往不是模型明显报错，而是系统运行顺畅、结果看似精确，却建立在错误假设上。<\/p>\n<h2>认知落地：把概念变成决策<\/h2>\n<p>这一讲不是让你记住一个口号，而是训练你在真实投资问题里识别它。围绕“量化投资的三大核心优势与两个致命软肋”，可以用下面的四步把抽象概念落地。<\/p>\n<ol>\n<li>写清决策对象：谁在什么时间、基于哪些已知信息做什么决定。<\/li>\n<li>区分模型、信号、订单与持仓，避免把一个判断直接当成完整策略。<\/li>\n<li>列出可观察证据与反例：什么现象支持这个判断，什么现象会推翻它。<\/li>\n<li>补上数据、执行和风险约束，再判断它是否具备系统化与可复现性。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>只记定义，不说明决策时点和输入信息；修正方法是把概念改写成一条可执行规则。<\/li>\n<li>用一次成功案例证明方法有效；修正方法是同时寻找失败样本和适用边界。<\/li>\n<li>把技术复杂度当成投资优势；真正需要验证的是信息、行为或结构性机制。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>能用一句话说明本讲概念解决什么决策问题<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能指出至少一个反例或失效条件<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能把主观判断改写为可记录、可复核的规则<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能说明它在完整策略链条中的位置<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>一致性、可扩展和可检验是量化的三项结构性优势。<\/li>\n<li>数据世界不等于真实世界，历史关系也不会自动延续。<\/li>\n<li>治理、监控和组合化决定量化优势能否在实盘交易兑现。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为一个策略写“反方报告”：列出三个可能的数据错误、两个可能的市场结构变化，以及每个风险对应的监控指标。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第010讲 100期学习路线图：如何从零到构建自己的第一个策略<\/strong>。<\/p>"}, {"n": 10, "title": "100期学习路线图：如何从零到构建自己的第一个策略", "html": "<h1>第010讲 100期学习路线图：如何从零到构建自己的第一个策略<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。模型、历史数据与示例均不保证未来表现。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解整套课程的学习顺序与能力目标。<\/li>\n<li>确定从知识学习到首个策略的最短实践路径。<\/li>\n<li>建立研究日志和阶段验收标准。<\/li>\n<\/ul>\n<h2>为什么路线图比知识清单更重要<\/h2>\n<p>量化知识跨度很大：数学、数据、金融、编程、回测、执行和风控。如果按工具热点随意学习，很容易会写模型却不会验证，会回测却不知道数据是否可靠。<\/p>\n<p>本课程虽然沿用“100讲”名称，实际目录扩展为 106 讲。学习顺序遵循一条完整生产链：世界观—数学—数据—策略—因子—回测—风控—组合—机器学习—实战—反思。<\/p>\n<h2>四个学习阶段<\/h2>\n<h3>阶段一：能读懂<\/h3>\n<p>完成第 1–28 讲。目标是理解收益、风险、数据口径和策略结构，能够识别复权、幸存者偏差和频率选择等基础问题。<\/p>\n<h3>阶段二：能复现<\/h3>\n<p>完成第 29–63 讲。选择一个经典策略和一个因子模型，用统一数据复现结果。此阶段不追求创新，重点是让计算、交易和绩效口径正确。<\/p>\n<h3>阶段三：能验证<\/h3>\n<p>完成第 64–85 讲。加入成本、样本外、稳健性、风控和组合约束。能够回答策略为何有效、在哪些环境失效、最坏可能亏多少。<\/p>\n<h3>阶段四：能运行<\/h3>\n<p>完成第 86–106 讲。谨慎使用机器学习，完成模拟交易、日志、监控、归因和上线清单。最终产出不是漂亮图表，而是一套可重复运行的研究与执行流程。<\/p>\n<h2>第一个策略的最短路径<\/h2>\n<ol>\n<li>选择流动性较好的单一 ETF 或小型资产池。<\/li>\n<li>使用日频数据，避免一开始处理微观结构问题。<\/li>\n<li>复现一个参数少、逻辑清楚的基线策略。<\/li>\n<li>明确信号在何时生成，下一可交易时点执行。<\/li>\n<li>加入显性交易费用、滑点和持仓约束。<\/li>\n<li>划分样本内与样本外，检查参数邻域。<\/li>\n<li>先模拟运行并记录每次信号，再考虑小资金验证。<\/li>\n<\/ol>\n<h2>每讲的学习闭环<\/h2>\n<blockquote>\n<p>理解概念 → 手算一个例子 → 用代码复现 → 找一个反例 → 写入研究日志<\/p>\n<\/blockquote>\n<p>研究日志至少记录：问题、数据版本、假设、代码版本、参数、结果、失败原因和下一步。没有日志，重复试验很容易变成只保留好结果的选择性记忆。<\/p>\n<h2>阶段验收<\/h2>\n<p>你不需要背完所有公式，但应能够独立完成四件事：解释策略逻辑、复现结果、指出偏差、定义风险边界。能做到这四点，才算真正掌握。<\/p>\n<h2>认知落地：把概念变成决策<\/h2>\n<p>这一讲不是让你记住一个口号，而是训练你在真实投资问题里识别它。围绕“100期学习路线图：如何从零到构建自己的第一个策略”，可以用下面的四步把抽象概念落地。<\/p>\n<ol>\n<li>写清决策对象：谁在什么时间、基于哪些已知信息做什么决定。<\/li>\n<li>区分模型、信号、订单与持仓，避免把一个判断直接当成完整策略。<\/li>\n<li>列出可观察证据与反例：什么现象支持这个判断，什么现象会推翻它。<\/li>\n<li>补上数据、执行和风险约束，再判断它是否具备系统化与可复现性。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>只记定义，不说明决策时点和输入信息；修正方法是把概念改写成一条可执行规则。<\/li>\n<li>用一次成功案例证明方法有效；修正方法是同时寻找失败样本和适用边界。<\/li>\n<li>把技术复杂度当成投资优势；真正需要验证的是信息、行为或结构性机制。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>能用一句话说明本讲概念解决什么决策问题<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能指出至少一个反例或失效条件<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能把主观判断改写为可记录、可复核的规则<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>能说明它在完整策略链条中的位置<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>课程实际包含 106 讲，按量化策略生产链组织。<\/li>\n<li>学习目标依次是能读懂、能复现、能验证、能运行。<\/li>\n<li>第一个策略应选择简单资产、低频数据和少参数基线。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>建立自己的课程研究日志，写下每周可投入时间、首个策略题目、预期完成日期和四项验收标准；为第 11–20 讲预留手算与代码练习时间。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第011讲 收益率怎么算？简单收益率与对数收益率的猫腻<\/strong>。<\/p>"}]}, {"no": 2, "name": "基石·量化必懂的数学", "desc": "不讲复杂公式，只讲金融实战中必须理解的核心指标与思维。", "chapters": [{"n": 11, "title": "收益率怎么算？简单收益率与对数收益率的猫腻", "html": "<h1>第011讲 收益率怎么算？简单收益率与对数收益率的猫腻<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。公式与数字示例用于解释概念，不代表收益承诺。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>正确计算含分红的简单收益率与对数收益率。<\/li>\n<li>理解两种收益率的复利和可加性差异。<\/li>\n<li>避免把价格变化、资产收益和策略收益混为一谈。<\/li>\n<\/ul>\n<h2>收益率不是“赚了多少钱”<\/h2>\n<p>盈亏金额取决于本金，收益率才便于跨资产和跨时期比较。若期初价格为 (P_{t-1})，期末价格为 (P_t)，期间现金分红为 (D_t)，简单收益率为：<\/p>\n<p>[\nr_t=\\frac{P_t-P_{t-1}+D_t}{P_{t-1}}\n]<\/p>\n<p>忽略分红会低估总回报；使用已复权价格时，又不能重复加分红。<\/p>\n<h2>简单收益率与复利<\/h2>\n<p>多期简单收益不能直接相加，而应连乘：<\/p>\n<p>[\n1+R=\\prod_{t=1}^{T}(1+r_t)\n]<\/p>\n<p>先跌 50% 再涨 50%，最终不是回到原点，而是剩下 (0.5\\times1.5=0.75)，累计亏损 25%。亏损越大，回本所需涨幅越高。<\/p>\n<h2>对数收益率<\/h2>\n<p>不含现金流时，对数收益率为：<\/p>\n<p>[\ng_t=\\ln\\left(\\frac{P_t}{P_{t-1}}\\right)=\\ln(1+r_t)\n]<\/p>\n<p>对数收益的优势是时间可加：多期对数收益等于各期之和。它适合统计建模和连续复利表达，但投资者实际账户的累计收益率仍应转换回简单收益：(R=e^{\\sum g_t}-1)。<\/p>\n<h2>两者什么时候差别明显<\/h2>\n<p>小幅波动时，(\\ln(1+r)\\approx r)；波动越大，差异越明显。简单收益下跌最低为 -100%，对数收益在价格趋近零时趋向负无穷。<\/p>\n<h2>三个口径陷阱<\/h2>\n<ul>\n<li>把未复权价格直接用于长期收益，会把分红和拆分误认为损失。<\/li>\n<li>组合横截面收益应使用简单收益加权，不能直接对个股对数收益做同样解释。<\/li>\n<li>日收益均值乘天数不是精确累计收益率，真实财富由复利路径决定。<\/li>\n<\/ul>\n<h2>计算演练：公式之外还要核对口径<\/h2>\n<p>学习“收益率怎么算？简单收益率与对数收益率的猫腻”时，真正容易出错的通常不是按计算器，而是频率、单位、样本和解释口径。完成下面的计算闭环，结果才可比较。<\/p>\n<ol>\n<li>先写变量定义、单位、时间频率与样本区间，再代入公式。<\/li>\n<li>用一个手算小样本验证方向、边界值和极端情形，确认实现没有符号或分母错误。<\/li>\n<li>再用完整数据计算，并同时报告样本数、缺失处理和年化假设。<\/li>\n<li>最后把数值翻译成投资含义，说明它能回答什么、不能回答什么。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>混用日频、月频与年化结果；修正方法是让频率和年化系数显式化。<\/li>\n<li>只报告一个点估计；修正方法是同时查看样本期、分布、稳定性和极端值。<\/li>\n<li>把统计相关当成因果或可交易利润；还要验证时点、成本和样本外表现。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>公式中的每个变量都有定义和单位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>手算样本与程序结果一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>频率、年化和无风险收益率口径已写明<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>结论包含适用范围与不可解释部分<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>简单收益反映实际财富比例，多期通过连乘复合。<\/li>\n<li>对数收益时间可加，适合建模，但需转换后解释账户回报。<\/li>\n<li>分红、复权和组合聚合必须使用一致口径。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>一项资产先上涨 20%，再下跌 20%。分别计算两期简单收益之和、累计简单收益和对数收益之和，并解释为什么答案不同。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第012讲 年化收益率：如果年化50%，为什么你还会亏钱？<\/strong>。<\/p>"}, {"n": 12, "title": "年化收益率：如果年化50%，为什么你还会亏钱？", "html": "<h1>第012讲 年化收益率：如果年化50%，为什么你还会亏钱？<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。公式与数字示例用于解释概念，不代表收益承诺。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>区分累计收益率、几何年化和算术年化。<\/li>\n<li>理解样本长度和波动拖累对年化数字的影响。<\/li>\n<li>选择与资金流和策略类型一致的评价口径。<\/li>\n<\/ul>\n<h2>年化不是把短期收益简单放大<\/h2>\n<p>若初始净值为 (V_0)，(T) 年后为 (V_T)，几何年化收益率为：<\/p>\n<p>[\nR_{ann}=\\left(\\frac{V_T}{V_0}\\right)^{1/T}-1\n]<\/p>\n<p>如果数据包含 (N) 个交易日，可近似写为 ((V_N/V_0)^{252/N}-1)。这里的 252 只是常见股票市场年交易日约定，其他市场和频率应使用相应口径。<\/p>\n<h2>为什么“月赚 5%”不等于可靠年化 60%<\/h2>\n<p>短样本年化会把偶然结果指数放大。一个月收益 5% 按复利年化约为 ((1.05)^{12}-1)，但这不代表未来每月都能重复。样本越短，年化估计的不确定性越高。<\/p>\n<h2>算术均值与几何收益<\/h2>\n<p>算术平均回答“单期平均变化”，几何收益回答“财富实际以多快速度复合”。波动会造成复利拖累：+50% 后 -50%，算术平均为 0%，财富却减少 25%。<\/p>\n<p>近似关系常写为：<\/p>\n<p>[\n\\text{几何增长率}\\approx \\text{算术平均收益}-\\frac{1}{2}\\sigma^2\n]<\/p>\n<p>它说明在平均收益相近时，更高波动通常降低长期复利结果。<\/p>\n<h2>有现金流时怎么办<\/h2>\n<p>外部申购赎回会改变账户金额。评价投资经理通常使用时间加权收益，尽量剔除资金流时点影响；评价个人真实资金体验可使用资金加权收益或内部收益率。两者回答的问题不同。<\/p>\n<h2>报告年化的最低要求<\/h2>\n<p>同时披露样本起止、累计收益率、最大回撤、年化波动率、交易成本口径和是否为实盘交易。脱离这些背景，一个漂亮的年化收益率数字几乎没有独立意义。<\/p>\n<h2>计算演练：公式之外还要核对口径<\/h2>\n<p>学习“年化收益率：如果年化50%，为什么你还会亏钱？”时，真正容易出错的通常不是按计算器，而是频率、单位、样本和解释口径。完成下面的计算闭环，结果才可比较。<\/p>\n<ol>\n<li>先写变量定义、单位、时间频率与样本区间，再代入公式。<\/li>\n<li>用一个手算小样本验证方向、边界值和极端情形，确认实现没有符号或分母错误。<\/li>\n<li>再用完整数据计算，并同时报告样本数、缺失处理和年化假设。<\/li>\n<li>最后把数值翻译成投资含义，说明它能回答什么、不能回答什么。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>混用日频、月频与年化结果；修正方法是让频率和年化系数显式化。<\/li>\n<li>只报告一个点估计；修正方法是同时查看样本期、分布、稳定性和极端值。<\/li>\n<li>把统计相关当成因果或可交易利润；还要验证时点、成本和样本外表现。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>公式中的每个变量都有定义和单位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>手算样本与程序结果一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>频率、年化和无风险收益率口径已写明<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>结论包含适用范围与不可解释部分<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>几何年化来自财富复合，不是短期收益的线性外推。<\/li>\n<li>波动拖累会让几何增长低于算术平均。<\/li>\n<li>时间加权与资金加权收益回答不同问题。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>策略两年收益分别为 +40% 和 -20%。计算累计收益率、算术年均收益和几何年化收益率，并比较三者。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第013讲 波动率：风险的长相，你真的认识它吗？<\/strong>。<\/p>"}, {"n": 13, "title": "波动率：风险的长相，你真的认识它吗？", "html": "<h1>第013讲 波动率：风险的长相，你真的认识它吗？<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。公式与数字示例用于解释概念，不代表收益承诺。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>掌握历史波动率的基本计算。<\/li>\n<li>理解波动聚集与频率缩放的假设。<\/li>\n<li>认识波动率不能覆盖的风险。<\/li>\n<\/ul>\n<h2>波动率度量什么<\/h2>\n<p>波动率通常是收益率标准差，描述收益围绕均值的离散程度：<\/p>\n<p>[\n\\sigma=\\sqrt{\\frac{1}{N-1}\\sum_{t=1}^{N}(r_t-\\bar r)^2}\n]<\/p>\n<p>日频波动在独立同分布近似下可年化为 (\\sigma_{ann}=\\sigma_{daily}\\sqrt{252})。平方根时间缩放依赖弱相关与稳定分布，不能在所有资产和时期机械使用。<\/p>\n<h2>波动率的三张脸<\/h2>\n<ul>\n<li><strong>历史波动率<\/strong>：从已经发生的收益计算。<\/li>\n<li><strong>隐含波动率<\/strong>：从期权价格反推市场对未来波动的定价。<\/li>\n<li><strong>预测波动率<\/strong>：用滚动窗口、EWMA 或 GARCH 等模型估计未来风险。<\/li>\n<\/ul>\n<p>三者不应混用。历史安静不代表未来安全，隐含波动也不是未来波动的无偏承诺。<\/p>\n<h2>波动会聚集<\/h2>\n<p>金融收益常出现“平静期接平静期、剧烈期接剧烈期”。固定长期标准差会反应迟钝，因此风险管理常给近期数据更高权重。但窗口越短，估计越敏感。<\/p>\n<h2>波动率不等于全部风险<\/h2>\n<p>标准差把上涨和下跌都视为波动；它看不到流动性冻结、跳空、信用违约和无法成交。两个策略波动相同，尾部亏损和恢复时间可能完全不同。<\/p>\n<h2>使用原则<\/h2>\n<p>报告波动时应说明收益频率、窗口、年化因子、是否去极值以及是否存在自相关。最好同时观察下行波动、最大回撤、尾部分位数和流动性指标。<\/p>\n<h2>计算演练：公式之外还要核对口径<\/h2>\n<p>学习“波动率：风险的长相，你真的认识它吗？”时，真正容易出错的通常不是按计算器，而是频率、单位、样本和解释口径。完成下面的计算闭环，结果才可比较。<\/p>\n<ol>\n<li>先写变量定义、单位、时间频率与样本区间，再代入公式。<\/li>\n<li>用一个手算小样本验证方向、边界值和极端情形，确认实现没有符号或分母错误。<\/li>\n<li>再用完整数据计算，并同时报告样本数、缺失处理和年化假设。<\/li>\n<li>最后把数值翻译成投资含义，说明它能回答什么、不能回答什么。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>混用日频、月频与年化结果；修正方法是让频率和年化系数显式化。<\/li>\n<li>只报告一个点估计；修正方法是同时查看样本期、分布、稳定性和极端值。<\/li>\n<li>把统计相关当成因果或可交易利润；还要验证时点、成本和样本外表现。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>公式中的每个变量都有定义和单位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>手算样本与程序结果一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>频率、年化和无风险收益率口径已写明<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>结论包含适用范围与不可解释部分<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>波动率是收益离散程度，不是损失的完整定义。<\/li>\n<li>年化平方根规则依赖近似假设。<\/li>\n<li>历史、隐含和预测波动率具有不同信息含义。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>用任意 20 个日收益计算标准差，再分别用 20 日与 60 日滚动窗口比较结果，观察窗口长度如何影响风险判断。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第014讲 夏普比率：性价比之王，多少才算好？<\/strong>。<\/p>"}, {"n": 14, "title": "夏普比率：性价比之王，多少才算好？", "html": "<h1>第014讲 夏普比率：性价比之王，多少才算好？<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。公式与数字示例用于解释概念，不代表收益承诺。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解夏普比率的公式与经济含义。<\/li>\n<li>知道频率、基准和自相关如何影响结果。<\/li>\n<li>避免用单一阈值评价所有策略。<\/li>\n<\/ul>\n<h2>夏普比率在比较什么<\/h2>\n<p>夏普比率用单位总风险对应的超额收益衡量风险调整表现：<\/p>\n<p>[\nS=\\frac{E[R_p-R_f]}{\\sigma(R_p-R_f)}\n]<\/p>\n<p>其中 (R_p) 为组合收益，(R_f) 为无风险利率。日频估计常将日均超额收益除以日标准差，再乘 (\\sqrt{252})。频率和无风险利率必须一致。<\/p>\n<h2>为什么它受欢迎<\/h2>\n<p>单看收益会奖励加杠杆，单看波动会偏爱不赚钱的低风险资产。夏普比率把两者放到同一尺度，便于比较相似期限、相似流动性的策略。<\/p>\n<h2>“多少才算好”没有统一答案<\/h2>\n<p>样本长度、资产类别、回测或实盘交易、交易成本和策略容量都会影响夏普比率。短样本中的高夏普比率可能只是运气；平滑估值、低流动性资产或卖出尾部风险的策略也可能制造虚假稳定。<\/p>\n<h2>四个误区<\/h2>\n<ol>\n<li><strong>忽略自相关<\/strong>：收益被平滑或持仓重叠时，平方根年化可能高估夏普比率。<\/li>\n<li><strong>忽略非正态<\/strong>：夏普比率不能区分温和波动和偶发巨亏。<\/li>\n<li><strong>忽略多次试验<\/strong>：从上百组参数中挑最高值，会产生选择偏差。<\/li>\n<li><strong>跨类型硬比较<\/strong>：市场中性日频策略与长期权益组合的风险结构不同。<\/li>\n<\/ol>\n<h2>如何更完整地用<\/h2>\n<p>同时报告样本置信度、最大回撤、偏度、换手率、成本、不同阶段表现和样本外结果。夏普比率适合做起点，不适合做终局判决。<\/p>\n<h2>计算演练：公式之外还要核对口径<\/h2>\n<p>学习“夏普比率：性价比之王，多少才算好？”时，真正容易出错的通常不是按计算器，而是频率、单位、样本和解释口径。完成下面的计算闭环，结果才可比较。<\/p>\n<ol>\n<li>先写变量定义、单位、时间频率与样本区间，再代入公式。<\/li>\n<li>用一个手算小样本验证方向、边界值和极端情形，确认实现没有符号或分母错误。<\/li>\n<li>再用完整数据计算，并同时报告样本数、缺失处理和年化假设。<\/li>\n<li>最后把数值翻译成投资含义，说明它能回答什么、不能回答什么。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>混用日频、月频与年化结果；修正方法是让频率和年化系数显式化。<\/li>\n<li>只报告一个点估计；修正方法是同时查看样本期、分布、稳定性和极端值。<\/li>\n<li>把统计相关当成因果或可交易利润；还要验证时点、成本和样本外表现。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>公式中的每个变量都有定义和单位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>手算样本与程序结果一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>频率、年化和无风险收益率口径已写明<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>结论包含适用范围与不可解释部分<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>夏普比率衡量单位总波动对应的超额收益。<\/li>\n<li>统一阈值缺乏意义，必须结合样本、流动性和策略结构。<\/li>\n<li>自相关、尾部风险和参数筛选都会虚增夏普比率。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>两个策略年化收益率分别为 12% 和 18%，波动分别为 8% 和 20%，无风险利率为 2%。计算夏普比率，并说明为什么仍不能仅凭结果决定投资。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第015讲 最大回撤：你的心脏能否扛过这个深坑？<\/strong>。<\/p>"}, {"n": 15, "title": "最大回撤：你的心脏能否扛过这个深坑？", "html": "<h1>第015讲 最大回撤：你的心脏能否扛过这个深坑？<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。公式与数字示例用于解释概念，不代表收益承诺。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>会计算最大回撤、回撤持续期与恢复期。<\/li>\n<li>理解回撤的路径依赖和样本依赖。<\/li>\n<li>把回撤用于仓位与生存性评估。<\/li>\n<\/ul>\n<h2>回撤描述“从高点掉了多深”<\/h2>\n<p>设净值为 (V_t)，历史峰值为 (H_t=\\max_{s\\le t}V_s)，当前回撤为：<\/p>\n<p>[\nDD_t=\\frac{V_t}{H_t}-1\n]<\/p>\n<p>最大回撤是样本期内 (DD_t) 的最小值。它必须按净值路径计算，不能从年度收益表直接推断。<\/p>\n<h2>深度之外还要看时间<\/h2>\n<ul>\n<li><strong>回撤开始<\/strong>：净值离开前高。<\/li>\n<li><strong>谷底<\/strong>：回撤最深点。<\/li>\n<li><strong>恢复<\/strong>：净值重新超过前高。<\/li>\n<li><strong>水下期<\/strong>：从离开高点到完全恢复的时间。<\/li>\n<\/ul>\n<p>同样 -20% 回撤，一个月恢复和三年恢复，对资金与心理的影响完全不同。<\/p>\n<h2>回本数学<\/h2>\n<p>亏损 (L) 后回本所需涨幅为 (L/(1-L))。亏 20% 需要涨 25%，亏 50% 需要涨 100%。深回撤会显著损害复利和继续承担风险的能力。<\/p>\n<h2>最大回撤的局限<\/h2>\n<p>它只记录样本中最坏的一次，强烈依赖起止时间；也不告诉你最坏情况发生的概率。历史没有出现的尾部事件不会进入数字。<\/p>\n<h2>风控应用<\/h2>\n<p>策略设计应同时查看多次回撤分布、持续期、恢复速度和回撤期间的风险暴露。仓位不应只按平均波动设定，还要评估投资者能否在预期极端回撤中继续执行。<\/p>\n<h2>计算演练：公式之外还要核对口径<\/h2>\n<p>学习“最大回撤：你的心脏能否扛过这个深坑？”时，真正容易出错的通常不是按计算器，而是频率、单位、样本和解释口径。完成下面的计算闭环，结果才可比较。<\/p>\n<ol>\n<li>先写变量定义、单位、时间频率与样本区间，再代入公式。<\/li>\n<li>用一个手算小样本验证方向、边界值和极端情形，确认实现没有符号或分母错误。<\/li>\n<li>再用完整数据计算，并同时报告样本数、缺失处理和年化假设。<\/li>\n<li>最后把数值翻译成投资含义，说明它能回答什么、不能回答什么。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>混用日频、月频与年化结果；修正方法是让频率和年化系数显式化。<\/li>\n<li>只报告一个点估计；修正方法是同时查看样本期、分布、稳定性和极端值。<\/li>\n<li>把统计相关当成因果或可交易利润；还要验证时点、成本和样本外表现。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>公式中的每个变量都有定义和单位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>手算样本与程序结果一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>频率、年化和无风险收益率口径已写明<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>结论包含适用范围与不可解释部分<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>最大回撤是净值相对历史峰值的最大跌幅。<\/li>\n<li>回撤深度、持续期和恢复期应同时分析。<\/li>\n<li>历史最大回撤不是未来亏损上限。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>构造净值序列 100、110、105、88、95、112，逐期计算峰值和回撤，找出最大回撤、谷底及恢复点。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第016讲 正态分布与厚尾：黑天鹅为什么总是从天而降<\/strong>。<\/p>"}, {"n": 16, "title": "正态分布与厚尾：黑天鹅为什么总是从天而降", "html": "<h1>第016讲 正态分布与厚尾：黑天鹅为什么总是从天而降<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。公式与数字示例用于解释概念，不代表收益承诺。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解正态分布假设在金融中的用途与限制。<\/li>\n<li>识别厚尾、偏度和极端事件的风险含义。<\/li>\n<li>掌握更稳健的风险观察方法。<\/li>\n<\/ul>\n<h2>正态分布为什么常被使用<\/h2>\n<p>正态分布由均值和标准差刻画，数学处理方便，很多统计方法在样本充分、变化较小时具有良好近似。但金融收益并不总按钟形曲线出现。<\/p>\n<h2>厚尾意味着什么<\/h2>\n<p>厚尾表示极端收益出现的概率高于正态模型预期。若用正态分布估计风险，可能把罕见大亏视为几乎不可能，从而配置过高杠杆。<\/p>\n<h2>偏度与峰度<\/h2>\n<p>负偏策略可能多数时间小赚，少数时间大亏；正偏策略则可能频繁小亏、偶尔大赚。峰度反映尾部和中心尖锐程度，但单个样本估计很不稳定。<\/p>\n<h2>极端事件为何反复出现<\/h2>\n<p>波动聚集、杠杆去化、流动性枯竭和参与者同时止损，会让价格变化相互依赖。市场危机并非独立抽签，风险会通过反馈机制自我放大。<\/p>\n<h2>更稳健的做法<\/h2>\n<ul>\n<li>观察经验分位数而不只套正态公式。<\/li>\n<li>使用压力情景和历史极端窗口。<\/li>\n<li>分别报告上涨与下跌尾部。<\/li>\n<li>对杠杆、流动性和集中度设置硬约束。<\/li>\n<li>不把“过去没发生”解释为“未来不可能”。<\/li>\n<\/ul>\n<p>黑天鹅无法被精确预测，但可以通过限制脆弱性来应对。<\/p>\n<h2>计算演练：公式之外还要核对口径<\/h2>\n<p>学习“正态分布与厚尾：黑天鹅为什么总是从天而降”时，真正容易出错的通常不是按计算器，而是频率、单位、样本和解释口径。完成下面的计算闭环，结果才可比较。<\/p>\n<ol>\n<li>先写变量定义、单位、时间频率与样本区间，再代入公式。<\/li>\n<li>用一个手算小样本验证方向、边界值和极端情形，确认实现没有符号或分母错误。<\/li>\n<li>再用完整数据计算，并同时报告样本数、缺失处理和年化假设。<\/li>\n<li>最后把数值翻译成投资含义，说明它能回答什么、不能回答什么。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>混用日频、月频与年化结果；修正方法是让频率和年化系数显式化。<\/li>\n<li>只报告一个点估计；修正方法是同时查看样本期、分布、稳定性和极端值。<\/li>\n<li>把统计相关当成因果或可交易利润；还要验证时点、成本和样本外表现。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>公式中的每个变量都有定义和单位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>手算样本与程序结果一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>频率、年化和无风险收益率口径已写明<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>结论包含适用范围与不可解释部分<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>正态分布是工具性近似，不是市场定律。<\/li>\n<li>厚尾和负偏会让基于均值与标准差的风险估计过度乐观。<\/li>\n<li>应使用经验分位、压力测试和硬约束补充统计模型。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>比较两个策略：A 每月收益大多为 1%，偶尔 -20%；B 每月收益在 -3% 到 4% 间波动。说明为什么均值和波动相近时，风险体验仍可能不同。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第017讲 相关性陷阱：不要把鸡蛋放一个篮子里？也可能一起碎<\/strong>。<\/p>"}, {"n": 17, "title": "相关性陷阱：不要把鸡蛋放一个篮子里？也可能一起碎", "html": "<h1>第017讲 相关性陷阱：不要把鸡蛋放一个篮子里？也可能一起碎<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。公式与数字示例用于解释概念，不代表收益承诺。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>正确解释相关系数及其局限。<\/li>\n<li>理解共同因子与危机相关性。<\/li>\n<li>用风险贡献而非资产数量衡量分散化。<\/li>\n<\/ul>\n<h2>相关性衡量什么<\/h2>\n<p>皮尔逊相关系数为协方差标准化后的结果：<\/p>\n<p>[\n\\rho_{XY}=\\frac{Cov(X,Y)}{\\sigma_X\\sigma_Y}\n]<\/p>\n<p>它主要描述线性共同变化，范围为 -1 到 1。相关性接近零不代表两个资产没有关系，也不代表组合没有共同尾部风险。<\/p>\n<h2>三个陷阱<\/h2>\n<h3>样本窗口陷阱<\/h3>\n<p>短窗口噪声大，长窗口可能掩盖当前变化。相关性不是资产标签，而是特定样本和频率下的估计。<\/p>\n<h3>危机相关性陷阱<\/h3>\n<p>平静期看似独立的资产，危机中可能因去杠杆和流动性需求同时下跌。线性平均相关无法充分描述尾部依赖。<\/p>\n<h3>共同因子陷阱<\/h3>\n<p>多只不同名称的股票可能都暴露于权益市场、利率或同一行业。持有数量增加，不代表风险来源增加。<\/p>\n<h2>相关性如何进入组合风险<\/h2>\n<p>两资产组合方差为：<\/p>\n<p>[\n\\sigma_p^2=w_1^2\\sigma_1^2+w_2^2\\sigma_2^2+2w_1w_2\\rho_{12}\\sigma_1\\sigma_2\n]<\/p>\n<p>相关性越低，理论分散效果越大，但还取决于权重和各自波动。<\/p>\n<h2>更好的分散检查<\/h2>\n<p>同时看因子暴露、下行相关、危机情景、边际风险贡献和流动性。真正的分散是让损失驱动因素不同，而不是让证券代码更多。<\/p>\n<h2>计算演练：公式之外还要核对口径<\/h2>\n<p>学习“相关性陷阱：不要把鸡蛋放一个篮子里？也可能一起碎”时，真正容易出错的通常不是按计算器，而是频率、单位、样本和解释口径。完成下面的计算闭环，结果才可比较。<\/p>\n<ol>\n<li>先写变量定义、单位、时间频率与样本区间，再代入公式。<\/li>\n<li>用一个手算小样本验证方向、边界值和极端情形，确认实现没有符号或分母错误。<\/li>\n<li>再用完整数据计算，并同时报告样本数、缺失处理和年化假设。<\/li>\n<li>最后把数值翻译成投资含义，说明它能回答什么、不能回答什么。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>混用日频、月频与年化结果；修正方法是让频率和年化系数显式化。<\/li>\n<li>只报告一个点估计；修正方法是同时查看样本期、分布、稳定性和极端值。<\/li>\n<li>把统计相关当成因果或可交易利润；还要验证时点、成本和样本外表现。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>公式中的每个变量都有定义和单位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>手算样本与程序结果一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>频率、年化和无风险收益率口径已写明<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>结论包含适用范围与不可解释部分<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>相关系数是样本内线性关系估计，不是永久属性。<\/li>\n<li>危机与共同因子会让表面分散失效。<\/li>\n<li>组合应按风险来源和风险贡献判断分散程度。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>假设两资产波动均为 20%、权重各 50%，分别计算相关性为 1、0 和 -0.5 时的组合波动。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第018讲 线性回归：找A和B的秘密关系，预测股价第一步<\/strong>。<\/p>"}, {"n": 18, "title": "线性回归：找A和B的秘密关系，预测股价第一步", "html": "<h1>第018讲 线性回归：找A和B的秘密关系，预测股价第一步<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。公式与数字示例用于解释概念，不代表收益承诺。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解线性回归的系数、残差和拟合度。<\/li>\n<li>区分预测关系、因果关系与风险暴露。<\/li>\n<li>识别金融回归中的常见诊断问题。<\/li>\n<\/ul>\n<h2>一条线表达什么<\/h2>\n<p>简单线性回归写为：<\/p>\n<p>[\ny_t=\\alpha+\\beta x_t+\\varepsilon_t\n]<\/p>\n<p>(\\beta) 描述 (x) 变化一个单位时 (y) 的平均变化，(\\alpha) 是截距，(\\varepsilon) 是模型未解释部分。<\/p>\n<p>在资产定价中，用个股收益回归市场收益时，(\\beta) 可理解为市场暴露，(\\alpha) 是控制该暴露后的平均剩余收益，但不应自动解释为稳定能力。<\/p>\n<h2>最小二乘做了什么<\/h2>\n<p>普通最小二乘选择参数，使残差平方和最小。它对异常值敏感，并依赖线性、误差结构等假设。金融时间序列常有异方差和自相关，需要稳健标准误或其他模型。<\/p>\n<h2>(R^2) 不等于有用<\/h2>\n<p>高 (R^2) 只说明样本内解释比例高，不代表因果成立或样本外预测好。低 (R^2) 的信号在大样本和严格成本控制下也可能有价值。<\/p>\n<h2>三个危险<\/h2>\n<ul>\n<li><strong>遗漏变量<\/strong>：共同因素同时推动 (x) 和 (y)。<\/li>\n<li><strong>多重共线<\/strong>：多个特征高度相似，系数不稳定。<\/li>\n<li><strong>数据挖掘<\/strong>：尝试大量变量后只报告显著结果。<\/li>\n<\/ul>\n<h2>回归的正确用途<\/h2>\n<p>先画散点图与残差，再检查稳定性、异常点、滚动系数和样本外误差。回归是描述关系的起点，不是因果证明书。<\/p>\n<h2>计算演练：公式之外还要核对口径<\/h2>\n<p>学习“线性回归：找A和B的秘密关系，预测股价第一步”时，真正容易出错的通常不是按计算器，而是频率、单位、样本和解释口径。完成下面的计算闭环，结果才可比较。<\/p>\n<ol>\n<li>先写变量定义、单位、时间频率与样本区间，再代入公式。<\/li>\n<li>用一个手算小样本验证方向、边界值和极端情形，确认实现没有符号或分母错误。<\/li>\n<li>再用完整数据计算，并同时报告样本数、缺失处理和年化假设。<\/li>\n<li>最后把数值翻译成投资含义，说明它能回答什么、不能回答什么。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>混用日频、月频与年化结果；修正方法是让频率和年化系数显式化。<\/li>\n<li>只报告一个点估计；修正方法是同时查看样本期、分布、稳定性和极端值。<\/li>\n<li>把统计相关当成因果或可交易利润；还要验证时点、成本和样本外表现。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>公式中的每个变量都有定义和单位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>手算样本与程序结果一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>频率、年化和无风险收益率口径已写明<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>结论包含适用范围与不可解释部分<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>回归把目标拆成可解释部分和残差。<\/li>\n<li>系数显著、高拟合度都不自动意味着因果或可交易。<\/li>\n<li>残差诊断、稳定性和样本外检验比单张系数表更重要。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>用一个资产收益率序列对市场收益率序列做回归，记录 Alpha、Beta 和 R²；再把样本分成两半，比较系数是否稳定。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第019讲 平稳性：为什么股价不能直接预测？差分是个魔术<\/strong>。<\/p>"}, {"n": 19, "title": "平稳性：为什么股价不能直接预测？差分是个魔术", "html": "<h1>第019讲 平稳性：为什么股价不能直接预测？差分是个魔术<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。公式与数字示例用于解释概念，不代表收益承诺。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解平稳性为何是时间序列建模基础。<\/li>\n<li>区分价格水平、收益率与价差的统计性质。<\/li>\n<li>避免伪回归和错误差分。<\/li>\n<\/ul>\n<h2>什么是平稳<\/h2>\n<p>弱平稳过程的均值、方差和自协方差结构不随时间改变。很多统计模型默认历史关系可以在未来继续估计，因此需要某种稳定性。<\/p>\n<h2>为什么价格水平常不能直接回归<\/h2>\n<p>许多资产价格具有趋势和单位根特征。两个互不相关的上升价格序列也可能得到很高 (R^2)，形成伪回归。看似显著的关系只是共同随时间增长。<\/p>\n<h2>差分与收益率<\/h2>\n<p>价格一阶差分 (P_t-P_{t-1}) 或对数差分 (\\ln P_t-\\ln P_{t-1}) 往往比价格水平更接近平稳。对数差分正是对数收益率。<\/p>\n<p>但不能为了通过检验而盲目差分。差分会移除长期信息；若两个非平稳序列存在稳定长期组合，应研究协整而不是分别过度差分。<\/p>\n<h2>如何检查<\/h2>\n<ul>\n<li>画水平、差分和滚动统计图。<\/li>\n<li>比较不同时间段的均值与方差。<\/li>\n<li>使用 ADF 等单位根检验，但不要只依赖一个 p 值。<\/li>\n<li>检查结构断点、季节性和制度变化。<\/li>\n<\/ul>\n<h2>金融含义<\/h2>\n<p>平稳不是“价格不会变化”，而是被建模对象的统计规律在研究区间内相对稳定。市场非平稳意味着模型必须滚动估计、监控漂移并保留失效机制。<\/p>\n<h2>计算演练：公式之外还要核对口径<\/h2>\n<p>学习“平稳性：为什么股价不能直接预测？差分是个魔术”时，真正容易出错的通常不是按计算器，而是频率、单位、样本和解释口径。完成下面的计算闭环，结果才可比较。<\/p>\n<ol>\n<li>先写变量定义、单位、时间频率与样本区间，再代入公式。<\/li>\n<li>用一个手算小样本验证方向、边界值和极端情形，确认实现没有符号或分母错误。<\/li>\n<li>再用完整数据计算，并同时报告样本数、缺失处理和年化假设。<\/li>\n<li>最后把数值翻译成投资含义，说明它能回答什么、不能回答什么。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>混用日频、月频与年化结果；修正方法是让频率和年化系数显式化。<\/li>\n<li>只报告一个点估计；修正方法是同时查看样本期、分布、稳定性和极端值。<\/li>\n<li>把统计相关当成因果或可交易利润；还要验证时点、成本和样本外表现。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>公式中的每个变量都有定义和单位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>手算样本与程序结果一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>频率、年化和无风险收益率口径已写明<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>结论包含适用范围与不可解释部分<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>平稳性关心统计结构是否随时间稳定。<\/li>\n<li>直接回归非平稳价格容易得到伪关系。<\/li>\n<li>差分能改善稳定性，但可能丢失长期信息。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>选择两个长期上涨但业务无关的价格序列，比较价格水平回归与收益率回归的结果，并解释差异。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第020讲 概率思维：交易的本质是一场重复下注的赌局<\/strong>。<\/p>"}, {"n": 20, "title": "概率思维：交易的本质是一场重复下注的赌局", "html": "<h1>第020讲 概率思维：交易的本质是一场重复下注的赌局<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。公式与数字示例用于解释概念，不代表收益承诺。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>用概率、期望和赔率理解重复交易。<\/li>\n<li>区分胜率、盈亏比与长期优势。<\/li>\n<li>建立条件概率和更新信念的习惯。<\/li>\n<\/ul>\n<h2>一笔交易无法证明策略<\/h2>\n<p>交易结果同时包含规则优势和随机波动。概率思维不问“这次一定赢吗”，而问“在相似条件重复发生时，结果分布如何”。<\/p>\n<h2>胜率不等于赚钱<\/h2>\n<p>每笔期望可写为：<\/p>\n<p>[\nE=P(win)\\times AvgWin-P(loss)\\times AvgLoss-Cost\n]<\/p>\n<p>胜率 80% 的策略若偶尔巨亏，期望仍可能为负；胜率 40% 的趋势策略若盈利远大于亏损，也可能有正期望。<\/p>\n<h2>大数定律需要条件<\/h2>\n<p>重复次数增加时，样本平均可能接近期望，但前提是分布相对稳定、样本依赖可控。市场规则会变化，因此“长期必然兑现”不能被机械理解。<\/p>\n<h2>条件概率与基准率<\/h2>\n<p>“出现信号后上涨概率 60%”只有在说明资产、周期、成本和市场状态后才有意义。先看基准率：如果所有时候上涨概率本来就是 58%，信号增量很小。<\/p>\n<h2>贝叶斯式更新<\/h2>\n<p>研究者应从初始信念出发，根据新证据逐步调整，而不是一次回测就从怀疑变成确信。样本越少、试验越多、假设越复杂，证据权重应越低。<\/p>\n<h2>风险来自分布而非单点<\/h2>\n<p>除期望外，还要看方差、偏度、尾部和连续亏损概率。正期望策略也可能经历长回撤，仓位必须保证能活到优势兑现。<\/p>\n<h2>计算演练：公式之外还要核对口径<\/h2>\n<p>学习“概率思维：交易的本质是一场重复下注的赌局”时，真正容易出错的通常不是按计算器，而是频率、单位、样本和解释口径。完成下面的计算闭环，结果才可比较。<\/p>\n<ol>\n<li>先写变量定义、单位、时间频率与样本区间，再代入公式。<\/li>\n<li>用一个手算小样本验证方向、边界值和极端情形，确认实现没有符号或分母错误。<\/li>\n<li>再用完整数据计算，并同时报告样本数、缺失处理和年化假设。<\/li>\n<li>最后把数值翻译成投资含义，说明它能回答什么、不能回答什么。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>混用日频、月频与年化结果；修正方法是让频率和年化系数显式化。<\/li>\n<li>只报告一个点估计；修正方法是同时查看样本期、分布、稳定性和极端值。<\/li>\n<li>把统计相关当成因果或可交易利润；还要验证时点、成本和样本外表现。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>公式中的每个变量都有定义和单位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>手算样本与程序结果一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>频率、年化和无风险收益率口径已写明<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>结论包含适用范围与不可解释部分<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>交易是重复下注问题，单次输赢不能验证策略。<\/li>\n<li>长期结果由胜率、盈亏比、成本和尾部共同决定。<\/li>\n<li>概率结论必须有基准率、条件和不确定区间。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>设计两个策略：一个高胜率低盈亏比，一个低胜率高盈亏比。为它们设定数字并计算期望，再讨论哪一个更难坚持。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第021讲 行情数据：OHLCV里藏着多少金矿？<\/strong>。<\/p>"}]}, {"no": 3, "name": "燃料·金融数据", "desc": "巧妇难为无米之炊，认识数据的种类、获取与清洗。", "chapters": [{"n": 21, "title": "行情数据：OHLCV里藏着多少金矿？", "html": "<h1>第021讲 行情数据：OHLCV里藏着多少金矿？<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。数据示例与方法需结合真实市场规则验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解 OHLCV 每个字段的来源与限制。<\/li>\n<li>识别 K 线聚合中的信息损失。<\/li>\n<li>建立行情数据质量检查清单。<\/li>\n<\/ul>\n<h2>一根 K 线是怎样形成的<\/h2>\n<p>OHLCV 分别是开盘价、最高价、最低价、收盘价和成交量。它把一个时间窗口内的逐笔交易压缩为五个数字，便于观察，却丢失了成交顺序、盘口深度和窗口内路径。<\/p>\n<h2>五个字段的真实含义<\/h2>\n<p>开盘价通常是窗口内第一笔有效成交，收盘价是最后一笔或交易所定义的收盘价格。最高、最低只告诉你边界，不告诉你先高后低还是先低后高。成交量要区分股数、手数和合约张数，跨市场比较还需统一成交额。<\/p>\n<h2>K 线里能提取什么<\/h2>\n<p>价格水平可构造收益率、缺口和区间波动率；高低价可用于真实波幅；成交量可描述活跃度和市场冲击。常见特征包括：<\/p>\n<p>[\n\\text{区间振幅}=\\frac{High-Low}{Close_{prev}}\n]<\/p>\n<p>但由同一 OHLCV 派生的大量指标往往高度重复，不等于创造了更多独立信息。<\/p>\n<h2>数据陷阱<\/h2>\n<ul>\n<li>停牌日、集合竞价和夜盘的定义不同。<\/li>\n<li>涨跌停时看到价格，不代表策略能成交。<\/li>\n<li>零成交与缺失值不能一律当作同一情况。<\/li>\n<li>不同供应商对坏点、复权和时区处理可能不同。<\/li>\n<li>日线数据无法真实还原盘中止损的触发先后顺序。<\/li>\n<\/ul>\n<h2>最低质量检查<\/h2>\n<p>检查 High 是否不低于 Open/Close、Low 是否不高于两者、成交量是否为负、时间是否重复、交易日历是否完整，并与第二数据源抽样核对。<\/p>\n<h2>数据审计：先证明当时真的看得到<\/h2>\n<p>围绕“行情数据：OHLCV里藏着多少金矿？”建立一张数据审计卡。目标不是把表填满，而是证明每个字段在决策时点真实可得、口径一致并可追溯。<\/p>\n<ol>\n<li>记录字段定义、来源、原始频率、发布时间、修订规则与授权范围。<\/li>\n<li>区分事件发生时间、数据发布时间、采集时间和策略可用时间。<\/li>\n<li>统计缺失、重复、异常和覆盖率，并保留原始值与清洗日志。<\/li>\n<li>用小样本从原始数据重建一个指标，核对复权、单位和时间对齐。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用今天看到的历史数据假装当时已经可得；应使用 point-in-time 快照或发布时间约束。<\/li>\n<li>直接删除缺失值而不解释缺失机制；缺失本身可能包含选择偏差。<\/li>\n<li>只保存清洗后结果；没有原始快照和日志就无法复现与审计。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>每个核心字段有来源和更新时间<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>不存在使用未来修订值的前视偏差<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>缺失、异常、重复与退市样本均有处理记录<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>从原始数据到研究表的变换可以重放<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>OHLCV 是交易过程的压缩，不是完整市场状态。<\/li>\n<li>技术指标大量增加不代表独立信息增加。<\/li>\n<li>回测前必须检查价格逻辑、时间、成交和交易状态。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>任选一只资产的 30 根日 K，计算实体、上下影线、振幅和成交额，并找出异常值后回到原始行情核验。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第022讲 复权数据：前复权、后复权搞错了，策略直接报废<\/strong>。<\/p>"}, {"n": 22, "title": "复权数据：前复权、后复权搞错了，策略直接报废", "html": "<h1>第022讲 复权数据：前复权、后复权搞错了，策略直接报废<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。数据示例与方法需结合真实市场规则验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>区分不复权、前复权与后复权。<\/li>\n<li>理解公司行动对价格与收益的影响。<\/li>\n<li>为研究和实盘交易选择一致口径。<\/li>\n<\/ul>\n<h2>为什么价格会“凭空腰斩”<\/h2>\n<p>分红、送股、拆分和配股会改变价格基准。如果直接使用原始收盘价，除权日可能被误判为巨大亏损或交易信号。<\/p>\n<h2>三种常见口径<\/h2>\n<ul>\n<li><strong>不复权<\/strong>：保留当时真实报价，适合订单和价格限制分析，但不能直接表示长期总回报。<\/li>\n<li><strong>前复权<\/strong>：通常保持最新价格不变，向历史调整，便于观察与当前价格衔接；新增公司行动后，过去数值可能改变。<\/li>\n<li><strong>后复权<\/strong>：保持早期价格不变，向后累积调整，适合展示财富增长，但数值不再等于当时成交价。<\/li>\n<\/ul>\n<p>不同供应商公式可能不同，必须阅读口径说明。<\/p>\n<h2>回测应该用哪一种<\/h2>\n<p>信号计算可以使用一致的总回报序列，但成交模拟应尽量使用当时真实可交易价格，并单独处理现金分红、股数变化和公司行动。只用一条复权价格同时负责信号和成交，容易引入不现实订单。<\/p>\n<h2>复权因子的时间问题<\/h2>\n<p>调整因子必须按当时已发生的公司行动生成。若数据接口回溯修改历史，研究结果可能难以复现。保存原始价、调整因子和数据版本比只保存复权价更安全。<\/p>\n<h2>检查方法<\/h2>\n<p>在除权日前后核对原始价格、复权价格、持仓股数和现金流，确认组合净值连续且总资产守恒。<\/p>\n<h2>数据审计：先证明当时真的看得到<\/h2>\n<p>围绕“复权数据：前复权、后复权搞错了，策略直接报废”建立一张数据审计卡。目标不是把表填满，而是证明每个字段在决策时点真实可得、口径一致并可追溯。<\/p>\n<ol>\n<li>记录字段定义、来源、原始频率、发布时间、修订规则与授权范围。<\/li>\n<li>区分事件发生时间、数据发布时间、采集时间和策略可用时间。<\/li>\n<li>统计缺失、重复、异常和覆盖率，并保留原始值与清洗日志。<\/li>\n<li>用小样本从原始数据重建一个指标，核对复权、单位和时间对齐。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用今天看到的历史数据假装当时已经可得；应使用 point-in-time 快照或发布时间约束。<\/li>\n<li>直接删除缺失值而不解释缺失机制；缺失本身可能包含选择偏差。<\/li>\n<li>只保存清洗后结果；没有原始快照和日志就无法复现与审计。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>每个核心字段有来源和更新时间<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>不存在使用未来修订值的前视偏差<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>缺失、异常、重复与退市样本均有处理记录<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>从原始数据到研究表的变换可以重放<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>公司行动会改变价格基准，不处理会制造虚假收益。<\/li>\n<li>前复权便于连续观察，后复权便于累计展示，原始价用于真实成交。<\/li>\n<li>专业回测应分离信号口径与成交口径。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>找一个发生过分红或拆分的证券，对比三种价格序列，并手算公司行动前后持仓总价值。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第023讲 基本面数据：PE、PB、ROE等，在量化里怎么用？<\/strong>。<\/p>"}, {"n": 23, "title": "基本面数据：PE、PB、ROE等，在量化里怎么用？", "html": "<h1>第023讲 基本面数据：PE、PB、ROE等，在量化里怎么用？<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。数据示例与方法需结合真实市场规则验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解常见基本面指标的量化定义。<\/li>\n<li>正确处理财报发布时间和横截面可比性。<\/li>\n<li>把估值与质量信息转成可测试因子。<\/li>\n<\/ul>\n<h2>从故事到字段<\/h2>\n<p>PE、PB、ROE 等指标把企业经营压缩为可比较数字。PE 是市值相对盈利，PB 是市值相对净资产，ROE 衡量净利润相对股东权益。每个指标都有适用边界：亏损企业的 PE 缺乏正常解释，高杠杆可能抬高 ROE，金融与制造行业的资产结构也不同。<\/p>\n<h2>量化最关键的是“当时可得”<\/h2>\n<p>财报所属期不等于市场知道它的日期。回测应使用公告日或可用时间，不能在季度结束时提前使用尚未披露的数据。修订值、预告和正式报告也要区分版本。<\/p>\n<h2>三类常见因子<\/h2>\n<ul>\n<li><strong>估值<\/strong>：盈利收益率、账面市值比、自由现金流收益率。<\/li>\n<li><strong>质量<\/strong>：ROE、毛利率、现金流质量、盈利稳定性、杠杆。<\/li>\n<li><strong>成长<\/strong>：收入、利润和现金流增长，但要警惕低基数与一次性项目。<\/li>\n<\/ul>\n<h2>横截面处理<\/h2>\n<p>通常要按行业比较、对极端值缩尾、标准化并处理缺失。简单地把全市场 PE 排序，可能只是行业暴露。<\/p>\n<h2>从指标到组合<\/h2>\n<p>先定义股票池与再平衡时间，再用单因子排序形成分组，观察未来收益、换手率和行业偏离。随后才考虑多因子合成。因子含义应保持稳定，不能根据结果不断更换计算口径。<\/p>\n<h2>数据审计：先证明当时真的看得到<\/h2>\n<p>围绕“基本面数据：PE、PB、ROE等，在量化里怎么用？”建立一张数据审计卡。目标不是把表填满，而是证明每个字段在决策时点真实可得、口径一致并可追溯。<\/p>\n<ol>\n<li>记录字段定义、来源、原始频率、发布时间、修订规则与授权范围。<\/li>\n<li>区分事件发生时间、数据发布时间、采集时间和策略可用时间。<\/li>\n<li>统计缺失、重复、异常和覆盖率，并保留原始值与清洗日志。<\/li>\n<li>用小样本从原始数据重建一个指标，核对复权、单位和时间对齐。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用今天看到的历史数据假装当时已经可得；应使用 point-in-time 快照或发布时间约束。<\/li>\n<li>直接删除缺失值而不解释缺失机制；缺失本身可能包含选择偏差。<\/li>\n<li>只保存清洗后结果；没有原始快照和日志就无法复现与审计。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>每个核心字段有来源和更新时间<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>不存在使用未来修订值的前视偏差<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>缺失、异常、重复与退市样本均有处理记录<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>从原始数据到研究表的变换可以重放<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>基本面指标是经营信息的代理，不是公司价值本身。<\/li>\n<li>财报必须按公告可用时间进入回测。<\/li>\n<li>行业中性、异常值和缺失处理决定横截面可比性。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>选择 ROE，写出字段来源、公告时间、异常处理、行业比较和调仓规则，形成一张因子定义卡。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第024讲 另类数据：卫星图像、舆情分析、电商销量，你能用到的非传统信息<\/strong>。<\/p>"}, {"n": 24, "title": "另类数据：卫星图像、舆情分析、电商销量，你能用到的非传统信息", "html": "<h1>第024讲 另类数据：卫星图像、舆情分析、电商销量，你能用到的非传统信息<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。数据示例与方法需结合真实市场规则验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解另类数据的价值链与成本。<\/li>\n<li>区分数据新颖性和可交易增量。<\/li>\n<li>识别隐私、授权和时间戳风险。<\/li>\n<\/ul>\n<h2>什么是另类数据<\/h2>\n<p>相对传统行情与财报，卫星图像、招聘信息、网页访问、应用活跃、物流、电商销量、文本舆情和链上活动等常被称为另类数据。它们可能更及时或更细颗粒，但通常更脏、更贵、更难解释。<\/p>\n<h2>从原始数据到信号的五步<\/h2>\n<ol>\n<li>获取合法授权且持续可用的数据。<\/li>\n<li>将图片、文本或事件转成结构化特征。<\/li>\n<li>对齐实体，例如把门店、品牌映射到上市公司。<\/li>\n<li>确认数据产生、发布和可获取时间。<\/li>\n<li>检验其在传统因子之外是否有增量。<\/li>\n<\/ol>\n<p>任何一步失败，都可能把“新数据”变成昂贵噪声。<\/p>\n<h2>舆情例子<\/h2>\n<p>情绪模型输出正负分数不等于交易信号。需要处理转发重复、机器人账号、语言反讽、公司别名和新闻发生时间。更重要的是判断市场是否已经定价。<\/p>\n<h2>三类风险<\/h2>\n<ul>\n<li><strong>选择偏差<\/strong>：供应商只展示成功案例或历史覆盖不断变化。<\/li>\n<li><strong>数据漂移<\/strong>：平台规则、用户结构和采样方式变化。<\/li>\n<li><strong>合规风险<\/strong>：隐私、版权、用户授权和跨境使用边界不清。<\/li>\n<\/ul>\n<h2>评估框架<\/h2>\n<p>比较加入数据前后的样本外表现、换手率、容量和稳定性，并计算数据成本与工程维护成本。另类数据的价值不在“另类”，而在是否带来持续、合法、可执行的增量信息。<\/p>\n<h2>数据审计：先证明当时真的看得到<\/h2>\n<p>围绕“另类数据：卫星图像、舆情分析、电商销量，你能用到的非传统信息”建立一张数据审计卡。目标不是把表填满，而是证明每个字段在决策时点真实可得、口径一致并可追溯。<\/p>\n<ol>\n<li>记录字段定义、来源、原始频率、发布时间、修订规则与授权范围。<\/li>\n<li>区分事件发生时间、数据发布时间、采集时间和策略可用时间。<\/li>\n<li>统计缺失、重复、异常和覆盖率，并保留原始值与清洗日志。<\/li>\n<li>用小样本从原始数据重建一个指标，核对复权、单位和时间对齐。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用今天看到的历史数据假装当时已经可得；应使用 point-in-time 快照或发布时间约束。<\/li>\n<li>直接删除缺失值而不解释缺失机制；缺失本身可能包含选择偏差。<\/li>\n<li>只保存清洗后结果；没有原始快照和日志就无法复现与审计。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>每个核心字段有来源和更新时间<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>不存在使用未来修订值的前视偏差<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>缺失、异常、重复与退市样本均有处理记录<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>从原始数据到研究表的变换可以重放<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>另类数据需要经过获取、结构化、实体映射、时间对齐和增量检验。<\/li>\n<li>新颖不等于有效，工程与合规成本可能超过收益。<\/li>\n<li>数据漂移和授权边界必须持续监控。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为“招聘信息预测公司增长”设计研究方案，列出标签、时间戳、实体映射、混杂因素和合规检查。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第025讲 数据清洗：缺失值、异常值，垃圾进垃圾出的惨剧<\/strong>。<\/p>"}, {"n": 25, "title": "数据清洗：缺失值、异常值，垃圾进垃圾出的惨剧", "html": "<h1>第025讲 数据清洗：缺失值、异常值，垃圾进垃圾出的惨剧<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。数据示例与方法需结合真实市场规则验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>建立缺失、异常和重复数据的处理流程。<\/li>\n<li>区分真实市场事件与采集错误。<\/li>\n<li>让清洗规则可复现、可审计。<\/li>\n<\/ul>\n<h2>垃圾进，垃圾出<\/h2>\n<p>模型不会自动识别输入是否合理。一个错位日期、重复记录或错误单位，可能比参数选择更影响结果。<\/p>\n<h2>缺失值不是一种东西<\/h2>\n<p>缺失可能来自停牌、尚未上市、接口失败、公司不适用或真实零值。先标记原因，再决定删除、前向填充、插值或保留缺失。对价格无条件前向填充会制造可以成交的假象。<\/p>\n<h2>异常值先核验再处理<\/h2>\n<p>极端收益可能是复权错误，也可能是真实跳空。可用业务规则、横截面分位、时间序列变化和第二数据源交叉核对。缩尾会降低统计影响，但不应掩盖真实尾部风险。<\/p>\n<h2>重复与键设计<\/h2>\n<p>为数据定义唯一键，例如“证券—交易时间—数据版本”。检查重复、乱序和时区；合并多源数据时明确优先级，不能静默覆盖。<\/p>\n<h2>可审计清洗管线<\/h2>\n<p>保留原始只读层、标准化层和研究特征层；每次处理记录规则、影响行数和版本。质量报告至少包括覆盖率、缺失率、异常率、最新时间和跨源差异。<\/p>\n<h2>防止信息泄漏<\/h2>\n<p>标准化、填补和异常阈值若使用全样本统计，也会偷看未来。滚动研究必须只用训练窗口估计清洗参数。<\/p>\n<h2>数据审计：先证明当时真的看得到<\/h2>\n<p>围绕“数据清洗：缺失值、异常值，垃圾进垃圾出的惨剧”建立一张数据审计卡。目标不是把表填满，而是证明每个字段在决策时点真实可得、口径一致并可追溯。<\/p>\n<ol>\n<li>记录字段定义、来源、原始频率、发布时间、修订规则与授权范围。<\/li>\n<li>区分事件发生时间、数据发布时间、采集时间和策略可用时间。<\/li>\n<li>统计缺失、重复、异常和覆盖率，并保留原始值与清洗日志。<\/li>\n<li>用小样本从原始数据重建一个指标，核对复权、单位和时间对齐。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用今天看到的历史数据假装当时已经可得；应使用 point-in-time 快照或发布时间约束。<\/li>\n<li>直接删除缺失值而不解释缺失机制；缺失本身可能包含选择偏差。<\/li>\n<li>只保存清洗后结果；没有原始快照和日志就无法复现与审计。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>每个核心字段有来源和更新时间<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>不存在使用未来修订值的前视偏差<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>缺失、异常、重复与退市样本均有处理记录<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>从原始数据到研究表的变换可以重放<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>缺失和异常必须按业务原因分类。<\/li>\n<li>原始数据应保留，清洗过程要版本化并记录影响。<\/li>\n<li>清洗参数本身也可能造成未来信息泄漏。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>设计一张行情数据质量报告，至少包含完整性、唯一性、逻辑一致性、及时性和跨源一致性五类指标。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第026讲 幸存者偏差：你回测时看不到的那些退市股<\/strong>。<\/p>"}, {"n": 26, "title": "幸存者偏差：你回测时看不到的那些退市股", "html": "<h1>第026讲 幸存者偏差：你回测时看不到的那些退市股<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。数据示例与方法需结合真实市场规则验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解幸存者偏差如何夸大历史表现。<\/li>\n<li>构建包含退市与历史成分的数据集。<\/li>\n<li>识别产品和案例展示中的幸存者叙事。<\/li>\n<\/ul>\n<h2>你看见的市场不是过去的市场<\/h2>\n<p>今天仍在交易的公司通常经历了筛选。若用当前股票列表回测十年前策略，已经提前排除了后来退市、破产或被长期停牌的失败者。<\/p>\n<h2>偏差如何进入回测<\/h2>\n<ul>\n<li>用当前指数成分回测历史指数策略。<\/li>\n<li>只下载当前数据库仍有代码的证券。<\/li>\n<li>忽略退市前最后价格和退市现金流。<\/li>\n<li>只分析仍在运营的基金或策略产品。<\/li>\n<\/ul>\n<p>这些做法会抬高收益、降低回撤并高估可交易性。<\/p>\n<h2>正确的时点股票池<\/h2>\n<p>每个历史日期都应使用当时已上市、满足条件且可交易的证券，保存上市、退市、停牌和公司行动记录。指数策略需要历史成分及生效日，而不是今天的成员名单。<\/p>\n<h2>退市处理<\/h2>\n<p>退市不等于最后一个收盘价后资产凭空消失。需要根据真实规则处理现金结算、换股、破产损失或缺失价格，并做保守假设和敏感性分析。<\/p>\n<h2>更广义的幸存者偏差<\/h2>\n<p>成功基金被媒体反复报道，失败策略悄悄关闭；公开策略库也会删除表现差的版本。研究时应追问“哪些失败样本没有进入数据”。<\/p>\n<h2>数据审计：先证明当时真的看得到<\/h2>\n<p>围绕“幸存者偏差：你回测时看不到的那些退市股”建立一张数据审计卡。目标不是把表填满，而是证明每个字段在决策时点真实可得、口径一致并可追溯。<\/p>\n<ol>\n<li>记录字段定义、来源、原始频率、发布时间、修订规则与授权范围。<\/li>\n<li>区分事件发生时间、数据发布时间、采集时间和策略可用时间。<\/li>\n<li>统计缺失、重复、异常和覆盖率，并保留原始值与清洗日志。<\/li>\n<li>用小样本从原始数据重建一个指标，核对复权、单位和时间对齐。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用今天看到的历史数据假装当时已经可得；应使用 point-in-time 快照或发布时间约束。<\/li>\n<li>直接删除缺失值而不解释缺失机制；缺失本身可能包含选择偏差。<\/li>\n<li>只保存清洗后结果；没有原始快照和日志就无法复现与审计。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>每个核心字段有来源和更新时间<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>不存在使用未来修订值的前视偏差<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>缺失、异常、重复与退市样本均有处理记录<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>从原始数据到研究表的变换可以重放<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>用当前存续证券回看历史会系统性美化结果。<\/li>\n<li>时点股票池和历史成分是可靠回测的基础。<\/li>\n<li>幸存者偏差也存在于基金、策略和案例展示中。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>检查你使用的数据源是否提供退市证券和历史指数成分；若没有，写出回测结果最可能被影响的三个方向。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第027讲 数据频率抉择：Tick、分钟、日线，不同频率对策略的致命影响<\/strong>。<\/p>"}, {"n": 27, "title": "数据频率抉择：Tick、分钟、日线，不同频率对策略的致命影响", "html": "<h1>第027讲 数据频率抉择：Tick、分钟、日线，不同频率对策略的致命影响<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。数据示例与方法需结合真实市场规则验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解 Tick、分钟和日线数据能回答的不同问题。<\/li>\n<li>根据信号半衰期选择频率。<\/li>\n<li>识别高频数据带来的微观结构与成本问题。<\/li>\n<\/ul>\n<h2>更细不等于更好<\/h2>\n<p>Tick 记录逐笔成交或盘口变化，分钟线进行窗口聚合，日线描述交易日整体。频率越高，信息更细，但噪声、数据量、延迟和成交建模难度也更高。<\/p>\n<h2>信号与数据要匹配<\/h2>\n<p>财务质量每季度变化，用 Tick 数据不会增加经济信息；订单簿失衡几秒内消失，日线又过于粗糙。频率应由信息更新速度和可执行期限决定。<\/p>\n<h2>高频的特殊问题<\/h2>\n<p>买卖价跳动、最小价位、排队顺序、撤单、撮合延迟和市场冲击会主导结果。用成交价中间值回测，可能假设自己总能以不存在的价格成交。<\/p>\n<h2>低频也有时点陷阱<\/h2>\n<p>使用当日收盘价生成信号后，不能默认同一收盘价大额成交；日线止损无法知道最高和最低的先后。低频回测同样要规定信号和执行时点。<\/p>\n<h2>频率选择四步<\/h2>\n<ol>\n<li>明确信息何时产生。<\/li>\n<li>估计信号衰减速度。<\/li>\n<li>选择能真实执行的最粗频率。<\/li>\n<li>在更细数据上验证成交与成本，而不是盲目把模型全部高频化。<\/li>\n<\/ol>\n<p>数据频率是研究假设的一部分，不是越大越专业的配置项。<\/p>\n<h2>数据审计：先证明当时真的看得到<\/h2>\n<p>围绕“数据频率抉择：Tick、分钟、日线，不同频率对策略的致命影响”建立一张数据审计卡。目标不是把表填满，而是证明每个字段在决策时点真实可得、口径一致并可追溯。<\/p>\n<ol>\n<li>记录字段定义、来源、原始频率、发布时间、修订规则与授权范围。<\/li>\n<li>区分事件发生时间、数据发布时间、采集时间和策略可用时间。<\/li>\n<li>统计缺失、重复、异常和覆盖率，并保留原始值与清洗日志。<\/li>\n<li>用小样本从原始数据重建一个指标，核对复权、单位和时间对齐。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用今天看到的历史数据假装当时已经可得；应使用 point-in-time 快照或发布时间约束。<\/li>\n<li>直接删除缺失值而不解释缺失机制；缺失本身可能包含选择偏差。<\/li>\n<li>只保存清洗后结果；没有原始快照和日志就无法复现与审计。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>每个核心字段有来源和更新时间<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>不存在使用未来修订值的前视偏差<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>缺失、异常、重复与退市样本均有处理记录<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>从原始数据到研究表的变换可以重放<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>频率应匹配信息半衰期和执行能力。<\/li>\n<li>高频增加微观结构、延迟和成本建模要求。<\/li>\n<li>日线回测仍需严格区分信号与成交时点。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为财报事件、日频动量和盘口做市三类策略分别选择最低必要数据频率，并说明理由。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第028讲 动手搭建你自己的轻量级量化数据库<\/strong>。<\/p>"}, {"n": 28, "title": "动手搭建你自己的轻量级量化数据库", "html": "<h1>第028讲 动手搭建你自己的轻量级量化数据库<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。数据示例与方法需结合真实市场规则验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>设计原始、标准化和特征三层数据库。<\/li>\n<li>掌握主键、版本与增量更新思路。<\/li>\n<li>建立可复现的数据访问接口。<\/li>\n<\/ul>\n<h2>目标：轻量但不随意<\/h2>\n<p>个人数据库不需要一开始追求分布式架构，但必须保证来源明确、更新可重复、历史不被静默覆盖。<\/p>\n<h2>三层结构<\/h2>\n<ul>\n<li><strong>Raw 原始层<\/strong>：保存供应商原始响应，只追加、不修改。<\/li>\n<li><strong>Clean 标准层<\/strong>：统一代码、时区、频率、单位和复权字段。<\/li>\n<li><strong>Feature 特征层<\/strong>：保存研究使用的收益、因子和标签，并记录计算版本。<\/li>\n<\/ul>\n<h2>核心表<\/h2>\n<p>证券主表记录代码、市场、上市退市日期和资产类型；交易日历表记录各市场开闭市；行情表以证券和时间为主键；公司行动表保存事件和生效日；基本面表同时保留报告期、公告时间和版本。<\/p>\n<h2>更新流程<\/h2>\n<p>每次任务先读取最新成功时间，拉取增量数据，进行校验，再原子写入。失败时不更新水位。对回溯修订的数据保留版本或快照，确保过去研究可重现。<\/p>\n<h2>存储选择<\/h2>\n<p>小规模日频可使用 Parquet 配合分析引擎，关系与元数据可用 SQLite 或 PostgreSQL。选择标准是数据量、并发、查询方式和维护能力，而不是技术潮流。<\/p>\n<h2>最低工程规范<\/h2>\n<p>配置与密钥分离、UTC 与本地时区清楚、日志可追踪、质量测试自动化、备份可恢复，并提供统一读取函数，避免每个策略各写一套口径。<\/p>\n<h2>验收<\/h2>\n<p>给定数据版本、截止时间和查询参数，任何一次研究都应能重新得到相同输入。可复现性比界面漂亮更重要。<\/p>\n<h2>数据审计：先证明当时真的看得到<\/h2>\n<p>围绕“动手搭建你自己的轻量级量化数据库”建立一张数据审计卡。目标不是把表填满，而是证明每个字段在决策时点真实可得、口径一致并可追溯。<\/p>\n<ol>\n<li>记录字段定义、来源、原始频率、发布时间、修订规则与授权范围。<\/li>\n<li>区分事件发生时间、数据发布时间、采集时间和策略可用时间。<\/li>\n<li>统计缺失、重复、异常和覆盖率，并保留原始值与清洗日志。<\/li>\n<li>用小样本从原始数据重建一个指标，核对复权、单位和时间对齐。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用今天看到的历史数据假装当时已经可得；应使用 point-in-time 快照或发布时间约束。<\/li>\n<li>直接删除缺失值而不解释缺失机制；缺失本身可能包含选择偏差。<\/li>\n<li>只保存清洗后结果；没有原始快照和日志就无法复现与审计。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>每个核心字段有来源和更新时间<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>不存在使用未来修订值的前视偏差<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>缺失、异常、重复与退市样本均有处理记录<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>从原始数据到研究表的变换可以重放<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>轻量数据库也应分离原始、标准和特征层。<\/li>\n<li>时间、主键和版本决定研究能否复现。<\/li>\n<li>增量更新必须先校验再提交，并保留失败日志。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>画出自己的数据表结构，并为行情表、基本面表和公司行动表分别定义主键、时间字段和质量检查。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第029讲 移动平均线：最古老却依然有效的量化信号<\/strong>。<\/p>"}]}, {"no": 4, "name": "寻龙·经典策略拆解", "desc": "逐个解剖实战中久经考验的策略类型，理解其逻辑与适用环境。", "chapters": [{"n": 29, "title": "移动平均线：最古老却依然有效的量化信号", "html": "<h1>第029讲 移动平均线：最古老却依然有效的量化信号<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解移动平均线作为低通滤波器的含义。<\/li>\n<li>区分趋势识别与价格预测。<\/li>\n<li>掌握窗口、滞后和交易成本之间的权衡。<\/li>\n<\/ul>\n<h2>均线做了什么<\/h2>\n<p>(N) 日简单移动平均为 (MA_t=\\frac{1}{N}\\sum_{i=0}^{N-1}P_{t-i})。它平滑短期噪声，让趋势更容易观察，但代价是滞后。窗口越长越稳定，反应越慢。<\/p>\n<p>指数移动平均给近期价格更高权重，递推形式为 (EMA_t=\\alpha P_t+(1-\\alpha)EMA_{t-1})。它反应更快，也更容易受噪声影响。<\/p>\n<h2>从指标到信号<\/h2>\n<p>价格站上均线可作为趋势状态，均线斜率可表示方向，价格与均线距离可表示偏离。指标本身不包含仓位、执行与退出，必须补齐下一交易时点、成本和风险规则。<\/p>\n<h2>为什么古老方法仍有人用<\/h2>\n<p>趋势可能来自信息逐步扩散、参与者行为延续和风险管理需求。均线不预测拐点，而是在趋势确认后参与，并接受初期利润让渡。<\/p>\n<h2>主要失败方式<\/h2>\n<p>震荡市场会反复穿越，产生“锯齿亏损”；参数过短换手率高，过长又可能承受较大回撤。应比较参数邻域、不同资产和不同阶段，而不是寻找唯一神奇窗口。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“移动平均线：最古老却依然有效的量化信号”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>均线是价格平滑器，优势与滞后同时存在。<\/li>\n<li>均线信号需要与仓位、执行和风控组合。<\/li>\n<li>趋势策略用震荡期小亏换取少数长趋势收益。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>计算 5、20 和 60 日均线，比较其转向时间、交易次数和成本，解释哪个更适合你的资产与周期。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第030讲 双均线金叉死叉：真那么简单，为何你还没暴富？<\/strong>。<\/p>"}, {"n": 30, "title": "双均线金叉死叉：真那么简单，为何你还没暴富？", "html": "<h1>第030讲 双均线金叉死叉：真那么简单，为何你还没暴富？<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>把金叉死叉写成无歧义规则。<\/li>\n<li>理解双均线策略的收益分布。<\/li>\n<li>识别参数挖掘和同价成交错误。<\/li>\n<\/ul>\n<h2>基本规则<\/h2>\n<p>当短均线从下向上穿越长均线时称金叉，反向称死叉。量化实现应定义状态而非肉眼画线：<\/p>\n<p>[\ns_t=\\begin{cases}1,&amp;MA_{short,t}&gt;MA_{long,t}\\0,&amp;其他\\end{cases}\n]<\/p>\n<p>只有状态变化时交易，可避免每天重复下单。<\/p>\n<h2>回测时点<\/h2>\n<p>若使用当日收盘价计算均线，最早应在收盘后知道信号，通常从下一可交易时点执行。以同一收盘价成交会产生前视式乐观。<\/p>\n<h2>收益为何不平滑<\/h2>\n<p>双均线通常胜率未必高，很多交易小亏或持平，收益依赖少数持续趋势。单看胜率会误解策略；更应观察盈亏比、回撤和趋势阶段表现。<\/p>\n<h2>参数陷阱<\/h2>\n<p>从大量长短窗口中挑历史最好组合，容易过拟合。应先限定有经济意义的范围，再看参数热图是否形成稳定高地，并保留样本外。<\/p>\n<h2>改进方向<\/h2>\n<p>加入波动率仓位、趋势强度过滤、跨资产分散和交易缓冲区，常比继续堆叠技术指标更稳健。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“双均线金叉死叉：真那么简单，为何你还没暴富？”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>金叉死叉要转成状态规则并使用下一可交易时点。<\/li>\n<li>双均线依赖少数大趋势，胜率不是核心指标。<\/li>\n<li>参数稳定区比单一最优参数更重要。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>实现 20/60 双均线基线，再将两个窗口各上下调整 20%，观察结果是否稳定。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第031讲 MACD的量化改造：背离与能量潮的正确打开方式<\/strong>。<\/p>"}, {"n": 31, "title": "MACD的量化改造：背离与能量潮的正确打开方式", "html": "<h1>第031讲 MACD的量化改造：背离与能量潮的正确打开方式<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解 MACD 的趋势与动量构成。<\/li>\n<li>把柱状图和背离改写为可计算条件。<\/li>\n<li>避免重复使用同源指标。<\/li>\n<\/ul>\n<h2>MACD 的结构<\/h2>\n<p>常见 MACD 由快慢 EMA 之差构成：(DIF=EMA_{fast}-EMA_{slow})，信号线 (DEA=EMA(DIF))，柱值为二者之差的缩放。它本质上仍来自价格平滑，不是独立于均线的新信息。<\/p>\n<h2>三类量化信号<\/h2>\n<ul>\n<li>DIF 与 DEA 交叉：趋势动量变化。<\/li>\n<li>柱值由负转正：短期动量改善。<\/li>\n<li>DIF 斜率或标准化幅度：比较不同价格尺度。<\/li>\n<\/ul>\n<h2>背离如何定义<\/h2>\n<p>“价格创新高、MACD 未创新高”必须给出摆动高点识别、比较窗口和最小差异。定义越自由，事后看图越容易，实盘交易复现越困难。<\/p>\n<h2>能量潮的误解<\/h2>\n<p>成交量可作为确认条件，但价格和成交量关系受市场机制影响。直接再加入多种均线、RSI 和 MACD，常只是重复表达同一段价格历史。<\/p>\n<h2>改造原则<\/h2>\n<p>对 MACD 做波动标准化、设置缓冲带、限制交易频率，并比较它相对简单动量基线是否真有增量。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“MACD的量化改造：背离与能量潮的正确打开方式”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>MACD 是快慢指数均线差的再平滑。<\/li>\n<li>背离必须定义摆动点和比较窗口。<\/li>\n<li>增加同源指标不等于增加独立信息。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为“顶背离”写出完全机械的定义，并在看不到未来数据的逐日循环中标记信号。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第032讲 布林带突破：统计学在交易中的漂亮应用<\/strong>。<\/p>"}, {"n": 32, "title": "布林带突破：统计学在交易中的漂亮应用", "html": "<h1>第032讲 布林带突破：统计学在交易中的漂亮应用<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解布林带的中心与尺度。<\/li>\n<li>区分突破和均值回归两种相反用法。<\/li>\n<li>处理滚动估计与波动变化。<\/li>\n<\/ul>\n<h2>布林带公式<\/h2>\n<p>中心常为 (N) 日均线，上下轨为：<\/p>\n<p>[\nUpper=MA_N+k\\sigma_N,\\quad Lower=MA_N-k\\sigma_N\n]<\/p>\n<p>它把价格偏离转换为相对近期波动的尺度，但滚动收益并非正态，(k) 倍标准差不应被机械解释为固定概率。<\/p>\n<h2>两种相反逻辑<\/h2>\n<p><strong>突破策略<\/strong>认为穿越上轨代表趋势增强；<strong>均值回归策略<\/strong>认为偏离过大后会回归中心。两者都可能合理，关键是资产机制、持有期和过滤条件。<\/p>\n<h2>波带宽度<\/h2>\n<p>((Upper-Lower)/MA) 可描述近期波动。先收窄后扩张常用于寻找波动爆发，但必须定义分位阈值和确认时点。<\/p>\n<h2>常见错误<\/h2>\n<p>用当日完整高低价触发后仍假设轨道固定、忽略跳空成交、同时用未来窗口计算标准差，都会美化结果。滚动指标只能使用当时历史。<\/p>\n<h2>验证<\/h2>\n<p>分别测试趋势和回归版本，比较其在上涨、震荡和危机阶段的收益来源，不要只在图上挑“有效”案例。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“布林带突破：统计学在交易中的漂亮应用”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>布林带是移动中心加滚动波动尺度。<\/li>\n<li>上轨突破既可解释为趋势，也可解释为过度偏离。<\/li>\n<li>概率含义、时点和成交必须谨慎。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>实现一个突破版与一个回归版布林策略，使用相同数据和成本比较环境依赖。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第033讲 唐奇安通道与海龟交易法则（上）——入市系统<\/strong>。<\/p>"}, {"n": 33, "title": "唐奇安通道与海龟交易法则（上）——入市系统", "html": "<h1>第033讲 唐奇安通道与海龟交易法则（上）——入市系统<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解唐奇安通道与海龟入市逻辑。<\/li>\n<li>掌握突破信号的无未来实现。<\/li>\n<li>认识多市场趋势分散的价值。<\/li>\n<\/ul>\n<h2>唐奇安通道<\/h2>\n<p>过去 (N) 期最高与最低构成通道。向上突破过去高点做多，向下突破过去低点做空或退出。计算时必须对窗口滞后一位，否则把当日新高同时当作已知门槛。<\/p>\n<h2>海龟系统的核心<\/h2>\n<p>经典海龟思想不是一个神奇参数，而是完整规则：多市场扫描、通道突破入场、按波动定仓、顺势加仓和明确退出。它接受频繁小亏，以捕捉少数跨期大趋势。<\/p>\n<h2>入市系统<\/h2>\n<p>研究版可定义：当价格突破前 20 日高点入场，跌破较短退出通道离场；更长窗口提供另一套慢速系统。具体数字应作为历史案例学习，不能直接视为今日最优。<\/p>\n<h2>假突破<\/h2>\n<p>突破后迅速回落是策略成本的一部分。可使用缓冲、收盘确认或趋势强度过滤，但过滤越多越容易过拟合。<\/p>\n<h2>组合视角<\/h2>\n<p>单一市场趋势不连续，多商品、多股指和多利率品种组合能让机会来源更分散。真正优势常来自组合与仓位，而不只是入场点。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“唐奇安通道与海龟交易法则（上）——入市系统”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>唐奇安通道用历史高低点定义突破。<\/li>\n<li>海龟是一套含组合、仓位和退出的系统。<\/li>\n<li>假突破无法消除，应由风险预算和多市场分散管理。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>用滞后通道实现 20 日突破，检查每个信号门槛是否只含前一日及更早数据。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第034讲 海龟交易法则（下）——头寸规模与止损的哲学<\/strong>。<\/p>"}, {"n": 34, "title": "海龟交易法则（下）——头寸规模与止损的哲学", "html": "<h1>第034讲 海龟交易法则（下）——头寸规模与止损的哲学<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解 ATR 风险单位和头寸规模。<\/li>\n<li>掌握加仓、止损与组合上限的关系。<\/li>\n<li>认识生存性比单次预测更重要。<\/li>\n<\/ul>\n<h2>波动单位<\/h2>\n<p>真实波幅取当日高低、前收与当日高、前收与当日低三者绝对差的最大值，ATR 是其滚动平均。海龟体系常用类似 (N) 的波动单位统一不同市场风险。<\/p>\n<h2>按风险定仓<\/h2>\n<p>若单笔允许风险预算为 (B)，止损距离为 (d)，每点价值为 (v)，合约数量近似：<\/p>\n<p>[\nQty=\\frac{B}{d\\times v}\n]<\/p>\n<p>波动上升时仓位下降，让不同品种的潜在损失更可比。<\/p>\n<h2>顺势加仓<\/h2>\n<p>只有价格按有利方向移动才增加单位，且总单位受限。加仓是把风险放到已被市场验证的方向，不是亏损摊平。<\/p>\n<h2>止损哲学<\/h2>\n<p>止损不是预测失败后的羞辱，而是把单次错误限制在组合可承受范围。跳空和流动性会让实际损失超过止损价，因此还需组合杠杆与极端情景限制。<\/p>\n<h2>相关市场上限<\/h2>\n<p>同时持有多个高度相关品种可能重复下注。仓位规则应从单品种扩展到相关组和总组合风险。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“海龟交易法则（下）——头寸规模与止损的哲学”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>波动调整让不同资产的风险单位可比较。<\/li>\n<li>顺势加仓与亏损摊平方向相反。<\/li>\n<li>止损价不是损失保证，组合与跳空风险仍需约束。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>设组合资金 100 万、单笔风险 0.5%、ATR 止损距离 4 元、每点价值 100 元，计算理论数量并讨论取整与跳空。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：<strong>第035讲 动量策略：追涨杀跌凭什么能赚钱？<\/strong>。<\/p>"}, {"n": 35, "title": "动量策略：追涨杀跌凭什么能赚钱？", "html": "<h1>第035讲 动量策略：追涨杀跌凭什么能赚钱？<\/h1>\n<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解时间序列和横截面动量。<\/li>\n<li>解释动量收益与崩溃风险。<\/li>\n<li>构建含成本和风险控制的基线。<\/li>\n<\/ul>\n<h2>两类动量<\/h2>\n<p>时间序列动量判断单一资产过去收益是否为正；横截面动量在同一时点比较多个资产，买强卖弱或只持有强者。<\/p>\n<p>常见信号可用过去 (J) 期累计收益率，并跳过最近短窗口以减少短期反转影响。窗口与跳过期必须在研究前定义。<\/p>\n<h2>为什么可能有效<\/h2>\n<p>信息缓慢扩散、投资者反应不足、资金流延续和风险溢价都可能产生趋势。但解释并不唯一，规律也会随拥挤和成本变化。<\/p>\n<h2>动量崩溃<\/h2>\n<p>在剧烈反转中，过去输家可能快速反弹、赢家快速下跌，导致集中损失。动量组合还常暴露于行业、规模和市场方向。<\/p>\n<h2>风险控制<\/h2>\n<p>采用波动率目标、行业中性、持仓上限、分散资产和较缓慢换手率。不要只报告多头赢家组合，要说明基准与暴露。<\/p>\n<h2>最小基线<\/h2>\n<p>定义时点股票池，按过去收益率排序分组，下一期持有，计入换手率和交易成本，并做样本外及参数邻域检查。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“动量策略：追涨杀跌凭什么能赚钱？”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>时间序列动量看自身趋势，横截面动量比较相对强弱。<\/li>\n<li>动量可能长期有效，但会在快速反转中集中受损。<\/li>\n<li>行业暴露、成本和风险目标必须纳入基线。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>构建 12 个月动量、跳过最近 1 个月的横截面分组，比较行业中性前后结果。<\/p>\n<h2>下期预告<\/h2>\n<p>下一讲：
