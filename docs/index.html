8 天和 20 天却明显失效；另一组窗口 45—60 天表现略低，但方向一致、成本后仍为正。前者像一根孤立尖峰，更可能捕捉到样本巧合；后者像一片高原，更符合机制在近邻参数下连续变化的预期。<\/p>\n<p>稳定高原也不能证明未来有效，但它降低了策略依赖精确数字的程度。参数热图应展示完整搜索区域，而不是只报告最佳点。<\/p>\n<h2>给研究自由度设预算<\/h2>\n<p>在实验前写下假设、候选特征、参数范围、主要指标和失败条件，并限制本轮可尝试的版本数量。每次运行都登记代码版本、数据版本、配置、结果和继续研究的理由。这样才能区分事前假设与事后解释。<\/p>\n<p>简化策略时优先删除缺乏机制依据、只在局部样本有效或对净收益贡献很小的规则。复杂度预算不是禁止创新，而是要求每增加一个自由度，都要带来可解释且可复现的增量证据。<\/p>\n<h2>最终测试只能承担一次裁决<\/h2>\n<p>模型在训练集估计、在验证集选择，锁定后才进入最终测试。若看到测试结果后调整阈值、删除亏损年份或更换指标，再次运行的已不是真正样本外结果。此时应诚实地把该区间纳入开发记录，并寻找新的、尚未参与决策的数据或等待前向实盘验证。<\/p>\n<h2>回测审计：让好结果经得起追问<\/h2>\n<p>用“过拟合的魔咒：参数越多，死得越快”做一次回测审计。审计目标不是让收益率更高，而是确认历史模拟没有偷看未来、遗漏成本或把调参结果当成独立证据。<\/p>\n<ol>\n<li>画出数据、信号、订单、成交、持仓和收益记账的时间线。<\/li>\n<li>核对股票池、公司行动、退市样本、停牌涨跌停和成交量约束。<\/li>\n<li>把开发、验证和最终测试分开，并记录每次参数与规则变更。<\/li>\n<li>报告基准、成本后收益、回撤、换手、暴露、容量和稳健性，而不只报告年化收益率。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://papers.ssrn.com/sol3/papers.cfm?abstract_id=2326253\">Bailey 等：The Probability of Backtest Overfitting<\/a>：多重试验与回测过拟合的量化框架。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://scikit-learn.org/stable/common_pitfalls.html\">scikit-learn：Common pitfalls<\/a>：数据泄漏与训练、测试隔离。<\/li>\n<li><strong>适用条件与边界<\/strong>：回测只检验指定数据、规则和成交模型；反复查看测试集会把它变成训练集。<\/li>\n<li><strong>主要失败模式<\/strong>：前视、幸存者偏差、多重试验、理想成交与选择性报告共同制造虚假确定性。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>反复查看测试集后仍称其为样本外；测试集一旦参与决策就已被污染。<\/li>\n<li>用理想价格和无限流动性成交；应建立可解释且偏保守的成交模型。<\/li>\n<li>只选择表现最好的区间、品种或参数；应披露完整实验空间和失败结果。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>时间线不存在未来信息或同价成交错误<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>股票池与公司行动采用历史时点口径<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>样本外区间未参与规则选择<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>成本、容量、暴露与压力测试结果齐全<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>过拟合来自研究自由度相对样本过高。<\/li>\n<li>简单策略也会因大量隐形试验过拟合。<\/li>\n<li>稳定区域和样本外表现优于单点最优。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>画一张策略参数热图，标记最优点周围是否存在连续稳定区域。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第070讲 样本外测试与交叉验证：给策略做压力体检<\/strong>。<\/p>"}, {"n": 70, "title": "样本外测试与交叉验证：给策略做压力体检", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。回测不能保证未来表现。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>区分训练、验证和最终样本外。<\/li>\n<li>理解时间序列交叉验证的特殊性。<\/li>\n<li>避免重叠标签和反复查看测试集。<\/li>\n<\/ul>\n<h2>样本外的职责<\/h2>\n<p>训练集用于估计，验证集用于选择，最终测试集只用于一次独立评估。若看完测试结果再改模型，测试集就已经变成训练资料。<\/p>\n<h2>时间不能随机打乱<\/h2>\n<p>金融数据有顺序和状态变化。随机 K 折会把未来环境混入过去。更合理的是扩展窗口或滚动窗口：用过去训练，在随后时期验证，再向前移动。<\/p>\n<h2>重叠标签<\/h2>\n<p>若标签使用未来 20 日收益，相邻样本共享未来区间。训练和验证边界需留出隔离期；purge 与 embargo 思想用于减少信息重叠。<\/p>\n<h2>模型选择<\/h2>\n<p>先在多个滚动折中比较稳定性，再锁定规则，最后运行保留测试。报告各折分布而不是只给拼接平均。<\/p>\n<h2>仍然无法保证未来<\/h2>\n<p>样本外只是降低研究者直接拟合该区间的程度；若所有时期都属于同一制度，真正未来仍可能不同。压力测试与经济解释仍需要。<\/p>\n<h2>三个数据区间，三种职责<\/h2>\n<ul>\n<li><strong>训练集<\/strong>用于估计参数、拟合预处理器和学习模型。<\/li>\n<li><strong>验证集<\/strong>用于比较方案、选择参数和决定是否继续研究。<\/li>\n<li><strong>最终测试集<\/strong>用于在规则冻结后做一次独立评估。<\/li>\n<\/ul>\n<p>职责必须按信息流区分，而不只是给日期贴标签。只要某个区间的结果影响了模型选择，它就是开发信息；即使文件名仍叫 test，也不再具备最终测试的独立性。<\/p>\n<h2>扩展窗口与滚动窗口<\/h2>\n<p>扩展窗口每次保留全部旧数据，例如用第 1—3 年训练、第 4 年验证，再用第 1—4 年训练、第 5 年验证。它适合认为旧样本仍有价值、希望训练量逐步增加的场景。<\/p>\n<p>滚动窗口只保留最近一段历史，例如每次用过去三年训练、下一季度验证。它更强调适应状态变化，但样本更少、估计波动更大。窗口长度应由策略持有期、数据量和机制变化速度共同决定，不能只凭哪个回测更漂亮。<\/p>\n<h2>为什么边界要留空<\/h2>\n<p>假设样本标签是未来 20 个交易日收益。训练集最后一天的标签会使用之后 20 天的价格；若验证集紧接着开始，训练标签已经“看见”验证区间。此时需要在边界剔除会发生重叠的训练样本，并可设置额外隔离期，避免相邻持仓和特征窗口共享过多信息。<\/p>\n<p>隔离长度不是固定常数，应至少覆盖标签前瞻期，并结合持有期、特征窗口和订单延迟检查。高频或路径依赖策略还需审查事件之间的相关性。<\/p>\n<h2>一个完整的走步验证流程<\/h2>\n<ol>\n<li>预先确定每折训练期、验证期和隔离期。<\/li>\n<li>只用当折训练数据拟合缺失值、标准化、特征选择和模型。<\/li>\n<li>冻结这一折的参数，在随后验证期顺序执行并计入成本。<\/li>\n<li>记录各折收益、回撤、换手和暴露，不只拼接一条曲线。<\/li>\n<li>用各折结果选择规则，锁定后再运行一次最终保留集。<\/li>\n<\/ol>\n<p>若最终测试未通过，应记录失败并回到新一轮研究，而不是在同一测试集上不断修补直到通过。<\/p>\n<h2>回测审计：让好结果经得起追问<\/h2>\n<p>用“样本外测试与交叉验证：给策略做压力体检”做一次回测审计。审计目标不是让收益率更高，而是确认历史模拟没有偷看未来、遗漏成本或把调参结果当成独立证据。<\/p>\n<ol>\n<li>画出数据、信号、订单、成交、持仓和收益记账的时间线。<\/li>\n<li>核对股票池、公司行动、退市样本、停牌涨跌停和成交量约束。<\/li>\n<li>把开发、验证和最终测试分开，并记录每次参数与规则变更。<\/li>\n<li>报告基准、成本后收益、回撤、换手、暴露、容量和稳健性，而不只报告年化收益率。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://scikit-learn.org/stable/modules/generated/sklearn.model_selection.TimeSeriesSplit.html\">scikit-learn：TimeSeriesSplit<\/a>：保持时间顺序的验证切分。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://papers.ssrn.com/sol3/papers.cfm?abstract_id=2326253\">Bailey 等：The Probability of Backtest Overfitting<\/a>：多重试验与回测过拟合的量化框架。<\/li>\n<li><strong>适用条件与边界<\/strong>：回测只检验指定数据、规则和成交模型；反复查看测试集会把它变成训练集。<\/li>\n<li><strong>主要失败模式<\/strong>：前视、幸存者偏差、多重试验、理想成交与选择性报告共同制造虚假确定性。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>反复查看测试集后仍称其为样本外；测试集一旦参与决策就已被污染。<\/li>\n<li>用理想价格和无限流动性成交；应建立可解释且偏保守的成交模型。<\/li>\n<li>只选择表现最好的区间、品种或参数；应披露完整实验空间和失败结果。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>时间线不存在未来信息或同价成交错误<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>股票池与公司行动采用历史时点口径<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>样本外区间未参与规则选择<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>成本、容量、暴露与压力测试结果齐全<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>最终测试集不能被反复用于改模型。<\/li>\n<li>时间序列应使用滚动或扩展窗口验证。<\/li>\n<li>重叠标签需要隔离训练与验证边界。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为一个使用未来 20 日收益标签的模型设计三折滚动验证，并标出 purge 区间。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第071讲 稳健性检验：换个品种、换个时段，策略还灵吗？<\/strong>。<\/p>"}, {"n": 71, "title": "稳健性检验：换个品种、换个时段，策略还灵吗？", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。回测不能保证未来表现。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>掌握参数、时间、资产、成本和数据稳健性检验。<\/li>\n<li>区分稳健与平均化问题。<\/li>\n<li>形成策略上线前的证据矩阵。<\/li>\n<\/ul>\n<h2>稳健性问什么<\/h2>\n<p>它不要求策略在所有地方都赚钱，而是检查优势是否依赖一个脆弱巧合。每项检验都应与策略机制有关。<\/p>\n<h2>五类检验<\/h2>\n<ol>\n<li><strong>参数扰动<\/strong>：窗口、阈值轻微变化。<\/li>\n<li><strong>时间切片<\/strong>：牛熊、危机、平静和不同年代。<\/li>\n<li><strong>资产迁移<\/strong>：相似市场或品种是否有同方向证据。<\/li>\n<li><strong>成本压力<\/strong>：显性交易费用、滑点和延迟翻倍。<\/li>\n<li><strong>数据口径<\/strong>：供应商、复权和异常处理变化。<\/li>\n<\/ol>\n<h2>结果如何解释<\/h2>\n<p>若只有精确参数有效，可能过拟合；若只在一个资产有效，可能是特定机制，也可能偶然。稳健性不是要求每格绿色，而是要求失败模式与经济逻辑一致且风险可承受。<\/p>\n<h2>证据矩阵<\/h2>\n<p>为每个版本记录收益、回撤、换手率、暴露和交易数，禁止只保留最好结果。把“通过标准”在测试前写下。<\/p>\n<h2>上线决策<\/h2>\n<p>上线依据应是多维证据：逻辑合理、数据可靠、样本外可接受、成本后为正、压力下可生存、监控可实现。<\/p>\n<h2>稳健不是“所有格子都绿色”<\/h2>\n<p>真正要检验的是：当输入发生合理变化时，策略机制是否仍能产生可解释的结果。如果一个趋势策略在持续单边市场有效、在剧烈震荡期亏损，这种失败可能与机制一致；如果它只在某一年、某一参数和某一数据供应商下有效，就更像样本巧合。<\/p>\n<p>因此，测试前应先写预期：哪些扰动不应改变方向，哪些环境本来就是弱项，损失上限在哪里。没有事前预期，研究者很容易在结果出来后为任何失败寻找理由。<\/p>\n<h2>从近到远设计压力测试<\/h2>\n<p>稳健性检验可以按距离逐层推进：<\/p>\n<ol>\n<li><strong>实现扰动<\/strong>：修改复权、缺失值、成交价和订单延迟。<\/li>\n<li><strong>参数邻域<\/strong>：在合理范围内移动窗口、阈值和调仓频率。<\/li>\n<li><strong>成本与容量<\/strong>：提高费用、滑点和冲击，限制成交量占比。<\/li>\n<li><strong>时间与状态<\/strong>：分别观察上涨、下跌、震荡、高波动和低流动性时期。<\/li>\n<li><strong>资产迁移<\/strong>：在机制相似但未参与开发的品种或市场中验证方向。<\/li>\n<\/ol>\n<p>前几层失败通常说明实现或参数脆弱；后几层失败需要结合经济机制判断，不能机械要求所有市场都盈利。<\/p>\n<h2>证据矩阵怎样读<\/h2>\n<p>矩阵的行是测试场景，列至少包括净收益、最大回撤、换手、交易数、主要暴露和失败原因。除了数值，还应标记“符合预期”“需要解释”“否决上线”三类结论。<\/p>\n<p>特别警惕三种图形：只有单一参数点突出、收益由一两笔交易贡献、成本稍升就由正转负。相反，多个邻近参数方向一致、收益来自足够多独立交易、压力下虽下降但仍可生存，证据相对更强。<\/p>\n<h2>把稳健性变成上线门槛<\/h2>\n<p>上线前预先定义最低条件，例如样本外方向成立、压力成本下不触及风险预算、最大回撤可承受、容量覆盖目标资金、关键失败环境有监控与降仓规则。条件应对应团队真正能承受的风险，而不是为了让历史结果过关临时设置。<\/p>\n<p>稳健性检验的最终产物不是一张“通过证书”，而是一份策略使用说明书：优势依赖什么、何时可能失效、出现哪些信号必须复核或停用。<\/p>\n<h2>回测审计：让好结果经得起追问<\/h2>\n<p>用“稳健性检验：换个品种、换个时段，策略还灵吗？”做一次回测审计。审计目标不是让收益率更高，而是确认历史模拟没有偷看未来、遗漏成本或把调参结果当成独立证据。<\/p>\n<ol>\n<li>画出数据、信号、订单、成交、持仓和收益记账的时间线。<\/li>\n<li>核对股票池、公司行动、退市样本、停牌涨跌停和成交量约束。<\/li>\n<li>把开发、验证和最终测试分开，并记录每次参数与规则变更。<\/li>\n<li>报告基准、成本后收益、回撤、换手、暴露、容量和稳健性，而不只报告年化收益率。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://papers.ssrn.com/sol3/papers.cfm?abstract_id=2326253\">Bailey 等：The Probability of Backtest Overfitting<\/a>：多重试验与回测过拟合的量化框架。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://scikit-learn.org/stable/modules/generated/sklearn.model_selection.TimeSeriesSplit.html\">scikit-learn：TimeSeriesSplit<\/a>：保持时间顺序的验证切分。<\/li>\n<li><strong>适用条件与边界<\/strong>：回测只检验指定数据、规则和成交模型；反复查看测试集会把它变成训练集。<\/li>\n<li><strong>主要失败模式<\/strong>：前视、幸存者偏差、多重试验、理想成交与选择性报告共同制造虚假确定性。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>反复查看测试集后仍称其为样本外；测试集一旦参与决策就已被污染。<\/li>\n<li>用理想价格和无限流动性成交；应建立可解释且偏保守的成交模型。<\/li>\n<li>只选择表现最好的区间、品种或参数；应披露完整实验空间和失败结果。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>时间线不存在未来信息或同价成交错误<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>股票池与公司行动采用历史时点口径<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>样本外区间未参与规则选择<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>成本、容量、暴露与压力测试结果齐全<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>稳健性检验寻找对合理扰动不敏感的证据。<\/li>\n<li>失败并非一律否决，关键是是否符合机制与风险预算。<\/li>\n<li>上线应基于证据矩阵而非单一绩效。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为自己的策略建立五类稳健性测试表，并在运行前写下通过阈值。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第072讲 仓位管理的数学：凯利公式与最优投注比例<\/strong>。<\/p>"}]}, {"no": 7, "name": "风控·活着才有输出", "desc": "资金管理和风控是量化的生命线，这一模块教你把底线思维写入策略。", "chapters": [{"n": 72, "title": "仓位管理的数学：凯利公式与最优投注比例", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。风控指标与阈值需结合资产、流动性和个人承受能力验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解仓位决定优势能否存活。<\/li>\n<li>掌握凯利公式的直觉与估计风险。<\/li>\n<li>用分数凯利和风险预算控制不确定性。<\/li>\n<\/ul>\n<h2>正期望不等于可以重仓<\/h2>\n<p>仓位过小，优势难以贡献；仓位过大，正常波动也可能导致永久损失。资金管理是在增长速度和生存概率之间取舍。<\/p>\n<h2>凯利公式<\/h2>\n<p>对胜率 (p)、赔率净收益倍数 (b)、失败概率 (q=1-p) 的重复下注，凯利比例为：<\/p>\n<p>[\nf^*=\\frac{bp-q}{b}\n]<\/p>\n<p>连续近似中常见 (f^*\\approx\\mu/\\sigma^2)。它最大化长期对数财富增长，但依赖概率和分布估计准确。<\/p>\n<h2>为什么实务常用分数凯利<\/h2>\n<p>胜率、相关性和尾部都可能被低估。使用半凯利或更低比例会牺牲部分理论增长，显著降低波动与模型误差伤害。<\/p>\n<h2>从单笔到组合<\/h2>\n<p>多个信号相关时不能分别满额使用凯利，否则重复计算优势。应基于组合协方差、杠杆和风险预算联合定仓。<\/p>\n<h2>硬约束<\/h2>\n<p>无论公式结果多高，都要设置单资产、策略、流动性、杠杆和压力损失上限。凯利是理解仓位的工具，不是自动下注按钮。<\/p>\n<h2>凯利公式到底在权衡什么<\/h2>\n<p>凯利追求的不是单次收益最高，而是让长期财富的对数增长率最大。原因在于亏损和盈利并不对称：亏损 50% 后，需要盈利 100% 才能回到原点。仓位越大，顺利时增长越快，但连续亏损造成的财富折损也会急剧放大。<\/p>\n<p>在二项下注模型中，(b) 是赢一次相对本金获得的净收益倍数，(p) 是获胜概率，(q=1-p)。只有 (bp-q&gt;0) 时，公式才给出正仓位；若优势为负，正确结论不是“少买一点”，而是不参与。若公式结果超过现实可用仓位，还必须服从杠杆、流动性和集中度约束。<\/p>\n<h2>教学案例：55% 胜率并不支持满仓<\/h2>\n<p>假设每次盈利或亏损的幅度相同，即 (b=1)，估计胜率 (p=55\\%)。则：<\/p>\n<p>[\nf^*=2p-1=10\\%\n]<\/p>\n<p>这里的 10% 是该理想模型下的凯利下注比例，不是“胜率超过一半就可以全仓”。若连续亏损十次，按 10% 比例下注后财富约剩 (0.9^{10}\\approx34.9\\%)；采用半凯利 5% 时约剩 (0.95^{10}\\approx59.9\\%)。这是教学计算，尚未考虑胜率估计错误、跳空和交易相关性，却已经显示仓位对生存的影响。<\/p>\n<h2>为什么参数误差会放大<\/h2>\n<p>真实交易中的 (p) 和 (b) 不是已知常数，而是用有限历史估计。把胜率从 55% 误估为 60%，同赔率下凯利比例会从 10% 变成 20%；一个看似很小的估计误差让仓位翻倍。若市场状态改变、亏损有厚尾或多笔交易同时失效，偏差还会更大。<\/p>\n<p>因此实务上可把计算拆成两步：先用保守估计得到理论凯利，再乘以分数系数；随后取它与单笔风险、组合风险、容量和杠杆上限中的最小值。分数凯利不是固定答案，而是给估计不确定性留安全垫。<\/p>\n<h2>从止损距离反推头寸<\/h2>\n<p>另一种更直接的定仓方式是先规定单笔最多承受的账户损失，再除以入场价到止损价的风险金额：<\/p>\n<p>[\n\\text{头寸数量}=\\frac{\\text{账户净值}\\times\\text{单笔风险比例}}{\\text{每单位入场价}-\\text{每单位止损价}}\n]<\/p>\n<p>计算后仍要加入跳空缓冲、费用和最小交易单位。若多个头寸受同一因子驱动，还要在组合层合并风险，不能把每笔“1% 风险”简单视为彼此独立。<\/p>\n<h2>可执行的仓位决策顺序<\/h2>\n<p>先判断策略是否具有正的、可解释的期望，再评估估计误差；随后计算分数凯利或风险预算头寸，最后施加集中度、流动性、杠杆和压力损失硬上限。最终仓位应由最严格的约束决定，并记录是哪一条约束真正生效。<\/p>\n<h2>风险预案：触发之后具体做什么<\/h2>\n<p>围绕“仓位管理的数学：凯利公式与最优投注比例”写一份可执行的风险预案。风险指标只有绑定阈值、权限、动作和恢复条件，才能从报告上的数字变成真正的控制。<\/p>\n<ol>\n<li>定义风险对象、计算窗口、更新频率、阈值和数据依赖。<\/li>\n<li>设置预警、降仓、停止开仓和紧急平仓等分级动作，并明确授权人。<\/li>\n<li>加入相关性上升、流动性消失、价格跳空和模型失效等非历史常态情景。<\/li>\n<li>规定事件记录、复盘、重新启用条件与人工覆盖流程。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://optimization-online.org/wp-content/uploads/2012/08/3574.pdf\">Rockafellar–Uryasev CVaR 研究入口<\/a>：CVaR 定义及其优化形式。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.bis.org/publications/201901-standards-minimum-capital-requirements-market-risk\">BIS：Minimum capital requirements for market risk<\/a>：压力期预期损失、回测与流动性期限。<\/li>\n<li><strong>适用条件与边界<\/strong>：风险度量依赖分布、期限和流动性；正常时期相关性不能代表压力时期联动。<\/li>\n<li><strong>主要失败模式<\/strong>：把 VaR 当最大损失、用满凯利、按收盘价假设无限流动性，或只控制单笔而忽略组合暴露。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>把历史波动率当成全部风险；尾部、流动性和操作风险需要单独处理。<\/li>\n<li>只有止损阈值，没有成交与恢复方案；极端市场里订单可能无法按预期成交。<\/li>\n<li>风险规则频繁临时修改；任何人工覆盖都应授权、留痕并事后复盘。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>指标、阈值、动作和负责人一一对应<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少覆盖一个历史未充分出现的压力情景<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>组合级风险与单资产风险均有限额<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>暂停、恢复和人工覆盖流程可审计<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>仓位连接统计优势与破产风险。<\/li>\n<li>凯利最大化理想条件下的长期对数增长。<\/li>\n<li>估计误差和尾部使分数凯利更现实。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>设胜率 55%、赢赚 1、输亏 1，计算凯利、半凯利，并比较连续十次亏损后的资金影响。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第073讲 止损的艺术：固定止损、吊灯止损、移动止损<\/strong>。<\/p>"}, {"n": 73, "title": "止损的艺术：固定止损、吊灯止损、移动止损", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。风控指标与阈值需结合资产、流动性和个人承受能力验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>区分固定、波动、吊灯和移动止损。<\/li>\n<li>理解止损对收益分布和交易成本的影响。<\/li>\n<li>设计可成交且不与策略逻辑冲突的退出。<\/li>\n<\/ul>\n<h2>止损不是万能保险<\/h2>\n<p>止损在价格不利时退出，限制单次暴露并释放资金，但跳空和流动性会让实际成交差于止损价。它控制规则内风险，不保证最大损失。<\/p>\n<h2>四类止损<\/h2>\n<ul>\n<li><strong>固定比例<\/strong>：相对入场价下跌一定比例，简单但忽略波动差异。<\/li>\n<li><strong>波动止损<\/strong>：以 ATR 或波动倍数设距离，更适配资产状态。<\/li>\n<li><strong>吊灯止损<\/strong>：从持仓后最高价减去若干 ATR，保护趋势利润。<\/li>\n<li><strong>移动止损<\/strong>：止损只沿有利方向移动，不向亏损方向放宽。<\/li>\n<\/ul>\n<h2>止损与策略类型<\/h2>\n<p>趋势策略常需要较宽止损容忍噪声，均值回归策略若偏离继续扩大，可能说明机制破坏。止损应反映假设何时失效，而非只选择历史最好参数。<\/p>\n<h2>回测要求<\/h2>\n<p>明确触发使用高低价还是收盘、跳空成交规则、盘内多个事件顺序和交易成本。日线无法准确模拟复杂盘中止损，应采用保守假设。<\/p>\n<h2>评价<\/h2>\n<p>比较止损前后的尾部、平均亏损、换手率、错过反弹和总收益。降低最大回撤可能以更高频小亏为代价。<\/p>\n<h2>止损首先是一条“假设失效规则”<\/h2>\n<p>好的止损不是因为“跌得难受”，而是因为价格路径已经使原交易假设不再成立。趋势策略买入后若价格持续跌破波动调整后的结构位，趋势假设可能失效；均值回归策略若价差继续扩张且基本关系发生变化，继续等待回归可能是在承担新风险。<\/p>\n<p>先写清楚入场理由，再问什么可观察证据会推翻它。止损价只是把这个证据翻译成订单的方式。如果无法说出止损保护的是什么风险，就容易在回测中挑出一个偶然最优百分比。<\/p>\n<h2>止损距离与仓位必须一起设计<\/h2>\n<p>账户愿意承受的单笔损失、止损距离和持仓数量构成一个三角关系。止损放得更宽而仓位不变，账户风险会上升；若希望单笔风险不变，就必须相应缩小头寸。反过来，把止损机械收窄并不会免费降低风险，它可能增加噪声触发和重复交易成本。<\/p>\n<p>例如，教学上假设账户允许某笔交易最多损失 1000 元，每股入场价与计划止损价相差 2 元，则忽略跳空和费用时头寸上限为 500 股。若波动上升使合理止损距离扩大到 4 元，头寸应降到 250 股，而不是仍买 500 股。<\/p>\n<h2>触发价不等于成交价<\/h2>\n<p>止损单通常包含两个事件：价格达到触发条件，以及订单进入市场成交。隔夜跳空时，市场可能直接越过触发价；跌停、停牌或流动性枯竭时，订单甚至无法及时成交。因此“止损 8%”不等于“最大只亏 8%”。<\/p>\n<p>风控预案至少要规定：使用盘中价还是收盘价触发、触发后下何种订单、允许多少滑点、未成交如何重报，以及极端情况下由谁人工处理。止损控制的是行动规则，不是对市场成交的承诺。<\/p>\n<h2>日线回测的盘内歧义<\/h2>\n<p>若一根日 K 线同时触及止盈价和止损价，仅凭开高低收通常无法知道先后顺序。选择有利顺序会系统性美化结果。可采用更高频数据重放，或在数据不足时使用保守顺序，并把两种顺序的差异作为模型风险报告。<\/p>\n<p>移动止损还要避免使用当天最高价更新止损后，再假设当天较早时刻按新止损成交。更新、触发和成交必须遵守明确的盘内时间顺序。<\/p>\n<h2>怎样判断止损是否有价值<\/h2>\n<p>将无止损版本作为基准，对比净收益、最大和平均亏损、尾部损失、最大回撤、换手、滑点、被止损后快速反弹的比例以及资金占用时间。若止损只是把少数大亏变成大量小亏，成本后总风险未下降，就不能仅凭“胜率提高”判定有效。<\/p>\n<h2>风险预案：触发之后具体做什么<\/h2>\n<p>围绕“止损的艺术：固定止损、吊灯止损、移动止损”写一份可执行的风险预案。风险指标只有绑定阈值、权限、动作和恢复条件，才能从报告上的数字变成真正的控制。<\/p>\n<ol>\n<li>定义风险对象、计算窗口、更新频率、阈值和数据依赖。<\/li>\n<li>设置预警、降仓、停止开仓和紧急平仓等分级动作，并明确授权人。<\/li>\n<li>加入相关性上升、流动性消失、价格跳空和模型失效等非历史常态情景。<\/li>\n<li>规定事件记录、复盘、重新启用条件与人工覆盖流程。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://optimization-online.org/wp-content/uploads/2012/08/3574.pdf\">Rockafellar–Uryasev CVaR 研究入口<\/a>：CVaR 定义及其优化形式。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.bis.org/publications/201901-standards-minimum-capital-requirements-market-risk\">BIS：Minimum capital requirements for market risk<\/a>：压力期预期损失、回测与流动性期限。<\/li>\n<li><strong>适用条件与边界<\/strong>：风险度量依赖分布、期限和流动性；正常时期相关性不能代表压力时期联动。<\/li>\n<li><strong>主要失败模式<\/strong>：把 VaR 当最大损失、用满凯利、按收盘价假设无限流动性，或只控制单笔而忽略组合暴露。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>把历史波动率当成全部风险；尾部、流动性和操作风险需要单独处理。<\/li>\n<li>只有止损阈值，没有成交与恢复方案；极端市场里订单可能无法按预期成交。<\/li>\n<li>风险规则频繁临时修改；任何人工覆盖都应授权、留痕并事后复盘。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>指标、阈值、动作和负责人一一对应<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少覆盖一个历史未充分出现的压力情景<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>组合级风险与单资产风险均有限额<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>暂停、恢复和人工覆盖流程可审计<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>止损限制暴露，但不能保证成交价。<\/li>\n<li>止损类型应与资产波动和策略机制匹配。<\/li>\n<li>评价需同时看尾部、换手率和机会成本。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为同一趋势策略测试固定 8% 与 3×ATR 吊灯止损，比较不同波动阶段。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第074讲 组合风险：相关性怎样左右你账户的最大回撤？<\/strong>。<\/p>"}, {"n": 74, "title": "组合风险：相关性怎样左右你账户的最大回撤？", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。风控指标与阈值需结合资产、流动性和个人承受能力验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解相关性如何进入组合损失。<\/li>\n<li>从权重转向边际风险贡献。<\/li>\n<li>管理危机中的相关上升。<\/li>\n<\/ul>\n<h2>最大持仓不等于最大风险<\/h2>\n<p>一只高波资产 5% 权重可能比一只低波资产 20% 权重贡献更多风险。组合方差为 (w'\\Sigma w)，权重与协方差共同决定结果。<\/p>\n<h2>边际风险贡献<\/h2>\n<p>资产对组合波动的边际影响与 (\\Sigma w) 有关。风险贡献近似为权重乘边际风险，再除以组合波动。它能揭示表面分散下的集中。<\/p>\n<h2>相关性会变<\/h2>\n<p>平静期估计的低相关，危机中可能因共同去杠杆上升。应额外计算下跌期相关、尾部共振和历史压力窗口。<\/p>\n<h2>组合回撤<\/h2>\n<p>回撤不仅由单资产风险决定，还受再平衡、杠杆和流动性影响。多个资产同时跌且无法调仓时，模型协方差会低估损失。<\/p>\n<h2>管理方法<\/h2>\n<p>设置风险贡献上限、因子与行业限制、流动性缓冲和压力损失上限；使用收缩协方差并避免过度相信短窗口。<\/p>\n<h2>两资产公式看清相关性的作用<\/h2>\n<p>对权重分别为 (w_1,w_2)，波动率为 (sigma_1,sigma_2)，相关系数为 (\nho) 的两个资产，组合方差为：<\/p>\n<p>[\n\\sigma_p^2=w_1^2\\sigma_1^2+w_2^2\\sigma_2^2+2w_1w_2\\sigma_1\\sigma_2\\rho\n]<\/p>\n<p>最后一项就是共同涨跌带来的风险。其他条件不变时，相关系数越高，分散化效果越弱。持有十只名字不同、但都受同一市场与行业因子驱动的股票，可能只是“证券数量分散”，并非风险来源分散。<\/p>\n<h2>教学推演：相关性上升会怎样<\/h2>\n<p>假设两个资产等权，年化波动率都为 20%。当相关系数为 0 时，组合波动率约为 14.1%；当相关系数升到 0.8 时，组合波动率约为 19.0%。资产和权重都没变，仅仅联动增强，组合风险就显著接近单一资产。<\/p>\n<p>这是基于稳定波动和线性相关的教学计算。真实危机中，波动、相关、流动性和杠杆往往同时恶化，损失可能超过静态公式的估计。<\/p>\n<h2>从资金权重转向风险贡献<\/h2>\n<p>风险贡献回答“组合波动的一单位变化主要由谁带来”。低波资产即使资金权重大，也可能风险贡献较小；高波或与其他头寸高度同向的资产，即使资金权重不大，也可能成为主要风险源。<\/p>\n<p>审查组合时可同时列出资金权重、独立波动、与组合相关性、边际风险贡献和压力损失贡献。若某资产资金权重 10%、风险贡献却达到组合的一大部分，管理动作应针对风险集中，而不是只盯持仓金额。<\/p>\n<h2>相关性背后的共同因子<\/h2>\n<p>历史相关系数是结果，不是原因。组合可能共同暴露于市场 Beta、利率、信用利差、美元、流动性或波动率。平静期价格相关较低，不代表这些资产在同一去杠杆冲击下不会一起下跌。<\/p>\n<p>因此除样本相关矩阵外，还应按因子分解，并计算下跌期、压力窗口和流动性折价后的相关性。对短历史或资产很多的组合，可使用收缩估计减少噪声，但不能因此忽略结构性突变。<\/p>\n<h2>回撤不是波动率的另一个名字<\/h2>\n<p>波动率描述收益离散程度，最大回撤描述从历史高点到随后低点的路径损失。相同波动率的组合，若亏损连续聚集，回撤可能截然不同。杠杆追加、保证金要求、再平衡和投资者赎回还会把价格损失转化为被迫卖出。<\/p>\n<p>组合风控应同时限制常态波动、因子与风险贡献、压力情景损失和可变现时间。只有这样才能覆盖“模型看起来分散，危机时却一起跌”的失败模式。<\/p>\n<h2>风险预案：触发之后具体做什么<\/h2>\n<p>围绕“组合风险：相关性怎样左右你账户的最大回撤？”写一份可执行的风险预案。风险指标只有绑定阈值、权限、动作和恢复条件，才能从报告上的数字变成真正的控制。<\/p>\n<ol>\n<li>定义风险对象、计算窗口、更新频率、阈值和数据依赖。<\/li>\n<li>设置预警、降仓、停止开仓和紧急平仓等分级动作，并明确授权人。<\/li>\n<li>加入相关性上升、流动性消失、价格跳空和模型失效等非历史常态情景。<\/li>\n<li>规定事件记录、复盘、重新启用条件与人工覆盖流程。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://optimization-online.org/wp-content/uploads/2012/08/3574.pdf\">Rockafellar–Uryasev CVaR 研究入口<\/a>：CVaR 定义及其优化形式。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.bis.org/publications/201901-standards-minimum-capital-requirements-market-risk\">BIS：Minimum capital requirements for market risk<\/a>：压力期预期损失、回测与流动性期限。<\/li>\n<li><strong>适用条件与边界<\/strong>：风险度量依赖分布、期限和流动性；正常时期相关性不能代表压力时期联动。<\/li>\n<li><strong>主要失败模式<\/strong>：把 VaR 当最大损失、用满凯利、按收盘价假设无限流动性，或只控制单笔而忽略组合暴露。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>把历史波动率当成全部风险；尾部、流动性和操作风险需要单独处理。<\/li>\n<li>只有止损阈值，没有成交与恢复方案；极端市场里订单可能无法按预期成交。<\/li>\n<li>风险规则频繁临时修改；任何人工覆盖都应授权、留痕并事后复盘。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>指标、阈值、动作和负责人一一对应<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少覆盖一个历史未充分出现的压力情景<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>组合级风险与单资产风险均有限额<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>暂停、恢复和人工覆盖流程可审计<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>组合风险由权重、波动和相关共同决定。<\/li>\n<li>风险贡献比持仓数量更能揭示集中。<\/li>\n<li>危机相关与流动性需要压力测试补充。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>对三资产组合计算边际风险贡献，并调整权重使最大贡献下降。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第075讲 VaR与CVaR：用数字告诉你，极端情况会亏多少<\/strong>。<\/p>"}, {"n": 75, "title": "VaR与CVaR：用数字告诉你，极端情况会亏多少", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。风控指标与阈值需结合资产、流动性和个人承受能力验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解 VaR 分位损失与 CVaR 尾部均值。<\/li>\n<li>掌握历史、参数和模拟三种估计。<\/li>\n<li>识别模型与流动性局限。<\/li>\n<\/ul>\n<h2>VaR 回答什么<\/h2>\n<p>给定持有期与置信水平，VaR 表示损失分布的某个分位阈值。例如 95% 一日 VaR 并不意味着最大损失，只表示模型下约 5% 情形会更差。<\/p>\n<h2>CVaR<\/h2>\n<p>CVaR（Expected Shortfall）是超过 VaR 后的平均损失，更关注尾部严重程度。两个组合 VaR 相同，CVaR 可能完全不同。<\/p>\n<h2>三种方法<\/h2>\n<ul>\n<li><strong>历史模拟<\/strong>：直接用历史收益，保留非正态，但受样本限制。<\/li>\n<li><strong>参数法<\/strong>：假设分布并用均值协方差估计，快速但可能低估厚尾。<\/li>\n<li><strong>蒙特卡洛<\/strong>：模拟风险因子路径，灵活但依赖模型。<\/li>\n<\/ul>\n<h2>口径<\/h2>\n<p>必须说明置信度、持有期、头寸是否动态、估值模型和数据窗口。不能随意用平方根时间把一日 VaR 扩展到长期。<\/p>\n<h2>局限<\/h2>\n<p>历史外事件、流动性冲击、非线性期权和相关性突变都可能使 VaR 失真。它应与压力测试、限额和情景分析一起使用。<\/p>\n<h2>先统一损失的符号<\/h2>\n<p>实际报告中有人把收益为负写成 VaR，也有人把损失金额写成正数，容易造成误读。本讲统一把“损失”记为正数：一日 95% VaR 为 100 万元，表示在模型、头寸和样本口径不变的条件下，约有 5% 的日子损失会超过 100 万元。它既不是最坏损失，也不是“95% 的概率绝对不会亏更多”。<\/p>\n<p>所有 VaR 数字都必须带四个标签：持有期、置信水平、估计方法和计算日期。缺少任一项，数字都无法比较。<\/p>\n<h2>历史 VaR 的排序过程<\/h2>\n<p>假设有 100 个可比的一日组合损失样本，从最严重到最轻排序。教学上，95% 历史 VaR 可理解为尾部约 5 个样本与其余样本的分界损失；CVaR 则关注越过该分界后的那些尾部损失的平均值。具体分位插值方式可能因实现而异，应在系统中固定并记录。<\/p>\n<p>例如两个组合的 95% VaR 都为 100 万元，但组合甲最坏几个样本约在 100—130 万元，组合乙却包含 500 万元损失。VaR 可能看不出差别，CVaR 会把乙更严重的尾部反映出来。<\/p>\n<h2>三种方法各自遗漏什么<\/h2>\n<p>历史模拟保留历史中的偏度和厚尾，但默认过去样本足以代表未来，并受窗口选择影响。参数法简洁且易分解风险贡献，但正态或线性假设可能掩盖尾部和期权非线性。蒙特卡洛可以模拟复杂因子与路径，却把风险转移到分布、相关结构和定价模型的设定上。<\/p>\n<p>方法之间不是简单的准确度排名。可用多种方法并行计算，把差异当作模型风险；若差异很大，应先解释假设，而不是挑对业务最有利的数字。<\/p>\n<h2>VaR 回测在检验什么<\/h2>\n<p>每天保存事前预测的 VaR，再观察下一持有期实际损失是否突破阈值。突破称为例外。例外过多说明模型可能低估风险，例外长期为零也可能意味着模型过于保守或样本不足。还要检查例外是否集中出现，因为连续突破往往提示波动状态或相关结构已经变化。<\/p>\n<p>回测只能检验历史期内的校准，不能证明下一次危机被覆盖。数据质量、头寸变化和估值误差也可能让例外统计失真。<\/p>\n<h2>从风险数字到管理动作<\/h2>\n<p>VaR 和 CVaR 应绑定风险限额、升级频率和负责人。例如接近预警线时复核数据与风险来源，突破限额时限制新增风险、评估减仓顺序，并同时运行流动性与压力情景。若减仓本身会产生市场冲击，应把冲击后的风险重新计算，不能假设仓位能瞬间无成本消失。<\/p>\n<h2>风险预案：触发之后具体做什么<\/h2>\n<p>围绕“VaR与CVaR：用数字告诉你，极端情况会亏多少”写一份可执行的风险预案。风险指标只有绑定阈值、权限、动作和恢复条件，才能从报告上的数字变成真正的控制。<\/p>\n<ol>\n<li>定义风险对象、计算窗口、更新频率、阈值和数据依赖。<\/li>\n<li>设置预警、降仓、停止开仓和紧急平仓等分级动作，并明确授权人。<\/li>\n<li>加入相关性上升、流动性消失、价格跳空和模型失效等非历史常态情景。<\/li>\n<li>规定事件记录、复盘、重新启用条件与人工覆盖流程。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://optimization-online.org/wp-content/uploads/2012/08/3574.pdf\">Rockafellar–Uryasev CVaR 研究入口<\/a>：CVaR 定义及其优化形式。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.bis.org/publications/201901-standards-minimum-capital-requirements-market-risk\">BIS：Minimum capital requirements for market risk<\/a>：压力期预期损失、回测与流动性期限。<\/li>\n<li><strong>适用条件与边界<\/strong>：风险度量依赖分布、期限和流动性；正常时期相关性不能代表压力时期联动。<\/li>\n<li><strong>主要失败模式<\/strong>：把 VaR 当最大损失、用满凯利、按收盘价假设无限流动性，或只控制单笔而忽略组合暴露。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>把历史波动率当成全部风险；尾部、流动性和操作风险需要单独处理。<\/li>\n<li>只有止损阈值，没有成交与恢复方案；极端市场里订单可能无法按预期成交。<\/li>\n<li>风险规则频繁临时修改；任何人工覆盖都应授权、留痕并事后复盘。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>指标、阈值、动作和负责人一一对应<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少覆盖一个历史未充分出现的压力情景<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>组合级风险与单资产风险均有限额<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>暂停、恢复和人工覆盖流程可审计<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>VaR 是分位阈值，不是最大亏损。<\/li>\n<li>CVaR 描述越过阈值后的平均尾部损失。<\/li>\n<li>方法选择与假设必须透明，并由压力测试补充。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>用 100 个日收益计算 95% 历史 VaR 与 CVaR，比较最坏 5 个样本。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第076讲 压力测试：模拟明天突然出现股灾的情形<\/strong>。<\/p>"}, {"n": 76, "title": "压力测试：模拟明天突然出现股灾的情形", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。风控指标与阈值需结合资产、流动性和个人承受能力验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>设计历史、假设和反向压力情景。<\/li>\n<li>把市场冲击映射为组合盈亏。<\/li>\n<li>让压力测试产生可执行预案。<\/li>\n<\/ul>\n<h2>压力测试不是预测日期<\/h2>\n<p>它问“如果极端但合理的变化发生，组合会怎样”，目的在暴露脆弱性，而非精确预测明天。<\/p>\n<h2>三类情景<\/h2>\n<ul>\n<li><strong>历史重演<\/strong>：将已知危机窗口的风险因子变化应用到当前持仓。<\/li>\n<li><strong>假设冲击<\/strong>：股票下跌、利率跳升、波动飙升、汇率变化和流动性折价联合发生。<\/li>\n<li><strong>反向压力<\/strong>：先定义不可承受损失，再寻找什么组合冲击会触发它。<\/li>\n<\/ul>\n<h2>映射方法<\/h2>\n<p>股票可按市场、行业和风格 Beta 映射；债券按久期与信用利差；期权需要重估 Delta、Gamma 和 Vega；非线性头寸不能只做一阶近似。<\/p>\n<h2>二阶效应<\/h2>\n<p>保证金上调、相关性上升、交易成本扩大和无法卖出常比首轮价格冲击更危险。压力测试应包含被迫去杠杆。<\/p>\n<h2>从结果到行动<\/h2>\n<p>为每个情景定义减仓顺序、现金缓冲、对冲工具、订单权限和负责人。只有能触发行动的压力测试才是风控工具。<\/p>\n<h2>一次压力测试的完整链条<\/h2>\n<p>压力测试不是把组合收益乘以一个跌幅。完整过程包括：冻结当前头寸快照、选择风险因子、设定联合冲击、重新估值、加入流动性与融资反馈、汇总损失，最后把结果映射为行动。<\/p>\n<p>每个情景要记录版本和目的。历史情景回答“过去的冲击作用于今天的持仓会怎样”；假设情景覆盖历史没有完整出现但逻辑上可能同时发生的变化；反向压力则从不可承受结果倒推最小破坏条件。<\/p>\n<h2>避免不可能的情景拼盘<\/h2>\n<p>情景既要足够严厉，也要内部一致。若设定股票暴跌、避险资产也下跌、波动上升和流动性收缩，应解释共同驱动因素，例如通胀冲击、信用事件或被迫去杠杆。没有叙事约束的随机极值拼接，可能很吓人，却难以指导行动。<\/p>\n<p>反过来，只重演一段历史也可能漏掉当前组合的新脆弱性。情景库应同时覆盖已知历史、机制驱动假设和反向压力。<\/p>\n<h2>非线性头寸必须重新估值<\/h2>\n<p>股票或线性期货可在小冲击下用风险因子敏感度近似；债券需要同时考虑利率曲线与信用利差；期权在大幅冲击下应按新标的价格、波动率和剩余期限重新定价。只用 Delta 线性外推，可能漏掉 Gamma 和 Vega 带来的弯曲损益。<\/p>\n<p>还要注意组合净额在压力下可能失效：原本对冲的两个头寸若交易时段、市场或结算货币不同，实际无法同步退出。<\/p>\n<h2>第二轮反馈往往更危险<\/h2>\n<p>第一轮价格下跌会抬高波动与保证金，触发减仓；集中卖出扩大冲击和价差，又引发新的保证金需求。这条“价格下跌—被迫卖出—流动性恶化—再次下跌”的反馈链，是静态压力测试容易遗漏的部分。<\/p>\n<p>可以分轮模拟：第一轮重估资产，第二轮计算保证金和赎回缺口，第三轮按可成交量与滑点执行减仓，再重新估值剩余组合。即使模型粗糙，也比假设所有仓位按收盘价瞬间卖出更接近风险本质。<\/p>\n<h2>教学版反向压力<\/h2>\n<p>先定义组合不可承受的损失或流动性缺口，再逐步提高市场跌幅、相关性、利差和冲击成本，寻找首次越界的情景。随后问：是哪项头寸、共同因子或融资安排导致越界？能否在正常时期通过减杠杆、提高现金缓冲或改变到期结构降低脆弱性？<\/p>\n<p>反向压力的价值不在于预测该情景概率，而在于找到组合的“断裂点”，并在断裂前布置可执行措施。<\/p>\n<h2>风险预案：触发之后具体做什么<\/h2>\n<p>围绕“压力测试：模拟明天突然出现股灾的情形”写一份可执行的风险预案。风险指标只有绑定阈值、权限、动作和恢复条件，才能从报告上的数字变成真正的控制。<\/p>\n<ol>\n<li>定义风险对象、计算窗口、更新频率、阈值和数据依赖。<\/li>\n<li>设置预警、降仓、停止开仓和紧急平仓等分级动作，并明确授权人。<\/li>\n<li>加入相关性上升、流动性消失、价格跳空和模型失效等非历史常态情景。<\/li>\n<li>规定事件记录、复盘、重新启用条件与人工覆盖流程。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.bis.org/publications/201901-standards-minimum-capital-requirements-market-risk\">BIS：Minimum capital requirements for market risk<\/a>：压力期预期损失、回测与流动性期限。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://optimization-online.org/wp-content/uploads/2012/08/3574.pdf\">Rockafellar–Uryasev CVaR 研究入口<\/a>：CVaR 定义及其优化形式。<\/li>\n<li><strong>适用条件与边界<\/strong>：风险度量依赖分布、期限和流动性；正常时期相关性不能代表压力时期联动。<\/li>\n<li><strong>主要失败模式<\/strong>：把 VaR 当最大损失、用满凯利、按收盘价假设无限流动性，或只控制单笔而忽略组合暴露。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>把历史波动率当成全部风险；尾部、流动性和操作风险需要单独处理。<\/li>\n<li>只有止损阈值，没有成交与恢复方案；极端市场里订单可能无法按预期成交。<\/li>\n<li>风险规则频繁临时修改；任何人工覆盖都应授权、留痕并事后复盘。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>指标、阈值、动作和负责人一一对应<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少覆盖一个历史未充分出现的压力情景<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>组合级风险与单资产风险均有限额<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>暂停、恢复和人工覆盖流程可审计<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>压力测试关注极端情景下的脆弱性。<\/li>\n<li>历史、假设和反向压力各有用途。<\/li>\n<li>价格冲击之外还要模拟流动性与保证金反馈。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>设计一个股灾情景：市场 -20%、波动翻倍、相关上升、滑点三倍，计算组合损失与减仓顺序。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第077讲 资金曲线管理：连续回撤时，什么时候该暂停交易？<\/strong>。<\/p>"}, {"n": 77, "title": "资金曲线管理：连续回撤时，什么时候该暂停交易？", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。风控指标与阈值需结合资产、流动性和个人承受能力验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>区分按净值控仓与追逐短期表现。<\/li>\n<li>设计回撤降险与恢复规则。<\/li>\n<li>避免策略停在谷底、重启在高点。<\/li>\n<\/ul>\n<h2>为什么要管理资金曲线<\/h2>\n<p>连续回撤可能代表正常随机波动，也可能是信号、成本或市场机制改变。资金曲线规则希望在证据恶化时降低风险，但也可能在最低点退出。<\/p>\n<h2>三层诊断<\/h2>\n<p>先查数据和执行是否异常，再看风险暴露是否超限，最后判断策略统计是否偏离预期。不能把所有亏损都归为模型失效。<\/p>\n<h2>降险规则<\/h2>\n<p>可设置回撤阶梯、滚动波动目标、实盘交易与模型偏差阈值。例如回撤超过预警线降低风险，超过硬线暂停新增头寸。阈值应来自历史分布和压力预算。<\/p>\n<h2>恢复机制<\/h2>\n<p>明确恢复需要的数据、观察期和分级加仓。若暂停后只等净值反弹才恢复，策略无法产生反弹；可使用纸面影子组合持续计算信号。<\/p>\n<h2>风险<\/h2>\n<p>基于资金曲线的规则属于第二个策略，也必须单独回测。过度敏感会低卖高买，参数同样会过拟合。<\/p>\n<h2>回撤是症状，不是诊断<\/h2>\n<p>最大回撤只告诉你净值从峰值跌了多少，不能告诉你为什么跌。相同的 10% 回撤，可能来自正常策略波动、数据或订单故障、无意的风险集中、交易成本上升，或者策略机制真正失效。直接把所有回撤都解释为“模型坏了”，会在最不利时点停止一个仍然有效的策略。<\/p>\n<p>因此，暂停决策应同时观察金额、持续时间、实现波动、交易命中与赔率、成本偏差、暴露偏差以及实盘与影子组合差异。<\/p>\n<h2>三层诊断的具体顺序<\/h2>\n<p>第一层检查系统：数据是否缺失或延迟、信号是否重复、订单是否拒绝、费用和成交是否异常。若是运营故障，先阻止新增错误，不要用市场解释掩盖系统问题。<\/p>\n<p>第二层检查风险：仓位、杠杆、行业与因子暴露、相关性和流动性是否越限。若策略逻辑未变但风险放大，应先把暴露恢复到预算内。<\/p>\n<p>第三层才评估统计机制：当前亏损的幅度、持续期和交易结构是否仍落在预先模拟的合理范围；核心预测关系是否衰减；市场制度是否发生足以推翻假设的变化。<\/p>\n<h2>降险规则要分级而不是一刀切<\/h2>\n<p>可设计“预警—降仓—停止新增—退出并审查”四级动作。每一级都要绑定触发条件、目标风险、执行时限、负责人和允许的人工覆盖。阈值应来自样本外分布、压力情景和组织承受能力，而不是看到一次历史回撤后量身定做。<\/p>\n<p>多个指标共同确认通常比单一净值阈值更稳健。例如回撤越线但执行、暴露和信号统计均正常，可能只需降低风险；若回撤同时伴随成交偏差和数据异常，则应优先暂停系统。<\/p>\n<h2>为什么恢复条件必须同时写好<\/h2>\n<p>只有暂停条件、没有恢复条件，会让策略无限期冻结；等真实账户净值自行反弹又不可能，因为账户已不再持仓。可在暂停后继续运行不下单的影子组合，观察数据、信号和理论成交是否恢复正常。<\/p>\n<p>恢复可以分阶段：先确认故障修复或风险回到预算，再经过预定观察期，然后以较小仓位重启，达到稳定条件后逐步恢复。重启失败如何退回上一层也要预先定义。<\/p>\n<h2>把资金曲线规则当作第二个策略<\/h2>\n<p>降仓和重启会改变原策略的收益路径，因此必须把完整状态机加入历史与样本外回测。比较没有覆盖层和有覆盖层时的净收益、回撤、换手、错过反弹和停用次数，并对阈值做邻域测试。若覆盖层只在某个精确回撤数字下有效，它本身也可能过拟合。<\/p>\n<h2>风险预案：触发之后具体做什么<\/h2>\n<p>围绕“资金曲线管理：连续回撤时，什么时候该暂停交易？”写一份可执行的风险预案。风险指标只有绑定阈值、权限、动作和恢复条件，才能从报告上的数字变成真正的控制。<\/p>\n<ol>\n<li>定义风险对象、计算窗口、更新频率、阈值和数据依赖。<\/li>\n<li>设置预警、降仓、停止开仓和紧急平仓等分级动作，并明确授权人。<\/li>\n<li>加入相关性上升、流动性消失、价格跳空和模型失效等非历史常态情景。<\/li>\n<li>规定事件记录、复盘、重新启用条件与人工覆盖流程。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://optimization-online.org/wp-content/uploads/2012/08/3574.pdf\">Rockafellar–Uryasev CVaR 研究入口<\/a>：CVaR 定义及其优化形式。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.bis.org/publications/201901-standards-minimum-capital-requirements-market-risk\">BIS：Minimum capital requirements for market risk<\/a>：压力期预期损失、回测与流动性期限。<\/li>\n<li><strong>适用条件与边界<\/strong>：风险度量依赖分布、期限和流动性；正常时期相关性不能代表压力时期联动。<\/li>\n<li><strong>主要失败模式<\/strong>：把 VaR 当最大损失、用满凯利、按收盘价假设无限流动性，或只控制单笔而忽略组合暴露。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>把历史波动率当成全部风险；尾部、流动性和操作风险需要单独处理。<\/li>\n<li>只有止损阈值，没有成交与恢复方案；极端市场里订单可能无法按预期成交。<\/li>\n<li>风险规则频繁临时修改；任何人工覆盖都应授权、留痕并事后复盘。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>指标、阈值、动作和负责人一一对应<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少覆盖一个历史未充分出现的压力情景<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>组合级风险与单资产风险均有限额<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>暂停、恢复和人工覆盖流程可审计<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>回撤时先区分运营故障、风险超限和模型失效。<\/li>\n<li>降险与恢复规则必须成对设计。<\/li>\n<li>资金曲线管理本身也需要回测和监控。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为策略写黄、橙、红三级回撤预案，并定义每级仓位和恢复条件。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第078讲 黑天鹅应对：塔勒布的杠铃策略如何量化实现<\/strong>。<\/p>"}, {"n": 78, "title": "黑天鹅应对：塔勒布的杠铃策略如何量化实现", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。风控指标与阈值需结合资产、流动性和个人承受能力验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解杠铃策略的反脆弱直觉。<\/li>\n<li>区分安全端与凸性风险端。<\/li>\n<li>识别成本、误分类和长期拖累。<\/li>\n<\/ul>\n<h2>杠铃的结构<\/h2>\n<p>杠铃策略避免大量资金停留在“中等风险但尾部未知”区域，而把大部分配置在高安全、高流动性资产，小部分配置在损失有限、上行凸性的机会。<\/p>\n<h2>两端各做什么<\/h2>\n<p>安全端负责生存与选择权，风险端争取极端正收益。关键不是固定比例，而是安全端真的安全、风险端最大损失明确。<\/p>\n<h2>可量化实现<\/h2>\n<p>定义安全资产信用与久期边界、风险端预算、再平衡频率和总损失上限。风险端可来自期权等凸性工具，也可来自小额高不确定项目，但不能用高杠杆伪装凸性。<\/p>\n<h2>成本<\/h2>\n<p>凸性通常需要持续支付权利金或机会成本，长时间平静会拖累表现。安全资产也会受通胀、利率和信用影响。<\/p>\n<h2>最大误区<\/h2>\n<p>把 90% 普通债券加 10% 裸卖期权称为杠铃，实际是安全端加尾部负凸性。应检查整个组合在极端下的损失函数。<\/p>\n<h2>杠铃关注的是损益形状<\/h2>\n<p>杠铃不是简单的“保守资产加高风险资产”，而是把大部分资本放在损失边界清晰、流动性较好的区域，同时用小部分预算获取非对称上行。判断关键是整体损益函数：坏情景下能否生存，好情景下是否保留足够选择权。<\/p>\n<p>所谓凸性，可以直观理解为收益随有利变化加速，而损失在事先限定范围内。买入期权可能具有这种形状；卖出期权收取稳定小额权利金，却可能在极端情况下承担巨大损失，属于负凸性，不能仅因平时波动小就放到“安全端”。<\/p>\n<h2>安全端需要逐项验证<\/h2>\n<p>安全不是资产名称，而是一组条件：信用风险是否可接受、久期是否匹配、币种是否匹配、能否在需要时变现、托管与交易对手是否可靠。长期债券在利率大幅上升时可能有明显价格损失，外币现金会带来汇率风险，表面安全的工具也可能在压力下失去流动性。<\/p>\n<p>因此应按要保护的负债和持有期限定义安全端，而不是复制固定比例。安全端的首要任务是让组合不因风险端失败而被迫退出。<\/p>\n<h2>风险端的预算如何落地<\/h2>\n<p>先规定一个完整周期内愿意支付的最大保险或试错成本，再把预算分配到不同到期、不同冲击来源或不同独立机会。每笔风险端仓位都要能在最坏情况下明确损失边界，且总损失不破坏安全端的生存功能。<\/p>\n<p>如果使用期权，要计入买卖价差、波动率水平、时间价值衰减、展期频率和极端时的变现能力。只展示危机中的单次暴涨而不累计多年权利金，会严重高估保护效果。<\/p>\n<h2>教学对照：三种看似相近的结构<\/h2>\n<ul>\n<li>大部分短久期高流动资产，加小额损失有限的凸性头寸：符合杠铃的结构直觉。<\/li>\n<li>大部分普通风险资产，加少量现金：可能只是降低风险，并不自动获得凸性。<\/li>\n<li>大部分债券，加小额裸卖期权：平时曲线平滑，尾部却可能出现巨大负损失，与杠铃目标相反。<\/li>\n<\/ul>\n<p>分类不能只看仓位比例，要画出正常、通胀、利率跳升、信用危机和市场暴跌下的整体损益。<\/p>\n<h2>评价长期成本与危机收益<\/h2>\n<p>杠铃结构应跨完整周期评价：安全端收益、风险端累计成本、危机期兑现收益、再平衡效果以及未发生危机时的机会成本。还要检查保护是否与真实组合风险匹配；用股指期权保护信用或流动性风险，可能在关键时刻出现基差失效。<\/p>\n<p>这类结构不是免费的黑天鹅预测器，而是用可预算的持续成本，换取组合在部分极端情景中的生存与选择权。<\/p>\n<h2>风险预案：触发之后具体做什么<\/h2>\n<p>围绕“黑天鹅应对：塔勒布的杠铃策略如何量化实现”写一份可执行的风险预案。风险指标只有绑定阈值、权限、动作和恢复条件，才能从报告上的数字变成真正的控制。<\/p>\n<ol>\n<li>定义风险对象、计算窗口、更新频率、阈值和数据依赖。<\/li>\n<li>设置预警、降仓、停止开仓和紧急平仓等分级动作，并明确授权人。<\/li>\n<li>加入相关性上升、流动性消失、价格跳空和模型失效等非历史常态情景。<\/li>\n<li>规定事件记录、复盘、重新启用条件与人工覆盖流程。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://optimization-online.org/wp-content/uploads/2012/08/3574.pdf\">Rockafellar–Uryasev CVaR 研究入口<\/a>：CVaR 定义及其优化形式。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.bis.org/publications/201901-standards-minimum-capital-requirements-market-risk\">BIS：Minimum capital requirements for market risk<\/a>：压力期预期损失、回测与流动性期限。<\/li>\n<li><strong>适用条件与边界<\/strong>：风险度量依赖分布、期限和流动性；正常时期相关性不能代表压力时期联动。<\/li>\n<li><strong>主要失败模式<\/strong>：把 VaR 当最大损失、用满凯利、按收盘价假设无限流动性，或只控制单笔而忽略组合暴露。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>把历史波动率当成全部风险；尾部、流动性和操作风险需要单独处理。<\/li>\n<li>只有止损阈值，没有成交与恢复方案；极端市场里订单可能无法按预期成交。<\/li>\n<li>风险规则频繁临时修改；任何人工覆盖都应授权、留痕并事后复盘。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>指标、阈值、动作和负责人一一对应<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少覆盖一个历史未充分出现的压力情景<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>组合级风险与单资产风险均有限额<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>暂停、恢复和人工覆盖流程可审计<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>杠铃用安全端保证生存，用小额凸性端保留上行。<\/li>\n<li>真正关键是损失边界，而非表面比例。<\/li>\n<li>凸性有持续成本，安全资产也需重新审视。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>画出一个杠铃组合在正常、通胀、股灾和信用危机四种情景的损益。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第079讲 再平衡魔法：被动地低买高卖，不做预测也能赚钱<\/strong>。<\/p>"}, {"n": 79, "title": "再平衡魔法：被动地低买高卖，不做预测也能赚钱", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。风控指标与阈值需结合资产、流动性和个人承受能力验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解再平衡的风险控制与逆向交易机制。<\/li>\n<li>比较日历、容忍带与现金流再平衡。<\/li>\n<li>计入成本、税务和趋势风险。<\/li>\n<\/ul>\n<h2>再平衡为什么像低买高卖<\/h2>\n<p>设定目标权重后，上涨资产权重变高、下跌资产变低。恢复目标会卖出相对上涨者、买入相对下跌者，同时保持风险结构。<\/p>\n<h2>三种方法<\/h2>\n<ul>\n<li><strong>日历再平衡<\/strong>：按月、季或年执行，简单可复现。<\/li>\n<li><strong>容忍带<\/strong>：权重偏离超过阈值才交易，减少无效换手率。<\/li>\n<li><strong>现金流再平衡<\/strong>：优先用新增或支取资金纠偏，降低交易。<\/li>\n<\/ul>\n<h2>再平衡收益不是免费<\/h2>\n<p>它依赖资产波动、相关和均值回复。强单边趋势中频繁再平衡会不断卖出赢家；成本和税务也会降低效果。<\/p>\n<h2>阈值设计<\/h2>\n<p>可使用绝对偏离、相对偏离或风险贡献偏离。高波资产需要更宽带，低流动性资产应减少频率。<\/p>\n<h2>执行顺序<\/h2>\n<p>先检查目标本身是否仍有效，再用现金流、净额交易和分批执行降低成本。再平衡的首要目标是风险治理，其次才可能贡献收益。<\/p>\n<h2>权重为什么会自己漂移<\/h2>\n<p>资产价格变化后，即使一笔交易都不做，组合权重也会改变。资产 (i) 的新权重可以写成：<\/p>\n<p>[\nw_i' = \\frac{w_i(1+r_i)}{\\sum_j w_j(1+r_j)}\n]<\/p>\n<p>涨幅更高的资产会占据更大权重，组合的风险结构随之偏离原计划。再平衡的第一功能是把这种无意形成的风险暴露拉回目标，而“低买高卖”只是执行目标权重时产生的交易方向。<\/p>\n<h2>教学案例：60/40 组合如何调回去<\/h2>\n<p>假设初始组合 100 万元，股票 60 万元、债券 40 万元。若股票上涨 20%、债券不变，组合变为 112 万元，其中股票 72 万元，权重约 64.3%。若仍坚持 60/40 目标，股票目标金额为 67.2 万元，需要卖出约 4.8 万元股票并转入债券，暂不考虑成本与税费。<\/p>\n<p>这笔交易锁定了部分相对上涨资产，同时恢复风险预算。但如果股票此后继续单边上涨，频繁调回 60% 会持续卖出赢家，收益可能低于不再平衡的组合。<\/p>\n<h2>日历与容忍带怎样选择<\/h2>\n<p>日历法在固定日期检查和交易，规则简单，但可能在权重几乎未偏离时也产生小额交易。容忍带法只在偏离足够大时触发，更直接地把交易与风险变化相连，却需要选择阈值并持续监控。<\/p>\n<p>阈值应综合目标风险容忍度、资产波动、相关性、流动性、税费和最小交易规模。高成本或低流动性资产通常需要更宽的带；风险贡献快速变化的资产，则不能只看资金权重偏离。<\/p>\n<h2>再平衡并不创造免费收益<\/h2>\n<p>所谓再平衡收益更可能出现在多个有长期风险补偿、价格有波动且并非完全同涨同跌的资产之间。若某资产长期单边下跌是因为价值永久受损，不断买入只是扩大亏损；若目标权重已不再匹配负债或风险承受能力，机械恢复旧目标也没有意义。<\/p>\n<p>因此，每次执行前先区分两类变化：价格波动造成的暂时权重漂移，以及投资假设、负债或约束发生的结构变化。前者适合按政策再平衡，后者需要先重新审议目标。<\/p>\n<h2>一条成本友好的执行链<\/h2>\n<p>先用新增资金、分红和利息补向低配资产；再在账户之间做净额合并，减少一买一卖；随后检查税务、市场冲击和交易限制，并按流动性分批执行。完成后记录目标权重、触发原因、计划与实际成交、成本以及剩余偏离。<\/p>\n<p>回测时要比较不再平衡、固定日历和不同容忍带，计入税费、价差与滑点，并观察净收益、回撤、换手和风险偏离。最佳规则应在合理参数邻域内稳定，而不是恰好命中某个历史日期。<\/p>\n<h2>风险预案：触发之后具体做什么<\/h2>\n<p>围绕“再平衡魔法：被动地低买高卖，不做预测也能赚钱”写一份可执行的风险预案。风险指标只有绑定阈值、权限、动作和恢复条件，才能从报告上的数字变成真正的控制。<\/p>\n<ol>\n<li>定义风险对象、计算窗口、更新频率、阈值和数据依赖。<\/li>\n<li>设置预警、降仓、停止开仓和紧急平仓等分级动作，并明确授权人。<\/li>\n<li>加入相关性上升、流动性消失、价格跳空和模型失效等非历史常态情景。<\/li>\n<li>规定事件记录、复盘、重新启用条件与人工覆盖流程。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://optimization-online.org/wp-content/uploads/2012/08/3574.pdf\">Rockafellar–Uryasev CVaR 研究入口<\/a>：CVaR 定义及其优化形式。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.bis.org/publications/201901-standards-minimum-capital-requirements-market-risk\">BIS：Minimum capital requirements for market risk<\/a>：压力期预期损失、回测与流动性期限。<\/li>\n<li><strong>适用条件与边界<\/strong>：风险度量依赖分布、期限和流动性；正常时期相关性不能代表压力时期联动。<\/li>\n<li><strong>主要失败模式<\/strong>：把 VaR 当最大损失、用满凯利、按收盘价假设无限流动性，或只控制单笔而忽略组合暴露。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>把历史波动率当成全部风险；尾部、流动性和操作风险需要单独处理。<\/li>\n<li>只有止损阈值，没有成交与恢复方案；极端市场里订单可能无法按预期成交。<\/li>\n<li>风险规则频繁临时修改；任何人工覆盖都应授权、留痕并事后复盘。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>指标、阈值、动作和负责人一一对应<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少覆盖一个历史未充分出现的压力情景<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>组合级风险与单资产风险均有限额<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>暂停、恢复和人工覆盖流程可审计<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>再平衡恢复目标风险并产生逆向交易。<\/li>\n<li>容忍带和现金流法可减少换手率。<\/li>\n<li>趋势、成本和目标失效会削弱再平衡。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为 60/40 组合设计 5 个百分点容忍带，模拟股票涨跌后需要交易的金额。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第080讲 马科维茨的创举：均值-方差模型与有效前沿<\/strong>。<\/p>"}]}, {"no": 8, "name": "资产配置与组合优化", "desc": "系统讲解如何科学地在大类资产之间分配资金，理解现代组合理论的核心思想与实操。", "chapters": [{"n": 80, "title": "马科维茨的创举：均值-方差模型与有效前沿", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。组合模型依赖估计与约束，不能消除亏损。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解均值—方差模型的目标与约束。<\/li>\n<li>区分可行域、最小方差前沿和有效前沿。<\/li>\n<li>认识最优权重对输入的依赖。<\/li>\n<\/ul>\n<h2>马科维茨的关键变化<\/h2>\n<p>单看资产风险无法判断组合风险，因为资产之间会共同变化。均值—方差模型把预期收益向量 (\\mu)、协方差矩阵 (\\Sigma) 和权重 (w) 放进同一框架：<\/p>\n<p>[\nE[R_p]=w'\\mu,\\qquad \\sigma_p^2=w'\\Sigma w\n]<\/p>\n<h2>可行域与前沿<\/h2>\n<p>所有满足权重约束的组合形成可行域。给定目标收益时风险最低的组合构成最小方差前沿，其中高收益一侧称有效前沿；全局最小方差组合位于风险最小点。<\/p>\n<h2>优化形式<\/h2>\n<p>可最小化 (w'\\Sigma w)，同时要求权重和为 1、收益达到目标，并加入不做空、单资产上限和换手率等现实约束。另一形式是最大化预期收益减去风险厌恶乘方差。<\/p>\n<h2>资本市场线<\/h2>\n<p>在可借贷的无风险资产和切点风险组合的理想假设下，可以形成资本市场线。现实中借贷利率、杠杆和约束并不对称，因此它主要提供理论直觉。<\/p>\n<h2>使用边界<\/h2>\n<p>模型输出是“给定输入与约束下”的最优，不是客观真理。预期收益估计误差、协方差变化和交易成本都会让实际组合偏离。<\/p>\n<h2>从单个资产走向组合<\/h2>\n<p>均值—方差框架最重要的改变，是把风险从“每只资产各自有多危险”改写为“这些资产放在一起怎样共同波动”。组合中某资产的价值，不仅取决于自身收益和波动，还取决于它与其他资产的协方差。<\/p>\n<p>若两项资产并非完全同涨同跌，把它们组合起来可能在不同比例下相互抵消部分波动。因此，分散化不是简单增加证券数量，而是增加真正不同的风险来源。<\/p>\n<h2>有效前沿怎样一步步生成<\/h2>\n<p>可以把目标收益从低到高设置成一系列刻度。对每个刻度，优化器在全部满足约束的权重中寻找方差最小的组合，得到一个“目标收益—最低风险”点。连接这些点，就形成最小方差前沿；全局最小方差点以上的部分才是有效前沿。<\/p>\n<p>位于有效前沿下方的组合是低效的，因为存在另一个组合能够在相同风险下提供更高预期收益，或在相同预期收益下承担更低风险。但这里的“更高”和“更低”都基于输入估计，并非未来保证。<\/p>\n<h2>两资产教学推演<\/h2>\n<p>设资产 A 和 B 的权重分别为 (w) 与 (1-w)，组合方差为：<\/p>\n<p>[\n\\sigma_p^2=w^2\\sigma_A^2+(1-w)^2\\sigma_B^2+2w(1-w)\\sigma_A\\sigma_B\\rho_{AB}\n]<\/p>\n<p>当相关系数低于 1 时，中间权重有机会获得低于简单加权平均的风险；相关越低，曲线向左弯曲得越明显。若相关恰为 1，分散化只能在两项资产的线性组合上移动，不能产生额外的风险抵消。<\/p>\n<p>这是理解有效前沿的核心：前沿的形状来自资产间的共同变化，而不只是预期收益排序。<\/p>\n<h2>约束会改变“最优”的含义<\/h2>\n<p>允许做空、无限杠杆且不计成本时，优化器可能给出巨大的多空头寸；加入权重上下限、行业暴露、换手、流动性和最小持仓后，可行域会缩小，有效前沿也会向内移动。理论指标可能下降，但组合更接近真实可执行状态。<\/p>\n<p>约束不是事后修饰，而是投资问题的一部分。若团队不能承受某种杠杆、集中度或交易频率，就应在求解时明确写入，而不是先得到不可行权重，再凭感觉手工修改。<\/p>\n<h2>从前沿点到实际组合<\/h2>\n<p>选择前沿上的哪个点，需要风险承受能力、负债、投资期限和回撤预算，而不是只看预期收益最大。随后还要把连续权重转换成可交易数量，处理现金、税费、最小交易单位和再平衡成本。<\/p>\n<p>完整报告应同时展示输入、约束、前沿、所选组合、相邻可选点和压力情景。这样决策者看到的不是一组神秘权重，而是一条可以审查的选择路径。<\/p>\n<h2>事前最优不等于事后最优<\/h2>\n<p>有效前沿是根据估计的 (mu) 与 (Sigma) 画出的“事前地图”。未来实现的收益与协方差不同，组合在事后可能落到另一位置。评价模型时应在每个历史时点只使用当时可得数据生成权重，再观察下一期表现，不能用全样本输入绘制一条事后完美前沿。<\/p>\n<h2>配置实验：估计误差也是风险<\/h2>\n<p>把“马科维茨的创举：均值-方差模型与有效前沿”放进一个完整配置实验。优化器给出的权重只是输入假设、约束和目标函数的结果，必须检查其对估计误差和现实交易条件是否稳健。<\/p>\n<ol>\n<li>明确资产池、基准、再平衡频率、目标函数和全部约束。<\/li>\n<li>记录收益、波动率与相关性的估计窗口和方法，并做扰动测试。<\/li>\n<li>比较等权、简单风险预算等基线，判断复杂模型是否提供稳定增量。<\/li>\n<li>加入换手、交易成本、最小交易单位、容量和再平衡偏离区间。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.jstor.org/stable/2975974\">Markowitz（1952）：Portfolio Selection<\/a>：均值—方差与分散化的奠基论文。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://pubs.aeaweb.org/doi/10.1257/0895330042162430\">Fama 与 French：CAPM 的理论与证据<\/a>：CAPM 的逻辑、应用与经验缺陷。<\/li>\n<li><strong>适用条件与边界<\/strong>：优化结果高度依赖预期收益、协方差、约束和再平衡成本；数学最优不等于经营上可执行。<\/li>\n<li><strong>主要失败模式<\/strong>：把噪声当精确输入导致极端权重，忽略参数不确定性、换手、税费和资产流动性。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>把预测均值当成精确输入；微小估计变化可能导致极端权重。<\/li>\n<li>只看静态有效前沿；真实组合还要经历再平衡成本和相关性突变。<\/li>\n<li>复杂模型不与简单基线比较；增加的参数可能只是在拟合历史噪声。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>输入估计方法和约束均可复现<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>完成参数与相关性扰动测试<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>与至少一个简单基线做成本后比较<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>权重集中度、换手和极端情景符合风险预算<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>均值—方差模型把收益、风险和相关性统一进组合优化。<\/li>\n<li>有效前沿表示同风险下收益更高或同收益下风险更低。<\/li>\n<li>最优权重强烈依赖输入与约束。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>用三资产的预期收益和协方差计算多个权重组合，画出可行域并标出最小方差点。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第081讲 马科维茨模型的致命伤：垃圾进，垃圾出<\/strong>。<\/p>"}, {"n": 81, "title": "马科维茨模型的致命伤：垃圾进，垃圾出", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。组合模型依赖估计与约束，不能消除亏损。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解优化器为何放大输入误差。<\/li>\n<li>掌握收缩、约束和重采样思路。<\/li>\n<li>把稳定性置于样本内最优之前。<\/li>\n<\/ul>\n<h2>误差放大器<\/h2>\n<p>预期收益本就难估，优化器却会把很小的均值差解释为大权重差，把资金推向估计最乐观的资产并远离最悲观者。结果常出现极端集中与频繁翻转。<\/p>\n<h2>协方差也不稳定<\/h2>\n<p>资产数量接近或超过样本长度时，样本协方差噪声大、可能近似奇异。求逆会放大误差，优化权重因此剧烈变化。<\/p>\n<h2>三类改进<\/h2>\n<ul>\n<li><strong>收缩估计<\/strong>：把样本均值或协方差向稳定目标靠拢，牺牲部分拟合换取较小估计误差。<\/li>\n<li><strong>现实约束<\/strong>：设置权重上下限、行业和换手率约束，减少极端解。<\/li>\n<li><strong>重采样与稳健优化<\/strong>：对输入不确定性生成多个情景，选择在多种估计下都可接受的组合。<\/li>\n<\/ul>\n<h2>简单基线<\/h2>\n<p>等权、逆波动和全局最小方差是重要对照。复杂模型若不能在滚动样本外和成本后超过基线，就不值得承担额外估计风险。<\/p>\n<h2>判断稳健<\/h2>\n<p>观察输入轻微变化、窗口移动和数据修订后权重是否稳定；报告权重分布而非只给一次结果。<\/p>\n<h2>优化器为何偏爱估计错误<\/h2>\n<p>优化器的任务是寻找输入中最有利的差异。若某资产的预期收益因噪声被高估，它会把这点误差当成真实优势并集中配置；若两项资产的相关性被低估，它会把虚假的分散化当成免费风险降低。优化器并不知道哪些数字可靠，它只会忠实放大输入。<\/p>\n<p>这就是“垃圾进，垃圾出”比普通计算更危险的地方：输出可能数学上精确、表格也很漂亮，却对输入的一点扰动极度敏感。<\/p>\n<h2>均值误差通常最具破坏性<\/h2>\n<p>预期收益是一个很小的信号，历史收益波动却很大。不同窗口、异常月份或起止日期都可能改变资产排序。优化器为了追求几个百分点甚至更小的预期差异，可能给出截然相反的权重。<\/p>\n<p>一个直接测试是给每项预期收益做小幅上下扰动，再重复优化。若资产仅因很小的均值变化就从上限跳到下限，说明权重主要反映估计误差，而不是稳定信息。<\/p>\n<h2>协方差矩阵会怎样出问题<\/h2>\n<p>当资产很多、历史样本较短或资产高度相似时，样本协方差矩阵可能病态：某些方向的估计风险接近零，求逆后产生巨大权重。即使矩阵可以计算，滚动一个月或删除少量数据也可能让权重翻转。<\/p>\n<p>诊断时应检查样本数与资产数、特征值分布、条件数、成对相关稳定性，以及不同窗口下的最小方差组合。数值能成功求解，不代表风险模型可靠。<\/p>\n<h2>四层稳健化顺序<\/h2>\n<ol>\n<li><strong>先修数据与资产池<\/strong>：统一频率、币种和缺失值处理，删除无法可靠估计或交易的资产。<\/li>\n<li><strong>再收缩输入<\/strong>：把均值向共同水平、因子模型或均衡先验收缩，把协方差向结构化目标靠拢。<\/li>\n<li><strong>加入现实约束<\/strong>：限制集中度、杠杆、换手、因子偏离和流动性占用。<\/li>\n<li><strong>最后处理不确定性<\/strong>：用重采样、情景或稳健优化寻找多组输入下都能接受的权重。<\/li>\n<\/ol>\n<p>这些方法不是让预测更“真实”，而是承认估计不精确，用适度偏差换取较低的权重方差和交易成本。<\/p>\n<h2>简单基线为什么难以击败<\/h2>\n<p>等权不估计预期收益与协方差，逆波动只估计单项波动，全局最小方差不直接使用预期收益。它们可能不够精细，却少了许多误差来源。复杂方法必须证明新增信息在滚动样本外、成本后和压力期仍有稳定增量。<\/p>\n<p>比较时应保持资产池、再平衡日期、成本模型和约束一致。否则，所谓模型优势可能只是交易频率或样本选择不同。<\/p>\n<h2>一张真正有用的稳定性报告<\/h2>\n<p>除了样本内收益，报告每次再平衡的权重、换手、集中度、约束命中情况，以及输入扰动后的权重分布。再展示等权、逆波动和现有基准的成本后表现。若复杂组合只在某一组输入下胜出，而相邻设定大多失败，就应降低对“最优解”的信任。<\/p>\n<h2>配置实验：估计误差也是风险<\/h2>\n<p>把“马科维茨模型的致命伤：垃圾进，垃圾出”放进一个完整配置实验。优化器给出的权重只是输入假设、约束和目标函数的结果，必须检查其对估计误差和现实交易条件是否稳健。<\/p>\n<ol>\n<li>明确资产池、基准、再平衡频率、目标函数和全部约束。<\/li>\n<li>记录收益、波动率与相关性的估计窗口和方法，并做扰动测试。<\/li>\n<li>比较等权、简单风险预算等基线，判断复杂模型是否提供稳定增量。<\/li>\n<li>加入换手、交易成本、最小交易单位、容量和再平衡偏离区间。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.jstor.org/stable/2975974\">Markowitz（1952）：Portfolio Selection<\/a>：均值—方差与分散化的奠基论文。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://pubs.aeaweb.org/doi/10.1257/0895330042162430\">Fama 与 French：CAPM 的理论与证据<\/a>：CAPM 的逻辑、应用与经验缺陷。<\/li>\n<li><strong>适用条件与边界<\/strong>：优化结果高度依赖预期收益、协方差、约束和再平衡成本；数学最优不等于经营上可执行。<\/li>\n<li><strong>主要失败模式<\/strong>：把噪声当精确输入导致极端权重，忽略参数不确定性、换手、税费和资产流动性。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>把预测均值当成精确输入；微小估计变化可能导致极端权重。<\/li>\n<li>只看静态有效前沿；真实组合还要经历再平衡成本和相关性突变。<\/li>\n<li>复杂模型不与简单基线比较；增加的参数可能只是在拟合历史噪声。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>输入估计方法和约束均可复现<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>完成参数与相关性扰动测试<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>与至少一个简单基线做成本后比较<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>权重集中度、换手和极端情景符合风险预算<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>均值—方差权重会放大预期收益与协方差误差。<\/li>\n<li>收缩与约束通过引入偏差换取更低方差。<\/li>\n<li>简单基线和权重稳定性是必要检验。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>给某资产预期收益增加 0.5 个百分点，观察无约束与有上限优化的权重变化。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第082讲 Black-Litterman模型（上）：告别极端配置<\/strong>。<\/p>"}, {"n": 82, "title": "Black-Litterman模型（上）：告别极端配置", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。组合模型依赖估计与约束，不能消除亏损。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解市场均衡隐含收益作为先验。<\/li>\n<li>掌握观点矩阵、方向与置信度直觉。<\/li>\n<li>解释 Black–Litterman 如何缓解极端权重。<\/li>\n<\/ul>\n<h2>从市场组合出发<\/h2>\n<p>Black–Litterman 不从噪声很大的历史均值直接起步，而从市场权重和风险模型反推一组均衡隐含收益：<\/p>\n<p>[\n\\pi=\\delta\\Sigma w_{mkt}\n]<\/p>\n<p>其中 (\\delta) 是风险厌恶参数。(\\pi) 是与市场配置相容的先验，不代表市场永远正确。<\/p>\n<h2>表达观点<\/h2>\n<p>观点写成 (P\\mu=Q)。(P) 指定涉及哪些资产，(Q) 表示绝对或相对观点。例如“股票预期收益比债券高 2%”是相对观点。<\/p>\n<h2>置信度<\/h2>\n<p>观点不确定性由 (\\Omega) 描述。置信越高，后验越接近观点；置信越低，越靠近市场先验。(\\tau) 则控制先验均值的不确定尺度。<\/p>\n<h2>为什么更稳定<\/h2>\n<p>历史均值优化从零开始猜每项收益，BL 则让观点只在市场基准上做有限偏离。弱观点不会轻易把某资产推到 100% 权重。<\/p>\n<h2>真正难点<\/h2>\n<p>不是矩阵运算，而是把投资观点转换成一致单位、相对关系和可解释置信度。错误自信仍会产生错误组合。<\/p>\n<h2>为什么先从市场权重反推<\/h2>\n<p>直接用历史均值优化，相当于要求研究者为每项资产都提供精确预期收益。Black–Litterman 换了一个起点：先假设观察到的市场组合在某种风险厌恶水平下接近均衡，再反推出与这组权重相容的隐含超额收益 (pi)。<\/p>\n<p>这不是说市场组合一定正确，而是建立一组中性的、可解释的基准。研究者只有在确实持有观点时才偏离它，且偏离幅度受置信度控制。<\/p>\n<h2>从市场数据到先验的步骤<\/h2>\n<ol>\n<li>定义可投资资产及代表其市场价值的基准权重 (w_{mkt})。<\/li>\n<li>用一致频率和窗口估计协方差矩阵 (Sigma)。<\/li>\n<li>确定风险厌恶参数 (delta) 及收益是否为超额收益。<\/li>\n<li>计算 (pi=\\delta\\Sigma w_{mkt})，并检查单位和年化口径。<\/li>\n<li>将先验重新送入基准优化，验证能否近似还原市场权重。<\/li>\n<\/ol>\n<p>最后一步是重要的单元测试。若无法还原，可能是协方差、风险厌恶、约束或收益口径不一致。<\/p>\n<h2>P 和 Q 如何表达观点<\/h2>\n<p>假设资产顺序为股票、债券、商品。一个绝对观点“商品预期超额收益为 3%”可用一行 (P=[0,0,1])，对应 (Q=[3\\%])。一个相对观点“股票比债券高 2%”可写为 (P=[1,-1,0])，对应 (Q=[2\\%])。<\/p>\n<p>相对观点只表达资产间差异，不要求研究者预测所有资产的绝对收益。若一条观点包含多个资产，行内权重应说明比较的是等权篮子、市值加权篮子，还是其他明确组合。<\/p>\n<h2>置信度不是主观形容词<\/h2>\n<p>(Omega) 描述观点误差的方差。方差越小，模型越信任观点；方差越大，后验越接近市场先验。与其写“我很有信心”，更可操作的做法是把置信度绑定到观点模型的历史预测误差、样本量、信号稳定性或明确的低中高情景。<\/p>\n<p>置信度和观点幅度是两件事：认为股票相对债券高 2% 是观点幅度，对这 2% 有多大把握是置信度。把两者混在一起，会使后验难以解释。<\/p>\n<h2>多条观点可能相互重叠<\/h2>\n<p>若两条观点都高度依赖同一个宏观信号，它们的误差并非独立。把 (Omega) 简化为对角矩阵，可能重复计算同一信息。观点还可能逻辑冲突，例如同时断言 A 优于 B、B 优于 C，但又给出 C 明显优于 A。<\/p>\n<p>上线前应检查观点矩阵的秩、重叠资产、共同数据来源和隐含关系，并在报告中列出每条观点对后验的边际影响。<\/p>\n<h2>BL 能解决什么，不能解决什么<\/h2>\n<p>BL 通过先验与观点收缩，缓解历史均值直接优化造成的极端配置；它不会自动修复错误协方差、失真的市场权重、不合理观点、忽略成本的优化器或不可交易资产。它是一套组织不确定性的框架，不是稳定收益的保证。<\/p>\n<h2>配置实验：估计误差也是风险<\/h2>\n<p>把“Black-Litterman模型（上）：告别极端配置”放进一个完整配置实验。优化器给出的权重只是输入假设、约束和目标函数的结果，必须检查其对估计误差和现实交易条件是否稳健。<\/p>\n<ol>\n<li>明确资产池、基准、再平衡频率、目标函数和全部约束。<\/li>\n<li>记录收益、波动率与相关性的估计窗口和方法，并做扰动测试。<\/li>\n<li>比较等权、简单风险预算等基线，判断复杂模型是否提供稳定增量。<\/li>\n<li>加入换手、交易成本、最小交易单位、容量和再平衡偏离区间。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://people.duke.edu/~charvey/Teaching/BA453_2006/Black_Litterman_Global_Portfolio_Optimization_1992.pdf\">Black 与 Litterman：Global Portfolio Optimization<\/a>：市场均衡先验与主观观点的组合。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.jstor.org/stable/2975974\">Markowitz（1952）：Portfolio Selection<\/a>：均值—方差与分散化的奠基论文。<\/li>\n<li><strong>适用条件与边界<\/strong>：优化结果高度依赖预期收益、协方差、约束和再平衡成本；数学最优不等于经营上可执行。<\/li>\n<li><strong>主要失败模式<\/strong>：把噪声当精确输入导致极端权重，忽略参数不确定性、换手、税费和资产流动性。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>把预测均值当成精确输入；微小估计变化可能导致极端权重。<\/li>\n<li>只看静态有效前沿；真实组合还要经历再平衡成本和相关性突变。<\/li>\n<li>复杂模型不与简单基线比较；增加的参数可能只是在拟合历史噪声。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>输入估计方法和约束均可复现<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>完成参数与相关性扰动测试<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>与至少一个简单基线做成本后比较<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>权重集中度、换手和极端情景符合风险预算<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>BL 以市场均衡隐含收益作为先验。<\/li>\n<li>观点通过 P、Q 和不确定性进入模型。<\/li>\n<li>贝叶斯式收缩让弱观点只做有限偏离。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>用三资产写一个绝对观点和一个相对观点，构造对应 P 与 Q。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第083讲 Black-Litterman模型（下）：从观点到新权重<\/strong>。<\/p>"}, {"n": 83, "title": "Black-Litterman模型（下）：从观点到新权重", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。组合模型依赖估计与约束，不能消除亏损。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解后验预期收益的加权更新。<\/li>\n<li>把后验输入带约束的优化器。<\/li>\n<li>完成一个小型手算流程。<\/li>\n<\/ul>\n<h2>后验公式的直觉<\/h2>\n<p>BL 后验均值是市场先验与投资观点按各自不确定性加权后的结果。常见形式可写为：<\/p>\n<p>[\n\\mu_{BL}=\\left[(\\tau\\Sigma)^{-1}+P'\\Omega^{-1}P\\right]^{-1}\n\\left[(\\tau\\Sigma)^{-1}\\pi+P'\\Omega^{-1}Q\\right]\n]<\/p>\n<p>看似复杂，核心只是“更可靠的信息权重更高”。<\/p>\n<h2>简化例子<\/h2>\n<p>假设市场组合为股票 60%、债券 40%。模型从该权重反推先验；研究者认为股票相对债券多 1%，但信心中等。后验会把股票预期收益向上调整，却不会完全采用 1% 观点。<\/p>\n<h2>从收益到权重<\/h2>\n<p>将 (\\mu_{BL}) 与协方差输入均值—方差优化器，再加入不做空、单资产上限和换手率约束。BL 改善的是预期收益输入，不会自动解决协方差和成本。<\/p>\n<h2>置信度敏感性<\/h2>\n<p>用低、中、高三档 (\\Omega) 计算后验和权重，观察观点影响。若轻微置信变化导致权重跳跃，仍需加强约束或缩小观点幅度。<\/p>\n<h2>评估<\/h2>\n<p>用滚动时点生成观点，保留当时数据，比较市场基准、直接优化和 BL 在样本外的权重、换手率和风险。<\/p>\n<h2>后验更新可以看成两股力量<\/h2>\n<p>市场先验是一根把组合拉回基准的弹簧，投资观点则向特定方向施力。先验越确定，弹簧越强；观点置信度越高，观点力量越大。最终后验不是简单取平均，而是结合协方差与观点结构，在多资产空间中完成加权。<\/p>\n<p>因此，一条“股票优于债券”的观点也可能影响商品的后验收益，因为资产间协方差传递了信息。检查结果时不能只看观点直接涉及的两个资产。<\/p>\n<h2>一条观点的完整编码流程<\/h2>\n<p>以“未来一个配置期内，股票超额收益比债券高 1%，置信度中等”为教学例：<\/p>\n<ol>\n<li>固定资产顺序和收益期限，确保 1% 与先验使用相同单位。<\/li>\n<li>构造 (P=[1,-1]) 与 (Q=[1\\%])。<\/li>\n<li>用预先规定的方法把“中等置信”转成观点误差 (Omega)。<\/li>\n<li>计算后验收益，并核对股票与债券的后验差值向 1% 移动但通常不会完全等于 1%。<\/li>\n<li>分别用低、中、高置信度重复计算，形成敏感性路径。<\/li>\n<\/ol>\n<p>这是一条相对观点，不代表股票绝对收益一定为正。若股票和债券都下跌，股票仍可能只是“少跌 1%”。<\/p>\n<h2>从后验收益到可交易权重<\/h2>\n<p>后验收益只是优化器的一项输入。还需配合协方差、风险厌恶和完整约束求权重，再把目标权重与当前持仓比较。实际交易量应考虑容忍带、换手惩罚、税费、流动性和最小交易单位。<\/p>\n<p>可以把优化目标写成“预期收益—风险惩罚—交易成本惩罚”。这样，弱观点若不足以覆盖交易成本，就不会触发大幅调仓。与先求无成本最优、再事后削减交易相比，这种做法更一致。<\/p>\n<h2>四张表完成结果解释<\/h2>\n<ul>\n<li><strong>输入表<\/strong>：市场权重、协方差、风险厌恶和所有单位。<\/li>\n<li><strong>观点表<\/strong>：每条 (P)、(Q)、置信度、数据来源和有效期限。<\/li>\n<li><strong>更新表<\/strong>：先验收益、后验收益及每条观点带来的变化。<\/li>\n<li><strong>权重表<\/strong>：基准、无观点组合、BL 目标、实际成交后权重和约束命中情况。<\/li>\n<\/ul>\n<p>这四张表能回答“为什么改”“改了多少”“哪条观点驱动”“为什么没有完全改到模型目标”。<\/p>\n<h2>观点也需要生命周期<\/h2>\n<p>观点应有生成时间、适用期限、更新频率和失效条件。过期观点不能因仍存在配置文件中而继续影响权重。若数据修订、模型漂移或事件已经兑现，应重新计算置信度或撤销观点。<\/p>\n<p>回测时必须在每个历史时点按当时数据生成观点，不能用今天的模型回填过去。否则，BL 的平滑权重也可能建立在前视信息上。<\/p>\n<h2>如何判断 BL 是否真正增加价值<\/h2>\n<p>至少比较市场基准、直接历史均值优化、只有先验的组合与加入观点的 BL 组合。观察样本外净收益、风险、最大回撤、换手、权重集中度和观点命中率，并做置信度与协方差扰动。<\/p>\n<p>若 BL 只让权重更平滑，却没有改善决策目标，也许它只是昂贵的稳定器；若观点贡献主要来自一个时期或一条规则，则需要降低结论强度。<\/p>\n<h2>配置实验：估计误差也是风险<\/h2>\n<p>把“Black-Litterman模型（下）：从观点到新权重”放进一个完整配置实验。优化器给出的权重只是输入假设、约束和目标函数的结果，必须检查其对估计误差和现实交易条件是否稳健。<\/p>\n<ol>\n<li>明确资产池、基准、再平衡频率、目标函数和全部约束。<\/li>\n<li>记录收益、波动率与相关性的估计窗口和方法，并做扰动测试。<\/li>\n<li>比较等权、简单风险预算等基线，判断复杂模型是否提供稳定增量。<\/li>\n<li>加入换手、交易成本、最小交易单位、容量和再平衡偏离区间。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://people.duke.edu/~charvey/Teaching/BA453_2006/Black_Litterman_Global_Portfolio_Optimization_1992.pdf\">Black 与 Litterman：Global Portfolio Optimization<\/a>：市场均衡先验与主观观点的组合。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.jstor.org/stable/2975974\">Markowitz（1952）：Portfolio Selection<\/a>：均值—方差与分散化的奠基论文。<\/li>\n<li><strong>适用条件与边界<\/strong>：优化结果高度依赖预期收益、协方差、约束和再平衡成本；数学最优不等于经营上可执行。<\/li>\n<li><strong>主要失败模式<\/strong>：把噪声当精确输入导致极端权重，忽略参数不确定性、换手、税费和资产流动性。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>把预测均值当成精确输入；微小估计变化可能导致极端权重。<\/li>\n<li>只看静态有效前沿；真实组合还要经历再平衡成本和相关性突变。<\/li>\n<li>复杂模型不与简单基线比较；增加的参数可能只是在拟合历史噪声。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>输入估计方法和约束均可复现<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>完成参数与相关性扰动测试<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>与至少一个简单基线做成本后比较<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>权重集中度、换手和极端情景符合风险预算<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>BL 后验按先验和观点的不确定性加权。<\/li>\n<li>后验收益仍需通过有约束优化转为权重。<\/li>\n<li>观点幅度与置信度都应做敏感性分析。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为股票/债券两资产设置三档观点置信度，记录后验收益和权重如何变化。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第084讲 风险平价：全天候策略的核心思想<\/strong>。<\/p>"}, {"n": 84, "title": "风险平价：全天候策略的核心思想", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。组合模型依赖估计与约束，不能消除亏损。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解等权、逆波动与等风险贡献。<\/li>\n<li>掌握风险贡献的计算直觉。<\/li>\n<li>认识全天候简化实现的杠杆与通胀风险。<\/li>\n<\/ul>\n<h2>不预测收益的配置<\/h2>\n<p>风险平价减少对预期收益的依赖，目标是让资产或风险因子贡献更均衡。若只按资金等权，高波资产会主导组合风险。<\/p>\n<h2>逆波动与等风险贡献<\/h2>\n<p>逆波动权重近似 (w_i\\propto1/\\sigma_i)，忽略相关性。等风险贡献要求每项 (RC_i=w_i(\\Sigma w)_i/\\sigma_p) 接近相等，因此同时考虑协方差。<\/p>\n<h2>全天候直觉<\/h2>\n<p>通过股票、名义债券、通胀敏感资产等分散增长与通胀环境，再按风险平衡。低波债券权重可能较高，若追求目标收益常需杠杆。<\/p>\n<h2>风险<\/h2>\n<p>估计相关变化、债券与股票同时下跌、杠杆融资成本和低流动性都会破坏历史平衡。风险平价不是永远抗通胀，取决于资产集合是否真的包含通胀风险来源。<\/p>\n<h2>实现<\/h2>\n<p>使用稳健协方差、权重和杠杆上限、定期或容忍带再平衡，并对利率跳升、通胀与流动性做压力测试。<\/p>\n<h2>资金均分为何不等于风险均分<\/h2>\n<p>假设两项资产资金各占 50%，其中一项波动率 10%，另一项为 20%，且暂不考虑相关性。高波资产会贡献更多组合波动，组合的风险并没有均分。若用简单逆波动配置，权重大致与 (1/\\sigma) 成正比，低波资产与高波资产约按 2:1 分配资金。<\/p>\n<p>这个教学例说明风险平价为什么常把更多资金放到债券等低波资产。但逆波动只看各自波动，没有考虑资产间相关性，因此不等同于严格的等风险贡献。<\/p>\n<h2>等风险贡献的机制<\/h2>\n<p>组合波动率为 (sigma_p=\\sqrt{w'\\Sigma w})。资产 (i) 的边际风险与 ((\\Sigma w)_i/\\sigma_p) 有关，再乘以权重 (w_i)，得到风险贡献：<\/p>\n<p>[\nRC_i=\\frac{w_i(\\Sigma w)_i}{\\sigma_p}\n]<\/p>\n<p>各项风险贡献之和等于组合波动率。等风险贡献通过迭代调整权重，使每项 (RC_i) 接近相同。某资产即使自身波动不高，若与其他资产高度同向，也可能需要更低权重。<\/p>\n<h2>资产风险平价与因子风险平价<\/h2>\n<p>给股票、债券、商品各分一份风险，不代表真正分散了经济驱动。多项资产可能共同暴露于增长、通胀、利率或流动性。资产层看似均衡，因子层仍可能集中。<\/p>\n<p>更深入的做法是估计组合对经济或统计因子的暴露，再分配因子风险。但因子定义和估计也有模型误差，因此应同时报告资产风险贡献、主要因子贡献和压力情景损失。<\/p>\n<h2>为什么常常需要杠杆<\/h2>\n<p>低波资产获得较高资金权重后，未加杠杆的组合预期收益可能较低。为了达到目标波动或收益，有些实现会整体放大组合。杠杆不改变相对风险预算，却引入融资成本、保证金、再融资和强制减仓风险。<\/p>\n<p>当低波资产突然下跌或相关性上升时，历史风险估计会同时失效，杠杆会放大损失。因此杠杆上限、现金缓冲和融资压力测试是策略本体，而非外围细节。<\/p>\n<h2>“全天候”不是“任何时候都赚钱”<\/h2>\n<p>全天候直觉是准备对增长与通胀等不同环境敏感的资产，而不是预测下一种环境。但若资产池缺少真正的通胀敏感来源，或者股票与名义债券在通胀冲击下共同下跌，组合仍会受损。<\/p>\n<p>检验时应按增长上升/下降、通胀上升/下降等环境切片，观察风险贡献、收益与相关结构，而不是只看全样本平均。<\/p>\n<h2>一条可复核的实现流程<\/h2>\n<p>统一收益频率和币种，估计并收缩协方差；求解受权重、杠杆和流动性约束的风险预算；把连续权重转成可交易头寸；使用容忍带减少无效换手；最后对相关性上升、利率跳升、融资成本扩大和资产停牌进行压力测试。<\/p>\n<p>每次再平衡保存预测风险贡献与随后实现风险贡献。两者长期偏离，可能说明协方差模型、交易实现或资产映射需要修订。<\/p>\n<h2>配置实验：估计误差也是风险<\/h2>\n<p>把“风险平价：全天候策略的核心思想”放进一个完整配置实验。优化器给出的权重只是输入假设、约束和目标函数的结果，必须检查其对估计误差和现实交易条件是否稳健。<\/p>\n<ol>\n<li>明确资产池、基准、再平衡频率、目标函数和全部约束。<\/li>\n<li>记录收益、波动率与相关性的估计窗口和方法，并做扰动测试。<\/li>\n<li>比较等权、简单风险预算等基线，判断复杂模型是否提供稳定增量。<\/li>\n<li>加入换手、交易成本、最小交易单位、容量和再平衡偏离区间。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.jstor.org/stable/2975974\">Markowitz（1952）：Portfolio Selection<\/a>：均值—方差与分散化的奠基论文。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://people.duke.edu/~charvey/Teaching/BA453_2006/Black_Litterman_Global_Portfolio_Optimization_1992.pdf\">Black 与 Litterman：Global Portfolio Optimization<\/a>：市场均衡先验与主观观点的组合。<\/li>\n<li><strong>适用条件与边界<\/strong>：优化结果高度依赖预期收益、协方差、约束和再平衡成本；数学最优不等于经营上可执行。<\/li>\n<li><strong>主要失败模式<\/strong>：把噪声当精确输入导致极端权重，忽略参数不确定性、换手、税费和资产流动性。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>把预测均值当成精确输入；微小估计变化可能导致极端权重。<\/li>\n<li>只看静态有效前沿；真实组合还要经历再平衡成本和相关性突变。<\/li>\n<li>复杂模型不与简单基线比较；增加的参数可能只是在拟合历史噪声。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>输入估计方法和约束均可复现<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>完成参数与相关性扰动测试<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>与至少一个简单基线做成本后比较<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>权重集中度、换手和极端情景符合风险预算<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>风险平价让风险贡献而非资金权重更均衡。<\/li>\n<li>逆波动忽略相关，等风险贡献使用协方差。<\/li>\n<li>全天候仍面临杠杆、相关变化和资产缺失。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>比较四资产等权、逆波动和等风险贡献的资金权重与风险贡献。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第085讲 动态再平衡与目标风险策略<\/strong>。<\/p>"}, {"n": 85, "title": "动态再平衡与目标风险策略", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。组合模型依赖估计与约束，不能消除亏损。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>比较机械、容忍带和目标风险调仓。<\/li>\n<li>掌握目标波动反推仓位。<\/li>\n<li>设计含杠杆和交易成本的动态系统。<\/li>\n<\/ul>\n<h2>三种动态机制<\/h2>\n<p>机械再平衡按固定日历恢复目标；容忍带在偏离超过阈值时交易；目标风险根据组合预测波动动态调整总风险。<\/p>\n<h2>目标波动<\/h2>\n<p>若目标年化波动率为 (\\sigma^*)，当前预测波动为 (\\hat\\sigma_t)，风险资产缩放系数近似：<\/p>\n<p>[\nk_t=\\frac{\\sigma^*}{\\hat\\sigma_t}\n]<\/p>\n<p>再对 (k_t) 设置上下限。波动升高时降仓，降低时加仓。<\/p>\n<h2>顺周期问题<\/h2>\n<p>危机中波动飙升，模型可能在价格下跌后被迫卖出；平静期持续加杠杆，又可能在冲击前过度暴露。可使用平滑波动、缓冲区、慢速调整和杠杆上限。<\/p>\n<h2>组合调仓<\/h2>\n<p>先确定战略权重，再计算风险缩放，最后净额交易并考虑现金与保证金。目标波动不改变相对资产选择，只调整总风险；若相关性同时变化，还需重估组合协方差。<\/p>\n<h2>验证<\/h2>\n<p>比较固定仓位与目标波动在正常、危机和快速反弹阶段的收益、回撤、换手率和杠杆。动态不等于总能避险。<\/p>\n<h2>目标波动控制的机械逻辑<\/h2>\n<p>目标风险策略先估计当前组合未来一段时间的波动，再用目标波动除以预测波动得到总仓位缩放。预测波动低于目标时放大风险，预测波动高于目标时缩小风险；相对资产权重可以保持不变。<\/p>\n<p>教学上，若目标波动为 10%，当前预测波动为 5%，原始缩放为 2 倍；若杠杆上限为 1.5 倍，则实际只能取 1.5。若预测波动为 20%，缩放为 0.5。公式很简单，真正困难在于预测、延迟、交易成本和极端跳变。<\/p>\n<h2>波动估计决定策略性格<\/h2>\n<p>短窗口或高衰减估计对新冲击反应快，能够迅速降仓，却容易被短期噪声反复触发；长窗口更稳定，但可能在风险已经上升后仍维持高仓位。历史波动还看不到尚未发生的跳空与流动性风险。<\/p>\n<p>可以并行观察快、慢两套波动，或在统计预测上加入隐含波动与压力下限。任何选择都应通过样本外比较，而不是根据某次危机量身定做。<\/p>\n<h2>顺周期反馈是怎样形成的<\/h2>\n<p>平静期波动下降，策略逐步加仓；冲击发生后，损失与波动同时上升，模型要求卖出；集中降仓又可能扩大市场波动。快速反弹时，策略因预测波动仍高而保持低仓位，于是出现“跌后卖、涨时没买回”的路径。<\/p>\n<p>目标波动的收益并非来自预测方向，而是试图稳定风险暴露。它可能改善某些持续风险阶段，也可能在跳空和 V 形反转中表现较差。<\/p>\n<h2>把公式变成状态机<\/h2>\n<p>一个可执行系统至少包含五步：<\/p>\n<ol>\n<li>在固定时间用当时可得数据更新风险预测。<\/li>\n<li>计算原始缩放，并施加现金、杠杆和保证金上下限。<\/li>\n<li>只有目标与当前仓位偏离超过容忍带时才交易。<\/li>\n<li>限制单日调整速度和市场成交量占比，未完成部分进入后续计划。<\/li>\n<li>在风险预测恢复后分级加仓，而不是瞬间跳回满仓。<\/li>\n<\/ol>\n<p>每一步都要记录计划值、实际值和偏离原因。否则回测中的连续权重无法对应真实交易。<\/p>\n<h2>相对配置与总风险要分开<\/h2>\n<p>先由战略配置、风险平价或其他模型决定各资产相对权重，再由目标波动决定整体缩放。若资产相关性发生变化，组合预测波动会随之改变；不能只用各资产波动加权而忽略协方差。<\/p>\n<p>当某项资产不可交易时，简单按比例缩放剩余资产可能改变因子暴露。系统应明确缺失价格、停牌、涨跌停和保证金不足时的降级规则。<\/p>\n<h2>回测必须覆盖四种路径<\/h2>\n<p>至少检查平静期逐步加仓、缓慢熊市持续降仓、单日跳空来不及退出，以及急跌急涨的 V 形反转。比较固定仓位、即时目标风险和带平滑/容忍带版本的净收益、实现波动、回撤、换手、平均杠杆与约束违例。<\/p>\n<p>还应扰动波动窗口、再平衡频率、杠杆上限和成本。若优势只存在于一个精确设定，动态机制可能只是历史路径拟合。<\/p>\n<h2>配置实验：估计误差也是风险<\/h2>\n<p>把“动态再平衡与目标风险策略”放进一个完整配置实验。优化器给出的权重只是输入假设、约束和目标函数的结果，必须检查其对估计误差和现实交易条件是否稳健。<\/p>\n<ol>\n<li>明确资产池、基准、再平衡频率、目标函数和全部约束。<\/li>\n<li>记录收益、波动率与相关性的估计窗口和方法，并做扰动测试。<\/li>\n<li>比较等权、简单风险预算等基线，判断复杂模型是否提供稳定增量。<\/li>\n<li>加入换手、交易成本、最小交易单位、容量和再平衡偏离区间。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.jstor.org/stable/2975974\">Markowitz（1952）：Portfolio Selection<\/a>：均值—方差与分散化的奠基论文。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://people.duke.edu/~charvey/Teaching/BA453_2006/Black_Litterman_Global_Portfolio_Optimization_1992.pdf\">Black 与 Litterman：Global Portfolio Optimization<\/a>：市场均衡先验与主观观点的组合。<\/li>\n<li><strong>适用条件与边界<\/strong>：优化结果高度依赖预期收益、协方差、约束和再平衡成本；数学最优不等于经营上可执行。<\/li>\n<li><strong>主要失败模式<\/strong>：把噪声当精确输入导致极端权重，忽略参数不确定性、换手、税费和资产流动性。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>把预测均值当成精确输入；微小估计变化可能导致极端权重。<\/li>\n<li>只看静态有效前沿；真实组合还要经历再平衡成本和相关性突变。<\/li>\n<li>复杂模型不与简单基线比较；增加的参数可能只是在拟合历史噪声。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>输入估计方法和约束均可复现<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>完成参数与相关性扰动测试<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>与至少一个简单基线做成本后比较<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>权重集中度、换手和极端情景符合风险预算<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>目标风险用预测波动调整总仓位。<\/li>\n<li>波动控仓可能顺周期卖低买高。<\/li>\n<li>平滑、缓冲、杠杆上限与成本控制不可缺少。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>给定目标波动 10%，当前预测波动分别为 5%、10%、20%，计算缩放并加入 1.5 倍上限。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第086讲 机器学习在量化中扮演什么角色？绝非万能圣杯<\/strong>。<\/p>"}]}, {"no": 9, "name": "新刃·机器学习与AI", "desc": "揭开AI量化的面纱，从传统模型到深度学习，让非程序员也能听懂。", "chapters": [{"n": 86, "title": "机器学习在量化中扮演什么角色？绝非万能圣杯", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。机器学习模型会失效，历史预测表现不代表未来收益。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>明确机器学习在量化流程中的合适位置。<\/li>\n<li>区分预测目标与投资目标。<\/li>\n<li>建立基线、验证和成本三道门槛。<\/li>\n<\/ul>\n<h2>机器学习不是自动赚钱机<\/h2>\n<p>机器学习擅长从大量特征中拟合映射，但市场标签噪声高、分布变化、样本依赖强。模型能预测一个统计目标，不代表能形成成本后可交易收益。<\/p>\n<h2>四类角色<\/h2>\n<ul>\n<li>预测横截面相对收益或上涨概率。<\/li>\n<li>估计波动、流动性和交易成本。<\/li>\n<li>识别市场状态或异常。<\/li>\n<li>优化执行与订单选择。<\/li>\n<\/ul>\n<p>很多场景中，风险和成本预测比直接预测价格更稳定。<\/p>\n<h2>预测与决策分离<\/h2>\n<p>模型输出分数或概率，组合层还要处理权重、约束、风险和交易。分类准确率高也可能因错误样本亏损更大而失去投资价值。<\/p>\n<h2>三道门槛<\/h2>\n<p>先超过简单线性或排序基线；再通过滚动样本外和泄漏检查；最后在真实成本、容量和执行约束后仍有增量。<\/p>\n<h2>合理期待<\/h2>\n<p>机器学习常提供小幅边际改进，而不是替代数据质量、经济解释和风控。复杂度应由样本和可验证增量支付。<\/p>\n<h2>把模型放回完整投资链<\/h2>\n<p>一条机器学习策略至少经过六层：定义决策、构造标签、生成当时可得特征、训练模型、把预测转成组合、执行并监控。模型只负责其中“输入到预测”的一段。若标签与真实持有期不一致、组合层放大噪声或执行成本吞掉优势，模型指标再好也没有投资价值。<\/p>\n<p>因此，研究起点不应是“想用哪个算法”，而应是“要改善哪项决策”。例如，是判断证券相对排序、预测下一期波动、估计订单成交率，还是识别数据异常？任务越清楚，标签、损失和评价才越一致。<\/p>\n<h2>教学案例：准确率高却亏钱<\/h2>\n<p>假设分类器对大量小幅上涨预测正确，但在少数大跌样本上自信地给出买入信号。总体准确率可能很高，组合仍会因损失幅度不对称而亏损。再加入换手和滑点，结果可能进一步恶化。<\/p>\n<p>这说明预测层至少要观察概率校准、排序和不同损失区间；组合层还要检查仓位、尾部、换手和成本。准确率只回答“猜对多少次”，不回答“猜错时亏多少”。<\/p>\n<h2>三类必须击败的基线<\/h2>\n<p>第一类是无模型基线，例如不交易、持有基准或沿用当前规则；第二类是简单统计基线，例如历史均值、线性回归或简单排序；第三类是运营基线，即现有策略在同样成本和约束下的结果。复杂模型只有在相同数据、切分和执行条件下稳定超过这些基线，才提供了可验证增量。<\/p>\n<p>基线还有诊断作用：若深度模型只比“昨日值等于今日值”略好，新增复杂度可能不值得；若预测改进明显而组合没有改进，问题多半出在信号转换、风险或成本层。<\/p>\n<h2>建立模型价值账本<\/h2>\n<p>把模型带来的变化逐层记账：预测指标改善多少、排序收益增加多少、组合约束削减多少、交易成本消耗多少、压力期损失增加多少。这样能够定位价值究竟来自模型、数据、组合构建还是偶然样本。<\/p>\n<p>研究报告应同时保留失败实验与计算成本。若模型只在一个时期有效、需要频繁重训或难以在生产时限内完成，它的经营价值可能低于纸面收益。<\/p>\n<h2>何时不该使用机器学习<\/h2>\n<p>当样本少、目标不稳定、标签无法可靠构造、规则本来就清晰，或错误代价难以约束时，简单模型通常更合适。机器学习擅长逼近重复出现的统计结构，不能凭复杂度创造不存在的信息，也不能替代交易制度和经济机制判断。<\/p>\n<h2>机器学习实验：先守住时间边界<\/h2>\n<p>针对“机器学习在量化中扮演什么角色？绝非万能圣杯”建立一个时间序列机器学习实验。重点不是模型名称，而是标签、特征、切分、评价和上线监控是否与真实决策过程一致。<\/p>\n<ol>\n<li>定义预测时点、预测对象、标签窗口和可用特征截止时间。<\/li>\n<li>按时间切分训练、验证与测试数据；预处理、特征选择和调参只在允许的数据内完成。<\/li>\n<li>与朴素基线比较，并同时评价预测质量、排序质量、换手和成本后组合表现。<\/li>\n<li>上线前建立特征漂移、预测分布、暴露、延迟和模型失效监控。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://doi.org/10.6028/NIST.AI.100-1\">NIST AI Risk Management Framework 1.0<\/a>：AI 系统的治理、映射、度量与管理。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://scikit-learn.org/stable/common_pitfalls.html\">scikit-learn：Common pitfalls<\/a>：数据泄漏与训练、测试隔离。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://scikit-learn.org/stable/modules/generated/sklearn.model_selection.TimeSeriesSplit.html\">scikit-learn：TimeSeriesSplit<\/a>：保持时间顺序的验证切分。<\/li>\n<li><strong>适用条件与边界<\/strong>：金融数据非独立同分布且标签重叠；预测分数只有经过时间切分、成本和稳定性检验才有投资含义。<\/li>\n<li><strong>主要失败模式<\/strong>：随机切分时间序列、预处理泄漏、搜索过多超参数、忽略漂移和把可解释性当因果。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>随机打乱时间序列做交叉验证；这会把未来结构泄漏给过去。<\/li>\n<li>在全样本上标准化或筛选特征；预处理本身也必须只用训练数据拟合。<\/li>\n<li>预测误差更低就认为策略更好；投资决策还取决于排序、成本、约束和稳定性。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>标签窗口与特征截止时间无重叠泄漏<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>全部预处理封装在训练流程内<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>模型优于朴素基线且结果跨时期稳定<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>漂移、失效和回滚方案已定义<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>机器学习是量化工具箱的一部分，不是完整策略。<\/li>\n<li>预测输出必须经过组合与执行转成决策。<\/li>\n<li>简单基线、样本外和成本后增量是最低标准。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>选择一个模型任务，分别写出预测指标、投资指标和风险指标，说明三者为何不同。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第087讲 监督学习：分类与回归，如何让机器预测涨跌？<\/strong>。<\/p>"}, {"n": 87, "title": "监督学习：分类与回归，如何让机器预测涨跌？", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。机器学习模型会失效，历史预测表现不代表未来收益。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>区分分类与回归目标。<\/li>\n<li>设计无泄漏标签和时间切分。<\/li>\n<li>选择与投资结果一致的损失与评价。<\/li>\n<\/ul>\n<h2>两种监督任务<\/h2>\n<p>分类预测类别或概率，如未来收益是否为正；回归预测连续值，如未来 20 日收益或波动。标签由未来数据构造，但训练样本的特征只能来自决策时点之前。<\/p>\n<h2>标签设计<\/h2>\n<p>预测点收益噪声很大，可考虑横截面排名、超额收益、风险调整收益或带交易阈值的类别。标签窗口决定持有期和样本重叠。<\/p>\n<h2>损失函数不等于投资目标<\/h2>\n<p>均方误差惩罚数值偏差，交叉熵评价概率，但组合关心排序、收益、回撤和成本。模型选择应同时看统计指标与组合回测。<\/p>\n<h2>概率校准<\/h2>\n<p>分类模型 60% 输出应在相似样本中约有 60% 发生。校准影响仓位和阈值，准确率本身看不到信心质量。<\/p>\n<h2>时间验证<\/h2>\n<p>使用滚动训练、隔离重叠标签，并只在训练窗口做标准化和特征选择。随机拆分通常不适合金融时间序列。<\/p>\n<h2>先画清一条样本时间线<\/h2>\n<p>每个样本至少有三个时间段：特征观察期、决策时点和标签实现期。若在 (t) 时点决策，特征只能来自 (t) 时已经可得的信息；标签可以使用 (t) 之后的收益，但只能在训练阶段作为答案，不能回流到特征。<\/p>\n<p>例如预测未来 5 个交易日超额收益，标签区间是 (t+1) 到 (t+5)。相邻日期的标签大量重叠，样本并非五份独立证据。训练与验证边界应剔除会跨界使用未来价格的样本，并为实际成交延迟留出空间。<\/p>\n<h2>分类还是回归，由决策决定<\/h2>\n<p>若组合只需要判断是否超过交易成本门槛，分类任务可能更直接；若仓位随预期收益幅度变化，回归或排序目标可能更有用。把微小正收益和巨大正收益都标成“上涨”，会丢失幅度信息；直接回归原始收益又可能被极端值支配。<\/p>\n<p>可比较三种标签：方向分类、横截面分位分类和未来超额收益回归。它们分别强调方向、相对排序与幅度，没有一种对所有策略都最好。<\/p>\n<h2>标签必须对应真实可交易收益<\/h2>\n<p>标签起点要晚于信号生成和订单执行时点，并扣除不可避免的基准或持有期差异。若收盘后才能生成特征，就不能把当天收盘到次日收盘的全部收益当成可实现标签，除非交易机制确实支持相应成交。<\/p>\n<p>退市、停牌和缺失价格也不能简单删掉，因为删除困难样本会改变学习目标。应按生产规则定义结算或保守处理，并记录无法交易标签。<\/p>\n<h2>统计指标与投资指标的对应表<\/h2>\n<p>分类可看交叉熵、AUC、精确率和校准；回归可看绝对误差、平方误差和秩相关；投资层则看分组收益、IC、换手、成本后收益、回撤与暴露。不同指标回答不同问题，模型选择应预先指定主指标和否决条件。<\/p>\n<p>若模型的均方误差改善来自更准确预测大量接近零的样本，却没有改善头部与尾部排序，组合可能毫无变化。<\/p>\n<h2>概率如何变成仓位<\/h2>\n<p>模型输出 0.6 不应直接等于 60% 仓位。先在时间样本外检查：所有输出接近 0.6 的样本，事件实际发生比例是否接近 60%；再估计条件收益和错误成本，最后通过风险预算与仓位上限映射。<\/p>\n<p>校准器也必须只在训练或验证信息内拟合，并随时间滚动更新。若概率分布漂移，固定阈值会改变交易频率和风险暴露。<\/p>\n<h2>机器学习实验：先守住时间边界<\/h2>\n<p>针对“监督学习：分类与回归，如何让机器预测涨跌？”建立一个时间序列机器学习实验。重点不是模型名称，而是标签、特征、切分、评价和上线监控是否与真实决策过程一致。<\/p>\n<ol>\n<li>定义预测时点、预测对象、标签窗口和可用特征截止时间。<\/li>\n<li>按时间切分训练、验证与测试数据；预处理、特征选择和调参只在允许的数据内完成。<\/li>\n<li>与朴素基线比较，并同时评价预测质量、排序质量、换手和成本后组合表现。<\/li>\n<li>上线前建立特征漂移、预测分布、暴露、延迟和模型失效监控。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://doi.org/10.6028/NIST.AI.100-1\">NIST AI Risk Management Framework 1.0<\/a>：AI 系统的治理、映射、度量与管理。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://scikit-learn.org/stable/common_pitfalls.html\">scikit-learn：Common pitfalls<\/a>：数据泄漏与训练、测试隔离。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://scikit-learn.org/stable/modules/generated/sklearn.model_selection.TimeSeriesSplit.html\">scikit-learn：TimeSeriesSplit<\/a>：保持时间顺序的验证切分。<\/li>\n<li><strong>适用条件与边界<\/strong>：金融数据非独立同分布且标签重叠；预测分数只有经过时间切分、成本和稳定性检验才有投资含义。<\/li>\n<li><strong>主要失败模式<\/strong>：随机切分时间序列、预处理泄漏、搜索过多超参数、忽略漂移和把可解释性当因果。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>随机打乱时间序列做交叉验证；这会把未来结构泄漏给过去。<\/li>\n<li>在全样本上标准化或筛选特征；预处理本身也必须只用训练数据拟合。<\/li>\n<li>预测误差更低就认为策略更好；投资决策还取决于排序、成本、约束和稳定性。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>标签窗口与特征截止时间无重叠泄漏<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>全部预处理封装在训练流程内<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>模型优于朴素基线且结果跨时期稳定<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>漂移、失效和回滚方案已定义<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>分类预测概率，回归预测连续目标。<\/li>\n<li>标签窗口与交易持有期必须一致。<\/li>\n<li>统计损失和投资目标需同时评估。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为未来 5 日超额收益设计一个回归标签和一个三分类标签，并说明各自优缺点。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第088讲 特征工程：你喂给模型什么“饲料”决定了结果<\/strong>。<\/p>"}, {"n": 88, "title": "特征工程：你喂给模型什么“饲料”决定了结果", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。机器学习模型会失效，历史预测表现不代表未来收益。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解特征工程的时点、尺度和经济含义。<\/li>\n<li>处理横截面、时序和类别特征。<\/li>\n<li>用稳定性与增量而非数量选择特征。<\/li>\n<\/ul>\n<h2>特征决定模型看到的世界<\/h2>\n<p>价格、财务、分析师、宏观和另类数据需要变成固定时点可计算的输入。错误时间戳会让再强模型也只是学习未来。<\/p>\n<h2>常见处理<\/h2>\n<p>横截面特征常缩尾、标准化和行业中性；时序特征可用滚动变化、分位和波动标准化；类别变量可做编码，但要防止高基数与稀有类别泄漏。<\/p>\n<h2>缺失本身可能有信息<\/h2>\n<p>财报缺失、分析师不覆盖可能与公司类型相关。填补数值时可同时增加缺失标记，但填补统计只能来自训练数据。<\/p>\n<h2>特征冗余<\/h2>\n<p>数百个技术指标常由相同价格窗口派生。可用相关聚类、正则化和消融实验减少重复。特征越多，研究自由度越大。<\/p>\n<h2>特征生命线<\/h2>\n<p>为每个特征记录来源、可用时间、公式、频率、覆盖率、方向和漂移监控。上线后观察分布、缺失与预测贡献是否变化。<\/p>\n<h2>每个特征都需要一份时间契约<\/h2>\n<p>特征不是一列数字，而是“某个时点能够知道什么”的声明。至少记录事件时间、发布时间、系统入库时间和最早可交易时间。财务指标按报告期直接对齐价格，会把尚未公告的信息送入模型；宏观数据若忽略后续修订，也可能用今天版本重写过去。<\/p>\n<p>构造训练集时应使用 point-in-time 查询，并保存原始版本与处理版本。任何无法回答“当时是否真的可见”的特征，都不应进入正式回测。<\/p>\n<h2>横截面处理与时序处理不能混用<\/h2>\n<p>横截面标准化是在同一时点比较不同证券，回答“相对同伴处于什么位置”；时序标准化是在同一证券历史中比较当前与过去，回答“相对自身是否异常”。二者使用的信息集和经济含义不同。<\/p>\n<p>行业中性化、市值回归和分位数变换也应逐时点拟合。若使用全样本行业均值或未来证券池进行处理，就会产生泄漏与幸存者偏差。<\/p>\n<h2>把预处理封装进训练管道<\/h2>\n<p>缺失值填补、缩尾、标准化、类别编码、降维和特征选择都会从数据中学习参数。正确顺序是：在每个训练窗口拟合全部转换器，冻结后应用到验证期，再在下一窗口重新拟合。<\/p>\n<p>若先对全样本标准化再切分，即使模型从未直接看到未来标签，未来分布也已经进入早期样本。最安全的工程方式是把预处理与模型封装成同一个可版本化管道。<\/p>\n<h2>缺失值有三种不同含义<\/h2>\n<p>缺失可能是随机采集失败、制度上不适用，或具有经济含义的“不披露/不覆盖”。统一填零会把三者混为一谈。可以同时保留缺失标记、采用训练期统计填补，并按缺失原因和证券类型做切片验证。<\/p>\n<p>还要防止“未来补全”：数据库后来补入的历史字段在当时可能不存在。回测应使用当时版本，而不是今天看到的完整表。<\/p>\n<h2>特征选择看增量，不看故事数量<\/h2>\n<p>先按经济机制把特征分组，再进行逐组和逐项消融：移除某特征后，时间样本外的排序、成本后收益、稳定性和暴露如何变化？高度相关特征同时存在时，单个重要性可能在它们之间任意分配，因此应检查组级贡献。<\/p>\n<p>新增特征还要支付数据成本、计算延迟、维护复杂度和研究自由度。只有稳定增量覆盖这些成本，才值得进入生产。<\/p>\n<h2>上线后监控特征生命线<\/h2>\n<p>监控覆盖率、缺失率、分位数、极值、更新延迟、与训练期分布的差异，以及特征对预测和持仓的贡献。漂移本身不等于失效，但应触发数据审查、影子评估或降级到不依赖该特征的模型。<\/p>\n<h2>机器学习实验：先守住时间边界<\/h2>\n<p>针对“特征工程：你喂给模型什么“饲料”决定了结果”建立一个时间序列机器学习实验。重点不是模型名称，而是标签、特征、切分、评价和上线监控是否与真实决策过程一致。<\/p>\n<ol>\n<li>定义预测时点、预测对象、标签窗口和可用特征截止时间。<\/li>\n<li>按时间切分训练、验证与测试数据；预处理、特征选择和调参只在允许的数据内完成。<\/li>\n<li>与朴素基线比较，并同时评价预测质量、排序质量、换手和成本后组合表现。<\/li>\n<li>上线前建立特征漂移、预测分布、暴露、延迟和模型失效监控。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://doi.org/10.6028/NIST.AI.100-1\">NIST AI Risk Management Framework 1.0<\/a>：AI 系统的治理、映射、度量与管理。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://scikit-learn.org/stable/common_pitfalls.html\">scikit-learn：Common pitfalls<\/a>：数据泄漏与训练、测试隔离。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://scikit-learn.org/stable/modules/generated/sklearn.model_selection.TimeSeriesSplit.html\">scikit-learn：TimeSeriesSplit<\/a>：保持时间顺序的验证切分。<\/li>\n<li><strong>适用条件与边界<\/strong>：金融数据非独立同分布且标签重叠；预测分数只有经过时间切分、成本和稳定性检验才有投资含义。<\/li>\n<li><strong>主要失败模式<\/strong>：随机切分时间序列、预处理泄漏、搜索过多超参数、忽略漂移和把可解释性当因果。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>随机打乱时间序列做交叉验证；这会把未来结构泄漏给过去。<\/li>\n<li>在全样本上标准化或筛选特征；预处理本身也必须只用训练数据拟合。<\/li>\n<li>预测误差更低就认为策略更好；投资决策还取决于排序、成本、约束和稳定性。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>标签窗口与特征截止时间无重叠泄漏<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>全部预处理封装在训练流程内<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>模型优于朴素基线且结果跨时期稳定<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>漂移、失效和回滚方案已定义<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>特征工程首先是时间与语义治理。<\/li>\n<li>缺失、标准化和中性化都可能造成泄漏。<\/li>\n<li>特征应按稳定增量选择，而非越多越好。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为五个候选特征制作数据卡，并做逐项消融，记录样本外变化。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第089讲 决策树与随机森林：可解释、不易过拟合的利器<\/strong>。<\/p>"}, {"n": 89, "title": "决策树与随机森林：可解释、不易过拟合的利器", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。机器学习模型会失效，历史预测表现不代表未来收益。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解决策树的分裂与非线性。<\/li>\n<li>掌握随机森林的采样与平均。<\/li>\n<li>认识树模型的过拟合和解释边界。<\/li>\n<\/ul>\n<h2>决策树如何学习<\/h2>\n<p>树通过不断选择特征与阈值，把样本分成更纯的区域。它能表达非线性和交互，不要求特征标准化，但深树容易记住噪声。<\/p>\n<h2>随机森林<\/h2>\n<p>随机森林对样本做自助采样，每次分裂只考虑部分特征，再平均多棵树。随机性降低单树方差，对异常和非线性较稳健。<\/p>\n<h2>重要参数<\/h2>\n<p>树深、叶节点最小样本、树数量和特征采样比例决定偏差与方差。时间数据不能随意把未来样本混进 bootstrap 验证。<\/p>\n<h2>特征重要性<\/h2>\n<p>分裂重要性偏爱取值多的变量；置换重要性受相关特征影响。重要不代表因果，也不代表加入组合后有净收益。<\/p>\n<h2>金融应用<\/h2>\n<p>可用于收益排序、风险状态和成交概率。应比较线性基线、做时间样本外，并限制复杂度。随机森林“不易过拟合”只是相对单棵深树，不是免检。<\/p>\n<h2>一次分裂到底做了什么<\/h2>\n<p>决策树会遍历候选特征和阈值，寻找能让子节点标签更一致的切分。例如“波动率是否高于某阈值”可能把样本分成两个区域，再分别根据估值或动量继续分裂。最终叶节点给出平均收益、类别概率或排序分数。<\/p>\n<p>它的优势是自动表达阈值与交互，代价是切分不连续：输入轻微跨过阈值，预测可能突然跳变；数据稍变，整棵树的上层结构也可能重写。<\/p>\n<h2>随机森林怎样降低单树方差<\/h2>\n<p>每棵树使用有放回抽取的样本，并在每次分裂只查看一部分特征。不同树因此犯不同错误，平均后降低方差。树的数量增加通常让平均更稳定，但不能修复共同的数据泄漏、标签错误或市场漂移。<\/p>\n<p>金融时间样本存在自相关与标签重叠，普通行级 bootstrap 可能把非常相似的相邻样本分到不同集合。训练内部可以使用随机机制，最终评价仍必须在完整的未来时间块上进行。<\/p>\n<h2>复杂度由叶节点决定<\/h2>\n<p>深度、叶节点最小样本、每次分裂最小改进和特征采样比例共同决定容量。深树可以把少量异常样本单独分到叶节点，训练误差很低，却没有未来稳定性。<\/p>\n<p>调参时不要只看单折最佳值，应观察多个滚动时期的性能与叶节点覆盖。若关键叶节点只包含极少交易或集中于一个年份，它更像历史记忆而非可重复规律。<\/p>\n<h2>“可解释”不等于“因果”<\/h2>\n<p>分裂重要性会偏爱可切分点多或频繁使用的特征；置换重要性在相关特征间可能低估任何单项；局部解释只描述模型在该输入附近怎样计算。它们都不能证明改变特征会导致收益改变。<\/p>\n<p>更稳妥的解释流程是同时查看置换、分组消融、部分依赖或局部效应，并比较不同时间折的方向。若重要性排名频繁翻转，应把它视为模型不稳定信号。<\/p>\n<h2>教学实验：树模型是否真的提供增量<\/h2>\n<p>保持相同标签、特征和时间切分，比较线性模型、浅树、深树和随机森林。记录训练与验证差距、滚动折分布、预测换手、成本后组合表现和重要性稳定性。若随机森林只提高训练指标或依赖极深叶节点，就不能因为“用了集成”而判定稳健。<\/p>\n<h2>机器学习实验：先守住时间边界<\/h2>\n<p>针对“决策树与随机森林：可解释、不易过拟合的利器”建立一个时间序列机器学习实验。重点不是模型名称，而是标签、特征、切分、评价和上线监控是否与真实决策过程一致。<\/p>\n<ol>\n<li>定义预测时点、预测对象、标签窗口和可用特征截止时间。<\/li>\n<li>按时间切分训练、验证与测试数据；预处理、特征选择和调参只在允许的数据内完成。<\/li>\n<li>与朴素基线比较，并同时评价预测质量、排序质量、换手和成本后组合表现。<\/li>\n<li>上线前建立特征漂移、预测分布、暴露、延迟和模型失效监控。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://papers.ssrn.com/sol3/papers.cfm?abstract_id=2326253\">Bailey 等：The Probability of Backtest Overfitting<\/a>：多重试验与回测过拟合的量化框架。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://scikit-learn.org/stable/common_pitfalls.html\">scikit-learn：Common pitfalls<\/a>：数据泄漏与训练、测试隔离。<\/li>\n<li><strong>适用条件与边界<\/strong>：金融数据非独立同分布且标签重叠；预测分数只有经过时间切分、成本和稳定性检验才有投资含义。<\/li>\n<li><strong>主要失败模式<\/strong>：随机切分时间序列、预处理泄漏、搜索过多超参数、忽略漂移和把可解释性当因果。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>随机打乱时间序列做交叉验证；这会把未来结构泄漏给过去。<\/li>\n<li>在全样本上标准化或筛选特征；预处理本身也必须只用训练数据拟合。<\/li>\n<li>预测误差更低就认为策略更好；投资决策还取决于排序、成本、约束和稳定性。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>标签窗口与特征截止时间无重叠泄漏<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>全部预处理封装在训练流程内<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>模型优于朴素基线且结果跨时期稳定<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>漂移、失效和回滚方案已定义<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>树通过阈值分裂表达非线性与交互。<\/li>\n<li>随机森林以随机采样和平均降低方差。<\/li>\n<li>重要性不是因果，时间验证仍是核心。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>训练浅树与深树，比较训练、滚动验证和特征重要性稳定性。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第090讲 XGBoost与LightGBM：各种比赛冠军的非线性引擎<\/strong>。<\/p>"}, {"n": 90, "title": "XGBoost与LightGBM：各种比赛冠军的非线性引擎", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。机器学习模型会失效，历史预测表现不代表未来收益。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解梯度提升逐步纠错的机制。<\/li>\n<li>区分 XGBoost 与 LightGBM 的工程取向。<\/li>\n<li>用正则、早停和时间验证控制复杂度。<\/li>\n<\/ul>\n<h2>Boosting 的直觉<\/h2>\n<p>梯度提升不是并行平均独立树，而是逐轮训练新树去修正当前模型的误差。许多弱树相加形成强非线性模型。<\/p>\n<h2>XGBoost 与 LightGBM<\/h2>\n<p>两者都提供梯度提升、正则和缺失处理。XGBoost 强调正则化与通用树提升实现；LightGBM 采用高效直方图和叶子生长等工程设计，适合大规模特征。具体性能取决于数据与参数，不能只按名称选冠军。<\/p>\n<h2>关键控制<\/h2>\n<p>学习率与树数量联动；深度、叶节点样本、行列采样和正则决定复杂度。使用时间验证早停，不能用最终测试集决定轮数。<\/p>\n<h2>排名问题<\/h2>\n<p>横截面投资更关心排序，可使用适合排名的目标或直接评价 Rank IC 和分组收益。均方误差最小不必然给出最好组合。<\/p>\n<h2>风险<\/h2>\n<p>非线性模型能利用细微口径差异，也更容易学习数据供应商和时期特征。需要特征漂移、SHAP 等局部解释和消融检查。<\/p>\n<h2>Boosting 为什么与随机森林不同<\/h2>\n<p>随机森林并行训练许多相对独立的树再平均；Boosting 则串行增加弱学习器，每一轮更关注现有模型没有解释好的方向。最终预测是多棵小树的加和，因此能够逐步拟合复杂非线性与交互。<\/p>\n<p>这种“纠错”能力既是优势也是风险：若剩余误差主要是噪声，后续树会越来越努力地记住噪声。学习率、树复杂度、迭代轮数与早停共同决定何时停止。<\/p>\n<h2>XGBoost 与 LightGBM 的工程取舍<\/h2>\n<p>两者都属于梯度提升树家族，都支持正则化、缺失值处理和多种目标。实现细节、树生长方式、分箱与并行策略不同，会影响速度、内存和小样本行为。选择不应依据“比赛冠军”标签，而应在自己的数据量、稀疏度、时延和稳定性要求下测试。<\/p>\n<p>同一套超参数名称在不同实现中含义可能并不完全等价。迁移时应对齐数据、目标、随机种子、缺失规则和验证方式，而不是只比最终分数。<\/p>\n<h2>时间序列中的正确早停<\/h2>\n<p>早停需要一个位于训练期之后的验证窗口。模型在该窗口指标不再改善时停止迭代。若用最终测试集早停，测试信息已经参与模型选择；若随机抽取验证行，未来结构可能混入训练。<\/p>\n<p>滚动验证中每一折都可以独立确定最佳轮数，再根据折间分布选择保守轮数。不要从所有折里挑一个最高峰轮数并宣称它是稳定最优。<\/p>\n<h2>排名任务为何常见<\/h2>\n<p>选股往往关心同一时点谁相对更好，而不是准确预测每只证券的绝对收益。可以使用回归后排序，也可使用专门的排序目标。无论哪种方式，都要按日期分组，避免模型把不同时期的收益水平当成横截面差异。<\/p>\n<p>评价应包含 Rank IC、分组单调性、头尾组合收益、换手和暴露。排序指标提高，但头部组合成本后没有改善，说明预测增量没有转化为交易价值。<\/p>\n<h2>参数治理比搜索范围更重要<\/h2>\n<p>先限制树深或叶子数，再选择学习率与轮数，随后调整行列采样和正则。每扩大一次搜索空间都增加选择偏差，应保留试验日志，并用固定基线与最终保留集约束研究自由度。<\/p>\n<p>上线时保存模型文件、特征顺序、缺失约定、库版本和推理校验样本。预测完全一致只是最低要求，还要监控分数分布、叶节点覆盖、特征贡献和交易结果漂移。<\/p>\n<h2>机器学习实验：先守住时间边界<\/h2>\n<p>针对“XGBoost与LightGBM：各种比赛冠军的非线性引擎”建立一个时间序列机器学习实验。重点不是模型名称，而是标签、特征、切分、评价和上线监控是否与真实决策过程一致。<\/p>\n<ol>\n<li>定义预测时点、预测对象、标签窗口和可用特征截止时间。<\/li>\n<li>按时间切分训练、验证与测试数据；预处理、特征选择和调参只在允许的数据内完成。<\/li>\n<li>与朴素基线比较，并同时评价预测质量、排序质量、换手和成本后组合表现。<\/li>\n<li>上线前建立特征漂移、预测分布、暴露、延迟和模型失效监控。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://arxiv.org/abs/1603.02754\">Chen 与 Guestrin：XGBoost<\/a>：XGBoost 的算法与系统设计。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.microsoft.com/en-us/research/project/lightgbm/publications/\">Microsoft Research：LightGBM<\/a>：LightGBM 原论文与实现脉络。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://scikit-learn.org/stable/common_pitfalls.html\">scikit-learn：Common pitfalls<\/a>：数据泄漏与训练、测试隔离。<\/li>\n<li><strong>适用条件与边界<\/strong>：金融数据非独立同分布且标签重叠；预测分数只有经过时间切分、成本和稳定性检验才有投资含义。<\/li>\n<li><strong>主要失败模式<\/strong>：随机切分时间序列、预处理泄漏、搜索过多超参数、忽略漂移和把可解释性当因果。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>随机打乱时间序列做交叉验证；这会把未来结构泄漏给过去。<\/li>\n<li>在全样本上标准化或筛选特征；预处理本身也必须只用训练数据拟合。<\/li>\n<li>预测误差更低就认为策略更好；投资决策还取决于排序、成本、约束和稳定性。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>标签窗口与特征截止时间无重叠泄漏<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>全部预处理封装在训练流程内<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>模型优于朴素基线且结果跨时期稳定<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>漂移、失效和回滚方案已定义<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>梯度提升通过连续纠错形成强模型。<\/li>\n<li>两个框架的差异主要在算法与工程实现。<\/li>\n<li>早停、正则和时间验证决定样本外质量。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>固定数据，比较线性、随机森林和梯度提升的滚动 Rank IC、换手率与成本后收益。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第091讲 神经网络入门：就像堆积木一样理解深度学习<\/strong>。<\/p>"}, {"n": 91, "title": "神经网络入门：就像堆积木一样理解深度学习", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。机器学习模型会失效，历史预测表现不代表未来收益。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解神经元、层和反向传播。<\/li>\n<li>掌握容量、正则和数据规模关系。<\/li>\n<li>避免把深度当作金融优势。<\/li>\n<\/ul>\n<h2>像积木，但每块都有参数<\/h2>\n<p>神经元对输入加权求和并经过非线性激活；多层组合可以表达复杂函数。训练通过损失函数和反向传播更新权重。<\/p>\n<h2>为什么需要非线性<\/h2>\n<p>若所有层都只是线性变换，多层仍等价于一层。ReLU 等激活让网络表达阈值、交互和局部结构。<\/p>\n<h2>金融中的难点<\/h2>\n<p>参数可能远多于独立市场周期，标签噪声又高。图像中的海量相似样本不等同于金融时间序列的有效样本。<\/p>\n<h2>正则化<\/h2>\n<p>控制网络宽深、权重衰减、dropout、早停和输入降维。批归一化等技术要注意训练与推理统计及时间泄漏。<\/p>\n<h2>何时值得<\/h2>\n<p>高维文本、图像、订单簿或跨资产共享结构可能适合神经网络；少量日频因子未必胜过树和线性模型。先证明复杂模型有稳定增量。<\/p>\n<h2>一层网络怎样计算<\/h2>\n<p>每个神经元先计算输入的加权和与偏置，再经过激活函数。前一层的输出成为后一层输入，最后一层产生收益、概率或其他目标。训练时，损失函数衡量预测误差，反向传播计算每个参数应朝哪个方向调整，优化器再更新参数。<\/p>\n<p>网络深度增加了函数表达能力，也增加参数、训练不稳定和解释难度。若没有非线性激活，多层线性变换仍可合并为一次线性变换，并不会自动获得更强能力。<\/p>\n<h2>数据行数不等于有效样本数<\/h2>\n<p>一百万条高度重叠的分钟样本，可能来自很少几个市场制度；数千只股票同一天的收益也受共同因子驱动。神经网络需要的不是表格行数，而是覆盖足够多独立变化和未来环境的有效信息。<\/p>\n<p>因此应同时报告样本行数、时间跨度、资产数量、标签重叠程度和独立市场阶段。仅用“大数据量”证明深度模型合理，容易高估信息量。<\/p>\n<h2>从最小网络开始扩容<\/h2>\n<p>先建立线性模型和一层小网络，确认数据管道与损失方向正确；再逐步增加宽度、深度或专用结构，每次只改变少量因素并做消融。若复杂网络没有跨折稳定增量，就保留简单版本。<\/p>\n<p>参数数量也应记录。一个输入维度不高、样本期很短的任务若使用大量参数，即使有 dropout 和权重衰减，也可能只是在更灵活地拟合时期噪声。<\/p>\n<h2>正则化各自解决什么<\/h2>\n<p>权重衰减限制参数幅度，dropout 训练时随机屏蔽部分单元，早停在验证性能恶化前结束，批大小和数据增强则改变优化噪声与样本变化。它们降低某些过拟合风险，但不能修复泄漏、错误标签和分布突变。<\/p>\n<p>批归一化或其他使用批统计的层还要明确训练与推理行为。若一个批次混合未来时期或横跨不应共享信息的资产，统计量本身可能泄漏。<\/p>\n<h2>训练可复现与生产一致<\/h2>\n<p>固定数据快照、随机种子、初始化、库版本和硬件设置，并保存每轮训练与验证曲线。生产推理应使用与训练完全一致的特征顺序、缩放参数和缺失规则，再用一组黄金样本核对输出。<\/p>\n<p>即使数值不能逐位复现，也要确认结果分布和投资结论稳定。若模型对随机种子高度敏感，应把这种训练方差计入模型风险。<\/p>\n<h2>何时复杂结构值得付费<\/h2>\n<p>当输入确实包含文本、图像、订单簿或长序列等结构，且共享表示能在多个资产与任务间复用时，神经网络更有用。是否采用仍要由时间样本外增量、推理延迟、维护成本、解释需求和失败影响共同决定。<\/p>\n<h2>机器学习实验：先守住时间边界<\/h2>\n<p>针对“神经网络入门：就像堆积木一样理解深度学习”建立一个时间序列机器学习实验。重点不是模型名称，而是标签、特征、切分、评价和上线监控是否与真实决策过程一致。<\/p>\n<ol>\n<li>定义预测时点、预测对象、标签窗口和可用特征截止时间。<\/li>\n<li>按时间切分训练、验证与测试数据；预处理、特征选择和调参只在允许的数据内完成。<\/li>\n<li>与朴素基线比较，并同时评价预测质量、排序质量、换手和成本后组合表现。<\/li>\n<li>上线前建立特征漂移、预测分布、暴露、延迟和模型失效监控。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://doi.org/10.6028/NIST.AI.100-1\">NIST AI Risk Management Framework 1.0<\/a>：AI 系统的治理、映射、度量与管理。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://scikit-learn.org/stable/common_pitfalls.html\">scikit-learn：Common pitfalls<\/a>：数据泄漏与训练、测试隔离。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://scikit-learn.org/stable/modules/generated/sklearn.model_selection.TimeSeriesSplit.html\">scikit-learn：TimeSeriesSplit<\/a>：保持时间顺序的验证切分。<\/li>\n<li><strong>适用条件与边界<\/strong>：金融数据非独立同分布且标签重叠；预测分数只有经过时间切分、成本和稳定性检验才有投资含义。<\/li>\n<li><strong>主要失败模式<\/strong>：随机切分时间序列、预处理泄漏、搜索过多超参数、忽略漂移和把可解释性当因果。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>随机打乱时间序列做交叉验证；这会把未来结构泄漏给过去。<\/li>\n<li>在全样本上标准化或筛选特征；预处理本身也必须只用训练数据拟合。<\/li>\n<li>预测误差更低就认为策略更好；投资决策还取决于排序、成本、约束和稳定性。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>标签窗口与特征截止时间无重叠泄漏<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>全部预处理封装在训练流程内<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>模型优于朴素基线且结果跨时期稳定<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>漂移、失效和回滚方案已定义<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>神经网络用多层非线性变换拟合复杂函数。<\/li>\n<li>参数容量必须与有效样本和稳定周期匹配。<\/li>\n<li>复杂结构需要通过简单基线和样本外证明价值。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>计算一个两层网络的参数数量，并与训练样本和独立时间段数量比较。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第092讲 LSTM：长短期记忆网络怎么对付时间序列？<\/strong>。<\/p>"}, {"n": 92, "title": "LSTM：长短期记忆网络怎么对付时间序列？", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。机器学习模型会失效，历史预测表现不代表未来收益。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解循环网络与 LSTM 的状态机制。<\/li>\n<li>认识长依赖、窗口和训练困难。<\/li>\n<li>判断 LSTM 是否适合目标序列。<\/li>\n<\/ul>\n<h2>时间序列需要记忆<\/h2>\n<p>循环神经网络把上一时刻隐藏状态传给下一时刻，但长序列训练容易出现梯度消失或爆炸。LSTM 用遗忘、输入和输出门控制信息保留与更新。<\/p>\n<h2>门的直觉<\/h2>\n<p>遗忘门决定丢掉多少旧记忆，输入门决定写入多少新信息，输出门决定当前暴露多少状态。它提高学习长依赖的能力，但不保证市场存在稳定长记忆。<\/p>\n<h2>样本构造<\/h2>\n<p>滑动窗口会产生高度重叠样本，训练与验证边界需隔离。特征缩放只用训练期统计，隐藏状态在资产和批次间如何重置也要明确。<\/p>\n<h2>比较基线<\/h2>\n<p>LSTM 应与滞后线性、树模型、简单卷积或 Transformer 基线比较。若优势只来自使用更多历史窗口，未必是记忆结构本身。<\/p>\n<h2>风险<\/h2>\n<p>状态制度变化、训练不稳定和解释困难。金融中更长窗口不必然更有信息，模型可能记住时期标签。<\/p>\n<h2>LSTM 记住的是什么<\/h2>\n<p>LSTM 在每个时点接收当前输入、上一隐藏状态和上一记忆状态，再通过门控决定删除、写入与输出。它提供了一种学习时序依赖的参数化机制，但“能记忆”不等于“应该记忆”，更不等于市场存在长期稳定可预测性。<\/p>\n<p>若数据里最强模式是某一时期的波动水平或价格尺度，模型可能把制度标签当作记忆，而非学到可迁移关系。<\/p>\n<h2>窗口样本为何不独立<\/h2>\n<p>用过去 60 日预测未来 5 日时，相邻两个样本共享 59 日输入，标签也可能共享 4 日
