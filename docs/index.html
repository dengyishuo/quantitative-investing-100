法手册<\/a>：统计方法、假设与诊断的官方参考。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://web.stanford.edu/~wfsharpe/art/sr/sr.htm\">William Sharpe：The Sharpe Ratio<\/a>：夏普比率的定义、版本差异与适用限制。<\/li>\n<li><strong>适用条件与边界<\/strong>：公式依赖频率、分布、无风险利率和样本口径；非平稳、厚尾和自相关会破坏简单年化。<\/li>\n<li><strong>主要失败模式<\/strong>：只报一个漂亮指标，不报告分母、样本长度、置信区间和路径风险。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>混用日频、月频与年化结果；修正方法是让频率和年化系数显式化。<\/li>\n<li>只报告一个点估计；修正方法是同时查看样本期、分布、稳定性和极端值。<\/li>\n<li>把统计相关当成因果或可交易利润；还要验证时点、成本和样本外表现。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>公式中的每个变量都有定义和单位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>手算样本与程序结果一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>频率、年化和无风险收益率口径已写明<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>结论包含适用范围与不可解释部分<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>相关系数是样本内线性关系估计，不是永久属性。<\/li>\n<li>危机与共同因子会让表面分散失效。<\/li>\n<li>组合应按风险来源和风险贡献判断分散程度。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>假设两资产波动均为 20%、权重各 50%，分别计算相关性为 1、0 和 -0.5 时的组合波动。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第018讲 线性回归：找A和B的秘密关系，预测股价第一步<\/strong>。<\/p>"}, {"n": 18, "title": "线性回归：找A和B的秘密关系，预测股价第一步", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。公式与数字示例用于解释概念，不代表收益承诺。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解线性回归的系数、残差和拟合度。<\/li>\n<li>区分预测关系、因果关系与风险暴露。<\/li>\n<li>识别金融回归中的常见诊断问题。<\/li>\n<\/ul>\n<h2>一条线表达什么<\/h2>\n<p>简单线性回归写为：<\/p>\n<p>[\ny_t=\\alpha+\\beta x_t+\\varepsilon_t\n]<\/p>\n<p>(\\beta) 描述 (x) 变化一个单位时 (y) 的平均变化，(\\alpha) 是截距，(\\varepsilon) 是模型未解释部分。<\/p>\n<p>在资产定价中，用个股收益回归市场收益时，(\\beta) 可理解为市场暴露，(\\alpha) 是控制该暴露后的平均剩余收益，但不应自动解释为稳定能力。<\/p>\n<h2>最小二乘做了什么<\/h2>\n<p>普通最小二乘选择参数，使残差平方和最小。它对异常值敏感，并依赖线性、误差结构等假设。金融时间序列常有异方差和自相关，需要稳健标准误或其他模型。<\/p>\n<h2>(R^2) 不等于有用<\/h2>\n<p>高 (R^2) 只说明样本内解释比例高，不代表因果成立或样本外预测好。低 (R^2) 的信号在大样本和严格成本控制下也可能有价值。<\/p>\n<h2>三个危险<\/h2>\n<ul>\n<li><strong>遗漏变量<\/strong>：共同因素同时推动 (x) 和 (y)。<\/li>\n<li><strong>多重共线<\/strong>：多个特征高度相似，系数不稳定。<\/li>\n<li><strong>数据挖掘<\/strong>：尝试大量变量后只报告显著结果。<\/li>\n<\/ul>\n<h2>回归的正确用途<\/h2>\n<p>先画散点图与残差，再检查稳定性、异常点、滚动系数和样本外误差。回归是描述关系的起点，不是因果证明书。<\/p>\n<h2>用回归拆解策略收益，而不是给它贴金<\/h2>\n<p>假设双均线策略取得正收益。把策略超额收益对市场超额收益回归后，若 (\beta) 明显为正，说明相当一部分表现可能来自承担市场方向风险；截距 (alpha) 表示在该模型控制的风险之外，样本中的平均剩余部分。它不是“经理能力证书”，因为遗漏因子、样本选择和交易成本都可能改变结果。<\/p>\n<p>更有用的做法是比较费用前后、不同市场阶段和滚动窗口中的 (alpha) 与 (\beta)。若所谓 Alpha 只出现在牛市，或者加入风格因子后消失，就需要重新解释收益来源。<\/p>\n<h2>系数显著不等于经济上重要<\/h2>\n<p>大样本里很小的关系也可能统计显著，但扣除交易成本后没有经济价值；小样本里经济影响较大的系数又可能因噪声而不显著。研究报告应同时给出系数大小、估计不确定性、样本数和实际决策后果。<\/p>\n<p>例如，一个特征每变化一个标准差，只让预期收益增加极小幅度，即使回归表看起来漂亮，高换手也可能把优势全部吞掉。统计显著回答“这可能不是零吗”，经济显著回答“它值得交易吗”。<\/p>\n<h2>残差图比一张系数表更诚实<\/h2>\n<p>回归完成后应检查：残差是否随预测值变大而扩散，是否连续多期同方向，是否被少数极端点主导，系数在滚动窗口中是否稳定。漏斗形残差提示异方差，连续残差提示时间依赖，单个点改变整条回归线则说明模型过于脆弱。<\/p>\n<p>这些诊断不会自动修复模型，但能告诉研究者普通最小二乘的标准误和结论是否值得直接相信。<\/p>\n<h2>预测、解释与因果是三项任务<\/h2>\n<ul>\n<li><strong>预测<\/strong>关心样本外误差是否降低，即使变量没有因果含义。<\/li>\n<li><strong>解释<\/strong>关心目标与风险暴露如何共同变化。<\/li>\n<li><strong>因果<\/strong>关心干预一个变量是否会改变另一个变量，需要更强研究设计。<\/li>\n<\/ul>\n<p>一条回归线可以帮助完成前两项的一部分，不能仅凭相关样本完成第三项。写报告时先声明任务，才能选择正确的评价标准。<\/p>\n<h2>计算演练：公式之外还要核对口径<\/h2>\n<p>学习“线性回归：找A和B的秘密关系，预测股价第一步”时，真正容易出错的通常不是按计算器，而是频率、单位、样本和解释口径。完成下面的计算闭环，结果才可比较。<\/p>\n<ol>\n<li>先写变量定义、单位、时间频率与样本区间，再代入公式。<\/li>\n<li>用一个手算小样本验证方向、边界值和极端情形，确认实现没有符号或分母错误。<\/li>\n<li>再用完整数据计算，并同时报告样本数、缺失处理和年化假设。<\/li>\n<li>最后把数值翻译成投资含义，说明它能回答什么、不能回答什么。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nist.gov/programs-projects/nistsematech-engineering-statistics-handbook\">NIST/SEMATECH 统计方法手册<\/a>：统计方法、假设与诊断的官方参考。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://web.stanford.edu/~wfsharpe/art/sr/sr.htm\">William Sharpe：The Sharpe Ratio<\/a>：夏普比率的定义、版本差异与适用限制。<\/li>\n<li><strong>适用条件与边界<\/strong>：公式依赖频率、分布、无风险利率和样本口径；非平稳、厚尾和自相关会破坏简单年化。<\/li>\n<li><strong>主要失败模式<\/strong>：只报一个漂亮指标，不报告分母、样本长度、置信区间和路径风险。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>混用日频、月频与年化结果；修正方法是让频率和年化系数显式化。<\/li>\n<li>只报告一个点估计；修正方法是同时查看样本期、分布、稳定性和极端值。<\/li>\n<li>把统计相关当成因果或可交易利润；还要验证时点、成本和样本外表现。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>公式中的每个变量都有定义和单位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>手算样本与程序结果一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>频率、年化和无风险收益率口径已写明<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>结论包含适用范围与不可解释部分<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>回归把目标拆成可解释部分和残差。<\/li>\n<li>系数显著、高拟合度都不自动意味着因果或可交易。<\/li>\n<li>残差诊断、稳定性和样本外检验比单张系数表更重要。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>用一个资产收益率序列对市场收益率序列做回归，记录 Alpha、Beta 和 R²；再把样本分成两半，比较系数是否稳定。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第019讲 平稳性：为什么股价不能直接预测？差分是个魔术<\/strong>。<\/p>"}, {"n": 19, "title": "平稳性：为什么股价不能直接预测？差分是个魔术", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。公式与数字示例用于解释概念，不代表收益承诺。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解平稳性为何是时间序列建模基础。<\/li>\n<li>区分价格水平、收益率与价差的统计性质。<\/li>\n<li>避免伪回归和错误差分。<\/li>\n<\/ul>\n<h2>什么是平稳<\/h2>\n<p>弱平稳过程的均值、方差和自协方差结构不随时间改变。很多统计模型默认历史关系可以在未来继续估计，因此需要某种稳定性。<\/p>\n<h2>为什么价格水平常不能直接回归<\/h2>\n<p>许多资产价格具有趋势和单位根特征。两个互不相关的上升价格序列也可能得到很高 (R^2)，形成伪回归。看似显著的关系只是共同随时间增长。<\/p>\n<h2>差分与收益率<\/h2>\n<p>价格一阶差分 (P_t-P_{t-1}) 或对数差分 (\\ln P_t-\\ln P_{t-1}) 往往比价格水平更接近平稳。对数差分正是对数收益率。<\/p>\n<p>但不能为了通过检验而盲目差分。差分会移除长期信息；若两个非平稳序列存在稳定长期组合，应研究协整而不是分别过度差分。<\/p>\n<h2>如何检查<\/h2>\n<ul>\n<li>画水平、差分和滚动统计图。<\/li>\n<li>比较不同时间段的均值与方差。<\/li>\n<li>使用 ADF 等单位根检验，但不要只依赖一个 p 值。<\/li>\n<li>检查结构断点、季节性和制度变化。<\/li>\n<\/ul>\n<h2>金融含义<\/h2>\n<p>平稳不是“价格不会变化”，而是被建模对象的统计规律在研究区间内相对稳定。市场非平稳意味着模型必须滚动估计、监控漂移并保留失效机制。<\/p>\n<h2>一个伪回归是怎样产生的<\/h2>\n<p>设想两项互不相关、但长期都在增长的价格序列。因为它们都随时间上升，直接回归价格水平可能得到很高拟合度和看似显著的系数。模型捕捉到的可能只是“时间过去了”，而不是两项资产存在可交易关系。<\/p>\n<p>把价格转换为收益率后，共同趋势被移除，原来的关系可能消失。这并不说明收益率一定平稳，也不说明所有价格回归都错误；它说明建模前必须问序列的统计性质是否支持所用推断。<\/p>\n<h2>差分解决了什么，又拿走了什么<\/h2>\n<p>一阶差分关注相邻时点变化，常能削弱趋势，使均值和方差更稳定。代价是价格水平和长期关系被移除。若研究问题是预测短期变化，这可能合适；若研究两个价格之间的长期均衡，分别差分后只看短期变化可能丢掉最重要的信息。<\/p>\n<p>因此顺序应是先明确问题，再决定变换。不能把“通过单位根检验”当作唯一目标，更不能反复变换直到得到想要的 p 值。<\/p>\n<h2>平稳性不是一次性标签<\/h2>\n<p>某段历史内近似平稳的收益或价差，换到另一个制度、波动状态或样本区间后可能不再稳定。滚动均值、滚动方差和滚动自相关能帮助观察结构漂移；断点、交易规则变化和数据口径变化也应进入解释。<\/p>\n<p>对配对交易而言，价差历史上回归均值不等于永远回归。两家公司业务、资本结构或行业地位变化后，原有长期关系可能已经断裂。模型需要监控均值、波动和回归速度，而不是只在初始样本做一次检验。<\/p>\n<h2>从统计检查到交易决策<\/h2>\n<p>平稳性检验的输出不应直接变成买卖信号。还要确定估计窗口、开平仓阈值、关系失效时的退出方式、交易成本和极端价差情景。统计上缓慢回归的价差，可能在资金期限内根本无法兑现；理论上可回归的关系，也可能因无法做空或流动性不足而不可交易。<\/p>\n<h2>计算演练：公式之外还要核对口径<\/h2>\n<p>学习“平稳性：为什么股价不能直接预测？差分是个魔术”时，真正容易出错的通常不是按计算器，而是频率、单位、样本和解释口径。完成下面的计算闭环，结果才可比较。<\/p>\n<ol>\n<li>先写变量定义、单位、时间频率与样本区间，再代入公式。<\/li>\n<li>用一个手算小样本验证方向、边界值和极端情形，确认实现没有符号或分母错误。<\/li>\n<li>再用完整数据计算，并同时报告样本数、缺失处理和年化假设。<\/li>\n<li>最后把数值翻译成投资含义，说明它能回答什么、不能回答什么。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nist.gov/programs-projects/nistsematech-engineering-statistics-handbook\">NIST/SEMATECH 统计方法手册<\/a>：统计方法、假设与诊断的官方参考。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://web.stanford.edu/~wfsharpe/art/sr/sr.htm\">William Sharpe：The Sharpe Ratio<\/a>：夏普比率的定义、版本差异与适用限制。<\/li>\n<li><strong>适用条件与边界<\/strong>：公式依赖频率、分布、无风险利率和样本口径；非平稳、厚尾和自相关会破坏简单年化。<\/li>\n<li><strong>主要失败模式<\/strong>：只报一个漂亮指标，不报告分母、样本长度、置信区间和路径风险。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>混用日频、月频与年化结果；修正方法是让频率和年化系数显式化。<\/li>\n<li>只报告一个点估计；修正方法是同时查看样本期、分布、稳定性和极端值。<\/li>\n<li>把统计相关当成因果或可交易利润；还要验证时点、成本和样本外表现。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>公式中的每个变量都有定义和单位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>手算样本与程序结果一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>频率、年化和无风险收益率口径已写明<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>结论包含适用范围与不可解释部分<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>平稳性关心统计结构是否随时间稳定。<\/li>\n<li>直接回归非平稳价格容易得到伪关系。<\/li>\n<li>差分能改善稳定性，但可能丢失长期信息。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>选择两个长期上涨但业务无关的价格序列，比较价格水平回归与收益率回归的结果，并解释差异。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第020讲 概率思维：交易的本质是一场重复下注的赌局<\/strong>。<\/p>"}, {"n": 20, "title": "概率思维：交易的本质是一场重复下注的赌局", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。公式与数字示例用于解释概念，不代表收益承诺。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>用概率、期望和赔率理解重复交易。<\/li>\n<li>区分胜率、盈亏比与长期优势。<\/li>\n<li>建立条件概率和更新信念的习惯。<\/li>\n<\/ul>\n<h2>一笔交易无法证明策略<\/h2>\n<p>交易结果同时包含规则优势和随机波动。概率思维不问“这次一定赢吗”，而问“在相似条件重复发生时，结果分布如何”。<\/p>\n<h2>胜率不等于赚钱<\/h2>\n<p>每笔期望可写为：<\/p>\n<p>[\nE=P(win)\\times AvgWin-P(loss)\\times AvgLoss-Cost\n]<\/p>\n<p>胜率 80% 的策略若偶尔巨亏，期望仍可能为负；胜率 40% 的趋势策略若盈利远大于亏损，也可能有正期望。<\/p>\n<h2>大数定律需要条件<\/h2>\n<p>重复次数增加时，样本平均可能接近期望，但前提是分布相对稳定、样本依赖可控。市场规则会变化，因此“长期必然兑现”不能被机械理解。<\/p>\n<h2>条件概率与基准率<\/h2>\n<p>“出现信号后上涨概率 60%”只有在说明资产、周期、成本和市场状态后才有意义。先看基准率：如果所有时候上涨概率本来就是 58%，信号增量很小。<\/p>\n<h2>贝叶斯式更新<\/h2>\n<p>研究者应从初始信念出发，根据新证据逐步调整，而不是一次回测就从怀疑变成确信。样本越少、试验越多、假设越复杂，证据权重应越低。<\/p>\n<h2>风险来自分布而非单点<\/h2>\n<p>除期望外，还要看方差、偏度、尾部和连续亏损概率。正期望策略也可能经历长回撤，仓位必须保证能活到优势兑现。<\/p>\n<h2>把胜率、盈亏比和成本放进同一张表<\/h2>\n<p>考虑两个教学示意策略。策略 A 胜率 70%，平均盈利 1 元，平均亏损 2 元，忽略成本时单笔期望为 (0.7\\times1-0.3\\times2=0.1) 元。策略 B 胜率 40%，平均盈利 3 元，平均亏损 1 元，单笔期望为 (0.4\\times3-0.6\\times1=0.6) 元。高胜率并不自动带来更高期望。<\/p>\n<p>若每笔交易成本为 0.15 元，A 的期望会变为负值，B 仍为正。成本不是回测末尾统一减去的装饰，它会决定一个微弱统计优势能否转化为可交易优势。<\/p>\n<h2>正期望也可能长时间亏损<\/h2>\n<p>期望描述大量重复后的平均，不承诺短期顺序。即使每笔交易独立且胜率高于一半，也可能出现连续亏损；若策略收益具有状态依赖，连续亏损概率还会高于简单独立模型的直觉。<\/p>\n<p>这就是仓位管理存在的原因：研究者不能只证明“长期平均可能为正”，还要让账户承受得住优势迟迟没有兑现的路径。若几次连续亏损就导致退出，理论期望没有机会转化为实际结果。<\/p>\n<h2>基准率决定信号有没有增量<\/h2>\n<p>假设某市场在研究样本中有 58% 的月份上涨，而信号出现后的上涨比例为 60%。只报告“准确率 60%”听起来不错，与基准相比却只有 2 个百分点的增量。还需检查上涨月份的盈利幅度、下跌月份的损失、样本数量和交易成本。<\/p>\n<p>分类准确率只是结果的一种切片。真正的投资问题是条件分布如何变化，以及这种变化能否在仓位和成本约束下改善财富结果。<\/p>\n<h2>用更新代替一次性确信<\/h2>\n<p>一个新策略开始时应保持较低信任：先检查经济机制和数据，再看样本内结果，随后通过样本外、模拟交易和小规模运行逐步增加证据权重。若新证据与预期不一致，应降低信任或修改假设，而不是只寻找能够解释亏损的新故事。<\/p>\n<p>更新还要考虑试验次数。尝试了大量策略后出现一个优秀结果，其证据强度低于事先写下单一假设并得到同样结果。研究日志记录失败实验，正是为了让“我们试了多少次”进入判断。<\/p>\n<h2>概率思维的最终落点是行动<\/h2>\n<p>每个策略至少需要四个概率问题：在什么条件下有优势，结果分布多宽，最差路径会怎样，出现哪些新证据时应调整仓位或停止。概率不是替人给出确定答案，而是把“我不知道”转换成可以管理的范围。<\/p>\n<h2>计算演练：公式之外还要核对口径<\/h2>\n<p>学习“概率思维：交易的本质是一场重复下注的赌局”时，真正容易出错的通常不是按计算器，而是频率、单位、样本和解释口径。完成下面的计算闭环，结果才可比较。<\/p>\n<ol>\n<li>先写变量定义、单位、时间频率与样本区间，再代入公式。<\/li>\n<li>用一个手算小样本验证方向、边界值和极端情形，确认实现没有符号或分母错误。<\/li>\n<li>再用完整数据计算，并同时报告样本数、缺失处理和年化假设。<\/li>\n<li>最后把数值翻译成投资含义，说明它能回答什么、不能回答什么。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nist.gov/programs-projects/nistsematech-engineering-statistics-handbook\">NIST/SEMATECH 统计方法手册<\/a>：统计方法、假设与诊断的官方参考。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://web.stanford.edu/~wfsharpe/art/sr/sr.htm\">William Sharpe：The Sharpe Ratio<\/a>：夏普比率的定义、版本差异与适用限制。<\/li>\n<li><strong>适用条件与边界<\/strong>：公式依赖频率、分布、无风险利率和样本口径；非平稳、厚尾和自相关会破坏简单年化。<\/li>\n<li><strong>主要失败模式<\/strong>：只报一个漂亮指标，不报告分母、样本长度、置信区间和路径风险。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>混用日频、月频与年化结果；修正方法是让频率和年化系数显式化。<\/li>\n<li>只报告一个点估计；修正方法是同时查看样本期、分布、稳定性和极端值。<\/li>\n<li>把统计相关当成因果或可交易利润；还要验证时点、成本和样本外表现。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>公式中的每个变量都有定义和单位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>手算样本与程序结果一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>频率、年化和无风险收益率口径已写明<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>结论包含适用范围与不可解释部分<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>交易是重复下注问题，单次输赢不能验证策略。<\/li>\n<li>长期结果由胜率、盈亏比、成本和尾部共同决定。<\/li>\n<li>概率结论必须有基准率、条件和不确定区间。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>设计两个策略：一个高胜率低盈亏比，一个低胜率高盈亏比。为它们设定数字并计算期望，再讨论哪一个更难坚持。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第021讲 行情数据：OHLCV里藏着多少金矿？<\/strong>。<\/p>"}]}, {"no": 3, "name": "燃料·金融数据", "desc": "巧妇难为无米之炊，认识数据的种类、获取与清洗。", "chapters": [{"n": 21, "title": "行情数据：OHLCV里藏着多少金矿？", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。数据示例与方法需结合真实市场规则验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解 OHLCV 每个字段的来源与限制。<\/li>\n<li>识别 K 线聚合中的信息损失。<\/li>\n<li>建立行情数据质量检查清单。<\/li>\n<\/ul>\n<h2>一根 K 线是怎样形成的<\/h2>\n<p>OHLCV 分别是开盘价、最高价、最低价、收盘价和成交量。它把一个时间窗口内的逐笔交易压缩为五个数字，便于观察，却丢失了成交顺序、盘口深度和窗口内路径。<\/p>\n<h2>五个字段的真实含义<\/h2>\n<p>开盘价通常是窗口内第一笔有效成交，收盘价是最后一笔或交易所定义的收盘价格。最高、最低只告诉你边界，不告诉你先高后低还是先低后高。成交量要区分股数、手数和合约张数，跨市场比较还需统一成交额。<\/p>\n<h2>K 线里能提取什么<\/h2>\n<p>价格水平可构造收益率、缺口和区间波动率；高低价可用于真实波幅；成交量可描述活跃度和市场冲击。常见特征包括：<\/p>\n<p>[\n\\text{区间振幅}=\\frac{High-Low}{Close_{prev}}\n]<\/p>\n<p>但由同一 OHLCV 派生的大量指标往往高度重复，不等于创造了更多独立信息。<\/p>\n<h2>数据陷阱<\/h2>\n<ul>\n<li>停牌日、集合竞价和夜盘的定义不同。<\/li>\n<li>涨跌停时看到价格，不代表策略能成交。<\/li>\n<li>零成交与缺失值不能一律当作同一情况。<\/li>\n<li>不同供应商对坏点、复权和时区处理可能不同。<\/li>\n<li>日线数据无法真实还原盘中止损的触发先后顺序。<\/li>\n<\/ul>\n<h2>最低质量检查<\/h2>\n<p>检查 High 是否不低于 Open/Close、Low 是否不高于两者、成交量是否为负、时间是否重复、交易日历是否完整，并与第二数据源抽样核对。<\/p>\n<h2>同一根 K 线，可以有两条完全不同的路径<\/h2>\n<p>假设某日开盘价 100、最高价 110、最低价 90、收盘价 105。价格可能先跌到 90，再上涨到 110，最后回落到 105；也可能先涨到 110，再跌到 90，最后反弹到 105。两条路径的 OHLC 完全相同，但盘中止损、止盈和追单结果可能相反。<\/p>\n<p>因此，用日线回测“盘中触及 95 止损、触及 108 止盈”时，若同一天高低价同时跨过两条线，日线无法判断谁先发生。专业处理要么使用更细数据重建顺序，要么采用明确、保守且一致的成交规则，不能总选择对策略有利的路径。<\/p>\n<h2>成交量不是一个跨市场通用单位<\/h2>\n<p>成交量可能按股、手、张或其他合约单位记录。价格相同、成交量相同的两项资产，实际成交金额和可承载订单规模仍可能不同。跨资产比较活跃度时，常需要成交额、订单簿深度、买卖价差等信息，而不是直接比较 Volume 数字。<\/p>\n<p>零成交也不等于缺失：零成交可能表示市场开放但没有交易，缺失可能表示停牌、接口失败或数据尚未到达。若把两者都填成 0，系统就失去了判断“市场没有交易”和“我没有收到数据”的能力。<\/p>\n<h2>OHLCV 如何进入双均线策略<\/h2>\n<p>双均线通常只使用收盘价，但成交模拟还需要交易状态与下一时点可实现价格。若第 (t) 日收盘后形成信号，最早只能在随后可交易时点执行；如果第 (t+1) 日停牌或涨跌停无法成交，仓位不能按回测理想价格瞬间变化。<\/p>\n<p>建议把研究表拆成三组字段：用于计算的价格、用于成交模拟的价格、用于判断可交易性的状态。三者来自同一行情源也不能混为一列。<\/p>\n<h2>一条行情记录的四个时间<\/h2>\n<ol>\n<li><strong>事件时间<\/strong>：交易实际发生的时间。<\/li>\n<li><strong>交易所发布时间<\/strong>：行情对外发布的时间。<\/li>\n<li><strong>系统接收时间<\/strong>：研究或交易系统收到数据的时间。<\/li>\n<li><strong>策略可用时间<\/strong>：数据完成校验、允许进入决策的时间。<\/li>\n<\/ol>\n<p>低频研究常把四者压成一个日期，实盘交易却必须区分。没有这些时间，延迟数据可能被误当成实时数据，修订后的历史记录也可能被误当成当时已知事实。<\/p>\n<h2>数据审计：先证明当时真的看得到<\/h2>\n<p>围绕“行情数据：OHLCV里藏着多少金矿？”建立一张数据审计卡。目标不是把表填满，而是证明每个字段在决策时点真实可得、口径一致并可追溯。<\/p>\n<ol>\n<li>记录字段定义、来源、原始频率、发布时间、修订规则与授权范围。<\/li>\n<li>区分事件发生时间、数据发布时间、采集时间和策略可用时间。<\/li>\n<li>统计缺失、重复、异常和覆盖率，并保留原始值与清洗日志。<\/li>\n<li>用小样本从原始数据重建一个指标，核对复权、单位和时间对齐。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://pandas.pydata.org/docs/user_guide/index.html\">pandas 官方用户指南<\/a>：时间序列、缺失值与数据变换。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://scikit-learn.org/stable/common_pitfalls.html\">scikit-learn：Common pitfalls<\/a>：数据泄漏与训练、测试隔离。<\/li>\n<li><strong>适用条件与边界<\/strong>：数据许可、交易日历、公司行动和披露时点因市场而异；今天修订后的数据库不等于历史当时可见信息。<\/li>\n<li><strong>主要失败模式<\/strong>：使用后见修订数据、幸存股票池或错误复权，并把缺失值静默填充成不存在的事实。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用今天看到的历史数据假装当时已经可得；应使用 point-in-time 快照或发布时间约束。<\/li>\n<li>直接删除缺失值而不解释缺失机制；缺失本身可能包含选择偏差。<\/li>\n<li>只保存清洗后结果；没有原始快照和日志就无法复现与审计。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>每个核心字段有来源和更新时间<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>不存在使用未来修订值的前视偏差<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>缺失、异常、重复与退市样本均有处理记录<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>从原始数据到研究表的变换可以重放<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>OHLCV 是交易过程的压缩，不是完整市场状态。<\/li>\n<li>技术指标大量增加不代表独立信息增加。<\/li>\n<li>回测前必须检查价格逻辑、时间、成交和交易状态。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>任选一只资产的 30 根日 K，计算实体、上下影线、振幅和成交额，并找出异常值后回到原始行情核验。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第022讲 复权数据：前复权、后复权搞错了，策略直接报废<\/strong>。<\/p>"}, {"n": 22, "title": "复权数据：前复权、后复权搞错了，策略直接报废", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。数据示例与方法需结合真实市场规则验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>区分不复权、前复权与后复权。<\/li>\n<li>理解公司行动对价格与收益的影响。<\/li>\n<li>为研究和实盘交易选择一致口径。<\/li>\n<\/ul>\n<h2>为什么价格会“凭空腰斩”<\/h2>\n<p>分红、送股、拆分和配股会改变价格基准。如果直接使用原始收盘价，除权日可能被误判为巨大亏损或交易信号。<\/p>\n<h2>三种常见口径<\/h2>\n<ul>\n<li><strong>不复权<\/strong>：保留当时真实报价，适合订单和价格限制分析，但不能直接表示长期总回报。<\/li>\n<li><strong>前复权<\/strong>：通常保持最新价格不变，向历史调整，便于观察与当前价格衔接；新增公司行动后，过去数值可能改变。<\/li>\n<li><strong>后复权<\/strong>：保持早期价格不变，向后累积调整，适合展示财富增长，但数值不再等于当时成交价。<\/li>\n<\/ul>\n<p>不同供应商公式可能不同，必须阅读口径说明。<\/p>\n<h2>回测应该用哪一种<\/h2>\n<p>信号计算可以使用一致的总回报序列，但成交模拟应尽量使用当时真实可交易价格，并单独处理现金分红、股数变化和公司行动。只用一条复权价格同时负责信号和成交，容易引入不现实订单。<\/p>\n<h2>复权因子的时间问题<\/h2>\n<p>调整因子必须按当时已发生的公司行动生成。若数据接口回溯修改历史，研究结果可能难以复现。保存原始价、调整因子和数据版本比只保存复权价更安全。<\/p>\n<h2>检查方法<\/h2>\n<p>在除权日前后核对原始价格、复权价格、持仓股数和现金流，确认组合净值连续且总资产守恒。<\/p>\n<h2>用一次拆分看懂“价格变了，财富没变”<\/h2>\n<p>假设投资者持有 10 股、每股 100 元，总市值为 1000 元。若发生一拆二，理论上变为 20 股、每股约 50 元，总市值仍约为 1000 元。原始价格序列会从 100 跳到 50，但这不是 -50% 的经济损失。<\/p>\n<p>若策略直接在原始价上计算收益或均线，拆分日会制造巨大负收益并扭曲历史窗口。复权序列的任务，是让研究者看到公司行动前后可比较的经济价值；真实成交与持仓账本则仍要使用当时股数和报价。<\/p>\n<h2>信号价格与成交价格为什么要分开<\/h2>\n<p>研究层可以在总回报或一致复权口径上计算趋势，避免公司行动制造假信号；执行层必须依据当时真实可报单的价格、交易单位和持仓数量。若用后复权价格直接模拟订单，可能得到市场上从未出现过的成交价。<\/p>\n<p>可以把系统拆成两本账：研究账记录连续信号序列，交易账记录原始价格、股数变化、现金分红和真实订单。最终组合净值应由交易账计算，并与研究信号一一对应。<\/p>\n<h2>前复权为何会“改写历史”<\/h2>\n<p>前复权通常以较新的价格为锚，把调整向历史传播。新增一项公司行动后，过去的前复权数值可能整体变化。因此，今天重新下载十年前的前复权价格，不一定与去年保存的同一区间完全相同。<\/p>\n<p>这会影响可复现性：同一代码、同一参数，换一个下载日期可能得到不同均线和交易。解决办法不是拒绝修订，而是保存原始价、公司行动、调整因子、供应商版本和生成日期，使任何一版研究都能重建。<\/p>\n<h2>公司行动核对表<\/h2>\n<p>对每个事件至少核对：事件类型、公告时间、生效时间、权益登记规则、现金流、股数变化和调整因子。随后验证事件前后“价格 × 股数 + 现金”的总价值是否在合理范围内连续。若只检查图形是否平滑，错误因子也可能把曲线修得很好看。<\/p>\n<h2>数据审计：先证明当时真的看得到<\/h2>\n<p>围绕“复权数据：前复权、后复权搞错了，策略直接报废”建立一张数据审计卡。目标不是把表填满，而是证明每个字段在决策时点真实可得、口径一致并可追溯。<\/p>\n<ol>\n<li>记录字段定义、来源、原始频率、发布时间、修订规则与授权范围。<\/li>\n<li>区分事件发生时间、数据发布时间、采集时间和策略可用时间。<\/li>\n<li>统计缺失、重复、异常和覆盖率，并保留原始值与清洗日志。<\/li>\n<li>用小样本从原始数据重建一个指标，核对复权、单位和时间对齐。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://pandas.pydata.org/docs/user_guide/index.html\">pandas 官方用户指南<\/a>：时间序列、缺失值与数据变换。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://scikit-learn.org/stable/common_pitfalls.html\">scikit-learn：Common pitfalls<\/a>：数据泄漏与训练、测试隔离。<\/li>\n<li><strong>适用条件与边界<\/strong>：数据许可、交易日历、公司行动和披露时点因市场而异；今天修订后的数据库不等于历史当时可见信息。<\/li>\n<li><strong>主要失败模式<\/strong>：使用后见修订数据、幸存股票池或错误复权，并把缺失值静默填充成不存在的事实。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用今天看到的历史数据假装当时已经可得；应使用 point-in-time 快照或发布时间约束。<\/li>\n<li>直接删除缺失值而不解释缺失机制；缺失本身可能包含选择偏差。<\/li>\n<li>只保存清洗后结果；没有原始快照和日志就无法复现与审计。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>每个核心字段有来源和更新时间<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>不存在使用未来修订值的前视偏差<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>缺失、异常、重复与退市样本均有处理记录<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>从原始数据到研究表的变换可以重放<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>公司行动会改变价格基准，不处理会制造虚假收益。<\/li>\n<li>前复权便于连续观察，后复权便于累计展示，原始价用于真实成交。<\/li>\n<li>专业回测应分离信号口径与成交口径。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>找一个发生过分红或拆分的证券，对比三种价格序列，并手算公司行动前后持仓总价值。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第023讲 基本面数据：PE、PB、ROE等，在量化里怎么用？<\/strong>。<\/p>"}, {"n": 23, "title": "基本面数据：PE、PB、ROE等，在量化里怎么用？", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。数据示例与方法需结合真实市场规则验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解常见基本面指标的量化定义。<\/li>\n<li>正确处理财报发布时间和横截面可比性。<\/li>\n<li>把估值与质量信息转成可测试因子。<\/li>\n<\/ul>\n<h2>从故事到字段<\/h2>\n<p>PE、PB、ROE 等指标把企业经营压缩为可比较数字。PE 是市值相对盈利，PB 是市值相对净资产，ROE 衡量净利润相对股东权益。每个指标都有适用边界：亏损企业的 PE 缺乏正常解释，高杠杆可能抬高 ROE，金融与制造行业的资产结构也不同。<\/p>\n<h2>量化最关键的是“当时可得”<\/h2>\n<p>财报所属期不等于市场知道它的日期。回测应使用公告日或可用时间，不能在季度结束时提前使用尚未披露的数据。修订值、预告和正式报告也要区分版本。<\/p>\n<h2>三类常见因子<\/h2>\n<ul>\n<li><strong>估值<\/strong>：盈利收益率、账面市值比、自由现金流收益率。<\/li>\n<li><strong>质量<\/strong>：ROE、毛利率、现金流质量、盈利稳定性、杠杆。<\/li>\n<li><strong>成长<\/strong>：收入、利润和现金流增长，但要警惕低基数与一次性项目。<\/li>\n<\/ul>\n<h2>横截面处理<\/h2>\n<p>通常要按行业比较、对极端值缩尾、标准化并处理缺失。简单地把全市场 PE 排序，可能只是行业暴露。<\/p>\n<h2>从指标到组合<\/h2>\n<p>先定义股票池与再平衡时间，再用单因子排序形成分组，观察未来收益、换手率和行业偏离。随后才考虑多因子合成。因子含义应保持稳定，不能根据结果不断更换计算口径。<\/p>\n<h2>报告期、公告日和可交易日不是同一天<\/h2>\n<p>假设一份年度报告描述的是 12 月 31 日结束的经营年度，但公司在次年某日才公开披露。回测若从 12 月 31 日开始使用其中的利润和净资产，就提前获得了市场尚不知道的信息。正确做法是保留报告期、公告时间、供应商入库时间和策略实际可用时间，并让因子从随后可交易时点生效。<\/p>\n<p>同一报告还可能经历预告、快报、正式报告和更正。今天数据库里的“最终值”不一定是历史当时看到的版本。点时数据应能够回答：在某个历史日期，系统实际知道哪个版本。<\/p>\n<h2>用 ROE 看见口径背后的经济结构<\/h2>\n<p>ROE 高可能来自利润率高、资产周转快，也可能来自权益较少或杠杆较高。若只按 ROE 排序，策略可能买到高质量经营，也可能只是集中承担杠杆风险。因子构造应同时查看盈利质量、现金流、负债和行业结构，而不是把一个比例当作公司质量本身。<\/p>\n<p>PE 也有类似边界。盈利接近零时，PE 会变得极端；亏损企业的 PE 不能与正常盈利公司直接排序。处理方式必须事先定义，例如保留缺失类别、使用其他估值指标或限制适用股票池，不能根据回测结果临时调整。<\/p>\n<h2>从原始字段到因子的完整链条<\/h2>\n<blockquote>\n<p>原始报表字段 → 版本与时间对齐 → 派生指标 → 行业内比较 → 异常与缺失处理 → 标准化 → 组合权重<\/p>\n<\/blockquote>\n<p>每一步都可能改变因子含义。行业中性化减少行业结构影响，但也可能移除本来属于经济机制的一部分；缩尾降低极端值影响，但阈值若用全样本计算会泄漏未来。研究日志应保存每一步参数和影响行数。<\/p>\n<h2>一个基本面因子的验收问题<\/h2>\n<ul>\n<li>指标分子、分母和会计口径是否稳定？<\/li>\n<li>数据在调仓时点是否已公开并完成校验？<\/li>\n<li>亏损、负权益和缺失样本如何处理？<\/li>\n<li>收益是否只是行业、规模或市场暴露？<\/li>\n<li>加入披露延迟、交易成本和时点股票池后是否仍存在？<\/li>\n<li>口径轻微变化时，排序是否完全翻转？<\/li>\n<\/ul>\n<p>只有这些问题回答清楚，PE、PB 或 ROE 才从“报表数字”变成可检验因子。<\/p>\n<h2>数据审计：先证明当时真的看得到<\/h2>\n<p>围绕“基本面数据：PE、PB、ROE等，在量化里怎么用？”建立一张数据审计卡。目标不是把表填满，而是证明每个字段在决策时点真实可得、口径一致并可追溯。<\/p>\n<ol>\n<li>记录字段定义、来源、原始频率、发布时间、修订规则与授权范围。<\/li>\n<li>区分事件发生时间、数据发布时间、采集时间和策略可用时间。<\/li>\n<li>统计缺失、重复、异常和覆盖率，并保留原始值与清洗日志。<\/li>\n<li>用小样本从原始数据重建一个指标，核对复权、单位和时间对齐。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://pandas.pydata.org/docs/user_guide/index.html\">pandas 官方用户指南<\/a>：时间序列、缺失值与数据变换。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://scikit-learn.org/stable/common_pitfalls.html\">scikit-learn：Common pitfalls<\/a>：数据泄漏与训练、测试隔离。<\/li>\n<li><strong>适用条件与边界<\/strong>：数据许可、交易日历、公司行动和披露时点因市场而异；今天修订后的数据库不等于历史当时可见信息。<\/li>\n<li><strong>主要失败模式<\/strong>：使用后见修订数据、幸存股票池或错误复权，并把缺失值静默填充成不存在的事实。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用今天看到的历史数据假装当时已经可得；应使用 point-in-time 快照或发布时间约束。<\/li>\n<li>直接删除缺失值而不解释缺失机制；缺失本身可能包含选择偏差。<\/li>\n<li>只保存清洗后结果；没有原始快照和日志就无法复现与审计。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>每个核心字段有来源和更新时间<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>不存在使用未来修订值的前视偏差<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>缺失、异常、重复与退市样本均有处理记录<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>从原始数据到研究表的变换可以重放<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>基本面指标是经营信息的代理，不是公司价值本身。<\/li>\n<li>财报必须按公告可用时间进入回测。<\/li>\n<li>行业中性、异常值和缺失处理决定横截面可比性。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>选择 ROE，写出字段来源、公告时间、异常处理、行业比较和调仓规则，形成一张因子定义卡。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第024讲 另类数据：卫星图像、舆情分析、电商销量，你能用到的非传统信息<\/strong>。<\/p>"}, {"n": 24, "title": "另类数据：卫星图像、舆情分析、电商销量，你能用到的非传统信息", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。数据示例与方法需结合真实市场规则验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解另类数据的价值链与成本。<\/li>\n<li>区分数据新颖性和可交易增量。<\/li>\n<li>识别隐私、授权和时间戳风险。<\/li>\n<\/ul>\n<h2>什么是另类数据<\/h2>\n<p>相对传统行情与财报，卫星图像、招聘信息、网页访问、应用活跃、物流、电商销量、文本舆情和链上活动等常被称为另类数据。它们可能更及时或更细颗粒，但通常更脏、更贵、更难解释。<\/p>\n<h2>从原始数据到信号的五步<\/h2>\n<ol>\n<li>获取合法授权且持续可用的数据。<\/li>\n<li>将图片、文本或事件转成结构化特征。<\/li>\n<li>对齐实体，例如把门店、品牌映射到上市公司。<\/li>\n<li>确认数据产生、发布和可获取时间。<\/li>\n<li>检验其在传统因子之外是否有增量。<\/li>\n<\/ol>\n<p>任何一步失败，都可能把“新数据”变成昂贵噪声。<\/p>\n<h2>舆情例子<\/h2>\n<p>情绪模型输出正负分数不等于交易信号。需要处理转发重复、机器人账号、语言反讽、公司别名和新闻发生时间。更重要的是判断市场是否已经定价。<\/p>\n<h2>三类风险<\/h2>\n<ul>\n<li><strong>选择偏差<\/strong>：供应商只展示成功案例或历史覆盖不断变化。<\/li>\n<li><strong>数据漂移<\/strong>：平台规则、用户结构和采样方式变化。<\/li>\n<li><strong>合规风险<\/strong>：隐私、版权、用户授权和跨境使用边界不清。<\/li>\n<\/ul>\n<h2>评估框架<\/h2>\n<p>比较加入数据前后的样本外表现、换手率、容量和稳定性，并计算数据成本与工程维护成本。另类数据的价值不在“另类”，而在是否带来持续、合法、可执行的增量信息。<\/p>\n<h2>一条“及时信息”是怎样失去及时性的<\/h2>\n<p>假设研究者使用招聘信息判断企业扩张。职位发布发生在某日，但爬虫可能数日后才抓到；平台会修改或删除页面，供应商还可能在月底统一回补历史数据。若回测使用回补后的完整职位列表，并把所有记录放回最初发布日期，就假设系统当时已经看到了后来才收集的数据。<\/p>\n<p>因此另类数据至少需要三个时间：原始事件发生时间、供应商首次观测时间、策略完成处理后的可用时间。最早时间不一定是最真实的决策时间。<\/p>\n<h2>实体映射往往比模型更难<\/h2>\n<p>电商品牌、门店、应用名称和上市公司代码之间不是简单一一对应。一个品牌可能属于集团子公司，一家上市公司也可能经营多个品牌；并购、改名和地区授权又会改变映射。若今天的集团关系回填到过去，就可能产生后见偏差。<\/p>\n<p>实体映射表应带生效区间、来源和置信度。无法确定归属的数据宁可单独保留，也不要为了提高覆盖率强行匹配。错误映射会产生看似精确、实则不可解释的信号。<\/p>\n<h2>新数据是否真的提供增量<\/h2>\n<p>另类数据经常只是传统信息的昂贵代理。例如招聘增加可能与已经公开的收入增长、行业景气或股价动量高度相关。检验时先建立只使用传统因子的基线，再加入另类特征，比较样本外增量、稳定性、换手和成本。<\/p>\n<p>如果提升只存在于特定供应商回溯样本，或扣除数据采购与工程维护后不再有经济价值，新颖性就没有转化为投资能力。<\/p>\n<h2>合规应进入特征生命周期<\/h2>\n<p>数据合法取得并不自动意味着可以无限期、跨用途使用。研究前要记录授权范围、个人信息处理、保存期限、跨境限制和删除机制；供应商变更条款时，还要知道哪些模型和历史结果受到影响。<\/p>\n<p>另类数据的停用标准也应提前定义：覆盖率骤降、采样机制变化、实体映射失效、授权不再明确，或样本外增量持续消失。数据源失效时，策略不能继续把旧特征当作同一种信息。<\/p>\n<h2>数据审计：先证明当时真的看得到<\/h2>\n<p>围绕“另类数据：卫星图像、舆情分析、电商销量，你能用到的非传统信息”建立一张数据审计卡。目标不是把表填满，而是证明每个字段在决策时点真实可得、口径一致并可追溯。<\/p>\n<ol>\n<li>记录字段定义、来源、原始频率、发布时间、修订规则与授权范围。<\/li>\n<li>区分事件发生时间、数据发布时间、采集时间和策略可用时间。<\/li>\n<li>统计缺失、重复、异常和覆盖率，并保留原始值与清洗日志。<\/li>\n<li>用小样本从原始数据重建一个指标，核对复权、单位和时间对齐。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://pandas.pydata.org/docs/user_guide/index.html\">pandas 官方用户指南<\/a>：时间序列、缺失值与数据变换。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://scikit-learn.org/stable/common_pitfalls.html\">scikit-learn：Common pitfalls<\/a>：数据泄漏与训练、测试隔离。<\/li>\n<li><strong>适用条件与边界<\/strong>：数据许可、交易日历、公司行动和披露时点因市场而异；今天修订后的数据库不等于历史当时可见信息。<\/li>\n<li><strong>主要失败模式<\/strong>：使用后见修订数据、幸存股票池或错误复权，并把缺失值静默填充成不存在的事实。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用今天看到的历史数据假装当时已经可得；应使用 point-in-time 快照或发布时间约束。<\/li>\n<li>直接删除缺失值而不解释缺失机制；缺失本身可能包含选择偏差。<\/li>\n<li>只保存清洗后结果；没有原始快照和日志就无法复现与审计。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>每个核心字段有来源和更新时间<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>不存在使用未来修订值的前视偏差<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>缺失、异常、重复与退市样本均有处理记录<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>从原始数据到研究表的变换可以重放<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>另类数据需要经过获取、结构化、实体映射、时间对齐和增量检验。<\/li>\n<li>新颖不等于有效，工程与合规成本可能超过收益。<\/li>\n<li>数据漂移和授权边界必须持续监控。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为“招聘信息预测公司增长”设计研究方案，列出标签、时间戳、实体映射、混杂因素和合规检查。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第025讲 数据清洗：缺失值、异常值，垃圾进垃圾出的惨剧<\/strong>。<\/p>"}, {"n": 25, "title": "数据清洗：缺失值、异常值，垃圾进垃圾出的惨剧", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。数据示例与方法需结合真实市场规则验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>建立缺失、异常和重复数据的处理流程。<\/li>\n<li>区分真实市场事件与采集错误。<\/li>\n<li>让清洗规则可复现、可审计。<\/li>\n<\/ul>\n<h2>垃圾进，垃圾出<\/h2>\n<p>模型不会自动识别输入是否合理。一个错位日期、重复记录或错误单位，可能比参数选择更影响结果。<\/p>\n<h2>缺失值不是一种东西<\/h2>\n<p>缺失可能来自停牌、尚未上市、接口失败、公司不适用或真实零值。先标记原因，再决定删除、前向填充、插值或保留缺失。对价格无条件前向填充会制造可以成交的假象。<\/p>\n<h2>异常值先核验再处理<\/h2>\n<p>极端收益可能是复权错误，也可能是真实跳空。可用业务规则、横截面分位、时间序列变化和第二数据源交叉核对。缩尾会降低统计影响，但不应掩盖真实尾部风险。<\/p>\n<h2>重复与键设计<\/h2>\n<p>为数据定义唯一键，例如“证券—交易时间—数据版本”。检查重复、乱序和时区；合并多源数据时明确优先级，不能静默覆盖。<\/p>\n<h2>可审计清洗管线<\/h2>\n<p>保留原始只读层、标准化层和研究特征层；每次处理记录规则、影响行数和版本。质量报告至少包括覆盖率、缺失率、异常率、最新时间和跨源差异。<\/p>\n<h2>防止信息泄漏<\/h2>\n<p>标准化、填补和异常阈值若使用全样本统计，也会偷看未来。滚动研究必须只用训练窗口估计清洗参数。<\/p>\n<h2>同一个 NaN，可能代表四种世界<\/h2>\n<p>某只证券某日没有收盘价，至少可能因为：尚未上市、停牌、数据接口失败，或该字段本来就不适用。这四种原因对应完全不同的处理。尚未上市不能前向填充，停牌期间填充价格也不能假设可以成交，接口失败应触发补数或阻断流程，不适用字段则应保留业务含义。<\/p>\n<p>因此缺失处理最好先生成原因码，再决定动作。直接 <code>dropna<\/code> 会系统性删除困难样本，直接填 0 会创造不存在的经济事实，直接前向填充又可能把旧信息伪装成新数据。<\/p>\n<h2>一个“异常涨幅”的排查顺序<\/h2>\n<p>发现单日价格变化异常时，可以按顺序检查：证券代码是否映射错误、单位是否变化、是否发生拆分或分红、时间戳是否错位、供应商是否重复或漏记录，最后才判断是否为真实市场跳跃。若真实极端事件被缩尾，它在风险模型里就消失了；若复权错误被保留，它又会污染均值、波动和信号。<\/p>\n<p>异常值处理应分成两列：原始观测和研究用值，并记录原因、规则、操作者或程序版本。这样既能控制模型影响，又不会抹掉证据。<\/p>\n<h2>清洗规则本身也需要训练集边界<\/h2>\n<p>假设用全样本均值和标准差判断早期数据的异常，阈值就包含了未来信息；用全样本中位数填补早期缺失也有同样问题。时间序列研究应只用当时训练窗口估计填补、标准化和缩尾参数，再把规则应用到随后数据。<\/p>\n<p>在机器学习管线中，清洗、特征变换和模型应作为同一训练流程拟合。先对全数据清洗再切分训练测试，可能在模型训练前就已经泄漏未来。<\/p>\n<h2>可审计清洗日志应该写什么<\/h2>\n<p>每次运行至少记录输入版本、规则版本、处理前后行数、各原因缺失数量、异常标记数量、重复键数量、跨源差异和输出校验值。清洗失败时不要覆盖上一成功版本；需要保留失败日志和隔离数据，方便复盘。<\/p>\n<p>质量门槛应能阻止下游运行。例如关键资产覆盖率突然下降、最新日期落后或唯一键冲突时，系统应拒绝更新特征，而不是带着警告继续生成订单。<\/p>\n<h2>数据审计：先证明当时真的看得到<\/h2>\n<p>围绕“数据清洗：缺失值、异常值，垃圾进垃圾出的惨剧”建立一张数据审计卡。目标不是把表填满，而是证明每个字段在决策时点真实可得、口径一致并可追溯。<\/p>\n<ol>\n<li>记录字段定义、来源、原始频率、发布时间、修订规则与授权范围。<\/li>\n<li>区分事件发生时间、数据发布时间、采集时间和策略可用时间。<\/li>\n<li>统计缺失、重复、异常和覆盖率，并保留原始值与清洗日志。<\/li>\n<li>用小样本从原始数据重建一个指标，核对复权、单位和时间对齐。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://pandas.pydata.org/docs/user_guide/index.html\">pandas 官方用户指南<\/a>：时间序列、缺失值与数据变换。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://scikit-learn.org/stable/common_pitfalls.html\">scikit-learn：Common pitfalls<\/a>：数据泄漏与训练、测试隔离。<\/li>\n<li><strong>适用条件与边界<\/strong>：数据许可、交易日历、公司行动和披露时点因市场而异；今天修订后的数据库不等于历史当时可见信息。<\/li>\n<li><strong>主要失败模式<\/strong>：使用后见修订数据、幸存股票池或错误复权，并把缺失值静默填充成不存在的事实。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用今天看到的历史数据假装当时已经可得；应使用 point-in-time 快照或发布时间约束。<\/li>\n<li>直接删除缺失值而不解释缺失机制；缺失本身可能包含选择偏差。<\/li>\n<li>只保存清洗后结果；没有原始快照和日志就无法复现与审计。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>每个核心字段有来源和更新时间<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>不存在使用未来修订值的前视偏差<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>缺失、异常、重复与退市样本均有处理记录<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>从原始数据到研究表的变换可以重放<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>缺失和异常必须按业务原因分类。<\/li>\n<li>原始数据应保留，清洗过程要版本化并记录影响。<\/li>\n<li>清洗参数本身也可能造成未来信息泄漏。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>设计一张行情数据质量报告，至少包含完整性、唯一性、逻辑一致性、及时性和跨源一致性五类指标。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第026讲 幸存者偏差：你回测时看不到的那些退市股<\/strong>。<\/p>"}, {"n": 26, "title": "幸存者偏差：你回测时看不到的那些退市股", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。数据示例与方法需结合真实市场规则验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解幸存者偏差如何夸大历史表现。<\/li>\n<li>构建包含退市与历史成分的数据集。<\/li>\n<li>识别产品和案例展示中的幸存者叙事。<\/li>\n<\/ul>\n<h2>你看见的市场不是过去的市场<\/h2>\n<p>今天仍在交易的公司通常经历了筛选。若用当前股票列表回测十年前策略，已经提前排除了后来退市、破产或被长期停牌的失败者。<\/p>\n<h2>偏差如何进入回测<\/h2>\n<ul>\n<li>用当前指数成分回测历史指数策略。<\/li>\n<li>只下载当前数据库仍有代码的证券。<\/li>\n<li>忽略退市前最后价格和退市现金流。<\/li>\n<li>只分析仍在运营的基金或策略产品。<\/li>\n<\/ul>\n<p>这些做法会抬高收益、降低回撤并高估可交易性。<\/p>\n<h2>正确的时点股票池<\/h2>\n<p>每个历史日期都应使用当时已上市、满足条件且可交易的证券，保存上市、退市、停牌和公司行动记录。指数策略需要历史成分及生效日，而不是今天的成员名单。<\/p>\n<h2>退市处理<\/h2>\n<p>退市不等于最后一个收盘价后资产凭空消失。需要根据真实规则处理现金结算、换股、破产损失或缺失价格，并做保守假设和敏感性分析。<\/p>\n<h2>更广义的幸存者偏差<\/h2>\n<p>成功基金被媒体反复报道，失败策略悄悄关闭；公开策略库也会删除表现差的版本。研究时应追问“哪些失败样本没有进入数据”。<\/p>\n<h2>一个被“今天名单”美化的策略<\/h2>\n<p>假设研究者今天选出仍在交易的 100 只股票，再把它们的历史价格向前回溯十年。这个样本提前知道了谁能活到今天，已经排除了期间退市、破产或长期失去流动性的公司。即使策略规则没有直接使用未来价格，股票池本身已经泄漏了未来。<\/p>\n<p>这类偏差往往同时美化三个维度：失败资产被删除使平均收益上升，极端损失减少使回撤下降，无法成交的样本消失又让流动性看起来更好。策略越偏好便宜、困境或小市值资产，影响可能越大。<\/p>\n<h2>时点股票池需要哪些事件<\/h2>\n<p>每个历史日期至少要知道证券何时上市、何时退市、何时停牌、何时进入或离开指数，以及筛选条件所用信息何时可得。指数成分还要使用调整生效日，不能把今天公布的成分变化提前应用到过去。<\/p>\n<p>股票池生成最好输出“入池原因”和“出池原因”，让研究者能解释某只证券为何在某日出现或消失。若一只证券只是因为数据缺失而被静默删掉，系统应将其视为质量问题，而不是自动当作不符合策略条件。<\/p>\n<h2>退市不是一条价格序列的自然终点<\/h2>\n<p>回测若在最后一个可见价格处结束持仓，会假设投资者可以无摩擦退出。真实处置可能涉及停牌、现金结算、换股、延迟支付或大幅损失。不同市场规则不同，无法获得完整信息时应使用保守情景并披露敏感性。<\/p>\n<p>组合账本还要处理退市期间资金是否被冻结、何时可重新使用。只修正最终损失而忽略资金占用，也会高估策略周转能力。<\/p>\n<h2>幸存者偏差也发生在策略研究里<\/h2>\n<p>团队可能试验许多策略，只保留成功代码；平台只展示仍在运行的产品；作者只发表表现好的参数。即使证券数据完整，研究成果仍然可能被“删除失败者”美化。<\/p>\n<p>所以研究日志应记录所有主要实验、停用策略和参数版本。完整的失败记录不是负担，而是估计选择偏差所需的数据。<\/p>\n<h2>数据审计：先证明当时真的看得到<\/h2>\n<p>围绕“幸存者偏差：你回测时看不到的那些退市股”建立一张数据审计卡。目标不是把表填满，而是证明每个字段在决策时点真实可得、口径一致并可追溯。<\/p>\n<ol>\n<li>记录字段定义、来源、原始频率、发布时间、修订规则与授权范围。<\/li>\n<li>区分事件发生时间、数据发布时间、采集时间和策略可用时间。<\/li>\n<li>统计缺失、重复、异常和覆盖率，并保留原始值与清洗日志。<\/li>\n<li>用小样本从原始数据重建一个指标，核对复权、单位和时间对齐。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://pandas.pydata.org/docs/user_guide/index.html\">pandas 官方用户指南<\/a>：时间序列、缺失值与数据变换。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://scikit-learn.org/stable/common_pitfalls.html\">scikit-learn：Common pitfalls<\/a>：数据泄漏与训练、测试隔离。<\/li>\n<li><strong>适用条件与边界<\/strong>：数据许可、交易日历、公司行动和披露时点因市场而异；今天修订后的数据库不等于历史当时可见信息。<\/li>\n<li><strong>主要失败模式<\/strong>：使用后见修订数据、幸存股票池或错误复权，并把缺失值静默填充成不存在的事实。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用今天看到的历史数据假装当时已经可得；应使用 point-in-time 快照或发布时间约束。<\/li>\n<li>直接删除缺失值而不解释缺失机制；缺失本身可能包含选择偏差。<\/li>\n<li>只保存清洗后结果；没有原始快照和日志就无法复现与审计。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>每个核心字段有来源和更新时间<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>不存在使用未来修订值的前视偏差<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>缺失、异常、重复与退市样本均有处理记录<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>从原始数据到研究表的变换可以重放<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>用当前存续证券回看历史会系统性美化结果。<\/li>\n<li>时点股票池和历史成分是可靠回测的基础。<\/li>\n<li>幸存者偏差也存在于基金、策略和案例展示中。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>检查你使用的数据源是否提供退市证券和历史指数成分；若没有，写出回测结果最可能被影响的三个方向。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第027讲 数据频率抉择：Tick、分钟、日线，不同频率对策略的致命影响<\/strong>。<\/p>"}, {"n": 27, "title": "数据频率抉择：Tick、分钟、日线，不同频率对策略的致命影响", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。数据示例与方法需结合真实市场规则验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解 Tick、分钟和日线数据能回答的不同问题。<\/li>\n<li>根据信号半衰期选择频率。<\/li>\n<li>识别高频数据带来的微观结构与成本问题。<\/li>\n<\/ul>\n<h2>更细不等于更好<\/h2>\n<p>Tick 记录逐笔成交或盘口变化，分钟线进行窗口聚合，日线描述交易日整体。频率越高，信息更细，但噪声、数据量、延迟和成交建模难度也更高。<\/p>\n<h2>信号与数据要匹配<\/h2>\n<p>财务质量每季度变化，用 Tick 数据不会增加经济信息；订单簿失衡几秒内消失，日线又过于粗糙。频率应由信息更新速度和可执行期限决定。<\/p>\n<h2>高频的特殊问题<\/h2>\n<p>买卖价跳动、最小价位、排队顺序、撤单、撮合延迟和市场冲击会主导结果。用成交价中间值回测，可能假设自己总能以不存在的价格成交。<\/p>\n<h2>低频也有时点陷阱<\/h2>\n<p>使用当日收盘价生成信号后，不能默认同一收盘价大额成交；日线止损无法知道最高和最低的先后。低频回测同样要规定信号和执行时点。<\/p>\n<h2>频率选择四步<\/h2>\n<ol>\n<li>明确信息何时产生。<\/li>\n<li>估计信号衰减速度。<\/li>\n<li>选择能真实执行的最粗频率。<\/li>\n<li>在更细数据上验证成交与成本，而不是盲目把模型全部高频化。<\/li>\n<\/ol>\n<p>数据频率是研究假设的一部分，不是越大越专业的配置项。<\/p>\n<h2>用最粗但足够的频率开始<\/h2>\n<p>如果一个信号由季度财报形成，日频数据通常已经足以确定随后交易时点；把输入升级为 Tick 不会让财报更快出现，却会增加存储、对齐和成交建模负担。相反，研究订单簿短期失衡时，日线会把核心信息全部压缩掉。<\/p>\n<p>选择频率的原则不是“能拿到多细”，而是“多细才会改变决策”。先用能够表达信息产生与执行边界的最粗频率建立基线，再用更细数据验证成交、滑点和盘中路径。<\/p>\n<h2>分钟线也不是天然真实<\/h2>\n<p>一分钟 OHLCV 仍然是聚合结果：不知道窗口内成交顺序、买卖方向和排队位置。若一根分钟线同时触及止盈和止损，仍存在日线同类的路径歧义。不同数据源对分钟边界、集合竞价和跨午夜交易日的定义也可能不同。<\/p>\n<p>分钟策略应明确时间桶采用左闭右开还是其他规则、时间戳代表桶开始还是结束、缺失分钟如何解释，以及夜盘属于哪个交易日。少一个定义，跨源结果就可能无法复现。<\/p>\n<h2>高频数据带来的三类新误差<\/h2>\n<ol>\n<li><strong>微观结构误差<\/strong>：成交价在买卖报价间跳动，短期收益可能主要反映价差反弹。<\/li>\n<li><strong>顺序误差<\/strong>：同一时间戳下的行情和订单事件需要稳定排序。<\/li>\n<li><strong>执行误差<\/strong>：看到报价不等于排队后能够成交，延迟还会改变位置。<\/li>\n<\/ol>\n<p>频率越高，收益预测和执行模型越难分开。若回测用中间价产生信号，又默认以中间价成交，可能同时高估信号质量和执行质量。<\/p>\n<h2>多频率系统如何分工<\/h2>\n<p>双均线策略可以用日线生成目标仓位，用更细数据估计次日成交滑点和订单拆分；风险系统则可以用更高频账户与行情监控异常。研究频率、执行频率和监控频率不必相同，但它们之间的转换规则必须明确。<\/p>\n<p>评估时应检查：换成略粗或略细频率后，经济结论是否稳定；若优势只存在于某个偶然时间桶边界，可能是数据构造而非市场机制。<\/p>\n<h2>数据审计：先证明当时真的看得到<\/h2>\n<p>围绕“数据频率抉择：Tick、分钟、日线，不同频率对策略的致命影响”建立一张数据审计卡。目标不是把表填满，而是证明每个字段在决策时点真实可得、口径一致并可追溯。<\/p>\n<ol>\n<li>记录字段定义、来源、原始频率、发布时间、修订规则与授权范围。<\/li>\n<li>区分事件发生时间、数据发布时间、采集时间和策略可用时间。<\/li>\n<li>统计缺失、重复、异常和覆盖率，并保留原始值与清洗日志。<\/li>\n<li>用小样本从原始数据重建一个指标，核对复权、单位和时间对齐。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://pandas.pydata.org/docs/user_guide/index.html\">pandas 官方用户指南<\/a>：时间序列、缺失值与数据变换。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://scikit-learn.org/stable/common_pitfalls.html\">scikit-learn：Common pitfalls<\/a>：数据泄漏与训练、测试隔离。<\/li>\n<li><strong>适用条件与边界<\/strong>：数据许可、交易日历、公司行动和披露时点因市场而异；今天修订后的数据库不等于历史当时可见信息。<\/li>\n<li><strong>主要失败模式<\/strong>：使用后见修订数据、幸存股票池或错误复权，并把缺失值静默填充成不存在的事实。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用今天看到的历史数据假装当时已经可得；应使用 point-in-time 快照或发布时间约束。<\/li>\n<li>直接删除缺失值而不解释缺失机制；缺失本身可能包含选择偏差。<\/li>\n<li>只保存清洗后结果；没有原始快照和日志就无法复现与审计。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>每个核心字段有来源和更新时间<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>不存在使用未来修订值的前视偏差<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>缺失、异常、重复与退市样本均有处理记录<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>从原始数据到研究表的变换可以重放<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>频率应匹配信息半衰期和执行能力。<\/li>\n<li>高频增加微观结构、延迟和成本建模要求。<\/li>\n<li>日线回测仍需严格区分信号与成交时点。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为财报事件、日频动量和盘口做市三类策略分别选择最低必要数据频率，并说明理由。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第028讲 动手搭建你自己的轻量级量化数据库<\/strong>。<\/p>"}, {"n": 28, "title": "动手搭建你自己的轻量级量化数据库", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。数据示例与方法需结合真实市场规则验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>设计原始、标准化和特征三层数据库。<\/li>\n<li>掌握主键、版本与增量更新思路。<\/li>\n<li>建立可复现的数据访问接口。<\/li>\n<\/ul>\n<h2>目标：轻量但不随意<\/h2>\n<p>个人数据库不需要一开始追求分布式架构，但必须保证来源明确、更新可重复、历史不被静默覆盖。<\/p>\n<h2>三层结构<\/h2>\n<ul>\n<li><strong>Raw 原始层<\/strong>：保存供应商原始响应，只追加、不修改。<\/li>\n<li><strong>Clean 标准层<\/strong>：统一代码、时区、频率、单位和复权字段。<\/li>\n<li><strong>Feature 特征层<\/strong>：保存研究使用的收益、因子和标签，并记录计算版本。<\/li>\n<\/ul>\n<h2>核心表<\/h2>\n<p>证券主表记录代码、市场、上市退市日期和资产类型；交易日历表记录各市场开闭市；行情表以证券和时间为主键；公司行动表保存事件和生效日；基本面表同时保留报告期、公告时间和版本。<\/p>\n<h2>更新流程<\/h2>\n<p>每次任务先读取最新成功时间，拉取增量数据，进行校验，再原子写入。失败时不更新水位。对回溯修订的数据保留版本或快照，确保过去研究可重现。<\/p>\n<h2>存储选择<\/h2>\n<p>小规模日频可使用 Parquet 配合分析引擎，关系与元数据可用 SQLite 或 PostgreSQL。选择标准是数据量、并发、查询方式和维护能力，而不是技术潮流。<\/p>\n<h2>最低工程规范<\/h2>\n<p>配置与密钥分离、UTC 与本地时区清楚、日志可追踪、质量测试自动化、备份可恢复，并提供统一读取函数，避免每个策略各写一套口径。<\/p>\n<h2>验收<\/h2>\n<p>给定数据版本、截止时间和查询参数，任何一次研究都应能重新得到相同输入。可复现性比界面漂亮更重要。<\/p>\n<h2>先从一个可复现查询开始设计<\/h2>\n<p>数据库的验收目标可以写成一句话：给定“数据版本、知识截止时间、资产范围和字段”，任何研究者都能得到相同输入。这个目标反推表结构必须同时保存业务时间和系统时间，而不只是最终数值。<\/p>\n<p>例如基本面记录至少包含报告期、公告时间、供应商采集时间和版本；查询“某日当时可见数据”时，既要排除未来公告，也要选择当时最新版本。若表里只留最终修订值，数据库再快也无法支持可信回测。<\/p>\n<h2>三层结构如何阻止错误扩散<\/h2>\n<p>Raw 层保存供应商原文或原始文件并生成校验值，任何修正都不覆盖它；Clean 层统一代码、时间、单位和状态，并保留清洗规则版本；Feature 层只保存明确公式产生的研究字段，记录输入版本和参数。<\/p>\n<p>当某个因子异常时，可以从 Feature 追到 Clean，再追到 Raw，判断是公式、清洗还是供应商源数据问题。如果只有一张被反复修改的大表，错误来源和受影响研究都很难定位。<\/p>\n<h2>一次安全的增量更新<\/h2>\n<p>更新任务可按以下顺序运行：下载到临时区域；验证文件、日期和记录数；写入 Raw；生成 Clean；执行唯一性、完整性和业务逻辑检查；生成 Feature；全部通过后再更新“最新成功水位”。任一步失败都不应让半成品成为正式版本。<\/p>\n<p>回补历史时要标明受影响区间，并触发依赖特征的重算。若数据修订了但特征层没有重算，数据库内部会出现来源不一致的混合版本。<\/p>\n<h2>一组够用的核心字段<\/h2>\n<table>\n<thead>\n<tr>\n<th>对象<\/th>\n<th>关键字段<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>证券主表<\/td>\n<td>永久标识、市场代码、资产类型、上市与退市区间<\/td>\n<\/tr>\n<tr>\n<td>交易日历<\/td>\n<td>市场、交易日、开闭市与特殊时段<\/td>\n<\/tr>\n<tr>\n<td>行情表<\/td>\n<td>永久标识、事件时间、OHLCV、交易状态、来源版本<\/td>\n<\/tr>\n<tr>\n<td>公司行动<\/td>\n<td>事件类型、公告时间、生效时间、现金与股数变化<\/td>\n<\/tr>\n<tr>\n<td>基本面<\/td>\n<td>报告期、公告时间、采集时间、版本、字段口径<\/td>\n<\/tr>\n<tr>\n<td>数据血缘<\/td>\n<td>输出表、输入版本、处理代码版本、运行时间<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>永久标识与展示代码应分开，因为证券代码可能变化或被重复使用。时间字段也应写明时区，不能依赖数据库或操作系统默认值。<\/p>\n<h2>轻量不等于没有运维<\/h2>\n<p>至少需要自动质量报告、更新日志、失败告警、备份和恢复演练。备份文件存在不代表可以恢复，应定期在隔离位置重建一小段数据并运行查询。密钥不得写进代码或提交到仓库，数据授权范围也应进入元数据。<\/p>\n<p>个人项目不需要过早引入复杂分布式组件。能稳定重放、定位错误和恢复数据，比采用流行架构更重要。<\/p>\n<h2>数据审计：先证明当时真的看得到<\/h2>\n<p>围绕“动手搭建你自己的轻量级量化数据库”建立一张数据审计卡。目标不是把表填满，而是证明每个字段在决策时点真实可得、口径一致并可追溯。<\/p>\n<ol>\n<li>记录字段定义、来源、原始频率、发布时间、修订规则与授权范围。<\/li>\n<li>区分事件发生时间、数据发布时间、采集时间和策略可用时间。<\/li>\n<li>统计缺失、重复、异常和覆盖率，并保留原始值与清洗日志。<\/li>\n<li>用小样本从原始数据重建一个指标，核对复权、单位和时间对齐。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://pandas.pydata.org/docs/user_guide/index.html\">pandas 官方用户指南<\/a>：时间序列、缺失值与数据变换。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://scikit-learn.org/stable/common_pitfalls.html\">scikit-learn：Common pitfalls<\/a>：数据泄漏与训练、测试隔离。<\/li>\n<li><strong>适用条件与边界<\/strong>：数据许可、交易日历、公司行动和披露时点因市场而异；今天修订后的数据库不等于历史当时可见信息。<\/li>\n<li><strong>主要失败模式<\/strong>：使用后见修订数据、幸存股票池或错误复权，并把缺失值静默填充成不存在的事实。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用今天看到的历史数据假装当时已经可得；应使用 point-in-time 快照或发布时间约束。<\/li>\n<li>直接删除缺失值而不解释缺失机制；缺失本身可能包含选择偏差。<\/li>\n<li>只保存清洗后结果；没有原始快照和日志就无法复现与审计。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>每个核心字段有来源和更新时间<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>不存在使用未来修订值的前视偏差<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>缺失、异常、重复与退市样本均有处理记录<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>从原始数据到研究表的变换可以重放<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>轻量数据库也应分离原始、标准和特征层。<\/li>\n<li>时间、主键和版本决定研究能否复现。<\/li>\n<li>增量更新必须先校验再提交，并保留失败日志。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>画出自己的数据表结构，并为行情表、基本面表和公司行动表分别定义主键、时间字段和质量检查。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第029讲 移动平均线：最古老却依然有效的量化信号<\/strong>。<\/p>"}]}, {"no": 4, "name": "寻龙·经典策略拆解", "desc": "逐个解剖实战中久经考验的策略类型，理解其逻辑与适用环境。", "chapters": [{"n": 29, "title": "移动平均线：最古老却依然有效的量化信号", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解移动平均线作为低通滤波器的含义。<\/li>\n<li>区分趋势识别与价格预测。<\/li>\n<li>掌握窗口、滞后和交易成本之间的权衡。<\/li>\n<\/ul>\n<h2>均线做了什么<\/h2>\n<p>(N) 日简单移动平均为 (MA_t=\\frac{1}{N}\\sum_{i=0}^{N-1}P_{t-i})。它平滑短期噪声，让趋势更容易观察，但代价是滞后。窗口越长越稳定，反应越慢。<\/p>\n<p>指数移动平均给近期价格更高权重，递推形式为 (EMA_t=\\alpha P_t+(1-\\alpha)EMA_{t-1})。它反应更快，也更容易受噪声影响。<\/p>\n<h2>从指标到信号<\/h2>\n<p>价格站上均线可作为趋势状态，均线斜率可表示方向，价格与均线距离可表示偏离。指标本身不包含仓位、执行与退出，必须补齐下一交易时点、成本和风险规则。<\/p>\n<h2>为什么古老方法仍有人用<\/h2>\n<p>趋势可能来自信息逐步扩散、参与者行为延续和风险管理需求。均线不预测拐点，而是在趋势确认后参与，并接受初期利润让渡。<\/p>\n<h2>主要失败方式<\/h2>\n<p>震荡市场会反复穿越，产生“锯齿亏损”；参数过短换手率高，过长又可能承受较大回撤。应比较参数邻域、不同资产和不同阶段，而不是寻找唯一神奇窗口。<\/p>\n<h2>均线不是预测器，而是状态压缩器<\/h2>\n<p>假设最近五日价格为 100、102、101、104、108，5 日均线为 103。若下一日价格突然上涨，均线只会逐步反应，因为旧价格仍留在窗口中。它牺牲转向速度，换取对短期噪声的不敏感。<\/p>\n<p>因此“价格高于均线”更适合解释为当前状态偏强，而不是“明天必涨”。策略的收益若存在，来自对持续趋势的暴露，而不是均线看见了未来。<\/p>\n<h2>窗口长度是一项风险选择<\/h2>\n<p>短窗口较快进入与退出，能少让出一部分趋势，却会在震荡中频繁交易；长窗口交易较少，但转向慢，可能在趋势反转时回吐更多利润。窗口不是纯粹技术参数，它决定策略接受哪类错误：短窗接受假信号，长窗接受滞后。<\/p>\n<p>评估时应同时报告交易次数、平均持有期、成本前后收益和最大回撤。若只有某一个孤立窗口优秀，而相邻窗口迅速失效，更像参数巧合而非稳定机制。<\/p>\n<h2>一条可交易的均线规则<\/h2>\n<p>教学示意可以写成：收盘后计算过去 60 个有效交易日均线；若收盘价高于均线，下一交易日把目标仓位设为 100%，否则设为 0%；无法成交时保持原仓位；费用与滑点按每次实际成交计入。<\/p>\n<p>这段规则仍需补充复权口径、现金收益、首个窗口、停牌和涨跌停处理。指标只占一句，真正决定回测可信度的是其余条件。<\/p>\n<h2>用状态分解寻找收益来源<\/h2>\n<p>把历史分为价格在均线上方和下方两种状态，比较各自持有收益、波动、回撤和持续时间；再把市场划分为趋势与震荡阶段，检查收益是否集中在少数长趋势。这样能回答策略为何赚钱，而不只是“曲线是否向上”。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“移动平均线：最古老却依然有效的量化信号”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nber.org/papers/w25551.pdf\">Moskowitz、Ooi 与 Pedersen：Time Series Momentum<\/a>：跨资产时间序列动量的研究入口。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nber.org/papers/w7032\">Gatev、Goetzmann 与 Rouwenhorst：Pairs Trading<\/a>：配对交易规则、历史样本与微观结构解释。<\/li>\n<li><strong>适用条件与边界<\/strong>：技术指标是价格变换而非独立信息；结论受品种、频率、交易制度、做空约束与成本影响。<\/li>\n<li><strong>主要失败模式<\/strong>：先看结果再挑参数、忽略冲击成本，或把一种市场状态下的规律外推到所有时期。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>均线是价格平滑器，优势与滞后同时存在。<\/li>\n<li>均线信号需要与仓位、执行和风控组合。<\/li>\n<li>趋势策略用震荡期小亏换取少数长趋势收益。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>计算 5、20 和 60 日均线，比较其转向时间、交易次数和成本，解释哪个更适合你的资产与周期。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第030讲 双均线金叉死叉：真那么简单，为何你还没暴富？<\/strong>。<\/p>"}, {"n": 30, "title": "双均线金叉死叉：真那么简单，为何你还没暴富？", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>把金叉死叉写成无歧义规则。<\/li>\n<li>理解双均线策略的收益分布。<\/li>\n<li>识别参数挖掘和同价成交错误。<\/li>\n<\/ul>\n<h2>基本规则<\/h2>\n<p>当短均线从下向上穿越长均线时称金叉，反向称死叉。量化实现应定义状态而非肉眼画线：<\/p>\n<p>[\ns_t=\\begin{cases}1,&amp;MA_{short,t}&gt;MA_{long,t}\\0,&amp;其他\\end{cases}\n]<\/p>\n<p>只有状态变化时交易，可避免每天重复下单。<\/p>\n<h2>回测时点<\/h2>\n<p>若使用当日收盘价计算均线，最早应在收盘后知道信号，通常从下一可交易时点执行。以同一收盘价成交会产生前视式乐观。<\/p>\n<h2>收益为何不平滑<\/h2>\n<p>双均线通常胜率未必高，很多交易小亏或持平，收益依赖少数持续趋势。单看胜率会误解策略；更应观察盈亏比、回撤和趋势阶段表现。<\/p>\n<h2>参数陷阱<\/h2>\n<p>从大量长短窗口中挑历史最好组合，容易过拟合。应先限定有经济意义的范围，再看参数热图是否形成稳定高地，并保留样本外。<\/p>\n<h2>改进方向<\/h2>\n<p>加入波动率仓位、趋势强度过滤、跨资产分散和交易缓冲区，常比继续堆叠技术指标更稳健。<\/p>\n<h2>金叉不是一个瞬间，而是一段持仓状态<\/h2>\n<p>肉眼常把两条线交叉的那一天视为核心事件，量化策略真正承担风险的却是交叉后持续数周或数月的持仓。若每天都把“短均线高于长均线”当作新买入信号，就会重复下单；正确实现应把状态与状态变化分开。<\/p>\n<p>可以保存三列：当日均线状态、下一时点目标仓位、实际成交后仓位。信号、目标和实际仓位不一定相同，因为交易限制和部分成交会让执行滞后。<\/p>\n<h2>为什么胜率低也可能赚钱<\/h2>\n<p>假设十次交易中七次各亏 1%，三次各赚 5%，忽略复利和成本时总和仍为正。趋势策略通常用多次小亏换取少数大行情，因此单纯提高胜率可能过滤掉最重要的长趋势。<\/p>\n<p>评价应关注平均盈利与平均亏损、尾部盈利贡献、连续亏损长度和成本后期望。若全部收益只来自一次事件，也要判断这是否与策略机制一致，还是偶然样本主导。<\/p>\n<h2>参数热图该怎么看<\/h2>\n<p>将短窗和长窗放在网格中，不只寻找最高点，而是观察一片参数区域是否表现方向一致。稳定高地意味着规则对小幅参数变化不敏感；孤立尖峰说明结果可能依赖特定历史排列。<\/p>\n<p>参数检验应在样本内定义候选区域，在样本外只做一次确认。若看完样本外又回头改窗口，样本外就变成新的训练集。<\/p>\n<h2>改进要解决明确问题<\/h2>\n<p>波动率仓位解决不同市场状态风险不等；缓冲带解决均线附近反复交易；跨资产分散解决单一市场长期无趋势。每项改进都应与简单基线比较新增收益、换手和复杂度。若只让历史曲线更平滑，却说不清解决了什么，可能只是过拟合。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“双均线金叉死叉：真那么简单，为何你还没暴富？”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nber.org/papers/w25551.pdf\">Moskowitz、Ooi 与 Pedersen：Time Series Momentum<\/a>：跨资产时间序列动量的研究入口。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nber.org/papers/w7032\">Gatev、Goetzmann 与 Rouwenhorst：Pairs Trading<\/a>：配对交易规则、历史样本与微观结构解释。<\/li>\n<li><strong>适用条件与边界<\/strong>：技术指标是价格变换而非独立信息；结论受品种、频率、交易制度、做空约束与成本影响。<\/li>\n<li><strong>主要失败模式<\/strong>：先看结果再挑参数、忽略冲击成本，或把一种市场状态下的规律外推到所有时期。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>金叉死叉要转成状态规则并使用下一可交易时点。<\/li>\n<li>双均线依赖少数大趋势，胜率不是核心指标。<\/li>\n<li>参数稳定区比单一最优参数更重要。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>实现 20/60 双均线基线，再将两个窗口各上下调整 20%，观察结果是否稳定。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第031讲 MACD的量化改造：背离与能量潮的正确打开方式<\/strong>。<\/p>"}, {"n": 31, "title": "MACD的量化改造：背离与能量潮的正确打开方式", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解 MACD 的趋势与动量构成。<\/li>\n<li>把柱状图和背离改写为可计算条件。<\/li>\n<li>避免重复使用同源指标。<\/li>\n<\/ul>\n<h2>MACD 的结构<\/h2>\n<p>常见 MACD 由快慢 EMA 之差构成：(DIF=EMA_{fast}-EMA_{slow})，信号线 (DEA=EMA(DIF))，柱值为二者之差的缩放。它本质上仍来自价格平滑，不是独立于均线的新信息。<\/p>\n<h2>三类量化信号<\/h2>\n<ul>\n<li>DIF 与 DEA 交叉：趋势动量变化。<\/li>\n<li>柱值由负转正：短期动量改善。<\/li>\n<li>DIF 斜率或标准化幅度：比较不同价格尺度。<\/li>\n<\/ul>\n<h2>背离如何定义<\/h2>\n<p>“价格创新高、MACD 未创新高”必须给出摆动高点识别、比较窗口和最小差异。定义越自由，事后看图越容易，实盘交易复现越困难。<\/p>\n<h2>能量潮的误解<\/h2>\n<p>成交量可作为确认条件，但价格和成交量关系受市场机制影响。直接再加入多种均线、RSI 和 MACD，常只是重复表达同一段价格历史。<\/p>\n<h2>改造原则<\/h2>\n<p>对 MACD 做波动标准化、设置缓冲带、限制交易频率，并比较它相对简单动量基线是否真有增量。<\/p>\n<h2>MACD 与双均线到底差多少<\/h2>\n<p>MACD 先计算快慢 EMA 之差，再对差值做平滑。与双均线相比，它更强调趋势变化速度，但输入仍然是同一段价格。若同时把均线交叉、MACD 交叉和价格动量当作三个独立投票，可能只是让同一信息重复计票。<\/p>\n<p>检验增量时，应先建立简单价格动量或双均线基线，再加入 MACD 特征；若样本外表现没有改善，复杂指标没有提供额外信息。<\/p>\n<h2>把“背离”写成机器能执行的规则<\/h2>\n<p>一份完整定义至少要说明：摆动高点如何识别，两个高点相隔多少期，价格创新高的最小幅度是多少，MACD 未创新高允许多少容差，以及信号在第几日确认。若摆动点需要未来若干日才确认，就不能把信号标在历史峰值当天成交。<\/p>\n<p>背离规则越依赖视觉挑选，越容易只看见成功案例。逐日循环测试可以暴露它在真实时点到底何时知道、会产生多少失败信号。<\/p>\n<h2>标准化让跨资产比较更合理<\/h2>\n<p>相同 DIF 数值对不同价格和波动资产含义不同。可将 DIF 或柱值除以价格、ATR 或滚动波动，转换为相对尺度。标准化参数仍必须只用当时历史估计，并检查极端波动时分母是否过小或跳变。<\/p>\n<h2>成交量确认不是免费的新证据<\/h2>\n<p>成交量上升可能表示关注增加，也可能只是事件冲击、指数调仓或流动性变化。加入成交量过滤后，应检查它是否只是筛选了大市值、高流动性资产，并报告被过滤交易的成本与收益差异。若过滤规则看完结果后才定义，其“确认作用”可能只是事后叙事。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“MACD的量化改造：背离与能量潮的正确打开方式”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nber.org/papers/w25551.pdf\">Moskowitz、Ooi 与 Pedersen：Time Series Momentum<\/a>：跨资产时间序列动量的研究入口。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nber.org/papers/w7032\">Gatev、Goetzmann 与 Rouwenhorst：Pairs Trading<\/a>：配对交易规则、历史样本与微观结构解释。<\/li>\n<li><strong>适用条件与边界<\/strong>：技术指标是价格变换而非独立信息；结论受品种、频率、交易制度、做空约束与成本影响。<\/li>\n<li><strong>主要失败模式<\/strong>：先看结果再挑参数、忽略冲击成本，或把一种市场状态下的规律外推到所有时期。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>MACD 是快慢指数均线差的再平滑。<\/li>\n<li>背离必须定义摆动点和比较窗口。<\/li>\n<li>增加同源指标不等于增加独立信息。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为“顶背离”写出完全机械的定义，并在看不到未来数据的逐日循环中标记信号。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第032讲 布林带突破：统计学在交易中的漂亮应用<\/strong>。<\/p>"}, {"n": 32, "title": "布林带突破：统计学在交易中的漂亮应用", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解布林带的中心与尺度。<\/li>\n<li>区分突破和均值回归两种相反用法。<\/li>\n<li>处理滚动估计与波动变化。<\/li>\n<\/ul>\n<h2>布林带公式<\/h2>\n<p>中心常为 (N) 日均线，上下轨为：<\/p>\n<p>[\nUpper=MA_N+k\\sigma_N,\\quad Lower=MA_N-k\\sigma_N\n]<\/p>\n<p>它把价格偏离转换为相对近期波动的尺度，但滚动收益并非正态，(k) 倍标准差不应被机械解释为固定概率。<\/p>\n<h2>两种相反逻辑<\/h2>\n<p><strong>突破策略<\/strong>认为穿越上轨代表趋势增强；<strong>均值回归策略<\/strong>认为偏离过大后会回归中心。两者都可能合理，关键是资产机制、持有期和过滤条件。<\/p>\n<h2>波带宽度<\/h2>\n<p>((Upper-Lower)/MA) 可描述近期波动。先收窄后扩张常用于寻找波动爆发，但必须定义分位阈值和确认时点。<\/p>\n<h2>常见错误<\/h2>\n<p>用当日完整高低价触发后仍假设轨道固定、忽略跳空成交、同时用未来窗口计算标准差，都会美化结果。滚动指标只能使用当时历史。<\/p>\n<h2>验证<\/h2>\n<p>分别测试趋势和回归版本，比较其在上涨、震荡和危机阶段的收益来源，不要只在图上挑“有效”案例。<\/p>\n<h2>同一次上轨穿越，为什么有两种相反交易<\/h2>\n<p>价格穿越上轨可以解释为趋势力量超过近期常态，也可以解释为短期偏离过大。前一种策略买入，后一种策略卖出或减仓。指标没有自动给出方向，方向来自对资产机制和持有期的假设。<\/p>\n<p>研究时应分别实现两套规则，不能在每个历史片段里选择事后正确的解释。突破版要说明如何退出趋势，回归版要说明均值为何稳定以及何时承认均值已经移动。<\/p>\n<h2>两倍标准差不是固定概率边界<\/h2>\n<p>滚动窗口内价格具有趋势、自相关和厚尾，均线与标准差还在不断变化。因此上下轨不是静态正态分布的置信区间，价格触轨频率也不会稳定等于某个理论概率。<\/p>\n<p>更实用的做法是把 (k) 视为风险尺度参数，观察不同市场、窗口和波动状态下的触发率，而不是用“超过两倍标准差必然回归”替代检验。<\/p>\n<h2>避免当日轨道与当日价格互相偷看<\/h2>\n<p>若用当日收盘更新均线和标准差，再判断同一收盘是否突破，门槛已经包含触发价格本身。策略可以这样定义，但成交必须发生在后续可交易时点；如果希望盘中触发，则应使用开盘前已知的滞后轨道，并模拟跳空越过门槛时的真实成交。<\/p>\n<h2>波带收窄只是条件，不是收益来源<\/h2>\n<p>低波动后可能爆发，也可能继续沉寂。把波带宽度处于历史低分位作为筛选条件后，还要定义方向信号、等待期限、退出与失败条件。检查加入收窄条件后是否减少了交易、提高了单次优势，还是只删掉了历史中的亏损样本。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“布林带突破：统计学在交易中的漂亮应用”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nber.org/papers/w25551.pdf\">Moskowitz、Ooi 与 Pedersen：Time Series Momentum<\/a>：跨资产时间序列动量的研究入口。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nber.org/papers/w7032\">Gatev、Goetzmann 与 Rouwenhorst：Pairs Trading<\/a>：配对交易规则、历史样本与微观结构解释。<\/li>\n<li><strong>适用条件与边界<\/strong>：技术指标是价格变换而非独立信息；结论受品种、频率、交易制度、做空约束与成本影响。<\/li>\n<li><strong>主要失败模式<\/strong>：先看结果再挑参数、忽略冲击成本，或把一种市场状态下的规律外推到所有时期。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>布林带是移动中心加滚动波动尺度。<\/li>\n<li>上轨突破既可解释为趋势，也可解释为过度偏离。<\/li>\n<li>概率含义、时点和成交必须谨慎。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>实现一个突破版与一个回归版布林策略，使用相同数据和成本比较环境依赖。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第033讲 唐奇安通道与海龟交易法则（上）——入市系统<\/strong>。<\/p>"}, {"n": 33, "title": "唐奇安通道与海龟交易法则（上）——入市系统", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解唐奇安通道与海龟入市逻辑。<\/li>\n<li>掌握突破信号的无未来实现。<\/li>\n<li>认识多市场趋势分散的价值。<\/li>\n<\/ul>\n<h2>唐奇安通道<\/h2>\n<p>过去 (N) 期最高与最低构成通道。向上突破过去高点做多，向下突破过去低点做空或退出。计算时必须对窗口滞后一位，否则把当日新高同时当作已知门槛。<\/p>\n<h2>海龟系统的核心<\/h2>\n<p>经典海龟思想不是一个神奇参数，而是完整规则：多市场扫描、通道突破入场、按波动定仓、顺势加仓和明确退出。它接受频繁小亏，以捕捉少数跨期大趋势。<\/p>\n<h2>入市系统<\/h2>\n<p>研究版可定义：当价格突破前 20 日高点入场，跌破较短退出通道离场；更长窗口提供另一套慢速系统。具体数字应作为历史案例学习，不能直接视为今日最优。<\/p>\n<h2>假突破<\/h2>\n<p>突破后迅速回落是策略成本的一部分。可使用缓冲、收盘确认或趋势强度过滤，但过滤越多越容易过拟合。<\/p>\n<h2>组合视角<\/h2>\n<p>单一市场趋势不连续，多商品、多股指和多利率品种组合能让机会来源更分散。真正优势常来自组合与仓位，而不只是入场点。<\/p>\n<h2>滞后一位是突破系统的生命线<\/h2>\n<p>若今日最高价为 110，而过去 20 日最高价为 108，今日可以被识别为向上突破。通道门槛必须只由昨日及更早数据计算；若把今日高点也纳入 20 日最高值，门槛会同步变成 110，信号定义就被改变。<\/p>\n<p>实现时最好显式保存 <code>prior_high<\/code> 与 <code>prior_low<\/code>，再用今日可观察价格比较。一个简单的 <code>shift(1)<\/code> 往往比更复杂的过滤器更重要。<\/p>\n<h2>突破价不等于成交价<\/h2>\n<p>若市场跳空高开并直接越过 108，策略不可能回到 108 成交。回测应按可实现的开盘或后续成交模型处理，且订单规模越大，冲击越明显。涨跌停、停牌或流动性不足时，还可能完全无法进入。<\/p>\n<p>趋势策略最重要的盈利期往往伴随快速行情，因此理想化成交会系统性美化最关键交易。<\/p>\n<h2>假突破是策略保费<\/h2>\n<p>通道突破无法事前区分真趋势与假趋势。缩短确认时间会更早入场，也会增加假信号；延迟确认会减少部分噪声，却可能错过利润。与其寻找零假突破规则，更现实的是限制单次损失、分散市场并保证大趋势出现时仍在系统中。<\/p>\n<h2>为什么要从单品种走向组合<\/h2>\n<p>单一市场可能多年震荡，突破策略不断小亏。多市场组合让趋势机会来自不同资产，但不能把同一宏观风险下的多个合约误当成独立机会。组合层要限制相关市场的总单位，并统一波动风险。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“唐奇安通道与海龟交易法则（上）——入市系统”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nber.org/papers/w25551.pdf\">Moskowitz、Ooi 与 Pedersen：Time Series Momentum<\/a>：跨资产时间序列动量的研究入口。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nber.org/papers/w7032\">Gatev、Goetzmann 与 Rouwenhorst：Pairs Trading<\/a>：配对交易规则、历史样本与微观结构解释。<\/li>\n<li><strong>适用条件与边界<\/strong>：技术指标是价格变换而非独立信息；结论受品种、频率、交易制度、做空约束与成本影响。<\/li>\n<li><strong>主要失败模式<\/strong>：先看结果再挑参数、忽略冲击成本，或把一种市场状态下的规律外推到所有时期。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>唐奇安通道用历史高低点定义突破。<\/li>\n<li>海龟是一套含组合、仓位和退出的系统。<\/li>\n<li>假突破无法消除，应由风险预算和多市场分散管理。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>用滞后通道实现 20 日突破，检查每个信号门槛是否只含前一日及更早数据。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第034讲 海龟交易法则（下）——头寸规模与止损的哲学<\/strong>。<\/p>"}, {"n": 34, "title": "海龟交易法则（下）——头寸规模与止损的哲学", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解 ATR 风险单位和头寸规模。<\/li>\n<li>掌握加仓、止损与组合上限的关系。<\/li>\n<li>认识生存性比单次预测更重要。<\/li>\n<\/ul>\n<h2>波动单位<\/h2>\n<p>真实波幅取当日高低、前收与当日高、前收与当日低三者绝对差的最大值，ATR 是其滚动平均。海龟体系常用类似 (N) 的波动单位统一不同市场风险。<\/p>\n<h2>按风险定仓<\/h2>\n<p>若单笔允许风险预算为 (B)，止损距离为 (d)，每点价值为 (v)，合约数量近似：<\/p>\n<p>[\nQty=\\frac{B}{d\\times v}\n]<\/p>\n<p>波动上升时仓位下降，让不同品种的潜在损失更可比。<\/p>\n<h2>顺势加仓<\/h2>\n<p>只有价格按有利方向移动才增加单位，且总单位受限。加仓是把风险放到已被市场验证的方向，不是亏损摊平。<\/p>\n<h2>止损哲学<\/h2>\n<p>止损不是预测失败后的羞辱，而是把单次错误限制在组合可承受范围。跳空和流动性会让实际损失超过止损价，因此还需组合杠杆与极端情景限制。<\/p>\n<h2>相关市场上限<\/h2>\n<p>同时持有多个高度相关品种可能重复下注。仓位规则应从单品种扩展到相关组和总组合风险。<\/p>\n<h2>从风险预算反推数量<\/h2>\n<p>以课后教学数字为例：组合资金 100 万，单笔风险预算 0.5%，即 5000 元；止损距离 4 元，每点价值 100 元，则单份合约在止损处风险约 400 元，理论数量为 12.5 份。真实交易需要向下取整，并检查保证金、最小交易单位和流动性。<\/p>\n<p>这个公式控制的是计划内止损损失，不是最大可能损失。跳空、连续涨跌停或流动性枯竭会让实际成交远离止损价，因此组合还需要更高层的杠杆和压力限制。<\/p>\n<h2>波动上升时为什么要减仓<\/h2>\n<p>若 ATR 翻倍而风险预算不变，止损距离通常随之扩大，数量就应下降。这样不同市场、不同波动状态下的计划风险更接近。若仓位保持不变，市场越剧烈，账户承担的货币风险越大。<\/p>\n<p>不过 ATR 是滞后估计。突发跳跃发生时，仓位可能在波动率更新前已经过大，所以不能把波动调整当作尾部保护的替代品。<\/p>\n<h2>顺势加仓与摊平亏损的区别<\/h2>\n<p>顺势加仓在价格向有利方向移动后增加风险，意味着市场先提供部分验证；亏损摊平则在假设被价格反驳时继续增加暴露。两者都可能最终亏损，但风险逻辑完全不同。<\/p>\n<p>加仓规则要给每次新增单位单独定义触发、止损和组合上限，不能因为已有浮盈就把风险视为免费。<\/p>\n<h2>单笔止损之外还有组合止损<\/h2>\n<p>多个商品、股指或利率合约可能由同一宏观冲击驱动。每笔都满足 0.5% 风险预算，不代表十笔同时持有仍安全。需要按相关组汇总计划损失、保证金和压力情景，并限制总风险单位。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“海龟交易法则（下）——头寸规模与止损的哲学”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nber.org/papers/w25551.pdf\">Moskowitz、Ooi 与 Pedersen：Time Series Momentum<\/a>：跨资产时间序列动量的研究入口。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nber.org/papers/w7032\">Gatev、Goetzmann 与 Rouwenhorst：Pairs Trading<\/a>：配对交易规则、历史样本与微观结构解释。<\/li>\n<li><strong>适用条件与边界<\/strong>：技术指标是价格变换而非独立信息；结论受品种、频率、交易制度、做空约束与成本影响。<\/li>\n<li><strong>主要失败模式<\/strong>：先看结果再挑参数、忽略冲击成本，或把一种市场状态下的规律外推到所有时期。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>波动调整让不同资产的风险单位可比较。<\/li>\n<li>顺势加仓与亏损摊平方向相反。<\/li>\n<li>止损价不是损失保证，组合与跳空风险仍需约束。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>设组合资金 100 万、单笔风险 0.5%、ATR 止损距离 4 元、每点价值 100 元，计算理论数量并讨论取整与跳空。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第035讲 动量策略：追涨杀跌凭什么能赚钱？<\/strong>。<\/p>"}, {"n": 35, "title": "动量策略：追涨杀跌凭什么能赚钱？", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解时间序列和横截面动量。<\/li>\n<li>解释动量收益与崩溃风险。<\/li>\n<li>构建含成本和风险控制的基线。<\/li>\n<\/ul>\n<h2>两类动量<\/h2>\n<p>时间序列动量判断单一资产过去收益是否为正；横截面动量在同一时点比较多个资产，买强卖弱或只持有强者。<\/p>\n<p>常见信号可用过去 (J) 期累计收益率，并跳过最近短窗口以减少短期反转影响。窗口与跳过期必须在研究前定义。<\/p>\n<h2>为什么可能有效<\/h2>\n<p>信息缓慢扩散、投资者反应不足、资金流延续和风险溢价都可能产生趋势。但解释并不唯一，规律也会随拥挤和成本变化。<\/p>\n<h2>动量崩溃<\/h2>\n<p>在剧烈反转中，过去输家可能快速反弹、赢家快速下跌，导致集中损失。动量组合还常暴露于行业、规模和市场方向。<\/p>\n<h2>风险控制<\/h2>\n<p>采用波动率目标、行业中性、持仓上限、分散资产和较缓慢换手率。不要只报告多头赢家组合，要说明基准与暴露。<\/p>\n<h2>最小基线<\/h2>\n<p>定义时点股票池，按过去收益率排序分组，下一期持有，计入换手率和交易成本，并做样本外及参数邻域检查。<\/p>\n<h2>两类动量回答不同问题<\/h2>\n<p>时间序列动量问：“这项资产相对自己的过去，是强还是弱？”横截面动量问：“在同一时点，它相对其他资产有多强？”前者可以让所有资产同时做多或同时空仓，后者通常需要排序并决定赢家与输家组合。<\/p>\n<p>把两者混合会让收益来源难以解释。研究报告应分别说明市场方向暴露、相对强弱暴露和最终组合权重。<\/p>\n<h2>一个最小横截面动量流程<\/h2>\n<p>在每个调仓日，先用当时股票池计算过去固定窗口收益，按预先定义规则处理近期窗口、停牌和公司行动；随后在行业内或全市场排序，下一可交易时点持有赢家组，并在下个调仓日更新。所有排序阈值都只由当时横截面生成。<\/p>\n<p>若用今天存续股票回看历史、按当日收盘排序又按同价成交，动量收益会同时受到幸存者偏差和时点偏差美化。<\/p>\n<h2>动量崩溃为什么来得快<\/h2>\n<p>动量组合在持续趋势中逐渐积累赢家和输家暴露；市场快速反转时，过去输家可能剧烈反弹，过去赢家同时回落。仓位尚未来得及更新，损失便可能集中发生。仅靠历史平均波动定仓会低估这种状态切换。<\/p>\n<p>应单独检查反转阶段、行业集中、市场 Beta、空头挤压和流动性压力，并设置组合层风险上限。动量风险不是“偶尔没选对股票”，而是多个历史赢家在同一机制下同时反转。<\/p>\n<h2>跳过最近窗口要解决什么<\/h2>\n<p>跳过最近一期常用于减少短期反转或微观结构影响，但它仍是参数。应比较不跳过、跳过较短和较长窗口的经济含义与样本外稳定性，而不是从热图中选择最漂亮的一格。<\/p>\n<p>真正需要证明的是：较长周期强势是否提供了独立于行业、规模和市场方向的增量，并且足以覆盖换手与冲击成本。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“动量策略：追涨杀跌凭什么能赚钱？”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nber.org/papers/w25551.pdf\">Moskowitz、Ooi 与 Pedersen：Time Series Momentum<\/a>：跨资产时间序列动量的研究入口。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.aqr.com/Insights/Datasets/An-Academic-Quality-Data-Library-for-Practitioners\">AQR Academic Data Library<\/a>：价值、动量、低 Beta 与趋势等论文配套数据。<\/li>\n<li><strong>适用条件与边界<\/strong>：技术指标是价格变换而非独立信息；结论受品种、频率、交易制度、做空约束与成本影响。<\/li>\n<li><strong>主要失败模式<\/strong>：先看结果再挑参数、忽略冲击成本，或把一种市场状态下的规律外推到所有时期。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>时间序列动量看自身趋势，横截面动量比较相对强弱。<\/li>\n<li>动量可能长期有效，但会在快速反转中集中受损。<\/li>\n<li>行业暴露、成本和风险目标必须纳入基线。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>构建 12 个月动量、跳过最近 1 个月的横截面分组，比较行业中性前后结果。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第036讲 反转策略：均值回归的魔法，跌多了会涨吗？<\/strong>。<\/p>"}, {"n": 36, "title": "反转策略：均值回归的魔法，跌多了会涨吗？", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>区分短期反转与长期均值回归。<\/li>\n<li>理解回归均值必须先定义均值。<\/li>\n<li>识别价值陷阱和趋势对抗风险。<\/li>\n<\/ul>\n<h2>“跌多了会涨”缺少什么<\/h2>\n<p>均值回归必须说明变量、均值和回归时间。价格水平没有固定均值，价差、估值偏离或标准化残差才可能具有相对稳定中心。<\/p>\n<h2>短期反转<\/h2>\n<p>短期极端收益后的反向变化可能来自流动性冲击、过度反应或临时订单失衡。实施时要排除停牌、涨跌停、重大事件和无法成交资产。<\/p>\n<h2>长期反转<\/h2>\n<p>多年输家未来可能改善，但也可能是基本面持续恶化。长期反转常混合价值、困境和风险暴露，持有期长且不确定性大。<\/p>\n<h2>标准化信号<\/h2>\n<p>常见形式为 z-score：(z=(x-\\mu)/\\sigma)。当偏离超过阈值进场、回到中心退出。均值和波动只能用滚动历史估计。<\/p>\n<h2>主要风险<\/h2>\n<p>趋势可能持续，均值本身会移动，低估值可能是信息而非错价。应设置持有上限、止损、基本面过滤和组合分散。<\/p>\n<p>均值回归不是“越跌越买”，而是对一个有稳定机制的偏离做有限风险下注。<\/p>\n<h2>先问“回到哪个均值”<\/h2>\n<p>价格从 100 跌到 70，并不自动意味着 100 是均值。公司价值可能永久下降，市场制度可能变化，趋势也可能仍在继续。均值回归策略必须先找到一个有机制支持的中心，例如相对价差、行业中性残差或稳定估值区间。<\/p>\n<p>若中心随时间移动，使用全样本平均会偷看未来；使用短滚动均值又可能追随价格，把正在发生的结构变化误判为临时偏离。<\/p>\n<h2>z-score 只完成了尺度转换<\/h2>\n<p>将偏离除以滚动标准差，可以比较不同波动状态，但 (z=-2) 并不代表必然反弹。它只表示相对近期估计出现较大负偏离。进场还需要解释偏离为何是暂时的、何时可成交以及关系破裂时如何退出。<\/p>\n<p>标准差在危机中可能迅速上升，使同一价格损失对应的 z-score反而缩小。风险控制不能只依赖标准化后的信号。<\/p>\n<h2>短期反转最容易被成本吞掉<\/h2>\n<p>短期反转往往交易频繁，并集中在刚发生大幅波动的资产上；此时买卖价差、冲击和无法成交都可能更严重。若回测以收盘价买入跌幅最大的证券，可能正好假设自己在最拥挤、最难成交时获得理想价格。<\/p>\n<p>应比较信号毛收益、下一可交易价格后的收益和扣除保守成本后的净收益，并剔除无法实际交易的样本。<\/p>\n<h2>趋势与反转不是永恒对立<\/h2>\n<p>不同时间尺度可能同时存在：短期流动性冲击会反转，较长趋势仍可能延续。把策略按持有期、触发机制和市场状态拆开，比用一个指标判断“现在趋势还是反转”更可靠。状态过滤必须在样本外检验，否则容易事后给每段行情贴标签。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“反转策略：均值回归的魔法，跌多了会涨吗？”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nber.org/papers/w25551.pdf\">Moskowitz、Ooi 与 Pedersen：Time Series Momentum<\/a>：跨资产时间序列动量的研究入口。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nber.org/papers/w7032\">Gatev、Goetzmann 与 Rouwenhorst：Pairs Trading<\/a>：配对交易规则、历史样本与微观结构解释。<\/li>\n<li><strong>适用条件与边界<\/strong>：技术指标是价格变换而非独立信息；结论受品种、频率、交易制度、做空约束与成本影响。<\/li>\n<li><strong>主要失败模式<\/strong>：先看结果再挑参数、忽略冲击成本，或把一种市场状态下的规律外推到所有时期。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>均值回归必须明确被回归变量和时间尺度。<\/li>\n<li>价格下跌不自动等于偏离，可能反映永久信息。<\/li>\n<li>滚动标准化、持有上限和机制解释是关键。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为一个价差序列计算滚动 z-score，设计进场、退出和最大持有期，并检查均值是否发生结构变化。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第037讲 RSI超买超卖：从技术指标到量化信号的改造<\/strong>。<\/p>"}, {"n": 37, "title": "RSI超买超卖：从技术指标到量化信号的改造", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解 RSI 的计算与范围。<\/li>\n<li>把超买超卖从标签改成条件策略。<\/li>\n<li>检验趋势与震荡环境差异。<\/li>\n<\/ul>\n<h2>RSI 如何计算<\/h2>\n<p>RSI 比较一段窗口内平均上涨与平均下跌，常写为 (RS=AvgGain/AvgLoss)，(RSI=100-100/(1+RS))。平滑方法不同会产生不同数值，代码必须固定口径。<\/p>\n<h2>超买不等于马上下跌<\/h2>\n<p>RSI 高表示近期上涨相对强，强趋势中可长期保持高位。将 70 机械视为卖出、30 视为买入，可能持续逆势。<\/p>\n<h2>两种用法<\/h2>\n<ul>\n<li><strong>均值回归<\/strong>：低 RSI 后价格确认企稳再买入。<\/li>\n<li><strong>趋势确认<\/strong>：高 RSI 作为强势条件，而非反向信号。<\/li>\n<\/ul>\n<p>两者逻辑相反，应分别测试。<\/p>\n<h2>量化实现<\/h2>\n<p>定义阈值穿越、持有期、过滤条件和执行时点；使用参数区间而非只看 14、30、70。比较 RSI 相对简单过去收益是否增加信息。<\/p>\n<h2>风险<\/h2>\n<p>极端事件、跌停和持续趋势会让逆向策略累积损失。单一震荡样本中的漂亮结果不代表跨环境稳定。<\/p>\n<h2>RSI 高到底说明什么<\/h2>\n<p>RSI 高首先说明最近窗口内上涨幅度相对下跌幅度更大，这是对过去路径的压缩。它可以是“过度上涨”的反转候选，也可以是“持续强势”的趋势确认。指标本身没有决定哪一种解释成立。<\/p>\n<p>因此同一个 RSI=75，震荡资产与突破趋势资产可能需要相反决策。研究必须先写经济假设，再把阈值用于验证，不能看到后续下跌就称超买、看到继续上涨又改称强势。<\/p>\n<h2>阈值穿越与阈值停留不同<\/h2>\n<p>“RSI 低于 30”是状态，“从下向上重新穿越 30”是事件。前者可能连续多日重复发出信号，后者等待一定恢复确认。两种规则的入场时点、交易次数和回撤完全不同。<\/p>\n<p>量化实现应明确平滑公式、窗口、比较符号、首次可用日期、持有期和重复信号处理。不同软件默认平滑方式不同，名称相同不保证数值一致。<\/p>\n<h2>做一个四象限对照<\/h2>\n<p>可以按长期趋势向上/向下与 RSI 高/低形成四个状态，分别统计下一期收益和风险。若低 RSI 只在长期上升趋势中有反转价值，策略机制可能是回调买入；若高 RSI 在趋势向上时继续表现好，它更像动量确认。<\/p>\n<p>四象限只是诊断工具，不应看完结果后无限增加阈值。最终规则仍要在未参与选择的样本检验。<\/p>\n<h2>逆向策略的成交风险<\/h2>\n<p>RSI 最低的资产往往刚经历急跌。跌停、停牌、价差扩大和基本面事件会让回测买点不可实现。应将交易状态、事件过滤和下一可交易价格纳入回测，并为持续下跌设置最大持有期与组合限额。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“RSI超买超卖：从技术指标到量化信号的改造”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nber.org/papers/w25551.pdf\">Moskowitz、Ooi 与 Pedersen：Time Series Momentum<\/a>：跨资产时间序列动量的研究入口。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nber.org/papers/w7032\">Gatev、Goetzmann 与 Rouwenhorst：Pairs Trading<\/a>：配对交易规则、历史样本与微观结构解释。<\/li>\n<li><strong>适用条件与边界<\/strong>：技术指标是价格变换而非独立信息；结论受品种、频率、交易制度、做空约束与成本影响。<\/li>\n<li><strong>主要失败模式<\/strong>：先看结果再挑参数、忽略冲击成本，或把一种市场状态下的规律外推到所有时期。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>RSI 衡量窗口内上涨与下跌的相对强度。<\/li>\n<li>高低阈值不是自动反转预言。<\/li>\n<li>趋势确认与均值回归版本必须分开验证。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>构建 RSI 低位反转与高位趋势两个策略，在趋势期和震荡期分别比较。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第038讲 通道突破与波动率突破：捕捉趋势爆发的瞬间<\/strong>。<\/p>"}, {"n": 38, "title": "通道突破与波动率突破：捕捉趋势爆发的瞬间", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>区分价格通道突破与波动率突破。<\/li>\n<li>理解阈值应随风险尺度调整。<\/li>\n<li>设计真实可成交的爆发行情策略。<\/li>\n<\/ul>\n<h2>两种突破<\/h2>\n<p>价格通道突破以过去高低点为边界；波动率突破则以开盘价或参考价加减波动单位，例如 (Trigger=Open+k\\times ATR)。前者关注历史极值，后者关注当日移动是否超出正常范围。<\/p>\n<h2>为什么要标准化<\/h2>\n<p>同样上涨 2%，对低波资产可能异常，对高波资产可能普通。使用 ATR 或滚动波动能让不同资产的阈值更可比。<\/p>\n<h2>执行现实<\/h2>\n<p>跳空可能直接越过触发价，实际成交更差；盘中同时触及上下边界时，日线数据无法确定顺序。应使用更细数据或保守成交假设。<\/p>\n<h2>过滤与退出<\/h2>\n<p>可结合长期趋势方向、流动性和波动收缩状态。退出可用反向通道、移动止损或时间止损。每个条件都要评估增量，而不是堆叠到历史完美。<\/p>\n<h2>组合管理<\/h2>\n<p>突破常在市场压力期同步触发，跨资产相关性会突然变化。必须限制相关组风险和总杠杆。<\/p>\n<h2>两种突破的门槛来自不同记忆<\/h2>\n<p>通道突破记住过去一段时间的极值，只有价格越过历史边界才触发；波动率突破以近期正常波动为尺度，判断今日移动是否异常。前者对孤立旧高点敏感，后者对 ATR 或波动估计敏感。<\/p>\n<p>两种方法都在寻找“从常态进入非常态”，但非常态定义不同。比较时应使用相同执行和风险预算，避免把门槛差异与仓位差异混在一起。<\/p>\n<h2>跳空如何改变一笔突破交易<\/h2>\n<p>假设触发价为 105，次日直接以 110 开盘。回测若仍按 105 成交，凭空获得了 5 元优势；按 110 追入又可能面对开盘后回落。策略必须预先决定：接受跳空成交、设置最大滑点后放弃，还是等待回踩确认。<\/p>\n<p>这些规则没有通用最优答案，但必须在看结果前固定，并在成本和错失机会之间做权衡。<\/p>\n<h2>波动标准化也会滞后<\/h2>\n<p>ATR 来自过去波动。平静期后突然爆发时，ATR 仍低，门槛可能过近、仓位可能过大；高波动持续一段时间后，ATR 升高又会让策略难以重新入场。可以设置仓位变化上限与压力情景，但不能假设标准化自动消除风险。<\/p>\n<h2>组合中的同步突破<\/h2>\n<p>宏观冲击可能让多个相关市场同时突破。若每个信号独立给满仓，组合会在同一方向集中加杠杆。风险层应按相关组汇总名义敞口、波动贡献和压力损失，必要时在信号之间分配有限风险预算。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“通道突破与波动率突破：捕捉趋势爆发的瞬间”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nber.org/papers/w25551.pdf\">Moskowitz、Ooi 与 Pedersen：Time Series Momentum<\/a>：跨资产时间序列动量的研究入口。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.aqr.com/Insights/Datasets/An-Academic-Quality-Data-Library-for-Practitioners\">AQR Academic Data Library<\/a>：价值、动量、低 Beta 与趋势等论文配套数据。<\/li>\n<li><strong>适用条件与边界<\/strong>：技术指标是价格变换而非独立信息；结论受品种、频率、交易制度、做空约束与成本影响。<\/li>\n<li><strong>主要失败模式<\/strong>：先看结果再挑参数、忽略冲击成本，或把一种市场状态下的规律外推到所有时期。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>通道突破看历史极值，波动率突破看相对正常波动的超越。<\/li>\n<li>波动标准化改善跨资产比较。<\/li>\n<li>跳空、盘内顺序和同步触发是核心实盘交易风险。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>设计一个开盘价加 ATR 的突破策略，并明确跳空超过触发价时的成交规则。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第039讲 配对交易（上）：如何寻找两只“兄弟股”？<\/strong>。<\/p>"}, {"n": 39, "title": "配对交易（上）：如何寻找两只“兄弟股”？", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解配对交易的相对价值逻辑。<\/li>\n<li>掌握候选对筛选的经济与统计条件。<\/li>\n<li>避免仅凭高相关选兄弟股。<\/li>\n<\/ul>\n<h2>配对交易不押市场方向<\/h2>\n<p>配对交易同时持有一多一空，试图从两资产相对价格回归中获利。理想情况下，市场共同涨跌被部分对冲，收益来自价差变化。<\/p>\n<h2>高相关不等于可配对<\/h2>\n<p>相关性描述收益同步，价格仍可能长期分离。候选对更需要稳定经济联系，例如同类业务、同一供应链、双重上市或可替代资产。<\/p>\n<h2>筛选流程<\/h2>\n<ol>\n<li>先按行业、商业模式和交易机制缩小范围。<\/li>\n<li>检查流动性、做空可得性和公司行动。<\/li>\n<li>估计对冲比例，构造价差。<\/li>\n<li>检查价差稳定性、半衰期和结构断点。<\/li>\n<li>保留样本外验证。<\/li>\n<\/ol>\n<h2>交易信号<\/h2>\n<p>对价差做滚动 z-score，极端偏离时建立相对头寸，回到中心时退出。阈值、持有期和止损必须与价差机制匹配。<\/p>\n<h2>主要风险<\/h2>\n<p>并购、财务危机和业务分化会让“兄弟”永久分家；借券费和召回也可能摧毁纸面利润。<\/p>\n<h2>高相关为何可能是一场误会<\/h2>\n<p>两只股票都受市场上涨推动，收益相关性可以很高，但价格比值仍持续漂移；一旦市场因素减弱，它们未必互相回归。相关性回答“短期是否同涨同跌”，配对交易需要回答“相对价格为何受到长期约束”。<\/p>\n<p>候选对最好先有经济联系，再用统计工具判断稳定性。若先从全市场海量组合中挑最高相关或最显著的一对，结果很容易只是多重试验中的幸运样本。<\/p>\n<h2>一张候选对档案<\/h2>\n<p>至少记录：业务与收入来源、共同成本或需求、资本结构、公司行动、流动性、可做空性、借券费用、历史映射变化和潜在结构断点。统计关系应当能够被经济事件解释，而不是只有一张价格图。<\/p>\n<p>例如两家公司原本业务相似，后来一方完成重大并购，历史价差均值就可能失去意义。模型需要事件监控，而不是等待 z-score无限扩大。<\/p>\n<h2>相对中性不等于风险中性<\/h2>\n<p>一多一空可以降低部分市场方向暴露，却仍可能承担行业、规模、波动率和个股事件风险。若对冲比例估计错误，组合还会残留市场 Beta。报告应分解多头、空头和净暴露，而不是因为净市值接近零就称无风险。<\/p>\n<h2>可交易性先于统计显著<\/h2>\n<p>价差回归速度再快，如果空头无法借到、借券费过高、两边流动性差异大或成交不同步，纸面收益也无法兑现。筛选流程应先剔除无法稳定执行的候选，再做复杂统计检验。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“配对交易（上）：如何寻找两只“兄弟股”？”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nber.org/papers/w7032\">Gatev、Goetzmann 与 Rouwenhorst：Pairs Trading<\/a>：配对交易规则、历史样本与微观结构解释。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nist.gov/programs-projects/nistsematech-engineering-statistics-handbook\">NIST/SEMATECH 统计方法手册<\/a>：统计方法、假设与诊断的官方参考。<\/li>\n<li><strong>适用条件与边界<\/strong>：技术指标是价格变换而非独立信息；结论受品种、频率、交易制度、做空约束与成本影响。<\/li>\n<li><strong>主要失败模式<\/strong>：先看结果再挑参数、忽略冲击成本，或把一种市场状态下的规律外推到所有时期。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>配对交易赚取相对价差回归，而非单边方向。<\/li>\n<li>经济联系和稳定价差比高相关更重要。<\/li>\n<li>做空成本、结构断点和公司事件必须进入设计。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>选择同一行业两只股票，先写经济联系，再比较收益相关和价格价差，解释是否适合配对。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第040讲 配对交易（下）：协整关系与对冲比例计算<\/strong>。<\/p>"}, {"n": 40, "title": "配对交易（下）：协整关系与对冲比例计算", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解协整与相关性的区别。<\/li>\n<li>估计对冲比例并构造价差。<\/li>\n<li>识别协整检验的数据挖掘风险。<\/li>\n<\/ul>\n<h2>协整解决什么问题<\/h2>\n<p>两个价格序列可以各自非平稳，但某个线性组合 (s_t=y_t-\\beta x_t) 相对平稳，称存在协整关系。它表达长期约束，而不是短期同步。<\/p>\n<h2>两步法直觉<\/h2>\n<p>先用历史数据估计 (y=\\alpha+\\beta x+\\varepsilon)，再检验残差 (\\varepsilon) 是否平稳。(\\beta) 是统计对冲比例，不一定等于金额一比一。<\/p>\n<h2>半衰期<\/h2>\n<p>若价差近似均值回归，可估计偏离衰减速度，用于选择持有窗口。但半衰期是样本估计，结构变化后会失真。<\/p>\n<h2>滚动实现<\/h2>\n<p>对冲比例和均值必须在滚动窗口中估计，不能用全样本参数交易过去。交易前还应对权重变化设置缓冲，避免频繁再对冲。<\/p>\n<h2>多重检验<\/h2>\n<p>从数千组合中挑通过检验的一对，会产生严重数据挖掘。先用经济逻辑缩小候选，再进行样本外、断点和成本检验。<\/p>\n<p>协整是建模工具，不是两家公司永远绑定的契约。<\/p>\n<h2>对冲比例不是“一边买一万元”<\/h2>\n<p>若模型估计 (y_t=\\alpha+1.5x_t+\\varepsilon_t)，构造价差时需要按估计比例组合两项资产，而不是简单金额一比一。实际下单还要把价格、合约乘数、最小交易单位和 Beta 暴露转换成可执行数量。<\/p>\n<p>统计对冲比例最小化的是特定样本中的残差，并不保证组合货币中性、Beta 中性或风险中性。报告应明确想中和哪一种暴露。<\/p>\n<h2>一笔 z-score 交易的完整生命周期<\/h2>\n<p>滚动窗口用历史数据估计 (\beta)、价差均值和标准差；偏离达到进场阈值后，在下一可交易时点同时提交两边订单；价差回到退出区间时平仓；若超过最大持有期、关系检验失败或单边无法成交，则按预案降险。<\/p>\n<p>两边成交不同步会产生临时裸露风险。回测若假设两笔永远同时按收盘价完成，会低估执行风险。<\/p>\n<h2>半衰期不是倒计时器<\/h2>\n<p>半衰期来自样本中的平均衰减速度，只能帮助选择观察和持有尺度。单次偏离可能更快、更慢，甚至永不回归。把半衰期直接当作保证退出日期，会忽略结构断点。<\/p>\n<p>应比较滚动半衰期、均值和波动是否稳定，并设置超过合理时间后的复核或退出规则。<\/p>\n<h2>多重检验如何制造“黄金配对”<\/h2>\n<p>若从数千对中选择检验最显著的一对，即使所有资产没有稳定关系，也可能出现漂亮结果。候选数量、检验窗口和筛选规则都属于试验空间，必须记录。<\/p>\n<p>先用经济逻辑缩小范围，再划分形成期与交易期、滚动到多个样本外窗口，并报告失败配对。真正稳健的策略不应只展示最后胜出的那一对。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“配对交易（下）：协整关系与对冲比例计算”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nber.org/papers/w7032\">Gatev、Goetzmann 与 Rouwenhorst：Pairs Trading<\/a>：配对交易规则、历史样本与微观结构解释。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nist.gov/programs-projects/nistsematech-engineering-statistics-handbook\">NIST/SEMATECH 统计方法手册<\/a>：统计方法、假设与诊断的官方参考。<\/li>\n<li><strong>适用条件与边界<\/strong>：技术指标是价格变换而非独立信息；结论受品种、频率、交易制度、做空约束与成本影响。<\/li>\n<li><strong>主要失败模式<\/strong>：先看结果再挑参数、忽略冲击成本，或把一种市场状态下的规律外推到所有时期。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>协整描述非平稳价格间的稳定线性组合。<\/li>\n<li>对冲比例必须滚动、仅用当时数据估计。<\/li>\n<li>批量筛选需要控制多重检验与结构断点。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>用滚动窗口估计一对价格的对冲系数 (\\beta)，构造残差并观察参数和均值是否随时间稳定。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第041讲 统计套利：不预测涨跌方向，只收割价差回归<\/strong>。<\/p>"}, {"n": 41, "title": "统计套利：不预测涨跌方向，只收割价差回归", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解统计套利是组合化的相对价值框架。<\/li>\n<li>掌握信号、对冲和组合约束三层。<\/li>\n<li>识别小优势被成本吞噬的风险。<\/li>\n<\/ul>\n<h2>不预测指数也能交易<\/h2>\n<p>统计套利试图从大量资产的相对定价偏离中获取小而重复的收益。它常构造市场、行业或因子中性组合，让整体方向风险下降，把注意力放在残差回归。<\/p>\n<h2>基本流程<\/h2>\n<p>先用风险模型解释每只资产的共同暴露，再对残差构造短期反转、事件或横截面信号。优化器在多空、行业、因子、单票和换手率约束下分配权重，执行层再处理借券与市场冲击。<\/p>\n<h2>收益来源<\/h2>\n<p>可能来自流动性提供、投资者反应过度、指数与基金交易造成的暂时压力，也可能只是未识别的风险补偿。若无法说明谁在另一侧以及优势为何不被套利掉，统计显著性并不够。<\/p>\n<h2>三个现实瓶颈<\/h2>\n<ul>\n<li>单个信号很弱，需要组合大量独立机会。<\/li>\n<li>换手率和市场冲击容易吞掉毛收益。<\/li>\n<li>历史中性不代表危机中中性，因子暴露会漂移。<\/li>\n<\/ul>\n<h2>评估<\/h2>\n<p>除夏普比率外，应看容量、换手率、持仓集中、残差半衰期、因子暴露和拥挤情景。统计套利的专业性主要体现在风险与执行，不在复杂名称。<\/p>\n<h2>从单一信号到组合收益<\/h2>\n<p>统计套利通常不依赖某一笔交易大赚，而是让许多弱信号在组合中重复出现。若单个机会的毛优势很小，分散可以降低个体噪声，但交易成本、借券费和模型误差也会被重复很多次。组合化不会自动创造优势，只会放大流程的优点与缺陷。<\/p>\n<p>研究报告应从“预测准确率”继续走到“目标权重—实际成交—成本后收益”，并显示收益是否由少数个股、某一行业或某段市场状态贡献。<\/p>\n<h2>中性需要不断维护<\/h2>\n<p>建立组合时市场 Beta 接近零，不代表持有期间一直为零。价格变化、模型系数漂移、部分成交和公司事件都会让暴露偏离。中性组合需要定期重估与再平衡，而再平衡又产生换手和冲击。<\/p>\n<p>所以要同时报告目标暴露与实际暴露，并为市场、行业、风格、单票和流动性设置容忍区间。超出区间时，是立即交易还是等待缓冲，也属于策略定义。<\/p>\n<h2>毛 Alpha 如何被逐层吃掉<\/h2>\n<p>可以把净收益拆成：预测收益、风险对冲损益、显性费用、买卖价差、市场冲击、借券成本和未成交偏差。若研究只在收盘价上计算理想权重，最容易漏掉的恰恰是决定统计套利能否生存的部分。<\/p>\n<p>容量测试应逐步扩大模拟订单，观察冲击和可借数量如何变化，而不是把固定费率无限外推。<\/p>\n<h2>拥挤退出是最坏情景之一<\/h2>\n<p>多个参与者使用相似残差信号时，平时价差可能迅速回归；压力来临时，大家同时减仓，原本中性的组合会因流动性差异和相关性跳变集中亏损。压力测试应模拟因子暴露失效、借券召回和多头空头不同步退出。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“统计套利：不预测涨跌方向，只收割价差回归”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nber.org/papers/w7032\">Gatev、Goetzmann 与 Rouwenhorst：Pairs Trading<\/a>：配对交易规则、历史样本与微观结构解释。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nist.gov/programs-projects/nistsematech-engineering-statistics-handbook\">NIST/SEMATECH 统计方法手册<\/a>：统计方法、假设与诊断的官方参考。<\/li>\n<li><strong>适用条件与边界<\/strong>：技术指标是价格变换而非独立信息；结论受品种、频率、交易制度、做空约束与成本影响。<\/li>\n<li><strong>主要失败模式<\/strong>：先看结果再挑参数、忽略冲击成本，或把一种市场状态下的规律外推到所有时期。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>至少完成一个市场状态或品种外推测试<\/li>\n<\/ul>\n<h2>本讲小结<\/h2>\n<ul>\n<li>统计套利用相对价值和组合对冲降低方向暴露。<\/li>\n<li>弱信号必须通过分散、成本控制和稳定执行兑现。<\/li>\n<li>中性是持续管理的结果，不是一次回归的标签。<\/li>\n<\/ul>\n<h2>课后练习<\/h2>\n<p>为一个横截面短期反转组合列出市场、行业、单票、换手率和借券五类约束。<\/p>\n<h2>下讲预告<\/h2>\n<p>下一讲：<strong>第042讲 网格交易：震荡市收割机，单边市的绞肉机<\/strong>。<\/p>"}, {"n": 42, "title": "网格交易：震荡市收割机，单边市的绞肉机", "html": "<blockquote>\n<p>风险提示：本文仅用于量化投资知识教育，不构成任何投资建议。策略示例须计入成本并经过独立验证。<\/p>\n<\/blockquote>\n<h2>本讲目标<\/h2>\n<ul>\n<li>理解固定网格的收益机制。<\/li>\n<li>识别单边行情和成本累积。<\/li>\n<li>判断哪些资产和环境不适合网格。<\/li>\n<\/ul>\n<h2>网格在赚什么<\/h2>\n<p>固定网格围绕参考价格设置多档买卖线，价格下跌分批买、上涨分批卖。它不要求预测方向，而是把震荡转化为多次低买高卖。<\/p>\n<h2>账面利润与真实风险<\/h2>\n<p>每个已完成格子可能盈利，但未平仓库存会随单边下跌不断累积。只统计已实现网格利润、忽略浮亏，会制造“每天赚钱”的错觉。<\/p>\n<h2>参数结构<\/h2>\n<p>中心价、上下边界、格距、每格仓位和总库存上限共同决定风险。格距太窄，成本占比高；太宽，成交机会少。算术格适合固定价格差，几何格按比例变化更适合宽区间。<\/p>\n<h2>单边市为什么危险<\/h2>\n<p>持续上涨会过早卖空仓位，持续下跌会不断接货。若资产存在永久贬值或杠杆强平，均值回归假设可能彻底失败。<\/p>\n<h2>必备风控<\/h2>\n<p>设置总资金上限、价格边界、停止加仓条件、趋势退出与异常熔断；回测必须逐笔计入交易成本并按总权益评价。<\/p>\n<h2>每格盈利不等于组合盈利<\/h2>\n<p>假设网格每下跌一档买入一单位、每上涨一档卖出。价格在区间内来回时，已完成的格子不断产生小额利润；若价格连续下跌，已实现利润仍可能为正，但库存浮亏会更快扩大。评价必须使用现金加持仓市值形成的总权益，而不是只看“完成了多少格”。<\/p>\n<p>这也是网格最容易产生的心理错觉：小利润频繁可见，大风险被留在尚未卖出的库存里。<\/p>\n<h2>格距首先要覆盖摩擦<\/h2>\n<p>一格的价格差必须高于双边手续费、价差、滑点和潜在冲击，否则越活跃越亏。格距缩小会增加成交次数，却不一定增加净收益；格距扩大减少摩擦占比，也会降低捕捉震荡的频率。<\/p>\n<p>应把单格毛利、单位成本和实际成交概率放在同一张表中，并观察不同波动状态下的变化。<\/p>\n<h2>资金是有限的，网格不能无限向下<\/h2>\n<p>每格买入数量相同也会让库存随下跌累积。设计时要先从最坏边界反推最大库存、资金占用和可承受亏损，再决定格数与单格仓位。若下边界之外没有明确动作，策略就隐含了“价格最终一定回来”的无限资金假设。<\/p>\n<h2>用三条路径压力测试<\/h2>\n<p>至少测试持续单边下跌、持续单边上涨和高波动跳空。下跌路径检查库存与强平，上涨路径检查过早卖空与踏空，跳空路径检查订单跨越多格时如何成交。路径压力比在单一震荡历史上优化格距更能揭示风险。<\/p>\n<h2>策略定义卡：从想法到可回测规则<\/h2>\n<p>把“网格交易：震荡市收割机，单边市的绞肉机”写成一张策略定义卡。策略的价值不在于指标名称，而在于信号、持仓、执行和退出规则能否被另一位研究者无歧义复现。<\/p>\n<ol>\n<li>写出交易范围、数据频率、信号公式、参数和信号生成时点。<\/li>\n<li>规定目标仓位、开平仓条件、再平衡频率和冲突信号处理。<\/li>\n<li>建立含手续费、滑点、市场冲击和成交限制的执行假设。<\/li>\n<li>预先列出趋势、震荡、跳空和流动性枯竭等失效场景，再做样本外检验。<\/li>\n<\/ol>\n<h2>参考资料<\/h2>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nber.org/papers/w25551.pdf\">Moskowitz、Ooi 与 Pedersen：Time Series Momentum<\/a>：跨资产时间序列动量的研究入口。<\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.nber.org/papers/w7032\">Gatev、Goetzmann 与 Rouwenhorst：Pairs Trading<\/a>：配对交易规则、历史样本与微观结构解释。<\/li>\n<li><strong>适用条件与边界<\/strong>：技术指标是价格变换而非独立信息；结论受品种、频率、交易制度、做空约束与成本影响。<\/li>\n<li><strong>主要失败模式<\/strong>：先看结果再挑参数、忽略冲击成本，或把一种市场状态下的规律外推到所有时期。<\/li>\n<\/ul>\n<h2>常见误区与修正<\/h2>\n<ul>\n<li>用同一根K线的收盘价生成信号并按该收盘价成交；应把信号至少滞后一周期。<\/li>\n<li>只展示毛收益曲线；高换手策略必须报告成本后收益和容量。<\/li>\n<li>看到最优参数就认定规律稳定；应检查参数平台而不是单个尖峰。<\/li>\n<\/ul>\n<h2>实战验收清单<\/h2>\n<ul>\n<li class=\"task\"><span class=\"tick\"><\/span>第三方可仅凭文档复现信号与仓位<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>信号、成交和收益归属的时点一致<\/li>\n<li class=\"task\"><span class=\"tick\"><\/span>交易成本、成交限制和容量已进入评估<\/li>\n<li class=\"task\"><span class=\"tick\"><\
